name: Examples

on:
  schedule:
    - cron: '0 21 * * *'  # Daily example coverage, UTC 21:00 (KST 06:00)
  push:
    branches: [ develop, main ]
    paths:
      - '12-production-integration/**'
      - 'buildSrc/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/examples.yml'
  pull_request:
    branches: [ develop, main ]
    paths:
      - '12-production-integration/**'
      - 'buildSrc/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/examples.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  validate-wrapper:
    name: Validate Gradle Wrapper
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6

  build-examples:
    name: Build / Chapter 12 Examples
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: validate-wrapper
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Build and test chapter 12 examples
        run: |
          ./gradlew \
            :01-ktor-application-architecture:build \
            :02-spring-application-architecture:build \
            :03-spring-http-outbox-idempotency:build \
            :04-ktor-http-outbox-idempotency:build \
            --no-daemon --continue
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"

  examples-status:
    name: Examples Status
    runs-on: ubuntu-latest
    needs:
      - validate-wrapper
      - build-examples
    if: always()
    steps:
      - name: Check Examples result
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] || \
             [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            exit 1
          fi
          echo "Examples workflow passed"
