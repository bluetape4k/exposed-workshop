name: Examples

on:
  schedule:
    - cron: '0 21 * * 0'  # Weekly example coverage, Sunday UTC 21:00 (Monday KST 06:00)
  push:
    branches: [ develop, main ]
    paths:
      - '10-multi-tenant/04-schema-per-tenant-spring-web/**'
      - '10-multi-tenant/05-database-per-tenant-spring-web/**'
      - '10-multi-tenant/06-spring-security-tenant-authorization-spring-web/**'
      - '11-high-performance/03-routing-datasource/**'
      - '12-production-integration/**'
      - '13-ecosystem-integrations/**'
      - 'buildSrc/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/examples.yml'
  pull_request:
    branches: [ develop, main ]
    paths:
      - '10-multi-tenant/04-schema-per-tenant-spring-web/**'
      - '10-multi-tenant/05-database-per-tenant-spring-web/**'
      - '10-multi-tenant/06-spring-security-tenant-authorization-spring-web/**'
      - '11-high-performance/03-routing-datasource/**'
      - '12-production-integration/**'
      - '13-ecosystem-integrations/**'
      - 'buildSrc/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/examples.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  validate-wrapper:
    name: Validate Gradle Wrapper
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6

  build-examples:
    name: Build / Examples (selected modules)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: validate-wrapper
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Build and test selected examples
        run: |
          # Weekly downstream gate:
          # - multi-tenant Spring examples
          # - routing datasource example
          # - production-integration Spring/Ktor examples
          # Chapter 13 ecosystem integrations are added as child modules become runnable.
          #
          # Keep Testcontainers-backed modules in one Gradle invocation so shared
          # test infrastructure can serialize container usage.
          # Routing DataSource uses GraalVM AOT tasks; disable configuration cache for this mixed example build.
          ./gradlew \
            :03-routing-datasource:build \
            :04-schema-per-tenant-spring-web:build \
            :05-database-per-tenant-spring-web:build \
            :06-spring-security-tenant-authorization-spring-web:build \
            :01-ktor-application-architecture:build \
            :02-spring-application-architecture:build \
            :03-spring-http-outbox-idempotency:build \
            :04-ktor-http-outbox-idempotency:build \
            :05-spring-auth-session:build \
            :06-ktor-auth-session:build \
            :07-spring-outbox-realtime:build \
            :08-ktor-outbox-realtime:build \
            :09-spring-observability-readiness:build \
            :10-ktor-observability-readiness:build \
            :01-bigquery-dry-run:build \
            :02-trino-session-options:build \
            :03-cockroachdb-retry:build \
            :04-starrocks-olap-local:build \
            :05-ktor-exposed-integration:build \
            :06-spring-modulith-publications:build \
            :07-ddd-aggregate-repository:build \
            :08-ddd-modulith-boundaries:build \
            --no-daemon --no-configuration-cache --continue
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"

      - name: Upload failed example reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: exposed-workshop-example-reports
          if-no-files-found: ignore
          retention-days: 7
          path: |
            **/build/reports/tests/**
            **/build/test-results/test/**
            **/build/reports/problems/**

  examples-status:
    name: Examples Status
    runs-on: ubuntu-latest
    needs:
      - validate-wrapper
      - build-examples
    if: always()
    steps:
      - name: Check Examples result
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] || \
             [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            exit 1
          fi
          echo "Examples workflow passed"
