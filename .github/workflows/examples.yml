name: Examples

on:
  schedule:
    - cron: '0 21 * * 0'  # Weekly example coverage, Sunday UTC 21:00 (Monday KST 06:00)
  push:
    branches: [ develop, main ]
    paths:
      - '10-multi-tenant/04-schema-per-tenant-spring-web/**'
      - '10-multi-tenant/05-database-per-tenant-spring-web/**'
      - '10-multi-tenant/06-spring-security-tenant-authorization-spring-web/**'
      - '11-high-performance/03-routing-datasource/**'
      - '11-high-performance/08-cache-strategies-lettuce/**'
      - '12-production-integration/**'
      - '13-ecosystem-integrations/**'
      - 'buildSrc/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/scripts/select-changed-examples.sh'
      - '.github/workflows/examples.yml'
  pull_request:
    branches: [ develop, main ]
    paths:
      - '10-multi-tenant/04-schema-per-tenant-spring-web/**'
      - '10-multi-tenant/05-database-per-tenant-spring-web/**'
      - '10-multi-tenant/06-spring-security-tenant-authorization-spring-web/**'
      - '11-high-performance/03-routing-datasource/**'
      - '11-high-performance/08-cache-strategies-lettuce/**'
      - '12-production-integration/**'
      - '13-ecosystem-integrations/**'
      - 'buildSrc/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/scripts/select-changed-examples.sh'
      - '.github/workflows/examples.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: '25'
  JAVA_DISTRIBUTION: 'temurin'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  changes:
    name: Detect Changed Examples
    runs-on: ubuntu-latest
    outputs:
      all: ${{ steps.select.outputs.all }}
      module_tasks: ${{ steps.select.outputs.module_tasks }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select changed example modules
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "schedule" || "$EVENT_NAME" == "workflow_dispatch" ]]; then
            FORCE_ALL=true .github/scripts/select-changed-examples.sh '' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            range="$BASE_SHA...$HEAD_SHA"
          elif [[ -n "$BEFORE_SHA" && ! "$BEFORE_SHA" =~ ^0+$ ]]; then
            range="$BEFORE_SHA...$HEAD_SHA"
          else
            range="$HEAD_SHA^...$HEAD_SHA"
          fi

          .github/scripts/select-changed-examples.sh "$range" >> "$GITHUB_OUTPUT"

  validate-wrapper:
    name: Validate Gradle Wrapper
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6

  build-examples:
    name: Build / Examples (selected modules)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - changes
      - validate-wrapper
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Build and test selected examples
        env:
          MODULE_TASKS: ${{ needs.changes.outputs.module_tasks }}
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"
        run: |
          read -r -a module_tasks <<< "$MODULE_TASKS"
          ./gradlew "${module_tasks[@]}" --no-daemon --no-configuration-cache --continue

      - name: Upload failed example reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: exposed-workshop-example-reports
          if-no-files-found: ignore
          retention-days: 7
          path: |
            **/build/reports/tests/**
            **/build/test-results/test/**
            **/build/reports/problems/**

  examples-status:
    name: Examples Status
    runs-on: ubuntu-latest
    needs:
      - changes
      - validate-wrapper
      - build-examples
    if: always()
    steps:
      - name: Check Examples result
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] || \
             [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            exit 1
          fi
          echo "Examples workflow passed"
