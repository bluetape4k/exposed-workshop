name: Nightly

on:
  schedule:
    - cron: '0 19 * * *'  # 매일 UTC 19:00 (KST 04:00)
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  validate-wrapper:
    name: Validate Gradle Wrapper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6

  build:
    name: Build & Detekt
    runs-on: ubuntu-latest
    needs: validate-wrapper
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
      - name: Build (compile only)
        run: ./gradlew assemble --parallel
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
      - name: Detekt static analysis
        run: ./gradlew detekt --parallel
      - name: Upload detekt report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: detekt-report
          path: '**/build/reports/detekt/*.xml'
          retention-days: 14

  test:
    name: Test / ${{ matrix.db-name }} / ${{ matrix.shard-name }}
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - db: H2
            db-name: H2
            slug: h2
            shard-name: full
            needs-docker: false
            collect-coverage: true
            module-tasks: test
          - db: POSTGRESQL
            db-name: PostgreSQL
            slug: postgresql-shard-1
            shard-name: shard-1
            needs-docker: true
            collect-coverage: false
            module-tasks: >-
              :01-convert-jpa-basic:test
              :05-exposed-repository-coroutines:test
              :spring-mvc-exposed:test
              :01-connection:test
              :06-custom-columns:test
              :04-exposed-json:test
              :05-exposed-money:test
              :09-exposed-fastjson2:test
              :01-coroutines-basic:test
          - db: POSTGRESQL
            db-name: PostgreSQL
            slug: postgresql-shard-2
            shard-name: shard-2
            needs-docker: true
            collect-coverage: false
            module-tasks: >-
              :01-dml:test
              :05-entities:test
              :03-spring-transaction:test
              :01-cache-strategies:test
              :01-springboot-autoconfigure:test
              :02-multitenant-spring-web-virtualthread:test
              :03-exposed-kotlin-datetime:test
              :vertx-sqlclient-example:test
              :08-exposed-jackson:test
              :12-exposed-tink:test
          - db: POSTGRESQL
            db-name: PostgreSQL
            slug: postgresql-shard-3
            shard-name: shard-3
            needs-docker: true
            collect-coverage: false
            module-tasks: >-
              :02-convert-jpa-advanced:test
              :02-types:test
              :spring-webflux-exposed:test
              :02-cache-strategies-coroutines:test
              :04-exposed-repository:test
              :04-transactions:test
              :02-ddl:test
              :03-routing-datasource:test
              :hibernate-reactive-example:test
              :01-multitenant-spring-web:test
              :03-functions:test
              :r2dbc-example:test
              :03-multitenant-spring-webflux:test
              :06-spring-cache:test
              :02-exposed-javatime:test
              :exposed-dao-example:test
              :exposed-sql-example:test
              :01-exposed-crypt:test
              :02-virtualthreads-basic:test
              :exposed-shared-tests:test
          - db: MYSQL_V8
            db-name: MySQL 8
            slug: mysql-shard-1
            shard-name: shard-1
            needs-docker: true
            collect-coverage: false
            module-tasks: >-
              :01-convert-jpa-basic:test
              :05-exposed-repository-coroutines:test
              :spring-mvc-exposed:test
              :01-connection:test
              :06-custom-columns:test
              :04-exposed-json:test
              :05-exposed-money:test
              :09-exposed-fastjson2:test
              :01-coroutines-basic:test
          - db: MYSQL_V8
            db-name: MySQL 8
            slug: mysql-shard-2
            shard-name: shard-2
            needs-docker: true
            collect-coverage: false
            module-tasks: >-
              :01-dml:test
              :05-entities:test
              :03-spring-transaction:test
              :01-cache-strategies:test
              :01-springboot-autoconfigure:test
              :02-multitenant-spring-web-virtualthread:test
              :03-exposed-kotlin-datetime:test
              :vertx-sqlclient-example:test
              :08-exposed-jackson:test
              :12-exposed-tink:test
          - db: MYSQL_V8
            db-name: MySQL 8
            slug: mysql-shard-3
            shard-name: shard-3
            needs-docker: true
            collect-coverage: false
            module-tasks: >-
              :02-convert-jpa-advanced:test
              :02-types:test
              :spring-webflux-exposed:test
              :02-cache-strategies-coroutines:test
              :04-exposed-repository:test
              :04-transactions:test
              :02-ddl:test
              :03-routing-datasource:test
              :hibernate-reactive-example:test
              :01-multitenant-spring-web:test
              :03-functions:test
              :r2dbc-example:test
              :03-multitenant-spring-webflux:test
              :06-spring-cache:test
              :02-exposed-javatime:test
              :exposed-dao-example:test
              :exposed-sql-example:test
              :01-exposed-crypt:test
              :02-virtualthreads-basic:test
              :exposed-shared-tests:test
          - db: MARIADB
            db-name: MariaDB
            slug: mariadb-smoke
            shard-name: smoke
            needs-docker: true
            collect-coverage: false
            module-tasks: >-
              :01-convert-jpa-basic:test
              :05-exposed-repository-coroutines:test
              :spring-mvc-exposed:test
              :01-connection:test
              :06-custom-columns:test
              :04-exposed-json:test
              :05-exposed-money:test
              :09-exposed-fastjson2:test
              :01-coroutines-basic:test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: true
      - name: Run tests (${{ matrix.db-name }})
        env:
          USE_DB: ${{ matrix.db }}
          NEEDS_DOCKER: ${{ matrix.needs-docker }}
          COLLECT_COVERAGE: ${{ matrix.collect-coverage }}
          MODULE_TASKS: ${{ matrix.module-tasks }}
          GRADLE_OPTS: ${{ matrix.needs-docker && '-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false' || '-Dorg.gradle.daemon=false' }}
          TESTCONTAINERS_RYUK_DISABLED: "true"
          DOCKER_HOST: "unix:///var/run/docker.sock"
        run: |
          read -r -a module_tasks <<< "$MODULE_TASKS"
          if [ "$COLLECT_COVERAGE" = "true" ]; then
            ./gradlew test koverXmlReport "-PuseDB=$USE_DB" --continue
          elif [ "$NEEDS_DOCKER" = "true" ]; then
            ./gradlew "${module_tasks[@]}" "-PuseDB=$USE_DB" --continue --max-workers=1
          else
            ./gradlew test "-PuseDB=$USE_DB" --continue
          fi
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.slug }}
          path: '**/build/test-results/test/*.xml'
          retention-days: 14
      - name: Upload coverage report
        if: matrix.collect-coverage && always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.slug }}
          path: '**/build/reports/kover/'
          retention-days: 14

  coverage-report:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: [ test ]
    if: always()
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Download coverage artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: coverage-artifacts
          merge-multiple: false
        continue-on-error: true
      - name: Aggregate Kover coverage summary
        if: always()
        run: python3 .github/scripts/aggregate-kover-coverage.py coverage-artifacts
      - name: Upload aggregated coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-all
          path: coverage-artifacts/
          retention-days: 30

  nightly-status:
    name: Nightly Status
    runs-on: ubuntu-latest
    needs:
      - build
      - test
      - coverage-report
    if: always()
    steps:
      - name: Check all jobs
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          echo "Nightly results: $RESULTS"
          if echo "$RESULTS" | grep -qE "failure|cancelled"; then
            echo "Nightly failed"
            exit 1
          fi
          echo "Nightly passed"
