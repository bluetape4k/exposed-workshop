<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 760" width="1180" height="760" role="img" aria-label="R2DBC Post Comment ERD">
<defs>

<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/></filter>
<style>
.canvas{fill:#f6f9fc}.frame{fill:#fff;stroke:#d7e2ec;stroke-width:1.5}
.title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:32px;fill:#1e293b}
.subtitle,.detail{font-family:"Comic Mono","Comic Sans MS","Comic Neue",Arial,sans-serif;fill:#536476}
.subtitle{font-size:13px}.detail{font-size:12px}.tiny{font-family:"Comic Mono","Comic Sans MS","Comic Neue",Arial,sans-serif;font-size:10px;fill:#64748b}
.label{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:17px;fill:#1e293b}
.panelTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:12px;letter-spacing:.08em;fill:#94a3b8}
.card{stroke-width:1.7;filter:url(#shadow)}.panel{fill:#f8fafc;stroke:#d7e2ec;stroke-width:1.2}
.arrow{fill:none;stroke:#64748b;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.softArrow{fill:none;stroke:#94a3b8;stroke-width:1.35;stroke-dasharray:5 5;stroke-linecap:round;stroke-linejoin:round}
.fkArrow{fill:none;stroke:#0f766e;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mapArrow{fill:none;stroke:#16a34a;stroke-width:1.7;stroke-dasharray:5 5;stroke-linecap:round;stroke-linejoin:round}
.sessionUse{fill:none;stroke:#7c3aed;stroke-width:1.7;stroke-dasharray:5 5;stroke-linecap:round;stroke-linejoin:round}
.repoUse{fill:none;stroke:#2563eb;stroke-width:1.7;stroke-dasharray:5 5;stroke-linecap:round;stroke-linejoin:round}
.opsUse{fill:none;stroke:#16a34a;stroke-width:1.7;stroke-dasharray:5 5;stroke-linecap:round;stroke-linejoin:round}
.clientUse{fill:none;stroke:#ea580c;stroke-width:1.7;stroke-dasharray:5 5;stroke-linecap:round;stroke-linejoin:round}
.converterUse{fill:none;stroke:#db2777;stroke-width:1.7;stroke-dasharray:5 5;stroke-linecap:round;stroke-linejoin:round}
.lifeline{fill:none;stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:5 5;stroke-linecap:round;stroke-linejoin:round}
.inherit{fill:none;stroke:#475569;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.inheritHead{fill:#fff;stroke:#475569;stroke-width:1.8;stroke-linejoin:round}
.assoc{fill:none;stroke:#0f766e;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

  .cardinalityBox{fill:#ffffff;stroke:#94a3b8;stroke-width:1;rx:7;opacity:.94}
  .cardinalityLabel{font-family:"Comic Mono", "SFMono-Regular", monospace;font-size:14px;font-weight:700;fill:#334155}
.erdRelation{fill:none;stroke:#64748b;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:7 6}
</style>
</defs>
<rect width="1180" height="760" class="canvas"/>
<rect x="20" y="20" width="1140" height="720" rx="16" class="frame"/>
<text x="48" y="58" class="title">R2DBC Post Comment ERD</text>
<text x="48" y="80" class="subtitle">comments.post_id is the only foreign key; customer is an independent repository example</text>
<rect x="76" y="122" width="480" height="250" rx="12" class="panel"/><text x="316" y="114" class="panelTitle" text-anchor="middle">PARENT TABLE</text>
<rect x="140" y="160" width="350" height="146" rx="12" fill="#fff" stroke="#3b82f6" class="card"/>
<path d="M140,200 L140,172 Q140,160 152,160 L478,160 Q490,160 490,172 L490,200 Z" fill="#dbeafe"/>
<text x="315" y="187" class="label" text-anchor="middle">posts</text>
<text x="158" y="226" class="tiny">id SERIAL PK</text>
<text x="158" y="243" class="tiny">title VARCHAR(255)</text>
<text x="158" y="260" class="tiny">content VARCHAR(255)</text>
<rect x="624" y="312" width="480" height="250" rx="12" class="panel"/><text x="864" y="304" class="panelTitle" text-anchor="middle">CHILD TABLE</text>
<rect x="690" y="350" width="350" height="146" rx="12" fill="#fff" stroke="#d97706" class="card"/>
<path d="M690,390 L690,362 Q690,350 702,350 L1028,350 Q1040,350 1040,362 L1040,390 Z" fill="#fef3c7"/>
<text x="865" y="377" class="label" text-anchor="middle">comments</text>
<text x="708" y="416" class="tiny">id SERIAL PK</text>
<text x="708" y="433" class="tiny">content VARCHAR(255)</text>
<text x="708" y="450" class="tiny">post_id BIGINT FK</text>
<path d="M690,424 L604,424 Q596,424 596,416 L596,254 Q596,246 588,246 L490,246" class="fkArrow erdRelation"/>
<rect x="534" y="406" width="126" height="24" rx="8" fill="#fff" stroke="#99f6e4"/>
<text x="597" y="423" class="tiny" text-anchor="middle">fk_post_id</text>
<text x="502" y="238" class="tiny">1</text>
<text x="674" y="416" class="tiny">N</text>
<rect x="126" y="460" width="350" height="160" rx="12" class="panel"/><text x="301" y="452" class="panelTitle" text-anchor="middle">INDEPENDENT TABLE</text>
<rect x="164" y="500" width="276" height="106" rx="12" fill="#fff" stroke="#7c3aed" class="card"/>
<path d="M164,540 L164,512 Q164,500 176,500 L428,500 Q440,500 440,512 L440,540 Z" fill="#ede9fe"/>
<text x="302" y="527" class="label" text-anchor="middle">customer</text>
<text x="182" y="566" class="tiny">id SERIAL PK</text>
<text x="182" y="583" class="tiny">firstname VARCHAR(255)</text>
<text x="182" y="600" class="tiny">lastname VARCHAR(255)</text>
<rect x="584" y="604" width="430" height="70" rx="12" class="panel"/><text x="799" y="596" class="panelTitle" text-anchor="middle">SCHEMA SOURCE</text>
<rect x="614" y="622" width="370" height="36" rx="10" fill="#ccfbf1" stroke="#0f766e" class="card"/>
<text x="799" y="636" class="label" text-anchor="middle">schema-postgres.sql declares</text>
<text x="799" y="654" class="label" text-anchor="middle">comments.post_id -&gt; posts.id</text>
<rect x="132" y="694" width="910" height="48" rx="10" fill="#ecfdf5" stroke="#86efac" stroke-width="1.3"/>
<text x="587" y="724" class="detail" text-anchor="middle">The H2 schema mirrors posts/comments tables for tests; the PostgreSQL schema explicitly declares the foreign key.</text>

<g class="cardinality" data-cardinality="1 : N"><rect class="cardinalityBox" x="559.0" y="297.0" width="74" height="22"/><text class="cardinalityLabel" x="596.0" y="313.0" text-anchor="middle">1 : N</text></g>
</svg>
