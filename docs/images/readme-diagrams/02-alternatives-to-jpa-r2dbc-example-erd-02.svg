<marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" viewBox="0 0 10 10" refX="9" refY="5" orient="auto" data-role="secondary" data-tip-direction="positive-x"><path stroke-dasharray="none" style="stroke-dasharray:none!important" d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b" stroke="#64748b" stroke-width="0"/></marker>
<marker id="arrowBlue" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" viewBox="0 0 10 10" refX="9" refY="5" orient="auto" data-role="secondary" data-tip-direction="positive-x"><path stroke-dasharray="none" style="stroke-dasharray:none!important" d="M 0 0 L 10 5 L 0 10 Z" fill="#2563eb" stroke="#2563eb" stroke-width="0"/></marker>
<marker id="arrowGreen" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" viewBox="0 0 10 10" refX="9" refY="5" orient="auto" data-role="secondary" data-tip-direction="positive-x"><path stroke-dasharray="none" style="stroke-dasharray:none!important" d="M 0 0 L 10 5 L 0 10 Z" fill="#16a34a" stroke="#16a34a" stroke-width="0"/></marker>
<marker id="arrowOrange" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" viewBox="0 0 10 10" refX="9" refY="5" orient="auto" data-role="secondary" data-tip-direction="positive-x"><path stroke-dasharray="none" style="stroke-dasharray:none!important" d="M 0 0 L 10 5 L 0 10 Z" fill="#ea580c" stroke="#ea580c" stroke-width="0"/></marker>
<marker id="arrowPink" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" viewBox="0 0 10 10" refX="9" refY="5" orient="auto" data-role="secondary" data-tip-direction="positive-x"><path stroke-dasharray="none" style="stroke-dasharray:none!important" d="M 0 0 L 10 5 L 0 10 Z" fill="#db2777" stroke="#db2777" stroke-width="0"/></marker>
<marker id="arrowPurple" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" viewBox="0 0 10 10" refX="9" refY="5" orient="auto" data-role="secondary" data-tip-direction="positive-x"><path stroke-dasharray="none" style="stroke-dasharray:none!important" d="M 0 0 L 10 5 L 0 10 Z" fill="#7c3aed" stroke="#7c3aed" stroke-width="0"/></marker>
<marker id="arrowTeal" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" viewBox="0 0 10 10" refX="9" refY="5" orient="auto" data-role="secondary" data-tip-direction="positive-x"><path stroke-dasharray="none" style="stroke-dasharray:none!important" d="M 0 0 L 10 5 L 0 10 Z" fill="#0f766e" stroke="#0f766e" stroke-width="0"/></marker>
<style>
.canvas{fill:#f6f9fc}.frame{fill:#fff;stroke:#d7e2ec;stroke-width:1.5}
.title{font-family:"Architects Daughter";font-size:32px;fill:#1e293b}
.subtitle,.detail{font-family:"Comic Mono";fill:#536476}
.subtitle{font-size:13px}.detail{font-size:12px}.tiny{font-family:"Comic Mono";font-size:10px;fill:#64748b}
.label{font-family:"Architects Daughter";font-size:17px;fill:#1e293b}
.panelTitle{font-family:"Architects Daughter";font-size:12px;letter-spacing:.08em;fill:#94a3b8}
.card{stroke-width:1.7;filter:url(#shadow)}.panel{fill:#f8fafc;stroke:#d7e2ec;stroke-width:1.2}
.arrow{fill:none;stroke:#64748b;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
.softArrow{fill:none;stroke:#94a3b8;stroke-width:1.35;stroke-dasharray:5 5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
.fkArrow{fill:none;stroke:#0f766e;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowTeal)}
.mapArrow{fill:none;stroke:#16a34a;stroke-width:1.7;stroke-dasharray:5 5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowGreen)}
.sessionUse{fill:none;stroke:#7c3aed;stroke-width:1.7;stroke-dasharray:5 5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowPurple)}
.repoUse{fill:none;stroke:#2563eb;stroke-width:1.7;stroke-dasharray:5 5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowBlue)}
.opsUse{fill:none;stroke:#16a34a;stroke-width:1.7;stroke-dasharray:5 5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowGreen)}
.clientUse{fill:none;stroke:#ea580c;stroke-width:1.7;stroke-dasharray:5 5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowOrange)}
.converterUse{fill:none;stroke:#db2777;stroke-width:1.7;stroke-dasharray:5 5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowPink)}
.lifeline{fill:none;stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:5 5;stroke-linecap:round;stroke-linejoin:round}
.inherit{fill:none;stroke:#475569;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.inheritHead{fill:#fff;stroke:#475569;stroke-width:1.4;stroke-dasharray:none;style:stroke-dasharray:none!important;stroke-linejoin:round}
.assoc{fill:none;stroke:#0f766e;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
</style>
</defs>
<rect width="1180" height="700" class="canvas"/>
<rect x="20" y="20" width="1140" height="660" rx="16" class="frame"/>
<text x="48" y="58" class="title">R2DBC Post Comment ERD</text>
<text x="48" y="80" class="subtitle">comments.post_id is the only foreign key; customer is an independent repository example</text>
<rect x="76" y="122" width="480" height="250" rx="12" class="panel"/><text x="316" y="114" class="panelTitle" text-anchor="middle">PARENT TABLE</text>
<rect x="140" y="160" width="350" height="146" rx="12" fill="#fff" stroke="#3b82f6" class="card"/>
<path d="M140,200 L140,172 Q140,160 152,160 L478,160 Q490,160 490,172 L490,200 Z" fill="#dbeafe"/>
<text x="315" y="187" class="label" text-anchor="middle">posts</text>
<text x="158" y="226" class="tiny">id SERIAL PK</text>
<text x="158" y="243" class="tiny">title VARCHAR(255)</text>
<text x="158" y="260" class="tiny">content VARCHAR(255)</text>
<rect x="624" y="122" width="480" height="250" rx="12" class="panel"/><text x="864" y="114" class="panelTitle" text-anchor="middle">CHILD TABLE</text>
<rect x="690" y="160" width="350" height="146" rx="12" fill="#fff" stroke="#d97706" class="card"/>
<path d="M690,200 L690,172 Q690,160 702,160 L1028,160 Q1040,160 1040,172 L1040,200 Z" fill="#fef3c7"/>
<text x="865" y="187" class="label" text-anchor="middle">comments</text>
<text x="708" y="226" class="tiny">id SERIAL PK</text>
<text x="708" y="243" class="tiny">content VARCHAR(255)</text>
<text x="708" y="260" class="tiny">post_id BIGINT FK</text>
<path d="M690,246 L490,246" class="fkArrow edge"/>
<text x="590" y="230" class="tiny" text-anchor="middle">fk_post_id</text>
<text x="508" y="236" class="tiny">1</text>
<text x="674" y="236" class="tiny">N</text>
<rect x="126" y="432" width="350" height="160" rx="12" class="panel"/><text x="301" y="424" class="panelTitle" text-anchor="middle">INDEPENDENT TABLE</text>
<rect x="164" y="472" width="276" height="106" rx="12" fill="#fff" stroke="#7c3aed" class="card"/>
<path d="M164,512 L164,484 Q164,472 176,472 L428,472 Q440,472 440,484 L440,512 Z" fill="#ede9fe"/>
<text x="302" y="499" class="label" text-anchor="middle">customer</text>
<text x="182" y="538" class="tiny">id SERIAL PK</text>
<text x="182" y="555" class="tiny">firstname VARCHAR(255)</text>
<text x="182" y="572" class="tiny">lastname VARCHAR(255)</text>
<rect x="584" y="432" width="430" height="70" rx="12" class="panel"/><text x="799" y="424" class="panelTitle" text-anchor="middle">SCHEMA SOURCE</text>
<rect x="614" y="450" width="370" height="36" rx="10" fill="#ccfbf1" stroke="#0f766e" class="card"/>
<text x="799" y="464" class="label" text-anchor="middle">schema-postgres.sql declares</text>
<text x="799" y="482" class="label" text-anchor="middle">comments.post_id -&gt; posts.id</text>
<rect x="132" y="622" width="910" height="48" rx="10" fill="#ecfdf5" stroke="#86efac" stroke-width="1.3"/>
<text x="587" y="652" class="detail" text-anchor="middle">The H2 schema mirrors posts/comments tables for tests; the PostgreSQL schema explicitly declares the foreign key.</text>
</svg>
