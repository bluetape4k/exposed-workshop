<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 720" width="1180" height="720" role="img" aria-label="Virtual thread tester tables ERD">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
    <style>
      .canvas{fill:#f6f9fc}
      .frame{fill:#fff;stroke:#d7e2ec;stroke-width:1.5}
      .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:31px;fill:#1e293b}
      .subtitle,.detail{font-family:"Comic Mono","Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;fill:#536476}
      .subtitle{font-size:13px}.detail{font-size:12px}
      .panel{fill:#f8fafc;stroke:#d7e2ec;stroke-width:1.2}
      .panelTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:12px;letter-spacing:.08em;fill:#94a3b8}
      .tableBox{stroke-width:1.7;filter:url(#shadow)}
      .tableName{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:18px;fill:#1e293b}
      .label{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:16px;fill:#1e293b}
      .footer{fill:#f8fafc;stroke:#d7e2ec;stroke-width:1.2}
    </style>
  </defs>

  <rect width="1180" height="720" class="canvas"/>
  <rect x="20" y="20" width="1140" height="680" rx="16" class="frame"/>
  <text x="48" y="58" class="title">Virtual Thread Tester Tables ERD</text>
  <text x="48" y="80" class="subtitle">Ex01_VirtualThreads defines independent VTester and VTesterUnique fixtures for transaction and retry scenarios.</text>

  <rect x="68" y="130" width="470" height="380" rx="12" class="panel"/>
  <text x="303" y="122" class="panelTitle" text-anchor="middle">VIRTUAL THREAD FIXTURE TABLE</text>
  <rect x="112" y="188" width="380" height="282" rx="6" fill="#fff" stroke="#16a34a" class="tableBox"/>
  <rect x="112" y="188" width="380" height="58" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.7"/>
  <line x1="112" y1="246" x2="492" y2="246" stroke="#16a34a" stroke-width="1.3"/>
  <line x1="112" y1="330" x2="492" y2="330" stroke="#16a34a" stroke-width="1.3"/>
  <text x="302" y="225" class="tableName" text-anchor="middle">virtualthreads_table</text>
  <text x="136" y="270" class="detail">PK id: EntityID&lt;Int&gt;</text>
  <text x="136" y="296" class="detail">name: varchar(50)?</text>
  <text x="136" y="352" class="detail">Declared by VTester : IntIdTable</text>
  <text x="136" y="378" class="detail">Used by getTesterById and fan-out tests</text>
  <text x="136" y="404" class="detail">Backs TesterEntity duplicate-id cleanup</text>

  <rect x="642" y="130" width="470" height="380" rx="12" class="panel"/>
  <text x="877" y="122" class="panelTitle" text-anchor="middle">UNIQUE CONSTRAINT TEST TABLE</text>
  <rect x="686" y="188" width="380" height="282" rx="6" fill="#fff" stroke="#db2777" class="tableBox"/>
  <rect x="686" y="188" width="380" height="58" rx="6" fill="#fce7f3" stroke="#db2777" stroke-width="1.7"/>
  <line x1="686" y1="246" x2="1066" y2="246" stroke="#db2777" stroke-width="1.3"/>
  <line x1="686" y1="330" x2="1066" y2="330" stroke="#db2777" stroke-width="1.3"/>
  <text x="876" y="225" class="tableName" text-anchor="middle">virtualthreads_table_unique</text>
  <text x="710" y="270" class="detail">PK id: INT</text>
  <text x="710" y="296" class="detail">UNIQUE id</text>
  <text x="710" y="352" class="detail">Declared by VTesterUnique : Table</text>
  <text x="710" y="378" class="detail">Available for contention/retry examples</text>
  <text x="710" y="404" class="detail">No foreign key to VTester</text>

  <rect x="430" y="568" width="320" height="62" rx="10" fill="#e2e8f0" stroke="#64748b" stroke-width="1.7" filter="url(#shadow)"/>
  <text x="590" y="593" class="label" text-anchor="middle">No FK relationship</text>
  <text x="590" y="616" class="detail" text-anchor="middle">independent test fixtures</text>
  <rect x="118" y="646" width="944" height="54" rx="10" class="footer"/>
  <text x="590" y="670" class="detail" text-anchor="middle">The diagram intentionally omits relationship lines because the source declares no foreign key.</text>
  <text x="590" y="690" class="detail" text-anchor="middle">Both table objects are scoped to Virtual Thread transaction tests.</text>
</svg>
