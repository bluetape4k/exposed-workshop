<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Spring Boot application architecture</title>
  <desc id="desc">The Spring Boot application wires Exposed persistence through configuration beans, exposes thin MVC controllers, delegates validation to CustomerService, and keeps schema creation and Exposed transactions inside ExposedCustomerRepository backed by H2.</desc>
  <defs>
    <style>
      text { letter-spacing: 0; }
      .title { font-family: "Architects Daughter"; font-size: 40px; fill: #23323a; }
      .subtitle, .laneNote, .cardText, .label, .footer { font-family: "Comic Mono"; fill: #324750; }
      .subtitle { font-size: 17px; }
      .laneTitle { font-family: "Architects Daughter"; font-size: 24px; fill: #23323a; }
      .laneNote { font-size: 13px; fill: #5b6d75; }
      .cardTitle { font-family: "Architects Daughter"; font-size: 22px; fill: #20323b; }
      .cardText { font-size: 14px; }
      .label { font-size: 13px; font-weight: 700; }
      .footer { font-size: 14px; fill: #60717a; }
      .canvas { fill: #fbfcf8; stroke: #3f515a; stroke-width: 3; }
      .lane { stroke-width: 2.1; }
      .laneRuntime { fill: #eef7f5; stroke: #6fa098; }
      .laneHttp { fill: #fff7e8; stroke: #b98e50; }
      .laneDomain { fill: #f2f0fb; stroke: #897bc2; }
      .lanePersistence { fill: #f4f6f5; stroke: #8a9aa0; }
      .card { fill: #ffffff; stroke-width: 2.2; }
      .runtimeCard { stroke: #5d948b; }
      .httpCard { stroke: #ac7a34; }
      .domainCard { stroke: #7b6bb4; }
      .persistenceCard { stroke: #69777e; }
      .flowRuntime { fill: none; stroke: #3f8e84; stroke-width: 4.2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowRuntime); }
      .flowHttp { fill: none; stroke: #a2743d; stroke-width: 4.2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowHttp); }
      .flowDomain { fill: none; stroke: #7667b1; stroke-width: 4.2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowDomain); }
      .flowPersistence { fill: none; stroke: #69777e; stroke-width: 4.2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowPersistence); }
    </style>
    <marker id="arrowRuntime" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#3f8e84" stroke="#3f8e84" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="arrowHttp" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#a2743d" stroke="#a2743d" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="arrowDomain" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#7667b1" stroke="#7667b1" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="arrowPersistence" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#69777e" stroke="#69777e" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
  </defs>

  <rect x="24" y="24" width="1552" height="932" rx="20" class="canvas"/>
  <text x="800" y="78" text-anchor="middle" class="title">Spring Boot Application Architecture</text>
  <text x="800" y="110" text-anchor="middle" class="subtitle">MVC controllers stay thin; Spring beans wire Exposed persistence behind service use cases.</text>

  <rect x="70" y="150" width="310" height="590" rx="18" class="lane laneRuntime"/>
  <text x="104" y="190" class="laneTitle">Spring bootstrap</text>
  <text x="104" y="216" class="laneNote">Boot application + explicit beans.</text>

  <rect x="430" y="150" width="310" height="590" rx="18" class="lane laneHttp"/>
  <text x="464" y="190" class="laneTitle">MVC adapter</text>
  <text x="464" y="216" class="laneNote">Controllers and advice own HTTP shape.</text>

  <rect x="790" y="150" width="300" height="590" rx="18" class="lane laneDomain"/>
  <text x="824" y="190" class="laneTitle">Use case boundary</text>
  <text x="824" y="216" class="laneNote">Validation and response mapping.</text>

  <rect x="1140" y="150" width="390" height="590" rx="18" class="lane lanePersistence"/>
  <text x="1174" y="190" class="laneTitle">Exposed persistence</text>
  <text x="1174" y="216" class="laneNote">Transactions and schema bootstrap stay here.</text>

  <rect id="application" x="110" y="250" width="230" height="92" rx="12" class="card runtimeCard"/>
  <text x="225" y="282" text-anchor="middle" class="cardTitle">Spring app</text>
  <text x="140" y="312" class="cardText">@SpringBootApplication</text>
  <text x="140" y="332" class="cardText">runApplication entrypoint</text>

  <rect id="configuration" x="110" y="430" width="230" height="112" rx="12" class="card runtimeCard"/>
  <text x="225" y="464" text-anchor="middle" class="cardTitle">Configuration</text>
  <text x="140" y="492" class="cardText">CustomerPersistence bean</text>
  <text x="140" y="512" class="cardText">repository bean</text>
  <text x="140" y="532" class="cardText">CustomerService bean</text>

  <rect id="controller" x="470" y="250" width="230" height="92" rx="12" class="card httpCard"/>
  <text x="585" y="282" text-anchor="middle" class="cardTitle">CustomerController</text>
  <text x="500" y="312" class="cardText">GET /customers</text>
  <text x="500" y="332" class="cardText">POST /customers</text>

  <rect id="advice" x="470" y="430" width="230" height="112" rx="12" class="card httpCard"/>
  <text x="585" y="464" text-anchor="middle" class="cardTitle">ErrorAdvice</text>
  <text x="500" y="492" class="cardText">validation errors</text>
  <text x="500" y="512" class="cardText">malformed JSON</text>
  <text x="500" y="532" class="cardText">sanitized fallback 500</text>

  <rect id="service" x="830" y="274" width="220" height="118" rx="12" class="card domainCard"/>
  <text x="940" y="308" text-anchor="middle" class="cardTitle">CustomerService</text>
  <text x="860" y="338" class="cardText">normalize name/email</text>
  <text x="860" y="358" class="cardText">find/create use cases</text>
  <text x="860" y="378" class="cardText">domain exceptions</text>

  <rect id="repository" x="1180" y="250" width="310" height="104" rx="12" class="card persistenceCard"/>
  <text x="1335" y="284" text-anchor="middle" class="cardTitle">Exposed customer</text>
  <text x="1335" y="308" text-anchor="middle" class="cardTitle">repository</text>
  <text x="1210" y="334" class="cardText">ReentrantLock + transaction</text>

  <rect id="persistence" x="1180" y="410" width="310" height="112" rx="12" class="card persistenceCard"/>
  <text x="1335" y="464" text-anchor="middle" class="cardTitle">CustomerPersistence</text>
  <text x="1210" y="494" class="cardText">Hikari in-memory H2</text>
  <text x="1210" y="514" class="cardText">Database.connect</text>

  <rect id="database" x="1180" y="590" width="310" height="116" rx="12" class="card persistenceCard"/>
  <g data-bluetape4k-icon="h2" transform="translate(1212 624) scale(2)">
    <path fill="#09476B" d="M17.17 13.27c.14-.015.28-.023.416-.023.7 0 1.228.159 1.599.469.37.314.555.756.555 1.334a2.861 2.861 0 0 1-.43 1.455c-.291.492-.775 1.066-1.46 1.727-.453.446-1.061.976-1.821 1.592a48.02 48.02 0 0 1-2.275 1.742v2.083h9.895V21.24H17.99c.219-.159.59-.435 1.11-.832.519-.4 1.033-.835 1.55-1.311.817-.76 1.425-1.5 1.822-2.215a4.624 4.624 0 0 0 .597-2.268c0-1.213-.416-2.154-1.247-2.815-.828-.662-2.033-.994-3.613-.994-.344 0-.692.015-1.036.049V6.04H13.86v4.701H8.965V6.04H5.65v12.846h3.315v-5.661h4.89v5.661h.039c.31-.242.623-.487.933-.74a28.564 28.564 0 0 0 1.826-1.588 14.854 14.854 0 0 0 .517-.529zM12.011 23.3A11.327 11.327 0 0 1 .7 11.99 11.305 11.305 0 0 1 12.011.699a11.286 11.286 0 0 1 11.29 11.29v.351H24v-.351A11.985 11.985 0 0 0 12.011 0 12.008 12.008 0 0 0 0 11.989 12.026 12.026 0 0 0 12.011 24h.352v-.7z"/>
  </g>
  <text x="1370" y="622" text-anchor="middle" class="cardTitle">H2 spring_customers</text>
  <text x="1280" y="654" class="cardText">LongIdTable table</text>
  <text x="1280" y="674" class="cardText">name + email constraints</text>

  <rect id="tests" x="110" y="778" width="1380" height="72" rx="12" class="card runtimeCard"/>
  <text x="800" y="808" text-anchor="middle" class="cardTitle">Focused verification</text>
  <text x="210" y="836" class="cardText">MockMvc, service, and repository tests keep MVC behavior and Exposed persistence executable with local H2.</text>

  <path id="flow-app-controller" data-connector="flow-app-controller" d="M 340 296 H 470" class="flowRuntime"/>
  <path id="flow-app-config" data-connector="flow-app-config" d="M 225 342 V 430" class="flowRuntime"/>
  <path id="flow-advice-controller" data-connector="flow-advice-controller" d="M 340 486 H 470" class="flowHttp"/>
  <path id="flow-controller-service" data-connector="flow-controller-service" d="M 700 296 H 830" class="flowHttp"/>
  <path id="flow-service-repository" data-connector="flow-service-repository" d="M 1050 333 H 1180" class="flowDomain"/>
  <path id="flow-repository-persistence" data-connector="flow-repository-persistence" d="M 1335 354 V 410" class="flowPersistence"/>
  <path id="flow-persistence-database" data-connector="flow-persistence-database" d="M 1335 522 V 590" class="flowPersistence"/>

  <text x="405" y="280" text-anchor="middle" class="label">MVC endpoint</text>
  <text x="244" y="388" text-anchor="middle" class="label">beans</text>
  <text x="405" y="470" text-anchor="middle" class="label">error policy</text>
  <text x="765" y="280" text-anchor="middle" class="label">delegate</text>
  <text x="1115" y="316" text-anchor="middle" class="label">port</text>
  <text x="1366" y="390" text-anchor="middle" class="label">Database.connect</text>
  <text x="1368" y="564" text-anchor="middle" class="label">schema + data</text>

  <text x="800" y="920" text-anchor="middle" class="footer">The example mirrors the Ktor slice while using Spring MVC conventions, bean wiring, and RestControllerAdvice.</text>
</svg>
