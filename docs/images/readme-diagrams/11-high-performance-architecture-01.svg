<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 940" width="1600" height="940" role="img" aria-label="High performance module relationships">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowCache" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#3f8e84" stroke="#3f8e84" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="arrowRoute" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#a2743d" stroke="#a2743d" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="arrowVerify" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#7667b1" stroke="#7667b1" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <style>
      text { letter-spacing: 0; }
      .canvas { fill: #fbfcf8; stroke: #3f515a; stroke-width: 3; }
      .title { font-family: "Architects Daughter"; font-size: 38px; fill: #23323a; }
      .subtitle,.laneNote,.cardText,.label,.legendText,.footer { font-family: "Comic Mono"; fill: #324750; }
      .subtitle { font-size: 16px; }
      .laneTitle { font-family: "Architects Daughter"; font-size: 24px; fill: #23323a; }
      .laneNote { font-size: 13px; fill: #5b6d75; }
      .cardTitle { font-family: "Architects Daughter"; font-size: 20px; fill: #20323b; }
      .cardText { font-size: 13px; }
      .label { font-size: 12px; font-weight: 700; fill: #324750; stroke: none; }
      .legendText { font-size: 12px; fill: #52666f; }
      .footer { font-size: 13px; fill: #60717a; }
      .laneCache { fill: #eef7f5; stroke: #6fa098; stroke-width: 2.2; }
      .laneRoute { fill: #fff7e8; stroke: #b98e50; stroke-width: 2.2; }
      .laneVerify { fill: #f5f3fb; stroke: #8f82bd; stroke-width: 2.2; }
      .card { fill: #fff; stroke-width: 2.3; filter: url(#shadow); }
      .cacheCard { stroke: #5d948b; }
      .routeCard { stroke: #ac7a34; }
      .verifyCard { stroke: #7b6bb4; }
      .flowCache { fill: none; stroke: #3f8e84; stroke-width: 4.0; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowCache); }
      .flowRoute { fill: none; stroke: #a2743d; stroke-width: 4.0; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowRoute); }
      .flowVerify { fill: none; stroke: #7667b1; stroke-width: 4.0; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowVerify); }
      .legendLine { fill: none; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect x="24" y="24" width="1552" height="892" rx="20" class="canvas"/>
  <text x="800" y="76" text-anchor="middle" class="title">High Performance Module Relationships</text>
  <text x="800" y="108" text-anchor="middle" class="subtitle">Chapter 11 compares cache consistency tradeoffs, datasource routing correctness, and benchmark evidence across runtimes.</text>

  <rect x="70" y="150" width="470" height="670" rx="18" class="laneCache"/>
  <text x="106" y="192" class="laneTitle">Cache strategy family</text>
  <text x="106" y="218" class="laneNote">Same repository decisions are shown</text>
  <text x="106" y="238" class="laneNote">across Spring, WebFlux, and Ktor.</text>

  <rect x="590" y="150" width="390" height="670" rx="18" class="laneRoute"/>
  <text x="626" y="192" class="laneTitle">Routing datasource family</text>
  <text x="626" y="218" class="laneNote">Tenant and read/write role resolve</text>
  <text x="626" y="238" class="laneNote">the selected DataSource.</text>

  <rect x="1030" y="150" width="500" height="670" rx="18" class="laneVerify"/>
  <text x="1066" y="192" class="laneTitle">Benchmark and verification family</text>
  <text x="1066" y="218" class="laneNote">Tests and benchmarks prove the chosen</text>
  <text x="1066" y="238" class="laneNote">latency and consistency tradeoffs.</text>

  <rect id="cacheSpring" x="110" y="280" width="380" height="92" rx="12" class="card cacheCard"/>
  <text x="300" y="312" text-anchor="middle" class="cardTitle">01 Spring MVC cache strategies</text>
  <text x="138" y="340" class="cardText">read-through, write-through, read-only</text>
  <text x="138" y="360" class="cardText">write-behind with virtual threads</text>

  <rect id="cacheCoroutines" x="110" y="410" width="380" height="92" rx="12" class="card cacheCard"/>
  <text x="300" y="442" text-anchor="middle" class="cardTitle">02 WebFlux + coroutine cache</text>
  <text x="138" y="470" class="cardText">coroutine async cache behavior</text>
  <text x="138" y="490" class="cardText">same strategy contracts under Netty</text>

  <rect id="cacheKtor" x="110" y="540" width="380" height="112" rx="12" class="card cacheCard"/>
  <text x="300" y="572" text-anchor="middle" class="cardTitle">05/06 Ktor cache variants</text>
  <text x="138" y="600" class="cardText">Ktor cache-aside/read-through/write-through</text>
  <text x="138" y="620" class="cardText">coroutine-safe routes with explicit DB work</text>
  <text x="138" y="640" class="cardText">H2-only behavior tests</text>

  <rect id="routingSpring" x="630" y="430" width="310" height="112" rx="12" class="card routeCard"/>
  <text x="785" y="462" text-anchor="middle" class="cardTitle">03 Spring routing datasource</text>
  <text x="658" y="490" class="cardText">TenantContext + read-only transaction</text>
  <text x="658" y="510" class="cardText">select write or read replica role</text>
  <text x="658" y="530" class="cardText">integration tests lock routing keys</text>

  <rect id="routingKtor" x="630" y="620" width="310" height="104" rx="12" class="card routeCard"/>
  <text x="785" y="652" text-anchor="middle" class="cardTitle">07 Ktor routing datasource</text>
  <text x="658" y="680" class="cardText">request plugin and coroutine context</text>
  <text x="658" y="700" class="cardText">expose selected datasource role</text>

  <rect id="benchmark" x="1070" y="300" width="410" height="112" rx="12" class="card verifyCard"/>
  <text x="1275" y="332" text-anchor="middle" class="cardTitle">04 Benchmark module</text>
  <text x="1098" y="360" class="cardText">kotlinx-benchmark smoke and main profiles</text>
  <text x="1098" y="380" class="cardText">Exposed vs JPA trend checks</text>
  <text x="1098" y="400" class="cardText">concurrent CRUD scenarios</text>

  <rect id="tests" x="1070" y="470" width="410" height="112" rx="12" class="card verifyCard"/>
  <text x="1275" y="502" text-anchor="middle" class="cardTitle">Verification contracts</text>
  <text x="1098" y="530" class="cardText">cache hit/fallback and write-behind Awaitility</text>
  <text x="1098" y="550" class="cardText">routing key and selected datasource assertions</text>
  <text x="1098" y="570" class="cardText">Ktor route responses expose decisions</text>

  <rect id="operations" x="1070" y="640" width="410" height="96" rx="12" class="card verifyCard"/>
  <text x="1275" y="672" text-anchor="middle" class="cardTitle">Operational checkpoints</text>
  <text x="1098" y="700" class="cardText">freshness SLA, invalidation, backpressure</text>
  <text x="1098" y="720" class="cardText">routing false-positive and miss prevention</text>

  <path id="flow-cache-benchmark" data-connector="flow-cache-benchmark" d="M 490 326 L 1070 326" class="flowCache"/>
  <path id="flow-route-benchmark" data-connector="flow-route-benchmark" d="M 940 490 L 1070 490" class="flowRoute"/>
  <path id="flow-cache-tests" data-connector="flow-cache-tests" d="M 490 456 L 520 456 Q 540 456 540 476 L 540 526 Q 540 546 560 546 L 1070 546" class="flowCache"/>
  <path id="flow-route-tests" data-connector="flow-route-tests" d="M 940 670 L 1070 670" class="flowRoute"/>
  <path id="flow-tests-ops" data-connector="flow-tests-ops" d="M 1275 582 L 1275 640" class="flowVerify"/>

  <text x="770" y="306" text-anchor="middle" class="label">measure latency</text>
  <text x="1004" y="474" text-anchor="middle" class="label">route evidence</text>
  <text x="590" y="518" text-anchor="middle" class="label">behavior tests</text>
  <text x="1004" y="642" text-anchor="middle" class="label">Ktor route role</text>
  <text x="1222" y="616" text-anchor="middle" class="label">stability</text>

  <rect x="450" y="842" width="700" height="36" rx="18" fill="#ffffff" stroke="#d7e2de" stroke-width="1.4"/>
  <path d="M 478 860 L 536 860" class="legendLine" stroke="#3f8e84"/>
  <text x="546" y="864" class="legendText">cache strategy evidence</text>
  <path d="M 722 860 L 780 860" class="legendLine" stroke="#a2743d"/>
  <text x="790" y="864" class="legendText">routing evidence</text>
  <path d="M 938 860 L 996 860" class="legendLine" stroke="#7667b1"/>
  <text x="1006" y="864" class="legendText">benchmark and operations</text>

  <text x="800" y="904" text-anchor="middle" class="footer">Use smoke checks for quick trends, then precise benchmark profiles and focused tests before treating an optimization as a production pattern.</text>
</svg>
