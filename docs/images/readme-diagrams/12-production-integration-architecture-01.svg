  <rect x="24" y="24" width="1712" height="1202" rx="20" class="canvas"/>
  <text x="880" y="78" text-anchor="middle" class="title">Chapter 12 - Production Integration</text>
  <text x="880" y="110" text-anchor="middle" class="subtitle">Paired Spring Boot and Ktor modules keep Exposed persistence behind local, testable production boundaries.</text>

  <text x="190" y="165" text-anchor="middle" class="colTitle">CONCERN</text>
