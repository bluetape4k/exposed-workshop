  <text x="810" y="165" text-anchor="middle" class="colTitle">KTOR</text>
  <text x="1160" y="165" text-anchor="middle" class="colTitle">SHARED PRODUCTION BOUNDARY</text>
  <text x="1505" y="165" text-anchor="middle" class="colTitle">LOCAL WORKSHOP ISOLATION</text>

