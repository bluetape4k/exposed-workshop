  <text x="1160" y="258" text-anchor="middle" class="cardTitle">Service + repository</text>
  <text x="1160" y="286" text-anchor="middle" class="cardText">thin HTTP adapters</text>
  <text x="1160" y="306" text-anchor="middle" class="cardText">Exposed JDBC hidden</text>
  <rect id="isolation-app" x="1390" y="224" width="230" height="96" rx="12" class="card appCard"/>
  <text x="1505" y="258" text-anchor="middle" class="cardTitle">H2 route tests</text>
  <text x="1505" y="286" text-anchor="middle" class="cardText">MockMvc or</text>
  <text x="1505" y="306" text-anchor="middle" class="cardText">testApplication</text>

