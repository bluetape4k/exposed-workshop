  <rect id="topic-app" x="100" y="224" width="180" height="96" rx="12" class="card appCard topicCard"/>
  <text x="190" y="260" text-anchor="middle" class="rowTitle">Application</text>
  <text x="190" y="286" text-anchor="middle" class="cardText">architecture</text>
  <text x="190" y="306" text-anchor="middle" class="cardText">01/02 baseline</text>
  <rect id="spring-app" x="360" y="206" width="280" height="58" rx="12" class="card appCard"/>
  <text x="500" y="239" text-anchor="middle" class="cardTitle">02 MVC controller</text>
  <rect id="ktor-app" x="670" y="278" width="280" height="58" rx="12" class="card appCard"/>
