<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1250" viewBox="0 0 1760 1250" role="img" aria-labelledby="title desc">
  <title id="title">Chapter 12 production integration map</title>
  <desc id="desc">Chapter 12 compares paired Spring Boot and Ktor production integration modules across application architecture, HTTP outbox idempotency, auth session metadata, realtime outbox delivery, and observability readiness, while keeping Exposed persistence behind repository boundaries and tests self-contained.</desc>
  <defs>
    <style>
      text { letter-spacing: 0; }
      .title { font-family: "Architects Daughter", "Comic Sans MS", cursive; font-size: 42px; fill: #23323a; }
      .subtitle, .colTitle, .cardText, .legendText, .footer { font-family: "Comic Mono", "Comic Sans MS", Arial, sans-serif; fill: #324750; }
      .subtitle { font-size: 18px; }
      .colTitle { font-size: 14px; font-weight: 700; fill: #60717a; }
      .rowTitle { font-family: "Architects Daughter", "Comic Sans MS", cursive; font-size: 22px; fill: #20323b; }
      .cardTitle { font-family: "Architects Daughter", "Comic Sans MS", cursive; font-size: 20px; fill: #20323b; }
      .cardText { font-size: 13px; }
      .legendText { font-size: 13px; }
      .footer { font-size: 14px; fill: #60717a; }
      .canvas { fill: #fbfcf8; stroke: #3f515a; stroke-width: 3; }
      .row { stroke-width: 2.1; }
      .rowApp { fill: #eef7f5; stroke: #6fa098; }
      .rowOutbox { fill: #fff7e8; stroke: #b98e50; }
      .rowAuth { fill: #f2f0fb; stroke: #897bc2; }
      .rowRealtime { fill: #eef4fb; stroke: #6f91b8; }
      .rowOps { fill: #f4f6f5; stroke: #8a9aa0; }
      .card { fill: #ffffff; stroke-width: 2.1; }
      .appCard { stroke: #5d948b; }
      .outboxCard { stroke: #ac7a34; }
      .authCard { stroke: #7b6bb4; }
      .realtimeCard { stroke: #5f83ae; }
      .opsCard { stroke: #69777e; }
      .topicCard { fill: #fffdf8; }
      .flowApp { fill: none; stroke: #3f8e84; stroke-width: 4.2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowApp); }
      .flowOutbox { fill: none; stroke: #a2743d; stroke-width: 4.2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowOutbox); }
      .flowAuth { fill: none; stroke: #7667b1; stroke-width: 4.2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowAuth); }
