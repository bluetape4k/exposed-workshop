<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 900" width="1500" height="900" role="img" aria-label="Exposed Money Composite Column ERD">
<defs>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/></filter>
<marker id="arrowGreen" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#6e8f4f" stroke="#6e8f4f" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
<marker id="arrowPurple" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#7d61b3" stroke="#7d61b3" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
<style>
.canvas{fill:#f6f9fc}.frame{fill:#fff;stroke:#d7e2ec;stroke-width:1.5}
.title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:31px;fill:#1e293b}
.subtitle,.detail{font-family:"Comic Mono","Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;fill:#536476}
.subtitle{font-size:13px}.detail{font-size:12px}.tiny{font-family:"Comic Mono","Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:10px;fill:#64748b}
.label{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:16px;fill:#1e293b}
.panelTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:12px;letter-spacing:.08em;fill:#94a3b8}
.card{stroke-width:1.7;filter:url(#shadow)}.panel{fill:#f8fafc;stroke:#d7e2ec;stroke-width:1.2}
.mapLine{fill:none;stroke:#6e8f4f;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowGreen)}
.runtimeUse{fill:none;stroke:#7d61b3;stroke-width:1.9;stroke-dasharray:6 5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowPurple)}
.inheritStem{fill:none;stroke:#475569;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
</style>
</defs>
<rect width="1500" height="900" class="canvas"/>
<rect x="20" y="20" width="1460" height="860" rx="16" class="frame"/>
<text x="48" y="58" class="title">Exposed Money Composite Column ERD</text>
<text x="48" y="80" class="subtitle">compositeMoney stores MonetaryAmount as amount and currency columns with defaults, nullable variants, and an index</text>
<rect x="58" y="130" width="420" height="600" rx="12" class="panel"/><text x="268" y="122" class="panelTitle" text-anchor="middle">COMPOSITE MONEY TYPE</text>
<rect x="116" y="190" width="300" height="72" rx="10" fill="#ccfbf1" stroke="#0f766e" class="card"/>
<text x="266" y="215" class="label" text-anchor="middle">MonetaryAmount</text>
<text x="266" y="248" class="detail" text-anchor="middle">javax.money</text>
<rect x="86" y="360" width="170" height="72" rx="10" fill="#ede9fe" stroke="#7c3aed" class="card"/>
<text x="171" y="385" class="label" text-anchor="middle">CurrencyUnit</text>
<text x="171" y="418" class="detail" text-anchor="middle">currency VARCHAR(3)</text>
<rect x="276" y="360" width="170" height="72" rx="10" fill="#fef3c7" stroke="#d97706" class="card"/>
<text x="361" y="385" class="label" text-anchor="middle">BigDecimal</text>
<text x="361" y="418" class="detail" text-anchor="middle">amount DECIMAL</text>
<path data-connector="money-to-currency-component" d="M266,262 L266,306 Q266,318 254,318 L183,318 Q171,318 171,330 L171,360" class="mapLine"/>
<path data-connector="money-to-amount-component" d="M266,262 L266,306 Q266,318 278,318 L349,318 Q361,318 361,330 L361,360" class="mapLine"/>
<rect x="548" y="130" width="820" height="600" rx="12" class="panel"/><text x="958" y="122" class="panelTitle" text-anchor="middle">TABLES</text>
<rect x="600" y="184" width="300" height="180" rx="10" fill="#fff" stroke="#7c3aed" class="card"/>
<path d="M600,226 L600,194 Q600,184 610,184 L890,184 Q900,184 900,194 L900,226 Z" fill="#ede9fe"/>
<text x="750" y="212" class="label" text-anchor="middle">AccountTable</text>
<text x="616" y="252" class="tiny">id PK</text>
<text x="616" y="270" class="tiny">composite_money DECIMAL(8,5)</text>
<text x="616" y="288" class="tiny">composite_money_C VARCHAR(3)</text>
<text x="616" y="306" class="tiny">index ix_money_amount</text>
<rect x="1010" y="184" width="300" height="198" rx="10" fill="#fff" stroke="#d97706" class="card"/>
<path d="M1010,226 L1010,194 Q1010,184 1020,184 L1300,184 Q1310,184 1310,194 L1310,226 Z" fill="#fef3c7"/>
<text x="1160" y="212" class="label" text-anchor="middle">TableWithDBDefault</text>
<text x="1026" y="252" class="tiny">id PK</text>
<text x="1026" y="270" class="tiny">field VARCHAR(100)</text>
<text x="1026" y="288" class="tiny">t1 + t1_C DEFAULT USD</text>
<text x="1026" y="306" class="tiny">t2 + t2_C NULL</text>
<text x="1026" y="324" class="tiny">clientDefault INT</text>
<rect x="792" y="480" width="330" height="184" rx="10" fill="#fff" stroke="#16a34a" class="card"/>
<path d="M792,522 L792,490 Q792,480 802,480 L1112,480 Q1122,480 1122,490 L1122,522 Z" fill="#dcfce7"/>
<text x="957" y="508" class="label" text-anchor="middle">tester</text>
<text x="808" y="548" class="tiny">amount DECIMAL(8,5)</text>
<text x="808" y="566" class="tiny">currency VARCHAR(3)</text>
<text x="808" y="584" class="tiny">nullable_amount DECIMAL(8,5)</text>
<text x="808" y="602" class="tiny">nullable_currency VARCHAR(3)</text>
<path data-connector="amount-component-to-account-table" d="M446,384 L530,384 Q542,384 542,372 L542,282 Q542,270 554,270 L600,270" class="mapLine"/>
<path data-connector="currency-component-to-account-table" d="M171,432 L171,458 Q171,470 183,470 L558,470 Q570,470 570,458 L570,300 Q570,288 582,288 L600,288" class="mapLine"/>
<path data-connector="money-to-db-default-table" d="M416,215 L520,215 Q532,215 532,203 L532,168 Q532,156 544,156 L976,156 Q988,156 988,168 L988,270 Q988,282 1000,282 L1010,282" class="runtimeUse"/>
<rect x="380" y="752" width="740" height="42" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<path d="M424,773 L492,773" class="mapLine"/>
<text x="514" y="777" class="detail">primary table stores amount and currency columns</text>
<path d="M824,773 L892,773" class="runtimeUse"/>
<text x="914" y="777" class="detail">same expansion in DB default table</text>
<rect x="126" y="812" width="1188" height="52" rx="10" fill="#ecfdf5" stroke="#86efac" stroke-width="1.3"/>
<text x="720" y="843" class="detail" text-anchor="middle">ERD shows physical columns. compositeMoney is not a separate table; it expands into amount and currency columns.</text>
</svg>
