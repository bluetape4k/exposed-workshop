<text x="597" y="486" class="detail" text-anchor="middle">insertIgnore</text>
<rect x="492" y="562" width="210" height="66" rx="10" fill="#ede9fe" stroke="#7c3aed" class="card"/>
<text x="597" y="587" class="label" text-anchor="middle">Concurrent DAO</text>
<text x="597" y="614" class="detail" text-anchor="middle">async new/find</text>
