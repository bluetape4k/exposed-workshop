<rect width="1560" height="940" class="canvas"/>
<rect x="20" y="20" width="1520" height="900" rx="16" class="frame"/>
<text x="48" y="58" class="title">Custom ID Generation Flow</text>
<text x="48" y="80" class="subtitle">Custom entity tests exercise Timebased UUID, Base62, Snowflake, KSUID, and KSUID millis IDs through DSL and DAO paths</text>
<rect x="58" y="130" width="310" height="640" rx="12" class="panel"/><text x="213" y="122" class="panelTitle" text-anchor="middle">ID STRATEGY</text>
