<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc">
  <title id="title">Trino session options and EXPLAIN pushdown inspection sequence</title>
  <desc id="desc">Sequence for the local-only Exposed Trino workshop path that validates typed session options, generates SQL locally, and prepares an EXPLAIN request without contacting Trino.</desc>
  <defs>
    <style>
      text { letter-spacing: 0; }
      .title { font-family: "Architects Daughter"; font-size: 40px; font-weight: 400; fill: #263238; }
      .subtitle, .msg, .note, .footer, .role { font-family: "Comic Mono"; fill: #36464f; }
      .subtitle { font-size: 18px; }
      .participant { font-family: "Architects Daughter"; font-size: 19px; font-weight: 400; fill: #1f3138; }
      .role { font-size: 13px; fill: #546a73; }
      .msg { font-size: 14px; }
      .note { font-size: 13px; }
      .footer { font-size: 14px; fill: #60727d; }
      .frame { fill: #fbfcf8; stroke: #41545d; stroke-width: 3; }
      .header { fill: #ffffff; stroke: #546e7a; stroke-width: 2; }
      .lifeline { stroke: #9aaab1; stroke-width: 2; stroke-dasharray: 7 8; }
      .activation { fill: #f3ecdf; stroke: #8f784e; stroke-width: 1.5; }
      .call { fill: none; stroke: #3f7d9c; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowCall); }
      .sql { fill: none; stroke: #a2743d; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowSql); }
      .state { fill: none; stroke: #6e8f4f; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowState); }
      .return { fill: none; stroke: #9b7d54; stroke-width: 2.5; stroke-dasharray: 8 6; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowReturn); }
      .alt { fill: none; stroke: #78909c; stroke-width: 3; stroke-dasharray: 12 7; }
      .label { fill: #ffffff; stroke: #d7e0e4; stroke-width: 1.5; }
      .label.callLabel { stroke: #9cc2d1; }
      .label.sqlLabel { stroke: #d0b078; }
      .label.stateLabel { stroke: #b6c9a4; }
      .label.returnLabel { stroke: #c8b38f; }
      .badge { stroke-width: 1.8; }
      .badge.callBadge { fill: #eaf4f8; stroke: #3f7d9c; }
      .badge.sqlBadge { fill: #fff4df; stroke: #a2743d; }
      .badge.stateBadge { fill: #eef7f0; stroke: #6e8f4f; }
      .badge.returnBadge { fill: #fff7e8; stroke: #9b7d54; }
      .badgeText { font-family: "Comic Mono"; font-size: 12px; font-weight: 700; }
      .msg.callText, .badgeText.callText { fill: #2f6f8e; }
      .msg.sqlText, .badgeText.sqlText { fill: #855a29; }
      .msg.stateText, .badgeText.stateText { fill: #55783f; }
      .msg.returnText, .badgeText.returnText { fill: #7f6038; }
    </style>
    <marker id="arrowCall" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" refX="9" refY="5" orient="auto" data-role="sequence" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#3f7d9c" stroke="#3f7d9c" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="arrowSql" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" refX="9" refY="5" orient="auto" data-role="sequence" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#a2743d" stroke="#a2743d" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="arrowState" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" refX="9" refY="5" orient="auto" data-role="sequence" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#6e8f4f" stroke="#6e8f4f" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="arrowReturn" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" refX="9" refY="5" orient="auto" data-role="sequence" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#9b7d54" stroke="#9b7d54" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
  </defs>

  <rect x="24" y="24" width="1552" height="1032" rx="20" class="frame"/>
  <text x="800" y="78" text-anchor="middle" class="title">Trino Session Options and Pushdown Inspection</text>
  <text x="800" y="108" text-anchor="middle" class="subtitle">Typed options are validated locally, SQL is generated with Exposed, and Trino EXPLAIN is prepared without network access.</text>

  <g id="participants">
    <rect x="60" y="150" width="170" height="68" rx="10" class="header"/>
    <text x="145" y="179" text-anchor="middle" class="participant">Workshop Test</text>
    <text x="145" y="201" text-anchor="middle" class="role">JUnit local path</text>

    <rect x="300" y="150" width="210" height="68" rx="10" class="header"/>
    <text x="405" y="179" text-anchor="middle" class="participant">Trino Profile</text>
    <text x="405" y="201" text-anchor="middle" class="role">validated inputs</text>

    <rect x="580" y="150" width="220" height="68" rx="10" class="header"/>
    <text x="690" y="179" text-anchor="middle" class="participant">Trino Options</text>
    <text x="690" y="201" text-anchor="middle" class="role">bluetape4k API</text>

    <rect x="870" y="150" width="190" height="68" rx="10" class="header"/>
    <text x="965" y="179" text-anchor="middle" class="participant">Exposed Query</text>
    <text x="965" y="201" text-anchor="middle" class="role">warehouse DSL</text>

    <rect x="1130" y="150" width="180" height="68" rx="10" class="header"/>
    <text x="1220" y="179" text-anchor="middle" class="participant">H2 Dialect</text>
    <text x="1220" y="201" text-anchor="middle" class="role">SQL generation</text>

    <rect x="1380" y="150" width="160" height="68" rx="10" class="header"/>
    <text x="1460" y="179" text-anchor="middle" class="participant">EXPLAIN</text>
    <text x="1460" y="201" text-anchor="middle" class="role">request shape</text>
  </g>

  <line x1="145" y1="218" x2="145" y2="928" class="lifeline"/>
  <line x1="405" y1="218" x2="405" y2="928" class="lifeline"/>
  <line x1="690" y1="218" x2="690" y2="928" class="lifeline"/>
  <line x1="965" y1="218" x2="965" y2="928" class="lifeline"/>
  <line x1="1220" y1="218" x2="1220" y2="928" class="lifeline"/>
  <line x1="1460" y1="218" x2="1460" y2="928" class="lifeline"/>

  <rect x="398" y="300" width="14" height="178" rx="6" class="activation"/>
  <rect x="683" y="450" width="14" height="116" rx="6" class="activation"/>
  <rect x="958" y="584" width="14" height="328" rx="6" class="activation"/>
  <rect x="1213" y="686" width="14" height="124" rx="6" class="activation"/>
  <rect x="1453" y="884" width="14" height="70" rx="6" class="activation"/>

  <rect x="72" y="260" width="430" height="34" rx="17" class="label callLabel"/>
  <circle cx="96" cy="277" r="13" class="badge callBadge"/><text x="96" y="282" text-anchor="middle" class="badgeText callText">1</text>
  <text x="120" y="282" class="msg callText">defaultTrinoAnalyticsProfile()</text>
  <path d="M 145 318 L 398 318" class="call"/>

  <rect x="178" y="360" width="530" height="34" rx="17" class="label stateLabel"/>
  <circle cx="202" cy="377" r="13" class="badge stateBadge"/><text x="202" y="382" text-anchor="middle" class="badgeText stateText">2</text>
  <text x="226" y="382" class="msg stateText">validate catalog, schema, source, tags, session properties</text>
  <path d="M 405 414 L 405 460" class="state"/>

  <rect x="430" y="434" width="470" height="34" rx="17" class="label callLabel"/>
  <circle cx="454" cy="451" r="13" class="badge callBadge"/><text x="454" y="456" text-anchor="middle" class="badgeText callText">3</text>
  <text x="478" y="456" class="msg callText">toConnectionOptions()</text>
  <path d="M 412 470 L 683 470" class="call"/>

  <rect x="442" y="508" width="520" height="34" rx="17" class="label returnLabel"/>
  <circle cx="466" cy="525" r="13" class="badge returnBadge"/><text x="466" y="530" text-anchor="middle" class="badgeText returnText">4</text>
  <text x="490" y="530" class="msg returnText">explicitPrepare=false, source, tags, sessionProperties</text>
  <path d="M 683 558 L 145 558" class="return"/>

  <rect x="138" y="564" width="470" height="34" rx="17" class="label callLabel"/>
  <circle cx="162" cy="581" r="13" class="badge callBadge"/><text x="162" y="586" text-anchor="middle" class="badgeText callText">5</text>
  <text x="186" y="586" class="msg callText">buildRegionalTopOrdersQuery()</text>
  <path d="M 145 604 L 958 604" class="call"/>

  <rect x="784" y="646" width="472" height="34" rx="17" class="label sqlLabel"/>
  <circle cx="808" cy="663" r="13" class="badge sqlBadge"/><text x="808" y="668" text-anchor="middle" class="badgeText sqlText">6</text>
  <text x="832" y="668" class="msg sqlText">prepareSQL in local H2 transaction</text>
  <path d="M 972 706 L 1213 706" class="sql"/>

  <rect x="918" y="746" width="392" height="34" rx="17" class="label returnLabel"/>
  <circle cx="942" cy="763" r="13" class="badge returnBadge"/><text x="942" y="768" text-anchor="middle" class="badgeText returnText">7</text>
  <text x="966" y="768" class="msg returnText">SELECT with predicate, order, top-N</text>
  <path d="M 1213 802 L 972 802" class="return"/>

  <rect x="852" y="830" width="674" height="116" rx="14" class="alt"/>
  <rect x="884" y="848" width="236" height="30" rx="15" fill="#f8f1e6" stroke="#a2743d" stroke-width="1.8"/>
  <text x="906" y="868" class="note">request-shape only</text>

  <rect x="1006" y="882" width="398" height="34" rx="17" class="label stateLabel"/>
  <circle cx="1030" cy="899" r="13" class="badge stateBadge"/><text x="1030" y="904" text-anchor="middle" class="badgeText stateText">8</text>
  <text x="1054" y="904" class="msg stateText">buildExplainRequest(sql)</text>
  <path d="M 972 928 L 1453 928" class="state"/>

  <rect x="98" y="972" width="1404" height="44" rx="12" fill="#ffffff" stroke="#ccd7da" stroke-width="2"/>
  <text x="118" y="1000" class="note">Default path stays local: no Trino endpoint, credentials, network calls, live connector, or pushdown result assertion.</text>
  <text x="800" y="1032" text-anchor="middle" class="footer">github.com/bluetape4k/exposed-workshop - 13-ecosystem-integrations/02-trino-session-options</text>
</svg>
