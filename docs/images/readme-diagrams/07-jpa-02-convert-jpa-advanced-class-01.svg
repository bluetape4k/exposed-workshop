<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 760" width="1220" height="760" role="img" aria-label="Inheritance strategy migration map">
  <defs>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="136%">
      <feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
    <marker id="flowArrow" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#60758d" stroke="#60758d" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <style>
      .canvas{fill:#f6f9fc}
      .frame{fill:#ffffff;stroke:#d7e2ec;stroke-width:1.5}
      .lane{fill:#f8fafc;stroke:#d7e2ec;stroke-width:1.2}
      .card{fill:#ffffff;stroke-width:1.8;filter:url(#shadow)}
      .head{stroke-width:0}
      .title{font-family:"Architects Daughter";font-size:32px;fill:#1e293b}
      .subtitle{font-family:"Comic Mono";font-size:13px;fill:#536476}
      .laneTitle{font-family:"Architects Daughter";font-size:12px;letter-spacing:.08em;fill:#94a3b8}
      .cardTitle{font-family:"Architects Daughter";font-size:19px;fill:#1e293b}
      .small{font-family:"Comic Mono";font-size:12px;fill:#475569}
      .strong{font-weight:700;fill:#1e3a8a}
      .warn{font-weight:700;fill:#8a4f0a}
      .flow{fill:none;stroke:#60758d;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#flowArrow)}
      .legendBox{fill:#f8fafc;stroke:#d7e2ec;stroke-width:1.2}
      .legendText{font-family:"Comic Mono";font-size:12px;fill:#475569}
    </style>
  </defs>

  <rect width="1220" height="760" class="canvas"/>
  <rect x="20" y="20" width="1180" height="720" rx="16" class="frame"/>
  <text x="48" y="60" class="title">Inheritance Strategy Migration Map</text>
  <text x="48" y="83" class="subtitle">JPA inheritance annotations become explicit Exposed table shapes, entity wrappers, and regression queries.</text>

  <rect x="54" y="120" width="1112" height="94" rx="12" class="lane"/>
  <text x="610" y="113" class="laneTitle" text-anchor="middle">JPA STRATEGY</text>
  <rect x="72" y="140" width="320" height="54" rx="10" fill="#dbeafe" stroke="#3b82f6" class="card"/>
  <text x="232" y="173" class="cardTitle" text-anchor="middle">@Inheritance(SINGLE_TABLE)</text>
  <rect x="450" y="140" width="320" height="54" rx="10" fill="#dcfce7" stroke="#16a34a" class="card"/>
  <text x="610" y="173" class="cardTitle" text-anchor="middle">@Inheritance(JOINED)</text>
  <rect x="828" y="140" width="320" height="54" rx="10" fill="#ffedd5" stroke="#ea580c" class="card"/>
  <text x="988" y="173" class="cardTitle" text-anchor="middle">@Inheritance(TABLE_PER_CLASS)</text>

  <rect x="54" y="270" width="1112" height="198" rx="12" class="lane"/>
  <text x="610" y="263" class="laneTitle" text-anchor="middle">EXPOSED SCHEMA SHAPE</text>

  <g id="single-schema" data-node="single-schema">
    <rect x="72" y="292" width="320" height="146" rx="10" class="card" stroke="#3b82f6"/>
    <path d="M72,328 L72,304 Q72,292 84,292 L380,292 Q392,292 392,304 L392,328 Z" class="head" fill="#dbeafe"/>
    <text x="232" y="319" class="cardTitle" text-anchor="middle">One BillingTable</text>
    <text x="96" y="354" class="small strong">IntIdTable("billing")</text>
    <text x="96" y="374" class="small">dtype: BillingType discriminator</text>
    <text x="96" y="394" class="small">CreditCard columns nullable</text>
    <text x="96" y="414" class="small">BankAccount columns nullable</text>
  </g>

  <g id="joined-schema" data-node="joined-schema">
    <rect x="450" y="292" width="320" height="146" rx="10" class="card" stroke="#16a34a"/>
    <path d="M450,328 L450,304 Q450,292 462,292 L758,292 Q770,292 770,304 L770,328 Z" class="head" fill="#dcfce7"/>
    <text x="610" y="319" class="cardTitle" text-anchor="middle">Parent + Child Tables</text>
    <text x="474" y="354" class="small strong">PersonTable : joined_person</text>
    <text x="474" y="374" class="small">EmployeeTable FK = PK to Person</text>
    <text x="474" y="394" class="small">CustomerTable FK = PK to Person</text>
    <text x="474" y="414" class="small">joins/load() restore object view</text>
  </g>

  <g id="table-per-class-schema" data-node="table-per-class-schema">
    <rect x="828" y="292" width="320" height="146" rx="10" class="card" stroke="#ea580c"/>
    <path d="M828,328 L828,304 Q828,292 840,292 L1136,292 Q1148,292 1148,304 L1148,328 Z" class="head" fill="#ffedd5"/>
    <text x="988" y="319" class="cardTitle" text-anchor="middle">Independent Subtype Tables</text>
    <text x="852" y="354" class="small strong">AbstractBillingTable</text>
    <text x="852" y="374" class="small">TimebasedUUIDTable shared base</text>
    <text x="852" y="394" class="small">CreditCardTable / BankAccountTable</text>
    <text x="852" y="414" class="small">common columns repeated per table</text>
  </g>

  <rect x="54" y="520" width="1112" height="122" rx="12" class="lane"/>
  <text x="610" y="513" class="laneTitle" text-anchor="middle">ENTITY AND TEST CONTRACT</text>

  <g id="single-contract" data-node="single-contract">
    <rect x="72" y="540" width="320" height="78" rx="10" class="card" stroke="#3b82f6"/>
    <text x="96" y="568" class="small strong">Billing -> CreditCard / BankAccount</text>
    <text x="96" y="588" class="small">findById filters dtype by subtype</text>
    <text x="96" y="608" class="small warn">fast query, nullable column bloat</text>
  </g>

  <g id="joined-contract" data-node="joined-contract">
    <rect x="450" y="540" width="320" height="78" rx="10" class="card" stroke="#16a34a"/>
    <text x="474" y="568" class="small strong">Person + Employee / Customer</text>
    <text x="474" y="588" class="small">create() writes parent then child</text>
    <text x="474" y="608" class="small warn">delete() removes child and parent</text>
  </g>

  <g id="table-per-class-contract" data-node="table-per-class-contract">
    <rect x="828" y="540" width="320" height="78" rx="10" class="card" stroke="#ea580c"/>
    <text x="852" y="568" class="small strong">AbstractBillingEntity subtypes</text>
    <text x="852" y="588" class="small">UUID ids stay unique across tables</text>
    <text x="852" y="608" class="small warn">cross-type query needs union logic</text>
  </g>

  <path id="single-strategy-schema" class="flow" data-connector="single-strategy-schema" d="M232,194 L232,292"/>
  <path id="single-schema-contract" class="flow" data-connector="single-schema-contract" d="M232,438 L232,540"/>
  <path id="joined-strategy-schema" class="flow" data-connector="joined-strategy-schema" d="M610,194 L610,292"/>
  <path id="joined-schema-contract" class="flow" data-connector="joined-schema-contract" d="M610,438 L610,540"/>
  <path id="tpc-strategy-schema" class="flow" data-connector="tpc-strategy-schema" d="M988,194 L988,292"/>
  <path id="tpc-schema-contract" class="flow" data-connector="tpc-schema-contract" d="M988,438 L988,540"/>

  <rect x="72" y="670" width="900" height="42" rx="10" class="legendBox"/>
  <line x1="96" y1="691" x2="146" y2="691" class="flow"/>
  <text x="162" y="695" class="legendText">solid arrow = migration choice to concrete Exposed shape and test contract</text>
</svg>
