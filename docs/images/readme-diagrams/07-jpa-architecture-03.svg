<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 940" width="1560" height="940" role="img" aria-label="Migration Approach Comparison">
<defs>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/></filter>
<marker id="arrowBlue" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#4f86c6" stroke="#4f86c6" stroke-dasharray="none" style="stroke-dasharray:none!important" stroke-width="0"/></marker>
<marker id="arrowGreen" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6e8f4f" stroke="#6e8f4f" stroke-dasharray="none" style="stroke-dasharray:none!important" stroke-width="0"/></marker>
<marker id="arrowPink" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b65386" stroke="#b65386" stroke-dasharray="none" style="stroke-dasharray:none!important" stroke-width="0"/></marker>
<marker id="arrowOrange" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b8793c" stroke="#b8793c" stroke-dasharray="none" style="stroke-dasharray:none!important" stroke-width="0"/></marker>
<marker id="arrowPurple" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7d61b3" stroke="#7d61b3" stroke-dasharray="none" style="stroke-dasharray:none!important" stroke-width="0"/></marker>
<style>
.canvas{fill:#f6f9fc}.frame{fill:#fff;stroke:#d7e2ec;stroke-width:1.5}
.title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:31px;fill:#1e293b}
.subtitle,.detail{font-family:"Comic Mono","Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;fill:#536476}
.subtitle{font-size:13px}.detail{font-size:12px}.tiny{font-family:"Comic Mono","Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:10px;fill:#64748b}
.label{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:16px;fill:#1e293b}
.panelTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:12px;letter-spacing:.08em;fill:#94a3b8}
.card{stroke-width:1.7;filter:url(#shadow)}.panel{fill:#f8fafc;stroke:#d7e2ec;stroke-width:1.2}
.arrow{fill:none;stroke:#4f86c6;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowBlue)}
.mapLine{fill:none;stroke:#6e8f4f;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowGreen)}
.codecLine{fill:none;stroke:#b65386;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowPink)}
.dbUse{fill:none;stroke:#b8793c;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowOrange)}
.runtimeUse{fill:none;stroke:#7d61b3;stroke-width:1.9;stroke-dasharray:6 5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowPurple)}
.inheritStem{fill:none;stroke:#475569;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
</style>
</defs>
<rect width="1560" height="940" class="canvas"/>
<rect x="20" y="20" width="1520" height="900" rx="16" class="frame"/>
<text x="48" y="58" class="title">Migration Approach Comparison</text>
<text x="48" y="80" class="subtitle">Use source-backed equivalence tests to migrate from basic CRUD through relationships, inheritance strategies, auditing, and optimistic locking</text>
<rect x="58" y="130" width="412" height="640" rx="12" class="panel"/><text x="264" y="122" class="panelTitle" text-anchor="middle">APPROACH OPTIONS</text>
<desc>Big-bang rewrite</desc><rect x="102" y="182" width="310" height="70" rx="10" fill="#fce7f3" stroke="#db2777" class="card"/>
<text x="257" y="207" class="label" text-anchor="middle">Big-bang rewrite</text>
<text x="257" y="238" class="detail" text-anchor="middle">high blast radius</text>
<desc>Parallel equivalence</desc><rect x="102" y="344" width="310" height="70" rx="10" fill="#dcfce7" stroke="#16a34a" class="card"/>
<text x="257" y="369" class="label" text-anchor="middle">Parallel equivalence</text>
<text x="257" y="400" class="detail" text-anchor="middle">compare old/new results</text>
<desc>Incremental replacement</desc><rect x="102" y="506" width="310" height="70" rx="10" fill="#dbeafe" stroke="#3b82f6" class="card"/>
<text x="257" y="531" class="label" text-anchor="middle">Incremental replacement</text>
<text x="257" y="562" class="detail" text-anchor="middle">module-by-module</text>
<rect x="562" y="130" width="388" height="640" rx="12" class="panel"/><text x="756" y="122" class="panelTitle" text-anchor="middle">MIGRATION ORDER</text>
<desc>1. CRUD basics</desc><rect x="610" y="166" width="292" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" class="card"/>
<text x="756" y="191" class="label" text-anchor="middle">1. CRUD basics</text>
<text x="756" y="212" class="detail" text-anchor="middle">SimpleTable + SimpleEntity</text>
<desc>2. Relations</desc><rect x="610" y="278" width="292" height="60" rx="10" fill="#ccfbf1" stroke="#0f766e" class="card"/>
<text x="756" y="303" class="label" text-anchor="middle">2. Relations</text>
<text x="756" y="324" class="detail" text-anchor="middle">Blog/Person/Book schemas</text>
<desc>3. Advanced queries</desc><rect x="610" y="390" width="292" height="60" rx="10" fill="#fef3c7" stroke="#d97706" class="card"/>
<text x="756" y="415" class="label" text-anchor="middle">3. Advanced queries</text>
<text x="756" y="436" class="detail" text-anchor="middle">joins/subquery/CTE</text>
<desc>4. Inheritance</desc><rect x="610" y="502" width="292" height="60" rx="10" fill="#ede9fe" stroke="#7c3aed" class="card"/>
<text x="756" y="527" class="label" text-anchor="middle">4. Inheritance</text>
<text x="756" y="548" class="detail" text-anchor="middle">single/joined/table per class</text>
<desc>5. Consistency</desc><rect x="610" y="614" width="292" height="60" rx="10" fill="#fce7f3" stroke="#db2777" class="card"/>
<text x="756" y="639" class="label" text-anchor="middle">5. Consistency</text>
<text x="756" y="660" class="detail" text-anchor="middle">audit + optimistic locking</text>
<rect x="1046" y="130" width="330" height="640" rx="12" class="panel"/><text x="1211" y="122" class="panelTitle" text-anchor="middle">VERIFICATION GATES</text>
<desc>Row equivalence</desc><rect x="1090" y="196" width="242" height="64" rx="10" fill="#dbeafe" stroke="#3b82f6" class="card"/>
<text x="1211" y="221" class="label" text-anchor="middle">Row equivalence</text>
<text x="1211" y="246" class="detail" text-anchor="middle">same records</text>
<desc>Query count</desc><rect x="1090" y="332" width="242" height="64" rx="10" fill="#fef3c7" stroke="#d97706" class="card"/>
<text x="1211" y="357" class="label" text-anchor="middle">Query count</text>
<text x="1211" y="382" class="detail" text-anchor="middle">N+1 guarded</text>
<desc>Transaction behavior</desc><rect x="1090" y="468" width="242" height="64" rx="10" fill="#e2e8f0" stroke="#64748b" class="card"/>
<text x="1211" y="493" class="label" text-anchor="middle">Transaction behavior</text>
<text x="1211" y="518" class="detail" text-anchor="middle">same boundary</text>
<desc>Lock conflict</desc><rect x="1090" y="604" width="242" height="64" rx="10" fill="#fce7f3" stroke="#db2777" class="card"/>
<text x="1211" y="629" class="label" text-anchor="middle">Lock conflict</text>
<text x="1211" y="654" class="detail" text-anchor="middle">version policy</text>
<rect x="1404" y="310" width="118" height="250" rx="10" fill="#fff7ed" stroke="#b8793c" class="card"/>
<g data-bluetape4k-icon="generic/database-server" transform="translate(1432 328) scale(.22)">
  <rect x="10" y="8" width="108" height="112" rx="18" fill="#fffaf2" stroke="#28485a" stroke-width="6"/>
  <ellipse cx="64" cy="36" rx="34" ry="13" fill="#fff0d8" stroke="#8c6f33" stroke-width="6"/>
  <path d="M30 36v44c0 8 15 14 34 14s34-6 34-14V36" fill="#fff0d8" stroke="#8c6f33" stroke-width="6" stroke-linejoin="round"/>
  <ellipse cx="64" cy="36" rx="34" ry="13" fill="none" stroke="#8c6f33" stroke-width="5"/>
  <path d="M30 58c0 8 15 14 34 14s34-6 34-14" fill="none" stroke="#8c6f33" stroke-width="5" stroke-linecap="round"/>
  <path d="M30 80c0 8 15 14 34 14s34-6 34-14" fill="none" stroke="#8c6f33" stroke-width="5" stroke-linecap="round"/>
</g>
<text x="1463" y="396" class="label" text-anchor="middle">DB</text>
<text x="1463" y="430" class="tiny" text-anchor="middle">fixtures</text>
<text x="1463" y="448" class="tiny" text-anchor="middle">indexes</text>
<text x="1463" y="466" class="tiny" text-anchor="middle">constraints</text>
<text x="1463" y="484" class="tiny" text-anchor="middle">same rows</text>
<path data-connector="big-bang-to-crud-basics" d="M412,217 L488,217 Q500,217 500,205 L500,208 Q500,196 512,196 L610,196" class="arrow"/>
<path data-connector="parallel-equivalence-to-relations" d="M412,379 L488,379 Q500,379 500,367 L500,320 Q500,308 512,308 L610,308" class="mapLine"/>
<path data-connector="incremental-replacement-to-inheritance" d="M412,541 H610" class="arrow"/>
<path data-connector="crud-basics-to-row-equivalence" d="M902,196 L984,196 Q996,196 996,208 L996,216 Q996,228 1008,228 L1090,228" class="mapLine"/>
<path data-connector="relations-to-query-count" d="M902,308 L984,308 Q996,308 996,320 L996,352 Q996,364 1008,364 L1090,364" class="mapLine"/>
<path data-connector="advanced-queries-to-query-count" d="M902,420 L984,420 Q996,420 996,408 L996,376 Q996,364 1008,364 L1090,364" class="mapLine"/>
<path data-connector="inheritance-to-transaction-behavior" d="M902,532 L984,532 Q996,532 996,520 L996,512 Q996,500 1008,500 L1090,500" class="runtimeUse"/>
<path data-connector="consistency-to-lock-conflict" d="M902,644 L984,644 Q996,644 996,636 L1090,636" class="codecLine"/>
<path data-connector="row-equivalence-to-db" d="M1332,228 L1380,228 Q1392,228 1392,240 L1392,368 Q1392,380 1404,380" class="dbUse"/>
<path data-connector="query-count-to-db" d="M1332,364 L1380,364 Q1392,364 1392,376 L1392,406 Q1392,418 1404,418" class="dbUse"/>
<path data-connector="transaction-behavior-to-db" d="M1332,500 L1380,500 Q1392,500 1392,488 L1392,468 Q1392,456 1404,456" class="dbUse"/>
<path data-connector="lock-conflict-to-db" d="M1332,636 L1380,636 Q1392,636 1392,624 L1392,540 Q1392,528 1404,528" class="dbUse"/>
<rect x="128" y="806" width="1194" height="108" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.3"/>
<path d="M170,836 L230,836" class="arrow"/><text x="250" y="840" class="tiny">blue = high-risk or incremental option enters the migration order</text>
<path d="M662,836 L722,836" class="mapLine"/><text x="742" y="840" class="tiny">green = equivalence-first flow through ordered slices and verification gates</text>
<path d="M170,866 L230,866" class="dbUse"/><text x="250" y="870" class="tiny">brown = verification gates read/write the regression database</text>
<path d="M662,866 L722,866" class="runtimeUse"/><text x="742" y="870" class="tiny">dashed purple = transaction/runtime behavior checks</text>
<path d="M170,896 L230,896" class="codecLine"/><text x="250" y="900" class="tiny">pink = audit and optimistic-lock consistency checks</text>
<text x="742" y="900" class="tiny">Recommended route: migrate one feature slice at a time and lock each slice with equivalence tests.</text>
</svg>
