<line class="lifeline" x1="1292" y1="252" x2="1292" y2="1616" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="1526" y="166" width="300" height="72" rx="20" fill="#E9F7F6" stroke="#45A7A1"/>
<text class="smallLabel" x="1676" y="209" text-anchor="middle">TenantId</text>
<line class="lifeline" x1="1676" y1="252" x2="1676" y2="1616" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="1910" y="166" width="300" height="72" rx="20" fill="#F1ECFF" stroke="#8A72D6"/>
<text class="smallLabel" x="2060" y="209" text-anchor="middle">ActorController</text>
<line class="lifeline" x1="2060" y1="252" x2="2060" y2="1616" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="2294" y="166" width="300" height="72" rx="20" fill="#F7F1E7" stroke="#B88A44"/>
<text class="smallLabel" x="2444" y="198.5" text-anchor="middle">Actor Exposed</text>
<text class="smallLabel" x="2444" y="219.5" text-anchor="middle">Repository</text>
<line class="lifeline" x1="2444" y1="252" x2="2444" y2="1616" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="2678" y="166" width="300" height="72" rx="20" fill="#EEF6D9" stroke="#8BA84D"/>
<text class="smallLabel" x="2828" y="209" text-anchor="middle">Database</text>
<line class="lifeline" x1="2828" y1="252" x2="2828" y2="1616" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect x="164.5" y="286" width="335" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="182.5" y="313" text-anchor="start">1. GET /actors (X-TENANT-ID: english)</text>
<path class="line" d="M140 344 L524 344"/>
<rect x="593" y="396" width="246" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="611" y="423" text-anchor="start">2. filter(exchange, chain)</text>
<path class="line" d="M524 454 L908 454"/>
<rect x="872" y="506" width="456" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="890" y="533" text-anchor="start">3. contextWrite { put(TenantId, TenantId(ENGLISH)) }</text>
<path class="line" d="M908 564 L1292 564"/>
<rect x="1328.5" y="616" width="311" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1346.5" y="643" text-anchor="start">4. chain.filter(exchange) proceeds</text>
<path class="line" d="M908 674 L2060 674"/>
<rect x="1632" y="726" width="472" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1650" y="753" text-anchor="start">5. newSuspendedTransactionWithCurrentReactorTenant { }</text>
<path class="line" d="M2060 784 L1676 784"/>
<rect x="1236" y="836" width="496" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1254" y="863" text-anchor="start">6. coroutineContext[ReactorContext].context.get(TenantId)</text>
<path class="line" d="M1676 894 L1292 894"/>
<rect x="2101" y="946" width="302" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="2119" y="973" text-anchor="start">7. SchemaUtils.setSchema(english)</text>
<path class="line" d="M1676 1004 L2828 1004"/>
<rect x="2147" y="1056" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="2165" y="1083" text-anchor="start">8. findAll()</text>
<path class="line" d="M2060 1114 L2444 1114"/>
<rect x="2497" y="1166" width="278" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="2515" y="1193" text-anchor="start">9. SELECT * FROM english.actor</text>
<path class="line" d="M2444 1224 L2828 1224"/>
<rect x="2531" y="1276" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="2549" y="1303" text-anchor="start">10. ResultSet</text>
<path class="dashed" d="M2828 1334 L2444 1334"/>
<rect x="2147" y="1386" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="2165" y="1413" text-anchor="start">11. List~ActorRecord~</text>
<path class="dashed" d="M2444 1444 L2060 1444"/>
<rect x="924.5" y="1496" width="351" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="942.5" y="1523" text-anchor="start">12. 200 OK [{ firstName: Johnny, ... }]</text>
<path class="dashed" d="M2060 1554 L140 1554"/>
</svg>
