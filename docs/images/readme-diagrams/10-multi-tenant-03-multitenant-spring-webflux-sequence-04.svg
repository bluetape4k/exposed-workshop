<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 900" width="1500" height="900" role="img" aria-label="WebFlux multi-tenant request sequence">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/></filter>
    <marker id="arrowBlue" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#4f86c6" stroke="#4f86c6" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="arrowGreen" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6f8f58" stroke="#6f8f58" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="arrowAmber" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#a2743d" stroke="#a2743d" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="arrowPurple" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7a8445" stroke="#7a8445" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="arrowTeal" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2f9a94" stroke="#2f9a94" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="arrowGray" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6f8792" stroke="#6f8792" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <style>
      .canvas{fill:none}.frame{fill:#fbfcf8;stroke:#40545d;stroke-width:3}
      .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:31px;fill:#1e293b}
      .subtitle,.detail{font-family:"Comic Mono","Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;fill:#536476}
      .subtitle{font-size:13px}.detail{font-size:12px}.role{font-family:"Comic Mono","Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:10.5px;fill:#60727d}
      .participant{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:16px;fill:#1e293b}
      .card{stroke-width:1.7;filter:url(#shadow)}
      .header{fill:#ffffff;stroke:#b6d3ec;stroke-width:1.7;filter:url(#shadow)}
      .lifeline{stroke:#9cafb7;stroke-width:1.4;stroke-dasharray:5 6}
      .activation{fill:#f3ecdf;stroke:#8f784e;stroke-width:1.5}
      .call{fill:none;stroke:#4f86c6;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowBlue)}
      .contextCall{fill:none;stroke:#6f8f58;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowGreen)}
      .schemaCall{fill:none;stroke:#a2743d;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowAmber)}
      .repoCall{fill:none;stroke:#7a8445;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowPurple)}
      .sqlCall{fill:none;stroke:#2f9a94;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowTeal)}
      .returnLine{fill:none;stroke:#6f8792;stroke-width:2.2;stroke-dasharray:7 5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowGray)}
      .pill{stroke-width:1.6;filter:url(#shadow)}
      .badge{fill:#fff;stroke-width:1.4}
      .scope{fill:none;stroke:#8aa1ad;stroke-width:1.6;stroke-dasharray:9 7}
      .scopeTitle{fill:#fff;stroke:#8aa1ad;stroke-width:1.2}
    </style>
  </defs>
  <rect width="1500" height="900" class="canvas"/>
  <rect x="20" y="20" width="1460" height="860" rx="16" class="frame"/>
  <text x="48" y="58" class="title">WebFlux Coroutine Tenant Request</text>
  <text x="48" y="80" class="subtitle">Reactor Context carries TenantId into a suspended Exposed transaction before ActorTable is queried</text>

  <desc>Client</desc><rect x="46" y="128" width="150" height="62" rx="10" class="header card"/>
  <text x="121" y="156" class="participant" text-anchor="middle">Client</text>
  <text x="121" y="176" class="role" text-anchor="middle">HTTP caller</text>
  <line x1="121" y1="190" x2="121" y2="860" class="lifeline"/>

  <desc>TenantFilter</desc><rect x="234" y="128" width="170" height="62" rx="10" class="header card"/>
  <text x="319" y="156" class="participant" text-anchor="middle">TenantFilter</text>
  <text x="319" y="176" class="role" text-anchor="middle">WebFilter</text>
  <line x1="319" y1="190" x2="319" y2="860" class="lifeline"/>

  <desc>ReactorContext</desc><rect x="452" y="128" width="176" height="62" rx="10" class="header card"/>
  <text x="540" y="156" class="participant" text-anchor="middle">ReactorContext</text>
  <text x="540" y="176" class="role" text-anchor="middle">TenantId key</text>
  <line x1="540" y1="190" x2="540" y2="860" class="lifeline"/>

  <desc>ActorController</desc><rect x="676" y="128" width="166" height="62" rx="10" class="header card"/>
  <text x="759" y="156" class="participant" text-anchor="middle">ActorController</text>
  <text x="759" y="176" class="role" text-anchor="middle">suspend API</text>
  <line x1="759" y1="190" x2="759" y2="860" class="lifeline"/>

  <desc>TransactionHelper</desc><rect x="896" y="128" width="190" height="62" rx="10" class="header card"/>
  <text x="991" y="156" class="participant" text-anchor="middle">Tx Helper</text>
  <text x="991" y="176" class="role" text-anchor="middle">newSuspendedTransaction</text>
  <line x1="991" y1="190" x2="991" y2="860" class="lifeline"/>

  <desc>ActorRepository</desc><rect x="1138" y="128" width="176" height="62" rx="10" class="header card"/>
  <text x="1226" y="156" class="participant" text-anchor="middle">ActorRepository</text>
  <text x="1226" y="176" class="role" text-anchor="middle">Exposed JDBC</text>
  <line x1="1226" y1="190" x2="1226" y2="860" class="lifeline"/>

  <desc>Database</desc><rect x="1356" y="128" width="108" height="62" rx="10" class="header card"/>
  <text x="1410" y="156" class="participant" text-anchor="middle">Database</text>
  <text x="1410" y="176" class="role" text-anchor="middle">tenant schema</text>
  <line x1="1410" y1="190" x2="1410" y2="860" class="lifeline"/>

  <rect x="114" y="270" width="14" height="86" rx="6" class="activation"/>
  <rect x="312" y="300" width="14" height="190" rx="6" class="activation"/>
  <rect x="533" y="372" width="14" height="306" rx="6" class="activation"/>
  <rect x="752" y="444" width="14" height="276" rx="6" class="activation"/>
  <rect x="984" y="516" width="14" height="234" rx="6" class="activation"/>
  <rect x="1219" y="704" width="14" height="70" rx="6" class="activation"/>
  <rect x="1403" y="622" width="14" height="184" rx="6" class="activation"/>

  <rect x="76" y="226" width="392" height="34" rx="17" fill="#ffffff" stroke="#4f86c6" class="pill card"/>
  <circle cx="100" cy="243" r="14" class="badge" stroke="#4f86c6"/>
  <text x="100" y="248" class="detail" text-anchor="middle">1</text>
  <text x="125" y="249" class="detail">GET /actors with X-TENANT-ID</text>
  <path data-connector="request-enters-webfilter" d="M121,282 H319" class="call"/>

  <rect x="220" y="324" width="416" height="34" rx="17" fill="#ffffff" stroke="#6f8f58" class="pill card"/>
  <circle cx="244" cy="341" r="14" class="badge" stroke="#6f8f58"/>
  <text x="244" y="346" class="detail" text-anchor="middle">2</text>
  <text x="269" y="347" class="detail">contextWrite TenantId into Reactor</text>
  <path data-connector="filter-writes-reactor-context" d="M319,382 H540" class="contextCall"/>

  <rect x="230" y="416" width="426" height="34" rx="17" fill="#ffffff" stroke="#4f86c6" class="pill card"/>
  <circle cx="254" cy="433" r="14" class="badge" stroke="#4f86c6"/>
  <text x="254" y="438" class="detail" text-anchor="middle">3</text>
  <text x="279" y="439" class="detail">await chain.filter and enter suspend API</text>
  <path data-connector="filter-dispatches-suspend-controller" d="M319,474 H759" class="call"/>

  <rect x="460" y="498" width="1020" height="332" rx="18" class="scope"/>
  <rect x="494" y="478" width="270" height="34" rx="16" class="scopeTitle"/>
  <text x="629" y="500" class="detail" text-anchor="middle">suspended transaction boundary</text>

  <rect x="696" y="532" width="420" height="34" rx="17" fill="#ffffff" stroke="#a2743d" class="pill card"/>
  <circle cx="720" cy="549" r="14" class="badge" stroke="#a2743d"/>
  <text x="720" y="554" class="detail" text-anchor="middle">4</text>
  <text x="745" y="555" class="detail">newSuspendedTransactionWithCurrentReactorTenant</text>
  <path data-connector="controller-enters-transaction-helper" d="M759,584 H991" class="schemaCall"/>

  <rect x="760" y="614" width="420" height="34" rx="17" fill="#ffffff" stroke="#6f8f58" class="pill card"/>
  <circle cx="784" cy="631" r="14" class="badge" stroke="#6f8f58"/>
  <text x="784" y="636" class="detail" text-anchor="middle">5</text>
  <text x="809" y="637" class="detail">currentReactorTenant()</text>
  <path data-connector="helper-reads-reactor-context" d="M991,666 H540" class="contextCall"/>

  <rect x="982" y="696" width="430" height="34" rx="17" fill="#ffffff" stroke="#2f9a94" class="pill card"/>
  <circle cx="1006" cy="713" r="14" class="badge" stroke="#2f9a94"/>
  <text x="1006" y="718" class="detail" text-anchor="middle">6</text>
  <text x="1031" y="719" class="detail">SchemaUtils.setSchema(schema)</text>
  <path data-connector="helper-switches-schema" d="M991,748 H1410" class="sqlCall"/>

  <rect x="540" y="748" width="410" height="34" rx="17" fill="#ffffff" stroke="#7a8445" class="pill card"/>
  <circle cx="564" cy="765" r="14" class="badge" stroke="#7a8445"/>
  <text x="564" y="770" class="detail" text-anchor="middle">7</text>
  <text x="589" y="771" class="detail">actorRepository.findAll()</text>
  <path data-connector="controller-calls-actor-repository" d="M759,800 H1226" class="repoCall"/>

  <rect x="1086" y="806" width="336" height="34" rx="17" fill="#ffffff" stroke="#2f9a94" class="pill card"/>
  <circle cx="1110" cy="823" r="14" class="badge" stroke="#2f9a94"/>
  <text x="1110" y="828" class="detail" text-anchor="middle">8</text>
  <text x="1135" y="829" class="detail">select ActorTable rows</text>
  <path data-connector="repository-selects-actors" d="M1226,854 H1410" class="sqlCall"/>

  <path data-connector="database-returns-actor-records" d="M1410,872 H1226 H759" class="returnLine"/>
  <path data-connector="controller-returns-response" d="M759,842 H540 H319 H121" class="returnLine"/>
</svg>
