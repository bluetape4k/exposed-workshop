<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1120" viewBox="0 0 1900 1120" role="img" aria-labelledby="title desc">
  <title id="title">JaVers Exposed 감사 commit 순서</title>
  <desc id="desc">범위가 있는 context가 Exposed 트랜잭션을 감쌉니다. DAO hook은 마지막 flush 상태를 detached DTO로 변환하고 JaVers가 commit과 snapshot row를 저장하며 rollback은 모든 row를 제거합니다.</desc>
  <defs>
    <style>
      text { letter-spacing: 0; }
      .frame { fill: #fbfcf8; stroke: #40545d; stroke-width: 3; }.title { font-family: "Apple SD Gothic Neo", "Noto Sans KR", "Architects Daughter", sans-serif; font-size: 40px; fill: #263238; }.subtitle, .participant, .role, .labelText, .detail, .footer { font-family: "Apple SD Gothic Neo", "Noto Sans KR", "Comic Mono", sans-serif; fill: #34454d; }.subtitle { font-size: 17px; }.participant { font-family: "Apple SD Gothic Neo", "Noto Sans KR", "Architects Daughter", sans-serif; font-size: 22px; fill: #223238; }.role { font-size: 12px; fill: #53666e; }.header { fill: #ffffff; stroke: #617985; stroke-width: 2.2; }.lifeline { stroke: #9cafb7; stroke-width: 2.4; stroke-dasharray: 8 10; }.activation { fill: #fff7df; stroke: #b58a42; stroke-width: 2; }.callBlue, .callAmber, .callGreen, .callTeal, .return, .callRed { fill: none; stroke-width: 3.6; stroke-linecap: round; marker-end: url(#seqArrow); }.callBlue { stroke: #4f86c6; }.callAmber { stroke: #a2743d; }.callGreen { stroke: #5b8e51; }.callTeal { stroke: #2b8f88; }.callRed { stroke: #b65757; }.return { stroke: #2b8f88; stroke-dasharray: 10 7; }.label { fill: #ffffff; stroke: #b6d3ec; stroke-width: 1.8; }.amberLabel { stroke: #dfc291; }.greenLabel { stroke: #bdd6b4; }.tealLabel { stroke: #add7d3; }.redLabel { stroke: #e0b8b8; }.num { font-family: "Apple SD Gothic Neo", "Noto Sans KR", "Comic Mono", sans-serif; font-size: 15px; font-weight: 700; }.numCircle { fill: #ffffff; stroke: #78909c; stroke-width: 1.7; }.labelText { font-size: 13px; font-weight: 700; }.alt { fill: none; stroke: #8298a3; stroke-width: 2.8; stroke-dasharray: 10 8; }.branchDivider { stroke: #8298a3; stroke-width: 2.2; stroke-dasharray: 10 8; }.branchPill { fill: #fffdf6; stroke: #b58a42; stroke-width: 1.8; }.footer { font-size: 14px; fill: #60727d; }
    </style>
    <marker id="seqArrow" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" refX="9" refY="5" orient="auto" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#4f86c6" stroke="#4f86c6" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
  </defs>
  <rect x="24" y="24" width="1852" height="1072" rx="22" class="frame"/>
  <text x="950" y="78" text-anchor="middle" class="title">JaVers + Exposed 감사 순서</text><text x="950" y="110" text-anchor="middle" class="subtitle">범위가 있는 context와 JDBC 트랜잭션이 전체 commit lifecycle을 소유합니다.</text>
  <g id="participants">
    <rect x="65" y="150" width="205" height="80" rx="12" class="header"/><text x="167" y="184" text-anchor="middle" class="participant">Caller</text><text x="167" y="207" text-anchor="middle" class="role">test 또는 service</text>
    <rect x="305" y="150" width="205" height="80" rx="12" class="header"/><text x="407" y="184" text-anchor="middle" class="participant">Context</text><text x="407" y="207" text-anchor="middle" class="role">actor + requestId</text>
    <rect x="545" y="150" width="205" height="80" rx="12" class="header"/><text x="647" y="184" text-anchor="middle" class="participant">Exposed Tx</text><text x="647" y="207" text-anchor="middle" class="role">트랜잭션 경계</text>
    <rect x="785" y="150" width="205" height="80" rx="12" class="header"/><text x="887" y="184" text-anchor="middle" class="participant">EntityHook</text><text x="887" y="207" text-anchor="middle" class="role">마지막 DAO event</text>
    <rect x="1025" y="150" width="205" height="80" rx="12" class="header"/><text x="1127" y="184" text-anchor="middle" class="participant">JaVers</text><text x="1127" y="207" text-anchor="middle" class="role">commit + diff</text>
    <rect x="1265" y="150" width="205" height="80" rx="12" class="header"/><text x="1367" y="184" text-anchor="middle" class="participant">JDBC tables</text><text x="1367" y="207" text-anchor="middle" class="role">commit + snapshot</text>
    <rect x="1505" y="150" width="205" height="80" rx="12" class="header"/><text x="1607" y="184" text-anchor="middle" class="participant">History</text><text x="1607" y="207" text-anchor="middle" class="role">읽기 전용 query</text>
  </g>
  <path d="M167 230 L167 1030" class="lifeline"/><path d="M407 230 L407 1030" class="lifeline"/><path d="M647 230 L647 1030" class="lifeline"/><path d="M887 230 L887 1030" class="lifeline"/><path d="M1127 230 L1127 1030" class="lifeline"/><path d="M1367 230 L1367 1030" class="lifeline"/><path d="M1607 230 L1607 1030" class="lifeline"/>
  <rect x="397" y="260" width="20" height="185" rx="6" class="activation"/><rect x="637" y="360" width="20" height="610" rx="6" class="activation"/><rect x="877" y="455" width="20" height="170" rx="6" class="activation"/><rect x="1117" y="625" width="20" height="160" rx="6" class="activation"/><rect x="1597" y="900" width="20" height="75" rx="6" class="activation"/>
  <rect x="188" y="250" width="260" height="32" rx="16" class="label"/><circle cx="210" cy="266" r="14" class="numCircle"/><text x="210" y="271" text-anchor="middle" class="num">1</text><text x="235" y="271" class="labelText">with(AuditContext)</text><path data-connector="seq-1" d="M167 300 L407 300" class="callAmber"/>
  <rect x="324" y="350" width="280" height="32" rx="16" class="label amberLabel"/><circle cx="346" cy="366" r="14" class="numCircle"/><text x="346" y="371" text-anchor="middle" class="num">2</text><text x="371" y="371" class="labelText">transaction(database)</text><path data-connector="seq-2" d="M167 400 L647 400" class="callBlue"/>
  <rect x="672" y="445" width="245" height="32" rx="16" class="label greenLabel"/><circle cx="694" cy="461" r="14" class="numCircle"/><text x="694" y="466" text-anchor="middle" class="num">3</text><text x="719" y="466" class="labelText">CustomerEntity.new</text><path data-connector="seq-3" d="M647 500 L887 500" class="callGreen"/>
  <rect x="560" y="540" width="290" height="32" rx="16" class="label tealLabel"/><circle cx="582" cy="556" r="14" class="numCircle"/><text x="582" y="561" text-anchor="middle" class="num">4</text><text x="607" y="561" class="labelText">requireCurrent metadata</text><path data-connector="seq-4" d="M887 595 L407 595" class="return"/>
  <rect x="910" y="610" width="260" height="32" rx="16" class="label greenLabel"/><circle cx="932" cy="626" r="14" class="numCircle"/><text x="932" y="631" text-anchor="middle" class="num">5</text><text x="957" y="631" class="labelText">javers.commit(dto)</text><path data-connector="seq-5" d="M887 665 L1127 665" class="callGreen"/>
  <rect x="1135" y="705" width="300" height="32" rx="16" class="label amberLabel"/><circle cx="1157" cy="721" r="14" class="numCircle"/><text x="1157" y="726" text-anchor="middle" class="num">6</text><text x="1182" y="726" class="labelText">save commit + snapshot</text><path data-connector="seq-6" d="M1127 760 L1367 760" class="callAmber"/>
  <rect x="1020" y="805" width="300" height="32" rx="16" class="label tealLabel"/><circle cx="1042" cy="821" r="14" class="numCircle"/><text x="1042" y="826" text-anchor="middle" class="num">7</text><text x="1067" y="826" class="labelText">history snapshots/changes</text><path data-connector="seq-7" d="M167 860 L1607 860" class="callTeal"/>
  <rect x="75" y="890" width="1635" height="150" rx="18" class="alt"/><rect x="100" y="875" width="230" height="32" rx="16" class="branchPill"/><text x="125" y="896" class="detail">transaction outcome</text><line x1="75" y1="965" x2="1710" y2="965" class="branchDivider"/>
  <rect x="360" y="910" width="260" height="30" rx="15" class="label greenLabel"/><text x="385" y="930" class="labelText">commit → row 유지</text><path data-connector="branch-commit" d="M647 945 L1367 945" class="callGreen"/>
  <rect x="360" y="980" width="290" height="30" rx="15" class="label redLabel"/><text x="385" y="1000" class="labelText">rollback → 모든 row 제거</text><path data-connector="branch-rollback" d="M647 1015 L1367 1015" class="callRed"/>
  <text x="950" y="1070" text-anchor="middle" class="footer">provider는 같은 JDBC 트랜잭션으로 write하며, context가 없으면 익명 commit 전에 fail closed합니다.</text>
</svg>
