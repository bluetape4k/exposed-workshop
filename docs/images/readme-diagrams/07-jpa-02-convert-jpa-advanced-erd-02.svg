<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1020" width="1440" height="1020" role="img" aria-label="07 JPA Advanced Migration ERD 2">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12" /></filter>
    <marker id="relArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b" stroke="#64748b" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <style>
      .canvas{fill:#f6f9fc}.frame{fill:#fff;stroke:#d7e2ec;stroke-width:1.5}.panel{fill:#f8fafc;stroke:#d7e2ec;stroke-width:1.2}.panelSoft{fill:#fbfdff;stroke:#d7e2ec;stroke-width:1.2}.card{stroke-width:1.8;filter:url(#shadow)}.header{opacity:.96}
      .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:34px;fill:#1e293b}.subtitle{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:13px;fill:#536476}.panelTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:15px;letter-spacing:.08em;fill:#94a3b8}.smallLabel{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:18px;fill:#1e293b}.tiny{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:11px;fill:#64748b}.noteText{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:12px;font-weight:700;fill:#475569}
      .connector{fill:none;stroke:#64748b;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#relArrow)}.optional{fill:none;stroke:#64748b;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:7 6;marker-end:url(#relArrow)}.badgeBox{fill:#ffffff;stroke:#94a3b8;stroke-width:1.2;opacity:.97}.badgeText{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:14px;font-weight:800;fill:#334155}.noteBox{fill:#ecfdf5;stroke:#86efac;stroke-width:1.2}
    </style>
  </defs>
<rect width="1440" height="1020" class="canvas"/>
<rect x="20" y="20" width="1400" height="980" rx="18" class="frame"/>
<text x="56" y="68" class="title">07 JPA Advanced Migration ERD 2</text>
<text x="56" y="94" class="subtitle">Joined inheritance, optional references, and self-reference are laid out as separate readable relationship groups.</text>
<rect x="56" y="130" width="1328" height="520" rx="18" class="panel"/>
<text x="720" y="158" class="panelTitle" text-anchor="middle">JOINED INHERITANCE AND OPTIONAL REFERENCES</text>
<rect x="56" y="690" width="1328" height="210" rx="18" class="panelSoft"/>
<text x="720" y="718" class="panelTitle" text-anchor="middle">INDEPENDENT STRATEGIES (NO FK RELATIONSHIP IN THIS VIEW)</text>
<path class="connector" d="M300 316 V420" data-connector="Person id to Customer id"/>
<g class="cardinality" data-cardinality="1 : 1"><rect class="badgeBox" x="209" y="354" width="78" height="24" rx="8"/><text class="badgeText" x="248" y="372" text-anchor="middle">1 : 1</text></g>
<path class="connector" d="M470 316 V420" data-connector="Person id to Employee id"/>
<g class="cardinality" data-cardinality="1 : 1"><rect class="badgeBox" x="483" y="354" width="78" height="24" rx="8"/><text class="badgeText" x="522" y="372" text-anchor="middle">1 : 1</text></g>
<path class="optional" d="M710 502 H752 Q772 502 772 482 V446 Q772 426 752 426 H710" data-connector="Employee manager_id self reference"/>
<g class="cardinality" data-cardinality="0..1 : N"><rect class="badgeBox" x="751" y="448" width="78" height="24" rx="8"/><text class="badgeText" x="790" y="466" text-anchor="middle">0..1 : N</text></g>
<path class="optional" d="M370 552 H430" data-connector="Customer contact_employee_id to Employee id"/>
<g class="cardinality" data-cardinality="0..1 : N"><rect class="badgeBox" x="361" y="526" width="78" height="24" rx="8"/><text class="badgeText" x="400" y="544" text-anchor="middle">0..1 : N</text></g>
<path class="optional" d="M1060 502 H1110 Q1130 502 1130 640 Q1130 660 1110 660 H876 Q856 660 856 640 V576" data-connector="Tree parent_id self reference"/>
<g class="cardinality" data-cardinality="0..1 : N"><rect class="badgeBox" x="961" y="628" width="78" height="24" rx="8"/><text class="badgeText" x="1000" y="646" text-anchor="middle">0..1 : N</text></g>
<g data-card="Person Table">
<rect x="250" y="190" width="300" height="126" rx="14" fill="#fff" stroke="#7c3aed" class="card"/>
<path class="header" d="M250,234 L250,204 Q250,190 264,190 L536,190 Q550,190 550,204 L550,234 Z" fill="#ede9fe"/>
<text x="400.0" y="219" class="smallLabel" text-anchor="middle">Person Table</text>
<text x="272" y="258" class="tiny">id PK</text>
<text x="272" y="275" class="tiny">person_name varchar</text>
<text x="272" y="292" class="tiny">ssn varchar</text>
<text x="272" y="309" class="tiny">unique(name, ssn)</text>
</g>
<g data-card="Customer Table">
<rect x="90" y="420" width="280" height="156" rx="14" fill="#fff" stroke="#ea580c" class="card"/>
<path class="header" d="M90,464 L90,434 Q90,420 104,420 L356,420 Q370,420 370,434 L370,464 Z" fill="#ffedd5"/>
<text x="230.0" y="449" class="smallLabel" text-anchor="middle">Customer Table</text>
<text x="112" y="488" class="tiny">id PK/FK → Person.id</text>
<text x="112" y="505" class="tiny">mobile varchar</text>
<text x="112" y="522" class="tiny">customer_grade varchar</text>
<text x="112" y="539" class="tiny">contact_employee_id FK nullable</text>
</g>
<g data-card="Employee Table">
<rect x="430" y="420" width="280" height="156" rx="14" fill="#fff" stroke="#16a34a" class="card"/>
<path class="header" d="M430,464 L430,434 Q430,420 444,420 L696,420 Q710,420 710,434 L710,464 Z" fill="#dcfce7"/>
<text x="570.0" y="449" class="smallLabel" text-anchor="middle">Employee Table</text>
<text x="452" y="488" class="tiny">id PK/FK → Person.id</text>
<text x="452" y="505" class="tiny">emp_no varchar</text>
<text x="452" y="522" class="tiny">emp_title varchar</text>
<text x="452" y="539" class="tiny">manager_id FK nullable</text>
</g>
<g data-card="Tree Node Table">
<rect x="820" y="420" width="240" height="156" rx="14" fill="#fff" stroke="#d97706" class="card"/>
<path class="header" d="M820,464 L820,434 Q820,420 834,420 L1046,420 Q1060,420 1060,434 L1060,464 Z" fill="#fef3c7"/>
<text x="940.0" y="449" class="smallLabel" text-anchor="middle">Tree Node Table</text>
<text x="842" y="488" class="tiny">id PK</text>
<text x="842" y="505" class="tiny">title varchar</text>
<text x="842" y="522" class="tiny">description nullable</text>
<text x="842" y="539" class="tiny">depth integer</text>
<text x="842" y="556" class="tiny">parent_id FK nullable</text>
</g>
<g data-card="Billing Table">
<rect x="90" y="750" width="220" height="126" rx="14" fill="#fff" stroke="#3b82f6" class="card"/>
<path class="header" d="M90,794 L90,764 Q90,750 104,750 L296,750 Q310,750 310,764 L310,794 Z" fill="#dbeafe"/>
<text x="200.0" y="779" class="smallLabel" text-anchor="middle">Billing Table</text>
<text x="112" y="818" class="tiny">id PK</text>
<text x="112" y="835" class="tiny">owner / swift</text>
<text x="112" y="852" class="tiny">card_number</text>
<text x="112" y="869" class="tiny">company_name / exp_month</text>
</g>
<g data-card="Credit Card Table">
<rect x="350" y="750" width="220" height="126" rx="14" fill="#fff" stroke="#db2777" class="card"/>
<path class="header" d="M350,794 L350,764 Q350,750 364,750 L556,750 Q570,750 570,764 L570,794 Z" fill="#fce7f3"/>
<text x="460.0" y="779" class="smallLabel" text-anchor="middle">Credit Card Table</text>
<text x="372" y="818" class="tiny">card_number</text>
<text x="372" y="835" class="tiny">company_name</text>
<text x="372" y="852" class="tiny">exp_year / exp_month</text>
<text x="372" y="869" class="tiny">start_date / end_date</text>
</g>
<g data-card="Bank Account Table">
<rect x="610" y="750" width="220" height="126" rx="14" fill="#fff" stroke="#0f766e" class="card"/>
<path class="header" d="M610,794 L610,764 Q610,750 624,750 L816,750 Q830,750 830,764 L830,794 Z" fill="#ccfbf1"/>
<text x="720.0" y="779" class="smallLabel" text-anchor="middle">Bank Account Table</text>
<text x="632" y="818" class="tiny">account_number</text>
<text x="632" y="835" class="tiny">bank_name</text>
</g>
<g data-card="Task Table">
<rect x="870" y="750" width="220" height="126" rx="14" fill="#fff" stroke="#64748b" class="card"/>
<path class="header" d="M870,794 L870,764 Q870,750 884,750 L1076,750 Q1090,750 1090,764 L1090,794 Z" fill="#e2e8f0"/>
<text x="980.0" y="779" class="smallLabel" text-anchor="middle">Task Table</text>
<text x="892" y="818" class="tiny">id PK</text>
<text x="892" y="835" class="tiny">title</text>
<text x="892" y="852" class="tiny">description</text>
<text x="892" y="869" class="tiny">status</text>
</g>
<g data-card="Products">
<rect x="1130" y="750" width="220" height="126" rx="14" fill="#fff" stroke="#3b82f6" class="card"/>
<path class="header" d="M1130,794 L1130,764 Q1130,750 1144,750 L1336,750 Q1350,750 1350,764 L1350,794 Z" fill="#dbeafe"/>
<text x="1240.0" y="779" class="smallLabel" text-anchor="middle">Products</text>
<text x="1152" y="818" class="tiny">id PK</text>
<text x="1152" y="835" class="tiny">name</text>
<text x="1152" y="852" class="tiny">price</text>
<text x="1152" y="869" class="tiny">version</text>
</g>
<rect x="148" y="930" width="1144" height="42" rx="12" class="noteBox"/><text x="720" y="956" class="noteText" text-anchor="middle">Solid = shared-primary-key 1:1 inheritance; dashed = nullable FK/self-reference; lower cards are independent example tables.</text>
</svg>
