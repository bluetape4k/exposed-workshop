<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1102 740" width="1102" height="740" role="img" aria-label="Single table inheritance ERD for BillingTable">
  <defs>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="136%">
      <feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
    <style>
      .canvas{fill:#f6f9fc}
      .frame{fill:#ffffff;stroke:#d7e2ec;stroke-width:1.5}
      .tableBox{fill:#ffffff;stroke:#3b82f6;stroke-width:1.9;filter:url(#shadow)}
      .tableHead{fill:#dbeafe}
      .title{font-family:"Architects Daughter";font-size:32px;fill:#1e293b}
      .subtitle{font-family:"Comic Mono";font-size:13px;fill:#536476}
      .tableTitle{font-family:"Architects Daughter";font-size:22px;fill:#1e293b}
      .section{font-family:"Architects Daughter";font-size:16px;fill:#334155}
      .field{font-family:"Comic Mono";font-size:13px;fill:#475569}
      .pk{fill:#1e3a8a;font-weight:700}
      .dtype{fill:#7c4a03;font-weight:700}
      .nullable{fill:#64748b}
      .noteBox{fill:#f8fafc;stroke:#d7e2ec;stroke-width:1.2;filter:url(#shadow)}
      .noteTitle{font-family:"Architects Daughter";font-size:17px;fill:#1e293b}
      .note{font-family:"Comic Mono";font-size:12px;fill:#475569}
      .divider{stroke:#cbd5e1;stroke-width:1.2;stroke-dasharray:6 6}
    </style>
  </defs>

  <rect width="1102" height="740" class="canvas"/>
  <rect x="20" y="20" width="1062" height="700" rx="16" class="frame"/>
  <text x="48" y="60" class="title">Single Table Inheritance ERD</text>
  <text x="48" y="83" class="subtitle">CreditCard and BankAccount share one billing table; dtype selects the subtype.</text>

  <g id="billing-table" data-node="billing">
    <rect x="302" y="122" width="498" height="500" rx="12" class="tableBox"/>
    <path d="M302,166 L302,134 Q302,122 314,122 L788,122 Q800,122 800,134 L800,166 Z" class="tableHead"/>
    <text x="551" y="153" class="tableTitle" text-anchor="middle">billing</text>

    <text x="332" y="202" class="section">Common columns</text>
    <text x="352" y="230" class="field pk">id SERIAL PRIMARY KEY</text>
    <text x="352" y="252" class="field">owner varchar(64) indexed</text>
    <text x="352" y="274" class="field">swift varchar(16)</text>
    <text x="352" y="296" class="field dtype">dtype BillingType default UNKNOWN</text>

    <line x1="332" y1="322" x2="770" y2="322" class="divider"/>
    <text x="332" y="352" class="section">CreditCard nullable columns</text>
    <text x="352" y="380" class="field nullable">card_number varchar(24)?</text>
    <text x="352" y="402" class="field nullable">company_name varchar(255)?</text>
    <text x="352" y="424" class="field nullable">exp_month int?</text>
    <text x="352" y="446" class="field nullable">exp_year int?</text>
    <text x="352" y="468" class="field nullable">start_date date?</text>
    <text x="352" y="490" class="field nullable">end_date date?</text>

    <line x1="332" y1="514" x2="770" y2="514" class="divider"/>
    <text x="332" y="544" class="section">BankAccount nullable columns</text>
    <text x="352" y="572" class="field nullable">account_number varchar(255)?</text>
    <text x="352" y="594" class="field nullable">bank_name varchar(255)?</text>
  </g>

  <g id="credit-note" data-node="credit-card-rule">
    <rect x="70" y="198" width="190" height="118" rx="10" class="noteBox"/>
    <text x="165" y="232" class="noteTitle" text-anchor="middle">CreditCard DAO</text>
    <text x="92" y="262" class="note">new() sets dtype</text>
    <text x="92" y="282" class="note">CREDIT_CARD</text>
    <text x="92" y="302" class="note">findById filters dtype</text>
  </g>

  <g id="bank-note" data-node="bank-account-rule">
    <rect x="842" y="198" width="190" height="118" rx="10" class="noteBox"/>
    <text x="937" y="232" class="noteTitle" text-anchor="middle">BankAccount DAO</text>
    <text x="864" y="262" class="note">new() sets dtype</text>
    <text x="864" y="282" class="note">BANK_ACCOUNT</text>
    <text x="864" y="302" class="note">findById filters dtype</text>
  </g>

  <rect x="70" y="650" width="962" height="40" rx="10" fill="#f8fafc" stroke="#d7e2ec" stroke-width="1.2"/>
  <text x="551" y="675" class="note" text-anchor="middle">One physical table means no table-to-table relation lines; subtype safety is enforced by dtype-aware DAO queries.</text>
</svg>
