<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" role="img" aria-label="Cache strategies domain ERD">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
    <style>
      text { letter-spacing: 0; }
      .canvas { fill: #fbfcf8; stroke: #3f515a; stroke-width: 3; }
      .title { font-family: "Architects Daughter","Comic Sans MS",cursive; font-size: 34px; fill: #23323a; }
      .subtitle,.field,.note,.relLabel,.cardinality { font-family: "Comic Mono","Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif; fill: #324750; }
      .subtitle { font-size: 14px; }
      .table { fill: #fff; stroke-width: 2.3; filter: url(#shadow); }
      .userTable { stroke: #5d948b; }
      .credentialsTable { stroke: #ac7a34; }
      .eventTable { stroke: #7b6bb4; }
      .headerUser { fill: #eef7f5; }
      .headerCredentials { fill: #fff7e8; }
      .headerEvent { fill: #f5f3fb; }
      .tableTitle { font-family: "Architects Daughter","Comic Sans MS",cursive; font-size: 22px; fill: #20323b; }
      .tableName { font-family: "Comic Mono","Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif; font-size: 12px; fill: #60717a; }
      .field { font-size: 13px; }
      .fieldStrong { font-weight: 700; }
      .relation { fill: none; stroke: #3f515a; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .relLabel { font-size: 12px; font-weight: 700; }
      .cardinality { font-size: 14px; font-weight: 700; }
      .note { font-size: 12px; fill: #60717a; }
    </style>
  </defs>

  <rect x="24" y="24" width="1152" height="772" rx="20" class="canvas"/>
  <text x="600" y="74" text-anchor="middle" class="title">Cache Strategies Domain ERD</text>
  <text x="600" y="104" text-anchor="middle" class="subtitle">Tables are sourced from Exposed table objects; username relationships are logical cache-domain links, not declared foreign keys.</text>

  <rect id="users" x="100" y="165" width="390" height="320" rx="12" class="table userTable"/>
  <path d="M 100 217 L 100 177 Q 100 165 112 165 L 478 165 Q 490 165 490 177 L 490 217 Z" class="headerUser"/>
  <text x="295" y="196" text-anchor="middle" class="tableTitle">UserTable</text>
  <text x="295" y="213" text-anchor="middle" class="tableName">users</text>
  <text x="132" y="248" class="field fieldStrong">id PK Long</text>
  <text x="132" y="272" class="field fieldStrong">username varchar unique</text>
  <text x="132" y="296" class="field">first_name varchar</text>
  <text x="132" y="320" class="field">last_name varchar</text>
  <text x="132" y="344" class="field">address varchar nullable</text>
  <text x="132" y="368" class="field">zipcode varchar nullable</text>
  <text x="132" y="392" class="field">birth_date date nullable</text>
  <text x="132" y="416" class="field">avatar blob nullable</text>
  <text x="132" y="440" class="field">created_at / updated_at timestamp</text>

  <rect id="credentials" x="710" y="165" width="390" height="250" rx="12" class="table credentialsTable"/>
  <path d="M 710 217 L 710 177 Q 710 165 722 165 L 1088 165 Q 1100 165 1100 177 L 1100 217 Z" class="headerCredentials"/>
  <text x="905" y="196" text-anchor="middle" class="tableTitle">UserCredentialsTable</text>
  <text x="905" y="213" text-anchor="middle" class="tableName">user_credentials</text>
  <text x="742" y="248" class="field fieldStrong">id PK Timebased UUID Base62</text>
  <text x="742" y="272" class="field fieldStrong">username varchar unique</text>
  <text x="742" y="296" class="field">email varchar</text>
  <text x="742" y="320" class="field">last_login_at timestamp nullable</text>
  <text x="742" y="344" class="field">created_at timestamp</text>
  <text x="742" y="368" class="field">updated_at timestamp nullable</text>

  <rect id="events" x="100" y="575" width="500" height="170" rx="12" class="table eventTable"/>
  <path d="M 100 627 L 100 587 Q 100 575 112 575 L 588 575 Q 600 575 600 587 L 600 627 Z" class="headerEvent"/>
  <text x="350" y="606" text-anchor="middle" class="tableTitle">UserEventTable</text>
  <text x="350" y="623" text-anchor="middle" class="tableName">user_action</text>
  <text x="132" y="656" class="field fieldStrong">id PK Long</text>
  <text x="132" y="680" class="field fieldStrong">username varchar indexed with event_time</text>
  <text x="132" y="704" class="field">event_source varchar</text>
  <text x="132" y="728" class="field">event_type enum</text>
  <text x="360" y="704" class="field">event_details varchar nullable</text>
  <text x="360" y="728" class="field">event_time timestamp</text>

  <path id="rel-users-credentials" data-connector="rel-users-credentials" d="M 490 272 L 710 272" class="relation"/>
  <text x="512" y="258" text-anchor="middle" class="cardinality">1</text>
  <text x="688" y="258" text-anchor="middle" class="cardinality">1</text>
  <text x="600" y="252" text-anchor="middle" class="relLabel">username lookup</text>

  <path id="rel-users-events" data-connector="rel-users-events" d="M 295 485 L 295 575" class="relation"/>
  <text x="314" y="508" text-anchor="middle" class="cardinality">1</text>
  <text x="314" y="560" text-anchor="middle" class="cardinality">N</text>
  <text x="430" y="535" text-anchor="middle" class="relLabel">username event stream</text>

  <rect x="710" y="520" width="390" height="132" rx="12" fill="#ffffff" stroke="#d7e2de" stroke-width="1.5"/>
  <text x="742" y="554" class="note">Cache strategy mapping:</text>
  <text x="742" y="580" class="note">UserTable: read-through + write-through</text>
  <text x="742" y="604" class="note">UserCredentialsTable: read-only cache</text>
  <text x="742" y="628" class="note">UserEventTable: write-behind async persistence</text>
</svg>
