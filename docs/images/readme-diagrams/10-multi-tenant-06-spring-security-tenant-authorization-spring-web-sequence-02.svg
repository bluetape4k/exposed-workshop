<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1740 1160" width="1740" height="1160" role="img" aria-label="Spring Security tenant authorization request sequence">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowBlue" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#4f86c6" stroke="#4f86c6" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="arrowGreen" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#6f8f58" stroke="#6f8f58" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="arrowAmber" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#a2743d" stroke="#a2743d" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="arrowPurple" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#7a8445" stroke="#7a8445" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="arrowTeal" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2f9a94" stroke="#2f9a94" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="arrowGray" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#6f8792" stroke="#6f8792" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <style>
      .canvas{fill:#f6f9fc}
      .frame{fill:#fff;stroke:#d7e2ec;stroke-width:1.5}
      .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:31px;fill:#1e293b}
      .subtitle,.detail{font-family:"Comic Mono","Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;fill:#536476}
      .subtitle{font-size:13px}
      .detail{font-size:12px}
      .role{font-family:"Comic Mono","Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:10.5px;fill:#60727d}
      .participant{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:15.5px;fill:#1e293b}
      .card{stroke-width:1.7;filter:url(#shadow)}
      .header{fill:#ffffff;stroke:#b6d3ec;stroke-width:1.7;filter:url(#shadow)}
      .lifeline{stroke:#9cafb7;stroke-width:1.4;stroke-dasharray:5 6}
      .activation{fill:#f3ecdf;stroke:#8f784e;stroke-width:1.5}
      .call{fill:none;stroke:#4f86c6;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowBlue)}
      .contextCall{fill:none;stroke:#6f8f58;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowGreen)}
      .txCall{fill:none;stroke:#a2743d;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowAmber)}
      .repoCall{fill:none;stroke:#7a8445;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowPurple)}
      .sqlCall{fill:none;stroke:#2f9a94;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowTeal)}
      .returnLine{fill:none;stroke:#6f8792;stroke-width:2.2;stroke-dasharray:7 5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowGray)}
      .pill{stroke-width:1.6;filter:url(#shadow)}
      .badge{fill:#fff;stroke-width:1.4}
      .scope{fill:none;stroke:#8aa1ad;stroke-width:1.6;stroke-dasharray:9 7}
      .scopeTitle{fill:#fff;stroke:#8aa1ad;stroke-width:1.2}
      .note{fill:#fff;stroke:#d7e2ec;stroke-width:1.4}
    </style>
  </defs>
  <rect width="1740" height="1160" class="canvas"/>
  <rect x="20" y="20" width="1700" height="1120" rx="16" class="frame"/>
  <text x="48" y="58" class="title">Spring Security Tenant Authorization Request Flow</text>
  <text x="48" y="80" class="subtitle">Credential identity and X-Tenant-ID must agree before the request reaches tenant-local Exposed work.</text>

  <rect x="42" y="128" width="112" height="62" rx="10" class="header card"/>
  <text x="98" y="156" class="participant" text-anchor="middle">Client</text>
  <text x="98" y="176" class="role" text-anchor="middle">HTTP caller</text>
  <line x1="98" y1="190" x2="98" y2="1088" class="lifeline"/>

  <rect x="186" y="128" width="140" height="62" rx="10" class="header card"/>
  <text x="256" y="156" class="participant" text-anchor="middle">ConflictFilter</text>
  <text x="256" y="176" class="role" text-anchor="middle">one credential</text>
  <line x1="256" y1="190" x2="256" y2="1088" class="lifeline"/>

  <rect x="364" y="128" width="138" height="62" rx="10" class="header card"/>
  <text x="433" y="156" class="participant" text-anchor="middle">Auth filters</text>
  <text x="433" y="176" class="role" text-anchor="middle">JWT / key / session</text>
  <line x1="433" y1="190" x2="433" y2="1088" class="lifeline"/>

  <rect x="544" y="128" width="156" height="62" rx="10" class="header card"/>
  <text x="622" y="156" class="participant" text-anchor="middle">AuthzFilter</text>
  <text x="622" y="176" class="role" text-anchor="middle">tenant match</text>
  <line x1="622" y1="190" x2="622" y2="1088" class="lifeline"/>

  <rect x="742" y="128" width="154" height="62" rx="10" class="header card"/>
  <text x="819" y="156" class="participant" text-anchor="middle">TenantContext</text>
  <text x="819" y="176" class="role" text-anchor="middle">ThreadLocal</text>
  <line x1="819" y1="190" x2="819" y2="1088" class="lifeline"/>

  <rect x="940" y="128" width="154" height="62" rx="10" class="header card"/>
  <text x="1017" y="156" class="participant" text-anchor="middle">Controller</text>
  <text x="1017" y="176" class="role" text-anchor="middle">service boundary</text>
  <line x1="1017" y1="190" x2="1017" y2="1088" class="lifeline"/>

  <rect x="1136" y="128" width="160" height="62" rx="10" class="header card"/>
  <text x="1216" y="156" class="participant" text-anchor="middle">Repository</text>
  <text x="1216" y="176" class="role" text-anchor="middle">ExposedInventory</text>
  <line x1="1216" y1="190" x2="1216" y2="1088" class="lifeline"/>

  <rect x="1336" y="128" width="152" height="62" rx="10" class="header card"/>
  <text x="1412" y="156" class="participant" text-anchor="middle">TenantTx</text>
  <text x="1412" y="176" class="role" text-anchor="middle">transaction()</text>
  <line x1="1412" y1="190" x2="1412" y2="1088" class="lifeline"/>

  <rect x="1520" y="128" width="136" height="62" rx="10" class="header card"/>
  <text x="1588" y="156" class="participant" text-anchor="middle">Registry</text>
  <text x="1588" y="176" class="role" text-anchor="middle">tenant DB</text>
  <line x1="1588" y1="190" x2="1588" y2="1088" class="lifeline"/>

  <rect x="1660" y="128" width="66" height="62" rx="10" class="header card"/>
  <text x="1693" y="156" class="participant" text-anchor="middle">H2</text>
  <text x="1693" y="176" class="role" text-anchor="middle">tenant</text>
  <line x1="1693" y1="190" x2="1693" y2="1088" class="lifeline"/>

  <rect x="91" y="278" width="14" height="70" rx="6" class="activation"/>
  <rect x="249" y="302" width="14" height="88" rx="6" class="activation"/>
  <rect x="426" y="388" width="14" height="76" rx="6" class="activation"/>
  <rect x="615" y="456" width="14" height="570" rx="6" class="activation"/>
  <rect x="812" y="550" width="14" height="470" rx="6" class="activation"/>
  <rect x="1010" y="622" width="14" height="356" rx="6" class="activation"/>
  <rect x="1209" y="700" width="14" height="286" rx="6" class="activation"/>
  <rect x="1405" y="778" width="14" height="176" rx="6" class="activation"/>
  <rect x="1581" y="850" width="14" height="68" rx="6" class="activation"/>
  <rect x="1686" y="920" width="14" height="84" rx="6" class="activation"/>

  <rect x="48" y="226" width="402" height="46" rx="18" fill="#ffffff" stroke="#4f86c6" class="pill card"/>
  <circle cx="72" cy="249" r="14" class="badge" stroke="#4f86c6"/>
  <text x="72" y="254" class="detail" text-anchor="middle">1</text>
  <text x="97" y="255" class="detail">GET /inventory/{sku}, credential, X-Tenant-ID</text>
  <path data-connector="client-enters-conflict-filter" d="M 98 286 H 256" class="call"/>

  <rect x="144" y="312" width="372" height="46" rx="18" fill="#ffffff" stroke="#4f86c6" class="pill card"/>
  <circle cx="168" cy="335" r="14" class="badge" stroke="#4f86c6"/>
  <text x="168" y="340" class="detail" text-anchor="middle">2</text>
  <text x="193" y="341" class="detail">verify exactly one credential source</text>
  <path data-connector="conflict-filter-continues-auth" d="M 256 372 H 433" class="call"/>

  <rect x="306" y="398" width="420" height="46" rx="18" fill="#ffffff" stroke="#6f8f58" class="pill card"/>
  <circle cx="330" cy="421" r="14" class="badge" stroke="#6f8f58"/>
  <text x="330" y="426" class="detail" text-anchor="middle">3</text>
  <text x="355" y="427" class="detail">authenticate JWT, API key, or demo session</text>
  <path data-connector="auth-filters-send-principal" d="M 433 458 H 622" class="contextCall"/>

  <rect x="500" y="484" width="430" height="46" rx="18" fill="#ffffff" stroke="#a2743d" class="pill card"/>
  <circle cx="524" cy="507" r="14" class="badge" stroke="#a2743d"/>
  <text x="524" y="512" class="detail" text-anchor="middle">4</text>
  <text x="549" y="513" class="detail">match authenticated tenant to X-Tenant-ID</text>
  <path data-connector="authz-sets-context" d="M 622 544 H 819" class="txCall"/>

  <rect x="620" y="574" width="358" height="46" rx="18" fill="#ffffff" stroke="#6f8f58" class="pill card"/>
  <circle cx="644" cy="597" r="14" class="badge" stroke="#6f8f58"/>
  <text x="644" y="602" class="detail" text-anchor="middle">5</text>
  <text x="669" y="603" class="detail">TenantContext.set(requestedTenant)</text>
  <path data-connector="authz-enters-controller" d="M 622 634 H 1017" class="contextCall"/>

  <rect x="890" y="654" width="372" height="46" rx="18" fill="#ffffff" stroke="#4f86c6" class="pill card"/>
  <circle cx="914" cy="677" r="14" class="badge" stroke="#4f86c6"/>
  <text x="914" y="682" class="detail" text-anchor="middle">6</text>
  <text x="939" y="683" class="detail">controller/service delegates lookup</text>
  <path data-connector="controller-calls-repository" d="M 1017 714 H 1216" class="call"/>

  <rect x="1078" y="732" width="388" height="46" rx="18" fill="#ffffff" stroke="#7a8445" class="pill card"/>
  <circle cx="1102" cy="755" r="14" class="badge" stroke="#7a8445"/>
  <text x="1102" y="760" class="detail" text-anchor="middle">7</text>
  <text x="1127" y="761" class="detail">tenantTransaction.execute { select }</text>
  <path data-connector="repository-enters-tenant-transaction" d="M 1216 792 H 1412" class="repoCall"/>

  <rect x="1244" y="812" width="400" height="46" rx="18" fill="#ffffff" stroke="#a2743d" class="pill card"/>
  <circle cx="1268" cy="835" r="14" class="badge" stroke="#a2743d"/>
  <text x="1268" y="840" class="detail" text-anchor="middle">8</text>
  <text x="1293" y="841" class="detail">registry.databaseFor(TenantContext.current())</text>
  <path data-connector="transaction-asks-registry" d="M 1412 872 H 1588" class="txCall"/>

  <rect x="1188" y="884" width="520" height="132" rx="18" class="scope"/>
  <rect x="1238" y="864" width="250" height="34" rx="16" class="scopeTitle"/>
  <text x="1363" y="886" class="detail" text-anchor="middle">selected tenant database</text>

  <rect x="1444" y="900" width="278" height="46" rx="18" fill="#ffffff" stroke="#2f9a94" class="pill card"/>
  <circle cx="1468" cy="923" r="14" class="badge" stroke="#2f9a94"/>
  <text x="1468" y="928" class="detail" text-anchor="middle">9</text>
  <text x="1493" y="929" class="detail">open Exposed transaction</text>
  <path data-connector="registry-selects-tenant-database" d="M 1588 960 H 1693" class="sqlCall"/>

  <rect x="1054" y="968" width="524" height="46" rx="18" fill="#ffffff" stroke="#2f9a94" class="pill card"/>
  <circle cx="1078" cy="991" r="14" class="badge" stroke="#2f9a94"/>
  <text x="1078" y="996" class="detail" text-anchor="middle">10</text>
  <text x="1108" y="997" class="detail">select inventory_items from tenant-local H2</text>
  <path data-connector="repository-selects-tenant-data" d="M 1216 1026 H 1693" class="sqlCall"/>

  <rect x="452" y="986" width="336" height="46" rx="18" fill="#ffffff" stroke="#6f8f58" class="pill card"/>
  <circle cx="476" cy="1009" r="14" class="badge" stroke="#6f8f58"/>
  <text x="476" y="1014" class="detail" text-anchor="middle">11</text>
  <text x="506" y="1015" class="detail">finally TenantContext.clear()</text>
  <path data-connector="authz-clears-tenant-context" d="M 622 1044 H 819" class="contextCall"/>

  <path data-connector="controller-returns-response" d="M 1017 1072 H 622 H 256 H 98" class="returnLine"/>

  <rect x="90" y="1092" width="1560" height="34" rx="14" class="note"/>
  <text x="870" y="1114" class="detail" text-anchor="middle">Conflicts stop at 400, missing auth at 401, and tenant mismatch or malformed tenant claims at 403 before any tenant database is selected.</text>
</svg>
