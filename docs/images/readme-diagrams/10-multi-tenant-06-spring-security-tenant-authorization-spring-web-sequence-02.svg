<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="1016" viewBox="0 0 1160 1016" role="img" aria-label="Request Flow">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
    <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/>
  </filter>
  <marker id="openArrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
    <path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#758297" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>
  .canvas{fill:#f7f9fc}
  .frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
  .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:42px;font-weight:400;fill:#102033}
  .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
  .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:24px;font-weight:400;fill:#102033}
  .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:20px;font-weight:400;fill:#102033}
  .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
  .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
  .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
  .card{stroke-width:2;filter:url(#shadow)}
  .line{fill:none;stroke:#758297;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
  .dash{fill:none;stroke:#9aa6b8;stroke-width:1.6;stroke-linecap:round;stroke-dasharray:6 8}
  .note{fill:#ffffff;stroke:#d8e0ea;stroke-width:1.2}
</style>
</defs>

<rect class="canvas" x="0" y="0" width="1160" height="100%"/>
<rect class="frame" x="20" y="20" width="1120" height="976" rx="18"/>
<text class="title" x="54" y="72">Request Flow</text>
<text class="subtitle" x="56" y="100">Request and data flow</text>
<rect class="card" x="72" y="142" width="176" height="58" rx="16" fill="#f7d9df" stroke="#d9899b"/>
<text class="smallLabel" x="160" y="166" text-anchor="middle">Credential</text>
<text class="smallLabel" x="160" y="186" text-anchor="middle">conflict...</text>
<path class="dash" d="M 160 208 L 160 962"/>
<rect class="card" x="282" y="142" width="176" height="58" rx="16" fill="#d9ecff" stroke="#7eaad3"/>
<text class="smallLabel" x="370" y="166" text-anchor="middle">Client</text>
<path class="dash" d="M 370 208 L 370 962"/>
<rect class="card" x="492" y="142" width="176" height="58" rx="16" fill="#dcf3e4" stroke="#7fb895"/>
<text class="smallLabel" x="580" y="166" text-anchor="middle">Conflict Filter</text>
<path class="dash" d="M 580 208 L 580 962"/>
<rect class="card" x="702" y="142" width="176" height="58" rx="16" fill="#fff0c9" stroke="#d0a84e"/>
<text class="smallLabel" x="790" y="166" text-anchor="middle">Authentication</text>
<path class="dash" d="M 790 208 L 790 962"/>
<rect class="card" x="912" y="142" width="176" height="58" rx="16" fill="#eadff8" stroke="#a287c8"/>
<text class="smallLabel" x="1000" y="166" text-anchor="middle">Authorization</text>
<path class="dash" d="M 1000 208 L 1000 962"/>
<path class="line" d="M 172 248 L 356 248" marker-end="url(#openArrow)"/>
<rect class="note" x="133" y="216" width="264" height="24" rx="8"/>
<text class="small" x="265" y="233" text-anchor="middle">Tenant Filter</text>
<path class="line" d="M 382 302 L 566 302" marker-end="url(#openArrow)"/>
<rect class="note" x="343" y="270" width="264" height="24" rx="8"/>
<text class="small" x="475" y="287" text-anchor="middle">Exposed DB</text>
<path class="line" d="M 592 356 L 776 356" marker-end="url(#openArrow)"/>
<rect class="note" x="553" y="324" width="264" height="24" rx="8"/>
<text class="small" x="685" y="341" text-anchor="middle">Bearer/API key/session + X-Tenant-ID</text>
<path class="line" d="M 802 410 L 986 410" marker-end="url(#openArrow)"/>
<rect class="note" x="763" y="378" width="264" height="24" rx="8"/>
<text class="small" x="895" y="395" text-anchor="middle">400 if supported credentials are mixed</text>
<path class="line" d="M 988 464 L 174 464" marker-end="url(#openArrow)"/>
<rect class="note" x="448" y="432" width="264" height="24" rx="8"/>
<text class="small" x="580" y="449" text-anchor="middle">one credential source</text>
<path class="line" d="M 172 518 L 356 518" marker-end="url(#openArrow)"/>
<rect class="note" x="133" y="486" width="264" height="24" rx="8"/>
<text class="small" x="265" y="503" text-anchor="middle">401 if missing or invalid credential</text>
<path class="line" d="M 382 572 L 566 572" marker-end="url(#openArrow)"/>
<rect class="note" x="343" y="540" width="264" height="24" rx="8"/>
<text class="small" x="475" y="557" text-anchor="middle">authenticated principal</text>
<path class="line" d="M 592 626 L 776 626" marker-end="url(#openArrow)"/>
<rect class="note" x="553" y="594" width="264" height="24" rx="8"/>
<text class="small" x="685" y="611" text-anchor="middle">authenticated request</text>
<path class="line" d="M 802 680 L 986 680" marker-end="url(#openArrow)"/>
<rect class="note" x="763" y="648" width="264" height="24" rx="8"/>
<text class="small" x="895" y="665" text-anchor="middle">403 if claim missin...nown, or mismatched</text>
<path class="line" d="M 988 734 L 174 734" marker-end="url(#openArrow)"/>
<rect class="note" x="448" y="702" width="264" height="24" rx="8"/>
<text class="small" x="580" y="719" text-anchor="middle">400/404 if selector...lformed, or unknown</text>
<path class="line" d="M 172 788 L 356 788" marker-end="url(#openArrow)"/>
<rect class="note" x="133" y="756" width="264" height="24" rx="8"/>
<text class="small" x="265" y="773" text-anchor="middle">TenantContext = authorized tenant</text>
<path class="line" d="M 382 842 L 566 842" marker-end="url(#openArrow)"/>
<rect class="note" x="343" y="810" width="264" height="24" rx="8"/>
<text class="small" x="475" y="827" text-anchor="middle">tenant-specific inventory response</text>
<path class="line" d="M 592 896 L 776 896" marker-end="url(#openArrow)"/>
<rect class="note" x="553" y="864" width="264" height="24" rx="8"/>
<text class="small" x="685" y="881" text-anchor="middle">No default datasour...enantContext write.</text>
</svg>
