<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 960" width="1560" height="960" role="img" aria-label="Tink Encrypted Column Flow">
<defs>

<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/></filter>
<marker id="arrowBlue" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563eb"/></marker>
<marker id="arrowGreen" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#16a34a"/></marker>
<marker id="arrowPink" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#db2777"/></marker>
<marker id="arrowOrange" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#ea580c"/></marker>
<marker id="arrowPurple" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7c3aed"/></marker>
<style>
.canvas{fill:#f6f9fc}.frame{fill:#fff;stroke:#d7e2ec;stroke-width:1.5}
.title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:31px;fill:#1e293b}
.subtitle,.detail{font-family:"Comic Mono","Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;fill:#536476}
.subtitle{font-size:13px}.detail{font-size:12px}.tiny{font-family:"Comic Mono","Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:10px;fill:#64748b}
.label{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:16px;fill:#1e293b}
.panelTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:12px;letter-spacing:.08em;fill:#94a3b8}
.card{stroke-width:1.7;filter:url(#shadow)}.panel{fill:#f8fafc;stroke:#d7e2ec;stroke-width:1.2}
.arrow{fill:none;stroke:#2563eb;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowBlue)}
.mapLine{fill:none;stroke:#16a34a;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowGreen)}
.codecLine{fill:none;stroke:#db2777;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowPink)}
.dbUse{fill:none;stroke:#ea580c;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowOrange)}
.runtimeUse{fill:none;stroke:#7c3aed;stroke-width:1.9;stroke-dasharray:6 5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowPurple)}
.inheritStem{fill:none;stroke:#475569;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
</style>
</defs>
<rect width="1560" height="960" class="canvas"/>
<rect x="20" y="20" width="1520" height="920" rx="16" class="frame"/>
<text x="48" y="58" class="title">Tink Encrypted Column Flow</text>
<text x="48" y="80" class="subtitle">AEAD columns encrypt/decrypt transparently; DAEAD columns use deterministic ciphertext for indexed WHERE searches</text>
<rect x="58" y="130" width="300" height="660" rx="12" class="panel"/><text x="208" y="122" class="panelTitle" text-anchor="middle">TESTS</text>
<desc>TinkColumnTypeTest</desc><rect x="96" y="190" width="224" height="70" rx="10" fill="#dbeafe" stroke="#3b82f6" class="card"/>
<text x="208" y="215" class="label" text-anchor="middle">TinkColumnTypeTest</text>
<text x="208" y="246" class="detail" text-anchor="middle">DSL column tests</text>
<desc>TinkColumnTypeDaoTest</desc><rect x="96" y="366" width="224" height="70" rx="10" fill="#fce7f3" stroke="#db2777" class="card"/>
<text x="208" y="391" class="label" text-anchor="middle">TinkColumnTypeDaoTest</text>
<text x="208" y="422" class="detail" text-anchor="middle">DAO DAEAD tests</text>
<desc>withTables</desc><rect x="96" y="542" width="224" height="70" rx="10" fill="#e2e8f0" stroke="#64748b" class="card"/>
<text x="208" y="567" class="label" text-anchor="middle">withTables</text>
<text x="208" y="598" class="detail" text-anchor="middle">test fixture</text>
<rect x="430" y="130" width="324" height="660" rx="12" class="panel"/><text x="592" y="122" class="panelTitle" text-anchor="middle">COLUMN FAMILIES</text>
<desc>AEAD columns</desc><rect x="474" y="174" width="232" height="80" rx="10" fill="#dcfce7" stroke="#16a34a" class="card"/>
<text x="590" y="199" class="label" text-anchor="middle">AEAD columns</text>
<text x="590" y="240" class="detail" text-anchor="middle">varchar / binary / blob</text>
<desc>DAEAD columns</desc><rect x="474" y="312" width="232" height="80" rx="10" fill="#ede9fe" stroke="#7c3aed" class="card"/>
<text x="590" y="337" class="label" text-anchor="middle">DAEAD columns</text>
<text x="590" y="378" class="detail" text-anchor="middle">searchable ciphertext</text>
<desc>Nullable/update</desc><rect x="474" y="450" width="232" height="80" rx="10" fill="#ccfbf1" stroke="#0f766e" class="card"/>
<text x="590" y="475" class="label" text-anchor="middle">Nullable/update</text>
<text x="590" y="516" class="detail" text-anchor="middle">null + changed values</text>
<desc>Multi algorithm</desc><rect x="474" y="588" width="232" height="80" rx="10" fill="#fef3c7" stroke="#d97706" class="card"/>
<text x="590" y="613" class="label" text-anchor="middle">Multi algorithm</text>
<text x="590" y="654" class="detail" text-anchor="middle">AES / ChaCha20</text>
<rect x="824" y="130" width="312" height="660" rx="12" class="panel"/><text x="980" y="122" class="panelTitle" text-anchor="middle">TINK CRYPTO</text>
<desc>AES256_GCM</desc><rect x="864" y="174" width="232" height="72" rx="10" fill="#dbeafe" stroke="#3b82f6" class="card"/>
<text x="980" y="199" class="label" text-anchor="middle">AES256_GCM</text>
<text x="980" y="232" class="detail" text-anchor="middle">non-deterministic</text>
<desc>AES256_SIV</desc><rect x="864" y="286" width="232" height="72" rx="10" fill="#ede9fe" stroke="#7c3aed" class="card"/>
<text x="980" y="311" class="label" text-anchor="middle">AES256_SIV</text>
<text x="980" y="344" class="detail" text-anchor="middle">deterministic</text>
<desc>CHACHA20_POLY1305</desc><rect x="864" y="398" width="232" height="72" rx="10" fill="#fef3c7" stroke="#d97706" class="card"/>
<text x="980" y="423" class="label" text-anchor="middle">CHACHA20_POLY1305</text>
<text x="980" y="456" class="detail" text-anchor="middle">AEAD option</text>
<desc>Plaintext eq</desc><rect x="864" y="548" width="232" height="72" rx="10" fill="#fce7f3" stroke="#db2777" class="card"/>
<text x="980" y="573" class="label" text-anchor="middle">Plaintext eq</text>
<text x="980" y="606" class="detail" text-anchor="middle">DAEAD WHERE search</text>
<rect x="1206" y="130" width="184" height="660" rx="12" class="panel"/><text x="1298" y="122" class="panelTitle" text-anchor="middle">TABLES</text>
<rect x="1228" y="170" width="140" height="126" rx="10" fill="#fff" stroke="#16a34a" class="card"/>
<path d="M1228,212 L1228,180 Q1228,170 1238,170 L1358,170 Q1368,170 1368,180 L1368,212 Z" fill="#dcfce7"/>
<text x="1298" y="198" class="label" text-anchor="middle">AEAD tables</text>
<text x="1244" y="238" class="tiny">secret</text>
<text x="1244" y="256" class="tiny">data</text>
<text x="1244" y="274" class="tiny">blob</text>
<rect x="1228" y="356" width="140" height="132" rx="10" fill="#fff" stroke="#7c3aed" class="card"/>
<path d="M1228,398 L1228,366 Q1228,356 1238,356 L1358,356 Q1368,356 1368,366 L1368,398 Z" fill="#ede9fe"/>
<text x="1298" y="384" class="label" text-anchor="middle">DAEAD tables</text>
<text x="1244" y="424" class="tiny">email index</text>
<text x="1244" y="442" class="tiny">fingerprint</text>
<text x="1244" y="460" class="tiny">blob</text>
<rect x="1228" y="548" width="140" height="110" rx="10" fill="#fff" stroke="#db2777" class="card"/>
<path d="M1228,590 L1228,558 Q1228,548 1238,548 L1358,548 Q1368,548 1368,558 L1368,590 Z" fill="#fce7f3"/>
<text x="1298" y="576" class="label" text-anchor="middle">DAO T1</text>
<text x="1244" y="616" class="tiny">secret index</text>
<text x="1244" y="634" class="tiny">data</text>
<path d="M1424,367 C1424,346 1532,346 1532,367 L1532,563 C1532,584 1424,584 1424,563 Z" fill="#fff" stroke="#ea580c" stroke-width="1.7" class="card"/>
<ellipse cx="1478" cy="367" rx="54" ry="17" fill="#ffedd5" stroke="#ea580c" stroke-width="1.7"/>
<path d="M1424,563 Q1478,563 1532,563" fill="none" stroke="#ea580c" stroke-width="1.7"/>
<text x="1478" y="402" class="label" text-anchor="middle">DB</text>
<text x="1438" y="436" class="tiny">encrypted</text>
<text x="1438" y="454" class="tiny">ciphertext</text>
<text x="1438" y="472" class="tiny">indexed DAEAD</text>
<path d="M320,225 L474,214" class="arrow"/>
<path d="M320,401 L381.7,401 Q398,401 398,384.7 L398,368.3 Q398,352 414.3,352 L474,352" class="arrow"/>
<path d="M320,577 L380,577 Q398,577 398,559 L398,508 Q398,490 416,490 L474,490" class="runtimeUse"/>
<path d="M706,214 L782.4,214 Q784,214 784,212.4 L784,211.6 Q784,210 785.6,210 L864,210" class="codecLine"/>
<path d="M706,352 L772,352 Q784,352 784,340 L784,334 Q784,322 796,322 L864,322" class="codecLine"/>
<path d="M706,490 L766,490 Q784,490 784,472 L784,452 Q784,434 802,434 L864,434" class="runtimeUse"/>
<path d="M706,628 L766,628 Q784,628 784,610 L784,452 Q784,434 802,434 L864,434" class="runtimeUse"/>
<path d="M1096,210 L1158.8,210 Q1168,210 1168,219.2 L1168,223.8 Q1168,233 1177.2,233 L1228,233" class="mapLine"/>
<path d="M1096,322 L1150,322 Q1168,322 1168,340 L1168,404 Q1168,422 1186,422 L1228,422" class="mapLine"/>
<path d="M1096,584 L1161.7,584 Q1168,584 1168,590.3 L1168,596.7 Q1168,603 1174.3,603 L1228,603" class="runtimeUse"/>
<path d="M1368,233 L1390.7,233 Q1402,233 1402,244.3 L1402,422.7 Q1402,430 1409.3,430 L1424,430" class="dbUse"/>
<path d="M1368,422 L1390.7,422 Q1402,422 1402,433.3 L1402,456.7 Q1402,464 1409.3,464 L1424,464" class="dbUse"/>
<path d="M1368,603 L1395,603 Q1402,603 1402,610 L1402,617 Q1402,624 1409,624 L1463.3,624 Q1478,624 1478,609.3 L1478,580" class="dbUse"/>
<rect x="124" y="850" width="1206" height="52" rx="10" fill="#ecfdf5" stroke="#86efac" stroke-width="1.3"/>
<text x="727" y="881" class="detail" text-anchor="middle">Source check: AEAD uses AES-GCM/ChaCha20 for transparent CRUD; DAEAD uses AES-SIV so indexed equality searches remain possible.</text>
</svg>
