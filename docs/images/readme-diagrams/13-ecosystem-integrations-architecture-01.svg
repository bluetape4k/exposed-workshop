<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Chapter 13 Ecosystem Integrations</title>
  <desc id="desc">Planned Exposed ecosystem examples grouped into database platform adapters, runtime and framework integration, and domain architecture.</desc>
  <defs>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#334155" flood-opacity="0.12"/>
    </filter>
    <style>
      svg { font-family: "Architects Daughter", "Comic Mono", ui-sans-serif, system-ui, sans-serif; }
      .canvas { fill: #f7fafc; }
      .frame { fill: #ffffff; stroke: #8aa6cf; stroke-width: 3; filter: url(#shadow); }
      .title { font-family: "Architects Daughter"; font-size: 52px; fill: #233854; }
      .subtitle, .body, .small { font-family: "Comic Mono"; fill: #526276; }
      .subtitle { font-size: 18px; }
      .laneTitle { font-family: "Architects Daughter"; font-size: 28px; fill: #233854; }
      .cardTitle { font-family: "Architects Daughter"; font-size: 23px; fill: #263a57; }
      .body { font-size: 15px; }
      .small { font-size: 12px; }
      .lane { stroke-width: 2.5; }
      .card { fill: #ffffff; stroke-width: 2.2; filter: url(#shadow); }
      .pill { fill: #f8fafc; stroke: #d4e0ec; stroke-width: 1.5; }
    </style>
  </defs>
  <rect class="canvas" width="1600" height="980"/>
  <rect class="frame" x="50" y="42" width="1500" height="896" rx="30"/>
  <text class="title" x="800" y="112" text-anchor="middle">Chapter 13: Ecosystem Integrations</text>
  <text class="subtitle" x="800" y="150" text-anchor="middle">Issue-backed Exposed examples for platform adapters, framework integration, and DDD/Modulith boundaries.</text>

  <g id="database-lane">
    <rect class="lane" x="100" y="205" width="1400" height="210" rx="24" fill="#eff6ff" stroke="#93b4e6"/>
    <text class="laneTitle" x="140" y="250">Database platform adapters</text>
    <text class="body" x="140" y="280">Dialect and platform behavior stays local-first until real services are explicitly enabled.</text>
    <rect class="card" x="140" y="318" width="300" height="62" rx="16" stroke="#2563eb"/>
    <text class="cardTitle" x="290" y="346" text-anchor="middle">BigQuery dry-run</text>
    <text class="small" x="290" y="368" text-anchor="middle">#138 query validation</text>
    <rect class="card" x="475" y="318" width="300" height="62" rx="16" stroke="#2563eb"/>
    <text class="cardTitle" x="625" y="346" text-anchor="middle">Trino sessions</text>
    <text class="small" x="625" y="368" text-anchor="middle">#139 pushdown checks</text>
    <rect class="card" x="810" y="318" width="300" height="62" rx="16" stroke="#2563eb"/>
    <text class="cardTitle" x="960" y="346" text-anchor="middle">CockroachDB retry</text>
    <text class="small" x="960" y="368" text-anchor="middle">#140 serializable conflicts</text>
    <rect class="card" x="1145" y="318" width="300" height="62" rx="16" stroke="#2563eb"/>
    <text class="cardTitle" x="1295" y="346" text-anchor="middle">StarRocks OLAP</text>
    <text class="small" x="1295" y="368" text-anchor="middle">#141 local-first analytics</text>
  </g>

  <g id="runtime-lane">
    <rect class="lane" x="100" y="460" width="1400" height="190" rx="24" fill="#fff7ed" stroke="#e8c47b"/>
    <text class="laneTitle" x="140" y="505">Runtime and framework integration</text>
    <text class="body" x="140" y="535">Framework examples show explicit boundaries instead of hidden global wiring.</text>
    <rect class="card" x="245" y="570" width="460" height="56" rx="16" stroke="#d97706"/>
    <text class="cardTitle" x="475" y="604" text-anchor="middle">Ktor Exposed integration #142</text>
    <rect class="card" x="895" y="570" width="460" height="56" rx="16" stroke="#d97706"/>
    <text class="cardTitle" x="1125" y="604" text-anchor="middle">Spring Modulith publications #143</text>
  </g>

  <g id="domain-lane">
    <rect class="lane" x="100" y="695" width="1400" height="170" rx="24" fill="#ecfdf5" stroke="#8ed1bb"/>
    <text class="laneTitle" x="140" y="740">Domain architecture</text>
    <text class="body" x="140" y="770">DDD examples keep aggregate lifecycle and module boundaries visible in code and tests.</text>
    <rect class="card" x="245" y="800" width="460" height="42" rx="15" stroke="#059669"/>
    <text class="cardTitle" x="475" y="828" text-anchor="middle">DDD aggregate repository #144</text>
    <rect class="card" x="895" y="800" width="460" height="42" rx="15" stroke="#059669"/>
    <text class="cardTitle" x="1125" y="828" text-anchor="middle">DDD Modulith boundaries #145</text>
  </g>

  <rect class="pill" x="245" y="885" width="1110" height="34" rx="17"/>
  <text class="small" x="800" y="907" text-anchor="middle">Foundation PR: chapter docs and workflow triggers only. Child PRs create runnable modules and add their Gradle tasks.</text>
</svg>
