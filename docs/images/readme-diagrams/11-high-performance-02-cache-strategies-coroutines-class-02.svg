<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1020" width="1600" height="1020" role="img" aria-label="Coroutine cache repository class structure">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.13"/>
    </filter>
    <marker id="inheritHead" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="16" viewBox="0 0 18 16" refX="17" refY="8" orient="auto">
      <path d="M 1 1 L 17 8 L 1 15 Z" fill="#fbfcf8" stroke="#5f7f89" stroke-width="1.8" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="relArrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#8fa1aa" stroke="#8fa1aa" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <style>
      text { letter-spacing: 0; }
      .canvas { fill: #fbfcf8; stroke: #3f515a; stroke-width: 3; }
      .title { font-family: "Architects Daughter","Comic Sans MS",cursive; font-size: 36px; fill: #23323a; }
      .subtitle,.small,.detail,.tag { font-family: "Comic Mono","Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif; fill: #516670; }
      .subtitle { font-size: 15px; }
      .card { fill: #ffffff; stroke-width: 2.1; filter: url(#shadow); }
      .base { stroke: #5f7f89; }
      .repo { stroke: #7b6bb4; }
      .model { stroke: #5d948b; }
      .config { stroke: #ac7a34; }
      .label { font-family: "Architects Daughter","Comic Sans MS",cursive; font-size: 20px; fill: #20323b; }
      .small { font-size: 12px; }
      .detail { font-size: 12px; fill: #60717a; }
      .tag { font-size: 11px; font-weight: 700; fill: #7b6bb4; }
      .inherit { fill: none; stroke: #5f7f89; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#inheritHead); }
      .rel { fill: none; stroke: #8fa1aa; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 8 7; marker-end: url(#relArrow); }
      .band { fill: #f7faf6; stroke: #d9e2dc; stroke-width: 1.5; }
    </style>
  </defs>

  <rect x="24" y="24" width="1552" height="972" rx="20" class="canvas frame"/>
  <text x="800" y="76" text-anchor="middle" class="title">Coroutine Cache Repository Class Structure</text>
  <text x="800" y="106" text-anchor="middle" class="subtitle">Suspended repositories share the same Redisson base class and bind each cache strategy to an Exposed table and record type.</text>

  <rect x="480" y="154" width="640" height="92" rx="12" class="card base"/>
  <text x="800" y="180" text-anchor="middle" class="label">AbstractSuspendedJdbc</text>
  <text x="800" y="204" text-anchor="middle" class="label">RedissonRepository&lt;K, V&gt;</text>
  <text x="800" y="228" text-anchor="middle" class="detail">suspend cache API, Exposed row mapping, Redisson strategy binding</text>

  <rect x="86" y="350" width="380" height="120" rx="12" class="card repo"/>
  <text x="276" y="386" text-anchor="middle" class="label">UserCacheRepository</text>
  <text x="276" y="412" text-anchor="middle" class="tag">READ_WRITE_THROUGH_WITH_NEAR_CACHE</text>
  <text x="276" y="438" text-anchor="middle" class="detail">Long id -> UserRecord, UserTable</text>

  <rect x="610" y="350" width="380" height="120" rx="12" class="card repo"/>
  <text x="800" y="386" text-anchor="middle" class="label">UserCredentialsCacheRepository</text>
  <text x="800" y="412" text-anchor="middle" class="tag">READ_ONLY_WITH_NEAR_CACHE</text>
  <text x="800" y="438" text-anchor="middle" class="detail">String username -> UserCredentialsRecord</text>

  <rect x="1134" y="350" width="380" height="120" rx="12" class="card repo"/>
  <text x="1324" y="386" text-anchor="middle" class="label">UserEventCacheRepository</text>
  <text x="1324" y="412" text-anchor="middle" class="tag">WRITE_BEHIND_WITH_NEAR_CACHE</text>
  <text x="1324" y="438" text-anchor="middle" class="detail">Long id -> UserEventRecord, async flush</text>

  <path id="i1" data-connector="i1" class="inherit" d="M 276 350 L 276 302 Q 276 282 296 282 L 636 282 Q 656 282 656 262 L 656 246"/>
  <path id="i2" data-connector="i2" class="inherit" d="M 800 350 L 800 246"/>
  <path id="i3" data-connector="i3" class="inherit" d="M 1324 350 L 1324 302 Q 1324 282 1304 282 L 964 282 Q 944 282 944 262 L 944 246"/>

  <rect x="86" y="572" width="380" height="96" rx="12" class="card model"/>
  <text x="276" y="608" text-anchor="middle" class="label">UserTable / UserRecord</text>
  <text x="276" y="632" text-anchor="middle" class="detail">LongIdTable, avatar blob, audit columns</text>

  <rect x="610" y="572" width="380" height="96" rx="12" class="card model"/>
  <text x="800" y="608" text-anchor="middle" class="label">UserCredentialsTable</text>
  <text x="800" y="632" text-anchor="middle" class="detail">username id, password hash, read-only update hooks</text>

  <rect x="1134" y="572" width="380" height="96" rx="12" class="card model"/>
  <text x="1324" y="608" text-anchor="middle" class="label">UserEventTable / Record</text>
  <text x="1324" y="632" text-anchor="middle" class="detail">event source, type, details, event time</text>

  <path id="r1" data-connector="r1" class="rel" d="M 276 470 L 276 572"/>
  <path id="r2" data-connector="r2" class="rel" d="M 800 470 L 800 572"/>
  <path id="r3" data-connector="r3" class="rel" d="M 1324 470 L 1324 572"/>

  <rect x="230" y="756" width="300" height="92" rx="12" class="card config"/>
  <text x="380" y="790" text-anchor="middle" class="label">RedissonClient</text>
  <text x="380" y="814" text-anchor="middle" class="detail">constructor dependency</text>

  <rect x="650" y="756" width="300" height="92" rx="12" class="card config"/>
  <text x="800" y="790" text-anchor="middle" class="label">RedissonCacheConfig</text>
  <text x="800" y="814" text-anchor="middle" class="detail">named cache strategy per repository</text>

  <rect x="1070" y="756" width="300" height="92" rx="12" class="card config"/>
  <text x="1220" y="790" text-anchor="middle" class="label">newSuspendedTransaction</text>
  <text x="1220" y="814" text-anchor="middle" class="detail">caller-side Exposed transaction</text>

  <path id="r6" data-connector="r6" class="rel" d="M 276 668 L 276 714 Q 276 734 296 734 L 380 734 Q 400 734 400 754 L 400 756"/>
  <path id="r7" data-connector="r7" class="rel" d="M 800 668 L 800 756"/>
  <path id="r8" data-connector="r8" class="rel" d="M 1324 668 L 1324 714 Q 1324 734 1304 734 L 1220 734 Q 1200 734 1200 754 L 1200 756"/>

  <rect x="320" y="904" width="960" height="52" rx="12" class="band"/>
  <text x="800" y="936" text-anchor="middle" class="small">All concrete repositories override table, ResultRow.toEntity, extractId, and insert/update mapping hooks.</text>
</svg>
