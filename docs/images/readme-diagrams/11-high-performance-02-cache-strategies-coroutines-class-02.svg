<svg xmlns="http://www.w3.org/2000/svg" width="998" height="498" viewBox="0 0 998 498" role="img" aria-label="Class Structure">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
    <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/>
  </filter>
  <marker id="openArrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
    <path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#758297" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>
  .canvas{fill:#f7f9fc}
  .frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
  .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:42px;font-weight:400;fill:#102033}
  .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
  .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:24px;font-weight:400;fill:#102033}
  .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:20px;font-weight:400;fill:#102033}
  .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
  .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
  .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
  .card{stroke-width:2;filter:url(#shadow)}
  .line{fill:none;stroke:#758297;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
  .dash{fill:none;stroke:#9aa6b8;stroke-width:1.6;stroke-linecap:round;stroke-dasharray:6 8}
  .note{fill:#ffffff;stroke:#d8e0ea;stroke-width:1.2}
</style>
</defs>

<rect class="canvas" x="0" y="0" width="998" height="100%"/>
<rect class="frame" x="20" y="20" width="958" height="458" rx="18"/>
<text class="title" x="54" y="72">Class Structure</text>
<text class="subtitle" x="56" y="100">Class and component responsibilities</text>
<rect class="card" x="43" y="142" width="280" height="138" rx="14" fill="#f7d9df" stroke="#d9899b"/>
<text class="smallLabel" x="183" y="178" text-anchor="middle">«abstract»</text>
<line class="dash" x1="61" y1="204" x2="305" y2="204"/>
<text class="mono" x="67" y="228">+ Abstract Suspended Jdbc</text>
<text class="mono" x="67" y="245">+ Redisson Repository</text>
<text class="mono" x="67" y="262">+ +cacheName: String</text>
<text class="mono" x="67" y="279">+ +config: RedisCacheConfig</text>
<rect class="card" x="359" y="142" width="280" height="138" rx="14" fill="#d9ecff" stroke="#7eaad3"/>
<text class="smallLabel" x="499" y="178" text-anchor="middle">«enum-likeobject»</text>
<line class="dash" x1="377" y1="204" x2="621" y2="204"/>
<rect class="card" x="675" y="142" width="280" height="138" rx="14" fill="#dcf3e4" stroke="#7fb895"/>
<text class="smallLabel" x="815" y="178" text-anchor="middle">RedisCacheConfig</text>
<line class="dash" x1="693" y1="204" x2="937" y2="204"/>
<text class="mono" x="699" y="228">+ READ_WRITE_THROUGH_WITH_NEAR_CACHE</text>
<text class="mono" x="699" y="245">+ READ_ONLY_WITH_NEAR_CACHE</text>
<text class="mono" x="699" y="262">+ WRITE_BEHIND_WITH_NEAR_CACHE</text>
<text class="mono" x="699" y="279">+ User Credentials Cache</text>
<rect class="card" x="43" y="314" width="280" height="138" rx="14" fill="#fff0c9" stroke="#d0a84e"/>
<text class="smallLabel" x="183" y="350" text-anchor="middle">Repository</text>
<line class="dash" x1="61" y1="376" x2="305" y2="376"/>
<text class="mono" x="67" y="400">+ +cacheName =</text>
<text class="mono" x="67" y="417">+ exposed:corouti...ser-credentials</text>
<text class="mono" x="67" y="434">+ +config = READ_...WITH_NEAR_CACHE</text>
<text class="mono" x="67" y="451">+ +entityTable: UserCredentialsTable</text>
<rect class="card" x="359" y="314" width="280" height="138" rx="14" fill="#eadff8" stroke="#a287c8"/>
<text class="smallLabel" x="499" y="350" text-anchor="middle">UserCacheRepository</text>
<line class="dash" x1="377" y1="376" x2="621" y2="376"/>
<text class="mono" x="383" y="400">+ +cacheName = ex...oroutines:users</text>
<text class="mono" x="383" y="417">+ +config =</text>
<text class="mono" x="383" y="434">+ +entityTable: UserTable</text>
<text class="mono" x="383" y="451">+ #doInsertEntity(stmt, entity)</text>
<rect class="card" x="675" y="314" width="280" height="138" rx="14" fill="#dff4f1" stroke="#75aaa3"/>
<text class="smallLabel" x="815" y="350" text-anchor="middle">UserEventCacheRepository</text>
<line class="dash" x1="693" y1="376" x2="937" y2="376"/>
<text class="mono" x="699" y="400">+ +cacheName = ex...nes:user-events</text>
<text class="mono" x="699" y="417">+ +config = WRITE...WITH_NEAR_CACHE</text>
<text class="mono" x="699" y="434">+ +entityTable: UserEventTable</text>
</svg>
