<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="title desc">
  <title id="title">Spring observability readiness architecture</title>
  <desc id="desc">Spring Boot Actuator readiness, request-id correlation, structured error handling, and Exposed-backed slow-operation diagnostics form a production diagnostics slice.</desc>
  <defs>
    <style>
      text { letter-spacing: 0; }
      .title { font-family: "Architects Daughter"; font-size: 40px; fill: #23323a; }
      .subtitle, .laneNote, .cardText, .label, .footer { font-family: "Comic Mono"; fill: #324750; }
      .subtitle { font-size: 17px; }
      .laneTitle { font-family: "Architects Daughter"; font-size: 24px; fill: #23323a; }
      .laneNote { font-size: 13px; fill: #5b6d75; }
      .cardTitle { font-family: "Architects Daughter"; font-size: 22px; fill: #20323b; }
      .cardText { font-size: 14px; }
      .label { font-size: 13px; font-weight: 700; }
      .footer { font-size: 14px; fill: #60717a; }
      .canvas { fill: #fbfcf8; stroke: #3f515a; stroke-width: 3; }
      .lane { stroke-width: 2.1; }
      .laneHttp { fill: #fff7e8; stroke: #b98e50; }
      .laneSpring { fill: #f2f0fb; stroke: #897bc2; }
      .laneStore { fill: #eef7f5; stroke: #6fa098; }
      .laneContract { fill: #f4f6f5; stroke: #8a9aa0; }
      .card { fill: #ffffff; stroke-width: 2.2; }
      .httpCard { stroke: #ac7a34; }
      .springCard { stroke: #7b6bb4; }
      .storeCard { stroke: #5d948b; }
      .contractCard { stroke: #69777e; }
      .flowHttp { fill: none; stroke: #a2743d; stroke-width: 4.2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowHttp); }
      .flowSpring { fill: none; stroke: #7667b1; stroke-width: 4.2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowSpring); }
      .flowStore { fill: none; stroke: #3f8e84; stroke-width: 4.2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowStore); }
      .flowContract { fill: none; stroke: #69777e; stroke-width: 4.2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowContract); }
    </style>
    <marker id="arrowHttp" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto" data-role="primary" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#a2743d" stroke="#a2743d" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="arrowSpring" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto" data-role="primary" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#7667b1" stroke="#7667b1" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="arrowStore" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto" data-role="primary" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#3f8e84" stroke="#3f8e84" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="arrowContract" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto" data-role="primary" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#69777e" stroke="#69777e" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
  </defs>

  <rect x="24" y="24" width="1552" height="892" rx="20" class="canvas"/>
  <text x="800" y="78" text-anchor="middle" class="title">Spring Observability Readiness</text>
  <text x="800" y="110" text-anchor="middle" class="subtitle">Actuator readiness, request correlation, structured errors, and persisted slow-operation diagnostics.</text>

  <rect x="70" y="158" width="330" height="580" rx="18" class="lane laneHttp"/>
  <text x="104" y="198" class="laneTitle">HTTP diagnostics edge</text>
  <text x="104" y="224" class="laneNote">Request IDs, endpoints, errors.</text>

  <rect x="470" y="158" width="330" height="580" rx="18" class="lane laneSpring"/>
  <text x="504" y="198" class="laneTitle">Spring diagnostics</text>
  <text x="504" y="224" class="laneNote">Health contributor and service timing.</text>

  <rect x="870" y="158" width="300" height="580" rx="18" class="lane laneStore"/>
  <text x="904" y="198" class="laneTitle">Exposed diagnostics store</text>
  <text x="904" y="224" class="laneNote">Database ping and operation history.</text>

  <rect x="1240" y="158" width="260" height="580" rx="18" class="lane laneContract"/>
  <text x="1274" y="198" class="laneTitle">Production contract</text>
  <text x="1274" y="224" class="laneNote">Readiness, request ID, structured errors.</text>

  <rect id="correlation" x="112" y="260" width="246" height="118" rx="12" class="card httpCard"/>
  <text x="235" y="294" text-anchor="middle" class="cardTitle">RequestCorrelationFilter</text>
  <text x="140" y="324" class="cardText">sanitize X-Request-ID</text>
  <text x="140" y="344" class="cardText">generate UUID fallback</text>
  <text x="140" y="364" class="cardText">MDC + response header</text>

  <rect id="controller" x="112" y="500" width="246" height="118" rx="12" class="card httpCard"/>
  <text x="235" y="534" text-anchor="middle" class="cardTitle">DiagnosticsController</text>
  <text x="140" y="564" class="cardText">/operations/{name}</text>
  <text x="140" y="584" class="cardText">delayMs test hook</text>
  <text x="140" y="604" class="cardText">/operations history</text>

  <rect id="readiness" x="510" y="260" width="250" height="118" rx="12" class="card springCard"/>
  <text x="635" y="294" text-anchor="middle" class="cardTitle">DatabaseReadiness</text>
  <text x="538" y="324" class="cardText">Actuator readiness group</text>
  <text x="538" y="344" class="cardText">DiagnosticsState gate</text>
  <text x="538" y="364" class="cardText">repository ping</text>

  <rect id="service" x="510" y="500" width="250" height="118" rx="12" class="card springCard"/>
  <text x="635" y="534" text-anchor="middle" class="cardTitle">DiagnosticsService</text>
  <text x="538" y="564" class="cardText">validate name + delayMs</text>
  <text x="538" y="584" class="cardText">measure duration</text>
  <text x="538" y="604" class="cardText">slow threshold 10ms</text>

  <rect id="store" x="910" y="340" width="230" height="210" rx="12" class="card storeCard"/>
  <g data-bluetape4k-icon="h2" transform="translate(934 386) scale(1.7)">
    <path fill="#09476B" d="M17.17 13.27c.14-.015.28-.023.416-.023.7 0 1.228.159 1.599.469.37.314.555.756.555 1.334a2.861 2.861 0 0 1-.43 1.455c-.291.492-.775 1.066-1.46 1.727-.453.446-1.061.976-1.821 1.592a48.02 48.02 0 0 1-2.275 1.742v2.083h9.895V21.24H17.99c.219-.159.59-.435 1.11-.832.519-.4 1.033-.835 1.55-1.311.817-.76 1.425-1.5 1.822-2.215a4.624 4.624 0 0 0 .597-2.268c0-1.213-.416-2.154-1.247-2.815-.828-.662-2.033-.994-3.613-.994-.344 0-.692.015-1.036.049V6.04H13.86v4.701H8.965V6.04H5.65v12.846h3.315v-5.661h4.89v5.661h.039c.31-.242.623-.487.933-.74a28.564 28.564 0 0 0 1.826-1.588 14.854 14.854 0 0 0 .517-.529zM12.011 23.3A11.327 11.327 0 0 1 .7 11.99 11.305 11.305 0 0 1 12.011.699a11.286 11.286 0 0 1 11.29 11.29v.351H24v-.351A11.985 11.985 0 0 0 12.011 0 12.008 12.008 0 0 0 0 11.989 12.026 12.026 0 0 0 12.011 24h.352v-.7z"/>
  </g>
  <text x="1040" y="370" text-anchor="middle" class="cardTitle">H2 diagnostics</text>
  <text x="990" y="416" class="cardText">diagnostic</text>
  <text x="990" y="438" class="cardText">operations</text>
  <text x="990" y="462" class="cardText">request_id</text>
  <text x="990" y="484" class="cardText">duration_ms + slow</text>
  <text x="990" y="506" class="cardText">created_at epoch</text>

  <rect id="contract" x="1270" y="360" width="200" height="190" rx="12" class="card contractCard"/>
  <text x="1370" y="394" text-anchor="middle" class="cardTitle">Diagnostics</text>
  <text x="1298" y="424" class="cardText">readiness details</text>
  <text x="1298" y="446" class="cardText">X-Request-ID echo</text>
  <text x="1298" y="468" class="cardText">VALIDATION_FAILED</text>
  <text x="1298" y="490" class="cardText">slow operation row</text>

  <rect id="tests" x="110" y="790" width="1370" height="70" rx="12" class="card springCard"/>
  <text x="795" y="820" text-anchor="middle" class="cardTitle">Tested diagnostics boundary</text>
  <text x="210" y="846" class="cardText">readiness success/failure, request-id propagation, structured errors, and slow-operation persistence.</text>

  <path id="flow-correlation-controller" data-connector="flow-correlation-controller" d="M 235 378 V 500" class="flowHttp"/>
  <path id="flow-controller-service" data-connector="flow-controller-service" d="M 358 559 H 510" class="flowHttp"/>
  <path id="flow-readiness-store" data-connector="flow-readiness-store" d="M 760 319 H 835 Q 855 319 855 339 L 855 405 Q 855 425 875 425 L 910 425" class="flowSpring"/>
  <path id="flow-service-store" data-connector="flow-service-store" d="M 760 559 H 835 Q 855 559 855 539 L 855 500 Q 855 480 875 480 L 910 480" class="flowSpring"/>
  <path id="flow-store-contract" data-connector="flow-store-contract" d="M 1140 455 H 1270" class="flowStore"/>

  <text x="258" y="438" text-anchor="middle" class="label">requestId</text>
  <text x="434" y="543" text-anchor="middle" class="label">operations</text>
  <text x="850" y="304" text-anchor="middle" class="label">ping</text>
  <text x="850" y="584" text-anchor="middle" class="label">record</text>
  <text x="1205" y="439" text-anchor="middle" class="label">diagnostics</text>

  <text x="800" y="900" text-anchor="middle" class="footer">The Spring slice uses Actuator readiness and servlet filtering while Exposed persists diagnostic operation evidence.</text>
</svg>
