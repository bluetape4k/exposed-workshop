<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1378 720" width="1378" height="720" role="img" aria-label="Schema-per-tenant Spring MVC architecture">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowBlue" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#4f86c6" stroke="#4f86c6" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="arrowGreen" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#6f8f58" stroke="#6f8f58" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="arrowAmber" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#b8894a" stroke="#b8894a" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="arrowTeal" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2f9a94" stroke="#2f9a94" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <style>
      .canvas{fill:#f6f9fc}
      .frame{fill:#fff;stroke:#d7e2ec;stroke-width:1.5}
      .lane{fill:#f8fafc;stroke:#d7e2ec;stroke-width:1.2}
      .card{stroke-width:1.7;filter:url(#shadow)}
      .title{font-family:"Architects Daughter";font-size:32px;fill:#1e293b}
      .subtitle,.detail,.tiny,.legend{font-family:"Comic Mono";fill:#536476}
      .subtitle{font-size:13px}
      .detail{font-size:12px}
      .tiny{font-size:10.5px;fill:#64748b}
      .legend{font-size:12px}
      .panelTitle{font-family:"Architects Daughter";font-size:13px;letter-spacing:.08em;fill:#64748b}
      .label{font-family:"Architects Daughter";font-size:17px;fill:#1e293b}
      .flow{fill:none;stroke:#4f86c6;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowBlue)}
      .contextFlow{fill:none;stroke:#6f8f58;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowGreen)}
      .schemaFlow{fill:none;stroke:#b8894a;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowAmber)}
      .sqlFlow{fill:none;stroke:#2f9a94;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowTeal)}
    </style>
  </defs>

  <rect width="1378" height="720" class="canvas"/>
  <rect x="20" y="20" width="1338" height="680" rx="16" class="frame"/>
  <text x="48" y="58" class="title">Schema-per-Tenant Spring MVC</text>
  <text x="48" y="80" class="subtitle">One shared Hikari pool; TenantTransaction switches to a whitelisted schema and resets to PUBLIC before reuse</text>

  <rect x="52" y="124" width="190" height="452" rx="14" class="lane"/>
  <text x="147" y="152" class="panelTitle" text-anchor="middle">REQUEST</text>
  <g data-card="Client">
    <rect x="72" y="184" width="150" height="72" rx="10" fill="#dbeafe" stroke="#4f86c6" class="card"/>
    <text x="147" y="214" class="label" text-anchor="middle">Client</text>
    <text x="147" y="236" class="detail" text-anchor="middle">X-Tenant-ID</text>
  </g>
  <g data-card="TenantFilter">
    <rect x="72" y="334" width="150" height="78" rx="10" fill="#ecfdf5" stroke="#6f8f58" class="card"/>
    <text x="147" y="365" class="label" text-anchor="middle">TenantFilter</text>
    <text x="147" y="387" class="detail" text-anchor="middle">strict whitelist</text>
  </g>

  <rect x="264" y="124" width="190" height="452" rx="14" class="lane"/>
  <text x="359" y="152" class="panelTitle" text-anchor="middle">TENANT CONTEXT</text>
  <g data-card="TenantId">
    <rect x="284" y="184" width="150" height="78" rx="10" fill="#ecfdf5" stroke="#6f8f58" class="card"/>
    <text x="359" y="216" class="label" text-anchor="middle">TenantId</text>
    <text x="359" y="238" class="detail" text-anchor="middle">acme / globex</text>
  </g>
  <g data-card="TenantContext">
    <rect x="284" y="334" width="150" height="78" rx="10" fill="#ecfdf5" stroke="#6f8f58" class="card"/>
    <text x="359" y="365" class="label" text-anchor="middle">TenantContext</text>
    <text x="359" y="387" class="detail" text-anchor="middle">ThreadLocal scope</text>
  </g>

  <rect x="476" y="124" width="190" height="452" rx="14" class="lane"/>
  <text x="571" y="152" class="panelTitle" text-anchor="middle">SPRING MVC USE CASE</text>
  <g data-card="InventoryController">
    <rect x="496" y="184" width="150" height="78" rx="10" fill="#dbeafe" stroke="#4f86c6" class="card"/>
    <text x="571" y="216" class="label" text-anchor="middle">Inventory</text>
    <text x="571" y="235" class="label" text-anchor="middle">Controller</text>
    <text x="571" y="253" class="detail" text-anchor="middle">REST API</text>
  </g>
  <g data-card="InventoryService">
    <rect x="496" y="334" width="150" height="78" rx="10" fill="#dbeafe" stroke="#4f86c6" class="card"/>
    <text x="571" y="365" class="label" text-anchor="middle">Inventory</text>
    <text x="571" y="384" class="label" text-anchor="middle">Service</text>
    <text x="571" y="402" class="detail" text-anchor="middle">use case</text>
  </g>

  <rect x="688" y="124" width="190" height="452" rx="14" class="lane"/>
  <text x="783" y="152" class="panelTitle" text-anchor="middle">SCHEMA BOUNDARY</text>
  <g data-card="TenantTransaction">
    <rect x="708" y="218" width="150" height="88" rx="10" fill="#fef3c7" stroke="#b8894a" class="card"/>
    <text x="783" y="252" class="label" text-anchor="middle">Tenant</text>
    <text x="783" y="271" class="label" text-anchor="middle">Transaction</text>
    <text x="783" y="290" class="detail" text-anchor="middle">execute block</text>
  </g>
  <g data-card="PublicReset">
    <rect x="708" y="458" width="150" height="78" rx="10" fill="#f8fafc" stroke="#b8894a" stroke-width="1.7" class="card"/>
    <text x="783" y="489" class="label" text-anchor="middle">PUBLIC reset</text>
    <text x="783" y="511" class="detail" text-anchor="middle">finally block</text>
  </g>

  <rect x="900" y="124" width="190" height="452" rx="14" class="lane"/>
  <text x="995" y="152" class="panelTitle" text-anchor="middle">SHARED POOL / SQL</text>
  <g data-card="SharedHikariPool">
    <rect x="920" y="184" width="150" height="78" rx="10" fill="#fff7ed" stroke="#b8894a" class="card"/>
    <text x="995" y="215" class="label" text-anchor="middle">Shared Hikari</text>
    <text x="995" y="237" class="detail" text-anchor="middle">one connection pool</text>
  </g>
  <g data-card="InventoryRepository">
    <rect x="920" y="334" width="150" height="78" rx="10" fill="#ccfbf1" stroke="#2f9a94" class="card"/>
    <text x="995" y="365" class="label" text-anchor="middle">Inventory</text>
    <text x="995" y="384" class="label" text-anchor="middle">Repository</text>
    <text x="995" y="402" class="detail" text-anchor="middle">inventory_items</text>
  </g>

  <rect x="1112" y="124" width="214" height="452" rx="14" class="lane"/>
  <text x="1219" y="152" class="panelTitle" text-anchor="middle">TENANT SCHEMAS</text>
  <g data-card="TenantAcme">
    <rect x="1134" y="184" width="170" height="78" rx="10" fill="#ffedd5" stroke="#b8894a" class="card"/>
    <text x="1219" y="216" class="label" text-anchor="middle">TENANT_ACME</text>
    <text x="1219" y="238" class="detail" text-anchor="middle">schema</text>
  </g>
  <g data-card="TenantGlobex">
    <rect x="1134" y="334" width="170" height="78" rx="10" fill="#ffedd5" stroke="#b8894a" class="card"/>
    <text x="1219" y="366" class="label" text-anchor="middle">TENANT_GLOBEX</text>
    <text x="1219" y="388" class="detail" text-anchor="middle">schema</text>
  </g>
  <g data-card="ConnectionEviction">
    <rect x="1134" y="464" width="170" height="78" rx="10" fill="#f8fafc" stroke="#64748b" class="card"/>
    <text x="1219" y="495" class="label" text-anchor="middle">Evict</text>
    <text x="1219" y="514" class="label" text-anchor="middle">connection</text>
    <text x="1219" y="532" class="detail" text-anchor="middle">reset failure</text>
  </g>

  <path data-connector="client-to-filter" d="M147,256 V322" class="flow connector"/>
  <path data-connector="filter-to-tenant-id" d="M222,373 H252 Q264,373 264,361 V235 Q264,223 276,223 H284" class="contextFlow connector"/>
  <path data-connector="tenant-id-to-context" d="M359,262 V334" class="contextFlow connector"/>
  <path data-connector="context-to-controller" d="M434,373 H464 Q476,373 476,361 V235 Q476,223 488,223 H496" class="flow connector"/>
  <path data-connector="controller-to-service" d="M571,262 V334" class="flow connector"/>
  <path data-connector="service-to-transaction" d="M646,373 H676 Q688,373 688,361 V274 Q688,262 700,262 H708" class="schemaFlow connector"/>
  <path data-connector="transaction-to-pool" d="M858,262 H888 Q900,262 900,250 V235 Q900,223 912,223 H920" class="schemaFlow connector"/>
  <path data-connector="transaction-to-repository" d="M858,262 H888 Q900,262 900,274 V361 Q900,373 912,373 H920" class="sqlFlow connector"/>
  <path data-connector="repository-to-acme" d="M1070,373 H1098 Q1110,373 1110,361 V235 Q1110,223 1122,223 H1134" class="sqlFlow connector"/>
  <path data-connector="repository-to-globex" d="M1070,373 H1134" class="sqlFlow connector"/>
  <path data-connector="transaction-to-public-reset" d="M783,306 V458" class="schemaFlow connector"/>
  <path data-connector="reset-failure-to-evict" d="M858,497 H1134" class="schemaFlow connector"/>

  <rect x="80" y="616" width="1218" height="38" rx="10" fill="#f8fafc" stroke="#d7e2ec"/>
  <path d="M116,635 H158" class="flow connector"/>
  <text x="172" y="640" class="legend">request/use-case call</text>
  <path d="M346,635 H388" class="contextFlow connector"/>
  <text x="402" y="640" class="legend">tenant whitelist/context</text>
  <path d="M614,635 H656" class="schemaFlow connector"/>
  <text x="670" y="640" class="legend">schema switch/reset</text>
  <path d="M850,635 H892" class="sqlFlow connector"/>
  <text x="906" y="640" class="legend">SQL in active schema</text>
  <text x="689" y="676" class="tiny" text-anchor="middle">Successful or failed work resets the borrowed connection to PUBLIC; reset failures roll back and evict the connection.</text>
</svg>
