<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1378 650" width="1378" height="650" role="img" aria-label="Schema-per-tenant Spring MVC architecture">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/></filter>
    <marker id="arrowBlue" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#4f86c6" stroke="#4f86c6" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="arrowGreen" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#6f8f58" stroke="#6f8f58" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="arrowAmber" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#b8894a" stroke="#b8894a" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="arrowTeal" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2f9a94" stroke="#2f9a94" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <style>
      .canvas{fill:#f6f9fc}.frame{fill:#fff;stroke:#d7e2ec;stroke-width:1.5}
      .lane{fill:#f8fafc;stroke:#d7e2ec;stroke-width:1.2}
      .card{stroke-width:1.7;filter:url(#shadow)}
      .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:32px;fill:#1e293b}
      .subtitle,.detail,.tiny{font-family:"Comic Mono","Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;fill:#536476}
      .subtitle{font-size:13px}.detail{font-size:12px}.tiny{font-size:10.5px;fill:#64748b}
      .panelTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:13px;letter-spacing:.08em;fill:#64748b}
      .label{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:17px;fill:#1e293b}
      .flow{fill:none;stroke:#4f86c6;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
      .contextFlow{fill:none;stroke:#6f8f58;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
      .schemaFlow{fill:none;stroke:#b8894a;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
      .sqlFlow{fill:none;stroke:#2f9a94;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect width="1378" height="650" class="canvas"/>
  <rect x="20" y="20" width="1338" height="610" rx="16" class="frame"/>
  <text x="48" y="58" class="title">Schema-per-Tenant Spring MVC</text>
  <text x="48" y="80" class="subtitle">One shared Hikari pool; TenantTransaction switches to a whitelisted schema and resets to PUBLIC before reuse</text>

  <rect x="52" y="124" width="1274" height="170" rx="14" class="lane"/>
  <text x="689" y="152" class="panelTitle" text-anchor="middle">REQUEST AND TENANT RESOLUTION</text>
  <rect x="76" y="190" width="176" height="64" rx="10" fill="#dbeafe" stroke="#4f86c6" class="card"/>
  <text x="164" y="217" class="label" text-anchor="middle">Client</text>
  <text x="164" y="238" class="detail" text-anchor="middle">X-Tenant-ID</text>
  <rect x="304" y="190" width="214" height="64" rx="10" fill="#ecfdf5" stroke="#6f8f58" class="card"/>
  <text x="411" y="217" class="label" text-anchor="middle">TenantFilter</text>
  <text x="411" y="238" class="detail" text-anchor="middle">strict whitelist</text>
  <rect x="570" y="190" width="214" height="64" rx="10" fill="#ecfdf5" stroke="#6f8f58" class="card"/>
  <text x="677" y="217" class="label" text-anchor="middle">TenantContext</text>
  <text x="677" y="238" class="detail" text-anchor="middle">ThreadLocal scope</text>
  <rect x="836" y="190" width="214" height="64" rx="10" fill="#dbeafe" stroke="#4f86c6" class="card"/>
  <text x="943" y="217" class="label" text-anchor="middle">InventoryController</text>
  <text x="943" y="238" class="detail" text-anchor="middle">REST API</text>
  <rect x="1102" y="190" width="190" height="64" rx="10" fill="#dbeafe" stroke="#4f86c6" class="card"/>
  <text x="1197" y="217" class="label" text-anchor="middle">InventoryService</text>
  <text x="1197" y="238" class="detail" text-anchor="middle">use case</text>

  <path d="M252,222 H304" class="flow" marker-end="url(#arrowBlue)"/>
  <path d="M518,222 H570" class="contextFlow" marker-end="url(#arrowGreen)"/>
  <path d="M784,222 H836" class="flow" marker-end="url(#arrowBlue)"/>
  <path d="M1050,222 H1102" class="flow" marker-end="url(#arrowBlue)"/>

  <rect x="52" y="344" width="1274" height="190" rx="14" class="lane"/>
  <text x="689" y="372" class="panelTitle" text-anchor="middle">SCHEMA SWITCHING BOUNDARY</text>
  <rect x="148" y="420" width="238" height="74" rx="10" fill="#fef3c7" stroke="#b8894a" class="card"/>
  <text x="267" y="449" class="label" text-anchor="middle">TenantTransaction</text>
  <text x="267" y="470" class="detail" text-anchor="middle">execute and finally reset</text>
  <rect x="456" y="420" width="238" height="74" rx="10" fill="#ccfbf1" stroke="#2f9a94" class="card"/>
  <text x="575" y="449" class="label" text-anchor="middle">InventoryRepository</text>
  <text x="575" y="470" class="detail" text-anchor="middle">inventory_items table</text>
  <rect x="764" y="420" width="210" height="74" rx="10" fill="#ffedd5" stroke="#b8894a" class="card"/>
  <text x="869" y="449" class="label" text-anchor="middle">TENANT_ACME</text>
  <text x="869" y="470" class="detail" text-anchor="middle">schema</text>
  <rect x="1034" y="420" width="210" height="74" rx="10" fill="#ffedd5" stroke="#b8894a" class="card"/>
  <text x="1139" y="449" class="label" text-anchor="middle">TENANT_GLOBEX</text>
  <text x="1139" y="470" class="detail" text-anchor="middle">schema</text>
  <rect x="148" y="526" width="238" height="44" rx="10" fill="#f8fafc" stroke="#b8894a" stroke-width="1.7" class="card"/>
  <text x="267" y="554" class="detail" text-anchor="middle">reset connection to PUBLIC</text>

  <path d="M1197,254 V312 Q1197,320 1189,320 H275 Q267,320 267,328 V420" class="schemaFlow" marker-end="url(#arrowAmber)"/>
  <path d="M386,457 H456" class="sqlFlow" marker-end="url(#arrowTeal)"/>
  <path d="M694,457 H764" class="sqlFlow" marker-end="url(#arrowTeal)"/>
  <path d="M575,494 V514 Q575,522 583,522 H1131 Q1139,522 1139,514 V494" class="sqlFlow" marker-end="url(#arrowTeal)"/>
  <path d="M267,494 V526" class="schemaFlow" marker-end="url(#arrowAmber)"/>
  <text x="700" y="602" class="tiny" text-anchor="middle">Successful or failed work resets the borrowed connection to PUBLIC; reset failures roll back and evict the connection.</text>
</svg>
