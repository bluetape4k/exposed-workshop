<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Coroutine cache strategy architecture">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.13"/>
    </filter>
    <marker id="flowArrow" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#5f7f89" stroke="#5f7f89" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="softArrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#8fa1aa" stroke="#8fa1aa" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <style>
      text { letter-spacing: 0; }
      .canvas { fill: #fbfcf8; stroke: #3f515a; stroke-width: 3; }
      .title { font-family: "Architects Daughter","Comic Sans MS",cursive; font-size: 36px; fill: #23323a; }
      .subtitle,.lane,.detail,.note { font-family: "Comic Mono","Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif; fill: #516670; }
      .subtitle { font-size: 15px; }
      .lane { font-size: 12px; font-weight: 700; fill: #687b83; }
      .card { fill: #ffffff; stroke-width: 2.1; filter: url(#shadow); }
      .entry { stroke: #5d948b; }
      .service { stroke: #ac7a34; }
      .cache { stroke: #7b6bb4; }
      .store { stroke: #8fa1aa; }
      .infra { stroke: #5f7f89; }
      .label { font-family: "Architects Daughter","Comic Sans MS",cursive; font-size: 20px; fill: #20323b; }
      .detail { font-size: 12px; }
      .note { font-size: 13px; }
      .flow { fill: none; stroke: #5f7f89; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#flowArrow); }
      .soft { fill: none; stroke: #8fa1aa; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 8 7; marker-end: url(#softArrow); }
      .band { fill: #f7faf6; stroke: #d9e2dc; stroke-width: 1.5; }
    </style>
  </defs>

  <rect x="24" y="24" width="1552" height="852" rx="20" class="canvas frame"/>
  <text x="800" y="76" text-anchor="middle" class="title">Coroutine Cache Strategy Architecture</text>
  <text x="800" y="106" text-anchor="middle" class="subtitle">Suspend controllers delegate to suspended Redisson repositories while Netty event loops stay free of blocking request work.</text>

  <text x="112" y="164" class="lane">WEBFLUX ENTRY</text>
  <text x="430" y="164" class="lane">SUSPEND REQUEST FLOW</text>
  <text x="760" y="164" class="lane">CACHE REPOSITORIES</text>
  <text x="1110" y="164" class="lane">CACHE + STORAGE</text>

  <rect x="70" y="190" width="240" height="82" rx="12" class="card entry"/>
  <text x="190" y="224" text-anchor="middle" class="label">UserController</text>
  <text x="190" y="246" text-anchor="middle" class="detail">suspend GET /users/{id}</text>

  <rect x="70" y="326" width="240" height="82" rx="12" class="card entry"/>
  <text x="190" y="360" text-anchor="middle" class="label">CredentialsController</text>
  <text x="190" y="382" text-anchor="middle" class="detail">suspend read-only lookup</text>

  <rect x="70" y="462" width="240" height="82" rx="12" class="card entry"/>
  <text x="190" y="496" text-anchor="middle" class="label">UserEventController</text>
  <text x="190" y="518" text-anchor="middle" class="detail">suspend bulk write</text>

  <rect x="392" y="590" width="250" height="82" rx="12" class="card service"/>
  <text x="517" y="616" text-anchor="middle" class="label">newSuspended</text>
  <text x="517" y="638" text-anchor="middle" class="label">Transaction</text>
  <text x="517" y="660" text-anchor="middle" class="detail">DB work leaves event loop</text>

  <rect x="720" y="590" width="274" height="82" rx="12" class="card service"/>
  <text x="857" y="624" text-anchor="middle" class="label">Coroutine boundary</text>
  <text x="857" y="646" text-anchor="middle" class="detail">suspend repository contract</text>

  <rect x="720" y="190" width="274" height="82" rx="12" class="card cache"/>
  <text x="857" y="224" text-anchor="middle" class="label">UserCacheRepository</text>
  <text x="857" y="246" text-anchor="middle" class="detail">read-through + write-through</text>

  <rect x="720" y="326" width="274" height="82" rx="12" class="card cache"/>
  <text x="857" y="360" text-anchor="middle" class="label">CredentialsRepository</text>
  <text x="857" y="382" text-anchor="middle" class="detail">read-only cache strategy</text>

  <rect x="720" y="462" width="274" height="82" rx="12" class="card cache"/>
  <text x="857" y="496" text-anchor="middle" class="label">UserEventRepository</text>
  <text x="857" y="518" text-anchor="middle" class="detail">write-behind bulk persistence</text>

  <rect x="1080" y="190" width="230" height="82" rx="12" class="card infra"/>
  <text x="1195" y="224" text-anchor="middle" class="label">Redisson client</text>
  <text x="1195" y="246" text-anchor="middle" class="detail">near cache + Redis maps</text>

  <rect x="1080" y="326" width="230" height="82" rx="12" class="card store"/>
  <text x="1195" y="360" text-anchor="middle" class="label">User tables</text>
  <text x="1195" y="382" text-anchor="middle" class="detail">User / Credentials / Event</text>

  <rect x="1080" y="462" width="230" height="82" rx="12" class="card service"/>
  <text x="1195" y="496" text-anchor="middle" class="label">Async write-behind</text>
  <text x="1195" y="518" text-anchor="middle" class="detail">delayed DB flush</text>

  <rect x="390" y="728" width="920" height="90" rx="14" class="band"/>
  <text x="850" y="762" text-anchor="middle" class="note">NettyConfig tunes event-loop and connection limits; RedissonConfig provides the coroutine-safe cache client.</text>
  <text x="850" y="790" text-anchor="middle" class="detail">The diagram keeps runtime arrows straight: request path, cache lookup, DB fallback, and async write-behind remain visually distinct.</text>

  <path id="f1" data-connector="f1" class="flow" d="M 310 231 L 720 231"/>
  <path id="f2" data-connector="f2" class="flow" d="M 310 367 L 720 367"/>
  <path id="f3" data-connector="f3" class="flow" d="M 310 503 L 720 503"/>

  <path id="f4" data-connector="f4" class="flow" d="M 994 231 L 1080 231"/>
  <path id="f5" data-connector="f5" class="flow" d="M 994 367 L 1080 367"/>
  <path id="f6" data-connector="f6" class="flow" d="M 994 503 L 1080 503"/>

  <path id="f7" data-connector="f7" class="soft" d="M 642 631 L 720 631"/>
  <path id="f8" data-connector="f8" class="soft" d="M 517 590 L 517 558 Q 517 538 537 538 L 720 538"/>
  <path id="f9" data-connector="f9" class="soft" d="M 857 672 L 857 728"/>
  <path id="f10" data-connector="f10" class="soft" d="M 1195 544 L 1195 728"/>
</svg>
