<svg xmlns="http://www.w3.org/2000/svg" width="1624" height="2472" viewBox="0 0 1624 2472" role="img" aria-label="newSuspendedTransaction Processing Sequence Diagram">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#758297" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 0 1 L 12 6 L 0 11 Z" fill="#ffffff" stroke="#758297" stroke-width="1.8"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="1624" height="2472"/>
<rect class="frame" x="32" y="28" width="1560" height="2416" rx="28"/>
<text class="title" x="66" y="82">newSuspendedTransaction Processing Sequence Diagram</text>
<text class="subtitle" x="70" y="118">Sequence messages from the original Mermaid source</text>
<rect class="card" x="-10" y="166" width="300" height="72" rx="20" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="140" y="209" text-anchor="middle">App</text>
<line class="lifeline" x1="140" y1="252" x2="140" y2="2412" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="438" y="166" width="300" height="72" rx="20" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="588" y="198.5" text-anchor="middle">CoroutineContext</text>
<text class="smallLabel" x="588" y="219.5" text-anchor="middle">(Dispatchers.IO)</text>
<line class="lifeline" x1="588" y1="252" x2="588" y2="2412" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="886" y="166" width="300" height="72" rx="20" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="1036" y="209" text-anchor="middle">Exposed Transaction</text>
<line class="lifeline" x1="1036" y1="252" x2="1036" y2="2412" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="1334" y="166" width="300" height="72" rx="20" fill="#FDECEF" stroke="#DC6B82"/>
<text class="smallLabel" x="1484" y="209" text-anchor="middle">Database</text>
<line class="lifeline" x1="1484" y1="252" x2="1484" y2="2412" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect x="225" y="286" width="278" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="243" y="313" text-anchor="start">1. newSuspendedTransaction { }</text>
<path class="line" d="M140 344 L588 344"/>
<rect x="689" y="396" width="246" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="707" y="423" text-anchor="start">2. Start transaction block</text>
<path class="line" d="M588 454 L1036 454"/>
<rect x="1155" y="506" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1173" y="533" text-anchor="start">3. BEGIN</text>
<path class="line" d="M1036 564 L1484 564"/>
<rect x="1104.5" y="616" width="311" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1122.5" y="643" text-anchor="start">4. SQL Query (INSERT / SELECT ...)</text>
<path class="line" d="M1036 674 L1484 674"/>
<rect x="1155" y="726" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1173" y="753" text-anchor="start">5. Result</text>
<path class="dashed" d="M1484 784 L1036 784"/>
<rect x="70" y="836" width="1484" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="92" y="863" text-anchor="start">ALT: Success</text>
<rect x="1155" y="904" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1173" y="931" text-anchor="start">7. COMMIT</text>
<path class="line" d="M1036 962 L1484 962"/>
<rect x="707" y="1014" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="725" y="1041" text-anchor="start">8. mapped result</text>
<path class="dashed" d="M1036 1072 L588 1072"/>
<rect x="259" y="1124" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="277" y="1151" text-anchor="start">9. suspend return</text>
<path class="dashed" d="M588 1182 L140 1182"/>
<rect x="70" y="1234" width="1484" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="92" y="1261" text-anchor="start">ELSE: Exception</text>
<rect x="1155" y="1302" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1173" y="1329" text-anchor="start">11. ROLLBACK</text>
<path class="line" d="M1036 1360 L1484 1360"/>
<rect x="697" y="1412" width="230" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="715" y="1439" text-anchor="start">12. Exception propagated</text>
<path class="dashed" d="M1036 1470 L588 1470"/>
<rect x="249" y="1522" width="230" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="267" y="1549" text-anchor="start">13. Exception propagated</text>
<path class="dashed" d="M588 1580 L140 1580"/>
<rect x="213" y="1632" width="302" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="231" y="1659" text-anchor="start">14. suspendedTransactionAsync { }</text>
<path class="line" d="M140 1690 L588 1690"/>
<rect x="168.5" y="1742" width="391" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="186.5" y="1769" text-anchor="start">15. Deferred&amp;lt;T&amp;gt; (returned immediately)</text>
<path class="dashed" d="M588 1800 L140 1800"/>
<rect x="665" y="1852" width="294" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="683" y="1879" text-anchor="start">16. transaction block (parallel)</text>
<path class="line" d="M588 1910 L1036 1910"/>
<rect x="1145" y="1962" width="230" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1163" y="1989" text-anchor="start">17. BEGIN → SQL → COMMIT</text>
<path class="line" d="M1036 2020 L1484 2020"/>
<rect x="1155" y="2072" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1173" y="2099" text-anchor="start">18. Result</text>
<path class="dashed" d="M1484 2130 L1036 2130"/>
<rect x="707" y="2182" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="725" y="2209" text-anchor="start">19. Result</text>
<path class="dashed" d="M1036 2240 L588 2240"/>
<rect x="225" y="2292" width="278" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="243" y="2319" text-anchor="start">20. awaitAll() result returned</text>
<path class="dashed" d="M588 2350 L140 2350"/>
</svg>
