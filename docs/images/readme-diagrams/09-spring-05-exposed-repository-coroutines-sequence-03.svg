<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 740" width="1120" height="740" role="img" aria-label="09 Spring: Exposed Repository Coroutines (05)">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
