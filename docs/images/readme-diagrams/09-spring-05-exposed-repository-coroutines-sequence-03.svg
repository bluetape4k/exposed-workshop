<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 900" width="1500" height="900" role="img" aria-label="Spring WebFlux coroutine repository sequence">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/></filter>
    <marker id="arrowBlue" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" refX="9" refY="5" orient="auto" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#4f86c6" stroke="#4f86c6" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="arrowGreen" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" refX="9" refY="5" orient="auto" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6f8f58" stroke="#6f8f58" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="arrowOrange" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" refX="9" refY="5" orient="auto" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#a2743d" stroke="#a2743d" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="arrowPurple" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" refX="9" refY="5" orient="auto" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7a8445" stroke="#7a8445" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="arrowGray" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" refX="9" refY="5" orient="auto" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6f8792" stroke="#6f8792" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <style>
      .canvas{fill:none}.frame{fill:#fbfcf8;stroke:#40545d;stroke-width:3}
      .title{font-family:"Architects Daughter";font-size:31px;fill:#1e293b}
      .subtitle,.detail{font-family:"Comic Mono";fill:#536476}
      .subtitle{font-size:13px}.detail{font-size:12px}.role{font-family:"Comic Mono";font-size:10.5px;fill:#60727d}
      .participant{font-family:"Architects Daughter";font-size:16px;fill:#1e293b}
      .card{stroke-width:1.7;filter:url(#shadow)}
      .header{fill:#ffffff;stroke:#b6d3ec;stroke-width:1.7;filter:url(#shadow)}
      .lifeline{stroke:#9cafb7;stroke-width:1.4;stroke-dasharray:5 6}
      .activation{fill:#f3ecdf;stroke:#8f784e;stroke-width:1.5}
      .call{fill:none;stroke:#4f86c6;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowBlue)}
      .state{fill:none;stroke:#6f8f58;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowGreen)}
      .db{fill:none;stroke:#a2743d;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowOrange)}
      .spring{fill:none;stroke:#7a8445;stroke-width:2.3;stroke-dasharray:6 5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowPurple)}
      .returnLine{fill:none;stroke:#6f8792;stroke-width:2.2;stroke-dasharray:7 5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowGray)}
      .pill{stroke-width:1.6;filter:url(#shadow)}
      .badge{fill:#fff;stroke-width:1.4}
    </style>
  </defs>
  <rect width="1500" height="900" class="canvas"/>
  <rect x="20" y="20" width="1460" height="860" rx="16" class="frame"/>
  <text x="48" y="58" class="title">Spring WebFlux Coroutine Repository Sequence</text>
  <text x="48" y="80" class="subtitle">Suspend controllers open explicit Exposed transactions; Mono and suspend service paths are kept distinct</text>

  <desc>Client</desc><rect x="34" y="130" width="168" height="62" rx="10" class="header card"/>
  <text x="118" y="158" class="participant" text-anchor="middle">Client</text>
  <text x="118" y="178" class="role" text-anchor="middle">HTTP caller</text>
  <line x1="118" y1="192" x2="118" y2="786" class="lifeline"/>

  <desc>MovieController</desc><rect x="254" y="130" width="172" height="62" rx="10" class="header card"/>
  <text x="340" y="158" class="participant" text-anchor="middle">MovieController</text>
  <text x="340" y="178" class="role" text-anchor="middle">suspend endpoint</text>
  <line x1="340" y1="192" x2="340" y2="786" class="lifeline"/>

  <desc>MovieTransactionalService</desc><rect x="480" y="130" width="190" height="62" rx="10" class="header card"/>
  <text x="575" y="158" class="participant" text-anchor="middle">Tx Service</text>
  <text x="575" y="178" class="role" text-anchor="middle">Mono vs suspend</text>
  <line x1="575" y1="192" x2="575" y2="786" class="lifeline"/>

  <desc>newSuspendedTransaction</desc><rect x="720" y="130" width="192" height="62" rx="10" class="header card"/>
  <text x="816" y="158" class="participant" text-anchor="middle">Suspended Tx</text>
  <text x="816" y="178" class="role" text-anchor="middle">explicit boundary</text>
  <line x1="816" y1="192" x2="816" y2="786" class="lifeline"/>

  <desc>MovieExposedRepository</desc><rect x="960" y="130" width="190" height="62" rx="10" class="header card"/>
  <text x="1055" y="158" class="participant" text-anchor="middle">MovieRepository</text>
  <text x="1055" y="178" class="role" text-anchor="middle">JdbcRepository</text>
  <line x1="1055" y1="192" x2="1055" y2="786" class="lifeline"/>

  <desc>ExposedJDBC</desc><rect x="1194" y="130" width="156" height="62" rx="10" class="header card"/>
  <text x="1272" y="158" class="participant" text-anchor="middle">Exposed JDBC</text>
  <text x="1272" y="178" class="role" text-anchor="middle">DSL / DAO</text>
  <line x1="1272" y1="192" x2="1272" y2="786" class="lifeline"/>

  <desc>Database</desc><rect x="1370" y="130" width="108" height="62" rx="10" class="header card"/>
  <text x="1424" y="158" class="participant" text-anchor="middle">H2</text>
  <text x="1424" y="178" class="role" text-anchor="middle">JDBC</text>
  <line x1="1424" y1="192" x2="1424" y2="786" class="lifeline"/>

  <rect x="111" y="278" width="14" height="68" rx="6" class="activation"/>
  <rect x="333" y="306" width="14" height="330" rx="6" class="activation"/>
  <rect x="809" y="384" width="14" height="220" rx="6" class="activation"/>
  <rect x="1048" y="462" width="14" height="224" rx="6" class="activation"/>
  <rect x="1265" y="540" width="14" height="106" rx="6" class="activation"/>
  <rect x="1417" y="570" width="14" height="84" rx="6" class="activation"/>
  <rect x="568" y="666" width="14" height="96" rx="6" class="activation"/>

  <rect x="74" y="228" width="330" height="34" rx="17" fill="#ffffff" stroke="#4f86c6" class="pill card"/>
  <circle cx="98" cy="245" r="14" class="badge" stroke="#4f86c6"/>
  <text x="98" y="250" class="detail" text-anchor="middle">1</text>
  <text x="123" y="251" class="detail">POST /movies or query /movies</text>
  <path data-connector="client-calls-controller" d="M118,286 H340" class="call"/>

  <rect x="300" y="324" width="430" height="34" rx="17" fill="#ffffff" stroke="#7a8445" class="pill card"/>
  <circle cx="324" cy="341" r="14" class="badge" stroke="#7a8445"/>
  <text x="324" y="346" class="detail" text-anchor="middle">2</text>
  <text x="349" y="347" class="detail">open newSuspendedTransaction(readOnly?)</text>
  <path data-connector="controller-opens-suspended-transaction" d="M340,382 H816" class="spring"/>

  <rect x="760" y="420" width="424" height="34" rx="17" fill="#ffffff" stroke="#4f86c6" class="pill card"/>
  <circle cx="784" cy="437" r="14" class="badge" stroke="#4f86c6"/>
  <text x="784" y="442" class="detail" text-anchor="middle">3</text>
  <text x="809" y="443" class="detail">invoke repository create/search/delete</text>
  <path data-connector="transaction-invokes-repository" d="M816,478 H1055" class="call"/>

  <rect x="1010" y="498" width="410" height="34" rx="17" fill="#ffffff" stroke="#6f8f58" class="pill card"/>
  <circle cx="1034" cy="515" r="14" class="badge" stroke="#6f8f58"/>
  <text x="1034" y="520" class="detail" text-anchor="middle">4</text>
  <text x="1059" y="521" class="detail">insertAndGetId, selectAll, join, load()</text>
  <path data-connector="repository-runs-exposed-dsl" d="M1055,556 H1272" class="state"/>

  <rect x="1190" y="596" width="276" height="34" rx="17" fill="#ffffff" stroke="#a2743d" class="pill card"/>
  <circle cx="1214" cy="613" r="14" class="badge" stroke="#a2743d"/>
  <text x="1214" y="618" class="detail" text-anchor="middle">5</text>
  <text x="1239" y="619" class="detail">blocking JDBC on IO dispatcher</text>
  <path data-connector="exposed-executes-jdbc" d="M1272,654 H1424" class="db"/>

  <rect x="292" y="644" width="412" height="34" rx="17" fill="#ffffff" stroke="#d8aaa7" class="pill card"/>
  <circle cx="316" cy="661" r="14" class="badge" stroke="#d8aaa7"/>
  <text x="316" y="666" class="detail" text-anchor="middle">6</text>
  <text x="341" y="667" class="detail">monoSave(): @Transactional + Mono.fromCallable</text>
  <path data-connector="controller-compares-mono-save" d="M340,702 H575" class="spring"/>

  <rect x="530" y="730" width="452" height="34" rx="17" fill="#ffffff" stroke="#6f8f58" class="pill card"/>
  <circle cx="554" cy="747" r="14" class="badge" stroke="#6f8f58"/>
  <text x="554" y="752" class="detail" text-anchor="middle">7</text>
  <text x="579" y="753" class="detail">suspendedSave(): delegate, keep explicit tx boundary</text>
  <path data-connector="service-delegates-suspend-save" d="M575,788 H1055" class="state"/>

  <rect x="86" y="812" width="1330" height="44" rx="10" fill="#f8fafc" stroke="#d7e2ec" stroke-width="1.3"/>
  <text x="751" y="839" class="detail" text-anchor="middle">The coroutine path is source-controlled by explicit newSuspendedTransaction blocks; @Transactional only protects the Mono.fromCallable comparison path.</text>
</svg>
