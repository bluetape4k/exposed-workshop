<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 820" width="1360" height="820" role="img" aria-label="Exposed DDL Composite Foreign Keys ERD">
<defs>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/></filter>
<marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path stroke-dasharray="none" style="stroke-dasharray:none!important" d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b" stroke="#64748b" stroke-width="0"/></marker>
<marker id="arrowBlue" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path stroke-dasharray="none" style="stroke-dasharray:none!important" d="M 0 0 L 10 5 L 0 10 Z" fill="#2563eb" stroke="#2563eb" stroke-width="0"/></marker>
<marker id="arrowPurple" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path stroke-dasharray="none" style="stroke-dasharray:none!important" d="M 0 0 L 10 5 L 0 10 Z" fill="#7c3aed" stroke="#7c3aed" stroke-width="0"/></marker>
<marker id="arrowOrange" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path stroke-dasharray="none" style="stroke-dasharray:none!important" d="M 0 0 L 10 5 L 0 10 Z" fill="#ea580c" stroke="#ea580c" stroke-width="0"/></marker>
<marker id="arrowTeal" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path stroke-dasharray="none" style="stroke-dasharray:none!important" d="M 0 0 L 10 5 L 0 10 Z" fill="#0f766e" stroke="#0f766e" stroke-width="0"/></marker>
<marker id="arrowPink" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path stroke-dasharray="none" style="stroke-dasharray:none!important" d="M 0 0 L 10 5 L 0 10 Z" fill="#db2777" stroke="#db2777" stroke-width="0"/></marker>
<style>
.canvas{fill:#f6f9fc}.frame{fill:#fff;stroke:#d7e2ec;stroke-width:1.5}
.title{font-family:"Architects Daughter";font-size:31px;fill:#1e293b}
.subtitle,.detail{font-family:"Comic Mono";fill:#536476}
.subtitle{font-size:13px}.detail{font-size:12px}.tiny{font-family:"Comic Mono";font-size:10px;fill:#64748b}
.label{font-family:"Architects Daughter";font-size:16px;fill:#1e293b}
.cardinality{font-family:"Architects Daughter";font-size:20px;fill:#0f766e;font-weight:700}
.panelTitle{font-family:"Architects Daughter";font-size:12px;letter-spacing:.08em;fill:#94a3b8}
.card{stroke-width:1.7;filter:url(#shadow)}.panel{fill:#f8fafc;stroke:#d7e2ec;stroke-width:1.2}
.arrow{fill:none;stroke:#2563eb;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowBlue)}
.runtimeUse{fill:none;stroke:#7c3aed;stroke-width:1.9;stroke-dasharray:5 5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowPurple)}
.dbUse{fill:none;stroke:#ea580c;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowOrange)}
.fkArrow{fill:none;stroke:#0f766e;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowTeal)}
.migration{fill:none;stroke:#db2777;stroke-width:1.9;stroke-dasharray:7 4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowPink)}
.returnLine{fill:none;stroke:#64748b;stroke-width:1.8;stroke-dasharray:6 5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
.inherit{fill:none;stroke:#475569;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.inheritHead{fill:#fff;stroke:#475569;stroke-width:1.8;stroke-linejoin:round}
</style>
</defs>
<rect width="1360" height="820" class="canvas"/>
<rect x="20" y="20" width="1320" height="780" rx="16" class="frame"/>
<text x="48" y="58" class="title">Exposed DDL Composite Foreign Keys ERD</text>
<text x="48" y="80" class="subtitle">Both examples define child1 foreign keys to parent1 composite primary keys with cascade delete and update</text>
<rect x="70" y="134" width="560" height="490" rx="12" class="panel"/><text x="350" y="126" class="panelTitle" text-anchor="middle">EXAMPLE 01: CHILD COLUMNS MATCH PARENT KEY NAMES</text>
<rect x="126" y="202" width="362" height="150" rx="12" fill="#fff" stroke="#3b82f6" class="card"/>
<path d="M126,244 L126,214 Q126,202 138,202 L476,202 Q488,202 488,214 L488,244 Z" fill="#dbeafe"/>
<text x="307" y="230" class="label" text-anchor="middle">parent1</text>
<text x="144" y="272" class="tiny">PK id_a INT</text>
<text x="144" y="289" class="tiny">PK id_b INT</text>
<text x="144" y="306" class="tiny">PrimaryKey(idA, idB)</text>
<rect x="126" y="430" width="362" height="168" rx="12" fill="#fff" stroke="#0f766e" class="card"/>
<path d="M126,472 L126,442 Q126,430 138,430 L476,430 Q488,430 488,442 L488,472 Z" fill="#ccfbf1"/>
<text x="307" y="458" class="label" text-anchor="middle">child1</text>
<text x="144" y="500" class="tiny">FK id_a INT NOT NULL</text>
<text x="144" y="517" class="tiny">FK id_b INT NOT NULL</text>
<text x="144" y="534" class="tiny">MyForeignKey1</text>
<path data-connector="child1-to-parent1-matching-composite-fk" d="M307,430 L307,352" class="fkArrow edge"/>
<text x="333" y="370" class="cardinality">1</text>
<text x="333" y="425" class="cardinality">N</text>
<rect x="342" y="384" width="188" height="24" rx="8" fill="#ccfbf1" stroke="#99f6e4"/>
<text x="436" y="400" class="tiny" text-anchor="middle">id_a,id_b -&gt; id_a,id_b</text>
<rect x="228" y="610" width="160" height="24" rx="8" fill="#fef3c7" stroke="#99f6e4"/>
<text x="308" y="626" class="tiny" text-anchor="middle">CASCADE delete/update</text>
<rect x="730" y="134" width="560" height="490" rx="12" class="panel"/><text x="1010" y="126" class="panelTitle" text-anchor="middle">EXAMPLE 02: CHILD COLUMNS MAP TO DIFFERENTLY NAMED PARENT KEYS</text>
<rect x="786" y="202" width="362" height="150" rx="12" fill="#fff" stroke="#3b82f6" class="card"/>
<path d="M786,244 L786,214 Q786,202 798,202 L1136,202 Q1148,202 1148,214 L1148,244 Z" fill="#dbeafe"/>
<text x="967" y="230" class="label" text-anchor="middle">parent1</text>
<text x="804" y="272" class="tiny">PK pid_a INT</text>
<text x="804" y="289" class="tiny">PK pid_b INT</text>
<text x="804" y="306" class="tiny">PrimaryKey(pidA, pidB)</text>
<rect x="786" y="430" width="362" height="168" rx="12" fill="#fff" stroke="#0f766e" class="card"/>
<path d="M786,472 L786,442 Q786,430 798,430 L1136,430 Q1148,430 1148,442 L1148,472 Z" fill="#ccfbf1"/>
<text x="967" y="458" class="label" text-anchor="middle">child1</text>
<text x="804" y="500" class="tiny">FK id_a INT NOT NULL</text>
<text x="804" y="517" class="tiny">FK id_b INT NOT NULL</text>
<text x="804" y="534" class="tiny">MyForeignKey1</text>
<path data-connector="child1-to-parent1-mapped-composite-fk" d="M967,430 L967,352" class="fkArrow edge"/>
<text x="993" y="370" class="cardinality">1</text>
<text x="993" y="425" class="cardinality">N</text>
<rect x="1000" y="384" width="214" height="24" rx="8" fill="#ccfbf1" stroke="#99f6e4"/>
<text x="1107" y="400" class="tiny" text-anchor="middle">id_a -&gt; pid_a, id_b -&gt; pid_b</text>
<rect x="888" y="610" width="160" height="24" rx="8" fill="#fef3c7" stroke="#99f6e4"/>
<text x="968" y="626" class="tiny" text-anchor="middle">CASCADE delete/update</text>
<rect x="134" y="700" width="1092" height="52" rx="10" fill="#ecfdf5" stroke="#86efac" stroke-width="1.3"/>
<text x="680" y="731" class="detail" text-anchor="middle">Each child row references one composite parent key; each parent key can be referenced by many child rows.</text>
</svg>
