<path class="line" d="M2100 1244 L2492 1244"/>
<rect x="2191" y="1296" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="2209" y="1323" text-anchor="start">10. ResultSet</text>
<path class="dashed" d="M2492 1354 L2100 1354"/>
<rect x="1799" y="1406" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1817" y="1433" text-anchor="start">11. List~ActorRecord~</text>
<path class="dashed" d="M2100 1464 L1708 1464"/>
<rect x="773" y="1516" width="302" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="791" y="1543" text-anchor="start">12. 200 OK [{ firstName: , ... }]</text>
<path class="dashed" d="M1708 1574 L140 1574"/>
</svg>
