<path class="line" d="M1316 1024 L2492 1024"/>
<rect x="1799" y="1076" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1817" y="1103" text-anchor="start">8. findAll()</text>
<path class="line" d="M1708 1134 L2100 1134"/>
<rect x="2161" y="1186" width="270" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
