<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 900" width="1500" height="900" role="img" aria-label="Spring MVC tenant request sequence">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/></filter>
    <marker id="arrowBlue" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" refX="9" refY="5" orient="auto" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#4f86c6" stroke="#4f86c6" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="arrowGreen" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" refX="9" refY="5" orient="auto" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6f8f58" stroke="#6f8f58" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="arrowAmber" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" refX="9" refY="5" orient="auto" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#a2743d" stroke="#a2743d" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="arrowTeal" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" refX="9" refY="5" orient="auto" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2f9a94" stroke="#2f9a94" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="arrowGray" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" refX="9" refY="5" orient="auto" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6f8792" stroke="#6f8792" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <style>
      .canvas{fill:none}.frame{fill:#fbfcf8;stroke:#40545d;stroke-width:3}
      .title{font-family:"Architects Daughter";font-size:31px;fill:#1e293b}
      .subtitle,.detail{font-family:"Comic Mono";fill:#536476}
      .subtitle{font-size:13px}.detail{font-size:12px}.role{font-family:"Comic Mono";font-size:10.5px;fill:#60727d}
      .participant{font-family:"Architects Daughter";font-size:16px;fill:#1e293b}
      .card{stroke-width:1.7;filter:url(#shadow)}
      .header{fill:#ffffff;stroke:#b6d3ec;stroke-width:1.7;filter:url(#shadow)}
      .lifeline{stroke:#9cafb7;stroke-width:1.4;stroke-dasharray:5 6}
      .activation{fill:#f3ecdf;stroke:#8f784e;stroke-width:1.5}
      .call{fill:none;stroke:#4f86c6;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowBlue)}
      .contextCall{fill:none;stroke:#6f8f58;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowGreen)}
      .schemaCall{fill:none;stroke:#a2743d;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowAmber)}
      .sqlCall{fill:none;stroke:#2f9a94;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowTeal)}
      .returnLine{fill:none;stroke:#6f8792;stroke-width:2.2;stroke-dasharray:7 5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowGray)}
      .pill{stroke-width:1.6;filter:url(#shadow)}
      .badge{fill:#fff;stroke-width:1.4}
      .branch{fill:none;stroke:#8aa1ad;stroke-width:1.6;stroke-dasharray:9 7}
      .branchTitle{fill:#fff;stroke:#8aa1ad;stroke-width:1.2}
    </style>
  </defs>
  <rect width="1500" height="900" class="canvas"/>
  <rect x="20" y="20" width="1460" height="860" rx="16" class="frame"/>
  <text x="48" y="58" class="title">Spring MVC Tenant Request Sequence</text>
  <text x="48" y="80" class="subtitle">The servlet filter binds tenant context, the transaction aspect switches schema, and Exposed reads from the selected schema</text>

  <desc>Client</desc><rect x="50" y="128" width="90" height="62" rx="10" class="header card"/>
  <text x="95" y="156" class="participant" text-anchor="middle">Client</text>
  <text x="95" y="176" class="role" text-anchor="middle">HTTP caller</text>
  <line x1="95" y1="190" x2="95" y2="850" class="lifeline"/>

  <desc>Tenant Filter</desc><rect x="190" y="128" width="120" height="62" rx="10" class="header card"/>
  <text x="250" y="156" class="participant" text-anchor="middle">Tenant Filter</text>
  <text x="250" y="176" class="role" text-anchor="middle">servlet edge</text>
  <line x1="250" y1="190" x2="250" y2="850" class="lifeline"/>

  <desc>Tenants</desc><rect x="360" y="128" width="90" height="62" rx="10" class="header card"/>
  <text x="405" y="156" class="participant" text-anchor="middle">Tenants</text>
  <text x="405" y="176" class="role" text-anchor="middle">id lookup</text>
  <line x1="405" y1="190" x2="405" y2="850" class="lifeline"/>

  <desc>TenantContext</desc><rect x="505" y="128" width="110" height="62" rx="10" class="header card"/>
  <text x="560" y="156" class="participant" text-anchor="middle">Context</text>
  <text x="560" y="176" class="role" text-anchor="middle">ThreadLocal</text>
  <line x1="560" y1="190" x2="560" y2="850" class="lifeline"/>

  <desc>ActorController</desc><rect x="670" y="128" width="120" height="62" rx="10" class="header card"/>
  <text x="730" y="156" class="participant" text-anchor="middle">Controller</text>
  <text x="730" y="176" class="role" text-anchor="middle">@Transactional</text>
  <line x1="730" y1="190" x2="730" y2="850" class="lifeline"/>

  <desc>TenantSchemaAspect</desc><rect x="830" y="128" width="120" height="62" rx="10" class="header card"/>
  <text x="890" y="156" class="participant" text-anchor="middle">Schema Aspect</text>
  <text x="890" y="176" class="role" text-anchor="middle">before tx</text>
  <line x1="890" y1="190" x2="890" y2="850" class="lifeline"/>

  <desc>DataSourceUtils</desc><rect x="1000" y="128" width="110" height="62" rx="10" class="header card"/>
  <text x="1055" y="156" class="participant" text-anchor="middle">DataSource</text>
  <text x="1055" y="176" class="role" text-anchor="middle">connection</text>
  <line x1="1055" y1="190" x2="1055" y2="850" class="lifeline"/>

  <desc>ActorRepository</desc><rect x="1150" y="128" width="120" height="62" rx="10" class="header card"/>
  <text x="1210" y="156" class="participant" text-anchor="middle">Repository</text>
  <text x="1210" y="176" class="role" text-anchor="middle">Exposed table</text>
  <line x1="1210" y1="190" x2="1210" y2="850" class="lifeline"/>

  <desc>SharedDB</desc><rect x="1325" y="128" width="90" height="62" rx="10" class="header card"/>
  <text x="1370" y="156" class="participant" text-anchor="middle">Shared DB</text>
  <text x="1370" y="176" class="role" text-anchor="middle">schemas</text>
  <line x1="1370" y1="190" x2="1370" y2="850" class="lifeline"/>

  <rect x="88" y="264" width="14" height="84" rx="6" class="activation"/>
  <rect x="243" y="294" width="14" height="466" rx="6" class="activation"/>
  <rect x="553" y="420" width="14" height="332" rx="6" class="activation"/>
  <rect x="723" y="494" width="14" height="282" rx="6" class="activation"/>
  <rect x="883" y="584" width="14" height="122" rx="6" class="activation"/>
  <rect x="1048" y="636" width="14" height="72" rx="6" class="activation"/>
  <rect x="1203" y="712" width="14" height="74" rx="6" class="activation"/>
  <rect x="1363" y="742" width="14" height="54" rx="6" class="activation"/>

  <rect x="70" y="228" width="330" height="34" rx="17" fill="#ffffff" stroke="#4f86c6" class="pill card"/>
  <circle cx="94" cy="245" r="14" class="badge" stroke="#4f86c6"/>
  <text x="94" y="250" class="detail" text-anchor="middle">1</text>
  <text x="119" y="251" class="detail">GET /actors with X-TENANT-ID</text>
  <path data-connector="client-request" d="M95,286 H250" class="call"/>

  <rect x="220" y="304" width="300" height="34" rx="17" fill="#ffffff" stroke="#6f8f58" class="pill card"/>
  <circle cx="244" cy="321" r="14" class="badge" stroke="#6f8f58"/>
  <text x="244" y="326" class="detail" text-anchor="middle">2</text>
  <text x="269" y="327" class="detail">resolve tenant or default</text>
  <path data-connector="filter-resolves-tenant" d="M250,362 H405" class="contextCall"/>

  <rect x="270" y="380" width="360" height="34" rx="17" fill="#ffffff" stroke="#6f8f58" class="pill card"/>
  <circle cx="294" cy="397" r="14" class="badge" stroke="#6f8f58"/>
  <text x="294" y="402" class="detail" text-anchor="middle">3</text>
  <text x="319" y="403" class="detail">bind ThreadLocal withTenant()</text>
  <path data-connector="filter-binds-context" d="M250,438 H560" class="contextCall"/>

  <rect x="488" y="456" width="360" height="34" rx="17" fill="#ffffff" stroke="#4f86c6" class="pill card"/>
  <circle cx="512" cy="473" r="14" class="badge" stroke="#4f86c6"/>
  <text x="512" y="478" class="detail" text-anchor="middle">4</text>
  <text x="537" y="479" class="detail">continue filter chain to controller</text>
  <path data-connector="context-dispatches-controller" d="M560,514 H730" class="call"/>

  <rect x="650" y="548" width="662" height="210" rx="18" class="branch"/>
  <rect x="1084" y="528" width="210" height="34" rx="16" class="branchTitle"/>
  <text x="1189" y="550" class="detail" text-anchor="middle">transaction boundary</text>

  <rect x="720" y="554" width="350" height="34" rx="17" fill="#ffffff" stroke="#a2743d" class="pill card"/>
  <circle cx="744" cy="571" r="14" class="badge" stroke="#a2743d"/>
  <text x="744" y="576" class="detail" text-anchor="middle">5</text>
  <text x="769" y="577" class="detail">enter schema switching aspect</text>
  <path data-connector="controller-enters-aspect" d="M730,606 H890" class="schemaCall"/>

  <rect x="860" y="618" width="372" height="34" rx="17" fill="#ffffff" stroke="#a2743d" class="pill card"/>
  <circle cx="884" cy="635" r="14" class="badge" stroke="#a2743d"/>
  <text x="884" y="640" class="detail" text-anchor="middle">6</text>
  <text x="909" y="641" class="detail">set schema on transaction connection</text>
  <path data-connector="aspect-sets-schema" d="M890,670 H1055" class="schemaCall"/>

  <rect x="898" y="692" width="390" height="34" rx="17" fill="#ffffff" stroke="#2f9a94" class="pill card"/>
  <circle cx="922" cy="709" r="14" class="badge" stroke="#2f9a94"/>
  <text x="922" y="714" class="detail" text-anchor="middle">7</text>
  <text x="947" y="715" class="detail">repository reads ActorTable in schema</text>
  <path data-connector="controller-calls-repository" d="M730,746 H1210" class="sqlCall"/>
  <path data-connector="repository-calls-database" d="M1210,776 H1370" class="sqlCall"/>

  <rect x="142" y="786" width="410" height="34" rx="17" fill="#f8fafc" stroke="#6f8792" class="pill card"/>
  <circle cx="166" cy="803" r="14" class="badge" stroke="#6f8792"/>
  <text x="166" y="808" class="detail" text-anchor="middle">8</text>
  <text x="191" y="809" class="detail">return response and clear ThreadLocal</text>
  <path data-connector="repository-returns" d="M1370,832 H1210 H730 H560 H250" class="returnLine"/>
  <path data-connector="filter-returns-client" d="M250,858 H95" class="returnLine"/>
</svg>
