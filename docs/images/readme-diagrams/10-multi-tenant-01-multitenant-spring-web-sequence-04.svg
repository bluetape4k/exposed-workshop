<rect x="172.5" y="286" width="327" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="190.5" y="313" text-anchor="start">1. GET /actors (X-TENANT-ID: korean)</text>
<path class="line" d="M140 344 L532 344"/>
<rect x="593" y="396" width="270" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="611" y="423" text-anchor="start">2. withTenant(KOREAN) { ... }</text>
<path class="line" d="M532 454 L924 454"/>
<rect x="849" y="506" width="246" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="867" y="533" text-anchor="start">3. ThreadLocal.set(KOREAN)</text>
<path class="line" d="M924 564 C988 564 988 598 924 598"/>
<rect x="1015" y="636" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
