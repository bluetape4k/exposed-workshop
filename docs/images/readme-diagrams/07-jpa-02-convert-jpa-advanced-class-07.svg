  <text class="small" x="170" y="26" text-anchor="middle">«Table Per Class: bank.»</text>
  <text class="label" x="170" y="56.5" text-anchor="middle">Bank Account_Table Per</text>
<text class="label" x="170" y="81.5" text-anchor="middle">Class</text>
  <text class="mono" x="18" y="124">+Int id PK</text>
<text class="mono" x="18" y="145">+String owner</text>
<text class="mono" x="18" y="166">+String accountNumber</text>
<text class="mono" x="18" y="187">+String bankName</text>
</g>
<g transform="translate(502,505)">
  <rect class="card" x="0" y="0" width="340" height="196" rx="5" fill="#FDECEF" stroke="#DC6B82"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#DC6B82"/>
