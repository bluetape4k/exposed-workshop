<text class="mono" x="18" y="129">+String accountNumber</text>
<text class="mono" x="18" y="150">+String bankName</text>
</g>
<g transform="translate(1322,505)">
  <rect class="card" x="0" y="0" width="340" height="196" rx="5" fill="#F1ECFF" stroke="#8A72D6"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#8A72D6"/>
  <text class="small" x="170" y="26" text-anchor="middle">«Single Table billing»</text>
  <text class="label" x="170" y="61" text-anchor="middle">CreditCard_SingleTable</text>
  <text class="mono" x="18" y="108">+String dtype</text>
<text class="mono" x="18" y="129">+String cardNumber</text>
<text class="mono" x="18" y="150">+Int expMonth</text>
<text class="mono" x="18" y="171">+Int expYear</text>
</g>
<g transform="translate(707,843)">
  <rect class="card" x="0" y="0" width="340" height="217" rx="5" fill="#F7F1E7" stroke="#B88A44"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#B88A44"/>
  <text class="small" x="170" y="26" text-anchor="middle">«Table Per Class credi.»</text>
  <text class="label" x="170" y="61" text-anchor="middle">CreditCard_TablePerClass</text>
  <text class="mono" x="18" y="108">+Int id</text>
<text class="mono" x="18" y="129">+String owner</text>
<text class="mono" x="18" y="150">+String cardNumber</text>
<text class="mono" x="18" y="171">+Int expMonth</text>
<text class="mono" x="18" y="192">+Int expYear</text>
</g>
</svg>
