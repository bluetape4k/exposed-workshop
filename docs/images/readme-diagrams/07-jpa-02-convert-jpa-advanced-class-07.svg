<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1102 760" width="1102" height="760" role="img" aria-label="Inheritance strategy comparison diagram">
  <defs>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="136%">
      <feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
    <style>
      .canvas{fill:#f6f9fc}
      .frame{fill:#ffffff;stroke:#d7e2ec;stroke-width:1.5}
      .card{fill:#ffffff;stroke-width:1.9;filter:url(#shadow)}
      .head{stroke-width:0}
      .title{font-family:"Architects Daughter";font-size:32px;fill:#1e293b}
      .subtitle{font-family:"Comic Mono";font-size:13px;fill:#536476}
      .cardTitle{font-family:"Architects Daughter";font-size:21px;fill:#1e293b}
      .badge{font-family:"Comic Mono";font-size:12px;font-weight:700;fill:#334155}
      .section{font-family:"Architects Daughter";font-size:15px;fill:#334155}
      .text{font-family:"Comic Mono";font-size:12px;fill:#475569}
      .strong{font-family:"Comic Mono";font-size:12px;font-weight:700;fill:#1e3a8a}
      .tradeoff{font-family:"Comic Mono";font-size:12px;font-weight:700;fill:#8a4f0a}
      .divider{stroke:#cbd5e1;stroke-width:1.2;stroke-dasharray:6 6}
      .noteBox{fill:#f8fafc;stroke:#d7e2ec;stroke-width:1.2}
      .note{font-family:"Comic Mono";font-size:12px;fill:#475569}
    </style>
  </defs>

  <rect width="1102" height="760" class="canvas"/>
  <rect x="20" y="20" width="1062" height="720" rx="16" class="frame"/>
  <text x="48" y="60" class="title">Inheritance Strategy Comparison</text>
  <text x="48" y="83" class="subtitle">JPA annotations map to explicit Exposed table shapes, DAO filters, and query tradeoffs.</text>

  <g id="single-table" data-node="single-table-strategy">
    <rect x="70" y="132" width="300" height="460" rx="12" class="card" stroke="#16a34a"/>
    <path d="M70,178 L70,144 Q70,132 82,132 L358,132 Q370,132 370,144 L370,178 Z" class="head" fill="#dcfce7"/>
    <text x="220" y="162" class="cardTitle" text-anchor="middle">Single Table</text>
    <text x="220" y="206" class="badge" text-anchor="middle">@Inheritance(SINGLE_TABLE)</text>

    <text x="100" y="248" class="section">Schema shape</text>
    <text x="118" y="276" class="strong">1 physical table</text>
    <text x="118" y="298" class="text">billing + dtype column</text>
    <text x="118" y="320" class="text">subtype fields nullable</text>

    <line x1="100" y1="350" x2="340" y2="350" class="divider"/>
    <text x="100" y="382" class="section">Exposed pattern</text>
    <text x="118" y="410" class="text">IntIdTable("billing")</text>
    <text x="118" y="432" class="text">DAO new() sets dtype</text>
    <text x="118" y="454" class="text">findById filters dtype</text>

    <line x1="100" y1="484" x2="340" y2="484" class="divider"/>
    <text x="100" y="516" class="section">Tradeoff</text>
    <text x="118" y="544" class="text">Fast no-join reads</text>
    <text x="118" y="566" class="tradeoff">nullable column growth</text>
  </g>

  <g id="joined-table" data-node="joined-table-strategy">
    <rect x="401" y="132" width="300" height="460" rx="12" class="card" stroke="#3b82f6"/>
    <path d="M401,178 L401,144 Q401,132 413,132 L689,132 Q701,132 701,144 L701,178 Z" class="head" fill="#dbeafe"/>
    <text x="551" y="162" class="cardTitle" text-anchor="middle">Joined Table</text>
    <text x="551" y="206" class="badge" text-anchor="middle">@Inheritance(JOINED)</text>

    <text x="431" y="248" class="section">Schema shape</text>
    <text x="449" y="276" class="strong">1 + n tables</text>
    <text x="449" y="298" class="text">joined_person parent</text>
    <text x="449" y="320" class="text">child PK is also FK</text>

    <line x1="431" y1="350" x2="671" y2="350" class="divider"/>
    <text x="431" y="382" class="section">Exposed pattern</text>
    <text x="449" y="410" class="text">IntIdTable + IdTable</text>
    <text x="449" y="432" class="text">referencedOn child id</text>
    <text x="449" y="454" class="text">custom create/delete logic</text>

    <line x1="431" y1="484" x2="671" y2="484" class="divider"/>
    <text x="431" y="516" class="section">Tradeoff</text>
    <text x="449" y="544" class="text">Normalized schema</text>
    <text x="449" y="566" class="tradeoff">joins and multi-table writes</text>
  </g>

  <g id="table-per-class" data-node="table-per-class-strategy">
    <rect x="732" y="132" width="300" height="460" rx="12" class="card" stroke="#db2777"/>
    <path d="M732,178 L732,144 Q732,132 744,132 L1020,132 Q1032,132 1032,144 L1032,178 Z" class="head" fill="#fce7f3"/>
    <text x="882" y="162" class="cardTitle" text-anchor="middle">Table Per Class</text>
    <text x="882" y="206" class="badge" text-anchor="middle">@Inheritance(TABLE_PER_CLASS)</text>

    <text x="762" y="248" class="section">Schema shape</text>
    <text x="780" y="276" class="strong">n independent tables</text>
    <text x="780" y="298" class="text">credit_card table</text>
    <text x="780" y="320" class="text">bank_account table</text>

    <line x1="762" y1="350" x2="1002" y2="350" class="divider"/>
    <text x="762" y="382" class="section">Exposed pattern</text>
    <text x="780" y="410" class="text">TimebasedUUIDTable base</text>
    <text x="780" y="432" class="text">common columns repeated</text>
    <text x="780" y="454" class="text">one DAO per subtype</text>

    <line x1="762" y1="484" x2="1002" y2="484" class="divider"/>
    <text x="762" y="516" class="section">Tradeoff</text>
    <text x="780" y="544" class="text">Independent subtype reads</text>
    <text x="780" y="566" class="tradeoff">cross-type query is hard</text>
  </g>

  <rect x="118" y="650" width="866" height="44" rx="10" class="noteBox"/>
  <text x="551" y="677" class="note" text-anchor="middle">The examples intentionally model inheritance as table design, not hidden ORM metadata.</text>
</svg>
