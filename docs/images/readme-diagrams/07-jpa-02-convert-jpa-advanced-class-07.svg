  <text class="label" x="170" y="61" text-anchor="middle">Employee_Joined</text>
  <text class="mono" x="18" y="108">+Int id</text>
<text class="mono" x="18" y="129">+String empNo</text>
<text class="mono" x="18" y="150">+String empTitle</text>
<text class="mono" x="18" y="171">+Employee manager</text>
</g>
<g transform="translate(912,505)">
  <rect class="card" x="0" y="0" width="340" height="175" rx="5" fill="#E9F7F6" stroke="#45A7A1"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#45A7A1"/>
  <text class="small" x="170" y="26" text-anchor="middle">«Single Table billing»</text>
  <text class="label" x="170" y="61" text-anchor="middle">BankAccount_SingleTable</text>
