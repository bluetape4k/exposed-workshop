<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" width="1400" height="760" role="img" aria-label="Measured Exposed JDBC example architecture">
  <defs>
    <marker id="arrowBlue" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto" data-role="primary" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563eb" stroke="#2563eb" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <style>
      .canvas{fill:#f6f9fc}.frame{fill:#fff;stroke:#d7e2ec;stroke-width:1.5}.title{font-family:"Architects Daughter";font-size:31px;fill:#1e293b}.subtitle,.detail{font-family:"Comic Mono";fill:#536476}.subtitle{font-size:14px}.detail{font-size:13px}.label{font-family:"Architects Daughter";font-size:19px;fill:#1e293b}.small{font-family:"Comic Mono";font-size:11px;fill:#64748b}.panel{fill:#f8fafc;stroke:#d7e2ec;stroke-width:1.2}.card{stroke-width:1.8;filter:url(#shadow)}.flow{fill:none;stroke:#2563eb;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowBlue)}
    </style>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="1400" height="760" class="canvas"/>
  <rect x="20" y="20" width="1360" height="720" rx="16" class="frame"/>
  <text x="50" y="62" class="title">Measured Exposed JDBC Example</text>
  <text x="50" y="88" class="subtitle">Typed length, mass, and temperature columns normalize values before JDBC persistence and restore the measured family on read.</text>

  <rect x="55" y="135" width="1290" height="430" rx="14" class="panel"/>
  <text x="700" y="124" class="small" text-anchor="middle">SOURCE-BACKED DATA FLOW</text>

  <rect x="90" y="230" width="250" height="120" rx="12" fill="#dbeafe" stroke="#2563eb" class="card"/>
  <text x="215" y="267" class="label" text-anchor="middle">DSL / DAO tests</text>
  <text x="215" y="300" class="detail" text-anchor="middle">Ex01_MeasuredColumns</text>
  <text x="215" y="324" class="small" text-anchor="middle">insert + select + findById</text>

  <rect x="410" y="230" width="250" height="120" rx="12" fill="#dcfce7" stroke="#16a34a" class="card"/>
  <text x="535" y="267" class="label" text-anchor="middle">ProductTable</text>
  <text x="535" y="300" class="detail" text-anchor="middle">length / mass / temperature</text>
  <text x="535" y="324" class="small" text-anchor="middle">nullableMass is nullable</text>

  <rect x="730" y="230" width="250" height="120" rx="12" fill="#fef3c7" stroke="#d97706" class="card"/>
  <text x="855" y="267" class="label" text-anchor="middle">Measured ColumnType</text>
  <text x="855" y="300" class="detail" text-anchor="middle">Measure / Temperature</text>
  <text x="855" y="324" class="small" text-anchor="middle">base-unit encode / decode</text>

  <rect x="1050" y="230" width="250" height="120" rx="12" fill="#fce7f3" stroke="#db2777" class="card"/>
  <text x="1175" y="267" class="label" text-anchor="middle">JDBC database</text>
  <text x="1175" y="300" class="detail" text-anchor="middle">H2 / PostgreSQL / MySQL</text>
  <text x="1175" y="324" class="small" text-anchor="middle">DOUBLE physical columns</text>

  <path data-connector="tests-to-table" data-source="tests" data-target="table" d="M340,290 L410,290" class="flow"/>
  <path data-connector="table-to-column-type" data-source="table" data-target="column-type" d="M660,290 L730,290" class="flow"/>
  <path data-connector="column-type-to-jdbc" data-source="column-type" data-target="jdbc" d="M980,290 L1050,290" class="flow"/>

  <rect x="150" y="430" width="1100" height="90" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="700" y="462" class="detail" text-anchor="middle">Stored representation</text>
  <text x="700" y="490" class="small" text-anchor="middle">150 cm → 1.5 m · 77 °F → 298.15 K · read-back keeps Length / Mass / Temperature types</text>

  <rect x="210" y="615" width="980" height="70" rx="12" fill="#ecfdf5" stroke="#86efac" stroke-width="1.3"/>
  <text x="700" y="645" class="detail" text-anchor="middle">Compatibility boundary: existing schemas are unchanged; new DOUBLE columns use the provider's stable base units.</text>
  <text x="700" y="667" class="small" text-anchor="middle">Migration policy and measurement accuracy policy remain outside this workshop example.</text>
</svg>
