<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="title desc">
  <title id="title">Ktor WebSocket realtime outbox architecture</title>
  <desc id="desc">Ktor routes call NotificationService, Exposed persists notifications and realtime outbox rows, and RealtimeHub emits JSON frames through WebSocket replay and live streams.</desc>
  <defs>
    <style>
      text { letter-spacing: 0; }
      .title { font-family: "Architects Daughter"; font-size: 40px; fill: #23323a; }
      .subtitle, .laneNote, .cardText, .label, .footer { font-family: "Comic Mono"; fill: #324750; }
      .subtitle { font-size: 17px; }
      .laneTitle { font-family: "Architects Daughter"; font-size: 24px; fill: #23323a; }
      .laneNote { font-size: 13px; fill: #5b6d75; }
      .cardTitle { font-family: "Architects Daughter"; font-size: 22px; fill: #20323b; }
      .cardText { font-size: 14px; }
      .label { font-size: 13px; font-weight: 700; }
      .footer { font-size: 14px; fill: #60717a; }
      .canvas { fill: #fbfcf8; stroke: #3f515a; stroke-width: 3; }
      .lane { stroke-width: 2.1; }
      .laneWeb { fill: #fff7e8; stroke: #b98e50; }
      .laneService { fill: #f2f0fb; stroke: #897bc2; }
      .laneStore { fill: #eef7f5; stroke: #6fa098; }
      .laneContract { fill: #f4f6f5; stroke: #8a9aa0; }
      .card { fill: #ffffff; stroke-width: 2.2; }
      .webCard { stroke: #ac7a34; }
      .serviceCard { stroke: #7b6bb4; }
      .storeCard { stroke: #5d948b; }
      .contractCard { stroke: #69777e; }
      .flowWeb { fill: none; stroke: #a2743d; stroke-width: 4.2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowWeb); }
      .flowService { fill: none; stroke: #7667b1; stroke-width: 4.2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowService); }
      .flowStore { fill: none; stroke: #3f8e84; stroke-width: 4.2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowStore); }
      .flowContract { fill: none; stroke: #69777e; stroke-width: 4.2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowContract); }
    </style>
    <marker id="arrowWeb" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto" data-role="primary" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#a2743d" stroke="#a2743d" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="arrowService" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto" data-role="primary" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#7667b1" stroke="#7667b1" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="arrowStore" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto" data-role="primary" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#3f8e84" stroke="#3f8e84" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="arrowContract" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto" data-role="primary" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#69777e" stroke="#69777e" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
  </defs>

  <rect x="24" y="24" width="1552" height="892" rx="20" class="canvas"/>
  <text x="800" y="78" text-anchor="middle" class="title">Ktor WebSocket Realtime Outbox</text>
  <text x="800" y="110" text-anchor="middle" class="subtitle">Ktor routes persist events first; a publish step emits WebSocket replay and live JSON frames.</text>

  <rect x="70" y="158" width="330" height="580" rx="18" class="lane laneWeb"/>
  <text x="104" y="198" class="laneTitle">Ktor routing edge</text>
  <text x="104" y="224" class="laneNote">Commands, publish, and WebSocket.</text>

  <rect x="470" y="158" width="330" height="580" rx="18" class="lane laneService"/>
  <text x="504" y="198" class="laneTitle">Service and hub</text>
  <text x="504" y="224" class="laneNote">Validate, publish, and emit JSON.</text>

  <rect x="870" y="158" width="300" height="580" rx="18" class="lane laneStore"/>
  <text x="904" y="198" class="laneTitle">Exposed outbox store</text>
  <text x="904" y="224" class="laneNote">Notifications plus outbox rows.</text>

  <rect x="1240" y="158" width="260" height="580" rx="18" class="lane laneContract"/>
  <text x="1274" y="198" class="laneTitle">WebSocket contract</text>
  <text x="1274" y="224" class="laneNote">Replay and visible failures.</text>

  <rect id="commands" x="112" y="260" width="246" height="118" rx="12" class="card webCard"/>
  <text x="235" y="294" text-anchor="middle" class="cardTitle">notificationRoutes</text>
  <text x="140" y="324" class="cardText">POST /notifications</text>
  <text x="140" y="344" class="cardText">POST /outbox/publish</text>
  <text x="140" y="364" class="cardText">GET /outbox</text>

  <rect id="events" x="112" y="480" width="246" height="118" rx="12" class="card webCard"/>
  <text x="235" y="514" text-anchor="middle" class="cardTitle">WebSocket /events</text>
  <text x="140" y="544" class="cardText">after query boundary</text>
  <text x="140" y="564" class="cardText">replay published rows</text>
  <text x="140" y="584" class="cardText">then collect live flow</text>

  <rect id="service" x="510" y="260" width="250" height="118" rx="12" class="card serviceCard"/>
  <text x="635" y="294" text-anchor="middle" class="cardTitle">NotificationService</text>
  <text x="538" y="324" class="cardText">normalize request fields</text>
  <text x="538" y="344" class="cardText">publish pending rows</text>
  <text x="538" y="364" class="cardText">PUBLISHED or FAILED</text>

  <rect id="hub" x="510" y="480" width="250" height="118" rx="12" class="card serviceCard"/>
  <text x="635" y="514" text-anchor="middle" class="cardTitle">RealtimeHub</text>
  <text x="538" y="544" class="cardText">MutableSharedFlow</text>
  <text x="538" y="564" class="cardText">replay 64 + buffer 64</text>
  <text x="538" y="584" class="cardText">tryEmit JSON event</text>

  <rect id="tables" x="910" y="310" width="230" height="210" rx="12" class="card storeCard"/>
  <g data-bluetape4k-icon="h2" transform="translate(934 356) scale(1.7)">
    <path fill="#09476B" d="M17.17 13.27c.14-.015.28-.023.416-.023.7 0 1.228.159 1.599.469.37.314.555.756.555 1.334a2.861 2.861 0 0 1-.43 1.455c-.291.492-.775 1.066-1.46 1.727-.453.446-1.061.976-1.821 1.592a48.02 48.02 0 0 1-2.275 1.742v2.083h9.895V21.24H17.99c.219-.159.59-.435 1.11-.832.519-.4 1.033-.835 1.55-1.311.817-.76 1.425-1.5 1.822-2.215a4.624 4.624 0 0 0 .597-2.268c0-1.213-.416-2.154-1.247-2.815-.828-.662-2.033-.994-3.613-.994-.344 0-.692.015-1.036.049V6.04H13.86v4.701H8.965V6.04H5.65v12.846h3.315v-5.661h4.89v5.661h.039c.31-.242.623-.487.933-.74a28.564 28.564 0 0 0 1.826-1.588 14.854 14.854 0 0 0 .517-.529zM12.011 23.3A11.327 11.327 0 0 1 .7 11.99 11.305 11.305 0 0 1 12.011.699a11.286 11.286 0 0 1 11.29 11.29v.351H24v-.351A11.985 11.985 0 0 0 12.011 0 12.008 12.008 0 0 0 0 11.989 12.026 12.026 0 0 0 12.011 24h.352v-.7z"/>
  </g>
  <text x="1040" y="340" text-anchor="middle" class="cardTitle">H2 realtime tables</text>
  <text x="990" y="386" class="cardText">ktor_realtime</text>
  <text x="990" y="406" class="cardText">notifications</text>
  <text x="990" y="432" class="cardText">ktor_realtime</text>
  <text x="990" y="452" class="cardText">outbox</text>
  <text x="990" y="478" class="cardText">status + attempts</text>

  <rect id="contract" x="1270" y="330" width="200" height="170" rx="12" class="card contractCard"/>
  <text x="1370" y="364" text-anchor="middle" class="cardTitle">Delivery states</text>
  <text x="1298" y="394" class="cardText">PENDING first</text>
  <text x="1298" y="416" class="cardText">PUBLISHED on emit</text>
  <text x="1298" y="438" class="cardText">FAILED keeps event</text>
  <text x="1298" y="460" class="cardText">after=id replay</text>

  <rect id="tests" x="110" y="790" width="1370" height="70" rx="12" class="card serviceCard"/>
  <text x="795" y="820" text-anchor="middle" class="cardTitle">Tested WebSocket realtime boundary</text>
  <text x="210" y="846" class="cardText">event persistence before delivery, WebSocket replay plus live stream, and failed delivery recording.</text>

  <path id="flow-commands-service" data-connector="flow-commands-service" d="M 358 319 H 510" class="flowWeb"/>
  <path id="flow-events-hub" data-connector="flow-events-hub" d="M 358 539 H 510" class="flowWeb"/>
  <path id="flow-service-hub" data-connector="flow-service-hub" d="M 635 378 V 480" class="flowService"/>
  <path id="flow-service-store" data-connector="flow-service-store" d="M 760 319 H 835 Q 855 319 855 339 L 855 395 Q 855 415 875 415 L 910 415" class="flowService"/>
  <path id="flow-store-contract" data-connector="flow-store-contract" d="M 1140 415 H 1270" class="flowStore"/>
  <path id="flow-hub-contract" data-connector="flow-hub-contract" d="M 760 539 H 835 Q 855 539 855 559 L 855 640 Q 855 660 875 660 H 1370 Q 1390 660 1390 640 L 1390 500" class="flowContract"/>

  <text x="434" y="303" text-anchor="middle" class="label">commands</text>
  <text x="434" y="523" text-anchor="middle" class="label">websocket</text>
  <text x="664" y="432" text-anchor="middle" class="label">deliver</text>
  <text x="850" y="304" text-anchor="middle" class="label">transaction</text>
  <text x="1205" y="399" text-anchor="middle" class="label">status</text>
  <text x="1040" y="684" text-anchor="middle" class="label">shared-flow replay</text>

  <text x="800" y="900" text-anchor="middle" class="footer">Domain rows and outbox rows are committed before delivery; live JSON frames are emitted from an in-process SharedFlow hub.</text>
</svg>
