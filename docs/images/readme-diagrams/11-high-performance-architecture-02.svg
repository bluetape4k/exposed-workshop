<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Chapter 11 high performance overall architecture">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowCache" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto" data-role="primary" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#3f8e84" stroke="#3f8e84" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="arrowRoute" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto" data-role="primary" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#a2743d" stroke="#a2743d" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="arrowVerify" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto" data-role="primary" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#7667b1" stroke="#7667b1" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <style>
      text { letter-spacing: 0; }
      .canvas { fill: #fbfcf8; stroke: #3f515a; stroke-width: 3; }
      .title { font-family: "Architects Daughter"; font-size: 36px; fill: #23323a; }
      .subtitle,.laneNote,.cardText,.label,.footer { font-family: "Comic Mono"; fill: #324750; }
      .subtitle { font-size: 15px; }
      .laneTitle { font-family: "Architects Daughter"; font-size: 20px; fill: #23323a; }
      .laneNote { font-size: 12px; fill: #5b6d75; }
      .cardTitle { font-family: "Architects Daughter"; font-size: 20px; fill: #20323b; }
      .cardText { font-size: 13px; }
      .label { font-size: 12px; font-weight: 700; }
      .footer { font-size: 13px; fill: #60717a; }
      .laneRuntime { fill: #eef7f5; stroke: #6fa098; stroke-width: 2.2; }
      .laneDecision { fill: #fff7e8; stroke: #b98e50; stroke-width: 2.2; }
      .laneEvidence { fill: #f5f3fb; stroke: #8f82bd; stroke-width: 2.2; }
      .card { fill: #fff; stroke-width: 2.3; filter: url(#shadow); }
      .cacheCard { stroke: #5d948b; }
      .routeCard { stroke: #ac7a34; }
      .verifyCard { stroke: #7b6bb4; }
      .flowCache { fill: none; stroke: #3f8e84; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowCache); }
      .flowRoute { fill: none; stroke: #a2743d; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowRoute); }
      .flowVerify { fill: none; stroke: #7667b1; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowVerify); }
      .legendLine { fill: none; stroke-width: 4; stroke-linecap: round; }
    </style>
  </defs>

  <rect x="24" y="24" width="1552" height="852" rx="20" class="canvas"/>
  <text x="800" y="76" text-anchor="middle" class="title">High Performance Overall Architecture</text>
  <text x="800" y="106" text-anchor="middle" class="subtitle">Chapter 11 keeps cache strategy, datasource routing, and benchmark evidence explicit across Spring, WebFlux, and Ktor runtimes.</text>

  <rect x="70" y="148" width="400" height="640" rx="18" class="laneRuntime"/>
  <text x="110" y="188" class="laneTitle">Runtime entrypoints</text>
  <text x="110" y="214" class="laneNote">Controllers, routes, and Gradle tasks</text>
  <text x="110" y="232" class="laneNote">start the optimization scenario.</text>

  <rect x="600" y="148" width="400" height="640" rx="18" class="laneDecision"/>
  <text x="640" y="188" class="laneTitle">Optimization decisions</text>
  <text x="640" y="214" class="laneNote">Repositories and routers choose the</text>
  <text x="640" y="232" class="laneNote">latency/consistency tradeoff.</text>

  <rect x="1130" y="148" width="400" height="640" rx="18" class="laneEvidence"/>
  <text x="1170" y="188" class="laneTitle">Backing systems and evidence</text>
  <text x="1170" y="214" class="laneNote">Stores, pools, tests, and reports prove</text>
  <text x="1170" y="232" class="laneNote">the chosen behavior.</text>

  <rect id="cacheRuntime" x="110" y="280" width="320" height="116" rx="12" class="card cacheCard"/>
  <text x="270" y="312" text-anchor="middle" class="cardTitle">Spring/WebFlux/Ktor cache APIs</text>
  <text x="138" y="340" class="cardText">MVC controllers, suspend WebFlux flows</text>
  <text x="138" y="360" class="cardText">and Ktor routes expose cache source</text>
  <text x="138" y="380" class="cardText">or persistence fallback results</text>

  <rect id="cacheDecision" x="640" y="280" width="320" height="116" rx="12" class="card cacheCard"/>
  <text x="800" y="312" text-anchor="middle" class="cardTitle">Cache strategy repositories</text>
  <text x="668" y="340" class="cardText">read-through + write-through user data</text>
  <text x="668" y="360" class="cardText">read-only credentials cache</text>
  <text x="668" y="380" class="cardText">write-behind event buffering</text>

  <rect id="cacheEvidence" x="1170" y="280" width="320" height="116" rx="12" class="card cacheCard"/>
  <text x="1330" y="312" text-anchor="middle" class="cardTitle">Redis, DB, and fallback tests</text>
  <text x="1198" y="340" class="cardText">Redisson near cache + Redis L2</text>
  <text x="1198" y="360" class="cardText">Exposed table access on cache miss</text>
  <text x="1198" y="380" class="cardText">Awaitility verifies async persistence</text>

  <rect id="routingRuntime" x="110" y="440" width="320" height="116" rx="12" class="card routeCard"/>
  <text x="270" y="472" text-anchor="middle" class="cardTitle">Spring and Ktor routing APIs</text>
  <text x="138" y="500" class="cardText">X-Tenant-Id and read-only transaction</text>
  <text x="138" y="520" class="cardText">or route context identify the request</text>
  <text x="138" y="540" class="cardText">tenant and read/write role</text>

  <rect id="routingDecision" x="640" y="440" width="320" height="116" rx="12" class="card routeCard"/>
  <text x="800" y="472" text-anchor="middle" class="cardTitle">Routing key resolver</text>
  <text x="668" y="500" class="cardText">tenant + rw/ro key chooses DataSource</text>
  <text x="668" y="520" class="cardText">registry lookup replaces static maps</text>
  <text x="668" y="540" class="cardText">default tenant fallback is explicit</text>

  <rect id="routingEvidence" x="1170" y="440" width="320" height="116" rx="12" class="card routeCard"/>
  <text x="1330" y="472" text-anchor="middle" class="cardTitle">Registered Hikari pools</text>
  <text x="1198" y="500" class="cardText">default/acme rw and ro targets</text>
  <text x="1198" y="520" class="cardText">missing ro can reuse rw safely</text>
  <text x="1198" y="540" class="cardText">tests lock false-positive routing</text>

  <rect id="benchmarkRuntime" x="110" y="600" width="320" height="116" rx="12" class="card verifyCard"/>
  <text x="270" y="632" text-anchor="middle" class="cardTitle">Benchmark Gradle tasks</text>
  <text x="138" y="660" class="cardText">smokeBenchmark gives fast trend checks</text>
  <text x="138" y="680" class="cardText">benchmarkMarkdown records profiles</text>
  <text x="138" y="700" class="cardText">main profile is for precise runs</text>

  <rect id="benchmarkDecision" x="640" y="600" width="320" height="116" rx="12" class="card verifyCard"/>
  <text x="800" y="632" text-anchor="middle" class="cardTitle">JMH measurement harness</text>
  <text x="668" y="660" class="cardText">read-through hit and miss cost</text>
  <text x="668" y="680" class="cardText">routing key resolver overhead</text>
  <text x="668" y="700" class="cardText">strategy comparison workloads</text>

  <rect id="benchmarkEvidence" x="1170" y="600" width="320" height="116" rx="12" class="card verifyCard"/>
  <text x="1330" y="632" text-anchor="middle" class="cardTitle">Reports and operational checks</text>
  <text x="1198" y="660" class="cardText">JSON and Markdown benchmark output</text>
  <text x="1198" y="680" class="cardText">hit-rate, invalidation, backpressure</text>
  <text x="1198" y="700" class="cardText">and freshness SLA checkpoints</text>

  <path id="cache-runtime-decision" data-connector="cache-runtime-decision" d="M 430 338 L 640 338" class="flowCache"/>
  <path id="cache-decision-evidence" data-connector="cache-decision-evidence" d="M 960 338 L 1170 338" class="flowCache"/>
  <path id="routing-runtime-decision" data-connector="routing-runtime-decision" d="M 430 498 L 640 498" class="flowRoute"/>
  <path id="routing-decision-evidence" data-connector="routing-decision-evidence" d="M 960 498 L 1170 498" class="flowRoute"/>
  <path id="benchmark-runtime-decision" data-connector="benchmark-runtime-decision" d="M 430 658 L 640 658" class="flowVerify"/>
  <path id="benchmark-decision-evidence" data-connector="benchmark-decision-evidence" d="M 960 658 L 1170 658" class="flowVerify"/>

  <text x="535" y="322" text-anchor="middle" class="label">cache behavior</text>
  <text x="1065" y="322" text-anchor="middle" class="label">fallback proof</text>
  <text x="535" y="482" text-anchor="middle" class="label">routing context</text>
  <text x="1065" y="482" text-anchor="middle" class="label">selected pool</text>
  <text x="535" y="642" text-anchor="middle" class="label">profile run</text>
  <text x="1065" y="642" text-anchor="middle" class="label">trend evidence</text>

  <rect x="400" y="818" width="800" height="36" rx="18" fill="#ffffff" stroke="#d7e2de" stroke-width="1.4"/>
  <path d="M 438 836 L 496 836" class="legendLine" stroke="#3f8e84"/>
  <text x="508" y="840" class="footer">cache strategy</text>
  <path d="M 658 836 L 716 836" class="legendLine" stroke="#a2743d"/>
  <text x="728" y="840" class="footer">datasource routing</text>
  <path d="M 938 836 L 996 836" class="legendLine" stroke="#7667b1"/>
  <text x="1008" y="840" class="footer">benchmark and operations</text>
</svg>
