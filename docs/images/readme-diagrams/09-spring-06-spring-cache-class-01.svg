  <polyline points="1290,681 1295,690 1300,681" class="wireHead" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <path data-connector="lettuce-cache-config-builds-redis-cache-manager" d="M1295,580 V638 Q1295,650 1283,650 H1112 Q1100,650 1100,662 V690" class="wire"/>
  <polyline points="1095,681 1100,690 1105,681" class="wireHead" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
