  <rect x="70" y="953" width="1355" height="42" rx="10" fill="#f8fafc" stroke="#d7e2ec"/>
  <text x="747.5" y="979" text-anchor="middle" class="legend">Solid hollow triangle = implements/extends; dashed gray = uses/injects; dashed brown = creates/configures bean.</text>
