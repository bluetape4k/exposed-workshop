      <feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
    <marker id="umlHead" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="16" viewBox="0 0 18 16" refX="17" refY="8" orient="auto" data-role="uml-hollow" data-tip-direction="positive-x">
      <path d="M1,1 L17,8 L1,15 Z" fill="#fff" stroke="#64748b" stroke-width="1.8" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="depHead" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#64748b" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="wireHead" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#8a6f3e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <style>
      .canvas{fill:#f6f9fc}
      .frame{fill:#fff;stroke:#d7e2ec;stroke-width:1.5}
      .card{stroke-width:1.7;filter:url(#shadow)}
      .title{font-family:"Architects Daughter";font-size:32px;fill:#1e293b}
      .subtitle,.detail,.tiny{font-family:"Comic Mono";fill:#536476}
      .subtitle{font-size:13px}
      .label{font-family:"Architects Daughter";font-size:16px;fill:#1e293b}
      .detail{font-size:11.5px}
      .tiny{font-size:10px;fill:#64748b}
      .legend{font-family:"Comic Mono";font-size:12px;fill:#536476}
      .inherit{fill:none;stroke:#64748b;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#umlHead)}
      .depend{fill:none;stroke:#64748b;stroke-width:1.6;stroke-dasharray:6 6;stroke-linecap:round;stroke-linejoin:round}
