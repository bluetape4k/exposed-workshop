  <polyline points="861,530 870,535 861,540" class="depHead" stroke-dasharray="none" style="stroke-dasharray:none!important"/>

  <path data-connector="lettuce-cache-config-creates-cache-manager-bean" d="M1165,525 H1110" class="wire"/>
  <polyline points="1119,520 1110,525 1119,530" class="wireHead" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
