  <rect width="1500" height="1030" class="canvas"/>
  <rect x="20" y="20" width="1460" height="990" rx="16" class="frame"/>

  <text x="48" y="58" class="title">09 Spring: Spring Cache (06)</text>
  <text x="48" y="80" class="subtitle">Source-derived class relationships for Spring Cache, RedisCacheManager, and Exposed-backed country lookup</text>

  <rect x="70" y="132" width="250" height="76" rx="10" fill="#fce7f3" stroke="#db2777" class="card"/>
  <text x="195" y="164" text-anchor="middle" class="label">Serializable</text>
  <text x="195" y="190" text-anchor="middle" class="detail">Redis value contract</text>

  <rect x="370" y="132" width="250" height="76" rx="10" fill="#dbeafe" stroke="#3b82f6" class="card"/>
  <text x="495" y="164" text-anchor="middle" class="label">IntIdTable</text>
  <text x="495" y="190" text-anchor="middle" class="detail">Exposed table base</text>

  <rect x="670" y="132" width="250" height="76" rx="10" fill="#ede9fe" stroke="#7c3aed" class="card"/>
  <text x="795" y="164" text-anchor="middle" class="label">IntEntity</text>
  <text x="795" y="190" text-anchor="middle" class="detail">optional DAO base</text>

  <rect x="970" y="132" width="350" height="76" rx="10" fill="#dcfce7" stroke="#16a34a" class="card"/>
  <text x="1145" y="164" text-anchor="middle" class="label">ApplicationListener</text>
  <text x="1145" y="190" text-anchor="middle" class="detail">ApplicationReadyEvent hook</text>

  <rect x="70" y="280" width="250" height="92" rx="10" fill="#fdf2f8" stroke="#db2777" class="card"/>
  <text x="195" y="313" text-anchor="middle" class="label">CountryRecord</text>
  <text x="195" y="339" text-anchor="middle" class="detail">code, name, description</text>
  <text x="195" y="358" text-anchor="middle" class="tiny">DTO returned by repository</text>

  <rect x="370" y="280" width="250" height="112" rx="10" fill="#ffedd5" stroke="#ea580c" class="card"/>
  <text x="495" y="313" text-anchor="middle" class="label">CountryTable</text>
  <text x="495" y="339" text-anchor="middle" class="detail">countries table schema</text>
  <text x="495" y="358" text-anchor="middle" class="tiny">code unique, name, description</text>
  <text x="495" y="377" text-anchor="middle" class="tiny">used by select/update/batchInsert</text>

  <rect x="670" y="280" width="250" height="92" rx="10" fill="#ccfbf1" stroke="#0f766e" class="card"/>
  <text x="795" y="313" text-anchor="middle" class="label">Country</text>
  <text x="795" y="339" text-anchor="middle" class="detail">DAO entity for CountryTable</text>
  <text x="795" y="358" text-anchor="middle" class="tiny">present but repository maps rows</text>

  <rect x="970" y="280" width="350" height="92" rx="10" fill="#e2e8f0" stroke="#64748b" class="card"/>
  <text x="1145" y="313" text-anchor="middle" class="label">DataPopulator</text>
  <text x="1145" y="339" text-anchor="middle" class="detail">loads ISO country rows on ready</text>
  <text x="1145" y="358" text-anchor="middle" class="tiny">transaction { CountryTable.batchInsert(...) }</text>

  <rect x="340" y="470" width="470" height="150" rx="10" fill="#fff7ed" stroke="#ea580c" class="card"/>
  <text x="575" y="504" text-anchor="middle" class="label">CountryRepository</text>
  <text x="575" y="531" text-anchor="middle" class="detail">@CacheConfig(cache:code:country)</text>
  <text x="575" y="553" text-anchor="middle" class="tiny">@Cacheable findByCode(code) reads transaction {} on miss</text>
  <text x="575" y="572" text-anchor="middle" class="tiny">update(record) evicts country:{code} through CacheManager</text>
  <text x="575" y="591" text-anchor="middle" class="tiny">evictCacheAll() invalidates the named cache</text>

  <rect x="870" y="480" width="240" height="110" rx="10" fill="#fef3c7" stroke="#d97706" class="card"/>
  <text x="990" y="515" text-anchor="middle" class="label">CacheManager</text>
  <text x="990" y="542" text-anchor="middle" class="detail">Spring Cache API</text>
  <text x="990" y="562" text-anchor="middle" class="tiny">getCache(...).evict / invalidate</text>

  <rect x="1165" y="470" width="260" height="110" rx="10" fill="#dcfce7" stroke="#16a34a" class="card"/>
  <text x="1295" y="504" text-anchor="middle" class="label">LettuceCacheConfig</text>
  <text x="1295" y="531" text-anchor="middle" class="detail">@EnableCaching</text>
  <text x="1295" y="553" text-anchor="middle" class="tiny">LZ4Fory serializer, TTL 10 min</text>

  <rect x="70" y="690" width="250" height="94" rx="10" fill="#e0f2fe" stroke="#0284c7" class="card"/>
  <text x="195" y="724" text-anchor="middle" class="label">ExposedConfig</text>
  <text x="195" y="751" text-anchor="middle" class="detail">@EnableTransactionManagement</text>
  <text x="195" y="770" text-anchor="middle" class="tiny">connects DataSource to Exposed</text>

  <rect x="370" y="690" width="250" height="94" rx="10" fill="#ede9fe" stroke="#7c3aed" class="card"/>
  <text x="495" y="724" text-anchor="middle" class="label">DatabaseConfig</text>
  <text x="495" y="751" text-anchor="middle" class="detail">max entity cache = 500</text>
  <text x="495" y="770" text-anchor="middle" class="tiny">passed into Database.connect</text>

  <rect x="640" y="690" width="230" height="94" rx="10" fill="#e2e8f0" stroke="#64748b" class="card"/>
  <text x="755" y="724" text-anchor="middle" class="label">Database</text>
  <text x="755" y="751" text-anchor="middle" class="detail">Exposed JDBC handle</text>
  <text x="755" y="770" text-anchor="middle" class="tiny">used by transaction { ... }</text>

  <rect x="900" y="690" width="240" height="94" rx="10" fill="#fef3c7" stroke="#d97706" class="card"/>
  <text x="1020" y="724" text-anchor="middle" class="label">RedisCacheManager</text>
  <text x="1020" y="751" text-anchor="middle" class="detail">transactionAware()</text>
  <text x="1020" y="770" text-anchor="middle" class="tiny">concrete CacheManager bean</text>

  <rect x="1165" y="690" width="260" height="94" rx="10" fill="#ffedd5" stroke="#ea580c" class="card"/>
  <text x="1295" y="724" text-anchor="middle" class="label">RedisCacheConfiguration</text>
  <text x="1295" y="751" text-anchor="middle" class="detail">serializeValuesWith(LZ4Fory)</text>
  <text x="1295" y="770" text-anchor="middle" class="tiny">entryTtl(Duration.ofMinutes(10))</text>

  <rect x="70" y="835" width="320" height="82" rx="10" fill="#dbeafe" stroke="#3b82f6" class="card"/>
  <text x="230" y="867" text-anchor="middle" class="label">SpringCacheApplication</text>
  <text x="230" y="894" text-anchor="middle" class="detail">Spring Boot entry point</text>

  <rect x="440" y="835" width="320" height="82" rx="10" fill="#fef3c7" stroke="#d97706" class="card"/>
  <text x="600" y="867" text-anchor="middle" class="label">RedisServer.Launcher.redis</text>
  <text x="600" y="894" text-anchor="middle" class="detail">Testcontainer Redis endpoint</text>

