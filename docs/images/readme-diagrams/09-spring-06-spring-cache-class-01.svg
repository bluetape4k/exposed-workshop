<line class="dash" x1="377" y1="548" x2="621" y2="548"/>
<text class="mono" x="383" y="572">+ +redisCacheConfiguration()</text>
<rect class="card" x="675" y="486" width="280" height="138" rx="14" fill="#f7d9df" stroke="#d9899b"/>
<text class="smallLabel" x="815" y="522" text-anchor="middle">RedisCacheConfiguration</text>
<line class="dash" x1="693" y1="548" x2="937" y2="548"/>
<text class="mono" x="699" y="572">+ +cacheManager(factory, config)</text>
<rect class="card" x="43" y="658" width="280" height="138" rx="14" fill="#d9ecff" stroke="#7eaad3"/>
