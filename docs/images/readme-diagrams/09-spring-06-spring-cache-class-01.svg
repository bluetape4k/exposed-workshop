<text class="mono" x="67" y="228">+ +code: String</text>
<text class="mono" x="67" y="245">+ +name: String</text>
<text class="mono" x="67" y="262">+ +description: String?</text>
<rect class="card" x="359" y="142" width="280" height="138" rx="14" fill="#d9ecff" stroke="#7eaad3"/>
<text class="smallLabel" x="499" y="178" text-anchor="middle">«@Component @CacheConf.»</text>
