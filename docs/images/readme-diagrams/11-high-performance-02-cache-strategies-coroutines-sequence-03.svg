<svg xmlns="http://www.w3.org/2000/svg" width="2632" height="2116" viewBox="0 0 2632 2116" role="img" aria-label="Request Processing Flow — Write-Behind Async Event Loading (Coroutines)">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#758297" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 0 1 L 12 6 L 0 11 Z" fill="#ffffff" stroke="#758297" stroke-width="1.8"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="2632" height="2116"/>
<rect class="frame" x="32" y="28" width="2568" height="2060" rx="28"/>
<text class="title" x="66" y="82">Request Processing Flow — Write-Behind Async Event Loading (Coroutines)</text>
<text class="subtitle" x="70" y="118">Sequence messages from the original Mermaid source</text>
<rect class="card" x="-10" y="166" width="300" height="72" rx="20" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="140" y="209" text-anchor="middle">WebFlux Client</text>
<line class="lifeline" x1="140" y1="252" x2="140" y2="2056" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="382" y="166" width="300" height="72" rx="20" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="532" y="209" text-anchor="middle">UserEventController</text>
<line class="lifeline" x1="532" y1="252" x2="532" y2="2056" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="774" y="166" width="300" height="72" rx="20" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="924" y="198.5" text-anchor="middle">User Event Cache</text>
<text class="smallLabel" x="924" y="219.5" text-anchor="middle">Repository</text>
<line class="lifeline" x1="924" y1="252" x2="924" y2="2056" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="1166" y="166" width="300" height="72" rx="20" fill="#FDECEF" stroke="#DC6B82"/>
<text class="smallLabel" x="1316" y="209" text-anchor="middle">Near Cache (L1)</text>
<line class="lifeline" x1="1316" y1="252" x2="1316" y2="2056" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="1558" y="166" width="300" height="72" rx="20" fill="#E9F7F6" stroke="#45A7A1"/>
<text class="smallLabel" x="1708" y="209" text-anchor="middle">Redis (L2)</text>
<line class="lifeline" x1="1708" y1="252" x2="1708" y2="2056" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="1950" y="166" width="300" height="72" rx="20" fill="#F1ECFF" stroke="#8A72D6"/>
<text class="smallLabel" x="2100" y="198.5" text-anchor="middle">Coroutine Async</text>
<text class="smallLabel" x="2100" y="219.5" text-anchor="middle">Queue</text>
<line class="lifeline" x1="2100" y1="252" x2="2100" y2="2056" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="2342" y="166" width="300" height="72" rx="20" fill="#F7F1E7" stroke="#B88A44"/>
<text class="smallLabel" x="2492" y="209" text-anchor="middle">Database</text>
<line class="lifeline" x1="2492" y1="252" x2="2492" y2="2056" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect x="176.5" y="286" width="319" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="194.5" y="313" text-anchor="start">1. POST /user-events/bulk (suspend)</text>
<path class="line" d="M140 344 L532 344"/>
<rect x="597" y="396" width="262" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="615" y="423" text-anchor="start">2. saveAll(events) [suspend]</text>
<path class="line" d="M532 454 L924 454"/>
<rect x="993" y="506" width="254" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1011" y="533" text-anchor="start">3. put events (immediately)</text>
<path class="line" d="M924 564 L1316 564"/>
<rect x="1189" y="616" width="254" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1207" y="643" text-anchor="start">4. put events (immediately)</text>
<path class="line" d="M924 674 L1708 674"/>
<rect x="1015" y="726" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1033" y="753" text-anchor="start">5. Save complete</text>
<path class="dashed" d="M1708 784 L532 784"/>
<rect x="231" y="836" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="249" y="863" text-anchor="start">6. 200 OK</text>
<path class="dashed" d="M532 894 L140 894"/>
<rect x="1789" y="946" width="230" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1807" y="973" text-anchor="start">7. enqueue dirty entries</text>
<path class="line" d="M1708 1004 L2100 1004"/>
<rect x="2108.5" y="1056" width="375" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="2126.5" y="1083" text-anchor="start">8. newSuspendedTransaction { batchInsert }</text>
<path class="line" d="M2100 1114 L2492 1114"/>
<rect x="2191" y="1166" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="2209" y="1193" text-anchor="start">9. commit</text>
<path class="dashed" d="M2492 1224 L2100 1224"/>
<rect x="1799" y="1276" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1817" y="1303" text-anchor="start">10. flush complete</text>
<path class="dashed" d="M2100 1334 L1708 1334"/>
<rect x="176.5" y="1386" width="319" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="194.5" y="1413" text-anchor="start">11. GET /user-events/{id} (suspend)</text>
<path class="line" d="M140 1444 L532 1444"/>
<rect x="605" y="1496" width="246" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="623" y="1523" text-anchor="start">12. findById(id) [suspend]</text>
<path class="line" d="M532 1554 L924 1554"/>
<rect x="1015" y="1606" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1033" y="1633" text-anchor="start">13. get(id)</text>
<path class="line" d="M924 1664 L1316 1664"/>
<rect x="1015" y="1716" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1033" y="1743" text-anchor="start">14. hit</text>
<path class="dashed" d="M1316 1774 L924 1774"/>
<rect x="623" y="1826" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="641" y="1853" text-anchor="start">15. UserEventRecord</text>
<path class="dashed" d="M924 1884 L532 1884"/>
<rect x="231" y="1936" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="249" y="1963" text-anchor="start">16. 200 OK + body</text>
<path class="dashed" d="M532 1994 L140 1994"/>
</svg>
