<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 780" width="1320" height="780" role="img" aria-label="Spring WebFlux Request Processing Flow">
<defs>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/></filter>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8 Z" fill="#64748b"/></marker>
<marker id="arrowGreen" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8 Z" fill="#16a34a"/></marker>
<marker id="arrowPurple" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8 Z" fill="#7c3aed"/></marker>
<style>
.canvas{fill:#f6f9fc}.frame{fill:#fff;stroke:#d7e2ec;stroke-width:1.5}
.title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:32px;fill:#1e293b}
.subtitle,.detail{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;fill:#536476}
.subtitle{font-size:13px}.detail{font-size:12px}.tiny{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:10px;fill:#64748b}
.label{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:17px;fill:#1e293b}
.panelTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:12px;letter-spacing:.08em;fill:#94a3b8}
.card{stroke-width:1.7;filter:url(#shadow)}.panel{fill:#f8fafc;stroke:#d7e2ec;stroke-width:1.2}
.arrow{fill:none;stroke:#64748b;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
.softArrow{fill:none;stroke:#94a3b8;stroke-width:1.35;stroke-dasharray:5 5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
.movieMap{fill:none;stroke:#16a34a;stroke-width:1.7;stroke-dasharray:5 5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowGreen)}
.actorMap{fill:none;stroke:#7c3aed;stroke-width:1.7;stroke-dasharray:5 5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowPurple)}
.lifeline{fill:none;stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:5 5;stroke-linecap:round;stroke-linejoin:round}
.inherit{fill:none;stroke:#475569;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.inheritHead{fill:#fff;stroke:#475569;stroke-width:1.8;stroke-linejoin:round}
</style>
</defs>
<rect width="1320" height="780" class="canvas"/>
<rect x="20" y="20" width="1280" height="740" rx="16" class="frame"/>
<text x="48" y="58" class="title">Spring WebFlux Request Processing Flow</text>
<text x="48" y="80" class="subtitle">Actor API request through suspend controller, suspended transaction, repository, and DTO mapping</text>
<rect x="50" y="122" width="136" height="52" rx="10" fill="#dbeafe" stroke="#3b82f6" class="card"/>
<text x="118" y="154" class="label" text-anchor="middle">Client</text>
<path d="M118,184 L118,704" class="lifeline"/>
<rect x="242" y="122" width="136" height="52" rx="10" fill="#ede9fe" stroke="#7c3aed" class="card"/>
<text x="310" y="144" class="label" text-anchor="middle">Suspend</text>
<text x="310" y="162" class="label" text-anchor="middle">Controller</text>
<path d="M310,184 L310,704" class="lifeline"/>
<rect x="452" y="122" width="136" height="52" rx="10" fill="#dcfce7" stroke="#16a34a" class="card"/>
<text x="520" y="144" class="label" text-anchor="middle">newSuspended</text>
<text x="520" y="162" class="label" text-anchor="middle">Transaction</text>
<path d="M520,184 L520,704" class="lifeline"/>
<rect x="662" y="122" width="136" height="52" rx="10" fill="#ffedd5" stroke="#ea580c" class="card"/>
<text x="730" y="144" class="label" text-anchor="middle">Actor</text>
<text x="730" y="162" class="label" text-anchor="middle">Repository</text>
<path d="M730,184 L730,704" class="lifeline"/>
<rect x="872" y="122" width="136" height="52" rx="10" fill="#fce7f3" stroke="#db2777" class="card"/>
<text x="940" y="154" class="label" text-anchor="middle">Actor Table</text>
<path d="M940,184 L940,704" class="lifeline"/>
<rect x="1062" y="122" width="136" height="52" rx="10" fill="#ccfbf1" stroke="#0f766e" class="card"/>
<text x="1130" y="154" class="label" text-anchor="middle">Actor Record</text>
<path d="M1130,184 L1130,704" class="lifeline"/>
<rect x="150" y="196" width="128" height="24" rx="8" fill="#fff" stroke="#d7e2ec"/>
<text x="214" y="213" class="tiny" text-anchor="middle">1. GET /actors/{id}</text>
<path d="M134,224 L294,224" class="arrow"/>
<rect x="342" y="258" width="146" height="24" rx="8" fill="#fff" stroke="#d7e2ec"/>
<text x="415" y="275" class="tiny" text-anchor="middle">2. enter readOnly suspend transaction</text>
<path d="M326,286 L504,286" class="arrow"/>
<rect x="552" y="320" width="146" height="24" rx="8" fill="#fff" stroke="#d7e2ec"/>
<text x="625" y="337" class="tiny" text-anchor="middle">3. call repository inside transaction</text>
<path d="M536,348 L714,348" class="arrow"/>
<rect x="762" y="382" width="146" height="24" rx="8" fill="#fff" stroke="#d7e2ec"/>
<text x="835" y="399" class="tiny" text-anchor="middle">4. select ActorTable by id</text>
<path d="M746,410 L924,410" class="arrow"/>
<rect x="972" y="444" width="126" height="24" rx="8" fill="#fff" stroke="#d7e2ec"/>
<text x="1035" y="461" class="tiny" text-anchor="middle">5. map row to ActorRecord</text>
<path d="M956,472 L1114,472" class="arrow"/>
<rect x="762" y="506" width="336" height="24" rx="8" fill="#fff" stroke="#d7e2ec"/>
<text x="930" y="523" class="tiny" text-anchor="middle">6. nullable DTO</text>
<path d="M1114,534 L746,534" class="softArrow"/>
<rect x="552" y="568" width="146" height="24" rx="8" fill="#fff" stroke="#d7e2ec"/>
<text x="625" y="585" class="tiny" text-anchor="middle">7. transaction returns DTO</text>
<path d="M714,596 L536,596" class="softArrow"/>
<rect x="342" y="630" width="146" height="24" rx="8" fill="#fff" stroke="#d7e2ec"/>
<text x="415" y="647" class="tiny" text-anchor="middle">8. resume suspend handler</text>
<path d="M504,658 L326,658" class="softArrow"/>
<rect x="150" y="676" width="128" height="24" rx="8" fill="#fff" stroke="#d7e2ec"/>
<text x="214" y="693" class="tiny" text-anchor="middle">9. 200 OK or 404 Not Found</text>
<path d="M294,704 L134,704" class="softArrow"/>
<rect x="76" y="714" width="1168" height="48" rx="10" fill="#ecfdf5" stroke="#86efac" stroke-width="1.3"/>
<text x="660" y="744" class="detail" text-anchor="middle">Search/create/delete use the same shape: suspend controller opens a suspended transaction, then repositories compose Exposed DSL or DAO work.</text>
</svg>
