<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="920" viewBox="0 0 1500 920">
<defs>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#8298a3" flood-opacity=".16"/></filter>
  <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#3f7d9c" stroke="#3f7d9c" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
  <marker id="arrowSoft" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#9b7d54" stroke="#9b7d54" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
  <marker id="arrowBranch" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b66a5b" stroke="#b66a5b" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
  <style><![CDATA[
    svg{font-family:"Architects Daughter","Comic Mono",ui-sans-serif,system-ui,sans-serif}.canvas{fill:#fbfcf8}.frame{fill:#fbfcf8;stroke:#41545d;stroke-width:3;filter:url(#shadow)}.title{font-family:"Architects Daughter";font-size:38px;fill:#263238}.subtitle,.msg,.footer,.altText,.badgeText{font-family:"Comic Mono";fill:#36464f}.subtitle{font-size:15px}.header,.head{fill:#ffffff;stroke:#546e7a;stroke-width:2;filter:url(#shadow)}.participant,.headText{font-family:"Architects Daughter";font-size:17px;fill:#1f3138}.life{fill:none;stroke:#9aaab1;stroke-width:2;stroke-dasharray:7 8}.activation{fill:#f3ecdf;stroke:#8f784e;stroke-width:1.5}.msg{font-size:11px}.call{fill:none;stroke:#3f7d9c;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.return{fill:none;stroke:#9b7d54;stroke-width:2.4;stroke-dasharray:8 6;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowSoft)}.branchReturn{stroke:#b66a5b;marker-end:url(#arrowBranch)}.label,.labelBox{fill:#ffffff;stroke:#d7e0e4;stroke-width:1.4}.badge{fill:#eaf4f8;stroke:#3f7d9c;stroke-width:1.8}.badge.returnBadge{fill:#fff7e8;stroke:#9b7d54}.badge.branchBadge{fill:#fff0ec;stroke:#b66a5b}.badgeText{font-size:12px;font-weight:700}.callText,.badgeText.callText{fill:#2f6f8e}.returnText,.badgeText.returnText{fill:#7f6038}.branchText,.badgeText.branchText{fill:#934d42}.alt{fill:none;stroke:#78909c;stroke-width:3;stroke-dasharray:12 7}.altDivider{stroke:#78909c;stroke-width:1.4;stroke-dasharray:7 7}.altText{font-size:12px}.note{fill:#ffffff;stroke:#ccd7da;stroke-width:2}
  ]]></style>
</defs>
<rect class="canvas" width="1500" height="920"/><rect class="frame" x="28" y="26" width="1444" height="860" rx="24"/>
<text class="title" x="60" y="76">Spring WebFlux Request Processing Flow</text>
<text class="subtitle" x="60" y="102">Actor API request through suspend handler, newSuspendedTransaction, repository work, and DTO mapping.</text>
<rect class="header head" x="54" y="165" width="152" height="54" rx="12"/><text class="participant headText" x="130" y="198" text-anchor="middle">Client</text><path class="life" d="M130 230 V800"/><rect class="header head" x="254" y="165" width="152" height="54" rx="12"/><text class="participant headText" x="330" y="198" text-anchor="middle">Suspend Handler</text><path class="life" d="M330 230 V800"/><rect class="header head" x="459" y="165" width="152" height="54" rx="12"/><text class="participant headText" x="535" y="198" text-anchor="middle">Suspended Tx</text><path class="life" d="M535 230 V800"/><rect class="header head" x="669" y="165" width="152" height="54" rx="12"/><text class="participant headText" x="745" y="198" text-anchor="middle">ActorRepository</text><path class="life" d="M745 230 V800"/><rect class="header head" x="879" y="165" width="152" height="54" rx="12"/><text class="participant headText" x="955" y="198" text-anchor="middle">ActorTable</text><path class="life" d="M955 230 V800"/><rect class="header head" x="1089" y="165" width="152" height="54" rx="12"/><text class="participant headText" x="1165" y="198" text-anchor="middle">ActorRecord</text><path class="life" d="M1165 230 V800"/>
<rect x="323" y="318" width="14" height="502" rx="6" class="activation"/><rect x="528" y="330" width="14" height="425" rx="6" class="activation"/><rect x="738" y="405" width="14" height="96" rx="6" class="activation"/><rect x="948" y="480" width="14" height="70" rx="6" class="activation"/><rect x="1158" y="545" width="14" height="117" rx="6" class="activation"/>
<rect class="alt" x="86" y="585" width="1258" height="180" rx="16"/>
<text class="altText" x="104" y="604">alt matching actor row</text>
<path class="altDivider" d="M86 675 H1344"/>
<text class="altText" x="104" y="692">else no row: transaction returns null</text>
<path class="call" d="M148 255 H312"/><rect class="label labelBox" x="96" y="221" width="246" height="28" rx="14"/><circle cx="116" cy="235" r="11" class="badge"/><text x="116" y="239" text-anchor="middle" class="badgeText callText">1</text><text class="msg callText" x="238" y="240" text-anchor="middle">GET /actors/{id}</text><path class="call" d="M348 330 H517"/><rect class="label labelBox" x="304" y="292" width="240" height="28" rx="14"/><circle cx="324" cy="306" r="11" class="badge"/><text x="324" y="310" text-anchor="middle" class="badgeText callText">2</text><text class="msg callText" x="440" y="311" text-anchor="middle">open readOnly transaction</text><path class="call" d="M553 405 H727"/><rect class="label labelBox" x="512" y="367" width="240" height="28" rx="14"/><circle cx="532" cy="381" r="11" class="badge"/><text x="532" y="385" text-anchor="middle" class="badgeText callText">3</text><text class="msg callText" x="648" y="386" text-anchor="middle">call repository inside tx</text><path class="call" d="M763 480 H937"/><rect class="label labelBox" x="722" y="442" width="240" height="28" rx="14"/><circle cx="742" cy="456" r="11" class="badge"/><text x="742" y="460" text-anchor="middle" class="badgeText callText">4</text><text class="msg callText" x="858" y="461" text-anchor="middle">select ActorTable by id</text><path class="call" d="M973 545 H1147"/><rect class="label labelBox" x="948" y="507" width="224" height="28" rx="14"/><circle cx="968" cy="521" r="11" class="badge"/><text x="968" y="525" text-anchor="middle" class="badgeText callText">5</text><text class="msg callText" x="1070" y="526" text-anchor="middle">map row to DTO</text><path class="return branchReturn" stroke="#b66a5b" marker-end="url(#arrowBranch)" d="M1147 655 H553"/><rect class="label labelBox" x="738" y="617" width="224" height="28" rx="14"/><circle cx="758" cy="631" r="11" class="badge branchBadge"/><text x="758" y="635" text-anchor="middle" class="badgeText branchText">6</text><text class="msg branchText" x="862" y="636" text-anchor="middle">ActorRecord?</text><path class="return branchReturn" stroke="#b66a5b" marker-end="url(#arrowBranch)" d="M517 735 H348"/><rect class="label labelBox" x="320" y="697" width="224" height="28" rx="14"/><circle cx="340" cy="711" r="11" class="badge branchBadge"/><text x="340" y="715" text-anchor="middle" class="badgeText branchText">7</text><text class="msg branchText" x="444" y="716" text-anchor="middle">resume handler</text><path class="return" d="M312 800 H148"/><rect class="label labelBox" x="118" y="762" width="224" height="28" rx="14"/><circle cx="138" cy="776" r="11" class="badge returnBadge"/><text x="138" y="780" text-anchor="middle" class="badgeText returnText">8</text><text class="msg returnText" x="242" y="781" text-anchor="middle">Spring serializes response</text>
<rect class="note" x="90" y="820" width="1320" height="44" rx="14"/>
<text class="footer" x="750" y="848" text-anchor="middle">Search branches choose findAll or filtered search; create/delete open write suspended transactions around repository calls.</text>
</svg>
