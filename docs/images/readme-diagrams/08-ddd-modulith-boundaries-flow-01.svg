<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
  <title id="title">DDD bounded contexts with Spring Modulith verification</title>
  <desc id="desc">Orders publishes a named interface event, shipping consumes only that event, and ApplicationModules verify checks module dependencies.</desc>
  <defs>




    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1000" height="520" fill="#f8fafc"/>
  <text x="500" y="46" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" fill="#0f172a" class="participant">DDD Bounded Contexts with Modulith Boundary Verification</text>
  <text x="500" y="74" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#475569" class="participant">Exposed tables stay inside each context; only domain events cross module boundaries.</text>

  <rect class="card" x="70" y="110" width="250" height="160" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
  <text x="195" y="145" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#1e3a8a" class="participant">Orders Context</text>
  <text x="96" y="178" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1e40af" class="participant">OrderApplicationService</text>
  <text x="96" y="204" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1e40af">ExposedOrderRepository</text>
  <text x="96" y="230" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1e40af">ddd_modulith_orders</text>

  <rect class="card" x="390" y="130" width="220" height="120" rx="8" fill="#ecfdf5" stroke="#15803d" stroke-width="2" filter="url(#shadow)"/>
  <text x="500" y="165" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#166534" class="participant">Named Interface</text>
  <text x="500" y="195" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#166534">orders :: events</text>
  <text x="500" y="219" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#166534">OrderAcceptedEvent</text>

  <rect class="card" x="680" y="110" width="250" height="160" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="2" filter="url(#shadow)"/>
  <text x="805" y="145" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#9a3412" class="participant">Shipping Context</text>
  <text x="706" y="178" font-family="Inter, Arial, sans-serif" font-size="13" fill="#9a3412" class="participant">ShippingReservationHandler</text>
  <text x="706" y="204" font-family="Inter, Arial, sans-serif" font-size="13" fill="#9a3412">ExposedShippingRepository</text>
  <text x="706" y="230" font-family="Inter, Arial, sans-serif" font-size="13" fill="#9a3412">ddd_modulith_shipping_reservations</text>

  <rect class="card" x="70" y="350" width="860" height="110" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2" filter="url(#shadow)"/>
  <text x="500" y="388" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#334155">ApplicationModules.verify()</text>
  <text x="500" y="418" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#475569">Positive test accepts orders -> events -> shipping only.</text>
  <text x="500" y="440" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#475569">Negative fixture rejects shipping -> orders.internal repository access.</text>

  <path stroke-dasharray="none" style="stroke-dasharray:none" d="M 0 0 L 10 5 L 0 10 Z" fill="none" stroke="none"/>
  <path stroke-dasharray="none" style="stroke-dasharray:none" d="M 0 0 L 10 5 L 0 10 Z" fill="none" stroke="none"/>
  <path stroke-dasharray="none" style="stroke-dasharray:none" d="M 0 0 L 10 5 L 0 10 Z" fill="none" stroke="none"/>
  <path stroke-dasharray="none" style="stroke-dasharray:none" d="M 0 0 L 10 5 L 0 10 Z" fill="none" stroke="none"/>
  <path stroke-dasharray="none" style="stroke-dasharray:none" d="M 0 0 L 10 5 L 0 10 Z" fill="none" stroke="none"/>

  <text x="355" y="178" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#2563eb" class="participant">publishes</text>
  <text x="645" y="178" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#15803d" class="participant">consumes</text>
  <text x="195" y="320" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#475569">module</text>
  <text x="500" y="320" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#475569">export</text>
  <text x="805" y="320" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#475569">module</text>
</svg>
