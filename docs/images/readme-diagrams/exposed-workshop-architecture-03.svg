<rect class="canvas" width="1500" height="1000"/><rect class="frame" x="48" y="40" width="1404" height="900" rx="34"/>
<text class="title" x="750" y="110" text-anchor="middle">Gradle Module Structure</text>
<text class="subtitle" x="750" y="150" text-anchor="middle">settings.gradle.kts scans grouped directories and registers each leaf directory as an independent runnable Gradle project.</text>
<rect class="panel" x="120" y="225" width="340" height="430" rx="30"/>
<text class="panelTitle" x="290" y="285" text-anchor="middle">settings.gradle.kts</text>
<text class="body" x="165" y="330">1. select top-level chapter dirs</text>
<text class="body" x="165" y="365">2. walk leaf directories</text>
<text class="body" x="165" y="400">3. include project path</text>
<text class="body" x="165" y="435">4. set projectDir</text>
<rect class="pill" x="165" y="500" width="250" height="42" rx="21"/><text class="body" x="290" y="527" text-anchor="middle">rootProject = exposed-workshop</text>
<rect class="pill" x="180" y="560" width="220" height="42" rx="21"/><text class="body" x="290" y="587" text-anchor="middle">leaf name = project name</text>
