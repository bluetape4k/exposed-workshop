  <text class="small" x="175" y="26" text-anchor="middle"></text>
  <text class="label" x="175" y="61" text-anchor="middle">KotlinDateTimeTable</text>
  <text class="mono" x="18" y="108">+date(name): Column~LocalDate~</text>
