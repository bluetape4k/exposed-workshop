<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#f7f8fb"/>
  <text x="640" y="58" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="34" font-weight="700" fill="#1f2937">Spring Boot Auth Session Example Architecture</text>
  <text x="640" y="94" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="18" fill="#4b5563">HTTP Basic authentication, role checks, and session metadata persisted through Exposed</text>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#374151"/>
    </marker>
  </defs>

  <rect x="70" y="165" width="210" height="110" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="175" y="208" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="700" fill="#1e3a8a">Client</text>
  <text x="175" y="238" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" fill="#1f2937">Authorization header</text>

  <rect x="360" y="150" width="230" height="140" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="475" y="195" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="700" fill="#14532d">SecurityFilterChain</text>
  <text x="475" y="226" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" fill="#1f2937">HTTP Basic</text>
  <text x="475" y="252" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" fill="#1f2937">role authorization</text>

  <rect x="670" y="150" width="230" height="140" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="785" y="194" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="700" fill="#78350f">AuthController</text>
  <text x="785" y="226" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" fill="#1f2937">profile, admin</text>
  <text x="785" y="252" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" fill="#1f2937">session endpoints</text>

  <rect x="980" y="150" width="230" height="140" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="1095" y="194" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="700" fill="#4c1d95">AuthRepository</text>
  <text x="1095" y="226" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" fill="#1f2937">UserDetailsService</text>
  <text x="1095" y="252" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" fill="#1f2937">session metadata</text>

  <rect x="360" y="430" width="230" height="120" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="475" y="477" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="700" fill="#7f1d1d">BCrypt</text>
  <text x="475" y="508" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" fill="#1f2937">password encoder</text>

  <rect x="825" y="415" width="250" height="150" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="950" y="456" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="700" fill="#075985">H2 + Exposed</text>
  <text x="950" y="489" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" fill="#1f2937">auth_users</text>
  <text x="950" y="515" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" fill="#1f2937">auth_user_roles</text>
  <text x="950" y="541" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" fill="#1f2937">auth_sessions</text>

  <line x1="280" y1="220" x2="352" y2="220" stroke="#374151" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="590" y1="220" x2="662" y2="220" stroke="#374151" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="900" y1="220" x2="972" y2="220" stroke="#374151" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="475" y1="290" x2="475" y2="422" stroke="#374151" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1095" y1="290" x2="995" y2="410" stroke="#374151" stroke-width="3" marker-end="url(#arrow)"/>
</svg>
