<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 820" width="1220" height="820" role="img" aria-label="PersonSchema ERD">
<defs>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/></filter>
<marker id="arrowGreen" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#6e8f4f" stroke="#6e8f4f" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
<marker id="arrowBlue" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#4f86c6" stroke="#4f86c6" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
<marker id="arrowPurple" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#7d61b3" stroke="#7d61b3" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
<style>
.canvas{fill:#f6f9fc}.frame{fill:#fff;stroke:#d7e2ec;stroke-width:1.5}
.title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:31px;fill:#1e293b}
.subtitle,.detail{font-family:"Comic Mono","Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;fill:#536476}
.subtitle{font-size:13px}.detail{font-size:12px}.tiny{font-family:"Comic Mono","Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:10px;fill:#64748b}
.label{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:17px;fill:#1e293b}
.panelTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:12px;letter-spacing:.08em;fill:#94a3b8}
.card{stroke-width:1.7;filter:url(#shadow)}.tableBox{fill:#fff;stroke-width:1.8;filter:url(#shadow)}
.address{stroke:#0f766e}.person{stroke:#3b82f6}.alias{stroke:#7d61b3}
.addressHead{fill:#ccfbf1}.personHead{fill:#dbeafe}.aliasHead{fill:#ede9fe}
.rowLine{stroke:#d7e2ec;stroke-width:1}
.relLine{fill:none;stroke:#6e8f4f;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowGreen)}
.arrow{fill:none;stroke:#4f86c6;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowBlue)}
.runtimeUse{fill:none;stroke:#7d61b3;stroke-width:1.9;stroke-dasharray:6 5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowPurple)}
.cardinality{font-family:"Comic Mono","Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:16px;font-weight:700;fill:#334155}
</style>
</defs>
<rect width="1220" height="820" class="canvas"/>
<rect x="20" y="20" width="1180" height="780" rx="16" class="frame"/>
<text x="48" y="58" class="title">PersonSchema ERD</text>
<text x="48" y="80" class="subtitle">PersonSchema maps many persons to one address through persons.address_id, while PersonTableDML points at the same persons table for SQL-only DML.</text>

<rect x="96" y="142" width="386" height="330" rx="12" class="tableBox address"/>
<path d="M96,188 L96,154 Q96,142 108,142 L470,142 Q482,142 482,154 L482,188 Z" class="addressHead"/>
<text x="289" y="170" class="label" text-anchor="middle">addresses</text>
<text x="120" y="220" class="detail">PK</text><text x="176" y="220" class="detail">id</text><text x="320" y="220" class="detail">BIGSERIAL</text>
<line x1="116" y1="240" x2="462" y2="240" class="rowLine"/>
<text x="120" y="270" class="detail">NN</text><text x="176" y="270" class="detail">street</text><text x="320" y="270" class="detail">VARCHAR(255)</text>
<line x1="116" y1="290" x2="462" y2="290" class="rowLine"/>
<text x="120" y="320" class="detail">NN</text><text x="176" y="320" class="detail">city</text><text x="320" y="320" class="detail">VARCHAR(255)</text>
<line x1="116" y1="340" x2="462" y2="340" class="rowLine"/>
<text x="120" y="370" class="detail">NN</text><text x="176" y="370" class="detail">state</text><text x="320" y="370" class="detail">VARCHAR(2)</text>
<line x1="116" y1="390" x2="462" y2="390" class="rowLine"/>
<text x="120" y="420" class="detail">NULL</text><text x="176" y="420" class="detail">zip</text><text x="320" y="420" class="detail">VARCHAR(10)</text>

<rect x="728" y="142" width="396" height="410" rx="12" class="tableBox person"/>
<path d="M728,188 L728,154 Q728,142 740,142 L1112,142 Q1124,142 1124,154 L1124,188 Z" class="personHead"/>
<text x="926" y="170" class="label" text-anchor="middle">persons</text>
<text x="752" y="220" class="detail">PK</text><text x="810" y="220" class="detail">id</text><text x="974" y="220" class="detail">BIGSERIAL</text>
<line x1="748" y1="240" x2="1104" y2="240" class="rowLine"/>
<text x="752" y="270" class="detail">NN</text><text x="810" y="270" class="detail">first_name</text><text x="974" y="270" class="detail">VARCHAR(50)</text>
<line x1="748" y1="290" x2="1104" y2="290" class="rowLine"/>
<text x="752" y="320" class="detail">NN</text><text x="810" y="320" class="detail">last_name</text><text x="974" y="320" class="detail">VARCHAR(50)</text>
<line x1="748" y1="340" x2="1104" y2="340" class="rowLine"/>
<text x="752" y="370" class="detail">NN</text><text x="810" y="370" class="detail">birth_date</text><text x="974" y="370" class="detail">DATE</text>
<line x1="748" y1="390" x2="1104" y2="390" class="rowLine"/>
<text x="752" y="420" class="detail">DEF</text><text x="810" y="420" class="detail">employed</text><text x="974" y="420" class="detail">BOOLEAN true</text>
<line x1="748" y1="440" x2="1104" y2="440" class="rowLine"/>
<text x="752" y="470" class="detail">NULL</text><text x="810" y="470" class="detail">occupation</text><text x="974" y="470" class="detail">VARCHAR(255)</text>
<line x1="748" y1="490" x2="1104" y2="490" class="rowLine"/>
<text x="752" y="520" class="detail">FK</text><text x="810" y="520" class="detail">address_id</text><text x="974" y="520" class="detail">BIGINT NOT NULL</text>

<path data-connector="persons-address-id-to-addresses-id" d="M704,520 L640,520 Q628,520 628,508 L628,310 Q628,298 616,298 L494,298" class="relLine"/>
<text x="510" y="282" class="cardinality">1</text>
<text x="678" y="504" class="cardinality">N</text>
<text x="552" y="286" class="tiny">persons.address_id -> addresses.id</text>

<rect x="728" y="610" width="396" height="94" rx="10" class="tableBox alias"/>
<path d="M728,648 L728,622 Q728,610 740,610 L1112,610 Q1124,610 1124,622 L1124,648 Z" class="aliasHead"/>
<text x="926" y="635" class="label" text-anchor="middle">PersonTableDML : Table("persons")</text>
<text x="926" y="670" class="detail" text-anchor="middle">SQL-only table definition shares</text>
<text x="926" y="690" class="detail" text-anchor="middle">the same physical persons table.</text>

<rect x="96" y="610" width="386" height="94" rx="10" fill="#f8fafc" stroke="#cbd5e1" class="card"/>
<text x="289" y="640" class="label" text-anchor="middle">DAO mapping</text>
<text x="289" y="668" class="detail" text-anchor="middle">Person.address is referencedOn PersonTable.addressId.</text>
<path data-connector="dao-person-address-reference" d="M482,657 L598,657 Q610,657 610,645 L610,533 Q610,520 622,520 L704,520" class="arrow"/>
<path data-connector="person-table-dml-shares-persons" d="M926,610 L926,552" class="runtimeUse"/>

<rect x="126" y="744" width="968" height="38" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.3"/>
<path d="M168,764 L228,764" class="relLine"/><text x="248" y="768" class="tiny">green = FK relation (1:N)</text>
<path d="M472,764 L532,764" class="arrow"/><text x="552" y="768" class="tiny">blue = DAO referencedOn</text>
<path d="M778,764 L838,764" class="runtimeUse"/><text x="858" y="768" class="tiny">dashed purple = DML alias</text>
</svg>
