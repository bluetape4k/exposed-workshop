<svg xmlns="http://www.w3.org/2000/svg" width="1580" height="880" viewBox="0 0 1580 880" role="img" aria-labelledby="title desc">
  <title id="title">Ktor application package layout</title>
  <desc id="desc">The package layout separates Ktor configuration, customer routes, service use cases, repository contracts, Exposed persistence, and shared customer models under exposed.examples.ktor.architecture.</desc>
  <defs>
    <style>
      text { letter-spacing: 0; }
      .title { font-family: "Architects Daughter"; font-size: 40px; fill: #23323a; }
      .subtitle, .pkgText, .label, .footer { font-family: "Comic Mono"; fill: #324750; }
      .subtitle { font-size: 17px; }
      .pkgTitle { font-family: "Architects Daughter"; font-size: 23px; fill: #20323b; }
      .pkgText { font-size: 14px; }
      .label { font-size: 13px; font-weight: 700; }
      .footer { font-size: 14px; fill: #60717a; }
      .canvas { fill: #fbfcf8; stroke: #3f515a; stroke-width: 3; }
      .band { fill: #f4f6f5; stroke: #8a9aa0; stroke-width: 2.1; }
      .card { fill: #ffffff; stroke-width: 2.2; }
      .runtimeCard { stroke: #5d948b; }
      .httpCard { stroke: #ac7a34; }
      .domainCard { stroke: #7b6bb4; }
      .persistenceCard { stroke: #69777e; }
      .modelCard { stroke: #5d7fab; }
      .flowRuntime { fill: none; stroke: #3f8e84; stroke-width: 4.2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowRuntime); }
      .flowHttp { fill: none; stroke: #a2743d; stroke-width: 4.2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowHttp); }
      .flowDomain { fill: none; stroke: #7667b1; stroke-width: 4.2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowDomain); }
      .flowPersistence { fill: none; stroke: #69777e; stroke-width: 4.2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowPersistence); }
    </style>
    <marker id="arrowRuntime" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#3f8e84" stroke="#3f8e84" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="arrowHttp" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#a2743d" stroke="#a2743d" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="arrowDomain" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#7667b1" stroke="#7667b1" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="arrowPersistence" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#69777e" stroke="#69777e" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
  </defs>

  <rect x="24" y="24" width="1532" height="832" rx="20" class="canvas"/>
  <text x="790" y="78" text-anchor="middle" class="title">Ktor Package Layout</text>
  <text x="790" y="110" text-anchor="middle" class="subtitle">exposed.examples.ktor.architecture keeps framework adapters, use cases, and Exposed persistence explicit.</text>

  <rect id="root" x="110" y="160" width="1360" height="92" rx="16" class="band"/>
  <text x="790" y="196" text-anchor="middle" class="pkgTitle">architecture root package</text>
  <text x="790" y="224" text-anchor="middle" class="pkgText">KtorArchitectureApplication.kt composes plugins, persistence, repository, service, and routes.</text>

  <rect id="config" x="110" y="330" width="240" height="130" rx="14" class="card runtimeCard"/>
  <text x="230" y="368" text-anchor="middle" class="pkgTitle">config</text>
  <text x="138" y="398" class="pkgText">KtorJson.kt</text>
  <text x="138" y="420" class="pkgText">KtorPlugins.kt</text>
  <text x="138" y="442" class="pkgText">CallId, logging, errors</text>

  <rect id="routes" x="400" y="330" width="240" height="130" rx="14" class="card httpCard"/>
  <text x="520" y="368" text-anchor="middle" class="pkgTitle">routes</text>
  <text x="428" y="398" class="pkgText">CustomerRoutes.kt</text>
  <text x="428" y="420" class="pkgText">limited body read</text>
  <text x="428" y="442" class="pkgText">GET/POST customer API</text>

  <rect id="service" x="690" y="330" width="240" height="130" rx="14" class="card domainCard"/>
  <text x="810" y="368" text-anchor="middle" class="pkgTitle">service</text>
  <text x="718" y="398" class="pkgText">CustomerService.kt</text>
  <text x="718" y="420" class="pkgText">normalization</text>
  <text x="718" y="442" class="pkgText">use case exceptions</text>

  <rect id="repository" x="980" y="330" width="240" height="130" rx="14" class="card persistenceCard"/>
  <text x="1100" y="368" text-anchor="middle" class="pkgTitle">repository</text>
  <text x="1008" y="398" class="pkgText">CustomerRepository.kt</text>
  <text x="1008" y="420" class="pkgText">Exposed implementation</text>
  <text x="1008" y="442" class="pkgText">schema mutex + IO</text>

  <rect id="persistence" x="1270" y="330" width="200" height="130" rx="14" class="card persistenceCard"/>
  <text x="1370" y="368" text-anchor="middle" class="pkgTitle">persistence</text>
  <text x="1298" y="398" class="pkgText">CustomerPersistence</text>
  <text x="1298" y="420" class="pkgText">HikariDataSource</text>
  <text x="1298" y="442" class="pkgText">Database.connect</text>

  <rect id="model" x="250" y="570" width="1080" height="116" rx="16" class="card modelCard"/>
  <text x="790" y="608" text-anchor="middle" class="pkgTitle">model</text>
  <text x="790" y="638" text-anchor="middle" class="pkgText">CustomerModels.kt owns request/response DTOs, commands, records, error payloads, and validation exceptions.</text>
  <text x="790" y="662" text-anchor="middle" class="pkgText">Adapters can import model types, but persistence details stay inside repository and persistence packages.</text>

  <path id="flow-root-config" data-connector="flow-root-config" d="M 230 252 V 330" class="flowRuntime"/>
  <path id="flow-root-routes" data-connector="flow-root-routes" d="M 520 252 V 330" class="flowRuntime"/>
  <path id="flow-routes-service" data-connector="flow-routes-service" d="M 640 395 H 690" class="flowHttp"/>
  <path id="flow-service-repository" data-connector="flow-service-repository" d="M 930 395 H 980" class="flowDomain"/>
  <path id="flow-repository-persistence" data-connector="flow-repository-persistence" d="M 1220 395 H 1270" class="flowPersistence"/>

  <text x="250" y="296" text-anchor="middle" class="label">install</text>
  <text x="540" y="296" text-anchor="middle" class="label">register</text>
  <text x="665" y="380" text-anchor="middle" class="label">delegate</text>
  <text x="955" y="380" text-anchor="middle" class="label">port</text>
  <text x="1245" y="380" text-anchor="middle" class="label">database</text>

  <text x="790" y="805" text-anchor="middle" class="footer">The layout keeps Ktor-specific code at the edge and leaves Exposed transaction ownership in repository/persistence packages.</text>
</svg>
