<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" width="1400" height="760" role="img" aria-label="Measured product Exposed ERD">
  <defs>
    <marker id="arrowGreen" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" viewBox="0 0 10 10" refX="9" refY="5" orient="auto" data-role="secondary" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#16a34a" stroke="#16a34a" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <style>
      .canvas{fill:#f6f9fc}.frame{fill:#fff;stroke:#d7e2ec;stroke-width:1.5}.title{font-family:"Architects Daughter";font-size:31px;fill:#1e293b}.subtitle,.detail{font-family:"Comic Mono";fill:#536476}.subtitle{font-size:14px}.detail{font-size:13px}.label{font-family:"Architects Daughter";font-size:19px;fill:#1e293b}.small{font-family:"Comic Mono";font-size:12px;fill:#64748b}.panel{fill:#f8fafc;stroke:#d7e2ec;stroke-width:1.2}.card{stroke-width:1.8;filter:url(#shadow)}.relation{fill:none;stroke:#16a34a;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowGreen)}
    </style>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="1400" height="760" class="canvas"/>
  <rect x="20" y="20" width="1360" height="720" rx="16" class="frame"/>
  <text x="50" y="62" class="title">Measured Product ERD</text>
  <text x="50" y="88" class="subtitle">ProductEntity maps to measured_products; physical measured values are DOUBLE columns in stable base units.</text>
  <rect x="55" y="135" width="1290" height="430" rx="14" class="panel"/>
  <text x="700" y="124" class="small" text-anchor="middle">ENTITY → TABLE → PHYSICAL STORAGE</text>

  <rect x="90" y="190" width="310" height="230" rx="12" fill="#dbeafe" stroke="#2563eb" class="card"/>
  <rect x="90" y="190" width="310" height="48" rx="12" fill="#bfdbfe"/>
  <text x="245" y="221" class="label" text-anchor="middle">ProductEntity</text>
  <text x="112" y="270" class="small">id: EntityID&lt;Int&gt;</text>
  <text x="112" y="298" class="small">name: String</text>
  <text x="112" y="326" class="small">length: Measure&lt;Length&gt;</text>
  <text x="112" y="354" class="small">mass: Measure&lt;Mass&gt;</text>
  <text x="112" y="382" class="small">temperature: Temperature</text>

  <rect x="560" y="160" width="470" height="290" rx="12" fill="#dcfce7" stroke="#16a34a" class="card"/>
  <path d="M560,208 L560,172 Q560,160 572,160 L1018,160 Q1030,160 1030,172 L1030,208 Z" fill="#bbf7d0"/>
  <text x="795" y="193" class="label" text-anchor="middle">measured_products</text>
  <text x="584" y="246" class="small">id INT PRIMARY KEY</text>
  <text x="584" y="278" class="small">name VARCHAR(100) NOT NULL</text>
  <text x="584" y="310" class="small">length DOUBLE NOT NULL · base: m</text>
  <text x="584" y="342" class="small">mass DOUBLE NOT NULL · base: kg</text>
  <text x="584" y="374" class="small">nullable_mass DOUBLE NULL · base: kg</text>
  <text x="584" y="406" class="small">temperature DOUBLE NOT NULL · base: K</text>

  <rect x="1170" y="220" width="140" height="170" rx="12" fill="#fce7f3" stroke="#db2777" class="card"/>
  <text x="1240" y="257" class="label" text-anchor="middle">JDBC</text>
  <text x="1240" y="300" class="small" text-anchor="middle">DOUBLE</text>
  <text x="1240" y="325" class="small" text-anchor="middle">H2 / PG</text>
  <text x="1240" y="350" class="small" text-anchor="middle">MySQL</text>

  <path data-connector="entity-to-table" data-source="entity" data-target="table" d="M400,305 L560,305" class="relation"/>
  <text x="480" y="292" class="small" text-anchor="middle">1 : 1</text>
  <path data-connector="table-to-jdbc" data-source="table" data-target="jdbc" d="M1030,335 L1170,335" class="relation"/>

  <rect x="180" y="615" width="1040" height="70" rx="12" fill="#ecfdf5" stroke="#86efac" stroke-width="1.3"/>
  <text x="700" y="645" class="detail" text-anchor="middle">Measured columns are not a separate table: the provider expands each value into one DOUBLE column.</text>
  <text x="700" y="667" class="small" text-anchor="middle">Changing a base unit is a schema/migration decision and is intentionally documented as a follow-up concern.</text>
</svg>
