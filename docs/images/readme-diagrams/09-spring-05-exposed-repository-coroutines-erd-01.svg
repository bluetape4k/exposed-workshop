  <rect width="980" height="560" class="canvas"/>
  <rect x="20" y="20" width="940" height="520" rx="16" class="frame"/>
<text x="48" y="58" class="title">09 Spring: Exposed Repository Coroutines (05)</text>
  <text x="48" y="80" class="subtitle">Source-derived ERD - Exposed table objects and column builders</text>
