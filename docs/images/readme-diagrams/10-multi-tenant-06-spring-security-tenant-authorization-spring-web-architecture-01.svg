<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1720 1040" width="1720" height="1040" role="img" aria-label="Spring Security tenant authorization architecture">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowSecurity" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto" data-role="primary" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#3f8e84" stroke="#3f8e84" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="arrowData" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto" data-role="primary" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#a2743d" stroke="#a2743d" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="arrowDb" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto" data-role="primary" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#7667b1" stroke="#7667b1" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="arrowReject" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto" data-role="primary" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#69777e" stroke="#69777e" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <symbol id="databaseServerIcon" viewBox="0 0 128 128">
      <rect x="10" y="8" width="108" height="112" rx="18" fill="#fffaf2" stroke="#28485a" stroke-width="6"/>
      <ellipse cx="64" cy="36" rx="34" ry="13" fill="#fff0d8" stroke="#8c6f33" stroke-width="6"/>
      <path d="M30 36v44c0 8 15 14 34 14s34-6 34-14V36" fill="#fff0d8" stroke="#8c6f33" stroke-width="6" stroke-linejoin="round"/>
      <ellipse cx="64" cy="36" rx="34" ry="13" fill="none" stroke="#8c6f33" stroke-width="5"/>
      <path d="M30 58c0 8 15 14 34 14s34-6 34-14" fill="none" stroke="#8c6f33" stroke-width="5" stroke-linecap="round"/>
      <path d="M30 80c0 8 15 14 34 14s34-6 34-14" fill="none" stroke="#8c6f33" stroke-width="5" stroke-linecap="round"/>
    </symbol>
    <style>
      text { letter-spacing: 0; }
      .canvas { fill: #fbfcf8; stroke: #3f515a; stroke-width: 3; }
      .title { font-family: "Architects Daughter"; font-size: 38px; fill: #23323a; }
      .subtitle,.laneNote,.cardText,.label,.legendText,.footer { font-family: "Comic Mono"; fill: #324750; }
      .subtitle { font-size: 16px; }
      .laneTitle { font-family: "Architects Daughter"; font-size: 24px; fill: #23323a; }
      .laneNote { font-size: 13px; fill: #5b6d75; }
      .cardTitle { font-family: "Architects Daughter"; font-size: 21px; fill: #20323b; }
      .cardText { font-size: 13px; }
      .label { font-size: 12px; font-weight: 700; }
      .legendText { font-size: 12px; fill: #52666f; }
      .footer { font-size: 13px; fill: #60717a; }
      .laneSecurity { fill: #eef7f5; stroke: #6fa098; stroke-width: 2.2; }
      .laneAuthz { fill: #fff7e8; stroke: #b98e50; stroke-width: 2.2; }
      .laneApp { fill: #f5f3fb; stroke: #8f82bd; stroke-width: 2.2; }
      .laneDb { fill: #f4f7f8; stroke: #7f9299; stroke-width: 2.2; }
      .card { fill: #fff; stroke-width: 2.3; filter: url(#shadow); }
      .securityCard { stroke: #5d948b; }
      .authzCard { stroke: #ac7a34; }
      .appCard { stroke: #7b6bb4; }
      .dbCard { stroke: #69777e; }
      .rejectCard { fill: #fffdf6; stroke: #69777e; }
      .flowSecurity { fill: none; stroke: #3f8e84; stroke-width: 4.0; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowSecurity); }
      .flowData { fill: none; stroke: #a2743d; stroke-width: 4.0; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowData); }
      .flowDb { fill: none; stroke: #7667b1; stroke-width: 4.0; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowDb); }
      .flowReject { fill: none; stroke: #69777e; stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowReject); }
      .legendLine { fill: none; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect x="24" y="24" width="1672" height="992" rx="20" class="canvas"/>
  <text x="860" y="76" text-anchor="middle" class="title">Spring Security Tenant Authorization</text>
  <text x="860" y="108" text-anchor="middle" class="subtitle">A caller credential must resolve to the same tenant as X-Tenant-ID before Exposed opens a tenant database.</text>

  <rect x="70" y="150" width="350" height="760" rx="18" class="laneSecurity"/>
  <text x="106" y="192" class="laneTitle">Credential gate</text>
  <text x="106" y="218" class="laneNote">Exactly one supported credential</text>
  <text x="106" y="238" class="laneNote">source is accepted.</text>

  <rect x="460" y="150" width="350" height="760" rx="18" class="laneAuthz"/>
  <text x="496" y="192" class="laneTitle">Tenant authorization</text>
  <text x="496" y="218" class="laneNote">Authenticated tenant must match</text>
  <text x="496" y="238" class="laneNote">the request selector.</text>

  <rect x="850" y="150" width="350" height="760" rx="18" class="laneApp"/>
  <text x="886" y="192" class="laneTitle">Application boundary</text>
  <text x="886" y="218" class="laneNote">Service and repository never</text>
  <text x="886" y="238" class="laneNote">choose a fallback tenant.</text>

  <rect x="1240" y="150" width="410" height="760" rx="18" class="laneDb"/>
  <text x="1276" y="192" class="laneTitle">Tenant data boundary</text>
  <text x="1276" y="218" class="laneNote">Each tenant owns a Hikari pool</text>
  <text x="1276" y="238" class="laneNote">and Exposed Database.</text>

  <rect id="credentialConflict" x="105" y="250" width="280" height="92" rx="12" class="card securityCard"/>
  <text x="245" y="282" text-anchor="middle" class="cardTitle">CredentialConflictFilter</text>
  <text x="133" y="310" class="cardText">rejects mixed bearer, API key,</text>
  <text x="133" y="330" class="cardText">or X-Demo-Session sources</text>

  <rect id="demoCredentialFilters" x="105" y="400" width="280" height="114" rx="12" class="card securityCard"/>
  <text x="245" y="432" text-anchor="middle" class="cardTitle">Demo auth filters</text>
  <text x="133" y="460" class="cardText">JWT, API key, demo session</text>
  <text x="133" y="480" class="cardText">write Spring Security auth</text>
  <text x="133" y="500" class="cardText">invalid credential returns 401</text>

  <rect id="authenticatedTenant" x="105" y="580" width="280" height="96" rx="12" class="card securityCard"/>
  <text x="245" y="612" text-anchor="middle" class="cardTitle">AuthenticatedTenant</text>
  <text x="133" y="640" class="cardText">tenant identity in principal</text>
  <text x="133" y="660" class="cardText">source = JWT / key / session</text>

  <rect id="tenantHeader" x="495" y="250" width="280" height="92" rx="12" class="card authzCard"/>
  <text x="635" y="282" text-anchor="middle" class="cardTitle">TenantRequest</text>
  <text x="523" y="310" class="cardText">one X-Tenant-ID header only</text>
  <text x="523" y="330" class="cardText">400 missing, 404 unknown</text>

  <rect id="tenantAuthorization" x="495" y="455" width="280" height="126" rx="12" class="card authzCard"/>
  <text x="635" y="487" text-anchor="middle" class="cardTitle">TenantAuthorizationFilter</text>
  <text x="523" y="515" class="cardText">resolves authenticated tenant</text>
  <text x="523" y="535" class="cardText">compares it with X-Tenant-ID</text>
  <text x="523" y="555" class="cardText">mismatch returns 403</text>

  <rect id="tenantContext" x="495" y="665" width="280" height="100" rx="12" class="card authzCard"/>
  <text x="635" y="697" text-anchor="middle" class="cardTitle">TenantContext</text>
  <text x="523" y="725" class="cardText">ThreadLocal TenantId</text>
  <text x="523" y="745" class="cardText">cleared in finally block</text>

  <rect id="controllerService" x="885" y="302" width="280" height="102" rx="12" class="card appCard"/>
  <text x="1025" y="334" text-anchor="middle" class="cardTitle">Inventory API + Service</text>
  <text x="913" y="362" class="cardText">reads /inventory endpoints</text>
  <text x="913" y="382" class="cardText">delegates use cases only</text>

  <rect id="inventoryRepository" x="885" y="475" width="280" height="104" rx="12" class="card appCard"/>
  <text x="1025" y="507" text-anchor="middle" class="cardTitle">Exposed repository</text>
  <text x="913" y="535" class="cardText">findAll, findBySku, create</text>
  <text x="913" y="555" class="cardText">wraps every query in helper</text>

  <rect id="tenantTransaction" x="885" y="650" width="280" height="118" rx="12" class="card appCard"/>
  <text x="1025" y="682" text-anchor="middle" class="cardTitle">TenantTransaction</text>
  <text x="913" y="710" class="cardText">TenantContext.current()</text>
  <text x="913" y="730" class="cardText">transaction(databaseFor(tenant))</text>
  <text x="913" y="750" class="cardText">no default datasource path</text>

  <rect id="tenantRegistry" x="1290" y="650" width="330" height="118" rx="12" class="card dbCard"/>
  <text x="1455" y="682" text-anchor="middle" class="cardTitle">TenantDatabaseRegistry</text>
  <text x="1318" y="710" class="cardText">validates every configured tenant</text>
  <text x="1318" y="730" class="cardText">owns HikariDataSource + Database</text>
  <text x="1318" y="750" class="cardText">closes all pools on shutdown</text>

  <rect id="acmeDatabase" x="1270" y="465" width="170" height="126" rx="12" class="card dbCard"/>
  <use data-bluetape4k-icon="generic/database-server.svg" href="#databaseServerIcon" x="1325" y="482" width="44" height="44"/>
  <text x="1355" y="546" text-anchor="middle" class="cardTitle">ACME DB</text>
  <text x="1355" y="570" text-anchor="middle" class="cardText">tenant-acme pool</text>

  <rect id="globexDatabase" x="1460" y="465" width="170" height="126" rx="12" class="card dbCard"/>
  <use data-bluetape4k-icon="generic/database-server.svg" href="#databaseServerIcon" x="1515" y="482" width="44" height="44"/>
  <text x="1545" y="546" text-anchor="middle" class="cardTitle">GLOBEX DB</text>
  <text x="1545" y="570" text-anchor="middle" class="cardText">tenant-globex pool</text>

  <rect id="startupBootstrap" x="1290" y="300" width="330" height="94" rx="12" class="card dbCard"/>
  <text x="1455" y="332" text-anchor="middle" class="cardTitle">InventorySeeder</text>
  <text x="1318" y="360" class="cardText">creates inventory_items per tenant</text>
  <text x="1318" y="380" class="cardText">seeds ACME and GLOBEX rows</text>

  <rect id="rejectContract" x="105" y="750" width="280" height="96" rx="12" class="card rejectCard"/>
  <text x="245" y="782" text-anchor="middle" class="cardTitle">Rejected before routing</text>
  <text x="133" y="810" class="cardText">conflict 400, missing auth 401</text>
  <text x="133" y="830" class="cardText">mismatch or bad claim 403</text>

  <path id="flow-conflict-auth" data-connector="flow-conflict-auth" d="M 245 342 L 245 400" class="flowSecurity"/>
  <path id="flow-auth-tenant" data-connector="flow-auth-tenant" d="M 245 514 L 245 580" class="flowSecurity"/>
  <path id="flow-authenticated-to-filter" data-connector="flow-authenticated-to-filter" d="M 385 628 L 430 628 Q 450 628 450 608 L 450 538 Q 450 518 470 518 L 495 518" class="flowSecurity"/>
  <path id="flow-header-to-filter" data-connector="flow-header-to-filter" d="M 635 342 L 635 455" class="flowData"/>
  <path id="flow-filter-to-context" data-connector="flow-filter-to-context" d="M 635 581 L 635 665" class="flowData"/>
  <path id="flow-filter-to-api" data-connector="flow-filter-to-api" d="M 775 518 L 815 518 Q 835 518 835 498 L 835 373 Q 835 353 855 353 L 885 353" class="flowData"/>
  <path id="flow-context-to-transaction" data-connector="flow-context-to-transaction" d="M 775 715 L 885 715" class="flowData"/>
  <path id="flow-api-to-repo" data-connector="flow-api-to-repo" d="M 1025 404 L 1025 475" class="flowDb"/>
  <path id="flow-repo-to-transaction" data-connector="flow-repo-to-transaction" d="M 1025 579 L 1025 650" class="flowDb"/>
  <path id="flow-transaction-to-registry" data-connector="flow-transaction-to-registry" d="M 1165 709 L 1290 709" class="flowDb"/>
  <path id="flow-registry-to-acme" data-connector="flow-registry-to-acme" d="M 1355 650 L 1355 591" class="flowDb"/>
  <path id="flow-registry-to-globex" data-connector="flow-registry-to-globex" d="M 1545 650 L 1545 591" class="flowDb"/>
  <path id="flow-seeder-to-acme" data-connector="flow-seeder-to-acme" d="M 1355 394 L 1355 465" class="flowData"/>
  <path id="flow-seeder-to-globex" data-connector="flow-seeder-to-globex" d="M 1545 394 L 1545 465" class="flowData"/>
  <path id="flow-conflict-reject" data-connector="flow-conflict-reject" d="M 105 296 L 90 296 Q 82 296 82 316 L 82 798 Q 82 818 102 818 L 105 818" class="flowReject"/>

  <text x="438" y="602" text-anchor="middle" class="label">tenant identity</text>
  <text x="656" y="415" text-anchor="middle" class="label">selector</text>
  <text x="818" y="546" text-anchor="middle" class="label">authorized request</text>
  <text x="836" y="692" text-anchor="middle" class="label">read context</text>
  <text x="1224" y="692" text-anchor="middle" class="label">databaseFor</text>
  <text x="1322" y="626" text-anchor="middle" class="label">acme</text>
  <text x="1588" y="626" text-anchor="middle" class="label">globex</text>
  <text x="92" y="730" text-anchor="middle" class="label">reject</text>

  <rect x="500" y="852" width="720" height="36" rx="18" fill="#ffffff" stroke="#d7e2de" stroke-width="1.4"/>
  <path d="M 528 870 L 586 870" class="legendLine" stroke="#3f8e84"/>
  <text x="596" y="874" class="legendText">credential identity</text>
  <path d="M 752 870 L 810 870" class="legendLine" stroke="#a2743d"/>
  <text x="820" y="874" class="legendText">authorization / context</text>
  <path d="M 1012 870 L 1070 870" class="legendLine" stroke="#7667b1"/>
  <text x="1080" y="874" class="legendText">tenant database selection</text>

  <text x="860" y="954" text-anchor="middle" class="footer">Tenant routing starts only after Spring Security identity and X-Tenant-ID agree; repositories always enter Exposed through TenantTransaction.</text>
</svg>
