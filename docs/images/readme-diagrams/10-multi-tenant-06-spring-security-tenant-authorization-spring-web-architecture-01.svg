<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Spring Security Tenant Authorization Architecture</title>
  <desc id="desc">Architecture diagram for authenticated tenant authorization before Exposed database routing.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2f4050"/>
    </marker>
    <style>
      .bg { fill: #f7fafc; }
      .band { fill: #e8f3ff; stroke: #7aa8d8; stroke-width: 2; }
      .security { fill: #fff6dc; stroke: #c89b2c; stroke-width: 2; }
      .app { fill: #eaf7ec; stroke: #5ea772; stroke-width: 2; }
      .db { fill: #f1ecff; stroke: #8d77c8; stroke-width: 2; }
      .box { rx: 8; ry: 8; }
      .title { font: 700 30px Arial, sans-serif; fill: #17212b; }
      .label { font: 700 18px Arial, sans-serif; fill: #17212b; }
      .small { font: 15px Arial, sans-serif; fill: #263645; }
      .tiny { font: 13px Arial, sans-serif; fill: #405060; }
      .arrow { stroke: #2f4050; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .muted { stroke: #728195; stroke-width: 2; stroke-dasharray: 6 5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="bg" width="1280" height="760"/>
  <text x="52" y="58" class="title">Spring Security Tenant Authorization</text>
  <text x="52" y="86" class="small">Authenticate first, authorize tenant identity, then route Exposed JDBC work to the tenant database.</text>

  <rect x="50" y="126" width="250" height="500" class="band box"/>
  <text x="78" y="164" class="label">HTTP Request</text>
  <rect x="82" y="198" width="186" height="92" class="box" fill="#ffffff" stroke="#7aa8d8" stroke-width="2"/>
  <text x="105" y="232" class="small">Authorization</text>
  <text x="105" y="256" class="tiny">Bearer demo-acme-token</text>
  <rect x="82" y="318" width="186" height="92" class="box" fill="#ffffff" stroke="#7aa8d8" stroke-width="2"/>
  <text x="105" y="352" class="small">X-API-Key</text>
  <text x="105" y="376" class="tiny">demo-acme-key</text>
  <rect x="82" y="438" width="186" height="92" class="box" fill="#ffffff" stroke="#7aa8d8" stroke-width="2"/>
  <text x="105" y="472" class="small">X-Tenant-ID</text>
  <text x="105" y="496" class="tiny">acme</text>

  <rect x="360" y="126" width="360" height="500" class="security box"/>
  <text x="390" y="164" class="label">Spring Security Chain</text>
  <rect x="392" y="198" width="296" height="66" class="box" fill="#ffffff" stroke="#c89b2c" stroke-width="2"/>
  <text x="416" y="238" class="small">CredentialConflictFilter</text>
  <rect x="392" y="286" width="296" height="66" class="box" fill="#ffffff" stroke="#c89b2c" stroke-width="2"/>
  <text x="416" y="326" class="small">JWT / API-Key / Demo Session</text>
  <rect x="392" y="374" width="296" height="66" class="box" fill="#ffffff" stroke="#c89b2c" stroke-width="2"/>
  <text x="416" y="414" class="small">AuthorizationFilter</text>
  <rect x="392" y="462" width="296" height="82" class="box" fill="#ffffff" stroke="#c89b2c" stroke-width="2"/>
  <text x="416" y="496" class="small">TenantAuthorizationFilter</text>
  <text x="416" y="520" class="tiny">sets TenantContext only after match</text>

  <rect x="780" y="126" width="225" height="500" class="app box"/>
  <text x="810" y="164" class="label">MVC + Exposed</text>
  <rect x="812" y="210" width="160" height="72" class="box" fill="#ffffff" stroke="#5ea772" stroke-width="2"/>
  <text x="838" y="252" class="small">Controller</text>
  <rect x="812" y="326" width="160" height="72" class="box" fill="#ffffff" stroke="#5ea772" stroke-width="2"/>
  <text x="858" y="368" class="small">Service</text>
  <rect x="812" y="442" width="160" height="72" class="box" fill="#ffffff" stroke="#5ea772" stroke-width="2"/>
  <text x="836" y="484" class="small">Repository</text>

  <rect x="1060" y="126" width="170" height="500" class="db box"/>
  <text x="1088" y="164" class="label">Tenant DBs</text>
  <rect x="1088" y="232" width="116" height="104" class="box" fill="#ffffff" stroke="#8d77c8" stroke-width="2"/>
  <text x="1110" y="272" class="small">ACME</text>
  <text x="1104" y="296" class="tiny">Hikari pool</text>
  <rect x="1088" y="410" width="116" height="104" class="box" fill="#ffffff" stroke="#8d77c8" stroke-width="2"/>
  <text x="1102" y="450" class="small">GLOBEX</text>
  <text x="1104" y="474" class="tiny">Hikari pool</text>

  <path class="arrow" d="M300 376 H360"/>
  <path class="arrow" d="M720 376 H780"/>
  <path class="arrow" d="M1005 370 H1060"/>
  <path class="muted" d="M540 544 C650 670 880 670 892 514"/>
  <text x="618" y="682" class="tiny">authorized TenantContext</text>
  <text x="420" y="586" class="tiny">400 conflict / 401 unauthenticated / 403 mismatch</text>
</svg>
