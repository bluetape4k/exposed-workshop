<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">Explicit Ktor Exposed integration boundary</title>
  <desc id="desc">Architecture boundary for the Ktor Exposed integration workshop: Ktor HTTP routes call bluetape4k-exposed-ktor helpers, helper routes own Exposed readiness and error mapping, and caller-owned H2 JDBC and R2DBC resources remain explicit.</desc>
  <defs>
    <style>
      text { letter-spacing: 0; }
      .title { font-family: "Architects Daughter"; font-size: 40px; font-weight: 400; fill: #263238; }
      .subtitle, .cardText, .label, .footer, .note { font-family: "Comic Mono"; fill: #34454d; }
      .subtitle { font-size: 18px; }
      .laneTitle { font-family: "Architects Daughter"; font-size: 25px; font-weight: 400; fill: #263238; }
      .laneNote { font-family: "Comic Mono"; font-size: 14px; fill: #596b73; }
      .cardTitle { font-family: "Architects Daughter"; font-size: 22px; font-weight: 400; fill: #203238; }
      .cardText { font-size: 14px; }
      .note { font-size: 13px; }
      .footer { font-size: 14px; fill: #60727d; }
      .canvas { fill: #fbfcf8; stroke: #41545d; stroke-width: 3; }
      .laneHttp { fill: #eef7f5; stroke: #6f9f96; stroke-width: 2.2; }
      .laneHelper { fill: #fff7e7; stroke: #b99356; stroke-width: 2.2; }
      .laneResource { fill: #f2f0fa; stroke: #8c7cc4; stroke-width: 2.2; }
      .card { stroke-width: 2.2; }
      .httpCard { fill: #ffffff; stroke: #5d948b; }
      .helperCard { fill: #ffffff; stroke: #b4833d; }
      .resourceCard { fill: #ffffff; stroke: #7d6bb8; }
      .errorCard { fill: #fffdf6; stroke: #69777e; stroke-width: 2.2; }
      .flowHttp { fill: none; stroke: #3f8e84; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowHttp); }
      .flowHelper { fill: none; stroke: #a2743d; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowHelper); }
      .flowResource { fill: none; stroke: #7667b1; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowResource); }
      .flowError { fill: none; stroke: #69777e; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowError); }
      .label { font-size: 13px; font-weight: 700; }
      .iconStroke { fill: none; stroke: #7d6bb8; stroke-width: 2.4; }
    </style>
    <marker id="arrowHttp" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#3f8e84" stroke="#3f8e84" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="arrowHelper" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#a2743d" stroke="#a2743d" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="arrowResource" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#7667b1" stroke="#7667b1" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="arrowError" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#69777e" stroke="#69777e" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
  </defs>

  <rect x="24" y="24" width="1552" height="1072" rx="20" class="canvas"/>
  <text x="800" y="78" text-anchor="middle" class="title">Explicit Ktor Exposed Integration</text>
  <text x="800" y="108" text-anchor="middle" class="subtitle">Ktor routes stay small while bluetape4k-exposed-ktor owns readiness, error mapping, and JDBC helper boundaries.</text>

  <rect x="70" y="148" width="1460" height="226" rx="18" class="laneHttp"/>
  <text x="104" y="188" class="laneTitle">Ktor HTTP surface</text>
  <text x="104" y="214" class="laneNote">Tests use Ktor testApplication and reach the module through real HTTP requests.</text>

  <rect x="70" y="404" width="1460" height="254" rx="18" class="laneHelper"/>
  <text x="104" y="444" class="laneTitle">bluetape4k-exposed-ktor helper surface</text>
  <text x="104" y="470" class="laneNote">The helper contributes readiness routes, sanitized database error mapping, and a dispatcher-aware JDBC transaction wrapper.</text>

  <rect x="70" y="688" width="1460" height="290" rx="18" class="laneResource"/>
  <text x="104" y="728" class="laneTitle">Caller-owned local resources</text>
  <text x="104" y="754" class="laneNote">Caller owns pools, dispatcher, and cleanup.</text>

  <g id="http-cards">
    <rect id="testApplication" x="118" y="246" width="270" height="84" rx="12" class="card httpCard"/>
    <text x="253" y="280" text-anchor="middle" class="cardTitle">testApplication</text>
    <text x="146" y="308" class="cardText">HTTP client + JSON assertions</text>

    <rect id="notesRoute" x="486" y="246" width="284" height="84" rx="12" class="card httpCard"/>
    <text x="628" y="280" text-anchor="middle" class="cardTitle">/api/notes</text>
    <text x="514" y="308" class="cardText">POST creates, GET lists notes</text>

    <rect id="healthRoute" x="862" y="246" width="284" height="84" rx="12" class="card httpCard"/>
    <text x="1004" y="280" text-anchor="middle" class="cardTitle">/healthz + /readyz</text>
    <text x="890" y="308" class="cardText">helper-installed Exposed checks</text>

    <rect id="failureRoute" x="1240" y="246" width="246" height="84" rx="12" class="card httpCard"/>
    <text x="1363" y="280" text-anchor="middle" class="cardTitle">/api/failures/sql</text>
    <text x="1268" y="308" class="cardText">throws SQLException for tests</text>
  </g>

  <g id="helper-cards">
    <rect id="ktorCore" x="118" y="506" width="294" height="94" rx="12" class="card helperCard"/>
    <text x="265" y="540" text-anchor="middle" class="cardTitle">Ktor Core Baseline</text>
    <text x="146" y="568" class="cardText">JSON enabled</text>
    <text x="146" y="590" class="cardText">StatusPages composed manually</text>

    <rect id="jdbcHelper" x="500" y="506" width="306" height="94" rx="12" class="card helperCard"/>
    <text x="653" y="540" text-anchor="middle" class="cardTitle">exposedJdbcTransaction</text>
    <text x="528" y="568" class="cardText">runs blocking Exposed JDBC</text>
    <text x="528" y="590" class="cardText">on caller-supplied dispatcher</text>

    <rect id="exposedKtor" x="894" y="506" width="300" height="94" rx="12" class="card helperCard"/>
    <text x="1044" y="540" text-anchor="middle" class="cardTitle">installBluetape4kExposedKtor</text>
    <text x="922" y="568" class="cardText">registers Exposed health routes</text>
    <text x="922" y="590" class="cardText">uses JDBC and R2DBC probes</text>

    <rect id="statusPages" x="1282" y="506" width="204" height="94" rx="12" class="card errorCard"/>
    <text x="1384" y="540" text-anchor="middle" class="cardTitle">StatusPages</text>
    <text x="1310" y="568" class="cardText">EXPOSED_DATABASE</text>
    <text x="1310" y="590" class="cardText">UNAVAILABLE</text>
  </g>

  <path id="flow-helper-jdbc" d="M 610 600 L 610 790" class="flowResource"/>
  <path id="flow-ready-jdbc" d="M 1004 600 L 1004 704 Q 1004 724 984 724 L 754 724 Q 734 724 734 744 L 734 790" class="flowResource"/>
  <path id="flow-ready-r2dbc" d="M 1044 600 L 1044 704 Q 1044 724 1064 724 L 1126 724 Q 1146 724 1146 744 L 1146 790" class="flowResource"/>

  <g id="resource-cards">
    <rect id="jdbcDb" x="500" y="790" width="364" height="84" rx="12" class="card resourceCard"/>
    <ellipse cx="532" cy="816" rx="19" ry="8" class="iconStroke"/>
    <path d="M513 816 L513 844 Q532 856 551 844 L551 816" class="iconStroke"/>
    <ellipse cx="532" cy="844" rx="19" ry="8" class="iconStroke"/>
    <text x="682" y="824" text-anchor="middle" class="cardTitle">H2 JDBC + HikariCP</text>
    <text x="570" y="852" class="cardText">caller-owned dispatcher boundary</text>

    <rect id="r2dbcDb" x="980" y="790" width="292" height="84" rx="12" class="card resourceCard"/>
    <ellipse cx="1012" cy="816" rx="19" ry="8" class="iconStroke"/>
    <path d="M993 816 L993 844 Q1012 856 1031 844 L1031 816" class="iconStroke"/>
    <ellipse cx="1012" cy="844" rx="19" ry="8" class="iconStroke"/>
    <text x="1126" y="824" text-anchor="middle" class="cardTitle">H2 R2DBC Pool</text>
    <text x="1050" y="852" class="cardText">readiness probe backend</text>
  </g>

  <path id="flow-test-notes" d="M 388 288 L 486 288" class="flowHttp"/>
  <path id="flow-notes-helper" d="M 610 330 L 610 414 Q 610 430 626 430 L 637 430 Q 653 430 653 446 L 653 506" class="flowHelper"/>
  <path id="flow-test-health" d="M 388 266 L 420 266 Q 434 266 434 252 L 434 240 Q 434 226 448 226 L 816 226 Q 830 226 830 240 L 830 252 Q 830 266 844 266 L 862 266" class="flowHttp"/>
  <path id="flow-health-helper" d="M 1004 330 L 1004 414 Q 1004 430 1020 430 L 1028 430 Q 1044 430 1044 446 L 1044 506" class="flowHelper"/>
  <path id="flow-failure-status" d="M 1363 330 L 1363 506" class="flowError"/>

  <text x="444" y="273" class="label">CRUD JSON</text>
  <text x="666" y="430" class="label">blocking tx</text>
  <text x="1064" y="430" class="label">health routes</text>
  <text x="1374" y="432" class="label">sanitized error</text>
  <rect x="112" y="1004" width="1376" height="44" rx="12" fill="#ffffff" stroke="#ccd7da" stroke-width="2"/>
  <text x="132" y="1032" class="note">Default CI proves CRUD, readiness success/failure, and sanitized database errors without Docker or external services.</text>
  <text x="800" y="1066" text-anchor="middle" class="footer">github.com/bluetape4k/exposed-workshop - 13-ecosystem-integrations/05-ktor-exposed-integration</text>
</svg>
