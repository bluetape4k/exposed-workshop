<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 860" width="1500" height="860" role="img" aria-label="Virtual Thread vs Platform Thread Comparison">
<defs>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/></filter>
<marker id="arrowBlue" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563eb" stroke="#2563eb" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
<marker id="arrowGreen" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#16a34a" stroke="#16a34a" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
<marker id="arrowOrange" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#ea580c" stroke="#ea580c" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
<marker id="arrowPurple" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7c3aed" stroke="#7c3aed" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
<marker id="arrowGray" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b" stroke="#64748b" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
<style>
.canvas{fill:#f6f9fc}.frame{fill:#fff;stroke:#d7e2ec;stroke-width:1.5}
.title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:31px;fill:#1e293b}
.subtitle,.detail{font-family:"Comic Mono","Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;fill:#536476}
.subtitle{font-size:13px}.detail{font-size:12px}.tiny{font-family:"Comic Mono","Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:10px;fill:#64748b}
.label{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:16px;fill:#1e293b}
.tableName{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:18px;fill:#1e293b}
.panelTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:12px;letter-spacing:.08em;fill:#94a3b8}
.card,.tableBox{stroke-width:1.7;filter:url(#shadow)}.panel{fill:#f8fafc;stroke:#d7e2ec;stroke-width:1.2}
.arrow{fill:none;stroke:#2563eb;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowBlue)}
.mapLine{fill:none;stroke:#16a34a;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowGreen)}
.dbUse{fill:none;stroke:#ea580c;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowOrange)}
.runtimeUse{fill:none;stroke:#7c3aed;stroke-width:1.9;stroke-dasharray:6 5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowPurple)}
.returnLine{fill:none;stroke:#64748b;stroke-width:1.7;stroke-dasharray:7 5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowGray)}
.lifeline{stroke:#cbd5e1;stroke-width:1.4;stroke-dasharray:5 6}
</style>
</defs>
<rect width="1500" height="860" class="canvas"/>
<rect x="20" y="20" width="1460" height="820" rx="16" class="frame"/>
<text x="48" y="58" class="title">Virtual Thread vs Platform Thread Comparison</text>
<text x="48" y="80" class="subtitle">The example compares virtual-thread transaction APIs with regular transaction calls against the same JDBC pool and VTester table</text>
<rect x="60" y="130" width="600" height="430" rx="12" class="panel"/><text x="360" y="122" class="panelTitle" text-anchor="middle">VIRTUAL THREAD PATH</text>
<desc>VT transaction async</desc><rect x="96" y="198" width="210" height="64" rx="10" fill="#ede9fe" stroke="#7c3aed" class="card"/>
<text x="201" y="223" class="label" text-anchor="middle">VT transaction async</text>
<text x="201" y="248" class="detail" text-anchor="middle">VirtualFuture</text>
<desc>Virtual Threads</desc><rect x="390" y="198" width="210" height="64" rx="10" fill="#fef3c7" stroke="#d97706" class="card"/>
<text x="495" y="223" class="label" text-anchor="middle">Virtual Threads</text>
<text x="495" y="248" class="detail" text-anchor="middle">lightweight tasks</text>
<desc>newVirtualThread Tx</desc><rect x="96" y="388" width="210" height="64" rx="10" fill="#ccfbf1" stroke="#0f766e" class="card"/>
<text x="201" y="413" class="label" text-anchor="middle">newVirtualThread Tx</text>
<text x="201" y="438" class="detail" text-anchor="middle">blocking style API</text>
<desc>many inserts/selects</desc><rect x="390" y="388" width="210" height="64" rx="10" fill="#dcfce7" stroke="#16a34a" class="card"/>
<text x="495" y="413" class="label" text-anchor="middle">many inserts/selects</text>
<text x="495" y="438" class="detail" text-anchor="middle">awaitAll fan-out</text>
<rect x="60" y="590" width="600" height="130" rx="12" class="panel"/><text x="360" y="582" class="panelTitle" text-anchor="middle">PLATFORM THREAD COMPARISON</text>
<desc>regular transaction</desc><rect x="96" y="624" width="210" height="58" rx="10" fill="#e2e8f0" stroke="#64748b" class="card"/>
<text x="201" y="649" class="label" text-anchor="middle">regular transaction</text>
<text x="201" y="668" class="detail" text-anchor="middle">transaction { }</text>
<desc>platform thread</desc><rect x="390" y="624" width="210" height="58" rx="10" fill="#e2e8f0" stroke="#64748b" class="card"/>
<text x="495" y="649" class="label" text-anchor="middle">platform thread</text>
<text x="495" y="668" class="detail" text-anchor="middle">baseline check</text>
<rect x="760" y="130" width="330" height="590" rx="12" class="panel"/><text x="925" y="122" class="panelTitle" text-anchor="middle">SHARED EXPOSED LAYER</text>
<desc>JdbcTransaction</desc><rect x="820" y="222" width="210" height="64" rx="10" fill="#ccfbf1" stroke="#0f766e" class="card"/>
<text x="925" y="247" class="label" text-anchor="middle">JdbcTransaction</text>
<text x="925" y="272" class="detail" text-anchor="middle">same Exposed API</text>
<desc>Connection pool</desc><rect x="820" y="392" width="210" height="64" rx="10" fill="#dbeafe" stroke="#3b82f6" class="card"/>
<text x="925" y="417" class="label" text-anchor="middle">Connection pool</text>
<text x="925" y="442" class="detail" text-anchor="middle">shared bottleneck</text>
<desc>Assertions</desc><rect x="820" y="562" width="210" height="64" rx="10" fill="#fce7f3" stroke="#db2777" class="card"/>
<text x="925" y="587" class="label" text-anchor="middle">Assertions</text>
<text x="925" y="612" class="detail" text-anchor="middle">both paths pass</text>
<rect x="1190" y="130" width="250" height="590" rx="12" class="panel"/><text x="1315" y="122" class="panelTitle" text-anchor="middle">DATABASE</text>
<desc>VTester</desc><rect x="1230" y="202" width="170" height="58" rx="10" fill="#dcfce7" stroke="#16a34a" class="card"/>
<text x="1315" y="227" class="label" text-anchor="middle">VTester</text>
<text x="1315" y="246" class="detail" text-anchor="middle">id + nullable name</text>
<path d="M1258,377 C1258,356 1372,356 1372,377 L1372,533 C1372,554 1258,554 1258,533 Z" fill="#fff" stroke="#ea580c" stroke-width="1.7" class="card"/>
<ellipse cx="1315" cy="377" rx="57" ry="17" fill="#ffedd5" stroke="#ea580c" stroke-width="1.7"/>
<path d="M1258,533 C1258,554 1372,554 1372,533" fill="none" stroke="#ea580c" stroke-width="1.7"/>
<text x="1315" y="412" class="label" text-anchor="middle">DB</text>
<text x="1272" y="446" class="tiny">H2</text>
<text x="1272" y="464" class="tiny">Postgres</text>
<text x="1272" y="482" class="tiny">MySQL</text>
<path d="M306,230 L390,230" class="arrow" data-connector="async-to-virtual"/>
<path d="M600,230 L820,230" class="arrow" data-connector="virtual-to-jdbc"/>
<path d="M306,420 L390,420" class="arrow" data-connector="newtx-to-fanout"/>
<path d="M600,420 L820,420" class="mapLine" data-connector="fanout-to-pool"/>
<path d="M306,653 L390,653" class="runtimeUse" data-connector="regular-to-platform"/>
<path d="M600,653 L690,653 Q710,653 710,633 L710,614 Q710,594 730,594 L820,594" class="runtimeUse" data-connector="platform-to-assertions"/>
<path d="M1030,254 L1230,254" class="mapLine" data-connector="jdbc-to-vtester"/>
<path d="M1030,424 L1258,424" class="dbUse" data-connector="pool-to-db"/>
<path d="M1315,260 L1315,360" class="dbUse" data-connector="table-to-db"/>
<rect x="142" y="760" width="1216" height="52" rx="10" fill="#ecfdf5" stroke="#86efac" stroke-width="1.3"/>
<text x="750" y="791" class="detail" text-anchor="middle">Decision guide: virtual threads minimize code changes for Java 21 blocking-style code, but both paths still converge on the same JDBC transaction and database capacity.</text>
</svg>
