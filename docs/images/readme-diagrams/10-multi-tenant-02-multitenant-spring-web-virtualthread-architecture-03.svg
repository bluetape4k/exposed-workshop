<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1378 690" width="1378" height="690" role="img" aria-label="Platform thread and virtual thread comparison">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12" /></filter>
    <marker id="arrowBlue" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto" data-role="primary" data-tip-direction="positive-x"><path d="M0 0 L10 5 L0 10 Z" fill="#4f86c6" stroke="#4f86c6" stroke-dasharray="none" style="stroke-dasharray:none" /></marker>
    <marker id="arrowGreen" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto" data-role="primary" data-tip-direction="positive-x"><path d="M0 0 L10 5 L0 10 Z" fill="#6f8f58" stroke="#6f8f58" stroke-dasharray="none" style="stroke-dasharray:none" /></marker>
    <marker id="arrowAmber" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto" data-role="primary" data-tip-direction="positive-x"><path d="M0 0 L10 5 L0 10 Z" fill="#b8894a" stroke="#b8894a" stroke-dasharray="none" style="stroke-dasharray:none" /></marker>
    <style>
      .canvas{fill:#f6f9fc}.frame{fill:#fff;stroke:#d7e2ec;stroke-width:1.5}
      .panel{fill:#f8fafc;stroke:#d7e2ec;stroke-width:1.2}
      .card{stroke-width:1.7;filter:url(#shadow)}
      .title{font-family:"Architects Daughter";font-size:32px;fill:#1e293b}
      .subtitle,.detail,.tiny{font-family:"Comic Mono";fill:#536476}
      .subtitle{font-size:13px}.detail{font-size:12px}.tiny{font-size:10.5px;fill:#64748b}
      .panelTitle{font-family:"Architects Daughter";font-size:13px;letter-spacing:.08em;fill:#64748b}
      .label{font-family:"Architects Daughter";font-size:17px;fill:#1e293b}
      .flow{fill:none;stroke:#4f86c6;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
      .contextFlow{fill:none;stroke:#6f8f58;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
      .configFlow{fill:none;stroke:#b8894a;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect width="1378" height="690" class="canvas" />
  <rect x="20" y="20" width="1338" height="650" rx="16" class="frame" />
  <text x="48" y="58" class="title">Platform Thread vs Virtual Thread</text>
  <text x="48" y="80" class="subtitle">TomcatVirtualThreadConfig swaps Tomcat's executor; tenant context changes from mutable ThreadLocal cleanup to scoped binding</text>

  <rect x="54" y="122" width="590" height="430" rx="14" class="panel" />
  <text x="349" y="148" class="panelTitle" text-anchor="middle">PLATFORM THREAD MODEL</text>
  <rect x="88" y="184" width="178" height="70" rx="10" fill="#dbeafe" stroke="#4f86c6" class="card" />
  <text x="177" y="213" class="label" text-anchor="middle">Tomcat Pool</text>
  <text x="177" y="236" class="detail" text-anchor="middle">bounded workers</text>
  <rect x="326" y="184" width="178" height="70" rx="10" fill="#dbeafe" stroke="#4f86c6" class="card" />
  <text x="415" y="213" class="label" text-anchor="middle">Platform Thread</text>
  <text x="415" y="236" class="detail" text-anchor="middle">reused carrier</text>
  <rect x="326" y="306" width="178" height="70" rx="10" fill="#ecfdf5" stroke="#6f8f58" class="card" />
  <text x="415" y="335" class="label" text-anchor="middle">ThreadLocal</text>
  <text x="415" y="358" class="detail" text-anchor="middle">manual clear()</text>
  <rect x="88" y="306" width="178" height="70" rx="10" fill="#fef3c7" stroke="#b8894a" class="card" />
  <text x="177" y="335" class="label" text-anchor="middle">Exposed JDBC</text>
  <text x="177" y="358" class="detail" text-anchor="middle">blocking call</text>
  <rect x="207" y="424" width="178" height="58" rx="10" fill="#ffedd5" stroke="#b8894a" class="card" />
  <text x="296" y="448" class="label" text-anchor="middle">Shared DB</text>
  <text x="296" y="468" class="detail" text-anchor="middle">tenant schemas</text>

  <path d="M266,219 H326" class="flow" marker-end="url(#arrowBlue)" />
  <path d="M415,254 V306" class="contextFlow" marker-end="url(#arrowGreen)" />
  <path d="M415,376 V398 Q415,406 407,406 H348 Q340,401 340,409 V424" class="configFlow" marker-end="url(#arrowAmber)" />
  <path d="M177,376 V398 Q177,406 185,406 H288 Q296,401 296,409 V424" class="configFlow" marker-end="url(#arrowAmber)" />
  <text x="349" y="500" class="tiny" text-anchor="middle">Mutable tenant context must be restored or cleared for every reused worker thread.</text>

  <rect x="734" y="122" width="590" height="430" rx="14" class="panel" />
  <text x="1029" y="148" class="panelTitle" text-anchor="middle">VIRTUAL THREAD MODEL</text>
  <rect x="768" y="164" width="228" height="64" rx="10" fill="#fef3c7" stroke="#b8894a" class="card" />
  <text x="882" y="191" class="label" text-anchor="middle">TomcatVirtualThreadConfig</text>
  <text x="882" y="212" class="detail" text-anchor="middle">conditional customizer</text>
  <rect x="768" y="260" width="178" height="70" rx="10" fill="#dbeafe" stroke="#4f86c6" class="card" />
  <text x="857" y="289" class="label" text-anchor="middle">ProtocolHandler</text>
  <text x="857" y="312" class="detail" text-anchor="middle">Tomcat request</text>
  <rect x="1014" y="260" width="220" height="70" rx="10" fill="#dbeafe" stroke="#4f86c6" class="card" />
  <text x="1124" y="289" class="label" text-anchor="middle">Virtual Executor</text>
  <text x="1124" y="312" class="detail" text-anchor="middle">newVirtualThreadPerTask</text>
  <rect x="1014" y="370" width="220" height="70" rx="10" fill="#ecfdf5" stroke="#6f8f58" class="card" />
  <text x="1124" y="399" class="label" text-anchor="middle">ScopedValue Binding</text>
  <text x="1124" y="422" class="detail" text-anchor="middle">scope exit cleanup</text>
  <rect x="768" y="370" width="178" height="70" rx="10" fill="#fef3c7" stroke="#b8894a" class="card" />
  <text x="857" y="399" class="label" text-anchor="middle">Exposed JDBC</text>
  <text x="857" y="422" class="detail" text-anchor="middle">blocking is OK</text>
  <rect x="866" y="470" width="178" height="58" rx="10" fill="#ffedd5" stroke="#b8894a" class="card" />
  <text x="955" y="494" class="label" text-anchor="middle">Shared DB</text>
  <text x="955" y="514" class="detail" text-anchor="middle">tenant schemas</text>

  <path d="M882,228 V236 Q882,244 890,244 H1116 Q1124,237 1124,245 V260" class="configFlow" marker-end="url(#arrowAmber)" />
  <path d="M946,295 H1014" class="flow" marker-end="url(#arrowBlue)" />
  <path d="M1124,330 V370" class="contextFlow" marker-end="url(#arrowGreen)" />
  <path d="M1014,405 H946" class="contextFlow" marker-end="url(#arrowGreen)" />
  <path d="M857,440 V446 Q857,454 865,454 H947 Q955,447 955,455 V470" class="configFlow" marker-end="url(#arrowAmber)" />
  <text x="1029" y="545" class="tiny" text-anchor="middle">Each request can get a cheap virtual thread while scoped tenant state is destroyed with the lexical scope.</text>

  <rect x="196" y="590" width="986" height="48" rx="10" fill="#f8fafc" stroke="#d7e2ec" stroke-width="1.2" />
  <text x="230" y="620" class="tiny">Legend:</text>
  <path d="M292,615 H344" class="flow" marker-end="url(#arrowBlue)" />
  <text x="356" y="620" class="tiny">request scheduling</text>
  <path d="M520,615 H572" class="contextFlow" marker-end="url(#arrowGreen)" />
  <text x="584" y="620" class="tiny">tenant context</text>
  <path d="M728,615 H780" class="configFlow" marker-end="url(#arrowAmber)" />
  <text x="792" y="620" class="tiny">configuration / JDBC access</text>
</svg>