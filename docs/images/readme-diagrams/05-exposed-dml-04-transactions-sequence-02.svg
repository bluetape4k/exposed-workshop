<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 880" width="1500" height="880" role="img" aria-labelledby="title desc">
<title id="title">Exposed coroutine nested transaction sequence</title>
<desc id="desc">Coroutine transaction tests reuse the active transaction when present, create savepoints for nested work, roll back savepoint1, and assert that only city1 remains.</desc>
<defs>
<style>
text{letter-spacing:0}
.frame{fill:#fbfcf8;stroke:#41545d;stroke-width:3}
.title{font-family:"Architects Daughter";font-size:38px;font-weight:400;fill:#263238}
.subtitle,.msg,.note,.footer,.role{font-family:"Comic Mono";fill:#36464f}
.subtitle{font-size:17px}.participant{font-family:"Architects Daughter";font-size:18px;font-weight:400;fill:#1f3138}.role{font-size:12px;fill:#546a73}
.msg{font-size:13px}.note{font-size:13px}.footer{font-size:13px;fill:#60727d}
.header{fill:#ffffff;stroke:#546e7a;stroke-width:2}.lifeline{stroke:#9aaab1;stroke-width:2;stroke-dasharray:7 8}
.activation{fill:#f3ecdf;stroke:#8f784e;stroke-width:1.5}
.altFrame{fill:none;stroke:#7d939e;stroke-width:2.5;stroke-dasharray:10 7}
.branchLabel{fill:#ffffff;stroke:#c8b38f;stroke-width:1.4}
.call{fill:none;stroke:#3f7d9c;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowCall)}
.sql{fill:none;stroke:#a2743d;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowSql)}
.state{fill:none;stroke:#6e8f4f;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowState)}
.return{fill:none;stroke:#9b7d54;stroke-width:2.5;stroke-dasharray:8 6;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowReturn)}
.error{fill:none;stroke:#b65b5b;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowError)}
.label{fill:#ffffff;stroke:#d7e0e4;stroke-width:1.5}.label.callLabel{stroke:#9cc2d1}.label.sqlLabel{stroke:#d0b078}.label.stateLabel{stroke:#b6c9a4}.label.returnLabel{stroke:#c8b38f}.label.errorLabel{stroke:#d79595}
.badge{stroke-width:1.8}.badge.callBadge{fill:#eaf4f8;stroke:#3f7d9c}.badge.sqlBadge{fill:#fff4df;stroke:#a2743d}.badge.stateBadge{fill:#eef7f0;stroke:#6e8f4f}.badge.returnBadge{fill:#fff7e8;stroke:#9b7d54}.badge.errorBadge{fill:#fff1f1;stroke:#b65b5b}
.badgeText{font-family:"Comic Mono";font-size:12px;font-weight:700}
.msg.callText,.badgeText.callText{fill:#2f6f8e}.msg.sqlText,.badgeText.sqlText{fill:#855a29}.msg.stateText,.badgeText.stateText{fill:#55783f}.msg.returnText,.badgeText.returnText{fill:#7f6038}.msg.errorText,.badgeText.errorText{fill:#9b4545}
</style>
<marker id="arrowCall" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" refX="9" refY="5" orient="auto" data-role="sequence" data-tip-direction="positive-x">
<path d="M 0 0 L 10 5 L 0 10 Z" fill="#3f7d9c" stroke="#3f7d9c" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
</marker>
<marker id="arrowSql" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" refX="9" refY="5" orient="auto" data-role="sequence" data-tip-direction="positive-x">
<path d="M 0 0 L 10 5 L 0 10 Z" fill="#a2743d" stroke="#a2743d" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
</marker>
<marker id="arrowState" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" refX="9" refY="5" orient="auto" data-role="sequence" data-tip-direction="positive-x">
<path d="M 0 0 L 10 5 L 0 10 Z" fill="#6e8f4f" stroke="#6e8f4f" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
</marker>
<marker id="arrowReturn" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" refX="9" refY="5" orient="auto" data-role="sequence" data-tip-direction="positive-x">
<path d="M 0 0 L 10 5 L 0 10 Z" fill="#9b7d54" stroke="#9b7d54" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
</marker>
<marker id="arrowError" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" refX="9" refY="5" orient="auto" data-role="sequence" data-tip-direction="positive-x">
<path d="M 0 0 L 10 5 L 0 10 Z" fill="#b65b5b" stroke="#b65b5b" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
</marker>
</defs>
<rect x="24" y="24" width="1452" height="832" rx="20" class="frame"/>
<text x="750" y="72" text-anchor="middle" class="title">Coroutine Nested Transaction Savepoint Flow</text>
<text x="750" y="102" text-anchor="middle" class="subtitle">The helper reuses an active transaction, rolls back savepoint1, and leaves the outer city1 row intact.</text>

<g id="participants">
<rect x="46" y="142" width="140" height="64" rx="10" class="header"/>
<text x="116" y="169" text-anchor="middle" class="participant">Test</text>
<text x="116" y="190" text-anchor="middle" class="role">runSuspendIO</text>
<rect x="242" y="142" width="176" height="64" rx="10" class="header"/>
<text x="330" y="169" text-anchor="middle" class="participant">withTables</text>
<text x="330" y="190" text-anchor="middle" class="role">suspending fixture</text>
<rect x="494" y="142" width="178" height="64" rx="10" class="header"/>
<text x="583" y="169" text-anchor="middle" class="participant">TxManager</text>
<text x="583" y="190" text-anchor="middle" class="role">currentOrNull</text>
<rect x="746" y="142" width="188" height="64" rx="10" class="header"/>
<text x="840" y="169" text-anchor="middle" class="participant">Savepoint</text>
<text x="840" y="190" text-anchor="middle" class="role">helper</text>
<rect x="1010" y="142" width="164" height="64" rx="10" class="header"/>
<text x="1092" y="169" text-anchor="middle" class="participant">Cities</text>
<text x="1092" y="190" text-anchor="middle" class="role">H2 rows</text>
<rect x="1258" y="142" width="166" height="64" rx="10" class="header"/>
<text x="1341" y="169" text-anchor="middle" class="participant">Assertions</text>
<text x="1341" y="190" text-anchor="middle" class="role">city names</text>
</g>

<line x1="116" y1="206" x2="116" y2="770" class="lifeline"/>
<line x1="330" y1="206" x2="330" y2="770" class="lifeline"/>
<line x1="583" y1="206" x2="583" y2="770" class="lifeline"/>
<line x1="840" y1="206" x2="840" y2="770" class="lifeline"/>
<line x1="1092" y1="206" x2="1092" y2="770" class="lifeline"/>
<line x1="1341" y1="206" x2="1341" y2="770" class="lifeline"/>

<rect x="323" y="262" width="14" height="472" rx="6" class="activation"/>
<rect x="576" y="324" width="14" height="98" rx="6" class="activation"/>
<rect x="576" y="704" width="14" height="58" rx="6" class="activation"/>
<rect x="833" y="386" width="14" height="366" rx="6" class="activation"/>
<rect x="1085" y="448" width="14" height="182" rx="6" class="activation"/>
<rect x="1334" y="646" width="14" height="82" rx="6" class="activation"/>

<rect x="70" y="224" width="352" height="34" rx="17" class="label callLabel"/>
<circle cx="94" cy="241" r="13" class="badge callBadge"/><text x="94" y="246" text-anchor="middle" class="badgeText callText">1</text>
<text x="118" y="246" class="msg callText">withTablesSuspending(testDB, Cities)</text>
<path d="M 116 276 L 323 276" class="call"/>

<rect x="288" y="286" width="338" height="34" rx="17" class="label callLabel"/>
<circle cx="312" cy="303" r="13" class="badge callBadge"/><text x="312" y="308" text-anchor="middle" class="badgeText callText">2</text>
<text x="336" y="308" class="msg callText">TransactionManager.currentOrNull()</text>
<path d="M 337 338 L 576 338" class="call"/>

<rect x="70" y="358" width="1360" height="402" rx="14" class="alt altFrame"/>
<rect x="96" y="378" width="256" height="30" rx="15" class="branchLabel"/>
<text x="116" y="398" class="msg returnText">alt current transaction exists</text>
<line x1="70" y1="604" x2="1430" y2="604" class="branchDivider altFrame"/>
<rect x="96" y="620" width="300" height="30" rx="15" class="branchLabel"/>
<text x="116" y="640" class="msg returnText">else no active transaction context</text>

<rect x="544" y="354" width="326" height="34" rx="17" class="label stateLabel"/>
<circle cx="568" cy="371" r="13" class="badge stateBadge"/><text x="568" y="376" text-anchor="middle" class="badgeText stateText">3</text>
<text x="592" y="376" class="msg stateText">runWithSavepoint(savepoint1)</text>
<path d="M 590 402 L 833 402" class="state"/>

<rect x="774" y="416" width="382" height="34" rx="17" class="label sqlLabel"/>
<circle cx="798" cy="433" r="13" class="badge sqlBadge"/><text x="798" y="438" text-anchor="middle" class="badgeText sqlText">4</text>
<text x="822" y="438" class="msg sqlText">setSavepoint + insert city2/city3</text>
<path d="M 847 464 L 1085 464" class="sql"/>

<rect x="772" y="478" width="330" height="34" rx="17" class="label errorLabel"/>
<circle cx="796" cy="495" r="13" class="badge errorBadge"/><text x="796" y="500" text-anchor="middle" class="badgeText errorText">5</text>
<text x="820" y="500" class="msg errorText">rollback(savepoint1)</text>
<path d="M 1085 526 L 847 526" class="error"/>

<rect x="692" y="540" width="386" height="34" rx="17" class="label returnLabel"/>
<circle cx="716" cy="557" r="13" class="badge returnBadge"/><text x="716" y="562" text-anchor="middle" class="badgeText returnText">6</text>
<text x="740" y="562" class="msg returnText">cityNames() returns [city1]</text>
<path d="M 1085 588 L 337 588" class="return"/>

<rect x="1030" y="614" width="332" height="34" rx="17" class="label stateLabel"/>
<circle cx="1054" cy="631" r="13" class="badge stateBadge"/><text x="1054" y="636" text-anchor="middle" class="badgeText stateText">7</text>
<text x="1078" y="636" class="msg stateText">assert names == [city1]</text>
<path d="M 337 664 L 1334 664" class="state"/>

<rect x="542" y="692" width="384" height="34" rx="17" class="label callLabel"/>
<circle cx="566" cy="709" r="13" class="badge callBadge"/><text x="566" y="714" text-anchor="middle" class="badgeText callText">8</text>
<text x="590" y="714" class="msg callText">newSuspendedTransaction fallback</text>
<path d="M 833 734 L 590 734" class="call"/>

<rect x="98" y="790" width="1304" height="42" rx="12" fill="#ffffff" stroke="#ccd7da" stroke-width="2"/>
<text x="118" y="816" class="note">runWithSavepointOrNewTransaction uses the current TransactionManager context when present; fallback starts a new suspended transaction.</text>
<text x="750" y="850" text-anchor="middle" class="footer">github.com/bluetape4k/exposed-workshop - 05-exposed-dml/04-transactions</text>
</svg>
