<svg xmlns="http://www.w3.org/2000/svg" width="1288" height="1612" viewBox="0 0 1288 1612" role="img" aria-label="Coroutine Transaction Flow">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#758297" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 0 1 L 12 6 L 0 11 Z" fill="#ffffff" stroke="#758297" stroke-width="1.8"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="1288" height="1612"/>
<rect class="frame" x="32" y="28" width="1224" height="1556" rx="28"/>
<text class="title" x="66" y="82">Coroutine Transaction Flow</text>
<text class="subtitle" x="70" y="118">Sequence messages from the original Mermaid source</text>
<rect class="card" x="-10" y="166" width="300" height="72" rx="20" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="140" y="209" text-anchor="middle">Caller (Coroutine)</text>
<line class="lifeline" x1="140" y1="252" x2="140" y2="1552" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="494" y="166" width="300" height="72" rx="20" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="644" y="198.5" text-anchor="middle">new Suspended</text>
<text class="smallLabel" x="644" y="219.5" text-anchor="middle">Transaction</text>
<line class="lifeline" x1="644" y1="252" x2="644" y2="1552" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="998" y="166" width="300" height="72" rx="20" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="1148" y="209" text-anchor="middle">Database</text>
<line class="lifeline" x1="1148" y1="252" x2="1148" y2="1552" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect x="204.5" y="286" width="375" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="222.5" y="313" text-anchor="start">1. newSuspendedTransaction(Dispatchers.IO)</text>
<path class="line" d="M140 344 L644 344"/>
<rect x="791" y="396" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="809" y="423" text-anchor="start">2. BEGIN</text>
<path class="line" d="M644 454 L1148 454"/>
<rect x="745" y="506" width="302" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="763" y="533" text-anchor="start">3. Execute SQL (INSERT/SELECT...)</text>
<path class="line" d="M644 564 L1148 564"/>
<rect x="70" y="616" width="1148" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="92" y="643" text-anchor="start">ALT: Normal completion</text>
<rect x="791" y="684" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="809" y="711" text-anchor="start">5. COMMIT</text>
<path class="line" d="M644 742 L1148 742"/>
<rect x="287" y="794" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="305" y="821" text-anchor="start">6. Return result</text>
<path class="dashed" d="M644 852 L140 852"/>
<rect x="70" y="904" width="1148" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="92" y="931" text-anchor="start">ELSE: Exception</text>
<rect x="791" y="972" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="809" y="999" text-anchor="start">8. ROLLBACK</text>
<path class="line" d="M644 1030 L1148 1030"/>
<rect x="285" y="1082" width="214" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="303" y="1109" text-anchor="start">9. Propagate exception</text>
<path class="dashed" d="M644 1140 L140 1140"/>
<rect x="224.5" y="1192" width="335" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="242.5" y="1219" text-anchor="start">10. suspendedTransactionAsync { ... }</text>
<path class="line" d="M140 1250 L644 1250"/>
<rect x="236.5" y="1302" width="311" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="254.5" y="1329" text-anchor="start">11. Return Deferred&lt;T&gt; immediately</text>
<path class="dashed" d="M644 1360 L140 1360"/>
<rect x="60" y="1412" width="278" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="78" y="1439" text-anchor="start">12. Receive result via await()</text>
<path class="line" d="M140 1470 C204 1470 204 1504 140 1504"/>
</svg>
