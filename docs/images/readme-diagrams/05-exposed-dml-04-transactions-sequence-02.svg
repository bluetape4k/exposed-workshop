<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 880" width="1500" height="880" role="img" aria-label="Exposed Coroutine Transaction Flow">
<defs>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/></filter>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8 Z" fill="#64748b"/></marker>
<marker id="arrowBlue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8 Z" fill="#2563eb"/></marker>
<marker id="arrowPurple" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8 Z" fill="#7c3aed"/></marker>
<marker id="arrowOrange" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8 Z" fill="#ea580c"/></marker>
<marker id="arrowPink" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8 Z" fill="#db2777"/></marker>
<style>
.canvas{fill:#f6f9fc}.frame{fill:#fff;stroke:#d7e2ec;stroke-width:1.5}
.title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:31px;fill:#1e293b}
.subtitle,.detail{font-family:"Comic Mono","Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;fill:#536476}
.subtitle{font-size:13px}.detail{font-size:12px}.tiny{font-family:"Comic Mono","Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:10px;fill:#64748b}
.label{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:16px;fill:#1e293b}
.panelTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:12px;letter-spacing:.08em;fill:#94a3b8}
.card{stroke-width:1.7;filter:url(#shadow)}.panel{fill:#f8fafc;stroke:#d7e2ec;stroke-width:1.2}
.arrow{fill:none;stroke:#2563eb;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowBlue)}
.runtimeUse{fill:none;stroke:#7c3aed;stroke-width:1.9;stroke-dasharray:5 5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowPurple)}
.dbUse{fill:none;stroke:#ea580c;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowOrange)}
.savepoint{fill:none;stroke:#db2777;stroke-width:1.9;stroke-dasharray:7 4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowPink)}
.returnLine{fill:none;stroke:#64748b;stroke-width:1.8;stroke-dasharray:6 5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
.lifeline{stroke:#cbd5e1;stroke-width:1.5;stroke-dasharray:5 6}
</style>
</defs>
<rect width="1500" height="880" class="canvas"/>
<rect x="20" y="20" width="1460" height="840" rx="16" class="frame"/>
<text x="48" y="58" class="title">Exposed Coroutine Transaction Flow</text>
<text x="48" y="80" class="subtitle">Coroutine tests choose current savepoint or new suspended transaction, then return to the outer transaction context</text>
<rect x="26" y="128" width="164" height="54" rx="10" fill="#dbeafe" stroke="#3b82f6" class="card"/>
<text x="108" y="161" class="label" text-anchor="middle">Test</text>
<path d="M108,182 L108,730" class="lifeline"/>
<rect x="242" y="128" width="164" height="54" rx="10" fill="#ede9fe" stroke="#7c3aed" class="card"/>
<text x="324" y="161" class="label" text-anchor="middle">withTablesSuspending</text>
<path d="M324,182 L324,730" class="lifeline"/>
<rect x="466" y="128" width="164" height="54" rx="10" fill="#dcfce7" stroke="#16a34a" class="card"/>
<text x="548" y="161" class="label" text-anchor="middle">TransactionManager</text>
<path d="M548,182 L548,730" class="lifeline"/>
<rect x="704" y="128" width="164" height="54" rx="10" fill="#ffedd5" stroke="#ea580c" class="card"/>
<text x="786" y="161" class="label" text-anchor="middle">Savepoint helper</text>
<path d="M786,182 L786,730" class="lifeline"/>
<rect x="946" y="128" width="164" height="54" rx="10" fill="#fce7f3" stroke="#db2777" class="card"/>
<text x="1028" y="161" class="label" text-anchor="middle">H2 Cities</text>
<path d="M1028,182 L1028,730" class="lifeline"/>
<rect x="1184" y="128" width="164" height="54" rx="10" fill="#ccfbf1" stroke="#0f766e" class="card"/>
<text x="1266" y="161" class="label" text-anchor="middle">Assertions</text>
<path d="M1266,182 L1266,730" class="lifeline"/>
<path d="M108,230 L324,230" class="arrow"/>
<rect x="124" y="202" width="184" height="22" rx="7" fill="#fff" stroke="#bfdbfe"/>
<text x="216" y="217" class="tiny" text-anchor="middle">1. runSuspendIO</text>
<path d="M324,292 L548,292" class="arrow"/>
<rect x="344" y="264" width="184" height="22" rx="7" fill="#fff" stroke="#bfdbfe"/>
<text x="436" y="279" class="tiny" text-anchor="middle">2. currentOrNull()</text>
<path d="M548,354 L786,354" class="arrow"/>
<rect x="575" y="326" width="184" height="22" rx="7" fill="#fff" stroke="#bfdbfe"/>
<text x="667" y="341" class="tiny" text-anchor="middle">3. current tx exists</text>
<path d="M786,416 L1028,416" class="arrow"/>
<rect x="815" y="388" width="184" height="22" rx="7" fill="#fff" stroke="#bfdbfe"/>
<text x="907" y="403" class="tiny" text-anchor="middle">4. setSavepoint</text>
<path d="M786,478 L1028,478" class="arrow"/>
<rect x="815" y="450" width="184" height="22" rx="7" fill="#fff" stroke="#bfdbfe"/>
<text x="907" y="465" class="tiny" text-anchor="middle">5. insert city2/city3</text>
<path d="M1028,540 L786,540" class="returnLine"/>
<rect x="803" y="512" width="208" height="22" rx="7" fill="#fff" stroke="#cbd5e1"/>
<text x="907" y="527" class="tiny" text-anchor="middle">6. rollback savepoint1</text>
<path d="M108,602 L1028,602" class="arrow"/>
<rect x="476" y="574" width="184" height="22" rx="7" fill="#fff" stroke="#bfdbfe"/>
<text x="568" y="589" class="tiny" text-anchor="middle">7. select remaining rows</text>
<path d="M108,646 L1266,646" class="arrow"/>
<rect x="595" y="618" width="184" height="22" rx="7" fill="#fff" stroke="#bfdbfe"/>
<text x="687" y="633" class="tiny" text-anchor="middle">8. assert [city1]</text>
<path d="M548,704 L108,704" class="returnLine"/>
<rect x="224" y="676" width="208" height="22" rx="7" fill="#fff" stroke="#cbd5e1"/>
<text x="328" y="691" class="tiny" text-anchor="middle">fallback: newSuspendedTransaction</text>
<rect x="116" y="774" width="1268" height="52" rx="10" fill="#ecfdf5" stroke="#86efac" stroke-width="1.3"/>
<text x="750" y="805" class="detail" text-anchor="middle">Sequence check: return paths are dashed; helper chooses runWithSavepoint when a TransactionManager context exists, otherwise starts newSuspendedTransaction.</text>
</svg>
