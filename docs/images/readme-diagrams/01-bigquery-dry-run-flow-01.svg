<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc">
  <title id="title">BigQuery dry-run query validation sequence</title>
  <desc id="desc">Source-backed sequence for the credential-free Exposed BigQuery dry-run workshop path with a mocked BigQuery REST client.</desc>
  <defs>
    <style>
      text { letter-spacing: 0; }
      .title { font-family: "Architects Daughter"; font-size: 40px; font-weight: 400; fill: #263238; }
      .subtitle, .msg, .note, .footer, .role { font-family: "Comic Mono"; fill: #36464f; }
      .subtitle { font-size: 18px; }
      .participant { font-family: "Architects Daughter"; font-size: 19px; font-weight: 400; fill: #1f3138; }
      .role { font-size: 13px; fill: #546a73; }
      .msg { font-size: 14px; }
      .note { font-size: 13px; }
      .footer { font-size: 14px; fill: #60727d; }
      .frame { fill: #fbfcf8; stroke: #41545d; stroke-width: 3; }
      .header { fill: #ffffff; stroke: #546e7a; stroke-width: 2; }
      .lifeline { stroke: #9aaab1; stroke-width: 2; stroke-dasharray: 7 8; }
      .activation { fill: #f3ecdf; stroke: #8f784e; stroke-width: 1.5; }
      .call { fill: none; stroke: #3f7d9c; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowCall); }
      .sql { fill: none; stroke: #a2743d; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowSql); }
      .state { fill: none; stroke: #6e8f4f; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowState); }
      .error { fill: none; stroke: #b45f5f; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowError); }
      .return { fill: none; stroke: #9b7d54; stroke-width: 2.5; stroke-dasharray: 8 6; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowReturn); }
      .alt { fill: none; stroke: #78909c; stroke-width: 3; stroke-dasharray: 12 7; }
      .label { fill: #ffffff; stroke: #d7e0e4; stroke-width: 1.5; }
      .label.callLabel { stroke: #9cc2d1; }
      .label.sqlLabel { stroke: #d0b078; }
      .label.stateLabel { stroke: #b6c9a4; }
      .label.errorLabel { stroke: #d8a3a3; }
      .label.returnLabel { stroke: #c8b38f; }
      .badge { stroke-width: 1.8; }
      .badge.callBadge { fill: #eaf4f8; stroke: #3f7d9c; }
      .badge.sqlBadge { fill: #fff4df; stroke: #a2743d; }
      .badge.stateBadge { fill: #eef7f0; stroke: #6e8f4f; }
      .badge.errorBadge { fill: #fff0f0; stroke: #b45f5f; }
      .badge.returnBadge { fill: #fff7e8; stroke: #9b7d54; }
      .badgeText { font-family: "Comic Mono"; font-size: 12px; font-weight: 700; }
      .msg.callText, .badgeText.callText { fill: #2f6f8e; }
      .msg.sqlText, .badgeText.sqlText { fill: #855a29; }
      .msg.stateText, .badgeText.stateText { fill: #55783f; }
      .msg.errorText, .badgeText.errorText { fill: #934a4a; }
      .msg.returnText, .badgeText.returnText { fill: #7f6038; }
    </style>
    <marker id="arrowCall" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#3f7d9c"/></marker>
    <marker id="arrowSql" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#a2743d"/></marker>
    <marker id="arrowState" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6e8f4f"/></marker>
    <marker id="arrowError" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b45f5f"/></marker>
    <marker id="arrowReturn" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#9b7d54"/></marker>
  </defs>

  <rect x="24" y="24" width="1552" height="1032" rx="20" class="frame"/>
  <text x="800" y="78" text-anchor="middle" class="title">BigQuery Dry-Run Query Validation</text>
  <text x="800" y="108" text-anchor="middle" class="subtitle">Exposed SQL is generated locally, mapped to dryRun=true, and verified through a mocked BigQuery REST client.</text>

  <g id="participants">
    <rect x="60" y="150" width="170" height="68" rx="10" class="header"/>
    <text x="145" y="179" text-anchor="middle" class="participant">Workshop Test</text>
    <text x="145" y="201" text-anchor="middle" class="role">JUnit + MockK</text>

    <rect x="300" y="150" width="190" height="68" rx="10" class="header"/>
    <text x="395" y="179" text-anchor="middle" class="participant">Exposed Query</text>
    <text x="395" y="201" text-anchor="middle" class="role">read-model DSL</text>

    <rect x="560" y="150" width="170" height="68" rx="10" class="header"/>
    <text x="645" y="179" text-anchor="middle" class="participant">H2 Dialect</text>
    <text x="645" y="201" text-anchor="middle" class="role">SQL generation</text>

    <rect x="810" y="150" width="230" height="68" rx="10" class="header"/>
    <text x="925" y="179" text-anchor="middle" class="participant">BigQueryContext</text>
    <text x="925" y="201" text-anchor="middle" class="role">dry-run adapter</text>

    <rect x="1090" y="150" width="200" height="68" rx="10" class="header"/>
    <text x="1190" y="179" text-anchor="middle" class="participant">Mocked REST</text>
    <text x="1190" y="201" text-anchor="middle" class="role">Bigquery.Jobs</text>

    <rect x="1370" y="150" width="170" height="68" rx="10" class="header"/>
    <text x="1455" y="179" text-anchor="middle" class="participant">Assertions</text>
    <text x="1455" y="201" text-anchor="middle" class="role">request + errors</text>
  </g>

  <line x1="145" y1="218" x2="145" y2="928" class="lifeline"/>
  <line x1="395" y1="218" x2="395" y2="928" class="lifeline"/>
  <line x1="645" y1="218" x2="645" y2="928" class="lifeline"/>
  <line x1="925" y1="218" x2="925" y2="928" class="lifeline"/>
  <line x1="1190" y1="218" x2="1190" y2="928" class="lifeline"/>
  <line x1="1455" y1="218" x2="1455" y2="928" class="lifeline"/>

  <rect x="388" y="318" width="14" height="88" rx="6" class="activation"/>
  <rect x="918" y="382" width="14" height="528" rx="6" class="activation"/>
  <rect x="638" y="482" width="14" height="96" rx="6" class="activation"/>
  <rect x="1183" y="662" width="14" height="150" rx="6" class="activation"/>
  <rect x="1448" y="900" width="14" height="42" rx="6" class="activation"/>

  <rect x="72" y="260" width="430" height="34" rx="17" class="label callLabel pill"/>
  <circle cx="96" cy="277" r="13" class="badge callBadge"/><text x="96" y="282" text-anchor="middle" class="badgeText callText num">1</text>
  <text x="120" y="282" class="msg callText">buildRegionalRevenueQuery()</text>
  <path d="M 145 318 L 395 318" class="call"/>

  <rect x="354" y="326" width="430" height="34" rx="17" class="label callLabel pill"/>
  <circle cx="378" cy="343" r="13" class="badge callBadge"/><text x="378" y="348" text-anchor="middle" class="badgeText callText num">2</text>
  <text x="402" y="348" class="msg callText">validateQuery(query, options)</text>
  <path d="M 395 382 L 925 382" class="call"/>

  <rect x="662" y="426" width="372" height="34" rx="17" class="label sqlLabel pill"/>
  <circle cx="686" cy="443" r="13" class="badge sqlBadge"/><text x="686" y="448" text-anchor="middle" class="badgeText sqlText num">3</text>
  <text x="710" y="448" class="msg sqlText">prepare SQL from Exposed Query</text>
  <path d="M 925 482 L 645 482" class="sql"/>

  <rect x="584" y="520" width="318" height="34" rx="17" class="label returnLabel pill"/>
  <circle cx="608" cy="537" r="13" class="badge returnBadge"/><text x="608" y="542" text-anchor="middle" class="badgeText returnText num">4</text>
  <text x="632" y="542" class="msg returnText">standard SQL only</text>
  <path d="M 645 578 L 925 578" class="return"/>

  <rect x="872" y="600" width="420" height="34" rx="17" class="label stateLabel pill"/>
  <circle cx="896" cy="617" r="13" class="badge stateBadge"/><text x="896" y="622" text-anchor="middle" class="badgeText stateText num">5</text>
  <text x="920" y="622" class="msg stateText">jobs.query(dryRun=true, options)</text>
  <path d="M 925 662 L 1190 662" class="state"/>

  <rect x="790" y="690" width="728" height="248" rx="14" class="alt"/>
  <rect x="820" y="708" width="248" height="30" rx="15" fill="#f8f1e6" stroke="#a2743d" stroke-width="1.8"/>
  <text x="842" y="728" class="note">alt mocked dry-run result</text>

  <rect x="958" y="754" width="388" height="34" rx="17" class="label returnLabel pill"/>
  <circle cx="982" cy="771" r="13" class="badge returnBadge"/><text x="982" y="776" text-anchor="middle" class="badgeText returnText num">6</text>
  <text x="1006" y="776" class="msg returnText">success response or errors</text>
  <path d="M 1190 812 L 925 812" class="return"/>

  <rect x="952" y="846" width="456" height="34" rx="17" class="label errorLabel pill"/>
  <circle cx="976" cy="863" r="13" class="badge errorBadge"/><text x="976" y="868" text-anchor="middle" class="badgeText errorText num">7</text>
  <text x="1000" y="868" class="msg errorText">assert request mapping and exception path</text>
  <path d="M 925 900 L 1455 900" class="error"/>

  <rect x="98" y="972" width="1404" height="44" rx="12" fill="#ffffff" stroke="#ccd7da" stroke-width="2"/>
  <text x="118" y="1000" class="note">Default path stays local: no ADC, service-account files, tokens, endpoint overrides, network calls, or billable BigQuery execution.</text>
  <text x="800" y="1032" text-anchor="middle" class="footer">github.com/bluetape4k/exposed-workshop - 13-ecosystem-integrations/01-bigquery-dry-run</text>
</svg>
