<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 980" width="1600" height="980" role="img" aria-label="Read-through and write-through user cache sequence">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
    <marker id="seqArrow" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#4f86c6" stroke="#4f86c6" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>

    <marker id="seqArrowAmber" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#a2743d" stroke="#a2743d" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="seqArrowTeal" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2b8f88" stroke="#2b8f88" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <style>
      text { letter-spacing: 0; }
      .canvas { fill: #fbfcf8; stroke: #40545d; stroke-width: 3; }
      .title { font-family: "Architects Daughter","Comic Sans MS",cursive; font-size: 36px; fill: #23323a; }
      .subtitle,.participant-sub,.msg,.detail { font-family: "Comic Mono","Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif; fill: #324750; }
      .subtitle { font-size: 15px; }
      .header { fill: #fff; stroke-width: 2.1; filter: url(#shadow); }
      .actor { stroke: #617985; }
      .service { stroke: #617985; }
      .cache { stroke: #617985; }
      .store { stroke: #617985; }
      .participant { font-family: "Architects Daughter","Comic Sans MS",cursive; font-size: 18px; fill: #20323b; }
      .participant-sub { font-size: 11px; fill: #60717a; }
      .lifeline { fill: none; stroke: #c7d5d1; stroke-width: 1.8; stroke-dasharray: 8 8; }
      .activation { fill: #ffffff; stroke: #7a8445; stroke-width: 1.7; rx: 5; }
      .call,.return { fill: none; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#seqArrow); }
      .call { stroke: #4f86c6; marker-end: url(#seqArrow); }
      .return { stroke: #2b8f88; stroke-dasharray: 7 6; marker-end: url(#seqArrowTeal); }
      .pill { fill: #ffffff; stroke: #7a8445; stroke-width: 1.4; }
      .num { font-family: "Comic Mono","Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif; font-size: 11px; font-weight: 700; fill: #7a8445; }
      .msg { font-size: 12px; font-weight: 700; }
      .detail { font-size: 12px; fill: #60717a; }
      .band { fill: none; stroke: #8298a3; stroke-width: 1.4; stroke-dasharray: 9 8; }
    </style>
  </defs>

  <rect x="24" y="24" width="1552" height="932" rx="20" class="canvas frame"/>
  <text x="800" y="76" text-anchor="middle" class="title">Read-Through / Write-Through User Cache</text>
  <text x="800" y="106" text-anchor="middle" class="subtitle">UserController wraps reads in Exposed transactions; UserCacheRepository loads misses, warms cache entries, and writes updates through.</text>

  <rect x="52" y="138" width="160" height="62" rx="12" class="header actor"/>
  <text x="132" y="165" text-anchor="middle" class="participant">Caller / Test</text>
  <text x="132" y="184" text-anchor="middle" class="participant-sub">HTTP request or JUnit</text>

  <rect x="302" y="138" width="180" height="62" rx="12" class="header service"/>
  <text x="392" y="165" text-anchor="middle" class="participant">UserController</text>
  <text x="392" y="184" text-anchor="middle" class="participant-sub">/users endpoints</text>

  <rect x="560" y="138" width="200" height="62" rx="12" class="header service"/>
  <text x="660" y="165" text-anchor="middle" class="participant">UserCacheRepository</text>
  <text x="660" y="184" text-anchor="middle" class="participant-sub">read/write through</text>

  <rect x="838" y="138" width="176" height="62" rx="12" class="header cache"/>
  <text x="926" y="165" text-anchor="middle" class="participant">Redisson cache</text>
  <text x="926" y="184" text-anchor="middle" class="participant-sub">near cache + Redis</text>

  <rect x="1106" y="138" width="180" height="62" rx="12" class="header store"/>
  <text x="1196" y="165" text-anchor="middle" class="participant">UserTable</text>
  <text x="1196" y="184" text-anchor="middle" class="participant-sub">database rows</text>

  <rect x="1366" y="138" width="180" height="62" rx="12" class="header actor"/>
  <text x="1456" y="165" text-anchor="middle" class="participant">Verifier</text>
  <text x="1456" y="184" text-anchor="middle" class="participant-sub">direct DB assertion</text>

  <path class="lifeline" d="M 132 206 L 132 868"/>
  <path class="lifeline" d="M 392 206 L 392 868"/>
  <path class="lifeline" d="M 660 206 L 660 868"/>
  <path class="lifeline" d="M 926 206 L 926 868"/>
  <path class="lifeline" d="M 1196 206 L 1196 868"/>
  <path class="lifeline" d="M 1456 206 L 1456 868"/>

  <rect x="384" y="232" width="16" height="532" rx="5" class="activation"/>
  <rect x="652" y="312" width="16" height="572" rx="5" class="activation"/>
  <rect x="918" y="392" width="16" height="500" rx="5" class="activation"/>
  <rect x="1188" y="472" width="16" height="420" rx="5" class="activation"/>
  <rect x="1448" y="712" width="16" height="152" rx="5" class="activation"/>

  <rect x="536" y="354" width="718" height="178" rx="16" class="band"/>
  <text x="895" y="368" text-anchor="middle" class="detail">cache miss fallback warms Redisson before returning UserRecord</text>
  <rect x="536" y="584" width="718" height="178" rx="16" class="band"/>
  <text x="895" y="612" text-anchor="middle" class="detail">write-through keeps the table and cache entry aligned</text>

  <path id="m1" data-connector="m1" class="call" d="M 132 252 L 384 252"/>
  <rect x="176" y="218" width="162" height="22" rx="11" class="pill" style="stroke:#b6d3ec"/>
  <text x="194" y="233" text-anchor="middle" class="num" style="fill:#4f86c6">1</text>
  <text x="266" y="232" text-anchor="middle" class="msg">GET /users/{id}</text>

  <path id="m2" data-connector="m2" class="call" d="M 400 332 L 652 332"/>
  <rect x="414" y="298" width="234" height="22" rx="11" class="pill" style="stroke:#b6d3ec"/>
  <text x="432" y="313" text-anchor="middle" class="num" style="fill:#4f86c6">2</text>
  <text x="546" y="312" text-anchor="middle" class="msg">transaction { get(id) }</text>

  <path id="m3" data-connector="m3" class="call" d="M 668 412 L 918 412"/>
  <rect x="686" y="378" width="200" height="22" rx="11" class="pill" style="stroke:#b6d3ec"/>
  <text x="704" y="393" text-anchor="middle" class="num" style="fill:#4f86c6">3</text>
  <text x="810" y="392" text-anchor="middle" class="msg">lookup cache key</text>

  <path id="m4" data-connector="m4" class="call" d="M 668 492 L 1188 492"/>
  <rect x="740" y="458" width="303" height="22" rx="11" class="pill" style="stroke:#b6d3ec"/>
  <text x="758" y="473" text-anchor="middle" class="num" style="fill:#4f86c6">4</text>
  <text x="938" y="472" text-anchor="middle" class="msg">select row on cache miss</text>

  <path id="m5" data-connector="m5" class="call" d="M 668 572 L 918 572"/>
  <rect x="686" y="538" width="232" height="22" rx="11" class="pill" style="stroke:#b6d3ec"/>
  <text x="704" y="553" text-anchor="middle" class="num" style="fill:#4f86c6">5</text>
  <text x="816" y="552" text-anchor="middle" class="msg">store loaded UserRecord</text>

  <path id="m6" data-connector="m6" class="return" d="M 652 652 L 400 652"/>
  <rect x="440" y="618" width="182" height="22" rx="11" class="pill" style="stroke:#add7d3"/>
  <text x="458" y="633" text-anchor="middle" class="num" style="fill:#2b8f88">6</text>
  <text x="532" y="632" text-anchor="middle" class="msg">return cached record</text>

  <path id="m7" data-connector="m7" class="call" d="M 132 732 L 384 732"/>
  <rect x="176" y="698" width="147" height="22" rx="11" class="pill" style="stroke:#b6d3ec"/>
  <text x="194" y="713" text-anchor="middle" class="num" style="fill:#4f86c6">7</text>
  <text x="266" y="712" text-anchor="middle" class="msg">POST /users</text>

  <path id="m8" data-connector="m8" class="call" d="M 400 812 L 652 812"/>
  <rect x="439" y="778" width="173" height="22" rx="11" class="pill" style="stroke:#b6d3ec"/>
  <text x="458" y="793" text-anchor="middle" class="num" style="fill:#4f86c6">8</text>
  <text x="526" y="792" text-anchor="middle" class="msg">put(id, UserRecord)</text>

  <path id="m9" data-connector="m9" class="call" d="M 668 812 L 1188 812"/>
  <rect x="740" y="778" width="322" height="22" rx="11" class="pill" style="stroke:#b6d3ec"/>
  <text x="758" y="793" text-anchor="middle" class="num" style="fill:#4f86c6">9</text>
  <text x="938" y="792" text-anchor="middle" class="msg">write row through transaction</text>

  <path id="m10" data-connector="m10" class="call" d="M 668 872 L 918 872"/>
  <rect x="691" y="838" width="208" height="22" rx="11" class="pill" style="stroke:#b6d3ec"/>
  <text x="709" y="853" text-anchor="middle" class="num" style="fill:#4f86c6">10</text>
  <text x="812" y="852" text-anchor="middle" class="msg">refresh cache entry</text>

  <path id="m11" data-connector="m11" class="call" d="M 1456 852 L 1204 852"/>
  <rect x="1180" y="818" width="255" height="22" rx="11" class="pill" style="stroke:#b6d3ec"/>
  <text x="1421" y="833" text-anchor="middle" class="num" style="fill:#4f86c6">11</text>
  <text x="1308" y="832" text-anchor="middle" class="msg">findByIdFromDb verifies update</text>
</svg>
