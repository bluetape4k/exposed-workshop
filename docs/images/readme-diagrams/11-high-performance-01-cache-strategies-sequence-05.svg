<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 740" width="1240" height="740" role="img" aria-label="Cache Strategies (01-cache-strategies)">
  <defs>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
    <marker viewBox="0 0 10 10" id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b"/></marker>
    <marker viewBox="0 0 10 10" id="inherit" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b"/></marker>
    <style>
  .canvas{fill:#f6f9fc}
  .frame{fill:#fff;stroke:#d7e2ec;stroke-width:1.5}
  .panel{fill:#f8fafc;stroke:#d7e2ec;stroke-width:1.2}
  .card{stroke-width:1.7;filter:url(#shadow)}
  .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:32px;fill:#1e293b}
  .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;fill:#536476}
  .panelTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:12px;letter-spacing:.08em;fill:#8ca2b4}
  .label{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:18px;fill:#1e293b}
  .smallLabel{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:15px;fill:#1e293b}
  .detail{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;fill:#536476}
  .tiny{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:10px;fill:#64748b}
  .arrow{fill:none;stroke:#64748b;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .softArrow{fill:none;stroke:#8ca2b4;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:5 5}
  .inherit{fill:none;stroke:#64748b;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .divider{stroke:#cbd5e1;stroke-width:1.2;stroke-dasharray:6 6}
.altRegion{fill:#f8fafc;fill-opacity:.055;stroke:#8ca2b4;stroke-opacity:.28;stroke-width:1.2;stroke-dasharray:8 7}
</style>
  </defs>
  <rect width="1240" height="740" class="canvas"/>
  <rect x="20" y="20" width="1200" height="700" rx="16" class="frame"/>
<text x="48" y="58" class="title">Cache Strategies (01-cache-strategies)</text>
  <text x="48" y="80" class="subtitle">Source-derived sequence · request path through implementation roles</text>
<rect x="12" y="118" width="156" height="54" rx="10" fill="#eef5fa" stroke="#4f86c6" class="card"/>
<text x="90" y="151" class="smallLabel participant" text-anchor="middle">Client</text>

<path d="M90,182 L90,676" class="softArrow lifeline"/>
<rect x="84" y="212" width="12" height="120" rx="4" class="activation"/>
<rect x="224" y="118" width="156" height="54" rx="10" fill="#f3eee8" stroke="#8a6f55" class="card"/>
<text x="302" y="141" class="smallLabel participant" text-anchor="middle">Index</text>
<text x="302" y="159" class="smallLabel participant" text-anchor="middle">Controller</text>

<path d="M302,182 L302,676" class="softArrow lifeline"/>
<rect x="296" y="212" width="12" height="120" rx="4" class="activation"/>
<rect x="436" y="118" width="156" height="54" rx="10" fill="#f1f6ec" stroke="#5f7f3f" class="card"/>
<text x="514" y="141" class="smallLabel participant" text-anchor="middle">Cache</text>
<text x="514" y="159" class="smallLabel participant" text-anchor="middle">Strategies...</text>

<path d="M514,182 L514,676" class="softArrow lifeline"/>
<rect x="508" y="212" width="12" height="120" rx="4" class="activation"/>
<rect x="648" y="118" width="156" height="54" rx="10" fill="#f5eee4" stroke="#9b5f38" class="card"/>
<text x="726" y="141" class="smallLabel participant" text-anchor="middle">Service</text>
<text x="726" y="159" class="smallLabel participant" text-anchor="middle">Boundary</text>

<path d="M726,182 L726,676" class="softArrow lifeline"/>
<rect x="720" y="212" width="12" height="120" rx="4" class="activation"/>
<rect x="860" y="118" width="156" height="54" rx="10" fill="#f5eef2" stroke="#a85f7f" class="card"/>
<text x="938" y="141" class="smallLabel participant" text-anchor="middle">User Cache</text>
<text x="938" y="159" class="smallLabel participant" text-anchor="middle">Repository</text>

<path d="M938,182 L938,676" class="softArrow lifeline"/>
<rect x="1072" y="118" width="156" height="54" rx="10" fill="#eef7f6" stroke="#4f8f8b" class="card"/>
<text x="1150" y="141" class="smallLabel participant" text-anchor="middle">User</text>
<text x="1150" y="159" class="smallLabel participant" text-anchor="middle">Credentials...</text>

<path d="M1150,182 L1150,676" class="softArrow lifeline"/>
<path d="M108,220 L284,220" class="arrow"/>
<rect x="54" y="190" width="284" height="24" rx="8" fill="#fff" stroke="#d7e2ec" class="messageBand pill"/>
<text x="69" y="207" class="num" text-anchor="middle">1</text>
<text x="196" y="207" class="tiny labelText" text-anchor="middle">index()</text>
<path d="M320,274 L496,274" class="arrow"/>
<rect x="266" y="244" width="284" height="24" rx="8" fill="#fff" stroke="#d7e2ec" class="messageBand pill"/>
<text x="281" y="261" class="num" text-anchor="middle">2</text>
<text x="408" y="261" class="tiny labelText" text-anchor="middle">validate input and resolve context</text>
<path d="M532,328 L708,328" class="arrow"/>
<rect x="478" y="298" width="284" height="24" rx="8" fill="#fff" stroke="#d7e2ec" class="messageBand pill"/>
<text x="493" y="315" class="num" text-anchor="middle">3</text>
<text x="620" y="315" class="tiny labelText" text-anchor="middle">call Cache Strategies (01-cache-strategies)</text>
<path d="M744,382 L920,382" class="arrow"/>
<rect x="690" y="352" width="284" height="24" rx="8" fill="#fff" stroke="#d7e2ec" class="messageBand pill"/>
<text x="705" y="369" class="num" text-anchor="middle">4</text>
<text x="832" y="369" class="tiny labelText" text-anchor="middle">execute use case boundary</text>
<path d="M956,436 L1132,436" class="arrow"/>
<rect x="902" y="406" width="284" height="24" rx="8" fill="#fff" stroke="#d7e2ec" class="messageBand pill"/>
<text x="917" y="423" class="num" text-anchor="middle">5</text>
<text x="1044" y="423" class="tiny labelText" text-anchor="middle">delegate to UserCacheRepository</text>
<path d="M956,490 L1132,490" class="arrow"/>
<rect x="902" y="460" width="284" height="24" rx="8" fill="#fff" stroke="#d7e2ec" class="messageBand pill"/>
<text x="917" y="477" class="num" text-anchor="middle">6</text>
<text x="1044" y="477" class="tiny labelText" text-anchor="middle">run Exposed transaction</text>
<path d="M956,544 L1132,544" class="arrow"/>
<rect x="902" y="514" width="284" height="24" rx="8" fill="#fff" stroke="#d7e2ec" class="messageBand pill"/>
<text x="917" y="531" class="num" text-anchor="middle">7</text>
<text x="1044" y="531" class="tiny labelText" text-anchor="middle">map rows to response model</text>
<path d="M956,598 L1132,598" class="arrow"/>
<rect x="902" y="568" width="284" height="24" rx="8" fill="#fff" stroke="#d7e2ec" class="messageBand pill"/>
<text x="917" y="585" class="num" text-anchor="middle">8</text>
<text x="1044" y="585" class="tiny labelText" text-anchor="middle">return HTTP response</text>
<rect class="altRegion" x="224" y="336" width="1056" height="190" rx="18"/><text class="small" x="246" y="365">alt: cache miss falls back to DB, cache hit returns directly</text>
</svg>
