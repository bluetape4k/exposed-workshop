<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 896" width="1600" height="896" role="img" aria-label="Routing datasource class structure">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.13"/>
    </filter>
    <marker id="inheritHead" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="16" viewBox="0 0 18 16" refX="17" refY="8" orient="auto" data-role="uml-hollow" data-tip-direction="positive-x">
      <path d="M 1 1 L 17 8 L 1 15 Z" fill="#fbfcf8" stroke="#5f7f89" stroke-width="1.8" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="relArrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" viewBox="0 0 10 10" refX="9" refY="5" orient="auto" data-role="secondary" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#8fa1aa" stroke="#8fa1aa" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <style>
      text { letter-spacing: 0; }
      .canvas { fill: #fbfcf8; stroke: #3f515a; stroke-width: 3; }
      .title { font-family: "Architects Daughter"; font-size: 36px; fill: #23323a; }
      .subtitle,.small,.detail,.tag { font-family: "Comic Mono"; fill: #516670; }
      .subtitle { font-size: 15px; }
      .card { fill: #ffffff; stroke-width: 2.1; filter: url(#shadow); }
      .base { stroke: #5f7f89; }
      .route { stroke: #7b6bb4; }
      .web { stroke: #5d948b; }
      .config { stroke: #ac7a34; }
      .store { stroke: #8fa1aa; }
      .label { font-family: "Architects Daughter"; font-size: 19px; fill: #20323b; }
      .small { font-size: 12px; }
      .detail { font-size: 12px; fill: #60717a; }
      .tag { font-size: 11px; font-weight: 700; fill: #6d5fa8; }
      .inherit { fill: none; stroke: #5f7f89; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#inheritHead); }
      .rel { fill: none; stroke: #8fa1aa; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 8 7; marker-end: url(#relArrow); }
      .band { fill: #f7faf6; stroke: #d9e2dc; stroke-width: 1.5; }
    </style>
  </defs>

  <rect x="24" y="24" width="1552" height="848" rx="20" class="canvas frame"/>
  <text x="800" y="76" text-anchor="middle" class="title">RoutingDataSource Class Structure</text>
  <text x="800" y="106" text-anchor="middle" class="subtitle">Routing is split into resolver, registry, delegating DataSource, request tenant context, and Exposed marker table contracts.</text>

  <rect x="66" y="160" width="250" height="88" rx="12" class="card base"/>
  <text x="191" y="195" text-anchor="middle" class="label">AbstractDataSource</text>
  <text x="191" y="218" text-anchor="middle" class="detail">Spring JDBC base class</text>

  <rect x="370" y="160" width="250" height="88" rx="12" class="card base"/>
  <text x="495" y="195" text-anchor="middle" class="label">RoutingKeyResolver</text>
  <text x="495" y="218" text-anchor="middle" class="detail">currentLookupKey()</text>

  <rect x="674" y="160" width="250" height="88" rx="12" class="card base"/>
  <text x="799" y="195" text-anchor="middle" class="label">DataSourceRegistry</text>
  <text x="799" y="218" text-anchor="middle" class="detail">register/get/keys/close</text>

  <rect x="978" y="160" width="250" height="88" rx="12" class="card base"/>
  <text x="1103" y="195" text-anchor="middle" class="label">OncePerRequestFilter</text>
  <text x="1103" y="218" text-anchor="middle" class="detail">request scoped tenant bind</text>

  <rect x="1282" y="160" width="250" height="88" rx="12" class="card base"/>
  <text x="1407" y="195" text-anchor="middle" class="label">Table</text>
  <text x="1407" y="218" text-anchor="middle" class="detail">Exposed table contract</text>

  <rect x="66" y="390" width="250" height="118" rx="12" class="card route"/>
  <text x="191" y="426" text-anchor="middle" class="label">DynamicRouting</text>
  <text x="191" y="450" text-anchor="middle" class="label">DataSource</text>
  <text x="191" y="474" text-anchor="middle" class="detail">registry + resolver delegate</text>

  <rect x="370" y="390" width="250" height="118" rx="12" class="card route"/>
  <text x="495" y="426" text-anchor="middle" class="label">ContextAware</text>
  <text x="495" y="450" text-anchor="middle" class="label">RoutingKeyResolver</text>
  <text x="495" y="474" text-anchor="middle" class="detail">tenant + readOnly -> key</text>

  <rect x="674" y="390" width="250" height="118" rx="12" class="card route"/>
  <text x="799" y="426" text-anchor="middle" class="label">InMemory</text>
  <text x="799" y="450" text-anchor="middle" class="label">DataSourceRegistry</text>
  <text x="799" y="474" text-anchor="middle" class="detail">owns HikariDataSource lifecycle</text>

  <rect x="978" y="390" width="250" height="118" rx="12" class="card web"/>
  <text x="1103" y="426" text-anchor="middle" class="label">TenantHeaderFilter</text>
  <text x="1103" y="450" text-anchor="middle" class="detail">X-Tenant-Id -> TenantContext</text>
  <text x="1103" y="474" text-anchor="middle" class="detail">clears after request</text>

  <rect x="1282" y="390" width="250" height="118" rx="12" class="card store"/>
  <text x="1407" y="426" text-anchor="middle" class="label">MarkerTable</text>
  <text x="1407" y="450" text-anchor="middle" class="detail">routing marker rows</text>
  <text x="1407" y="474" text-anchor="middle" class="detail">created by initializer</text>

  <path id="i1" data-connector="i1" class="inherit" d="M 191 390 L 191 248"/>
  <path id="i2" data-connector="i2" class="inherit" d="M 495 390 L 495 248"/>
  <path id="i3" data-connector="i3" class="inherit" d="M 799 390 L 799 248"/>
  <path id="i4" data-connector="i4" class="inherit" d="M 1103 390 L 1103 248"/>
  <path id="i5" data-connector="i5" class="inherit" d="M 1407 390 L 1407 248"/>

  <rect x="132" y="650" width="300" height="92" rx="12" class="card config"/>
  <text x="282" y="684" text-anchor="middle" class="label">RoutingDataSourceConfig</text>
  <text x="282" y="708" text-anchor="middle" class="detail">builds registry and primary router</text>

  <rect x="510" y="650" width="300" height="92" rx="12" class="card config"/>
  <text x="660" y="684" text-anchor="middle" class="label">RoutingProperties</text>
  <text x="660" y="708" text-anchor="middle" class="detail">default tenant and tenant map</text>

  <rect x="888" y="650" width="300" height="92" rx="12" class="card config"/>
  <text x="1038" y="684" text-anchor="middle" class="label">TenantContext</text>
  <text x="1038" y="708" text-anchor="middle" class="detail">ThreadLocal current tenant</text>

  <rect x="1266" y="650" width="300" height="92" rx="12" class="card config"/>
  <text x="1416" y="684" text-anchor="middle" class="label">RoutingMarkerInitializer</text>
  <text x="1416" y="708" text-anchor="middle" class="detail">prepares marker rows per DB</text>

  <path id="r1" data-connector="r1" class="rel" d="M 316 450 L 370 450"/>
  <path id="r2" data-connector="r2" class="rel" d="M 191 508 L 191 548 Q 191 568 211 568 L 779 568 Q 799 568 799 548 L 799 508"/>
  <path id="r3" data-connector="r3" class="rel" d="M 1103 508 L 1103 650"/>

  <rect x="320" y="790" width="960" height="54" rx="12" class="band"/>
  <text x="800" y="823" text-anchor="middle" class="small">DynamicRoutingDataSource never owns target pools directly; the registry owns close semantics and missing-key failure behavior.</text>
</svg>
