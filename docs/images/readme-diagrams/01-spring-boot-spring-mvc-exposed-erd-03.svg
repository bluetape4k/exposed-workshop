<g class="cardinality" data-cardinality="1 : N"><rect class="cardinalityBox" x="869.5" y="494.5" width="74" height="22"/><text class="cardinalityLabel" x="906.5" y="510.5" text-anchor="middle">1 : N</text></g>
<g class="cardinality" data-cardinality="1 : N"><rect class="cardinalityBox" x="1163.0" y="478.5" width="74" height="22"/><text class="cardinalityLabel" x="1200.0" y="494.5" text-anchor="middle">1 : N</text></g>
