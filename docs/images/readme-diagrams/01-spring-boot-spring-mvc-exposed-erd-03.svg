<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1460 860" width="1460" height="860" role="img" aria-label="Spring MVC Domain Model">
<defs>

<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/></filter>
<style>
.canvas{fill:#f6f9fc}.frame{fill:#fff;stroke:#d7e2ec;stroke-width:1.5}
.title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:32px;fill:#1e293b}
.subtitle,.detail{font-family:"Comic Mono","Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;fill:#536476}
.subtitle{font-size:13px}.detail{font-size:12px}.tiny{font-family:"Comic Mono","Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:10px;fill:#64748b}
.label{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:17px;fill:#1e293b}
.panelTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:12px;letter-spacing:.08em;fill:#94a3b8}
.card{stroke-width:1.7;filter:url(#shadow)}.panel{fill:#f8fafc;stroke:#d7e2ec;stroke-width:1.2}
.arrow{fill:none;stroke:#64748b;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.softArrow{fill:none;stroke:#94a3b8;stroke-width:1.35;stroke-dasharray:5 5;stroke-linecap:round;stroke-linejoin:round}
.movieMap{fill:none;stroke:#16a34a;stroke-width:1.7;stroke-dasharray:5 5;stroke-linecap:round;stroke-linejoin:round}
.actorMap{fill:none;stroke:#7c3aed;stroke-width:1.7;stroke-dasharray:5 5;stroke-linecap:round;stroke-linejoin:round}
.lifeline{fill:none;stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:5 5;stroke-linecap:round;stroke-linejoin:round}
.inherit{fill:none;stroke:#475569;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.inheritHead{fill:#fff;stroke:#475569;stroke-width:1.8;stroke-linejoin:round}

  .cardinalityBox{fill:#ffffff;stroke:#94a3b8;stroke-width:1;rx:7;opacity:.94}
  .cardinalityLabel{font-family:"Comic Mono", "SFMono-Regular", monospace;font-size:14px;font-weight:700;fill:#334155}
.erdRelation{fill:none;stroke:#64748b;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:7 6}
</style>
</defs>
<rect width="1460" height="860" class="canvas"/>
<rect x="20" y="20" width="1420" height="820" rx="16" class="frame"/>
<text x="48" y="58" class="title">Spring MVC Domain Model</text>
<text x="48" y="80" class="subtitle">Tables, DAO entities, and DTO records used by Movie and Actor APIs</text>
<rect x="58" y="120" width="580" height="250" rx="12" class="panel"/><text x="348" y="112" class="panelTitle" text-anchor="middle">PERSISTENCE TABLES</text>
<rect x="86" y="160" width="230" height="130" rx="12" fill="#fff" stroke="#3b82f6" class="card"/>
<path d="M86,200 L86,172 Q86,160 98,160 L304,160 Q316,160 316,172 L316,200 Z" fill="#dbeafe"/>
<text x="201" y="187" class="label" text-anchor="middle">MovieTable</text>
<text x="104" y="226" class="tiny">id PK</text>
<text x="104" y="243" class="tiny">name</text>
<text x="104" y="260" class="tiny">producerName</text>
<text x="104" y="277" class="tiny">releaseDate</text>
<rect x="370" y="160" width="230" height="130" rx="12" fill="#fff" stroke="#7c3aed" class="card"/>
<path d="M370,200 L370,172 Q370,160 382,160 L588,160 Q600,160 600,172 L600,200 Z" fill="#ede9fe"/>
<text x="485" y="187" class="label" text-anchor="middle">ActorTable</text>
<text x="388" y="226" class="tiny">id PK</text>
<text x="388" y="243" class="tiny">firstName</text>
<text x="388" y="260" class="tiny">lastName</text>
<text x="388" y="277" class="tiny">birthday</text>
<rect x="240" y="390" width="250" height="128" rx="12" fill="#fff" stroke="#16a34a" class="card"/>
<path d="M240,430 L240,402 Q240,390 252,390 L478,390 Q490,390 490,402 L490,430 Z" fill="#dcfce7"/>
<text x="365" y="417" class="label" text-anchor="middle">ActorInMovieTable</text>
<text x="258" y="456" class="tiny">movieId FK</text>
<text x="258" y="473" class="tiny">actorId FK</text>
<text x="258" y="490" class="tiny">composite PK</text>
<rect x="720" y="120" width="660" height="300" rx="12" class="panel"/><text x="1050" y="112" class="panelTitle" text-anchor="middle">DAO ENTITIES</text>
<rect x="934" y="146" width="230" height="90" rx="4" fill="#fff" stroke="#64748b" class="card"/>
<path d="M934,192 L934,150 Q934,146 938,146 L1160,146 Q1164,146 1164,150 L1164,192 Z" fill="#e2e8f0"/>
<text x="1049" y="164" class="tiny" text-anchor="middle">&lt;&lt;superclass&gt;&gt;</text>
<text x="1049" y="182" class="label" text-anchor="middle">LongEntity</text>
<path d="M934,192 H1164" stroke="#64748b" stroke-width="1.1"/>
<text x="948" y="210" class="tiny">id: EntityID&lt;Long&gt;</text>
<rect x="780" y="280" width="240" height="116" rx="4" fill="#fff" stroke="#ea580c" class="card"/>
<path d="M780,326 L780,284 Q780,280 784,280 L1016,280 Q1020,280 1020,284 L1020,326 Z" fill="#ffedd5"/>
<text x="900" y="298" class="tiny" text-anchor="middle">&lt;&lt;DAO&gt;&gt;</text>
<text x="900" y="316" class="label" text-anchor="middle">MovieEntity</text>
<path d="M780,326 H1020" stroke="#ea580c" stroke-width="1.1"/>
<text x="794" y="344" class="tiny">name</text>
<text x="794" y="362" class="tiny">producerName</text>
<text x="794" y="380" class="tiny">actors</text>
<rect x="1080" y="280" width="240" height="116" rx="4" fill="#fff" stroke="#db2777" class="card"/>
<path d="M1080,326 L1080,284 Q1080,280 1084,280 L1316,280 Q1320,280 1320,284 L1320,326 Z" fill="#fce7f3"/>
<text x="1200" y="298" class="tiny" text-anchor="middle">&lt;&lt;DAO&gt;&gt;</text>
<text x="1200" y="316" class="label" text-anchor="middle">ActorEntity</text>
