<text x="1094" y="344" class="tiny">firstName</text>
<text x="1094" y="362" class="tiny">lastName</text>
<text x="1094" y="380" class="tiny">movies</text>
<path d="M900 280 V266 Q900 264 902 264 H998 Q1000 264 1000 262 V252" class="inherit"/>
<path d="M1000,236 L988,252 L1012,252 Z" class="inheritHead" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
<path d="M1200 280 V266 Q1200 264 1198 264 H1102 Q1100 264 1100 262 V252" class="inherit"/>
<path d="M1100,236 L1088,252 L1112,252 Z" class="inheritHead" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
<rect x="90" y="550" width="1280" height="160" rx="12" class="panel"/><text x="730" y="542" class="panelTitle" text-anchor="middle">DTO RECORDS</text>
<rect x="130" y="580" width="190" height="108" rx="4" fill="#fff" stroke="#3b82f6" class="card"/>
<path d="M130,626 L130,584 Q130,580 134,580 L316,580 Q320,580 320,584 L320,626 Z" fill="#dbeafe"/>
<text x="225" y="598" class="tiny" text-anchor="middle">&lt;&lt;record&gt;&gt;</text>
<text x="225" y="616" class="label" text-anchor="middle">MovieRecord</text>
<path d="M130,626 H320" stroke="#3b82f6" stroke-width="1.1"/>
<text x="144" y="644" class="tiny">id</text>
<text x="144" y="659" class="tiny">name</text>
<text x="144" y="674" class="tiny">producerName</text>
<rect x="350" y="580" width="230" height="108" rx="4" fill="#fff" stroke="#d97706" class="card"/>
<path d="M350,626 L350,584 Q350,580 354,580 L576,580 Q580,580 580,584 L580,626 Z" fill="#fef3c7"/>
<text x="465" y="598" class="tiny" text-anchor="middle">&lt;&lt;record&gt;&gt;</text>
<text x="465" y="616" class="label" text-anchor="middle">MovieActorCountRecord</text>
<path d="M350,626 H580" stroke="#d97706" stroke-width="1.1"/>
<text x="364" y="644" class="tiny">movieName</text>
<text x="364" y="659" class="tiny">actorCount</text>
<rect x="610" y="580" width="220" height="108" rx="4" fill="#fff" stroke="#0f766e" class="card"/>
<path d="M610,640 L610,584 Q610,580 614,580 L826,580 Q830,580 830,584 L830,640 Z" fill="#ccfbf1"/>
<text x="720" y="598" class="tiny" text-anchor="middle">&lt;&lt;record&gt;&gt;</text>
<text x="720" y="616" class="label" text-anchor="middle">MovieWithProducing</text>
<text x="720" y="633" class="label" text-anchor="middle">ActorRecord</text>
<path d="M610,640 H830" stroke="#0f766e" stroke-width="1.1"/>
<text x="624" y="658" class="tiny">movieName</text>
<text x="624" y="673" class="tiny">producerActorName</text>
<rect x="860" y="580" width="260" height="108" rx="4" fill="#fff" stroke="#16a34a" class="card"/>
<path d="M860,626 L860,584 Q860,580 864,580 L1116,580 Q1120,580 1120,584 L1120,626 Z" fill="#dcfce7"/>
<text x="990" y="598" class="tiny" text-anchor="middle">&lt;&lt;record&gt;&gt;</text>
<text x="990" y="616" class="label" text-anchor="middle">MovieWithActorRecord</text>
<path d="M860,626 H1120" stroke="#16a34a" stroke-width="1.1"/>
<text x="874" y="644" class="tiny">movie</text>
<text x="874" y="659" class="tiny">actors: List&lt;ActorRecord&gt;</text>
<rect x="1150" y="580" width="190" height="108" rx="4" fill="#fff" stroke="#7c3aed" class="card"/>
<path d="M1150,626 L1150,584 Q1150,580 1154,580 L1336,580 Q1340,580 1340,584 L1340,626 Z" fill="#ede9fe"/>
<text x="1245" y="598" class="tiny" text-anchor="middle">&lt;&lt;record&gt;&gt;</text>
<text x="1245" y="616" class="label" text-anchor="middle">ActorRecord</text>
<path d="M1150,626 H1340" stroke="#7c3aed" stroke-width="1.1"/>
<text x="1164" y="644" class="tiny">id</text>
<text x="1164" y="659" class="tiny">firstName</text>
<text x="1164" y="674" class="tiny">lastName</text>
<path d="M365 390 V352 Q365 340 353 340 H213 Q201 340 201 328 V290" class="softArrow arrow"/>
<rect x="229" y="326" width="108" height="21" rx="8" fill="#fff" stroke="#d7e2ec"/>
<text x="283" y="341" class="tiny" text-anchor="middle">movieId</text>
<path d="M365 390 V352 Q365 340 377 340 H473 Q485 340 485 328 V290" class="softArrow arrow"/>
<rect x="371" y="326" width="108" height="21" rx="8" fill="#fff" stroke="#d7e2ec"/>
<text x="425" y="341" class="tiny" text-anchor="middle">actorId</text>
<path d="M900 396 V520 Q900 532 912 532 H978 Q990 532 990 544 V580" class="movieMap erdRelation"/>
<path d="M1200 396 V520 Q1200 532 1212 532 H1233 Q1245 532 1245 544 V580" class="actorMap erdRelation"/>
<rect x="180" y="760" width="1100" height="48" rx="10" fill="#ecfdf5" stroke="#86efac" stroke-width="1.3"/>
<text x="730" y="790" class="detail" text-anchor="middle">DAO entities model relationships for eager loading; controllers return immutable record DTOs, not Exposed entities.</text>

