<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 610" width="1040" height="610" role="img" aria-label="Shared Movie/Actor Schema">
<defs>

<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/></filter>
<marker id="arrow" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b"/></marker>
<marker id="arrowSoft" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#94a3b8"/></marker>
<marker id="arrowGreen" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#16a34a"/></marker>
<marker id="arrowPurple" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7c3aed"/></marker>
<marker id="inherit" viewBox="0 0 18 16" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b"/></marker>
<style>
.canvas{fill:#f6f9fc}.frame{fill:#fff;stroke:#d7e2ec;stroke-width:1.5}
.title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:32px;fill:#1e293b}
.subtitle,.detail{font-family:"Comic Mono","Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;fill:#536476}
.subtitle{font-size:13px}.detail{font-size:12px}.tiny{font-family:"Comic Mono","Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:10px;fill:#64748b}
.label{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:17px;fill:#1e293b}
.panelTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:12px;letter-spacing:.08em;fill:#94a3b8}
.card{stroke-width:1.7;filter:url(#shadow)}.panel{fill:#f8fafc;stroke:#d7e2ec;stroke-width:1.2}
.arrow{fill:none;stroke:#64748b;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
.softArrow{fill:none;stroke:#94a3b8;stroke-width:1.35;stroke-dasharray:5 5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowSoft)}
.movieMap{fill:none;stroke:#16a34a;stroke-width:1.7;stroke-dasharray:5 5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowGreen)}
.actorMap{fill:none;stroke:#7c3aed;stroke-width:1.7;stroke-dasharray:5 5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowPurple)}
.lifeline{fill:none;stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:5 5;stroke-linecap:round;stroke-linejoin:round}
.inherit{fill:none;stroke:#475569;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.inheritHead{fill:#fff;stroke:#475569;stroke-width:1.8;stroke-linejoin:round}
</style>
</defs>
<rect width="1040" height="610" class="canvas"/>
<rect x="20" y="20" width="1000" height="570" rx="16" class="frame"/>
<text x="48" y="58" class="title">Shared Movie/Actor Schema</text>
<text x="48" y="80" class="subtitle">Exposed table objects shared by Spring MVC and WebFlux examples</text>
<rect x="96" y="154" width="278" height="170" rx="12" fill="#fff" stroke="#3b82f6" class="card"/>
<path d="M96,194 L96,166 Q96,154 108,154 L362,154 Q374,154 374,166 L374,194 Z" fill="#dbeafe"/>
<text x="235" y="181" class="label" text-anchor="middle">MovieTable</text>
<text x="114" y="220" class="tiny">id BIGSERIAL PK</text>
<text x="114" y="237" class="tiny">name varchar(255)</text>
<text x="114" y="254" class="tiny">producer_name varchar(255)</text>
<text x="114" y="271" class="tiny">release_date timestamp</text>
<rect x="666" y="154" width="278" height="170" rx="12" fill="#fff" stroke="#7c3aed" class="card"/>
<path d="M666,194 L666,166 Q666,154 678,154 L932,154 Q944,154 944,166 L944,194 Z" fill="#ede9fe"/>
<text x="805" y="181" class="label" text-anchor="middle">ActorTable</text>
<text x="684" y="220" class="tiny">id BIGSERIAL PK</text>
<text x="684" y="237" class="tiny">first_name varchar(255)</text>
<text x="684" y="254" class="tiny">last_name varchar(255)</text>
<text x="684" y="271" class="tiny">birthday date nullable</text>
<rect x="382" y="374" width="278" height="170" rx="12" fill="#fff" stroke="#16a34a" class="card"/>
<path d="M382,414 L382,386 Q382,374 394,374 L648,374 Q660,374 660,386 L660,414 Z" fill="#dcfce7"/>
<text x="521" y="401" class="label" text-anchor="middle">ActorInMovieTable</text>
<text x="400" y="440" class="tiny">movie_id FK -&gt; MovieTable</text>
<text x="400" y="457" class="tiny">actor_id FK -&gt; ActorTable</text>
<text x="400" y="474" class="tiny">primary key(movie_id, actor_id)</text>
<text x="400" y="491" class="tiny">ON DELETE CASCADE</text>
<path d="M521 374 V354 Q521 342 509 342 H247 Q235 342 235 332 V324" class="softArrow arrow"/>
<rect x="324" y="327" width="108" height="21" rx="8" fill="#fff" stroke="#d7e2ec"/>
<text x="378" y="342" class="tiny" text-anchor="middle">N:1 movie_id</text>
<path d="M521 374 V354 Q521 342 533 342 H793 Q805 342 805 332 V324" class="softArrow arrow"/>
<rect x="609" y="327" width="108" height="21" rx="8" fill="#fff" stroke="#d7e2ec"/>
<text x="663" y="342" class="tiny" text-anchor="middle">N:1 actor_id</text>
<rect x="156" y="514" width="728" height="48" rx="10" fill="#ecfdf5" stroke="#86efac" stroke-width="1.3"/>
<text x="520" y="544" class="detail" text-anchor="middle">Bridge table models the many-to-many cast relation; FK arrows point from child table to parent table.</text>
</svg>
