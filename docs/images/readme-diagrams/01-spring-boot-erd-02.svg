<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 720" width="1040" height="720" role="img" aria-label="Shared Movie/Actor Schema">
<defs>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/></filter>
<marker id="arrow" markerWidth="10" markerHeight="10" viewBox="0 0 10 10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b" stroke="#64748b" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
<marker id="arrowSoft" markerWidth="10" markerHeight="10" viewBox="0 0 10 10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#94a3b8" stroke="#94a3b8" stroke-dasharray="none" style="stroke-dasharray:none!important" stroke-width="0"/></marker>
<marker id="arrowGreen" markerWidth="10" markerHeight="10" viewBox="0 0 10 10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#16a34a" stroke="#16a34a" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
<marker id="arrowPurple" markerWidth="10" markerHeight="10" viewBox="0 0 10 10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7c3aed" stroke="#7c3aed" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
<marker id="inherit" markerWidth="18" markerHeight="16" viewBox="0 0 18 16" refX="17" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 17 8 L 1 15 Z" fill="#fff" stroke="#475569" stroke-width="1.5" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
<style>
.canvas{fill:#f6f9fc}.frame{fill:#fff;stroke:#d7e2ec;stroke-width:1.5}
.title{font-family:"Architects Daughter";font-size:32px;fill:#1e293b}
.subtitle,.detail{font-family:"Comic Mono";fill:#536476}
.subtitle{font-size:13px}.detail{font-size:12px}.tiny{font-family:"Comic Mono";font-size:10px;fill:#64748b}
.cardinality{font-family:"Comic Mono";font-size:13px;font-weight:700;fill:#334155}
.label{font-family:"Architects Daughter";font-size:17px;fill:#1e293b}
.panelTitle{font-family:"Architects Daughter";font-size:12px;letter-spacing:.08em;fill:#94a3b8}
.card{stroke-width:1.7;filter:url(#shadow)}.panel{fill:#f8fafc;stroke:#d7e2ec;stroke-width:1.2}
.arrow{fill:none;stroke:#64748b;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
.softArrow{fill:none;stroke:#94a3b8;stroke-width:1.35;stroke-dasharray:5 5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowSoft)}
.movieMap{fill:none;stroke:#16a34a;stroke-width:1.7;stroke-dasharray:5 5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowGreen)}
.actorMap{fill:none;stroke:#7c3aed;stroke-width:1.7;stroke-dasharray:5 5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowPurple)}
.lifeline{fill:none;stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:5 5;stroke-linecap:round;stroke-linejoin:round}
.inherit{fill:none;stroke:#475569;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.inheritHead{fill:#fff;stroke:#475569;stroke-width:1.8;stroke-linejoin:round}
</style>
</defs>
<rect width="1040" height="720" class="canvas"/>
<rect x="20" y="20" width="1000" height="680" rx="16" class="frame"/>
<text x="48" y="58" class="title">Shared Movie/Actor Schema</text>
<text x="48" y="80" class="subtitle">Exposed table objects shared by Spring MVC and WebFlux examples</text>
<rect x="96" y="154" width="278" height="170" rx="12" fill="#fff" stroke="#3b82f6" class="card"/>
<path d="M96,194 L96,166 Q96,154 108,154 L362,154 Q374,154 374,166 L374,194 Z" fill="#dbeafe"/>
<text x="235" y="181" class="label" text-anchor="middle">MovieTable</text>
<text x="114" y="220" class="tiny">id BIGSERIAL PK</text>
<text x="114" y="237" class="tiny">name varchar(255)</text>
<text x="114" y="254" class="tiny">producer_name varchar(255)</text>
<text x="114" y="271" class="tiny">release_date timestamp</text>
<rect x="666" y="154" width="278" height="170" rx="12" fill="#fff" stroke="#7c3aed" class="card"/>
<path d="M666,194 L666,166 Q666,154 678,154 L932,154 Q944,154 944,166 L944,194 Z" fill="#ede9fe"/>
<text x="805" y="181" class="label" text-anchor="middle">ActorTable</text>
<text x="684" y="220" class="tiny">id BIGSERIAL PK</text>
<text x="684" y="237" class="tiny">first_name varchar(255)</text>
<text x="684" y="254" class="tiny">last_name varchar(255)</text>
<text x="684" y="271" class="tiny">birthday date nullable</text>
<rect x="382" y="420" width="278" height="170" rx="12" fill="#fff" stroke="#16a34a" class="card"/>
<path d="M382,460 L382,432 Q382,420 394,420 L648,420 Q660,420 660,432 L660,460 Z" fill="#dcfce7"/>
<text x="521" y="447" class="label" text-anchor="middle">ActorInMovieTable</text>
<text x="400" y="486" class="tiny">movie_id FK -&gt; MovieTable</text>
<text x="400" y="503" class="tiny">actor_id FK -&gt; ActorTable</text>
<text x="400" y="520" class="tiny">primary key(movie_id, actor_id)</text>
<text x="400" y="537" class="tiny">ON DELETE CASCADE</text>
<path d="M482,420 L482,382 Q482,374 474,374 L243,374 Q235,374 235,366 L235,324" class="softArrow edge"/>
<text x="264" y="349" class="cardinality" text-anchor="middle">1</text>
<text x="454" y="405" class="cardinality" text-anchor="middle">N</text>
<path d="M560,420 L560,382 Q560,374 568,374 L797,374 Q805,374 805,366 L805,324" class="softArrow edge"/>
<text x="844" y="349" class="cardinality" text-anchor="middle">1</text>
<text x="586" y="405" class="cardinality" text-anchor="middle">N</text>
<rect x="156" y="626" width="728" height="48" rx="10" fill="#ecfdf5" stroke="#86efac" stroke-width="1.3"/>
<text x="520" y="656" class="detail" text-anchor="middle">Bridge table models the many-to-many cast relation; FK arrows point from child table to parent table.</text>
</svg>
