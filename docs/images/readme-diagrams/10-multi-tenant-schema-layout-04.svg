<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="640" viewBox="0 0 1080 640" role="img" aria-labelledby="title desc"><title id="title">Per-tenant schema layout</title><desc id="desc">ASCII schema tree converted to a README PNG/SVG diagram.</desc><defs><filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter><marker id="arrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#758297" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><style>.canvas{fill:#F6F9FC}.frame{fill:#fff;stroke:#D7E2EC;stroke-width:2}.title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:40px;fill:#22344A}.subtitle,.label{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;fill:#536476}.subtitle{font-size:16px}.label{font-size:15px}.small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;fill:#627184}.gtitle{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:23px;fill:#22344A}.group{filter:url(#shadow);stroke-width:2}.pill{fill:#fff;opacity:.78;stroke:#D7E2EC}.line{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#arrow)}.plain{stroke:#758297;stroke-width:2;fill:none}</style></defs><rect class="canvas" width="1080" height="640"/><rect class="frame" x="36" y="28" width="1008" height="584" rx="24"/><text class="title" x="72" y="82">Per-tenant schema layout</text><text class="subtitle" x="76" y="114">ASCII schema tree converted to a README PNG/SVG diagram.</text><g transform="translate(96,170)"><rect class="group" x="0" y="0" width="360" height="115" rx="16" fill="#E8F3FF" stroke="#75A9E8"/><text class="gtitle" x="180" y="36" text-anchor="middle">Single DB Instance</text><rect class="pill" x="22" y="47" width="316" height="25" rx="8"/><text c