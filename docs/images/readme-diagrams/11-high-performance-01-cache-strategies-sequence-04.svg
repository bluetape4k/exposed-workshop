<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 980" width="1600" height="980" role="img" aria-label="Write-behind bulk event sequence">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
    <marker id="seqArrow" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#4f86c6" stroke="#4f86c6" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>

    <marker id="seqArrowAmber" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#a2743d" stroke="#a2743d" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="seqArrowTeal" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2b8f88" stroke="#2b8f88" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <style>
      text { letter-spacing: 0; }
      .canvas { fill: #fbfcf8; stroke: #40545d; stroke-width: 3; }
      .title { font-family: "Architects Daughter"; font-size: 36px; fill: #23323a; }
      .subtitle,.participant-sub,.msg,.detail { font-family: "Comic Mono"; fill: #324750; }
      .subtitle { font-size: 15px; }
      .header { fill: #fff; stroke-width: 2.1; filter: url(#shadow); }
      .actor { stroke: #617985; }
      .service { stroke: #617985; }
      .cache { stroke: #617985; }
      .store { stroke: #617985; }
      .participant { font-family: "Architects Daughter"; font-size: 18px; fill: #20323b; }
      .participant-sub { font-size: 11px; fill: #60717a; }
      .lifeline { fill: none; stroke: #c7d5d1; stroke-width: 1.8; stroke-dasharray: 8 8; }
      .activation { fill: #ffffff; stroke: #7a8445; stroke-width: 1.7; rx: 5; }
      .call,.async,.return { fill: none; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
      .call { stroke: #4f86c6; marker-end: url(#seqArrow); }
      .async { stroke: #a2743d; stroke-dasharray: 8 6; marker-end: url(#seqArrowAmber); }
      .return { stroke: #2b8f88; stroke-dasharray: 7 6; marker-end: url(#seqArrowTeal); }
      .pill { fill: #ffffff; stroke: #7a8445; stroke-width: 1.4; }
      .num { font-family: "Comic Mono"; font-size: 11px; font-weight: 700; fill: #7a8445; }
      .msg { font-size: 12px; font-weight: 700; }
      .detail { font-size: 12px; fill: #60717a; }
      .asyncBand { fill: none; stroke: #8298a3; stroke-width: 1.4; stroke-dasharray: 9 8; }
    </style>
  </defs>

  <rect x="24" y="24" width="1552" height="932" rx="20" class="canvas frame"/>
  <text x="800" y="76" text-anchor="middle" class="title">Write-Behind Bulk Event Loading</text>
  <text x="800" y="106" text-anchor="middle" class="subtitle">UserEventController returns after cache write; Redisson write-behind later flushes UserEventTable and Awaitility verifies the final count.</text>

  <rect x="50" y="138" width="160" height="62" rx="12" class="header actor"/>
  <text x="130" y="165" text-anchor="middle" class="participant">Caller / Test</text>
  <text x="130" y="184" text-anchor="middle" class="participant-sub">HTTP or repository test</text>

  <rect x="290" y="138" width="180" height="62" rx="12" class="header service"/>
  <text x="380" y="165" text-anchor="middle" class="participant">UserEventController</text>
  <text x="380" y="184" text-anchor="middle" class="participant-sub">POST /user-events/bulk</text>

  <rect x="545" y="138" width="190" height="62" rx="12" class="header service"/>
  <text x="640" y="165" text-anchor="middle" class="participant">UserEventRepository</text>
  <text x="640" y="184" text-anchor="middle" class="participant-sub">write-behind strategy</text>

  <rect x="800" y="138" width="180" height="62" rx="12" class="header cache"/>
  <text x="890" y="165" text-anchor="middle" class="participant">Redisson cache</text>
  <text x="890" y="184" text-anchor="middle" class="participant-sub">near cache + Redis</text>

  <rect x="1040" y="138" width="180" height="62" rx="12" class="header cache"/>
  <text x="1130" y="165" text-anchor="middle" class="participant">Write-behind worker</text>
  <text x="1130" y="184" text-anchor="middle" class="participant-sub">async batch flush</text>

  <rect x="1295" y="138" width="190" height="62" rx="12" class="header store"/>
  <text x="1390" y="165" text-anchor="middle" class="participant">UserEventTable</text>
  <text x="1390" y="184" text-anchor="middle" class="participant-sub">user_action rows</text>

  <path class="lifeline" d="M 130 206 L 130 868"/>
  <path class="lifeline" d="M 380 206 L 380 868"/>
  <path class="lifeline" d="M 640 206 L 640 868"/>
  <path class="lifeline" d="M 890 206 L 890 868"/>
  <path class="lifeline" d="M 1130 206 L 1130 868"/>
  <path class="lifeline" d="M 1390 206 L 1390 868"/>

  <rect x="372" y="232" width="16" height="332" rx="5" class="activation"/>
  <rect x="632" y="312" width="16" height="252" rx="5" class="activation"/>
  <rect x="882" y="392" width="16" height="88" rx="5" class="activation"/>
  <rect x="1122" y="472" width="16" height="220" rx="5" class="activation"/>
  <rect x="1382" y="632" width="16" height="152" rx="5" class="activation"/>

  <rect x="1010" y="448" width="430" height="270" rx="16" class="asyncBand"/>
  <text x="1225" y="474" text-anchor="middle" class="detail">asynchronous write-behind propagation</text>

  <path id="m1" data-connector="m1" class="call" d="M 130 252 L 372 252"/>
  <rect x="170" y="218" width="168" height="22" rx="11" class="pill" style="stroke:#b6d3ec"/>
  <text x="188" y="233" text-anchor="middle" class="num" style="fill:#4f86c6">1</text>
  <text x="262" y="232" text-anchor="middle" class="msg">POST bulk events</text>

  <path id="m2" data-connector="m2" class="call" d="M 388 332 L 632 332"/>
  <rect x="428" y="298" width="182" height="22" rx="11" class="pill" style="stroke:#b6d3ec"/>
  <text x="446" y="313" text-anchor="middle" class="num" style="fill:#4f86c6">2</text>
  <text x="520" y="312" text-anchor="middle" class="msg">putAll(events by id)</text>

  <path id="m3" data-connector="m3" class="call" d="M 648 412 L 882 412"/>
  <rect x="685" y="378" width="173" height="22" rx="11" class="pill" style="stroke:#b6d3ec"/>
  <text x="704" y="393" text-anchor="middle" class="num" style="fill:#4f86c6">3</text>
  <text x="772" y="392" text-anchor="middle" class="msg">write cache entries</text>

  <path id="m4" data-connector="m4" class="async" d="M 898 492 L 1122 492"/>
  <rect x="932" y="458" width="162" height="22" rx="11" class="pill" style="stroke:#dfc291"/>
  <text x="950" y="473" text-anchor="middle" class="num" style="fill:#a2743d">4</text>
  <text x="1018" y="472" text-anchor="middle" class="msg">enqueue DB flush</text>

  <path id="m5" data-connector="m5" class="return" d="M 632 572 L 388 572"/>
  <rect x="428" y="538" width="179" height="22" rx="11" class="pill" style="stroke:#add7d3"/>
  <text x="446" y="553" text-anchor="middle" class="num" style="fill:#2b8f88">5</text>
  <text x="520" y="552" text-anchor="middle" class="msg">return true quickly</text>

  <path id="m6" data-connector="m6" class="async" d="M 1138 652 L 1382 652"/>
  <rect x="1178" y="618" width="175" height="22" rx="11" class="pill" style="stroke:#dfc291"/>
  <text x="1196" y="633" text-anchor="middle" class="num" style="fill:#a2743d">6</text>
  <text x="1274" y="632" text-anchor="middle" class="msg">batch insert rows</text>

  <path id="m7" data-connector="m7" class="call" d="M 130 772 L 1382 772"/>
  <rect x="534" y="738" width="491" height="22" rx="11" class="pill" style="stroke:#b6d3ec"/>
  <text x="552" y="753" text-anchor="middle" class="num" style="fill:#4f86c6">7</text>
  <text x="830" y="752" text-anchor="middle" class="msg">Awaitility polls until saved count reaches total</text>

  <text x="800" y="912" text-anchor="middle" class="detail">The API response is decoupled from final DB persistence; the test waits until UserEventTable.selectAll().count() reaches the requested total.</text>
</svg>
