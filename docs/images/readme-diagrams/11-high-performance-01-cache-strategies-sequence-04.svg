<svg xmlns="http://www.w3.org/2000/svg" width="2296" height="1676" viewBox="0 0 2296 1676" role="img" aria-label="Request Processing Flow — Write-Behind Async Event Loading">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#758297" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 0 1 L 12 6 L 0 11 Z" fill="#ffffff" stroke="#758297" stroke-width="1.8"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="2296" height="1676"/>
<rect class="frame" x="32" y="28" width="2232" height="1620" rx="28"/>
<text class="title" x="66" y="82">Request Processing Flow — Write-Behind Async Event Loading</text>
<text class="subtitle" x="70" y="118">Sequence messages from the original Mermaid source</text>
<rect class="card" x="-10" y="166" width="300" height="72" rx="20" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="140" y="209" text-anchor="middle">Client</text>
<line class="lifeline" x1="140" y1="252" x2="140" y2="1616" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="393.20000000000005" y="166" width="300" height="72" rx="20" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="543.2" y="198.5" text-anchor="middle">User Event Cache</text>
<text class="smallLabel" x="543.2" y="219.5" text-anchor="middle">Repository</text>
<line class="lifeline" x1="543.2" y1="252" x2="543.2" y2="1616" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="796.4" y="166" width="300" height="72" rx="20" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="946.4" y="209" text-anchor="middle">Near Cache (L1)</text>
<line class="lifeline" x1="946.4" y1="252" x2="946.4" y2="1616" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="1199.6" y="166" width="300" height="72" rx="20" fill="#FDECEF" stroke="#DC6B82"/>
<text class="smallLabel" x="1349.6" y="209" text-anchor="middle">Redis (L2)</text>
<line class="lifeline" x1="1349.6" y1="252" x2="1349.6" y2="1616" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="1602.8" y="166" width="300" height="72" rx="20" fill="#E9F7F6" stroke="#45A7A1"/>
<text class="smallLabel" x="1752.8" y="209" text-anchor="middle">Async Write Queue</text>
<line class="lifeline" x1="1752.8" y1="252" x2="1752.8" y2="1616" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="2006" y="166" width="300" height="72" rx="20" fill="#F1ECFF" stroke="#8A72D6"/>
<text class="smallLabel" x="2156" y="209" text-anchor="middle">Database</text>
<line class="lifeline" x1="2156" y1="252" x2="2156" y2="1616" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect x="236.60000000000002" y="286" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="254.60000000000002" y="313" text-anchor="start">1. saveAll(events)</text>
<path class="line" d="M140 344 L543.2 344"/>
<rect x="617.8" y="396" width="254" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="635.8" y="423" text-anchor="start">2. put events (immediately)</text>
<path class="line" d="M543.2 454 L946.4 454"/>
<rect x="819.4" y="506" width="254" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="837.4" y="533" text-anchor="start">3. put events (immediately)</text>
<path class="line" d="M543.2 564 L1349.6 564"/>
<rect x="625.8" y="616" width="238" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="643.8" y="643" text-anchor="start">4. Save complete response</text>
<path class="dashed" d="M1349.6 674 L140 674"/>
<rect x="1436.1999999999998" y="726" width="230" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1454.1999999999998" y="753" text-anchor="start">5. enqueue dirty entries</text>
<path class="line" d="M1349.6 784 L1752.8 784"/>
<rect x="1839.4" y="836" width="230" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1857.4" y="863" text-anchor="start">6. batchInsert (Exposed)</text>
<path class="line" d="M1752.8 894 L2156 894"/>
<rect x="1849.4" y="946" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1867.4" y="973" text-anchor="start">7. commit</text>
<path class="dashed" d="M2156 1004 L1752.8 1004"/>
<rect x="1446.1999999999998" y="1056" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1464.1999999999998" y="1083" text-anchor="start">8. flush complete</text>
<path class="dashed" d="M1752.8 1114 L1349.6 1114"/>
<rect x="236.60000000000002" y="1166" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="254.60000000000002" y="1193" text-anchor="start">9. findById(id)</text>
<path class="line" d="M140 1224 L543.2 1224"/>
<rect x="639.8" y="1276" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="657.8" y="1303" text-anchor="start">10. get(id)</text>
<path class="line" d="M543.2 1334 L946.4 1334"/>
<rect x="639.8" y="1386" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="657.8" y="1413" text-anchor="start">11. hit → return</text>
<path class="dashed" d="M946.4 1444 L543.2 1444"/>
<rect x="236.60000000000002" y="1496" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="254.60000000000002" y="1523" text-anchor="start">12. UserEventRecord</text>
<path class="dashed" d="M543.2 1554 L140 1554"/>
</svg>
