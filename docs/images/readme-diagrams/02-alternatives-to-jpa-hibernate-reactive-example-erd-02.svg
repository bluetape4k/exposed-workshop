<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 700" width="1220" height="700" role="img" aria-label="Hibernate Reactive ERD">
<defs>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/></filter>
<marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path stroke-dasharray="none" style="stroke-dasharray:none!important" d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b" stroke="#64748b" stroke-width="0"/></marker>
<marker id="arrowBlue" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path stroke-dasharray="none" style="stroke-dasharray:none!important" d="M 0 0 L 10 5 L 0 10 Z" fill="#2563eb" stroke="#2563eb" stroke-width="0"/></marker>
<marker id="arrowGreen" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path stroke-dasharray="none" style="stroke-dasharray:none!important" d="M 0 0 L 10 5 L 0 10 Z" fill="#16a34a" stroke="#16a34a" stroke-width="0"/></marker>
<marker id="arrowOrange" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path stroke-dasharray="none" style="stroke-dasharray:none!important" d="M 0 0 L 10 5 L 0 10 Z" fill="#ea580c" stroke="#ea580c" stroke-width="0"/></marker>
<marker id="arrowPink" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path stroke-dasharray="none" style="stroke-dasharray:none!important" d="M 0 0 L 10 5 L 0 10 Z" fill="#db2777" stroke="#db2777" stroke-width="0"/></marker>
<marker id="arrowPurple" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path stroke-dasharray="none" style="stroke-dasharray:none!important" d="M 0 0 L 10 5 L 0 10 Z" fill="#7c3aed" stroke="#7c3aed" stroke-width="0"/></marker>
<marker id="arrowTeal" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path stroke-dasharray="none" style="stroke-dasharray:none!important" d="M 0 0 L 10 5 L 0 10 Z" fill="#0f766e" stroke="#0f766e" stroke-width="0"/></marker>
<style>
.canvas{fill:#f6f9fc}.frame{fill:#fff;stroke:#d7e2ec;stroke-width:1.5}
.title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:32px;fill:#1e293b}
.subtitle,.detail{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;fill:#536476}
.subtitle{font-size:13px}.detail{font-size:12px}.tiny{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:10px;fill:#64748b}
.label{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:17px;fill:#1e293b}
.panelTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:12px;letter-spacing:.08em;fill:#94a3b8}
.card{stroke-width:1.7;filter:url(#shadow)}.panel{fill:#f8fafc;stroke:#d7e2ec;stroke-width:1.2}
.arrow{fill:none;stroke:#64748b;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
.softArrow{fill:none;stroke:#94a3b8;stroke-width:1.35;stroke-dasharray:5 5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
.fkArrow{fill:none;stroke:#0f766e;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowTeal)}
.mapArrow{fill:none;stroke:#16a34a;stroke-width:1.7;stroke-dasharray:5 5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowGreen)}
.sessionUse{fill:none;stroke:#7c3aed;stroke-width:1.7;stroke-dasharray:5 5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowPurple)}
.repoUse{fill:none;stroke:#2563eb;stroke-width:1.7;stroke-dasharray:5 5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowBlue)}
.opsUse{fill:none;stroke:#16a34a;stroke-width:1.7;stroke-dasharray:5 5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowGreen)}
.clientUse{fill:none;stroke:#ea580c;stroke-width:1.7;stroke-dasharray:5 5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowOrange)}
.converterUse{fill:none;stroke:#db2777;stroke-width:1.7;stroke-dasharray:5 5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowPink)}
.lifeline{fill:none;stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:5 5;stroke-linecap:round;stroke-linejoin:round}
.inherit{fill:none;stroke:#475569;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.inheritHead{fill:#fff;stroke:#475569;stroke-width:1.4;stroke-dasharray:none;style:stroke-dasharray:none!important;stroke-linejoin:round}
.assoc{fill:none;stroke:#0f766e;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
</style>
</defs>
<rect width="1220" height="700" class="canvas"/>
<rect x="20" y="20" width="1180" height="660" rx="16" class="frame"/>
<text x="48" y="58" class="title">Hibernate Reactive ERD</text>
<text x="48" y="80" class="subtitle">Team and Member JPA entities map to a one-to-many relationship through member.team</text>
<rect x="72" y="122" width="480" height="250" rx="12" class="panel"/><text x="312" y="114" class="panelTitle" text-anchor="middle">PARENT TABLE</text>
<rect x="138" y="160" width="348" height="150" rx="12" fill="#fff" stroke="#16a34a" class="card"/>
<path d="M138,200 L138,172 Q138,160 150,160 L474,160 Q486,160 486,172 L486,200 Z" fill="#dcfce7"/>
<text x="312" y="187" class="label" text-anchor="middle">Team</text>
<text x="156" y="226" class="tiny">id BIGINT PK</text>
<text x="156" y="243" class="tiny">name VARCHAR</text>
<text x="156" y="260" class="tiny">generated identity</text>
<rect x="668" y="122" width="480" height="250" rx="12" class="panel"/><text x="908" y="114" class="panelTitle" text-anchor="middle">CHILD TABLE</text>
<rect x="734" y="160" width="348" height="168" rx="12" fill="#fff" stroke="#ea580c" class="card"/>
<path d="M734,200 L734,172 Q734,160 746,160 L1070,160 Q1082,160 1082,172 L1082,200 Z" fill="#ffedd5"/>
<text x="908" y="187" class="label" text-anchor="middle">Member</text>
<text x="752" y="226" class="tiny">id BIGINT PK</text>
<text x="752" y="243" class="tiny">name VARCHAR</text>
<text x="752" y="260" class="tiny">age INTEGER NULL</text>
<text x="752" y="277" class="tiny">team_id BIGINT FK NOT NULL</text>
<path d="M734,254 L486,254" class="fkArrow edge"/>
<text x="610" y="238" class="tiny" text-anchor="middle">member.team</text>
<text x="504" y="244" class="tiny">1</text>
<text x="718" y="244" class="tiny">N</text>
<rect x="92" y="432" width="990" height="116" rx="12" class="panel"/><text x="587" y="424" class="panelTitle" text-anchor="middle">JPA MAPPING NOTES</text>
<rect x="128" y="464" width="230" height="54" rx="10" fill="#dcfce7" stroke="#16a34a" class="card"/>
<text x="243" y="488" class="label" text-anchor="middle">@OneToMany</text>
<text x="243" y="504" class="detail" text-anchor="middle">Team.members</text>
<rect x="410" y="464" width="230" height="54" rx="10" fill="#ffedd5" stroke="#ea580c" class="card"/>
<text x="525" y="488" class="label" text-anchor="middle">@ManyToOne</text>
<text x="525" y="504" class="detail" text-anchor="middle">Member.team eager</text>
<rect x="692" y="464" width="270" height="54" rx="10" fill="#e2e8f0" stroke="#64748b" class="card"/>
<text x="827" y="488" class="label" text-anchor="middle">No explicit @Table</text>
<text x="827" y="504" class="detail" text-anchor="middle">entity names drive defaults</text>
<rect x="126" y="602" width="930" height="48" rx="10" fill="#ecfdf5" stroke="#86efac" stroke-width="1.3"/>
<text x="591" y="632" class="detail" text-anchor="middle">ERD keeps only persisted tables and the FK relationship; DTO records and controllers are intentionally omitted.</text>
</svg>
