<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1000" width="1500" height="1000" role="img" aria-label="Basic JPA relationship mapping conversion">
<defs>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/></filter>
<marker id="arrowBlue" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" viewBox="0 0 10 10" refX="9" refY="5" orient="auto" data-role="secondary" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#4f86c6" stroke="#4f86c6" stroke-dasharray="none" style="stroke-dasharray:none!important" stroke-width="0"/></marker>
<marker id="arrowGreen" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" viewBox="0 0 10 10" refX="9" refY="5" orient="auto" data-role="secondary" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6e8f4f" stroke="#6e8f4f" stroke-dasharray="none" style="stroke-dasharray:none!important" stroke-width="0"/></marker>
<marker id="arrowPurple" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" viewBox="0 0 10 10" refX="9" refY="5" orient="auto" data-role="secondary" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7d61b3" stroke="#7d61b3" stroke-dasharray="none" style="stroke-dasharray:none!important" stroke-width="0"/></marker>
<style>
.canvas{fill:#f6f9fc}.frame{fill:#fff;stroke:#d7e2ec;stroke-width:1.5}
.title{font-family:"Architects Daughter";font-size:31px;fill:#1e293b}
.subtitle,.detail{font-family:"Comic Mono";fill:#536476}
.subtitle{font-size:13px}.detail{font-size:12px}.tiny{font-family:"Comic Mono";font-size:10px;fill:#64748b}
.label{font-family:"Architects Daughter";font-size:16px;fill:#1e293b}
.panelTitle{font-family:"Architects Daughter";font-size:12px;letter-spacing:.08em;fill:#94a3b8}
.card{stroke-width:1.7;filter:url(#shadow)}.panel{fill:#f8fafc;stroke:#d7e2ec;stroke-width:1.2}
.arrow{fill:none;stroke:#4f86c6;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowBlue)}
.mapLine{fill:none;stroke:#6e8f4f;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowGreen)}
.runtimeUse{fill:none;stroke:#7d61b3;stroke-width:1.9;stroke-dasharray:6 5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowPurple)}
</style>
</defs>
<rect width="1500" height="1000" class="canvas"/>
<rect x="20" y="20" width="1460" height="960" rx="16" class="frame"/>
<text x="48" y="58" class="title">Basic JPA Relationship Mapping Conversion</text>
<text x="48" y="80" class="subtitle">The basic migration module keeps each JPA relationship concept visible, then maps it to explicit Exposed APIs and source-backed tests.</text>

<rect x="58" y="130" width="344" height="660" rx="12" class="panel"/>
<text x="230" y="122" class="panelTitle" text-anchor="middle">JPA ANNOTATION</text>
<rect x="88" y="164" width="284" height="66" rx="10" fill="#dbeafe" stroke="#3b82f6" class="card"/>
<text x="230" y="190" class="label" text-anchor="middle">@OneToOne</text>
<text x="230" y="214" class="detail" text-anchor="middle">unidirectional / bidirectional</text>
<rect x="88" y="264" width="284" height="66" rx="10" fill="#dcfce7" stroke="#16a34a" class="card"/>
<text x="230" y="290" class="label" text-anchor="middle">@OneToMany</text>
<text x="230" y="314" class="detail" text-anchor="middle">parent owns a collection</text>
<rect x="88" y="364" width="284" height="66" rx="10" fill="#ccfbf1" stroke="#0f766e" class="card"/>
<text x="230" y="390" class="label" text-anchor="middle">@ManyToOne</text>
<text x="230" y="414" class="detail" text-anchor="middle">child stores the parent FK</text>
<rect x="88" y="464" width="284" height="66" rx="10" fill="#fef3c7" stroke="#d97706" class="card"/>
<text x="230" y="490" class="label" text-anchor="middle">@ManyToMany</text>
<text x="230" y="514" class="detail" text-anchor="middle">junction table required</text>
<rect x="88" y="564" width="284" height="66" rx="10" fill="#ede9fe" stroke="#7c3aed" class="card"/>
<text x="230" y="590" class="label" text-anchor="middle">@EmbeddedId / @IdClass</text>
<text x="230" y="614" class="detail" text-anchor="middle">composite identity</text>
<rect x="88" y="664" width="284" height="66" rx="10" fill="#fce7f3" stroke="#db2777" class="card"/>
<text x="230" y="690" class="label" text-anchor="middle">FetchType / cascade</text>
<text x="230" y="714" class="detail" text-anchor="middle">loading and DB rules</text>

<rect x="496" y="130" width="430" height="660" rx="12" class="panel"/>
<text x="711" y="122" class="panelTitle" text-anchor="middle">EXPOSED API</text>
<rect x="536" y="164" width="350" height="66" rx="10" fill="#dbeafe" stroke="#3b82f6" class="card"/>
<text x="711" y="190" class="label" text-anchor="middle">reference + referencedOn</text>
<text x="711" y="214" class="detail" text-anchor="middle">FK-owning side is explicit</text>
<rect x="536" y="264" width="350" height="66" rx="10" fill="#dcfce7" stroke="#16a34a" class="card"/>
<text x="711" y="290" class="label" text-anchor="middle">referrersOn / optionalReferrersOn</text>
<text x="711" y="314" class="detail" text-anchor="middle">back-reference over child FK</text>
<rect x="536" y="364" width="350" height="66" rx="10" fill="#ccfbf1" stroke="#0f766e" class="card"/>
<text x="711" y="390" class="label" text-anchor="middle">reference on child table</text>
<text x="711" y="414" class="detail" text-anchor="middle">child DAO uses referencedOn</text>
<rect x="536" y="464" width="350" height="66" rx="10" fill="#fef3c7" stroke="#d97706" class="card"/>
<text x="711" y="490" class="label" text-anchor="middle">via + explicit junction table</text>
<text x="711" y="514" class="detail" text-anchor="middle">many-to-many is never implicit</text>
<rect x="536" y="564" width="350" height="66" rx="10" fill="#ede9fe" stroke="#7c3aed" class="card"/>
<text x="711" y="590" class="label" text-anchor="middle">CompositeIdTable</text>
<text x="711" y="614" class="detail" text-anchor="middle">addIdColumn and compositeEntity</text>
<rect x="536" y="664" width="350" height="66" rx="10" fill="#fce7f3" stroke="#db2777" class="card"/>
<text x="711" y="690" class="label" text-anchor="middle">load() / with() / ReferenceOption</text>
<text x="711" y="714" class="detail" text-anchor="middle">explicit eager load and cascades</text>

<rect x="1020" y="130" width="420" height="660" rx="12" class="panel"/>
<text x="1230" y="122" class="panelTitle" text-anchor="middle">SOURCE-BACKED TESTS</text>
<rect x="1058" y="164" width="344" height="66" rx="10" fill="#dbeafe" stroke="#3b82f6" class="card"/>
<text x="1230" y="190" class="label" text-anchor="middle">Ex01 / Ex02 / MapsId</text>
<text x="1230" y="214" class="detail" text-anchor="middle">one_to_one/*.kt</text>
<rect x="1058" y="264" width="344" height="66" rx="10" fill="#dcfce7" stroke="#16a34a" class="card"/>
<text x="1230" y="290" class="label" text-anchor="middle">Batch / Family / Order</text>
<text x="1230" y="314" class="detail" text-anchor="middle">one_to_many/*.kt</text>
<rect x="1058" y="364" width="344" height="66" rx="10" fill="#ccfbf1" stroke="#0f766e" class="card"/>
<text x="1230" y="390" class="label" text-anchor="middle">Ex01_ManyToOne</text>
<text x="1230" y="414" class="detail" text-anchor="middle">ManyToOneSchema.kt</text>
<rect x="1058" y="464" width="344" height="66" rx="10" fill="#fef3c7" stroke="#d97706" class="card"/>
<text x="1230" y="490" class="label" text-anchor="middle">Bank / Member many-to-many</text>
<text x="1230" y="514" class="detail" text-anchor="middle">via tables and rollback cases</text>
<rect x="1058" y="564" width="344" height="66" rx="10" fill="#ede9fe" stroke="#7c3aed" class="card"/>
<text x="1230" y="590" class="label" text-anchor="middle">CompositeId / IdClass</text>
<text x="1230" y="614" class="detail" text-anchor="middle">BookSchema + Ex02_IdClass</text>
<rect x="1058" y="664" width="344" height="66" rx="10" fill="#fce7f3" stroke="#db2777" class="card"/>
<text x="1230" y="690" class="label" text-anchor="middle">N+1 and cascade checks</text>
<text x="1230" y="714" class="detail" text-anchor="middle">Order / Restaurant examples</text>

<path data-connector="one-to-one-to-reference-api" d="M372,197 L536,197" class="arrow"/>
<path data-connector="one-to-many-to-referrers-api" d="M372,297 L536,297" class="arrow"/>
<path data-connector="many-to-one-to-child-reference-api" d="M372,397 L536,397" class="arrow"/>
<path data-connector="many-to-many-to-via-api" d="M372,497 L536,497" class="arrow"/>
<path data-connector="composite-id-to-composite-table" d="M372,597 L536,597" class="arrow"/>
<path data-connector="fetch-cascade-to-explicit-loading" d="M372,697 L536,697" class="arrow"/>
<path data-connector="reference-api-to-one-to-one-tests" d="M886,197 L1058,197" class="mapLine"/>
<path data-connector="referrers-api-to-one-to-many-tests" d="M886,297 L1058,297" class="mapLine"/>
<path data-connector="child-reference-api-to-many-to-one-tests" d="M886,397 L1058,397" class="mapLine"/>
<path data-connector="via-api-to-many-to-many-tests" d="M886,497 L1058,497" class="mapLine"/>
<path data-connector="composite-table-to-composite-tests" d="M886,597 L1058,597" class="mapLine"/>
<path data-connector="explicit-loading-to-n-plus-one-tests" d="M886,697 L1058,697" class="mapLine"/>

<rect x="448" y="820" width="604" height="66" rx="10" fill="#f8fafc" stroke="#cbd5e1" class="card"/>
<text x="750" y="846" class="label" text-anchor="middle">Regression contract</text>
<text x="750" y="866" class="detail" text-anchor="middle">Each mapping stays inside withTables/transaction tests.</text>
<text x="750" y="882" class="detail" text-anchor="middle">Stable fixtures compare behavior before and after conversion.</text>
<path data-connector="source-tests-to-regression-contract" d="M1230,730 L1230,837 Q1230,853 1214,853 L1052,853" class="runtimeUse"/>
<path data-connector="exposed-api-to-regression-contract" d="M711,730 L711,820" class="runtimeUse"/>

<rect x="172" y="914" width="1156" height="54" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.3"/>
<path d="M212,938 L272,938" class="arrow"/><text x="292" y="942" class="tiny">blue = JPA relationship concept to explicit Exposed API</text>
<path d="M602,938 L662,938" class="mapLine"/><text x="682" y="942" class="tiny">green = Exposed API to concrete source-backed test</text>
<path d="M972,938 L1032,938" class="runtimeUse"/><text x="1052" y="942" class="tiny">dashed purple = regression contract shared by examples</text>
</svg>
