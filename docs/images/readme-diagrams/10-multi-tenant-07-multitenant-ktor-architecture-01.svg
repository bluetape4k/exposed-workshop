<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1720 960" width="1720" height="960" role="img" aria-label="Multitenant Ktor architecture">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowRequest" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#3f8e84" stroke="#3f8e84" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="arrowContext" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#a2743d" stroke="#a2743d" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="arrowDb" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#7667b1" stroke="#7667b1" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="arrowReject" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#69777e" stroke="#69777e" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <symbol id="databaseServerIcon" viewBox="0 0 128 128">
      <rect x="10" y="8" width="108" height="112" rx="18" fill="#fffaf2" stroke="#28485a" stroke-width="6"/>
      <ellipse cx="64" cy="36" rx="34" ry="13" fill="#fff0d8" stroke="#8c6f33" stroke-width="6"/>
      <path d="M30 36v44c0 8 15 14 34 14s34-6 34-14V36" fill="#fff0d8" stroke="#8c6f33" stroke-width="6" stroke-linejoin="round"/>
      <ellipse cx="64" cy="36" rx="34" ry="13" fill="none" stroke="#8c6f33" stroke-width="5"/>
      <path d="M30 58c0 8 15 14 34 14s34-6 34-14" fill="none" stroke="#8c6f33" stroke-width="5" stroke-linecap="round"/>
      <path d="M30 80c0 8 15 14 34 14s34-6 34-14" fill="none" stroke="#8c6f33" stroke-width="5" stroke-linecap="round"/>
    </symbol>
    <style>
      text { letter-spacing: 0; }
      .canvas { fill: #fbfcf8; stroke: #3f515a; stroke-width: 3; }
      .title { font-family: "Architects Daughter"; font-size: 38px; fill: #23323a; }
      .subtitle,.laneNote,.cardText,.label,.legendText,.footer { font-family: "Comic Mono"; fill: #324750; }
      .subtitle { font-size: 16px; }
      .laneTitle { font-family: "Architects Daughter"; font-size: 24px; fill: #23323a; }
      .laneNote { font-size: 13px; fill: #5b6d75; }
      .cardTitle { font-family: "Architects Daughter"; font-size: 21px; fill: #20323b; }
      .cardText { font-size: 13px; }
      .label { font-size: 12px; font-weight: 700; }
      .legendText { font-size: 12px; fill: #52666f; }
      .footer { font-size: 13px; fill: #60717a; }
      .laneRequest { fill: #eef7f5; stroke: #6fa098; stroke-width: 2.2; }
      .laneContext { fill: #fff7e8; stroke: #b98e50; stroke-width: 2.2; }
      .laneRepo { fill: #f5f3fb; stroke: #8f82bd; stroke-width: 2.2; }
      .laneStore { fill: #f4f7f8; stroke: #7f9299; stroke-width: 2.2; }
      .card { fill: #fff; stroke-width: 2.3; filter: url(#shadow); }
      .requestCard { stroke: #5d948b; }
      .contextCard { stroke: #ac7a34; }
      .repoCard { stroke: #7b6bb4; }
      .storeCard { stroke: #69777e; }
      .rejectCard { fill: #fffdf6; stroke: #69777e; }
      .flowRequest { fill: none; stroke: #3f8e84; stroke-width: 4.0; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowRequest); }
      .flowContext { fill: none; stroke: #a2743d; stroke-width: 4.0; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowContext); }
      .flowDb { fill: none; stroke: #7667b1; stroke-width: 4.0; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowDb); }
      .flowReject { fill: none; stroke: #69777e; stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowReject); }
      .legendLine { fill: none; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect x="24" y="24" width="1672" height="912" rx="20" class="canvas"/>
  <text x="860" y="76" text-anchor="middle" class="title">Multitenant Ktor + Exposed JDBC</text>
  <text x="860" y="108" text-anchor="middle" class="subtitle">TenantPlugin validates X-Tenant-ID, coroutine context carries Tenant, and Exposed switches schema before reading movies.</text>

  <rect x="70" y="150" width="350" height="690" rx="18" class="laneRequest"/>
  <text x="106" y="192" class="laneTitle">Ktor request boundary</text>
  <text x="106" y="218" class="laneNote">Plugin validates tenant selector</text>
  <text x="106" y="238" class="laneNote">before route handlers run.</text>

  <rect x="460" y="150" width="350" height="690" rx="18" class="laneContext"/>
  <text x="496" y="192" class="laneTitle">Coroutine tenant context</text>
  <text x="496" y="218" class="laneNote">withContext binds Tenant to</text>
  <text x="496" y="238" class="laneNote">ThreadContextElement.</text>

  <rect x="850" y="150" width="350" height="690" rx="18" class="laneRepo"/>
  <text x="886" y="192" class="laneTitle">Exposed access boundary</text>
  <text x="886" y="218" class="laneNote">Repository reads current tenant</text>
  <text x="886" y="238" class="laneNote">and switches schema.</text>

  <rect x="1240" y="150" width="410" height="690" rx="18" class="laneStore"/>
  <text x="1276" y="192" class="laneTitle">Shared H2 schema store</text>
  <text x="1276" y="218" class="laneNote">One datasource, isolated tenant</text>
  <text x="1276" y="238" class="laneNote">schemas and seed rows.</text>

  <rect id="tenantPlugin" x="105" y="280" width="280" height="112" rx="12" class="card requestCard"/>
  <text x="245" y="312" text-anchor="middle" class="cardTitle">TenantPlugin</text>
  <text x="133" y="340" class="cardText">reads X-Tenant-ID header</text>
  <text x="133" y="360" class="cardText">skips / and /health paths</text>
  <text x="133" y="380" class="cardText">stores Tenant attribute</text>

  <rect id="badTenant" x="105" y="570" width="280" height="94" rx="12" class="card rejectCard"/>
  <text x="245" y="602" text-anchor="middle" class="cardTitle">Rejected before routes</text>
  <text x="133" y="630" class="cardText">missing header -> 400</text>
  <text x="133" y="650" class="cardText">unknown tenant -> 400</text>

  <rect id="movieRoutes" x="495" y="250" width="280" height="104" rx="12" class="card contextCard"/>
  <text x="635" y="282" text-anchor="middle" class="cardTitle">MovieRoutes</text>
  <text x="523" y="310" class="cardText">/tenant and /movies handlers</text>
  <text x="523" y="330" class="cardText">call withTenantContext { ... }</text>

  <rect id="tenantContextElement" x="495" y="420" width="280" height="112" rx="12" class="card contextCard"/>
  <text x="635" y="452" text-anchor="middle" class="cardTitle">TenantContextElement</text>
  <text x="523" y="480" class="cardText">updateThreadContext binds tenant</text>
  <text x="523" y="500" class="cardText">restoreThreadContext restores</text>
  <text x="523" y="520" class="cardText">previous coroutine state</text>

  <rect id="tenantContext" x="495" y="600" width="280" height="96" rx="12" class="card contextCard"/>
  <text x="635" y="632" text-anchor="middle" class="cardTitle">TenantContext</text>
  <text x="523" y="660" class="cardText">ThreadLocal currentTenant()</text>
  <text x="523" y="680" class="cardText">visible inside repository</text>

  <rect id="repository" x="885" y="280" width="280" height="114" rx="12" class="card repoCard"/>
  <text x="1025" y="312" text-anchor="middle" class="cardTitle">ExposedMovieRepository</text>
  <text x="913" y="340" class="cardText">findAll and create</text>
  <text x="913" y="360" class="cardText">require current tenant</text>
  <text x="913" y="380" class="cardText">returns tenant-tagged response</text>

  <rect id="tenantTransaction" x="885" y="500" width="280" height="116" rx="12" class="card repoCard"/>
  <text x="1025" y="532" text-anchor="middle" class="cardTitle">tenantTransaction</text>
  <text x="913" y="560" class="cardText">transaction(database)</text>
  <text x="913" y="580" class="cardText">exec SET SCHEMA TENANT_*</text>
  <text x="913" y="600" class="cardText">then reads or writes movies</text>

  <rect id="tenantBootstrap" x="1290" y="270" width="330" height="104" rx="12" class="card storeCard"/>
  <text x="1455" y="302" text-anchor="middle" class="cardTitle">TenantBootstrap</text>
  <text x="1318" y="330" class="cardText">creates TENANT_ACME/GLOBEX</text>
  <text x="1318" y="350" class="cardText">creates movies table and seed rows</text>

  <rect id="sharedH2" x="1290" y="470" width="330" height="120" rx="12" class="card storeCard"/>
  <use data-bluetape4k-icon="generic/database-server.svg" href="#databaseServerIcon" x="1328" y="506" width="46" height="46"/>
  <text x="1486" y="512" text-anchor="middle" class="cardTitle">Shared H2 Database</text>
  <text x="1394" y="542" class="cardText">single HikariDataSource</text>
  <text x="1394" y="564" class="cardText">isAutoCommit = false</text>

  <rect id="acmeSchema" x="1272" y="680" width="168" height="102" rx="12" class="card storeCard"/>
  <text x="1356" y="708" text-anchor="middle" class="cardTitle">TENANT</text>
  <text x="1356" y="734" text-anchor="middle" class="cardTitle">ACME</text>
  <text x="1356" y="758" text-anchor="middle" class="cardText">movies table</text>
  <text x="1356" y="778" text-anchor="middle" class="cardText">ACME seed rows</text>

  <rect id="globexSchema" x="1460" y="680" width="168" height="102" rx="12" class="card storeCard"/>
  <text x="1544" y="708" text-anchor="middle" class="cardTitle">TENANT</text>
  <text x="1544" y="734" text-anchor="middle" class="cardTitle">GLOBEX</text>
  <text x="1544" y="758" text-anchor="middle" class="cardText">movies table</text>
  <text x="1544" y="778" text-anchor="middle" class="cardText">GLOBEX seed rows</text>

  <path id="flow-plugin-routes" data-connector="flow-plugin-routes" d="M 385 336 L 495 336" class="flowRequest"/>
  <path id="flow-plugin-reject" data-connector="flow-plugin-reject" d="M 245 392 L 245 570" class="flowReject"/>
  <path id="flow-routes-context-element" data-connector="flow-routes-context-element" d="M 635 354 L 635 420" class="flowContext"/>
  <path id="flow-context-element-current" data-connector="flow-context-element-current" d="M 635 532 L 635 600" class="flowContext"/>
  <path id="flow-routes-repository" data-connector="flow-routes-repository" d="M 775 337 L 885 337" class="flowRequest"/>
  <path id="flow-context-transaction" data-connector="flow-context-transaction" d="M 775 648 L 835 648 Q 855 648 855 628 L 855 558 Q 855 538 875 538 L 885 538" class="flowContext"/>
  <path id="flow-repository-transaction" data-connector="flow-repository-transaction" d="M 1025 394 L 1025 500" class="flowDb"/>
  <path id="flow-transaction-h2" data-connector="flow-transaction-h2" d="M 1165 558 L 1290 558" class="flowDb"/>
  <path id="flow-bootstrap-h2" data-connector="flow-bootstrap-h2" d="M 1455 374 L 1455 470" class="flowContext"/>
  <path id="flow-h2-acme" data-connector="flow-h2-acme" d="M 1356 590 L 1356 680" class="flowDb"/>
  <path id="flow-h2-globex" data-connector="flow-h2-globex" d="M 1544 590 L 1544 680" class="flowDb"/>

  <text x="442" y="320" text-anchor="middle" class="label">validated tenant</text>
  <text x="206" y="482" text-anchor="middle" class="label">reject</text>
  <text x="660" y="392" text-anchor="middle" class="label">bind coroutine</text>
  <text x="840" y="322" text-anchor="middle" class="label">route call</text>
  <text x="844" y="626" text-anchor="middle" class="label">read tenant</text>
  <text x="1212" y="544" text-anchor="middle" class="label">SET SCHEMA</text>
  <text x="1320" y="656" text-anchor="middle" class="label">acme</text>
  <text x="1588" y="656" text-anchor="middle" class="label">globex</text>

  <rect x="500" y="806" width="720" height="36" rx="18" fill="#ffffff" stroke="#d7e2de" stroke-width="1.4"/>
  <path d="M 528 824 L 586 824" class="legendLine" stroke="#3f8e84"/>
  <text x="596" y="828" class="legendText">validated Ktor request</text>
  <path d="M 760 824 L 818 824" class="legendLine" stroke="#a2743d"/>
  <text x="828" y="828" class="legendText">coroutine context</text>
  <path d="M 1000 824 L 1058 824" class="legendLine" stroke="#7667b1"/>
  <text x="1068" y="828" class="legendText">Exposed schema access</text>

  <text x="860" y="890" text-anchor="middle" class="footer">This Ktor variant isolates tenants by schema inside one JDBC database; it does not use Spring ThreadLocal filters or Spring transaction infrastructure.</text>
</svg>
