<text x="48" y="80" class="subtitle">Advanced modules extend ColumnType, Table DSL, Entity IDs, JSON predicates, and encrypted persistence before values reach databases</text>
<rect x="58" y="130" width="282" height="520" rx="12" class="panel"/><text x="199" y="122" class="panelTitle" text-anchor="middle">PRODUCTION CONCERNS</text>
