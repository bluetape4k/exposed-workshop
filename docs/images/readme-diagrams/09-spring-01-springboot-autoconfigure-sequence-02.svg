<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 920" width="1500" height="920" role="img" aria-label="Auto-Registered Bean Flow">
<defs>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/></filter>
<marker id="arrowBlue" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" refX="9" refY="5" orient="auto" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#4f86c6" stroke="#4f86c6" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
<marker id="arrowGreen" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" refX="9" refY="5" orient="auto" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6f8f58" stroke="#6f8f58" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
<marker id="arrowOrange" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" refX="9" refY="5" orient="auto" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#a2743d" stroke="#a2743d" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
<marker id="arrowPurple" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" refX="9" refY="5" orient="auto" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7a8445" stroke="#7a8445" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
<marker id="arrowGray" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" refX="9" refY="5" orient="auto" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6f8792" stroke="#6f8792" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
<style>
.canvas{fill:none}.frame{fill:#fbfcf8;stroke:#40545d;stroke-width:3}
.title{font-family:"Architects Daughter";font-size:31px;fill:#1e293b}
.subtitle,.detail{font-family:"Comic Mono";fill:#536476}
.subtitle{font-size:13px}.detail{font-size:12px}.tiny{font-family:"Comic Mono";font-size:10px;fill:#60727d}
.label{font-family:"Architects Daughter";font-size:16px;fill:#1e293b}
.className{font-family:"Architects Daughter";font-size:17px;fill:#1e293b}
.panelTitle{font-family:"Architects Daughter";font-size:12px;letter-spacing:.08em;fill:#8298a3}
.card,.uml{stroke-width:1.7;filter:none}.panel{fill:#f8fafc;stroke:#d7e2ec;stroke-width:1.2}
.arrow{fill:none;stroke:#4f86c6;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowBlue)}
.mapLine{fill:none;stroke:#6f8f58;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowGreen)}
.dbUse{fill:none;stroke:#a2743d;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowOrange)}
.runtimeUse{fill:none;stroke:#7a8445;stroke-width:2.3;stroke-dasharray:6 5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowPurple)}
.returnLine{fill:none;stroke:#6f8792;stroke-width:2.2;stroke-dasharray:7 5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowGray)}
.activation{fill:#f3ecdf;stroke:#8f784e;stroke-width:1.5}
.inherit{fill:none;stroke:#334155;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.lifeline{stroke:#9cafb7;stroke-width:1.4;stroke-dasharray:5 6}
.altRegion{fill:none;stroke:#8298a3;stroke-opacity:.55;stroke-width:1.5;stroke-dasharray:8 7}
</style>
</defs>
<rect width="1500" height="920" class="canvas"/>
<rect x="20" y="20" width="1460" height="880" rx="16" class="frame"/>
<text x="48" y="58" class="title">Auto-Registered Bean Flow</text>
<text x="48" y="80" class="subtitle">Spring Boot creates Exposed transaction beans, conditionally runs DatabaseInitializer, and verifies TestTable through sync, async, and coroutine paths</text>
<desc>SpringBootTest</desc><rect x="29" y="130" width="152" height="54" rx="10" fill="#ffffff" stroke="#617985" class="card"/>
<text x="105" y="163" class="participant label" text-anchor="middle">SpringBootTest</text>
<line x1="105" y1="184" x2="105" y2="812" class="lifeline"/>
<desc>Application</desc><rect x="239" y="130" width="152" height="54" rx="10" fill="#ffffff" stroke="#617985" class="card"/>
<text x="315" y="163" class="participant label" text-anchor="middle">Application</text>
<line x1="315" y1="184" x2="315" y2="812" class="lifeline"/>
<desc>AutoConfig</desc><rect x="469" y="130" width="152" height="54" rx="10" fill="#ffffff" stroke="#617985" class="card"/>
<text x="545" y="163" class="participant label" text-anchor="middle">AutoConfig</text>
<line x1="545" y1="184" x2="545" y2="812" class="lifeline"/>
<desc>Tx Manager</desc><rect x="699" y="130" width="152" height="54" rx="10" fill="#ffffff" stroke="#617985" class="card"/>
<text x="775" y="163" class="participant label" text-anchor="middle">Tx Manager</text>
<line x1="775" y1="184" x2="775" y2="812" class="lifeline"/>
<desc>Initializer</desc><rect x="929" y="130" width="152" height="54" rx="10" fill="#ffffff" stroke="#617985" class="card"/>
<text x="1005" y="163" class="participant label" text-anchor="middle">Initializer</text>
<line x1="1005" y1="184" x2="1005" y2="812" class="lifeline"/>
<desc>TestTable</desc><rect x="1139" y="130" width="152" height="54" rx="10" fill="#ffffff" stroke="#617985" class="card"/>
<text x="1215" y="163" class="participant label" text-anchor="middle">TestTable</text>
<line x1="1215" y1="184" x2="1215" y2="812" class="lifeline"/>
<desc>Assertions</desc><rect x="1314" y="130" width="152" height="54" rx="10" fill="#ffffff" stroke="#617985" class="card"/>
<text x="1390" y="163" class="participant label" text-anchor="middle">Assertions</text>
<line x1="1390" y1="184" x2="1390" y2="812" class="lifeline"/>
<rect x="98" y="220" width="14" height="74" rx="6" class="activation"/>
<rect x="308" y="274" width="14" height="94" rx="6" class="activation"/>
<rect x="538" y="356" width="14" height="192" rx="6" class="activation"/>
<rect x="768" y="438" width="14" height="238" rx="6" class="activation"/>
<rect x="998" y="520" width="14" height="48" rx="6" class="activation"/>
<rect x="1208" y="548" width="14" height="250" rx="6" class="activation"/>
<rect x="1383" y="688" width="14" height="110" rx="6" class="activation"/>
<rect x="82" y="228" width="254" height="34" rx="17" fill="#ffffff" stroke="#b6d3ec" class="pill card"/>
<circle cx="105" cy="245" r="14" fill="#fff" stroke="#b6d3ec" stroke-width="1.4"/>
<text x="105" y="250" class="detail" text-anchor="middle">1</text>
<text x="130" y="251" class="detail">load Application with H2 properties</text>
<path data-connector="load-application" d="M105,276 H315" class="arrow"/>
<rect x="292" y="310" width="304" height="34" rx="17" fill="#ffffff" stroke="#cbd1a2" class="pill card"/>
<circle cx="315" cy="327" r="14" fill="#fff" stroke="#cbd1a2" stroke-width="1.4"/>
<text x="315" y="332" class="detail" text-anchor="middle">2</text>
<text x="340" y="333" class="detail">ExposedAutoConfiguration creates beans</text>
<path data-connector="create-autoconfig-beans" d="M315,358 H545" class="arrow"/>
<rect x="520" y="392" width="312" height="34" rx="17" fill="#ffffff" stroke="#add7d3" class="pill card"/>
<circle cx="543" cy="409" r="14" fill="#fff" stroke="#add7d3" stroke-width="1.4"/>
<text x="543" y="414" class="detail" text-anchor="middle">3</text>
<text x="568" y="415" class="detail">SpringTransactionManager is registered</text>
<path data-connector="register-transaction-manager" d="M545,440 H775" class="arrow"/>
<rect x="740" y="474" width="318" height="34" rx="17" fill="#ffffff" stroke="#d8aaa7" class="pill card"/>
<circle cx="763" cy="491" r="14" fill="#fff" stroke="#d8aaa7" stroke-width="1.4"/>
<text x="763" y="496" class="detail" text-anchor="middle">4</text>
<text x="788" y="497" class="detail">generate-ddl=true runs initializer</text>
<path data-connector="conditional-initializer" d="M545,522 H1005" class="runtimeUse"/>
<path data-connector="initializer-creates-table" d="M1005,550 H1215" class="dbUse"/>
<rect x="982" y="610" width="284" height="34" rx="17" fill="#ffffff" stroke="#a2743d" class="pill card"/>
<circle cx="1005" cy="627" r="14" fill="#fff" stroke="#bdd6b4" stroke-width="1.4"/>
<text x="1005" y="632" class="detail" text-anchor="middle">5</text>
<text x="1030" y="633" class="detail">sync/async/coroutine queries table</text>
<path data-connector="query-test-table" d="M775,658 H1215" class="dbUse"/>
<rect x="1134" y="724" width="316" height="34" rx="17" fill="#ffffff" stroke="#dfc291" class="pill card"/>
<circle cx="1189" cy="741" r="14" fill="#fff" stroke="#dfc291" stroke-width="1.4"/>
<text x="1189" y="746" class="detail" text-anchor="middle">6</text>
<text x="1214" y="747" class="detail">assert empty rows and missing name</text>
<path data-connector="assert-results" d="M1215,780 H1390" class="returnLine"/>
<rect x="126" y="830" width="1248" height="52" rx="10" fill="#ffffff" stroke="#d6e1e5" stroke-width="1.3"/>
<text x="750" y="861" class="detail" text-anchor="middle">Sequence rule: bean creation and table verification are solid calls; result checks return dashed. DatabaseInitializer is conditional on spring.exposed.generate-ddl=true.</text>
</svg>
