<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 920" width="1500" height="920" role="img" aria-label="Auto-Registered Bean Flow">
<defs>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/></filter>
<marker id="arrowBlue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8 Z" fill="#2563eb"/></marker>
<marker id="arrowGreen" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8 Z" fill="#16a34a"/></marker>
<marker id="arrowOrange" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8 Z" fill="#ea580c"/></marker>
<marker id="arrowPurple" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8 Z" fill="#7c3aed"/></marker>
<marker id="arrowGray" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8 Z" fill="#64748b"/></marker>
<style>
.canvas{fill:#f6f9fc}.frame{fill:#fff;stroke:#d7e2ec;stroke-width:1.5}
.title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:31px;fill:#1e293b}
.subtitle,.detail{font-family:"Comic Mono","Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;fill:#536476}
.subtitle{font-size:13px}.detail{font-size:12px}.tiny{font-family:"Comic Mono","Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:10px;fill:#64748b}
.label{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:16px;fill:#1e293b}
.className{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:17px;fill:#1e293b}
.panelTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:12px;letter-spacing:.08em;fill:#94a3b8}
.card,.uml{stroke-width:1.7;filter:url(#shadow)}.panel{fill:#f8fafc;stroke:#d7e2ec;stroke-width:1.2}
.arrow{fill:none;stroke:#2563eb;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowBlue)}
.mapLine{fill:none;stroke:#16a34a;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowGreen)}
.dbUse{fill:none;stroke:#ea580c;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowOrange)}
.runtimeUse{fill:none;stroke:#7c3aed;stroke-width:1.9;stroke-dasharray:6 5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowPurple)}
.returnLine{fill:none;stroke:#64748b;stroke-width:1.7;stroke-dasharray:7 5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowGray)}
.inherit{fill:none;stroke:#334155;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.lifeline{stroke:#cbd5e1;stroke-width:1.4;stroke-dasharray:5 6}
</style>
</defs>
<rect width="1500" height="920" class="canvas"/>
<rect x="20" y="20" width="1460" height="880" rx="16" class="frame"/>
<text x="48" y="58" class="title">Auto-Registered Bean Flow</text>
<text x="48" y="80" class="subtitle">Spring Boot creates Exposed transaction beans, conditionally runs DatabaseInitializer, and verifies TestTable through sync, async, and coroutine paths</text>
<desc>SpringBootTest</desc><rect x="29" y="130" width="152" height="54" rx="10" fill="#dbeafe" stroke="#3b82f6" class="card"/>
<text x="105" y="163" class="label" text-anchor="middle">SpringBootTest</text>
<line x1="105" y1="184" x2="105" y2="760" class="lifeline"/>
<desc>Application</desc><rect x="239" y="130" width="152" height="54" rx="10" fill="#dbeafe" stroke="#3b82f6" class="card"/>
<text x="315" y="163" class="label" text-anchor="middle">Application</text>
<line x1="315" y1="184" x2="315" y2="760" class="lifeline"/>
<desc>AutoConfig</desc><rect x="469" y="130" width="152" height="54" rx="10" fill="#dbeafe" stroke="#3b82f6" class="card"/>
<text x="545" y="163" class="label" text-anchor="middle">AutoConfig</text>
<line x1="545" y1="184" x2="545" y2="760" class="lifeline"/>
<desc>Tx Manager</desc><rect x="699" y="130" width="152" height="54" rx="10" fill="#dbeafe" stroke="#3b82f6" class="card"/>
<text x="775" y="163" class="label" text-anchor="middle">Tx Manager</text>
<line x1="775" y1="184" x2="775" y2="760" class="lifeline"/>
<desc>Initializer</desc><rect x="929" y="130" width="152" height="54" rx="10" fill="#dbeafe" stroke="#3b82f6" class="card"/>
<text x="1005" y="163" class="label" text-anchor="middle">Initializer</text>
<line x1="1005" y1="184" x2="1005" y2="760" class="lifeline"/>
<desc>TestTable</desc><rect x="1139" y="130" width="152" height="54" rx="10" fill="#dbeafe" stroke="#3b82f6" class="card"/>
<text x="1215" y="163" class="label" text-anchor="middle">TestTable</text>
<line x1="1215" y1="184" x2="1215" y2="760" class="lifeline"/>
<desc>Assertions</desc><rect x="1314" y="130" width="152" height="54" rx="10" fill="#dbeafe" stroke="#3b82f6" class="card"/>
<text x="1390" y="163" class="label" text-anchor="middle">Assertions</text>
<line x1="1390" y1="184" x2="1390" y2="760" class="lifeline"/>
<rect x="82" y="222" width="254" height="46" rx="10" fill="#dbeafe" stroke="#3b82f6" class="card"/>
<circle cx="105" cy="245" r="14" fill="#fff" stroke="#3b82f6" stroke-width="1.4"/>
<text x="105" y="250" class="detail" text-anchor="middle">1</text>
<text x="130" y="251" class="detail">load Application with H2 properties</text>
<path d="M105,276 L315,276" class="arrow"/>
<rect x="292" y="304" width="304" height="46" rx="10" fill="#ede9fe" stroke="#7c3aed" class="card"/>
<circle cx="315" cy="327" r="14" fill="#fff" stroke="#7c3aed" stroke-width="1.4"/>
<text x="315" y="332" class="detail" text-anchor="middle">2</text>
<text x="340" y="333" class="detail">ExposedAutoConfiguration creates beans</text>
<path d="M315,358 L545,358" class="arrow"/>
<rect x="520" y="386" width="312" height="46" rx="10" fill="#ccfbf1" stroke="#0f766e" class="card"/>
<circle cx="543" cy="409" r="14" fill="#fff" stroke="#0f766e" stroke-width="1.4"/>
<text x="543" y="414" class="detail" text-anchor="middle">3</text>
<text x="568" y="415" class="detail">SpringTransactionManager is registered</text>
<path d="M545,440 L775,440" class="arrow"/>
<rect x="740" y="468" width="318" height="46" rx="10" fill="#fce7f3" stroke="#db2777" class="card"/>
<circle cx="763" cy="491" r="14" fill="#fff" stroke="#db2777" stroke-width="1.4"/>
<text x="763" y="496" class="detail" text-anchor="middle">4</text>
<text x="788" y="497" class="detail">generate-ddl=true runs initializer</text>
<path d="M545,522 L1005,522" class="runtimeUse"/>
<path d="M1005,550 L1215,550" class="dbUse"/>
<rect x="982" y="604" width="284" height="46" rx="10" fill="#dcfce7" stroke="#16a34a" class="card"/>
<circle cx="1005" cy="627" r="14" fill="#fff" stroke="#16a34a" stroke-width="1.4"/>
<text x="1005" y="632" class="detail" text-anchor="middle">5</text>
<text x="1030" y="633" class="detail">sync/async/coroutine queries table</text>
<path d="M775,658 L1215,658" class="dbUse"/>
<rect x="1166" y="718" width="248" height="46" rx="10" fill="#fef3c7" stroke="#d97706" class="card"/>
<circle cx="1189" cy="741" r="14" fill="#fff" stroke="#d97706" stroke-width="1.4"/>
<text x="1189" y="746" class="detail" text-anchor="middle">6</text>
<text x="1214" y="747" class="detail">assert empty rows and missing name</text>
<path d="M1215,690 L1390,690" class="returnLine"/>
<rect x="126" y="830" width="1248" height="52" rx="10" fill="#ecfdf5" stroke="#86efac" stroke-width="1.3"/>
<text x="750" y="861" class="detail" text-anchor="middle">Sequence rule: bean creation and table verification are solid calls; result checks return dashed. DatabaseInitializer is conditional on spring.exposed.generate-ddl=true.</text>
</svg>
