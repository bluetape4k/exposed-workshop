<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 820" width="1260" height="820" role="img" aria-label="Exposed DML Shared Test Data ERD">
<defs>

<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/></filter>
<style>
.canvas{fill:#f6f9fc}.frame{fill:#fff;stroke:#d7e2ec;stroke-width:1.5}
.title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:31px;fill:#1e293b}
.subtitle,.detail{font-family:"Comic Mono","Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;fill:#536476}
.subtitle{font-size:13px}.detail{font-size:12px}.tiny{font-family:"Comic Mono","Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:10px;fill:#64748b}
.label{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:16px;fill:#1e293b}
.panelTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:12px;letter-spacing:.08em;fill:#94a3b8}
.card{stroke-width:1.7;filter:url(#shadow)}.panel{fill:#f8fafc;stroke:#d7e2ec;stroke-width:1.2}
.arrow{fill:none;stroke:#2563eb;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.runtimeUse{fill:none;stroke:#7c3aed;stroke-width:1.9;stroke-dasharray:5 5;stroke-linecap:round;stroke-linejoin:round;}
.dbUse{fill:none;stroke:#ea580c;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.fkArrow{fill:none;stroke:#0f766e;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.returnLine{fill:none;stroke:#64748b;stroke-width:1.8;stroke-dasharray:6 5;stroke-linecap:round;stroke-linejoin:round;}
.lifeline{stroke:#cbd5e1;stroke-width:1.5;stroke-dasharray:5 6}
.inherit{fill:none;stroke:#475569;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.inheritHead{fill:#fff;stroke:#475569;stroke-width:1.8;stroke-linejoin:round}

  .cardinalityBox{fill:#ffffff;stroke:#94a3b8;stroke-width:1;rx:7;opacity:.94}
  .cardinalityLabel{font-family:"Comic Mono", "SFMono-Regular", monospace;font-size:14px;font-weight:700;fill:#334155}
</style>
</defs>
<rect width="1260" height="820" class="canvas"/>
<rect x="20" y="20" width="1220" height="780" rx="16" class="frame"/>
<text x="48" y="58" class="title">Exposed DML Shared Test Data ERD</text>
<text x="48" y="80" class="subtitle">DML examples reuse Cities, Users, UserData, Sales, and SomeAmounts tables from shared test fixtures</text>
<rect x="64" y="132" width="744" height="560" rx="12" class="panel"/><text x="436" y="124" class="panelTitle" text-anchor="middle">CITY-USER FIXTURE</text>
<rect x="128" y="184" width="290" height="138" rx="12" fill="#fff" stroke="#3b82f6" class="card"/>
<path d="M128,226 L128,196 Q128,184 140,184 L406,184 Q418,184 418,196 L418,226 Z" fill="#dbeafe"/>
<text x="273" y="212" class="label" text-anchor="middle">cities</text>
<text x="146" y="254" class="tiny">PK city_id SERIAL</text>
<text x="146" y="271" class="tiny">name VARCHAR(50) NOT NULL</text>
<rect x="128" y="402" width="290" height="176" rx="12" fill="#fff" stroke="#0f766e" class="card"/>
<path d="M128,444 L128,414 Q128,402 140,402 L406,402 Q418,402 418,414 L418,444 Z" fill="#ccfbf1"/>
<text x="273" y="430" class="label" text-anchor="middle">users</text>
<text x="146" y="472" class="tiny">PK id VARCHAR(10)</text>
<text x="146" y="489" class="tiny">name VARCHAR(50) NOT NULL</text>
<text x="146" y="506" class="tiny">FK city_id INT NULL</text>
<text x="146" y="523" class="tiny">flags INT DEFAULT 0</text>
<rect x="526" y="402" width="216" height="154" rx="12" fill="#fff" stroke="#d97706" class="card"/>
<path d="M526,444 L526,414 Q526,402 538,402 L730,402 Q742,402 742,414 L742,444 Z" fill="#fef3c7"/>
<text x="634" y="430" class="label" text-anchor="middle">userdata</text>
<text x="544" y="472" class="tiny">FK user_id VARCHAR(10)</text>
<text x="544" y="489" class="tiny">comment VARCHAR(30)</text>
<text x="544" y="506" class="tiny">value INT</text>
<path d="M273,402 L273,322" class="fkArrow"/>
<rect x="186" y="352" width="174" height="24" rx="8" fill="#ccfbf1" stroke="#99f6e4"/>
<text x="273" y="368" class="tiny" text-anchor="middle">users.city_id -&gt; cities.city_id</text>
<path d="M526,479 L418,479" class="fkArrow"/>
<rect x="430" y="448" width="84" height="24" rx="8" fill="#ccfbf1" stroke="#99f6e4"/>
<text x="472" y="464" class="tiny" text-anchor="middle">user_id -&gt; id</text>
<rect x="874" y="132" width="322" height="560" rx="12" class="panel"/><text x="1035" y="124" class="panelTitle" text-anchor="middle">AGGREGATION FIXTURES</text>
<rect x="920" y="220" width="230" height="176" rx="12" fill="#fff" stroke="#16a34a" class="card"/>
<path d="M920,262 L920,232 Q920,220 932,220 L1138,220 Q1150,220 1150,232 L1150,262 Z" fill="#dcfce7"/>
<text x="1035" y="248" class="label" text-anchor="middle">sales</text>
<text x="938" y="290" class="tiny">year INT</text>
<text x="938" y="307" class="tiny">month INT</text>
<text x="938" y="324" class="tiny">product VARCHAR(30) NULL</text>
<text x="938" y="341" class="tiny">amount DECIMAL(8,2)</text>
<rect x="920" y="486" width="230" height="120" rx="12" fill="#fff" stroke="#db2777" class="card"/>
<path d="M920,528 L920,498 Q920,486 932,486 L1138,486 Q1150,486 1150,498 L1150,528 Z" fill="#fce7f3"/>
<text x="1035" y="514" class="label" text-anchor="middle">someamounts</text>
<text x="938" y="556" class="tiny">amount DECIMAL(8,2)</text>
<rect x="932" y="420" width="206" height="24" rx="8" fill="#fef3c7" stroke="#99f6e4"/>
<text x="1035" y="436" class="tiny" text-anchor="middle">groupBy / sum / avg examples</text>
<rect x="120" y="744" width="1028" height="52" rx="10" fill="#ecfdf5" stroke="#86efac" stroke-width="1.3"/>
<text x="634" y="775" class="detail" text-anchor="middle">ERD check: FK arrows point from child tables to parent tables; Sales and SomeAmounts are standalone aggregation fixtures.</text>

<g class="cardinality" data-cardinality="1 : N"><rect class="cardinalityBox" x="236.0" y="330.0" width="74" height="22"/><text class="cardinalityLabel" x="273.0" y="346.0" text-anchor="middle">1 : N</text></g>
<g class="cardinality" data-cardinality="1 : N"><rect class="cardinalityBox" x="435.0" y="447.0" width="74" height="22"/><text class="cardinalityLabel" x="472.0" y="463.0" text-anchor="middle">1 : N</text></g>
</svg>
