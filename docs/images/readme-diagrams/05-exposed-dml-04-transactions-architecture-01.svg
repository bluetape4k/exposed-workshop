<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 800" width="1500" height="800" role="img" aria-label="Exposed Nested Transaction Savepoint Flow">
<defs>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/></filter>
<marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b" stroke="#64748b" stroke-dasharray="none" style="stroke-dasharray:none!important" stroke-width="0"/></marker>
<marker id="arrowBlue" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563eb" stroke="#2563eb" stroke-dasharray="none" style="stroke-dasharray:none!important" stroke-width="0"/></marker>
<marker id="arrowPurple" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7c3aed" stroke="#7c3aed" stroke-dasharray="none" style="stroke-dasharray:none!important" stroke-width="0"/></marker>
<marker id="arrowOrange" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#ea580c" stroke="#ea580c" stroke-dasharray="none" style="stroke-dasharray:none!important" stroke-width="0"/></marker>
<marker id="arrowPink" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#db2777" stroke="#db2777" stroke-dasharray="none" style="stroke-dasharray:none!important" stroke-width="0"/></marker>
<style>
.canvas{fill:#f6f9fc}.frame{fill:#fff;stroke:#d7e2ec;stroke-width:1.5}
.title{font-family:"Architects Daughter";font-size:31px;fill:#1e293b}
.subtitle,.detail{font-family:"Comic Mono";fill:#536476}
.subtitle{font-size:13px}.detail{font-size:12px}.tiny{font-family:"Comic Mono";font-size:10px;fill:#64748b}
.label{font-family:"Architects Daughter";font-size:16px;fill:#1e293b}
.panelTitle{font-family:"Architects Daughter";font-size:12px;letter-spacing:.08em;fill:#94a3b8}
.card{stroke-width:1.7;filter:url(#shadow)}.panel{fill:#f8fafc;stroke:#d7e2ec;stroke-width:1.2}
.arrow{fill:none;stroke:#2563eb;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowBlue)}
.runtimeUse{fill:none;stroke:#7c3aed;stroke-width:1.9;stroke-dasharray:5 5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowPurple)}
.dbUse{fill:none;stroke:#ea580c;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowOrange)}
.savepoint{fill:none;stroke:#db2777;stroke-width:1.9;stroke-dasharray:7 4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowPink)}
.returnLine{fill:none;stroke:#64748b;stroke-width:1.8;stroke-dasharray:6 5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
.edge{fill:none}
.lifeline{stroke:#cbd5e1;stroke-width:1.5;stroke-dasharray:5 6}
</style>
</defs>
<rect width="1500" height="800" class="canvas"/>
<rect x="20" y="20" width="1460" height="760" rx="16" class="frame"/>
<text x="48" y="58" class="title">Exposed Nested Transaction Savepoint Flow</text>
<text x="48" y="80" class="subtitle">Nested transaction tests keep outer rows while rolling back nested work through useNestedTransactions and savepoints</text>
<rect x="58" y="130" width="356" height="510" rx="12" class="panel"/><text x="236" y="122" class="panelTitle" text-anchor="middle">CONFIGURATION</text>
<rect x="98" y="192" width="238" height="78" rx="10" fill="#ede9fe" stroke="#7c3aed" class="card"/>
<text x="217" y="217" class="label" text-anchor="middle">DatabaseConfig</text>
<text x="217" y="256" class="detail" text-anchor="middle">useNestedTransactions=true</text>
<rect x="98" y="352" width="238" height="78" rx="10" fill="#e2e8f0" stroke="#64748b" class="card"/>
<text x="217" y="377" class="label" text-anchor="middle">TransactionManager</text>
<text x="217" y="416" class="detail" text-anchor="middle">current transaction</text>
<rect x="98" y="512" width="238" height="78" rx="10" fill="#dcfce7" stroke="#16a34a" class="card"/>
<text x="217" y="537" class="label" text-anchor="middle">DMLTestData.Cities</text>
<text x="217" y="576" class="detail" text-anchor="middle">city rows</text>
<rect x="492" y="130" width="520" height="510" rx="12" class="panel"/><text x="752" y="122" class="panelTitle" text-anchor="middle">NESTED TRANSACTION PATH</text>
<rect x="550" y="184" width="214" height="70" rx="10" fill="#dbeafe" stroke="#3b82f6" class="card"/>
<text x="657" y="209" class="label" text-anchor="middle">Outer transaction</text>
<text x="657" y="240" class="detail" text-anchor="middle">insert city1</text>
<rect x="550" y="344" width="214" height="70" rx="10" fill="#fce7f3" stroke="#db2777" class="card"/>
<text x="657" y="369" class="label" text-anchor="middle">Nested tx 1</text>
<text x="657" y="400" class="detail" text-anchor="middle">insert city2</text>
<rect x="550" y="504" width="214" height="70" rx="10" fill="#ccfbf1" stroke="#0f766e" class="card"/>
<text x="657" y="529" class="label" text-anchor="middle">Nested tx 2</text>
<text x="657" y="560" class="detail" text-anchor="middle">insert city3</text>
<rect x="816" y="344" width="142" height="70" rx="10" fill="#fef3c7" stroke="#d97706" class="card"/>
<text x="887" y="369" class="label" text-anchor="middle">rollback()</text>
<text x="887" y="400" class="detail" text-anchor="middle">savepoint1</text>
<rect x="816" y="504" width="142" height="70" rx="10" fill="#dcfce7" stroke="#16a34a" class="card"/>
<text x="887" y="529" class="label" text-anchor="middle">commit</text>
<text x="887" y="560" class="detail" text-anchor="middle">savepoint2</text>
<rect x="1088" y="130" width="330" height="510" rx="12" class="panel"/><text x="1253" y="122" class="panelTitle" text-anchor="middle">OBSERVED RESULT</text>
<rect x="1160" y="202" width="160" height="184" rx="10" fill="#fff7ed" stroke="#ea580c" class="card"/>
<g data-bluetape4k-icon="generic/database-server" transform="translate(1183 226) scale(.32)">
  <rect x="10" y="8" width="108" height="112" rx="18" fill="#fffaf2" stroke="#28485a" stroke-width="6"/>
  <ellipse cx="64" cy="36" rx="34" ry="13" fill="#fff0d8" stroke="#8c6f33" stroke-width="6"/>
  <path d="M30 36v44c0 8 15 14 34 14s34-6 34-14V36" fill="#fff0d8" stroke="#8c6f33" stroke-width="6" stroke-linejoin="round"/>
  <ellipse cx="64" cy="36" rx="34" ry="13" fill="none" stroke="#8c6f33" stroke-width="5"/>
  <path d="M30 58c0 8 15 14 34 14s34-6 34-14" fill="none" stroke="#8c6f33" stroke-width="5" stroke-linecap="round"/>
  <path d="M30 80c0 8 15 14 34 14s34-6 34-14" fill="none" stroke="#8c6f33" stroke-width="5" stroke-linecap="round"/>
</g>
<text x="1240" y="330" class="label" text-anchor="middle">Test DB</text>
<text x="1240" y="356" class="tiny" text-anchor="middle">Cities: city1 only</text>
<text x="1240" y="373" class="tiny" text-anchor="middle">after rollback</text>
<rect x="1136" y="500" width="206" height="70" rx="10" fill="#ccfbf1" stroke="#0f766e" class="card"/>
<text x="1239" y="525" class="label" text-anchor="middle">Assertion</text>
<text x="1239" y="556" class="detail" text-anchor="middle">names == [city1]</text>
<path data-connector="config-to-outer-transaction" d="M336,231 L550,231" class="arrow edge"/>
<path data-connector="cities-to-outer-transaction" d="M336,551 L430,551 Q440,551 440,541 L440,250 Q440,240 450,240 L550,240" class="runtimeUse edge"/>
<path data-connector="outer-to-nested-one" d="M657,254 L657,344" class="arrow edge"/>
<path data-connector="nested-one-to-nested-two" d="M657,414 L657,504" class="arrow edge"/>
<path data-connector="nested-one-to-rollback" d="M764,379 L816,379" class="savepoint edge"/>
<path data-connector="nested-two-to-commit" d="M764,539 L816,539" class="arrow edge"/>
<path data-connector="rollback-to-db" d="M958,379 L1048,379 Q1060,379 1060,367 L1060,306 Q1060,294 1072,294 L1160,294" class="savepoint edge"/>
<path data-connector="commit-to-assertion" d="M958,539 L1136,539" class="arrow edge"/>
<path data-connector="db-result-to-assertion" d="M1240,386 L1240,500" class="returnLine edge"/>
<rect x="220" y="654" width="1060" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<path d="M254,670 L316,670" class="arrow"/><text x="330" y="675" class="tiny">transaction progression</text>
<path d="M584,670 L646,670" class="runtimeUse"/><text x="660" y="675" class="tiny">configuration and table context</text>
<path d="M254,690 L316,690" class="savepoint"/><text x="330" y="695" class="tiny">savepoint rollback</text>
<path d="M584,690 L646,690" class="returnLine"/><text x="660" y="695" class="tiny">observed persisted result</text>
<rect x="126" y="720" width="1244" height="44" rx="10" fill="#ecfdf5" stroke="#86efac" stroke-width="1.3"/>
<text x="748" y="747" class="detail" text-anchor="middle">Nested tx 1 rollback removes city2 and city3 while the outer transaction keeps city1.</text>
</svg>
