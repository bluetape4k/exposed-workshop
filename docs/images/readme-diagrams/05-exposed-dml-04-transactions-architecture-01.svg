<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 900" width="1500" height="900" role="img" aria-label="Exposed Nested Transaction Savepoint Flow">
<defs>

<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/></filter>
<marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b"/></marker>
<marker id="arrowBlue" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563eb"/></marker>
<marker id="arrowPurple" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7c3aed"/></marker>
<marker id="arrowOrange" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#ea580c"/></marker>
<marker id="arrowPink" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#db2777"/></marker>
<style>
.canvas{fill:#f6f9fc}.frame{fill:#fff;stroke:#d7e2ec;stroke-width:1.5}
.title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:31px;fill:#1e293b}
.subtitle,.detail{font-family:"Comic Mono","Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;fill:#536476}
.subtitle{font-size:13px}.detail{font-size:12px}.tiny{font-family:"Comic Mono","Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:10px;fill:#64748b}
.label{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:16px;fill:#1e293b}
.panelTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:12px;letter-spacing:.08em;fill:#94a3b8}
.card{stroke-width:1.7;filter:url(#shadow)}.panel{fill:#f8fafc;stroke:#d7e2ec;stroke-width:1.2}
.arrow{fill:none;stroke:#2563eb;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowBlue)}
.runtimeUse{fill:none;stroke:#7c3aed;stroke-width:1.9;stroke-dasharray:5 5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowPurple)}
.dbUse{fill:none;stroke:#ea580c;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowOrange)}
.savepoint{fill:none;stroke:#db2777;stroke-width:1.9;stroke-dasharray:7 4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowPink)}
.returnLine{fill:none;stroke:#64748b;stroke-width:1.8;stroke-dasharray:6 5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
.lifeline{stroke:#cbd5e1;stroke-width:1.5;stroke-dasharray:5 6}
</style>
</defs>
<rect width="1500" height="900" class="canvas"/>
<rect x="20" y="20" width="1460" height="860" rx="16" class="frame"/>
<text x="48" y="58" class="title">Exposed Nested Transaction Savepoint Flow</text>
<text x="48" y="80" class="subtitle">Nested transaction tests keep outer rows while rolling back nested work through useNestedTransactions and savepoints</text>
<rect x="58" y="130" width="356" height="610" rx="12" class="panel"/><text x="236" y="122" class="panelTitle" text-anchor="middle">CONFIGURATION</text>
<rect x="98" y="192" width="238" height="78" rx="10" fill="#ede9fe" stroke="#7c3aed" class="card"/>
<text x="217" y="217" class="label" text-anchor="middle">DatabaseConfig</text>
<text x="217" y="256" class="detail" text-anchor="middle">useNestedTransactions=true</text>
<rect x="98" y="352" width="238" height="78" rx="10" fill="#e2e8f0" stroke="#64748b" class="card"/>
<text x="217" y="377" class="label" text-anchor="middle">TransactionManager</text>
<text x="217" y="416" class="detail" text-anchor="middle">current transaction</text>
<rect x="98" y="512" width="238" height="78" rx="10" fill="#dcfce7" stroke="#16a34a" class="card"/>
<text x="217" y="537" class="label" text-anchor="middle">DMLTestData.Cities</text>
<text x="217" y="576" class="detail" text-anchor="middle">city rows</text>
<rect x="492" y="130" width="520" height="610" rx="12" class="panel"/><text x="752" y="122" class="panelTitle" text-anchor="middle">NESTED TRANSACTION PATH</text>
<rect x="550" y="184" width="214" height="70" rx="10" fill="#dbeafe" stroke="#3b82f6" class="card"/>
<text x="657" y="209" class="label" text-anchor="middle">Outer transaction</text>
<text x="657" y="240" class="detail" text-anchor="middle">insert city1</text>
<rect x="550" y="344" width="214" height="70" rx="10" fill="#fce7f3" stroke="#db2777" class="card"/>
<text x="657" y="369" class="label" text-anchor="middle">Nested tx 1</text>
<text x="657" y="400" class="detail" text-anchor="middle">insert city2</text>
<rect x="550" y="504" width="214" height="70" rx="10" fill="#ccfbf1" stroke="#0f766e" class="card"/>
<text x="657" y="529" class="label" text-anchor="middle">Nested tx 2</text>
<text x="657" y="560" class="detail" text-anchor="middle">insert city3</text>
<rect x="816" y="344" width="142" height="70" rx="10" fill="#fef3c7" stroke="#d97706" class="card"/>
<text x="887" y="369" class="label" text-anchor="middle">rollback()</text>
<text x="887" y="400" class="detail" text-anchor="middle">savepoint1</text>
<rect x="816" y="504" width="142" height="70" rx="10" fill="#dcfce7" stroke="#16a34a" class="card"/>
<text x="887" y="529" class="label" text-anchor="middle">commit</text>
<text x="887" y="560" class="detail" text-anchor="middle">savepoint2</text>
<rect x="1088" y="130" width="330" height="610" rx="12" class="panel"/><text x="1253" y="122" class="panelTitle" text-anchor="middle">OBSERVED RESULT</text>
<path d="M1170,222 C1170,202 1310,202 1310,222 L1310,366 C1310,386 1170,386 1170,366 Z" fill="#fff" stroke="#ea580c" stroke-width="1.7" class="card"/>
<ellipse cx="1240" cy="222" rx="70" ry="16" fill="#ffedd5" stroke="#ea580c" stroke-width="1.7"/>
<path d="M1170,366 Q1240,366 1310,366" fill="none" stroke="#ea580c" stroke-width="1.7"/>
<text x="1240" y="250" class="label" text-anchor="middle">H2 DB</text>
<text x="1186" y="276" class="tiny">Cities</text>
<text x="1186" y="293" class="tiny">city1 only</text>
<text x="1186" y="310" class="tiny">after rollback</text>
<rect x="1136" y="500" width="206" height="70" rx="10" fill="#ccfbf1" stroke="#0f766e" class="card"/>
<text x="1239" y="525" class="label" text-anchor="middle">Assertion</text>
<text x="1239" y="556" class="detail" text-anchor="middle">names == [city1]</text>
<path d="M336,231 L550,219" class="arrow"/>
<path d="M336,551 L412,551 Q430,551 430,533 L430,237 Q430,219 448,219 L550,219" class="runtimeUse"/>
<path d="M657,254 L657,344" class="arrow"/>
<path d="M657,414 L657,504" class="arrow"/>
<path d="M764,379 L816,379" class="savepoint"/>
<path d="M764,539 L816,539" class="arrow"/>
<path d="M958,379 L1060,379 L1060,294 L1170,294" class="savepoint"/>
<path d="M958,539 L1136,535" class="arrow"/>
<path d="M1310,294 L1360,294 Q1378,294 1378,312 L1378,520.6 Q1378,535 1363.6,535 L1342,535" class="returnLine"/>
<rect x="126" y="796" width="1244" height="52" rx="10" fill="#ecfdf5" stroke="#86efac" stroke-width="1.3"/>
<text x="748" y="827" class="detail" text-anchor="middle">Source check: Ex05_NestedTransactions inserts city1, city2, city3; rolling back nested tx 1 removes nested work and leaves the outer city1 row.</text>
</svg>
