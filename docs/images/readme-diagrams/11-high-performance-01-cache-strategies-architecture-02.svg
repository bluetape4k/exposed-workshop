<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 940" width="1600" height="940" role="img" aria-label="Cache strategy architecture">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowCache" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#3f8e84" stroke="#3f8e84" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="arrowRoute" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#a2743d" stroke="#a2743d" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="arrowVerify" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#7667b1" stroke="#7667b1" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <style>
      text { letter-spacing: 0; }
      .canvas { fill: #fbfcf8; stroke: #3f515a; stroke-width: 3; }
      .title { font-family: "Architects Daughter","Comic Sans MS",cursive; font-size: 36px; fill: #23323a; }
      .subtitle,.laneNote,.cardText,.label,.footer { font-family: "Comic Mono","Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif; fill: #324750; }
      .subtitle { font-size: 15px; }
      .laneTitle { font-family: "Architects Daughter","Comic Sans MS",cursive; font-size: 20px; fill: #23323a; }
      .laneNote { font-size: 12px; fill: #5b6d75; }
      .cardTitle { font-family: "Architects Daughter","Comic Sans MS",cursive; font-size: 20px; fill: #20323b; }
      .cardText { font-size: 13px; }
      .label { font-size: 12px; font-weight: 700; }
      .footer { font-size: 12px; fill: #60717a; }
      .laneRequest { fill: #eef7f5; stroke: #6fa098; stroke-width: 2.2; }
      .laneRepository { fill: #fff7e8; stroke: #b98e50; stroke-width: 2.2; }
      .laneStorage { fill: #f5f3fb; stroke: #8f82bd; stroke-width: 2.2; }
      .card { fill: #fff; stroke-width: 2.3; filter: url(#shadow); }
      .cacheCard { stroke: #5d948b; }
      .routeCard { stroke: #ac7a34; }
      .verifyCard { stroke: #7b6bb4; }
      .flowReadWrite { fill: none; stroke: #3f8e84; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowCache); }
      .flowReadOnly { fill: none; stroke: #a2743d; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowRoute); }
      .flowWriteBehind { fill: none; stroke: #7667b1; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowVerify); }
      .legendLine { fill: none; stroke-width: 4; stroke-linecap: round; }
    </style>
  </defs>

  <rect x="24" y="24" width="1552" height="892" rx="20" class="canvas"/>
  <text x="800" y="76" text-anchor="middle" class="title">Cache Strategy Architecture</text>
  <text x="800" y="106" text-anchor="middle" class="subtitle">Spring MVC virtual-thread requests select an explicit Redisson repository strategy before Redis near-cache and Exposed DB access.</text>

  <rect x="70" y="150" width="400" height="640" rx="18" class="laneRequest"/>
  <text x="110" y="190" class="laneTitle">Request runtime</text>
  <text x="110" y="216" class="laneNote">TomcatVirtualThreadConfig replaces</text>
  <text x="110" y="234" class="laneNote">the Tomcat executor for blocking I/O.</text>

  <rect x="600" y="150" width="400" height="640" rx="18" class="laneRepository"/>
  <text x="640" y="190" class="laneTitle">Repository strategy</text>
  <text x="640" y="216" class="laneNote">Each repository extends</text>
  <text x="640" y="234" class="laneNote">AbstractJdbcRedissonRepository.</text>

  <rect x="1130" y="150" width="400" height="640" rx="18" class="laneStorage"/>
  <text x="1170" y="190" class="laneTitle">Storage and verification</text>
  <text x="1170" y="216" class="laneNote">RedissonConfig starts Redis, and tests</text>
  <text x="1170" y="234" class="laneNote">prove fallback and async persistence.</text>

  <rect id="usersController" x="110" y="280" width="320" height="116" rx="12" class="card cacheCard"/>
  <text x="270" y="312" text-anchor="middle" class="cardTitle">UserController</text>
  <text x="138" y="340" class="cardText">GET /users/{id}</text>
  <text x="138" y="360" class="cardText">POST /users</text>
  <text x="138" y="380" class="cardText">read-through and write-through path</text>

  <rect id="userRepository" x="640" y="280" width="320" height="116" rx="12" class="card cacheCard"/>
  <text x="800" y="312" text-anchor="middle" class="cardTitle">UserCacheRepository</text>
  <text x="668" y="340" class="cardText">READ_WRITE_THROUGH_WITH_NEAR_CACHE</text>
  <text x="668" y="360" class="cardText">cache miss loads from UserTable</text>
  <text x="668" y="380" class="cardText">save updates cache and DB together</text>

  <rect id="usersStorage" x="1170" y="280" width="320" height="116" rx="12" class="card cacheCard"/>
  <text x="1330" y="312" text-anchor="middle" class="cardTitle">Redis near cache + users</text>
  <text x="1198" y="340" class="cardText">local near cache and Redis L2</text>
  <text x="1198" y="360" class="cardText">Exposed writes UserTable rows</text>
  <text x="1198" y="380" class="cardText">tests check hit, miss, and fallback</text>

  <rect id="credentialsController" x="110" y="440" width="320" height="116" rx="12" class="card routeCard"/>
  <text x="270" y="472" text-anchor="middle" class="cardTitle">UserCredentialsController</text>
  <text x="138" y="500" class="cardText">GET /user-credentials/{username}</text>
  <text x="138" y="520" class="cardText">DELETE /user-credentials</text>
  <text x="138" y="540" class="cardText">explicit cache invalidation surface</text>

  <rect id="credentialsRepository" x="640" y="440" width="320" height="116" rx="12" class="card routeCard"/>
  <text x="800" y="472" text-anchor="middle" class="cardTitle">UserCredentialsCacheRepository</text>
  <text x="668" y="500" class="cardText">READ_ONLY_WITH_NEAR_CACHE</text>
  <text x="668" y="520" class="cardText">miss reads UserCredentialsTable</text>
  <text x="668" y="540" class="cardText">insert/update are no-op by design</text>

  <rect id="credentialsStorage" x="1170" y="440" width="320" height="116" rx="12" class="card routeCard"/>
  <text x="1330" y="472" text-anchor="middle" class="cardTitle">Read-only cache proof</text>
  <text x="1198" y="500" class="cardText">credentials are immutable for this repo</text>
  <text x="1198" y="520" class="cardText">cache invalidation does not mutate DB</text>
  <text x="1198" y="540" class="cardText">tests verify fallback path remains valid</text>

  <rect id="eventsController" x="110" y="600" width="320" height="116" rx="12" class="card verifyCard"/>
  <text x="270" y="632" text-anchor="middle" class="cardTitle">UserEventController</text>
  <text x="138" y="660" class="cardText">POST /user-events/bulk</text>
  <text x="138" y="680" class="cardText">event payloads are accepted quickly</text>
  <text x="138" y="700" class="cardText">persistence can complete later</text>

  <rect id="eventsRepository" x="640" y="600" width="320" height="116" rx="12" class="card verifyCard"/>
  <text x="800" y="632" text-anchor="middle" class="cardTitle">UserEventCacheRepository</text>
  <text x="668" y="660" class="cardText">WRITE_BEHIND_WITH_NEAR_CACHE</text>
  <text x="668" y="680" class="cardText">cache write returns before DB flush</text>
  <text x="668" y="700" class="cardText">batch insert persists UserEventTable</text>

  <rect id="eventsStorage" x="1170" y="600" width="320" height="116" rx="12" class="card verifyCard"/>
  <text x="1330" y="632" text-anchor="middle" class="cardTitle">Async persistence evidence</text>
  <text x="1198" y="660" class="cardText">Redis absorbs write bursts first</text>
  <text x="1198" y="680" class="cardText">Exposed eventually stores user_action</text>
  <text x="1198" y="700" class="cardText">Awaitility verifies final DB count</text>

  <path id="users-controller-repository" data-connector="users-controller-repository" d="M 430 338 L 640 338" class="flowReadWrite"/>
  <path id="users-repository-storage" data-connector="users-repository-storage" d="M 960 338 L 1170 338" class="flowReadWrite"/>
  <path id="credentials-controller-repository" data-connector="credentials-controller-repository" d="M 430 498 L 640 498" class="flowReadOnly"/>
  <path id="credentials-repository-storage" data-connector="credentials-repository-storage" d="M 960 498 L 1170 498" class="flowReadOnly"/>
  <path id="events-controller-repository" data-connector="events-controller-repository" d="M 430 658 L 640 658" class="flowWriteBehind"/>
  <path id="events-repository-storage" data-connector="events-repository-storage" d="M 960 658 L 1170 658" class="flowWriteBehind"/>

  <text x="535" y="322" text-anchor="middle" class="label">sync path</text>
  <text x="1065" y="322" text-anchor="middle" class="label">cache + DB</text>
  <text x="535" y="482" text-anchor="middle" class="label">read-only</text>
  <text x="1065" y="482" text-anchor="middle" class="label">fallback</text>
  <text x="535" y="642" text-anchor="middle" class="label">bulk write</text>
  <text x="1065" y="642" text-anchor="middle" class="label">eventual DB</text>

  <rect x="382" y="822" width="836" height="38" rx="19" fill="#ffffff" stroke="#d7e2de" stroke-width="1.4"/>
  <path d="M 420 841 L 478 841" class="legendLine" stroke="#3f8e84"/>
  <text x="490" y="845" class="footer">read-through + write-through</text>
  <path d="M 692 841 L 750 841" class="legendLine" stroke="#a2743d"/>
  <text x="762" y="845" class="footer">read-only cache</text>
  <path d="M 938 841 L 996 841" class="legendLine" stroke="#7667b1"/>
  <text x="1008" y="845" class="footer">write-behind</text>
</svg>
