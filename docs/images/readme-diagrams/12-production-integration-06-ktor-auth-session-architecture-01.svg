<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#f7f8fb"/>
  <text x="640" y="58" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="34" font-weight="700" fill="#1f2937">Ktor Auth Session Example Architecture</text>
  <text x="640" y="94" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="18" fill="#4b5563">Ktor Authentication, Sessions, service-level role checks, and Exposed persistence</text>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#374151"/>
    </marker>
  </defs>

  <rect x="70" y="165" width="210" height="110" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="175" y="208" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="700" fill="#1e3a8a">Client</text>
  <text x="175" y="238" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" fill="#1f2937">Basic credentials</text>

  <rect x="345" y="150" width="230" height="140" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="460" y="194" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="700" fill="#14532d">Ktor Plugins</text>
  <text x="460" y="226" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" fill="#1f2937">Authentication</text>
  <text x="460" y="252" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" fill="#1f2937">Sessions</text>

  <rect x="650" y="150" width="230" height="140" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="765" y="194" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="700" fill="#78350f">Routes</text>
  <text x="765" y="226" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" fill="#1f2937">profile, admin</text>
  <text x="765" y="252" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" fill="#1f2937">session endpoints</text>

  <rect x="955" y="150" width="230" height="140" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="1070" y="194" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="700" fill="#4c1d95">AuthService</text>
  <text x="1070" y="226" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" fill="#1f2937">credential validation</text>
  <text x="1070" y="252" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" fill="#1f2937">role decisions</text>

  <rect x="345" y="430" width="230" height="120" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="460" y="477" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="700" fill="#7f1d1d">Cookie</text>
  <text x="460" y="508" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" fill="#1f2937">auth_session token</text>

  <rect x="785" y="415" width="250" height="150" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="910" y="456" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="700" fill="#075985">H2 + Exposed</text>
  <text x="910" y="489" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" fill="#1f2937">ktor_auth_users</text>
  <text x="910" y="515" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" fill="#1f2937">ktor_auth_user_roles</text>
  <text x="910" y="541" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" fill="#1f2937">ktor_auth_sessions</text>

  <line x1="280" y1="220" x2="337" y2="220" stroke="#374151" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="575" y1="220" x2="642" y2="220" stroke="#374151" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="880" y1="220" x2="947" y2="220" stroke="#374151" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="460" y1="290" x2="460" y2="422" stroke="#374151" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1070" y1="290" x2="960" y2="410" stroke="#374151" stroke-width="3" marker-end="url(#arrow)"/>
