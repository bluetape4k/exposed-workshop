<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="title desc">
  <title id="title">Ktor auth session architecture</title>
  <desc id="desc">Ktor Authentication Basic validates credentials through AuthService, authRoutes create and replay auth_session cookies, and ExposedAuthRepository stores users, roles, and SHA-256 session token hashes in H2 tables.</desc>
  <defs>
    <style>
      text { letter-spacing: 0; }
      .title { font-family: "Architects Daughter"; font-size: 40px; fill: #23323a; }
      .subtitle, .laneNote, .cardText, .label, .footer { font-family: "Comic Mono"; fill: #324750; }
      .subtitle { font-size: 17px; }
      .laneTitle { font-family: "Architects Daughter"; font-size: 24px; fill: #23323a; }
      .laneNote { font-size: 13px; fill: #5b6d75; }
      .cardTitle { font-family: "Architects Daughter"; font-size: 22px; fill: #20323b; }
      .cardText { font-size: 14px; }
      .label { font-size: 13px; font-weight: 700; }
      .footer { font-size: 14px; fill: #60717a; }
      .canvas { fill: #fbfcf8; stroke: #3f515a; stroke-width: 3; }
      .lane { stroke-width: 2.1; }
      .laneKtor { fill: #fff7e8; stroke: #b98e50; }
      .laneService { fill: #f2f0fb; stroke: #897bc2; }
      .laneStore { fill: #eef7f5; stroke: #6fa098; }
      .laneContract { fill: #f4f6f5; stroke: #8a9aa0; }
      .card { fill: #ffffff; stroke-width: 2.2; }
      .ktorCard { stroke: #ac7a34; }
      .serviceCard { stroke: #7b6bb4; }
      .storeCard { stroke: #5d948b; }
      .contractCard { stroke: #69777e; }
      .flowKtor { fill: none; stroke: #a2743d; stroke-width: 4.2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowKtor); }
      .flowService { fill: none; stroke: #7667b1; stroke-width: 4.2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowService); }
      .flowStore { fill: none; stroke: #3f8e84; stroke-width: 4.2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowStore); }
      .flowContract { fill: none; stroke: #69777e; stroke-width: 4.2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowContract); }
    </style>
    <marker id="arrowKtor" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#a2743d" stroke="#a2743d" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="arrowService" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#7667b1" stroke="#7667b1" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="arrowStore" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#3f8e84" stroke="#3f8e84" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="arrowContract" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#69777e" stroke="#69777e" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
  </defs>

  <rect x="24" y="24" width="1552" height="892" rx="20" class="canvas"/>
  <text x="800" y="78" text-anchor="middle" class="title">Ktor Auth Session</text>
  <text x="800" y="110" text-anchor="middle" class="subtitle">Ktor Basic authentication and Sessions share an Exposed-backed user/session repository.</text>

  <rect x="70" y="158" width="330" height="580" rx="18" class="lane laneKtor"/>
  <text x="104" y="198" class="laneTitle">Ktor auth edge</text>
  <text x="104" y="224" class="laneNote">Basic auth, protected routes, cookie replay.</text>

  <rect x="470" y="158" width="330" height="580" rx="18" class="lane laneService"/>
  <text x="504" y="198" class="laneTitle">Service boundary</text>
  <text x="504" y="224" class="laneNote">Credentials, roles, and session lifecycle.</text>

  <rect x="870" y="158" width="300" height="580" rx="18" class="lane laneStore"/>
  <text x="904" y="198" class="laneTitle">Exposed tables</text>
  <text x="904" y="224" class="laneNote">Users, roles, SHA-256 token hashes.</text>

  <rect x="1240" y="158" width="260" height="580" rx="18" class="lane laneContract"/>
  <text x="1274" y="198" class="laneTitle">Workshop contract</text>
  <text x="1274" y="224" class="laneNote">Seeded users and cookie replay.</text>

  <rect id="authentication" x="112" y="260" width="246" height="118" rx="12" class="card ktorCard"/>
  <text x="235" y="294" text-anchor="middle" class="cardTitle">Authentication Basic</text>
  <text x="140" y="324" class="cardText">AUTH_BASIC provider</text>
  <text x="140" y="344" class="cardText">validate credentials</text>
  <text x="140" y="364" class="cardText">AuthPrincipal roles</text>

  <rect id="routes" x="112" y="480" width="246" height="118" rx="12" class="card ktorCard"/>
  <text x="235" y="514" text-anchor="middle" class="cardTitle">authRoutes</text>
  <text x="140" y="544" class="cardText">/profile + /admin</text>
  <text x="140" y="564" class="cardText">POST /sessions</text>
  <text x="140" y="584" class="cardText">/session-profile cookie</text>

  <rect id="authService" x="510" y="260" width="250" height="118" rx="12" class="card serviceCard"/>
  <text x="635" y="294" text-anchor="middle" class="cardTitle">AuthService</text>
  <text x="538" y="324" class="cardText">BCrypt password match</text>
  <text x="538" y="344" class="cardText">ADMIN role enforcement</text>
  <text x="538" y="364" class="cardText">session token lookup</text>

  <rect id="repository" x="510" y="480" width="250" height="118" rx="12" class="card serviceCard"/>
  <text x="635" y="514" text-anchor="middle" class="cardTitle">ExposedAuthRepository</text>
  <text x="538" y="544" class="cardText">transactionIO Dispatchers.IO</text>
  <text x="538" y="564" class="cardText">schemaReady Mutex</text>
  <text x="538" y="584" class="cardText">create/find active sessions</text>

  <rect id="tables" x="910" y="330" width="220" height="170" rx="12" class="card storeCard"/>
  <g data-bluetape4k-icon="h2" transform="translate(932 366) scale(1.7)">
    <path fill="#09476B" d="M17.17 13.27c.14-.015.28-.023.416-.023.7 0 1.228.159 1.599.469.37.314.555.756.555 1.334a2.861 2.861 0 0 1-.43 1.455c-.291.492-.775 1.066-1.46 1.727-.453.446-1.061.976-1.821 1.592a48.02 48.02 0 0 1-2.275 1.742v2.083h9.895V21.24H17.99c.219-.159.59-.435 1.11-.832.519-.4 1.033-.835 1.55-1.311.817-.76 1.425-1.5 1.822-2.215a4.624 4.624 0 0 0 .597-2.268c0-1.213-.416-2.154-1.247-2.815-.828-.662-2.033-.994-3.613-.994-.344 0-.692.015-1.036.049V6.04H13.86v4.701H8.965V6.04H5.65v12.846h3.315v-5.661h4.89v5.661h.039c.31-.242.623-.487.933-.74a28.564 28.564 0 0 0 1.826-1.588 14.854 14.854 0 0 0 .517-.529zM12.011 23.3A11.327 11.327 0 0 1 .7 11.99 11.305 11.305 0 0 1 12.011.699a11.286 11.286 0 0 1 11.29 11.29v.351H24v-.351A11.985 11.985 0 0 0 12.011 0 12.008 12.008 0 0 0 0 11.989 12.026 12.026 0 0 0 12.011 24h.352v-.7z"/>
  </g>
  <text x="1044" y="356" text-anchor="middle" class="cardTitle">H2 auth tables</text>
  <text x="988" y="392" class="cardText">ktor_auth_users</text>
  <text x="988" y="414" class="cardText">ktor_auth_user_roles</text>
  <text x="988" y="436" class="cardText">ktor_auth_sessions</text>
  <text x="988" y="458" class="cardText">token_hash unique</text>

  <rect id="accounts" x="1270" y="330" width="200" height="170" rx="12" class="card contractCard"/>
  <text x="1370" y="364" text-anchor="middle" class="cardTitle">Cookie contract</text>
  <text x="1298" y="394" class="cardText">alice / USER</text>
  <text x="1298" y="416" class="cardText">admin / ADMIN</text>
  <text x="1298" y="438" class="cardText">auth_session cookie</text>
  <text x="1298" y="460" class="cardText">1 hour expiry</text>

  <rect id="tests" x="110" y="790" width="1370" height="70" rx="12" class="card serviceCard"/>
  <text x="795" y="820" text-anchor="middle" class="cardTitle">Tested Ktor security contract</text>
  <text x="210" y="846" class="cardText">missing/invalid credentials, permission denial, authorized profile, session creation/listing, and cookie replay.</text>

  <path id="flow-basic-service" data-connector="flow-basic-service" d="M 358 319 H 510" class="flowKtor"/>
  <path id="flow-routes-service" data-connector="flow-routes-service" d="M 358 539 H 510" class="flowKtor"/>
  <path id="flow-service-repository" data-connector="flow-service-repository" d="M 635 378 V 480" class="flowService"/>
  <path id="flow-repository-tables" data-connector="flow-repository-tables" d="M 760 539 H 835 Q 855 539 855 519 L 855 435 Q 855 415 875 415 L 910 415" class="flowService"/>
  <path id="flow-tables-contract" data-connector="flow-tables-contract" d="M 1130 415 H 1270" class="flowStore"/>

  <text x="434" y="303" text-anchor="middle" class="label">authenticate</text>
  <text x="434" y="523" text-anchor="middle" class="label">route calls</text>
  <text x="664" y="432" text-anchor="middle" class="label">service API</text>
  <text x="850" y="564" text-anchor="middle" class="label">transactionIO</text>
  <text x="1200" y="399" text-anchor="middle" class="label">seed + TTL</text>

  <text x="800" y="900" text-anchor="middle" class="footer">Raw session tokens are returned only at creation; persisted session rows keep SHA-256 hashes and expiry timestamps.</text>
</svg>
