<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1378 650" width="1378" height="650" role="img" aria-label="WebFlux tenant propagation via Reactor Context">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/></filter>
    <marker id="arrowBlue" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#4f86c6" stroke="#4f86c6" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="arrowGreen" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#6f8f58" stroke="#6f8f58" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="arrowAmber" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#b8894a" stroke="#b8894a" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="arrowTeal" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2f9a94" stroke="#2f9a94" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <style>
      .canvas{fill:#f6f9fc}.frame{fill:#fff;stroke:#d7e2ec;stroke-width:1.5}
      .lane{fill:#f8fafc;stroke:#d7e2ec;stroke-width:1.2}
      .card{stroke-width:1.7;filter:url(#shadow)}
      .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:32px;fill:#1e293b}
      .subtitle,.detail,.tiny{font-family:"Comic Mono","Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;fill:#536476}
      .subtitle{font-size:13px}.detail{font-size:12px}.tiny{font-size:10.5px;fill:#64748b}
      .panelTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:13px;letter-spacing:.08em;fill:#64748b}
      .label{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:17px;fill:#1e293b}
      .flow{fill:none;stroke:#4f86c6;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
      .contextFlow{fill:none;stroke:#6f8f58;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
      .schemaFlow{fill:none;stroke:#b8894a;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
      .sqlFlow{fill:none;stroke:#2f9a94;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect width="1378" height="650" class="canvas"/>
  <rect x="20" y="20" width="1338" height="610" rx="16" class="frame"/>
  <text x="48" y="58" class="title">WebFlux Tenant Propagation via Reactor Context</text>
  <text x="48" y="80" class="subtitle">TenantFilter writes TenantId into Reactor Context; the suspended transaction reads it and switches the Exposed schema</text>

  <rect x="48" y="120" width="1282" height="145" rx="14" class="lane"/>
  <text x="689" y="146" class="panelTitle" text-anchor="middle">REACTIVE REQUEST CONTEXT</text>
  <rect x="70" y="170" width="176" height="64" rx="10" fill="#dbeafe" stroke="#4f86c6" class="card"/>
  <text x="158" y="197" class="label" text-anchor="middle">Client</text>
  <text x="158" y="218" class="detail" text-anchor="middle">X-TENANT-ID</text>
  <rect x="298" y="170" width="206" height="64" rx="10" fill="#ecfdf5" stroke="#6f8f58" class="card"/>
  <text x="401" y="197" class="label" text-anchor="middle">TenantFilter</text>
  <text x="401" y="218" class="detail" text-anchor="middle">contextWrite</text>
  <rect x="558" y="170" width="214" height="64" rx="10" fill="#ecfdf5" stroke="#6f8f58" class="card"/>
  <text x="665" y="197" class="label" text-anchor="middle">Reactor Context</text>
  <text x="665" y="218" class="detail" text-anchor="middle">TenantId key</text>
  <rect x="826" y="170" width="214" height="64" rx="10" fill="#ecfdf5" stroke="#6f8f58" class="card"/>
  <text x="933" y="197" class="label" text-anchor="middle">Coroutine Context</text>
  <text x="933" y="218" class="detail" text-anchor="middle">ReactorContext bridge</text>
  <rect x="1094" y="170" width="206" height="64" rx="10" fill="#dbeafe" stroke="#4f86c6" class="card"/>
  <text x="1197" y="197" class="label" text-anchor="middle">ActorController</text>
  <text x="1197" y="218" class="detail" text-anchor="middle">suspend handler</text>

  <path d="M246,202 H298" class="flow" marker-end="url(#arrowBlue)"/>
  <path d="M504,202 H558" class="contextFlow" marker-end="url(#arrowGreen)"/>
  <path d="M772,202 H826" class="contextFlow" marker-end="url(#arrowGreen)"/>
  <path d="M1040,202 H1094" class="flow" marker-end="url(#arrowBlue)"/>

  <rect x="48" y="318" width="1282" height="210" rx="14" class="lane"/>
  <text x="689" y="344" class="panelTitle" text-anchor="middle">SUSPENDED TRANSACTION AND SCHEMA SWITCH</text>
  <rect x="222" y="374" width="252" height="76" rx="10" fill="#fef3c7" stroke="#b8894a" class="card"/>
  <text x="348" y="401" class="label" text-anchor="middle">newSuspendedTransaction</text>
  <text x="348" y="422" class="detail" text-anchor="middle">with reactor tenant</text>
  <rect x="534" y="374" width="214" height="76" rx="10" fill="#ecfdf5" stroke="#6f8f58" class="card"/>
  <text x="641" y="401" class="label" text-anchor="middle">currentReactorTenant</text>
  <text x="641" y="422" class="detail" text-anchor="middle">read TenantId</text>
  <rect x="808" y="374" width="214" height="76" rx="10" fill="#fef3c7" stroke="#b8894a" class="card"/>
  <text x="915" y="401" class="label" text-anchor="middle">SchemaUtils</text>
  <text x="915" y="422" class="detail" text-anchor="middle">set tenant schema</text>
  <rect x="1082" y="374" width="214" height="76" rx="10" fill="#ccfbf1" stroke="#2f9a94" class="card"/>
  <text x="1189" y="401" class="label" text-anchor="middle">ActorRepository</text>
  <text x="1189" y="422" class="detail" text-anchor="middle">ActorTable query</text>
  <rect x="1082" y="474" width="214" height="64" rx="10" fill="#ffedd5" stroke="#b8894a" class="card"/>
  <text x="1189" y="501" class="label" text-anchor="middle">Tenant Schema</text>
  <text x="1189" y="522" class="detail" text-anchor="middle">H2 shared DB</text>

  <path d="M1197,234 V292 Q1197,300 1189,300 H356 Q348,300 348,308 V374" class="schemaFlow" marker-end="url(#arrowAmber)"/>
  <path d="M474,412 H534" class="contextFlow" marker-end="url(#arrowGreen)"/>
  <path d="M748,412 H808" class="schemaFlow" marker-end="url(#arrowAmber)"/>
  <path d="M1022,412 H1082" class="sqlFlow" marker-end="url(#arrowTeal)"/>
  <path d="M1189,450 V474" class="schemaFlow" marker-end="url(#arrowAmber)"/>

  <rect x="154" y="566" width="1070" height="44" rx="10" fill="#f8fafc" stroke="#d7e2ec" stroke-width="1.2"/>
  <text x="689" y="593" class="tiny" text-anchor="middle">WebFlux code avoids ThreadLocal/ScopedValue request state and resolves the tenant through ReactorContext when the coroutine transaction starts.</text>
</svg>
