<text x="1028.0" y="570" class="detail" text-anchor="middle">H2 shared DB</text>
<path d="M232,256 V302" class="flowBlue connector"/>
<path d="M232,368 V414" class="flowGreen connector"/>
<path d="M356,447 H506" class="flowGreen connector"/>
<path d="M630,256 V302" class="flowBlue connector"/>
<path d="M630,368 V414" class="flowAmber connector"/>
<path d="M754,447 H904" class="flowGreen connector"/>
<path d="M1028,256 V302" class="flowAmber connector"/>
<path d="M1028,368 V414" class="flowTeal connector"/>
<path d="M1028,480 V526" class="flowAmber connector"/>
<rect x="160" y="686" width="940" height="44" rx="10" fill="#f8fafc" stroke="#d7e2ec"/>
<text x="630" y="713" class="tiny" text-anchor="middle">The WebFlux path avoids request ThreadLocal state and resolves the tenant when the coroutine transaction starts.</text>
