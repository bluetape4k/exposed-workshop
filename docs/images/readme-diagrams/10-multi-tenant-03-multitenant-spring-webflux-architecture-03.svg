<rect x="904" y="190" width="248" height="66" rx="9" fill="#ecfdf5" stroke="#6f8f58" class="card"/>
<text x="1028.0" y="217" class="label" text-anchor="middle">currentReactorTenant</text>
<text x="1028.0" y="234" class="detail" text-anchor="middle">read TenantId</text>
<rect x="904" y="302" width="248" height="66" rx="9" fill="#fef3c7" stroke="#b8894a" class="card"/>
<text x="1028.0" y="329" class="label" text-anchor="middle">SchemaUtils</text>
<text x="1028.0" y="346" class="detail" text-anchor="middle">set tenant schema</text>
<rect x="904" y="414" width="248" height="66" rx="9" fill="#ccfbf1" stroke="#2f9a94" class="card"/>
<text x="1028.0" y="441" class="label" text-anchor="middle">ActorRepository</text>
<text x="1028.0" y="458" class="detail" text-anchor="middle">ActorTable query</text>
<rect x="904" y="526" width="248" height="66" rx="9" fill="#ffedd5" stroke="#b8894a" class="card"/>
