<text x="232.0" y="329" class="label" text-anchor="middle">TenantFilter</text>
<text x="232.0" y="346" class="detail" text-anchor="middle">contextWrite</text>
<rect x="108" y="414" width="248" height="66" rx="9" fill="#ecfdf5" stroke="#6f8f58" class="card"/>
<text x="232.0" y="441" class="label" text-anchor="middle">Reactor Context</text>
<text x="232.0" y="458" class="detail" text-anchor="middle">TenantId key</text>
<rect x="506" y="190" width="248" height="66" rx="9" fill="#ecfdf5" stroke="#6f8f58" class="card"/>
<text x="630.0" y="217" class="label" text-anchor="middle">Coroutine Context</text>
<text x="630.0" y="234" class="detail" text-anchor="middle">ReactorContext bridge</text>
<rect x="506" y="302" width="248" height="66" rx="9" fill="#dbeafe" stroke="#4f86c6" class="card"/>
<text x="630.0" y="329" class="label" text-anchor="middle">ActorController</text>
<text x="630.0" y="346" class="detail" text-anchor="middle">suspend handler</text>
