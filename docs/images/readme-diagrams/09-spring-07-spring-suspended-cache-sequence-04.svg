<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1100" width="1500" height="1100" role="img" aria-label="Coroutine suspended cache sequence">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/></filter>
    <marker id="arrowBlue" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" refX="9" refY="5" orient="auto" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#4f86c6" stroke="#4f86c6" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="arrowGreen" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" refX="9" refY="5" orient="auto" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6f8f58" stroke="#6f8f58" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="arrowOrange" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" refX="9" refY="5" orient="auto" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#a2743d" stroke="#a2743d" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="arrowPurple" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" refX="9" refY="5" orient="auto" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7a8445" stroke="#7a8445" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="arrowGray" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" refX="9" refY="5" orient="auto" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6f8792" stroke="#6f8792" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <style>
      .canvas{fill:none}.frame{fill:#fbfcf8;stroke:#40545d;stroke-width:3}
      .title{font-family:"Architects Daughter";font-size:31px;fill:#1e293b}
      .subtitle,.detail{font-family:"Comic Mono";fill:#536476}
      .subtitle{font-size:13px}.detail{font-size:12px}.role{font-family:"Comic Mono";font-size:10.5px;fill:#60727d}
      .participant{font-family:"Architects Daughter";font-size:16px;fill:#1e293b}
      .card{stroke-width:1.7;filter:url(#shadow)}
      .header{fill:#ffffff;stroke:#b6d3ec;stroke-width:1.7;filter:url(#shadow)}
      .lifeline{stroke:#9cafb7;stroke-width:1.4;stroke-dasharray:5 6}
      .activation{fill:#f3ecdf;stroke:#8f784e;stroke-width:1.5}
      .call{fill:none;stroke:#4f86c6;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowBlue)}
      .cache{fill:none;stroke:#6f8f58;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowGreen)}
      .db{fill:none;stroke:#a2743d;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowOrange)}
      .config{fill:none;stroke:#7a8445;stroke-width:2.3;stroke-dasharray:6 5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowPurple)}
      .returnLine{fill:none;stroke:#6f8792;stroke-width:2.2;stroke-dasharray:7 5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowGray)}
      .pill{stroke-width:1.6;filter:url(#shadow)}
      .badge{fill:#fff;stroke-width:1.4}
    </style>
  </defs>
  <rect width="1500" height="1100" class="canvas"/>
  <rect x="20" y="20" width="1460" height="1060" rx="16" class="frame"/>
  <text x="48" y="58" class="title">Coroutine Suspended Cache Sequence</text>
  <text x="48" y="80" class="subtitle">Cached repository checks Lettuce coroutine cache first, delegates DB work on miss, then evicts after update</text>

  <desc>Caller</desc><rect x="34" y="130" width="168" height="62" rx="10" class="header card"/>
  <text x="118" y="158" class="participant" text-anchor="middle">Caller</text>
  <text x="118" y="178" class="role" text-anchor="middle">suspend test</text>
  <line x1="118" y1="192" x2="118" y2="1028" class="lifeline"/>

  <desc>CachedCountrySuspendedRepository</desc><rect x="250" y="130" width="194" height="62" rx="10" class="header card"/>
  <text x="347" y="158" class="participant" text-anchor="middle">CachedRepo</text>
  <text x="347" y="178" class="role" text-anchor="middle">decorator</text>
  <line x1="347" y1="192" x2="347" y2="1028" class="lifeline"/>

  <desc>LettuceSuspendedCache</desc><rect x="492" y="130" width="190" height="62" rx="10" class="header card"/>
  <text x="587" y="158" class="participant" text-anchor="middle">SuspendedCache</text>
  <text x="587" y="178" class="role" text-anchor="middle">get/put/evict</text>
  <line x1="587" y1="192" x2="587" y2="1028" class="lifeline"/>

  <desc>RedisCoroutinesCommands</desc><rect x="724" y="130" width="190" height="62" rx="10" class="header card"/>
  <text x="819" y="158" class="participant" text-anchor="middle">Redis Commands</text>
  <text x="819" y="178" class="role" text-anchor="middle">setex / del</text>
  <line x1="819" y1="192" x2="819" y2="1028" class="lifeline"/>

  <desc>DefaultCountrySuspendedRepository</desc><rect x="956" y="130" width="196" height="62" rx="10" class="header card"/>
  <text x="1054" y="158" class="participant" text-anchor="middle">DefaultRepo</text>
  <text x="1054" y="178" class="role" text-anchor="middle">DB access</text>
  <line x1="1054" y1="192" x2="1054" y2="1028" class="lifeline"/>

  <desc>newSuspendedTransaction</desc><rect x="1196" y="130" width="180" height="62" rx="10" class="header card"/>
  <text x="1286" y="158" class="participant" text-anchor="middle">Suspended Tx</text>
  <text x="1286" y="178" class="role" text-anchor="middle">Exposed JDBC</text>
  <line x1="1286" y1="192" x2="1286" y2="1028" class="lifeline"/>

  <desc>Database</desc><rect x="1400" y="130" width="78" height="62" rx="10" class="header card"/>
  <text x="1439" y="158" class="participant" text-anchor="middle">H2</text>
  <text x="1439" y="178" class="role" text-anchor="middle">table</text>
  <line x1="1439" y1="192" x2="1439" y2="1028" class="lifeline"/>

  <rect x="111" y="280" width="14" height="68" rx="6" class="activation"/>
  <rect x="340" y="306" width="14" height="704" rx="6" class="activation"/>
  <rect x="580" y="350" width="14" height="674" rx="6" class="activation"/>
  <rect x="812" y="382" width="14" height="642" rx="6" class="activation"/>
  <rect x="1047" y="468" width="14" height="472" rx="6" class="activation"/>
  <rect x="1279" y="540" width="14" height="156" rx="6" class="activation"/>
  <rect x="1432" y="570" width="14" height="80" rx="6" class="activation"/>

  <rect x="74" y="228" width="300" height="34" rx="17" fill="#ffffff" stroke="#4f86c6" class="pill card"/>
  <circle cx="98" cy="245" r="14" class="badge" stroke="#4f86c6"/>
  <text x="98" y="250" class="detail" text-anchor="middle">1</text>
  <text x="123" y="251" class="detail">findByCode("KR")</text>
  <path data-connector="caller-invokes-cached-repo" d="M118,286 H347" class="call"/>

  <rect x="300" y="324" width="318" height="34" rx="17" fill="#ffffff" stroke="#6f8f58" class="pill card"/>
  <circle cx="324" cy="341" r="14" class="badge" stroke="#6f8f58"/>
  <text x="324" y="346" class="detail" text-anchor="middle">2</text>
  <text x="349" y="347" class="detail">cache.get(code)</text>
  <path data-connector="cached-repo-reads-cache" d="M347,382 H587" class="cache"/>
  <path data-connector="cache-reads-redis" d="M587,412 H819" class="cache"/>

  <rect x="718" y="442" width="376" height="34" rx="17" fill="#ffffff" stroke="#4f86c6" class="pill card"/>
  <circle cx="742" cy="459" r="14" class="badge" stroke="#4f86c6"/>
  <text x="742" y="464" class="detail" text-anchor="middle">3</text>
  <text x="767" y="465" class="detail">miss delegates to DefaultRepo</text>
  <path data-connector="miss-delegates-default-repo" d="M347,500 H1054" class="call"/>

  <rect x="1008" y="518" width="386" height="34" rx="17" fill="#ffffff" stroke="#a2743d" class="pill card"/>
  <circle cx="1032" cy="535" r="14" class="badge" stroke="#a2743d"/>
  <text x="1032" y="540" class="detail" text-anchor="middle">4</text>
  <text x="1057" y="541" class="detail">newSuspendedTransaction { selectAll }</text>
  <path data-connector="default-repo-opens-suspended-transaction" d="M1054,576 H1286" class="db"/>
  <path data-connector="suspended-transaction-selects-table" d="M1286,616 H1439" class="db"/>

  <rect x="446" y="656" width="410" height="34" rx="17" fill="#ffffff" stroke="#6f8f58" class="pill card"/>
  <circle cx="470" cy="673" r="14" class="badge" stroke="#6f8f58"/>
  <text x="470" y="678" class="detail" text-anchor="middle">5</text>
  <text x="495" y="679" class="detail">cache.put(code, record) with TTL 60s</text>
  <path data-connector="cached-repo-stores-record" d="M1054,714 H587" class="cache"/>
  <path data-connector="cache-setex-redis" d="M587,734 H819" class="cache"/>

  <rect x="72" y="766" width="364" height="34" rx="17" fill="#f8fafc" stroke="#6f8792" class="pill card"/>
  <circle cx="96" cy="783" r="14" class="badge" stroke="#6f8792"/>
  <text x="96" y="788" class="detail" text-anchor="middle">6</text>
  <text x="121" y="789" class="detail">next lookup returns from Redis only</text>
  <path data-connector="cache-hit-returns-without-db" d="M819,824 H118" class="returnLine"/>

  <rect x="860" y="846" width="390" height="34" rx="17" fill="#ffffff" stroke="#a2743d" class="pill card"/>
  <circle cx="884" cy="863" r="14" class="badge" stroke="#a2743d"/>
  <text x="884" y="868" class="detail" text-anchor="middle">7</text>
  <text x="909" y="869" class="detail">update delegates first, then returns count</text>
  <path data-connector="update-delegates-default-repo" d="M347,904 H1054" class="db"/>

  <rect x="1030" y="936" width="388" height="34" rx="17" fill="#ffffff" stroke="#6f8f58" class="pill card"/>
  <circle cx="1054" cy="953" r="14" class="badge" stroke="#6f8f58"/>
  <text x="1054" y="958" class="detail" text-anchor="middle">8</text>
  <text x="1079" y="959" class="detail">cache.evict(code) after delegate.update()</text>
  <path data-connector="cached-repo-evicts-after-update" d="M347,1010 H587" class="cache"/>
  <path data-connector="cache-del-redis" d="M587,1010 H819" class="cache"/>
</svg>
