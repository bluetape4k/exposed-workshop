<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="1080" viewBox="0 0 1720 1080" role="img" aria-labelledby="title desc">
  <title id="title">Spring Modulith publication store with Exposed</title>
  <desc id="desc">A local Spring Modulith order event is captured by the publication registry, stored through the Exposed event publication repository in H2, completed by the fulfillment listener, and retried through incomplete publication resubmission when the listener fails.</desc>
  <defs>
    <style>
      text { letter-spacing: 0; }
      .title { font-family: "Architects Daughter"; font-size: 42px; fill: #23323a; }
      .subtitle, .laneNote, .cardText, .label, .footer { font-family: "Comic Mono"; fill: #324750; }
      .subtitle { font-size: 18px; }
      .laneTitle { font-family: "Architects Daughter"; font-size: 25px; fill: #23323a; }
      .laneNote { font-size: 13px; fill: #5b6d75; }
      .cardTitle { font-family: "Architects Daughter"; font-size: 22px; fill: #20323b; }
      .cardText { font-size: 14px; }
      .label { font-size: 13px; font-weight: 700; }
      .footer { font-size: 14px; fill: #60717a; }
      .canvas { fill: #fbfcf8; stroke: #3f515a; stroke-width: 3; }
      .laneApp { fill: #eef7f5; stroke: #6fa098; stroke-width: 2.2; }
      .laneStore { fill: #fff7e8; stroke: #b98e50; stroke-width: 2.2; }
      .laneRecovery { fill: #f2f0fb; stroke: #897bc2; stroke-width: 2.2; }
      .card { stroke-width: 2.3; }
      .appCard { fill: #ffffff; stroke: #5d948b; }
      .storeCard { fill: #ffffff; stroke: #ac7a34; }
      .recoveryCard { fill: #ffffff; stroke: #7b6bb4; }
      .warnCard { fill: #fffdf6; stroke: #69777e; }
      .flowApp { fill: none; stroke: #3f8e84; stroke-width: 4.2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowApp); }
      .flowStore { fill: none; stroke: #a2743d; stroke-width: 4.2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowStore); }
      .flowRecovery { fill: none; stroke: #7667b1; stroke-width: 4.2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowRecovery); }
      .flowWarn { fill: none; stroke: #69777e; stroke-width: 3.8; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowWarn); }
    </style>
    <marker id="arrowApp" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#3f8e84" stroke="#3f8e84" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="arrowStore" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#a2743d" stroke="#a2743d" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="arrowRecovery" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#7667b1" stroke="#7667b1" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="arrowWarn" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#69777e" stroke="#69777e" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
  </defs>

  <rect x="24" y="24" width="1672" height="1032" rx="20" class="canvas"/>
  <text x="860" y="78" text-anchor="middle" class="title">Spring Modulith Publication Store with Exposed</text>
  <text x="860" y="110" text-anchor="middle" class="subtitle">Order approval publishes a durable Modulith event; Exposed owns the publication table and retry state.</text>

  <rect x="70" y="148" width="480" height="838" rx="18" class="laneApp"/>
  <text x="106" y="190" class="laneTitle">Application event path</text>
  <text x="106" y="216" class="laneNote">Orders and fulfillment stay separate Spring Modulith modules.</text>

  <rect x="620" y="148" width="480" height="838" rx="18" class="laneStore"/>
  <text x="656" y="190" class="laneTitle">Exposed publication store</text>
  <text x="656" y="216" class="laneNote">SPI-backed local store; H2 and SpringTransactionManager.</text>

  <rect x="1170" y="148" width="480" height="838" rx="18" class="laneRecovery"/>
  <text x="1206" y="190" class="laneTitle">Recovery and migration safety</text>
  <text x="1206" y="216" class="laneNote">Failed or legacy rows stay visible and resubmittable.</text>

  <rect id="orders" x="140" y="258" width="320" height="88" rx="12" class="card appCard"/>
  <text x="300" y="292" text-anchor="middle" class="cardTitle">Orders module</text>
  <text x="168" y="320" class="cardText">approves order in transaction</text>

  <rect id="publisher" x="140" y="398" width="320" height="88" rx="12" class="card appCard"/>
  <text x="300" y="432" text-anchor="middle" class="cardTitle">ApplicationEventPublisher</text>
  <text x="168" y="460" class="cardText">emits OrderApprovedEvent</text>

  <rect id="listener" x="140" y="628" width="320" height="88" rx="12" class="card appCard"/>
  <text x="300" y="662" text-anchor="middle" class="cardTitle">Fulfillment listener</text>
  <text x="168" y="690" class="cardText">reserves stock after commit</text>

  <rect id="reservationTable" x="140" y="808" width="320" height="94" rx="12" class="card storeCard"/>
  <image href="../readme-icons/h2.svg" x="168" y="834" width="42" height="42"/>
  <text x="306" y="842" text-anchor="middle" class="cardTitle">Reservations table</text>
  <text x="226" y="870" class="cardText">listener side effect</text>
  <text x="226" y="892" class="cardText">asserted by tests</text>

  <rect id="registry" x="700" y="398" width="320" height="88" rx="12" class="card storeCard"/>
  <text x="860" y="432" text-anchor="middle" class="cardTitle">Publication registry</text>
  <text x="728" y="460" class="cardText">captures target listener row</text>

  <rect id="repository" x="690" y="548" width="340" height="94" rx="12" class="card storeCard"/>
  <text x="860" y="582" text-anchor="middle" class="cardTitle">Exposed publication repository</text>
  <text x="718" y="610" class="cardText">create, markCompleted, markFailed</text>
  <text x="718" y="632" class="cardText">uses SpringTransactionManager</text>

  <rect id="publicationTable" x="695" y="694" width="330" height="116" rx="12" class="card storeCard"/>
  <image href="../readme-icons/h2.svg" x="723" y="738" width="42" height="42"/>
  <text x="890" y="728" text-anchor="middle" class="cardTitle">EVENT_PUBLICATION</text>
  <text x="782" y="760" class="cardText">status + attempts + listener id</text>
  <text x="782" y="784" class="cardText">serialized event payload</text>

  <rect id="failedPublication" x="1245" y="554" width="330" height="82" rx="12" class="card recoveryCard"/>
  <text x="1410" y="588" text-anchor="middle" class="cardTitle">FAILED publication</text>
  <text x="1273" y="616" class="cardText">listener failure keeps row queryable</text>

  <rect id="resubmitApi" x="1235" y="686" width="350" height="82" rx="12" class="card recoveryCard"/>
  <text x="1410" y="720" text-anchor="middle" class="cardTitle">IncompleteEventPublications</text>
  <text x="1263" y="748" class="cardText">resubmitIncompletePublications()</text>

  <rect id="listenerRetry" x="1235" y="812" width="350" height="70" rx="12" class="card recoveryCard"/>
  <text x="1410" y="840" text-anchor="middle" class="cardTitle">Listener retry</text>
  <text x="1263" y="864" class="cardText">replays fulfillment.reserve-stock</text>

  <rect id="unloadable" x="1235" y="914" width="350" height="58" rx="12" class="card warnCard"/>
  <text x="1410" y="938" text-anchor="middle" class="cardTitle">Unloadable event type</text>
  <text x="1263" y="962" class="cardText">inspect row; fail only on event access</text>

  <path id="flow-approve" data-connector="flow-approve" d="M 300 346 L 300 398" class="flowApp"/>
  <path id="flow-capture" data-connector="flow-capture" d="M 460 442 L 700 442" class="flowApp"/>
  <path id="flow-registry-listener" data-connector="flow-registry-listener" d="M 700 442 L 590 442 Q 570 442 570 462 L 570 620 Q 570 640 550 640 L 460 640" class="flowApp"/>
  <path id="flow-listener-reservation" data-connector="flow-listener-reservation" d="M 300 716 L 300 808" class="flowStore"/>

  <path id="flow-registry-repo" data-connector="flow-registry-repo" d="M 860 486 L 860 548" class="flowStore"/>
  <path id="flow-repo-table" data-connector="flow-repo-table" d="M 860 642 L 860 694" class="flowStore"/>
  <path id="flow-mark-failed" data-connector="flow-mark-failed" d="M 1030 595 L 1245 595" class="flowRecovery"/>

  <path id="flow-resubmit" data-connector="flow-resubmit" d="M 1410 636 L 1410 686" class="flowRecovery"/>
  <path id="flow-retry-listener" data-connector="flow-retry-listener" d="M 1410 768 L 1410 812" class="flowRecovery"/>
  <path id="flow-unloadable" data-connector="flow-unloadable" d="M 1025 752 L 1140 752 Q 1160 752 1160 772 L 1160 943 Q 1160 963 1180 963 L 1235 963" class="flowWarn"/>

  <text x="300" y="376" text-anchor="middle" class="label">publish</text>
  <text x="580" y="426" text-anchor="middle" class="label">capture</text>
  <text x="548" y="610" text-anchor="middle" class="label">after commit</text>
  <text x="300" y="764" text-anchor="middle" class="label">reserve</text>
  <text x="880" y="524" text-anchor="middle" class="label">SPI call</text>
  <text x="892" y="684" text-anchor="middle" class="label">write row</text>
  <text x="1138" y="582" text-anchor="middle" class="label">markFailed</text>
  <text x="1438" y="670" text-anchor="middle" class="label">filter</text>
  <text x="1438" y="796" text-anchor="middle" class="label">retry listener</text>
  <text x="1132" y="936" text-anchor="middle" class="label">migration guard</text>

  <text x="860" y="1024" text-anchor="middle" class="footer">Default path is fully local: Spring Boot, Spring Modulith, Exposed, and in-memory H2.</text>
</svg>
