<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" width="1280" height="820" role="img" aria-label="Entity class diagram for JPA IdClass migration to Exposed DAO">
  <defs>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="136%">
      <feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
    <marker id="dependencyArrow" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#8a6f4d" stroke="#8a6f4d" stroke-width="1.2" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="inheritArrow" viewBox="0 0 18 16" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="16" refX="17" refY="8" orient="auto">
      <path d="M 1 1 L 17 8 L 1 15 Z" fill="#ffffff" stroke="#60758d" stroke-width="2" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <style>
      .canvas{fill:#f6f9fc}
      .frame{fill:#ffffff;stroke:#d7e2ec;stroke-width:1.5}
      .lane{fill:#f8fafc;stroke:#d7e2ec;stroke-width:1.2}
      .card{fill:#ffffff;stroke-width:1.8;filter:url(#shadow)}
      .head{stroke-width:0}
      .title{font-family:"Architects Daughter";font-size:32px;fill:#1e293b}
      .subtitle{font-family:"Comic Mono";font-size:13px;fill:#536476}
      .laneTitle{font-family:"Architects Daughter";font-size:12px;letter-spacing:.08em;fill:#94a3b8}
      .classTitle{font-family:"Architects Daughter";font-size:18px;fill:#1e293b}
      .stereo{font-family:"Comic Mono";font-size:11px;fill:#64748b}
      .member{font-family:"Comic Mono";font-size:12px;fill:#475569}
      .emph{fill:#1e3a8a;font-weight:700}
      .factory{fill:#7c4a03;font-weight:700}
      .inherit{fill:none;stroke:#60758d;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#inheritArrow)}
      .depends{fill:none;stroke:#8a6f4d;stroke-width:1.8;stroke-linecap:butt;stroke-linejoin:round;stroke-dasharray:7 6;marker-end:url(#dependencyArrow)}
      .dependsShaft{fill:none;stroke:#8a6f4d;stroke-width:1.8;stroke-linecap:butt;stroke-linejoin:round;stroke-dasharray:7 6}
      .dependsHead{fill:#8a6f4d;stroke:#8a6f4d;stroke-width:1.2;stroke-linejoin:round;stroke-dasharray:none}
      .flow{fill:none;stroke:#5f8f86;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#dependencyArrow)}
      .legendBox{fill:#f8fafc;stroke:#d7e2ec;stroke-width:1.2}
      .legendText{font-family:"Comic Mono";font-size:12px;fill:#475569}
    </style>
  </defs>

  <rect width="1280" height="820" class="canvas"/>
  <rect x="20" y="20" width="1240" height="780" rx="16" class="frame"/>
  <text x="48" y="60" class="title">JPA @IdClass to Exposed DAO</text>
  <text x="48" y="83" class="subtitle">CompositeIdTable keeps key columns explicit while DAO code wraps CompositeID as a typed identifier</text>

  <rect x="54" y="124" width="1172" height="178" rx="12" class="lane"/>
  <text x="640" y="117" class="laneTitle" text-anchor="middle">EXPOSED BASE TYPES</text>

  <g id="base-composite-table" data-node="CompositeIdTable">
    <rect x="82" y="154" width="236" height="112" rx="10" class="card" stroke="#3b82f6"/>
    <path d="M82,190 L82,166 Q82,154 94,154 L306,154 Q318,154 318,166 L318,190 Z" class="head" fill="#dbeafe"/>
    <text x="200" y="181" class="classTitle" text-anchor="middle">CompositeIdTable</text>
    <text x="102" y="216" class="member">id columns use entityId()</text>
    <text x="102" y="236" class="member">primaryKey combines columns</text>
  </g>

  <g id="base-entity-id" data-node="EntityID">
    <rect x="376" y="154" width="236" height="112" rx="10" class="card" stroke="#8b5cf6"/>
    <path d="M376,190 L376,166 Q376,154 388,154 L600,154 Q612,154 612,166 L612,190 Z" class="head" fill="#ede9fe"/>
    <text x="494" y="181" class="classTitle" text-anchor="middle">EntityID&lt;CompositeID&gt;</text>
    <text x="396" y="216" class="member">table-bound identifier</text>
    <text x="396" y="236" class="member">value holds CompositeID</text>
  </g>

  <g id="base-composite-entity" data-node="CompositeEntity">
    <rect x="670" y="154" width="236" height="112" rx="10" class="card" stroke="#16a34a"/>
    <path d="M670,190 L670,166 Q670,154 682,154 L894,154 Q906,154 906,166 L906,190 Z" class="head" fill="#dcfce7"/>
    <text x="788" y="181" class="classTitle" text-anchor="middle">CompositeEntity</text>
    <text x="690" y="216" class="member">DAO entity base</text>
    <text x="690" y="236" class="member">id: EntityID&lt;CompositeID&gt;</text>
  </g>

  <g id="base-entity-class" data-node="CompositeEntityClass">
    <rect x="964" y="154" width="236" height="112" rx="10" class="card" stroke="#ea580c"/>
    <path d="M964,190 L964,166 Q964,154 976,154 L1188,154 Q1200,154 1200,166 L1200,190 Z" class="head" fill="#ffedd5"/>
    <text x="1082" y="181" class="classTitle" text-anchor="middle">CompositeEntityClass</text>
    <text x="984" y="216" class="member">factory/find API</text>
    <text x="984" y="236" class="member">bound to DAO table</text>
  </g>

  <rect x="54" y="344" width="1172" height="238" rx="12" class="lane"/>
  <text x="640" y="337" class="laneTitle" text-anchor="middle">IMPLEMENTATION TYPES</text>

  <g id="idclass-car-table" data-node="IdClassCarTable">
    <rect x="82" y="378" width="236" height="160" rx="10" class="card" stroke="#3b82f6"/>
    <path d="M82,414 L82,390 Q82,378 94,378 L306,378 Q318,378 318,390 L318,414 Z" class="head" fill="#dbeafe"/>
    <text x="200" y="405" class="classTitle" text-anchor="middle">IdClassCarTable</text>
    <text x="102" y="440" class="member emph">car_brand PK entityId()</text>
    <text x="102" y="460" class="member emph">car_year PK entityId()</text>
    <text x="102" y="480" class="member">serial_no varchar?</text>
    <text x="102" y="510" class="stereo">CompositeIdTable("car_table")</text>
  </g>

  <g id="car-identifier" data-node="CarIdentifier">
    <rect x="376" y="378" width="236" height="160" rx="10" class="card" stroke="#8b5cf6"/>
    <path d="M376,414 L376,390 Q376,378 388,378 L600,378 Q612,378 612,390 L612,414 Z" class="head" fill="#ede9fe"/>
    <text x="494" y="405" class="classTitle" text-anchor="middle">CarIdentifier</text>
    <text x="396" y="440" class="member">wraps CompositeID</text>
    <text x="396" y="460" class="member emph">brand getter</text>
    <text x="396" y="480" class="member emph">carYear getter</text>
    <text x="396" y="510" class="stereo">typed findById key</text>
  </g>

  <g id="idclass-car" data-node="IdClassCar">
    <rect x="670" y="378" width="236" height="160" rx="10" class="card" stroke="#16a34a"/>
    <path d="M670,414 L670,390 Q670,378 682,378 L894,378 Q906,378 906,390 L906,414 Z" class="head" fill="#dcfce7"/>
    <text x="788" y="405" class="classTitle" text-anchor="middle">IdClassCar</text>
    <text x="690" y="440" class="member">brand by table.brand</text>
    <text x="690" y="460" class="member">carYear by table.carYear</text>
    <text x="690" y="480" class="member">serialNo mutable</text>
    <text x="690" y="510" class="member emph">carIdentifier getter</text>
  </g>

  <g id="idclass-companion" data-node="IdClassCar.Companion">
    <rect x="964" y="378" width="236" height="160" rx="10" class="card" stroke="#ea580c"/>
    <path d="M964,414 L964,390 Q964,378 976,378 L1188,378 Q1200,378 1200,390 L1200,414 Z" class="head" fill="#ffedd5"/>
    <text x="1082" y="405" class="classTitle" text-anchor="middle">IdClassCar.Companion</text>
    <text x="984" y="440" class="member factory">new(brand, carYear)</text>
    <text x="984" y="460" class="member factory">carCompositeIdOf(...)</text>
    <text x="984" y="480" class="member">validates input</text>
    <text x="984" y="510" class="stereo">CompositeEntityClass&lt;IdClassCar&gt;</text>
  </g>

  <rect x="54" y="628" width="1172" height="92" rx="12" class="lane"/>
  <text x="640" y="621" class="laneTitle" text-anchor="middle">DAO LOOKUP CONTRACT</text>
  <g id="regression-contract" data-node="regression">
    <rect x="82" y="650" width="1118" height="48" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.6" filter="url(#shadow)"/>
    <text x="112" y="681" class="member">
      CompositeID creation, insertAndGetId, findById(CarIdentifier), select by id, and deleteWhere(id eq compositeId) stay covered by tests.
    </text>
  </g>

  <path id="table-inherits" class="inherit" data-connector="table-inherits" d="M200,378 L200,266"/>
  <path id="identifier-inherits" class="inherit" data-connector="identifier-inherits" d="M494,378 L494,266"/>
  <path id="entity-inherits" class="inherit" data-connector="entity-inherits" d="M788,378 L788,266"/>
  <path id="companion-inherits" class="inherit" data-connector="companion-inherits" d="M1082,378 L1082,266"/>

  <path id="entity-identifier-dependency" class="dependsShaft" data-connector="entity-identifier-dependency" d="M670,506 H626"/>
  <polygon id="entity-identifier-dependency-head" class="dependsHead" points="612,506 626,498 626,514" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <path id="companion-creates-entity" class="dependsShaft" data-connector="companion-creates-entity" d="M964,458 H920"/>
  <polygon id="companion-creates-entity-head" class="dependsHead" points="906,458 920,450 920,466" stroke-dasharray="none" style="stroke-dasharray:none!important"/>

  <rect x="82" y="738" width="660" height="40" rx="10" class="legendBox"/>
  <line x1="102" y1="758" x2="150" y2="758" class="inherit"/>
  <text x="164" y="762" class="legendText">solid hollow arrow = inherits / extends</text>
  <line x1="492" y1="758" x2="526" y2="758" class="dependsShaft"/>
  <polygon class="dependsHead" points="540,758 526,750 526,766" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <text x="554" y="762" class="legendText">dashed arrow = uses</text>
</svg>
