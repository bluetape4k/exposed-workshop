<svg xmlns="http://www.w3.org/2000/svg" width="998" height="540" viewBox="0 0 998 540" role="img" aria-label="Entity Class Diagram — JPA Entity vs Exposed DAO">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
    <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/>
  </filter>
  <marker id="openArrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
    <path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#758297" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>
  .canvas{fill:#f7f9fc}
  .frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
  .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:42px;font-weight:400;fill:#102033}
  .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
  .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:24px;font-weight:400;fill:#102033}
  .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:20px;font-weight:400;fill:#102033}
  .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
  .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
  .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
  .card{stroke-width:2;filter:url(#shadow)}
  .line{fill:none;stroke:#758297;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
  .dash{fill:none;stroke:#9aa6b8;stroke-width:1.6;stroke-linecap:round;stroke-dasharray:6 8}
  .note{fill:#ffffff;stroke:#d8e0ea;stroke-width:1.2}
</style>
</defs>

<rect class="canvas" x="0" y="0" width="998" height="100%"/>
<rect class="frame" x="20" y="20" width="958" height="500" rx="18"/>
<text class="title" x="54" y="72">Entity Class Diagram — JPA Entity vs Exposed</text>
<text class="title" x="54" y="116">DAO</text>
<text class="subtitle" x="56" y="144">Class and component responsibilities</text>
<rect class="card" x="43" y="184" width="280" height="138" rx="14" fill="#f7d9df" stroke="#d9899b"/>
<text class="smallLabel" x="183" y="220" text-anchor="middle">Person</text>
<line class="dash" x1="61" y1="246" x2="305" y2="246"/>
<rect class="card" x="359" y="184" width="280" height="138" rx="14" fill="#d9ecff" stroke="#7eaad3"/>
<text class="smallLabel" x="499" y="220" text-anchor="middle">«JPA Entity»</text>
<line class="dash" x1="377" y1="246" x2="621" y2="246"/>
<text class="mono" x="383" y="270">+ JPA_SimpleEntity</text>
<text class="mono" x="383" y="287">+ @Entity @Table(name=simple_entity)</text>
<text class="mono" x="383" y="304">+ @Id @GeneratedValue Long id</text>
<text class="mono" x="383" y="321">+ @Column String name</text>
<rect class="card" x="675" y="184" width="280" height="138" rx="14" fill="#dcf3e4" stroke="#7fb895"/>
<text class="smallLabel" x="815" y="220" text-anchor="middle">«Exposed DAO»</text>
<line class="dash" x1="693" y1="246" x2="937" y2="246"/>
<text class="mono" x="699" y="270">+ Exposed_PersonDAO</text>
<text class="mono" x="699" y="287">+ class Person : LongEntity</text>
<text class="mono" x="699" y="304">+ var address by ...ss referencedOn</text>
<text class="mono" x="699" y="321">+ addressId</text>
<rect class="card" x="43" y="356" width="280" height="138" rx="14" fill="#fff0c9" stroke="#d0a84e"/>
<text class="smallLabel" x="183" y="392" text-anchor="middle">SimpleEntity</text>
<line class="dash" x1="61" y1="418" x2="305" y2="418"/>
<rect class="card" x="359" y="356" width="280" height="138" rx="14" fill="#eadff8" stroke="#a287c8"/>
<text class="smallLabel" x="499" y="392" text-anchor="middle">«Exposed Table (DSL)»</text>
<line class="dash" x1="377" y1="418" x2="621" y2="418"/>
<text class="mono" x="383" y="442">+ Exposed_SimpleTable</text>
<text class="mono" x="383" y="459">+ object SimpleTable : LongIdTable</text>
<text class="mono" x="383" y="476">+ val name = varc...).uniqueIndex()</text>
<text class="mono" x="383" y="493">+ val description...xt().nullable()</text>
<rect class="card" x="675" y="356" width="280" height="138" rx="14" fill="#dff4f1" stroke="#75aaa3"/>
<text class="smallLabel" x="815" y="392" text-anchor="middle">«Exposed Entity (DAO)»</text>
<line class="dash" x1="693" y1="418" x2="937" y2="418"/>
<text class="mono" x="699" y="442">+ Exposed_SimpleEntity</text>
<text class="mono" x="699" y="459">+ class SimpleEntity : LongEntity</text>
<text class="mono" x="699" y="476">+ var name by SimpleTable.name</text>
<text class="mono" x="699" y="493">+ var description...ble.description</text>
</svg>
