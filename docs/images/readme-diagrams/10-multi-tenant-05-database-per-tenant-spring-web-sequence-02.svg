<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1620 1060" width="1620" height="1060" role="img" aria-label="Database-per-tenant Spring MVC request sequence">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/></filter>
    <marker id="arrowBlue" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" refX="9" refY="5" orient="auto" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#4f86c6" stroke="#4f86c6" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="arrowGreen" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" refX="9" refY="5" orient="auto" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6f8f58" stroke="#6f8f58" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="arrowAmber" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" refX="9" refY="5" orient="auto" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#a2743d" stroke="#a2743d" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="arrowPurple" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" refX="9" refY="5" orient="auto" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7a8445" stroke="#7a8445" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="arrowTeal" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" refX="9" refY="5" orient="auto" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2f9a94" stroke="#2f9a94" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="arrowGray" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" refX="9" refY="5" orient="auto" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6f8792" stroke="#6f8792" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <style>
      .canvas{fill:none}.frame{fill:#fbfcf8;stroke:#40545d;stroke-width:3}
      .title{font-family:"Architects Daughter";font-size:31px;fill:#1e293b}
      .subtitle,.detail{font-family:"Comic Mono";fill:#536476}
      .subtitle{font-size:13px}.detail{font-size:12px}.role{font-family:"Comic Mono";font-size:10.5px;fill:#60727d}
      .participant{font-family:"Architects Daughter";font-size:15.5px;fill:#1e293b}
      .card{stroke-width:1.7;filter:url(#shadow)}
      .header{fill:#ffffff;stroke:#b6d3ec;stroke-width:1.7;filter:url(#shadow)}
      .lifeline{stroke:#9cafb7;stroke-width:1.4;stroke-dasharray:5 6}
      .activation{fill:#f3ecdf;stroke:#8f784e;stroke-width:1.5}
      .call{fill:none;stroke:#4f86c6;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowBlue)}
      .contextCall{fill:none;stroke:#6f8f58;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowGreen)}
      .txCall{fill:none;stroke:#a2743d;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowAmber)}
      .repoCall{fill:none;stroke:#7a8445;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowPurple)}
      .sqlCall{fill:none;stroke:#2f9a94;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowTeal)}
      .returnLine{fill:none;stroke:#6f8792;stroke-width:2.2;stroke-dasharray:7 5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowGray)}
      .pill{stroke-width:1.6;filter:url(#shadow)}
      .badge{fill:#fff;stroke-width:1.4}
      .scope{fill:none;stroke:#8aa1ad;stroke-width:1.6;stroke-dasharray:9 7}
      .scopeTitle{fill:#fff;stroke:#8aa1ad;stroke-width:1.2}
      .note{fill:#fff;stroke:#d7e2ec;stroke-width:1.4}
    </style>
  </defs>
  <rect width="1620" height="1060" class="canvas"/>
  <rect x="20" y="20" width="1580" height="1020" rx="16" class="frame"/>
  <text x="48" y="58" class="title">Database-per-Tenant Request Flow</text>
  <text x="48" y="80" class="subtitle">TenantFilter chooses ACME or GLOBEX, then TenantTransaction opens Exposed work on that tenant's physical H2 database</text>

  <desc>Client</desc><rect x="42" y="128" width="118" height="62" rx="10" class="header card"/>
  <text x="101" y="156" class="participant" text-anchor="middle">Client</text>
  <text x="101" y="176" class="role" text-anchor="middle">HTTP caller</text>
  <line x1="101" y1="190" x2="101" y2="996" class="lifeline"/>

  <desc>TenantFilter</desc><rect x="196" y="128" width="154" height="62" rx="10" class="header card"/>
  <text x="273" y="156" class="participant" text-anchor="middle">TenantFilter</text>
  <text x="273" y="176" class="role" text-anchor="middle">validates header</text>
  <line x1="273" y1="190" x2="273" y2="996" class="lifeline"/>

  <desc>TenantContext</desc><rect x="386" y="128" width="158" height="62" rx="10" class="header card"/>
  <text x="465" y="156" class="participant" text-anchor="middle">TenantContext</text>
  <text x="465" y="176" class="role" text-anchor="middle">ThreadLocal</text>
  <line x1="465" y1="190" x2="465" y2="996" class="lifeline"/>

  <desc>InventoryController</desc><rect x="580" y="128" width="158" height="62" rx="10" class="header card"/>
  <text x="659" y="156" class="participant" text-anchor="middle">Controller</text>
  <text x="659" y="176" class="role" text-anchor="middle">/inventory</text>
  <line x1="659" y1="190" x2="659" y2="996" class="lifeline"/>

  <desc>InventoryService</desc><rect x="774" y="128" width="150" height="62" rx="10" class="header card"/>
  <text x="849" y="156" class="participant" text-anchor="middle">Service</text>
  <text x="849" y="176" class="role" text-anchor="middle">use case</text>
  <line x1="849" y1="190" x2="849" y2="996" class="lifeline"/>

  <desc>InventoryRepository</desc><rect x="960" y="128" width="166" height="62" rx="10" class="header card"/>
  <text x="1043" y="156" class="participant" text-anchor="middle">Repository</text>
  <text x="1043" y="176" class="role" text-anchor="middle">ExposedInventory</text>
  <line x1="1043" y1="190" x2="1043" y2="996" class="lifeline"/>

  <desc>TenantTransaction</desc><rect x="1162" y="128" width="160" height="62" rx="10" class="header card"/>
  <text x="1242" y="156" class="participant" text-anchor="middle">TenantTx</text>
  <text x="1242" y="176" class="role" text-anchor="middle">transaction()</text>
  <line x1="1242" y1="190" x2="1242" y2="996" class="lifeline"/>

  <desc>TenantDatabaseRegistry</desc><rect x="1358" y="128" width="156" height="62" rx="10" class="header card"/>
  <text x="1436" y="156" class="participant" text-anchor="middle">Registry</text>
  <text x="1436" y="176" class="role" text-anchor="middle">tenant Database</text>
  <line x1="1436" y1="190" x2="1436" y2="996" class="lifeline"/>

  <desc>TenantH2</desc><rect x="1530" y="128" width="74" height="62" rx="10" class="header card"/>
  <text x="1567" y="156" class="participant" text-anchor="middle">H2</text>
  <text x="1567" y="176" class="role" text-anchor="middle">ACME/GLOBEX</text>
  <line x1="1567" y1="190" x2="1567" y2="996" class="lifeline"/>

  <rect x="94" y="278" width="14" height="72" rx="6" class="activation"/>
  <rect x="266" y="304" width="14" height="600" rx="6" class="activation"/>
  <rect x="458" y="376" width="14" height="64" rx="6" class="activation"/>
  <rect x="652" y="454" width="14" height="324" rx="6" class="activation"/>
  <rect x="842" y="530" width="14" height="248" rx="6" class="activation"/>
  <rect x="1036" y="604" width="14" height="232" rx="6" class="activation"/>
  <rect x="1235" y="684" width="14" height="180" rx="6" class="activation"/>
  <rect x="1429" y="752" width="14" height="82" rx="6" class="activation"/>
  <rect x="1560" y="820" width="14" height="92" rx="6" class="activation"/>

  <rect x="50" y="232" width="370" height="34" rx="17" fill="#ffffff" stroke="#4f86c6" class="pill card"/>
  <circle cx="74" cy="249" r="14" class="badge" stroke="#4f86c6"/>
  <text x="74" y="254" class="detail" text-anchor="middle">1</text>
  <text x="99" y="255" class="detail">GET /inventory/{sku} with X-Tenant-ID</text>
  <path data-connector="client-enters-filter" d="M101,286 H273" class="call"/>

  <rect x="164" y="324" width="374" height="34" rx="17" fill="#ffffff" stroke="#6f8f58" class="pill card"/>
  <circle cx="188" cy="341" r="14" class="badge" stroke="#6f8f58"/>
  <text x="188" y="346" class="detail" text-anchor="middle">2</text>
  <text x="213" y="347" class="detail">resolve ACME/GLOBEX and set TenantId</text>
  <path data-connector="filter-sets-tenant-context" d="M273,376 H465" class="contextCall"/>

  <rect x="214" y="414" width="404" height="34" rx="17" fill="#ffffff" stroke="#4f86c6" class="pill card"/>
  <circle cx="238" cy="431" r="14" class="badge" stroke="#4f86c6"/>
  <text x="238" y="436" class="detail" text-anchor="middle">3</text>
  <text x="263" y="437" class="detail">filterChain.doFilter enters controller</text>
  <path data-connector="filter-dispatches-controller" d="M273,466 H659" class="call"/>

  <rect x="578" y="496" width="306" height="34" rx="17" fill="#ffffff" stroke="#4f86c6" class="pill card"/>
  <circle cx="602" cy="513" r="14" class="badge" stroke="#4f86c6"/>
  <text x="602" y="518" class="detail" text-anchor="middle">4</text>
  <text x="627" y="519" class="detail">service.findBySku(sku)</text>
  <path data-connector="controller-calls-service" d="M659,548 H849" class="call"/>

  <rect x="780" y="572" width="340" height="34" rx="17" fill="#ffffff" stroke="#7a8445" class="pill card"/>
  <circle cx="804" cy="589" r="14" class="badge" stroke="#7a8445"/>
  <text x="804" y="594" class="detail" text-anchor="middle">5</text>
  <text x="829" y="595" class="detail">repository.findBySku(sku)</text>
  <path data-connector="service-calls-repository" d="M849,624 H1043" class="repoCall"/>

  <rect x="1002" y="648" width="382" height="34" rx="17" fill="#ffffff" stroke="#a2743d" class="pill card"/>
  <circle cx="1026" cy="665" r="14" class="badge" stroke="#a2743d"/>
  <text x="1026" y="670" class="detail" text-anchor="middle">6</text>
  <text x="1051" y="671" class="detail">tenantTransaction.execute { ... }</text>
  <path data-connector="repository-enters-tenant-transaction" d="M1043,700 H1242" class="txCall"/>

  <rect x="1158" y="724" width="356" height="34" rx="17" fill="#ffffff" stroke="#a2743d" class="pill card"/>
  <circle cx="1182" cy="741" r="14" class="badge" stroke="#a2743d"/>
  <text x="1182" y="746" class="detail" text-anchor="middle">7</text>
  <text x="1207" y="747" class="detail">registry.databaseFor(currentTenant)</text>
  <path data-connector="transaction-asks-registry" d="M1242,776 H1436" class="txCall"/>

  <rect x="1018" y="778" width="566" height="166" rx="18" class="scope"/>
  <rect x="1060" y="758" width="270" height="34" rx="16" class="scopeTitle"/>
  <text x="1195" y="780" class="detail" text-anchor="middle">selected physical tenant database</text>

  <rect x="1270" y="814" width="330" height="34" rx="17" fill="#ffffff" stroke="#2f9a94" class="pill card"/>
  <circle cx="1294" cy="831" r="14" class="badge" stroke="#2f9a94"/>
  <text x="1294" y="836" class="detail" text-anchor="middle">8</text>
  <text x="1319" y="837" class="detail">transaction(selected Exposed Database)</text>
  <path data-connector="registry-selects-tenant-database" d="M1436,866 H1567" class="sqlCall"/>

  <rect x="1068" y="882" width="516" height="34" rx="17" fill="#ffffff" stroke="#2f9a94" class="pill card"/>
  <circle cx="1092" cy="899" r="14" class="badge" stroke="#2f9a94"/>
  <text x="1092" y="904" class="detail" text-anchor="middle">9</text>
  <text x="1117" y="905" class="detail">select inventory_items from tenant-local H2</text>
  <path data-connector="repository-selects-inventory" d="M1043,934 H1567" class="sqlCall"/>

  <rect x="168" y="884" width="338" height="34" rx="17" fill="#ffffff" stroke="#6f8f58" class="pill card"/>
  <circle cx="192" cy="901" r="14" class="badge" stroke="#6f8f58"/>
  <text x="192" y="906" class="detail" text-anchor="middle">10</text>
  <text x="220" y="907" class="detail">finally TenantContext.clear()</text>
  <path data-connector="filter-clears-tenant-context" d="M273,936 H465" class="contextCall"/>

  <path data-connector="controller-returns-response" d="M659,972 H273 H101" class="returnLine"/>

  <rect x="90" y="1000" width="1440" height="34" rx="14" class="note"/>
  <text x="810" y="1022" class="detail" text-anchor="middle">Missing or unknown tenants return before routing; accepted tenants never share a datasource or Hikari pool.</text>
</svg>
