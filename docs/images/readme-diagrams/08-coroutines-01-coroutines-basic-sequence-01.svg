<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 860" width="1420" height="860" role="img" aria-label="Coroutine Transaction Sequence">
<defs>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/></filter>
<marker id="arrowBlue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8 Z" fill="#2563eb"/></marker>
<marker id="arrowGreen" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8 Z" fill="#16a34a"/></marker>
<marker id="arrowPink" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8 Z" fill="#db2777"/></marker>
<marker id="arrowOrange" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8 Z" fill="#ea580c"/></marker>
<marker id="arrowPurple" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8 Z" fill="#7c3aed"/></marker>
<marker id="arrowGray" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8 Z" fill="#64748b"/></marker>
<style>
.canvas{fill:#f6f9fc}.frame{fill:#fff;stroke:#d7e2ec;stroke-width:1.5}
.title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:31px;fill:#1e293b}
.subtitle,.detail{font-family:"Comic Mono","Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;fill:#536476}
.subtitle{font-size:13px}.detail{font-size:12px}.tiny{font-family:"Comic Mono","Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:10px;fill:#64748b}
.label{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:16px;fill:#1e293b}
.panelTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:12px;letter-spacing:.08em;fill:#94a3b8}
.card{stroke-width:1.7;filter:url(#shadow)}.panel{fill:#f8fafc;stroke:#d7e2ec;stroke-width:1.2}
.arrow{fill:none;stroke:#2563eb;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowBlue)}
.mapLine{fill:none;stroke:#16a34a;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowGreen)}
.codecLine{fill:none;stroke:#db2777;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowPink)}
.dbUse{fill:none;stroke:#ea580c;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowOrange)}
.runtimeUse{fill:none;stroke:#7c3aed;stroke-width:1.9;stroke-dasharray:6 5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowPurple)}
.returnLine{fill:none;stroke:#64748b;stroke-width:1.7;stroke-dasharray:7 5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowGray)}
.altRegion{fill:#f8fafc;fill-opacity:.055;stroke:#94a3b8;stroke-opacity:.28;stroke-width:1.2;stroke-dasharray:8 7}
.lifeline{stroke:#cbd5e1;stroke-width:1.4;stroke-dasharray:5 6}
</style>
</defs>
<rect width="1420" height="860" class="canvas"/>
<rect x="20" y="20" width="1380" height="820" rx="16" class="frame"/>
<text x="48" y="58" class="title">Coroutine Transaction Sequence</text>
<text x="48" y="80" class="subtitle">Coroutine tests create tables, enter suspended transactions, use nested withSuspendTransaction lookup, and verify DB state</text>
<desc>Test</desc><rect x="38" y="130" width="144" height="54" rx="10" fill="#dbeafe" stroke="#3b82f6" class="card"/>
<text x="110" y="163" class="label" text-anchor="middle">Test</text>
<line x1="110" y1="184" x2="110" y2="720" class="lifeline"/>
<desc>Fixture</desc><rect x="258" y="130" width="144" height="54" rx="10" fill="#dbeafe" stroke="#3b82f6" class="card"/>
<text x="330" y="163" class="label" text-anchor="middle">Fixture</text>
<line x1="330" y1="184" x2="330" y2="720" class="lifeline"/>
<desc>Coroutine API</desc><rect x="498" y="130" width="144" height="54" rx="10" fill="#dbeafe" stroke="#3b82f6" class="card"/>
<text x="570" y="163" class="label" text-anchor="middle">Coroutine API</text>
<line x1="570" y1="184" x2="570" y2="720" class="lifeline"/>
<desc>JdbcTransaction</desc><rect x="748" y="130" width="144" height="54" rx="10" fill="#dbeafe" stroke="#3b82f6" class="card"/>
<text x="820" y="153" class="label" text-anchor="middle">Jdbc</text>
<text x="820" y="171" class="label" text-anchor="middle">Transaction</text>
<line x1="820" y1="184" x2="820" y2="720" class="lifeline"/>
<desc>Tester table</desc><rect x="998" y="130" width="144" height="54" rx="10" fill="#dbeafe" stroke="#3b82f6" class="card"/>
<text x="1070" y="163" class="label" text-anchor="middle">Tester table</text>
<line x1="1070" y1="184" x2="1070" y2="720" class="lifeline"/>
<desc>Assertions</desc><rect x="1218" y="130" width="144" height="54" rx="10" fill="#dbeafe" stroke="#3b82f6" class="card"/>
<text x="1290" y="163" class="label" text-anchor="middle">Assertions</text>
<line x1="1290" y1="184" x2="1290" y2="720" class="lifeline"/>
<rect x="520" y="520" width="830" height="220" rx="14" class="altRegion"/>
<text x="542" y="545" class="panelTitle">ALT: nested lookup / exception cleanup</text>
<rect x="86" y="222" width="246" height="46" rx="10" fill="#dcfce7" stroke="#16a34a" class="card"/>
<circle cx="109" cy="245" r="14" fill="#fff" stroke="#16a34a" stroke-width="1.4"/>
<text x="109" y="250" class="detail" text-anchor="middle">1</text>
<text x="134" y="251" class="detail">withTablesSuspending creates Tester table</text>
<path d="M110,276 L330,276" class="arrow"/>
<rect x="306" y="300" width="288" height="46" rx="10" fill="#ede9fe" stroke="#7c3aed" class="card"/>
<circle cx="329" cy="323" r="14" fill="#fff" stroke="#7c3aed" stroke-width="1.4"/>
<text x="329" y="328" class="detail" text-anchor="middle">2</text>
<text x="354" y="329" class="detail">newSuspendedTransaction opens suspend boundary</text>
<path d="M330,354 L570,354" class="arrow"/>
<rect x="546" y="378" width="300" height="46" rx="10" fill="#ccfbf1" stroke="#0f766e" class="card"/>
<circle cx="569" cy="401" r="14" fill="#fff" stroke="#0f766e" stroke-width="1.4"/>
<text x="569" y="406" class="detail" text-anchor="middle">3</text>
<text x="594" y="407" class="detail">insert/select runs inside JdbcTransaction</text>
<path d="M570,432 L820,432" class="arrow"/>
<rect x="796" y="456" width="298" height="46" rx="10" fill="#fef3c7" stroke="#d97706" class="card"/>
<circle cx="819" cy="479" r="14" fill="#fff" stroke="#d97706" stroke-width="1.4"/>
<text x="819" y="484" class="detail" text-anchor="middle">4</text>
<text x="844" y="485" class="detail">Tester.insert and selectAll touch table</text>
<path d="M820,510 L1070,510" class="dbUse"/>
<rect x="546" y="534" width="548" height="46" rx="10" fill="#e2e8f0" stroke="#64748b" class="card"/>
<circle cx="569" cy="557" r="14" fill="#fff" stroke="#64748b" stroke-width="1.4"/>
<text x="569" y="562" class="detail" text-anchor="middle">5</text>
<text x="594" y="563" class="detail">withSuspendTransaction nested lookup returns ResultRow or null</text>
<path d="M570,610 L820,610" class="runtimeUse"/>
<path d="M820,638 L1070,638" class="dbUse"/>
<path d="M1070,666 L820,666" class="returnLine"/>
<path d="M820,666 L1290,666" class="returnLine"/>
<rect x="1046" y="690" width="268" height="46" rx="10" fill="#fce7f3" stroke="#db2777" class="card"/>
<circle cx="1069" cy="713" r="14" fill="#fff" stroke="#db2777" stroke-width="1.4"/>
<text x="1069" y="718" class="detail" text-anchor="middle">6</text>
<text x="1094" y="719" class="detail">assert count, null, exception cleanup</text>
<rect x="110" y="780" width="1200" height="52" rx="10" fill="#ecfdf5" stroke="#86efac" stroke-width="1.3"/>
<text x="710" y="811" class="detail" text-anchor="middle">Sequence rule: calls are solid, returns are dashed, and cancellation/duplicate-key cleanup is verified through assertions rather than hidden in the DB box.</text>
</svg>
