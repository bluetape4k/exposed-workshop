<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 860" width="1420" height="860" role="img" aria-label="Coroutine transaction sequence">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
    <marker id="seqArrow-blue" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#3f7fa7" stroke="#3f7fa7" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="seqArrow-green" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#6f8f50" stroke="#6f8f50" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="seqArrow-teal" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#527f79" stroke="#527f79" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="seqArrow-amber" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#9a6b3e" stroke="#9a6b3e" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="seqArrow-red" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#a95d6a" stroke="#a95d6a" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <style>
      .canvas{fill:#f6f9fc}
      .frame{fill:#fff;stroke:#d7e2ec;stroke-width:1.5}
      .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:31px;fill:#1e293b}
      .subtitle,.detail{font-family:"Comic Mono","Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;fill:#536476}
      .subtitle{font-size:13px}.detail{font-size:12px}
      .participant{fill:#ffffff;stroke:#546977;stroke-width:1.7;filter:url(#shadow)}
      .participantTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:16px;fill:#1e293b}
      .participantRole{font-family:"Comic Mono","Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:11px;fill:#5b6d77}
      .lifeline{stroke:#9babb4;stroke-width:1.4;stroke-dasharray:5 6}
      .activation{fill:#f7efd9;stroke:#9a7b4f;stroke-width:1.4}
      .msgBlue{fill:none;stroke:#3f7fa7;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#seqArrow-blue)}
      .msgGreen{fill:none;stroke:#6f8f50;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#seqArrow-green)}
      .msgTeal{fill:none;stroke:#527f79;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#seqArrow-teal)}
      .msgAmber{fill:none;stroke:#9a6b3e;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#seqArrow-amber)}
      .msgRed{fill:none;stroke:#a95d6a;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#seqArrow-red)}
      .altRegion{fill:none;stroke:#8aa0ad;stroke-width:1.4;stroke-dasharray:8 7}
      .altHeader{fill:#f8fafc;stroke:#8aa0ad;stroke-width:1.1}
      .altText{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:13px;fill:#60758d}
      .pillText{font-family:"Comic Mono","Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;fill:#344653}
      .numText{font-family:"Comic Mono","Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:700}
      .footer{fill:#f8fafc;stroke:#d7e2ec;stroke-width:1.2}
    </style>
  </defs>

  <rect width="1420" height="860" class="canvas"/>
  <rect x="20" y="20" width="1380" height="820" rx="16" class="frame"/>
  <text x="48" y="58" class="title">Coroutine Transaction Sequence</text>
  <text x="48" y="80" class="subtitle">Coroutine tests create tables, enter suspended transactions, run nested lookups, and verify cleanup with assertions.</text>

  <g id="participants">
    <rect x="52" y="130" width="136" height="58" rx="10" class="participant"/>
    <text x="120" y="157" class="participantTitle participant-title" text-anchor="middle">Test</text>
    <text x="120" y="174" class="participantRole participant-sub" text-anchor="middle">runSuspendIO</text>
    <line x1="120" y1="188" x2="120" y2="760" class="lifeline"/>

    <rect x="272" y="130" width="136" height="58" rx="10" class="participant"/>
    <text x="340" y="157" class="participantTitle participant-title" text-anchor="middle">Fixture</text>
    <text x="340" y="174" class="participantRole participant-sub" text-anchor="middle">withTables</text>
    <line x1="340" y1="188" x2="340" y2="760" class="lifeline"/>

    <rect x="502" y="130" width="136" height="58" rx="10" class="participant"/>
    <text x="570" y="157" class="participantTitle participant-title" text-anchor="middle">Coroutine API</text>
    <text x="570" y="174" class="participantRole participant-sub" text-anchor="middle">suspend tx</text>
    <line x1="570" y1="188" x2="570" y2="760" class="lifeline"/>

    <rect x="752" y="130" width="136" height="58" rx="10" class="participant"/>
    <text x="820" y="157" class="participantTitle participant-title" text-anchor="middle">Jdbc Tx</text>
    <text x="820" y="174" class="participantRole participant-sub" text-anchor="middle">transaction</text>
    <line x1="820" y1="188" x2="820" y2="760" class="lifeline"/>

    <rect x="1002" y="130" width="136" height="58" rx="10" class="participant"/>
    <text x="1070" y="157" class="participantTitle participant-title" text-anchor="middle">Tester Tables</text>
    <text x="1070" y="174" class="participantRole participant-sub" text-anchor="middle">H2/Postgres</text>
    <line x1="1070" y1="188" x2="1070" y2="760" class="lifeline"/>

    <rect x="1222" y="130" width="136" height="58" rx="10" class="participant"/>
    <text x="1290" y="157" class="participantTitle participant-title" text-anchor="middle">Assertions</text>
    <text x="1290" y="174" class="participantRole participant-sub" text-anchor="middle">Kluent</text>
    <line x1="1290" y1="188" x2="1290" y2="760" class="lifeline"/>
  </g>

  <rect x="334" y="244" width="12" height="88" rx="6" class="activation"/>
  <rect x="564" y="326" width="12" height="114" rx="6" class="activation"/>
  <rect x="814" y="408" width="12" height="118" rx="6" class="activation"/>
  <rect x="1064" y="488" width="12" height="84" rx="6" class="activation"/>
  <rect x="814" y="606" width="12" height="88" rx="6" class="activation"/>
  <rect x="1284" y="704" width="12" height="54" rx="6" class="activation"/>

  <g id="m1" data-message="1">
    <rect class="pill" x="82" y="214" width="352" height="38" rx="19" fill="#eef5e8" stroke="#6f8f50" stroke-width="1.5"/>
    <circle cx="108" cy="233" r="16" fill="#ffffff" stroke="#6f8f50" stroke-width="1.5"/>
    <text x="108" y="238" class="numText num" fill="#58753d" text-anchor="middle">1</text>
    <text x="136" y="238" class="pillText labelText">withTablesSuspending creates tables</text>
    <path d="M120,260 L340,260" class="msgGreen callGreen" data-connector="m1"/>
  </g>

  <g id="m2" data-message="2">
    <rect class="pill" x="304" y="294" width="398" height="38" rx="19" fill="#eef4f8" stroke="#3f7fa7" stroke-width="1.5"/>
    <circle cx="330" cy="313" r="16" fill="#ffffff" stroke="#3f7fa7" stroke-width="1.5"/>
    <text x="330" y="318" class="numText num" fill="#2f6d91" text-anchor="middle">2</text>
    <text x="358" y="318" class="pillText labelText">newSuspendedTransaction opens boundary</text>
    <path d="M340,340 L570,340" class="msgBlue callBlue" data-connector="m2"/>
  </g>

  <g id="m3" data-message="3">
    <rect class="pill" x="534" y="374" width="366" height="38" rx="19" fill="#e9f4f1" stroke="#527f79" stroke-width="1.5"/>
    <circle cx="560" cy="393" r="16" fill="#ffffff" stroke="#527f79" stroke-width="1.5"/>
    <text x="560" y="398" class="numText num" fill="#416a65" text-anchor="middle">3</text>
    <text x="588" y="398" class="pillText labelText">insert/select runs in JdbcTransaction</text>
    <path d="M570,420 L820,420" class="msgTeal seq" data-connector="m3"/>
  </g>

  <g id="m4" data-message="4">
    <rect class="pill" x="784" y="454" width="330" height="38" rx="19" fill="#f8efe0" stroke="#9a6b3e" stroke-width="1.5"/>
    <circle cx="810" cy="473" r="16" fill="#ffffff" stroke="#9a6b3e" stroke-width="1.5"/>
    <text x="810" y="478" class="numText num" fill="#7b5634" text-anchor="middle">4</text>
    <text x="838" y="478" class="pillText labelText">Tester insert/select touches table</text>
    <path d="M820,500 L1070,500" class="msgAmber callAmber" data-connector="m4"/>
  </g>

  <rect x="520" y="552" width="806" height="204" rx="14" class="altRegion"/>
  <rect x="544" y="536" width="250" height="32" rx="8" class="altHeader"/>
  <text x="562" y="557" class="altText">ALT: nested lookup / exception cleanup</text>

  <g id="m5" data-message="5">
    <rect class="pill" x="532" y="574" width="452" height="38" rx="19" fill="#eef4f8" stroke="#3f7fa7" stroke-width="1.5"/>
    <circle cx="558" cy="593" r="16" fill="#ffffff" stroke="#3f7fa7" stroke-width="1.5"/>
    <text x="558" y="598" class="numText num" fill="#2f6d91" text-anchor="middle">5</text>
    <text x="586" y="598" class="pillText labelText">withSuspendTransaction nested lookup</text>
    <path d="M570,620 L820,620" class="msgBlue callBlue" data-connector="m5"/>
  </g>

  <g id="m6" data-message="6">
    <rect class="pill" x="784" y="636" width="356" height="38" rx="19" fill="#f8efe0" stroke="#9a6b3e" stroke-width="1.5"/>
    <circle cx="810" cy="655" r="16" fill="#ffffff" stroke="#9a6b3e" stroke-width="1.5"/>
    <text x="810" y="660" class="numText num" fill="#7b5634" text-anchor="middle">6</text>
    <text x="838" y="660" class="pillText labelText">select row, count, or duplicate-key check</text>
    <path d="M820,682 L1070,682" class="msgAmber callAmber" data-connector="m6"/>
  </g>

  <g id="m7" data-message="7">
    <rect class="pill" x="1016" y="700" width="336" height="38" rx="19" fill="#f7e9eb" stroke="#a95d6a" stroke-width="1.5"/>
    <circle cx="1042" cy="719" r="16" fill="#ffffff" stroke="#a95d6a" stroke-width="1.5"/>
    <text x="1042" y="724" class="numText num" fill="#8b4d58" text-anchor="middle">7</text>
    <text x="1070" y="724" class="pillText labelText">assert null/id/count and cleanup</text>
    <path d="M1070,746 L1290,746" class="msgRed callRed" data-connector="m7"/>
  </g>

  <rect x="110" y="792" width="1200" height="36" rx="10" class="footer"/>
  <text x="710" y="815" class="detail" text-anchor="middle">Calls stay color-matched to their numbered labels; cleanup is verified by assertions after nested suspended work.</text>
</svg>
