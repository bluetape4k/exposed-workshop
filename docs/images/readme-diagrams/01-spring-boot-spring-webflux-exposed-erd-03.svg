<text x="364" y="644" class="tiny">movieName</text>
<text x="364" y="659" class="tiny">actorCount</text>
<rect x="610" y="580" width="220" height="108" rx="4" fill="#fff" stroke="#0f766e" class="card"/>
<path d="M610,640 L610,584 Q610,580 614,580 L826,580 Q830,580 830,584 L830,640 Z" fill="#ccfbf1"/>
<text x="720" y="598" class="tiny" text-anchor="middle">&lt;&lt;record&gt;&gt;</text>
<text x="720" y="616" class="label" text-anchor="middle">MovieWithProducing</text>
<text x="720" y="633" class="label" text-anchor="middle">ActorRecord</text>
<path d="M610,640 H830" stroke="#0f766e" stroke-width="1.1"/>
<text x="624" y="658" class="tiny">movieName</text>
<text x="624" y="673" class="tiny">producerActorName</text>
<rect x="860" y="580" width="260" height="108" rx="4" fill="#fff" stroke="#16a34a" class="card"/>
<path d="M860,626 L860,584 Q860,580 864,580 L1116,580 Q1120,580 1120,584 L1120,626 Z" fill="#dcfce7"/>
<text x="990" y="598" class="tiny" text-anchor="middle">&lt;&lt;record&gt;&gt;</text>
<text x="990" y="616" class="label" text-anchor="middle">MovieWithActorRecord</text>
