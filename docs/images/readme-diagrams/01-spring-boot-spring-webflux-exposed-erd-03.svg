<rect x="934" y="146" width="230" height="90" rx="4" fill="#fff" stroke="#64748b" class="card"/>
<path d="M934,192 L934,150 Q934,146 938,146 L1160,146 Q1164,146 1164,150 L1164,192 Z" fill="#e2e8f0"/>
