<path d="M1000,236 L994,248 L1006,248 Z" class="inheritHead" stroke-dasharray="none" style="stroke-dasharray:none"/>
<path d="M1200,330 L1200,304 Q1200,296 1192,296 L1108,296 Q1100,296 1100,288 L1100,248" class="inherit"/>
<path d="M1100,236 L1094,248 L1106,248 Z" class="inheritHead" stroke-dasharray="none" style="stroke-dasharray:none"/>
<rect x="90" y="550" width="1280" height="160" rx="12" class="panel"/><text x="730" y="542" class="panelTitle" text-anchor="middle">DTO RECORDS</text>
