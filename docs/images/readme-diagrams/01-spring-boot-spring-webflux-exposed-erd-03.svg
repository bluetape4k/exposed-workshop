<path d="M1080,376 L1080,334 Q1080,330 1084,330 L1316,330 Q1320,330 1320,334 L1320,376 Z" fill="#fce7f3"/>
<text x="1200" y="348" class="tiny" text-anchor="middle">&lt;&lt;DAO&gt;&gt;</text>
<text x="1200" y="366" class="label" text-anchor="middle">ActorEntity</text>
