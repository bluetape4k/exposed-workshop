<path d="M350,626 L350,584 Q350,580 354,580 L576,580 Q580,580 580,584 L580,626 Z" fill="#fef3c7"/>
<text x="465" y="598" class="tiny" text-anchor="middle">&lt;&lt;record&gt;&gt;</text>
<text x="465" y="616" class="label" text-anchor="middle">MovieActorCountRecord</text>
