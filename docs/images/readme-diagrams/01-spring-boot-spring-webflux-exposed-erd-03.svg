<text x="874" y="644" class="tiny">movie</text>
<text x="874" y="659" class="tiny">actors: List&lt;ActorRecord&gt;</text>
<rect x="1150" y="580" width="190" height="108" rx="4" fill="#fff" stroke="#7c3aed" class="card"/>
<path d="M1150,626 L1150,584 Q1150,580 1154,580 L1336,580 Q1340,580 1340,584 L1340,626 Z" fill="#ede9fe"/>
<text x="1245" y="598" class="tiny" text-anchor="middle">&lt;&lt;record&gt;&gt;</text>
<text x="1245" y="616" class="label" text-anchor="middle">ActorRecord</text>
<path d="M1150,626 H1340" stroke="#7c3aed" stroke-width="1.1"/>
<text x="1164" y="644" class="tiny">id</text>
<text x="1164" y="659" class="tiny">firstName</text>
<text x="1164" y="674" class="tiny">lastName</text>
<path d="M330,390 L330,350 Q330,342 322,342 L209,342 Q201,342 201,334 L201,290" class="softArrow edge"/>
<text x="188" y="318" class="cardinality" text-anchor="middle">1</text>
<text x="318" y="378" class="cardinality" text-anchor="middle">N</text>
<text x="266" y="360" class="tiny" text-anchor="middle">movieId</text>
<path d="M400,390 L400,350 Q400,342 408,342 L477,342 Q485,342 485,334 L485,290" class="softArrow edge"/>
<text x="502" y="318" class="cardinality" text-anchor="middle">1</text>
<text x="412" y="378" class="cardinality" text-anchor="middle">N</text>
<text x="444" y="360" class="tiny" text-anchor="middle">actorId</text>
<path d="M900,450 L900,524 Q900,532 908,532 L982,532 Q990,532 990,540 L990,580" class="movieMap edge"/>
<path d="M1200,450 L1200,524 Q1200,532 1208,532 L1237,532 Q1245,532 1245,540 L1245,580" class="actorMap edge"/>
<rect x="180" y="760" width="1100" height="48" rx="10" fill="#ecfdf5" stroke="#86efac" stroke-width="1.3"/>
<text x="730" y="790" class="detail" text-anchor="middle">The WebFlux module shares the Movie/Actor schema with MVC; coroutine controllers return records instead of Exposed entities.</text>
</svg>
