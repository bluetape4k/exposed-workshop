<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1120" width="1500" height="1120" role="img" aria-label="JDBC Lettuce 캐시 read-through와 write-through 시퀀스">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/></filter>
    <marker id="arrowBlue" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" orient="auto" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#4f86c6" stroke="#4f86c6" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="arrowGreen" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" orient="auto" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6f8f58" stroke="#6f8f58" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="arrowAmber" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" orient="auto" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#a2743d" stroke="#a2743d" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="arrowTeal" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" orient="auto" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2f9a94" stroke="#2f9a94" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="arrowRed" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" orient="auto" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b45b68" stroke="#b45b68" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <style>
      .frame{fill:#fbfcf8;stroke:#40545d;stroke-width:3}.title{font-family:"goorm Sans",sans-serif;font-size:34px;fill:#1e293b}.subtitle,.detail{font-family:"goorm Sans Code","goorm Sans",monospace;fill:#536476}.subtitle{font-size:15px}.detail{font-size:14px}.participant{font-family:"goorm Sans",sans-serif;font-size:18px;fill:#1e293b}.role{font-family:"goorm Sans Code","goorm Sans",monospace;font-size:12px;fill:#60727d}.header{fill:#fff;stroke:#b6d3ec;stroke-width:1.8;filter:url(#shadow)}.lifeline{stroke:#9cafb7;stroke-width:1.5;stroke-dasharray:6 7}.activation{fill:#f3ecdf;stroke:#8f784e;stroke-width:1.6}.call,.read{fill:none;stroke:#4f86c6;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowBlue)}.write{fill:none;stroke:#6f8f58;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowGreen)}.db{fill:none;stroke:#a2743d;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowAmber)}.return{fill:none;stroke:#2f9a94;stroke-width:2.5;stroke-dasharray:8 5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowTeal)}.error{fill:none;stroke:#b45b68;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowRed)}.pill{fill:#fff;stroke-width:1.5;filter:url(#shadow)}.badge{fill:#fff;stroke-width:1.5}.scope{fill:none;stroke:#8aa1ad;stroke-width:1.7;stroke-dasharray:9 7}.scopeTitle{fill:#fff;stroke:#8aa1ad;stroke-width:1.2}.note{fill:#fff;stroke:#d7e2ec;stroke-width:1.4}
    </style>
  </defs>
  <rect x="18" y="18" width="1464" height="1084" rx="18" class="frame"/>
  <text x="52" y="62" class="title">JDBC Lettuce Read-Through / Write-Through</text>
  <text x="52" y="88" class="subtitle">캐시 miss는 ProductTable로 fallback하고, write는 Redis SET/pipeline 전에 JDBC를 commit하며 분산 transaction은 주장하지 않습니다.</text>

  <g data-participant="caller"><rect x="58" y="126" width="180" height="64" rx="10" class="header"/><text x="148" y="155" class="participant" text-anchor="middle">Caller</text><text x="148" y="176" class="role" text-anchor="middle">sync / suspend</text><line x1="148" y1="190" x2="148" y2="1030" class="lifeline"/></g>
  <g data-participant="repository"><rect x="300" y="126" width="250" height="64" rx="10" class="header"/><text x="425" y="155" class="participant" text-anchor="middle">ProductJdbcLettuceRepository</text><text x="425" y="176" class="role" text-anchor="middle">provider subclass</text><line x1="425" y1="190" x2="425" y2="1030" class="lifeline"/></g>
  <g data-participant="cache"><rect x="610" y="126" width="190" height="64" rx="10" class="header"/><text x="705" y="155" class="participant" text-anchor="middle">LoadedMap</text><text x="705" y="176" class="role" text-anchor="middle">원격 캐시</text><line x1="705" y1="190" x2="705" y2="1030" class="lifeline"/></g>
  <g data-participant="database"><rect x="860" y="126" width="190" height="64" rx="10" class="header"/><text x="955" y="155" class="participant" text-anchor="middle">ProductTable</text><text x="955" y="176" class="role" text-anchor="middle">H2 JDBC</text><line x1="955" y1="190" x2="955" y2="1030" class="lifeline"/></g>
  <g data-participant="redis"><rect x="1110" y="126" width="190" height="64" rx="10" class="header"/><text x="1205" y="155" class="participant" text-anchor="middle">Redis</text><text x="1205" y="176" class="role" text-anchor="middle">Lettuce server</text><line x1="1205" y1="190" x2="1205" y2="1030" class="lifeline"/></g>
  <g data-participant="owner"><rect x="1360" y="126" width="110" height="64" rx="10" class="header"/><text x="1415" y="155" class="participant" text-anchor="middle">Owner</text><text x="1415" y="176" class="role" text-anchor="middle">ShutdownQueue</text><line x1="1415" y1="190" x2="1415" y2="1030" class="lifeline"/></g>

  <rect x="140" y="238" width="16" height="220" rx="7" class="activation"/><rect x="417" y="270" width="16" height="760" rx="7" class="activation"/><rect x="697" y="350" width="16" height="370" rx="7" class="activation"/><rect x="947" y="510" width="16" height="90" rx="7" class="activation"/><rect x="1197" y="350" width="16" height="390" rx="7" class="activation"/>

  <rect x="560" y="350" width="790" height="350" rx="18" class="scope"/><rect x="584" y="332" width="300" height="32" rx="16" class="scopeTitle"/><text x="734" y="353" class="detail" text-anchor="middle">alt: cache hit / miss / Redis 오류</text><line x1="580" y1="598" x2="1330" y2="598" class="scope"/>

  <rect x="60" y="214" width="272" height="34" rx="17" class="pill" stroke="#4f86c6"/><circle cx="84" cy="231" r="14" class="badge" stroke="#4f86c6"/><text x="84" y="236" class="detail" text-anchor="middle">1</text><text x="108" y="237" class="detail">get(id)</text><path data-connector="caller-get" data-source="caller" data-target="repository" d="M148 260 H425" class="call"/>
  <rect x="338" y="294" width="310" height="34" rx="17" class="pill" stroke="#4f86c6"/><circle cx="362" cy="311" r="14" class="badge" stroke="#4f86c6"/><text x="362" y="316" class="detail" text-anchor="middle">2</text><text x="386" y="317" class="detail">cache.get(product-id)</text><path data-connector="repository-cache-get" data-source="repository" data-target="cache" d="M425 342 H705" class="read"/>
  <rect x="505" y="374" width="358" height="34" rx="17" class="pill" stroke="#4f86c6"/><circle cx="529" cy="391" r="14" class="badge" stroke="#4f86c6"/><text x="529" y="396" class="detail" text-anchor="middle">3</text><text x="553" y="397" class="detail">GET workshop:products:product-id</text><path data-connector="cache-redis-get" data-source="cache" data-target="redis" d="M705 422 H1205" class="read"/>
  <rect x="554" y="454" width="280" height="34" rx="17" class="pill" stroke="#a2743d"/><circle cx="578" cy="471" r="14" class="badge" stroke="#a2743d"/><text x="578" y="476" class="detail" text-anchor="middle">4</text><text x="602" y="477" class="detail">miss → SELECT ProductTable</text><path data-connector="cache-db-miss" data-source="cache" data-target="database" d="M705 502 H955" class="db"/>
  <rect x="684" y="534" width="342" height="34" rx="17" class="pill" stroke="#2f9a94"/><circle cx="708" cy="551" r="14" class="badge" stroke="#2f9a94"/><text x="708" y="556" class="detail" text-anchor="middle">5</text><text x="732" y="557" class="detail">ProductRecord 반환</text><path data-connector="database-cache-return" data-source="database" data-target="cache" d="M955 582 H705" class="return"/>
  <rect x="674" y="614" width="346" height="34" rx="17" class="pill" stroke="#6f8f58"/><circle cx="698" cy="631" r="14" class="badge" stroke="#6f8f58"/><text x="698" y="636" class="detail" text-anchor="middle">6</text><text x="722" y="637" class="detail">SETEX (best effort)</text><path data-connector="cache-redis-fill" data-source="cache" data-target="redis" d="M705 662 H1205" class="write"/>
  <rect x="62" y="734" width="310" height="34" rx="17" class="pill" stroke="#4f86c6"/><circle cx="86" cy="751" r="14" class="badge" stroke="#4f86c6"/><text x="86" y="756" class="detail" text-anchor="middle">7</text><text x="110" y="757" class="detail">put(id, ProductRecord)</text><path data-connector="caller-put" data-source="caller" data-target="repository" d="M148 782 H425" class="call"/>
  <rect x="350" y="814" width="358" height="34" rx="17" class="pill" stroke="#a2743d"/><circle cx="374" cy="831" r="14" class="badge" stroke="#a2743d"/><text x="374" y="836" class="detail" text-anchor="middle">8</text><text x="398" y="837" class="detail">JDBC transaction UPDATE</text><path data-connector="repository-db-update" data-source="repository" data-target="database" d="M425 862 H955" class="db"/>
  <rect x="594" y="894" width="346" height="34" rx="17" class="pill" stroke="#6f8f58"/><circle cx="618" cy="911" r="14" class="badge" stroke="#6f8f58"/><text x="618" y="916" class="detail" text-anchor="middle">9</text><text x="642" y="917" class="detail">commit 후 Redis pipeline</text><path data-connector="repository-redis-write" data-source="repository" data-target="redis" d="M425 942 H1205" class="write"/>
  <rect x="610" y="970" width="382" height="34" rx="17" class="pill" stroke="#b45b68"/><circle cx="634" cy="987" r="14" class="badge" stroke="#b45b68"/><text x="634" y="992" class="detail" text-anchor="middle">10</text><text x="658" y="993" class="detail">Redis error → DB 결과 유지</text><path data-connector="redis-error-fallback" data-source="redis" data-target="repository" d="M1205 1018 H425" class="error"/>
  <path data-connector="owner-shutdown" data-source="owner" data-target="redis" d="M1415 970 H1205" class="return"/>
  <rect x="1100" y="1018" width="300" height="30" rx="15" class="pill" stroke="#2f9a94"/><text x="1250" y="1038" class="detail" text-anchor="middle">11  repository 후 close</text>
  <rect x="88" y="1062" width="1324" height="30" rx="14" class="note"/><text x="750" y="1083" class="detail" text-anchor="middle">캐시 명령 실패는 제한된 fallback이며, 이후 Redis SET/pipeline 실패가 DB commit을 되돌리지는 않습니다.</text>
</svg>
