<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 720" width="1160" height="720" role="img" aria-label="Vert.x SQL Client ERD">
<defs>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/></filter>
<style>
.canvas{fill:#f6f9fc}.frame{fill:#fff;stroke:#d7e2ec;stroke-width:1.5}
.title{font-family:"Architects Daughter";font-size:31px;fill:#1e293b}
.subtitle,.detail{font-family:"Comic Mono";fill:#536476}
.subtitle{font-size:13px}.detail{font-size:12px}.tiny{font-family:"Comic Mono";font-size:10px;fill:#64748b}
.label{font-family:"Architects Daughter";font-size:17px;fill:#1e293b}
.panelTitle{font-family:"Architects Daughter";font-size:12px;letter-spacing:.08em;fill:#94a3b8}
.card{stroke-width:1.7;filter:url(#shadow)}.panel{fill:#f8fafc;stroke:#d7e2ec;stroke-width:1.2}
.arrow{fill:none;stroke:#64748b;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
.queryUse{fill:none;stroke:#2563eb;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowBlue)}
.mapUse{fill:none;stroke:#16a34a;stroke-width:1.8;stroke-dasharray:5 5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowGreen)}
.runtimeUse{fill:none;stroke:#7c3aed;stroke-width:1.8;stroke-dasharray:5 5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowPurple)}
.dbUse{fill:none;stroke:#ea580c;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowOrange)}
.fkArrow{fill:none;stroke:#0f766e;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowTeal)}
.assoc{fill:none;stroke:#0f766e;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.inherit{fill:none;stroke:#475569;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.inheritHead{fill:#fff;stroke:#475569;stroke-width:1.4;stroke-dasharray:none;style:stroke-dasharray:none!important;stroke-linejoin:round}
</style>
</defs>
<rect width="1160" height="720" class="canvas"/>
<rect x="20" y="20" width="1120" height="680" rx="16" class="frame"/>
<text x="48" y="58" class="title">Vert.x SQL Client ERD</text>
<text x="48" y="80" class="subtitle">The examples create SQL tables directly; no ORM metadata or foreign keys are inferred</text>
<rect x="74" y="128" width="424" height="300" rx="12" class="panel"/><text x="286" y="120" class="panelTitle" text-anchor="middle">H2 SETUP TABLE</text>
<rect x="120" y="170" width="330" height="150" rx="12" fill="#fff" stroke="#ea580c" class="card"/>
<path d="M120,212 L120,182 Q120,170 132,170 L438,170 Q450,170 450,182 L450,212 Z" fill="#ffedd5"/>
<text x="285" y="198" class="label" text-anchor="middle">test</text>
<text x="138" y="240" class="tiny">id INT PK</text>
<text x="138" y="257" class="tiny">name VARCHAR(255)</text>
<text x="138" y="274" class="tiny">seed rows: Hello, World</text>
<rect x="142" y="350" width="286" height="46" rx="10" fill="#dbeafe" stroke="#3b82f6" class="card"/>
<text x="285" y="369" class="label" text-anchor="middle">Created in</text>
<text x="285" y="387" class="label" text-anchor="middle">JDBCPoolExamples.beforeAll</text>
<rect x="620" y="128" width="424" height="372" rx="12" class="panel"/><text x="832" y="120" class="panelTitle" text-anchor="middle">POSTGRESQL SQLTEMPLATE TABLE</text>
<rect x="666" y="170" width="330" height="202" rx="12" fill="#fff" stroke="#0f766e" class="card"/>
<path d="M666,212 L666,182 Q666,170 678,170 L984,170 Q996,170 996,182 L996,212 Z" fill="#ccfbf1"/>
<text x="831" y="198" class="label" text-anchor="middle">customers</text>
<text x="684" y="240" class="tiny">id BIGINT PK</text>
<text x="684" y="257" class="tiny">first_name VARCHAR(255) NOT NULL</text>
<text x="684" y="274" class="tiny">last_name VARCHAR(255) NOT NULL</text>
<text x="684" y="291" class="tiny">email VARCHAR(255) NULL</text>
<text x="684" y="308" class="tiny">mobile VARCHAR(255) NULL</text>
<text x="684" y="325" class="tiny">age INT NULL</text>
<rect x="690" y="406" width="282" height="54" rx="10" fill="#fce7f3" stroke="#db2777" class="card"/>
<text x="831" y="431" class="label" text-anchor="middle">Created in setup</text>
<text x="831" y="446" class="detail" text-anchor="middle">SqlClientTemplatePostgresExamples</text>
<rect x="180" y="536" width="796" height="72" rx="12" class="panel"/><text x="578" y="528" class="panelTitle" text-anchor="middle">RELATIONSHIP RULE</text>
<text x="578" y="580" class="detail" text-anchor="middle">No FK line is drawn: the current source creates two independent example schemas.</text>
<rect x="504" y="242" width="132" height="30" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
<text x="570" y="262" class="tiny" text-anchor="middle">separate schemas</text>
</svg>
