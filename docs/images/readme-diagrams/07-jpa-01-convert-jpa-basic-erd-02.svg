<g class="cardinality" data-cardinality="1 : 1"><rect class="badgeBox" x="656" y="216" width="78" height="24" rx="8"/><text class="badgeText" x="695" y="234" text-anchor="middle">1 : 1</text></g>
<path class="connector" d="M450 320 V380 Q450 392 438 392 H230 Q218 392 218 404 V420"/>
<g class="cardinality" data-cardinality="1 : N"><rect class="badgeBox" x="341" y="356" width="78" height="24" rx="8"/><text class="badgeText" x="380" y="374" text-anchor="middle">1 : N</text></g>
<path class="connector" d="M540 320 V420"/>
