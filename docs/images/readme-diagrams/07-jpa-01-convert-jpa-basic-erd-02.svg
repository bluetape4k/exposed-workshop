<text x="110" y="736" class="tiny">zip varchar</text>
</g>
<g data-card="Person Table"><rect x="432" y="600" width="280" height="150" rx="14" fill="#fff" stroke="#4f86c6" class="card"/><path class="header" d="M432,644 L432,614 Q432,600 446,600 L698,600 Q712,600 712,614 L712,644 Z" fill="#eef5fa"/><text x="572.0" y="629" text-anchor="middle" class="smallLabel">Person Table</text>
