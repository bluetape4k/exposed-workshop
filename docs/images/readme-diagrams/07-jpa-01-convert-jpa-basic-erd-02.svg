<text x="472" y="505" class="tiny">post_id FK → Post.id</text>
<text x="472" y="522" class="tiny">tag_id FK → Tag.id</text>
</g>
<g data-card="Tag Table"><rect x="1040" y="420" width="260" height="120" rx="14" fill="#fff" stroke="#a85f7f" class="card"/><path class="header" d="M1040,464 L1040,434 Q1040,420 1054,420 L1286,420 Q1300,420 1300,434 L1300,464 Z" fill="#f5eef2"/><text x="1170.0" y="449" text-anchor="middle" class="smallLabel">Tag Table</text>
