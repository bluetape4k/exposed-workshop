<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 780" width="1180" height="780" role="img" aria-label="SimpleSchema ERD">
<defs>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/></filter>
<marker id="arrowBlue" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#4f86c6" stroke="#4f86c6" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
<marker id="arrowGreen" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#6e8f4f" stroke="#6e8f4f" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
<marker id="arrowPurple" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#7d61b3" stroke="#7d61b3" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
<style>
.canvas{fill:#f6f9fc}.frame{fill:#fff;stroke:#d7e2ec;stroke-width:1.5}
.title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:31px;fill:#1e293b}
.subtitle,.detail{font-family:"Comic Mono","Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;fill:#536476}
.subtitle{font-size:13px}.detail{font-size:12px}.tiny{font-family:"Comic Mono","Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:10px;fill:#64748b}
.label{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:17px;fill:#1e293b}
.panelTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:12px;letter-spacing:.08em;fill:#94a3b8}
.card{stroke-width:1.7;filter:url(#shadow)}.tableBox{fill:#fff;stroke:#3b82f6;stroke-width:1.8;filter:url(#shadow)}
.tableHead{fill:#dbeafe}.rowLine{stroke:#d7e2ec;stroke-width:1}
.arrow{fill:none;stroke:#4f86c6;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowBlue)}
.mapLine{fill:none;stroke:#6e8f4f;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowGreen)}
.runtimeUse{fill:none;stroke:#7d61b3;stroke-width:1.9;stroke-dasharray:6 5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowPurple)}
</style>
</defs>
<rect width="1180" height="780" class="canvas"/>
<rect x="20" y="20" width="1140" height="740" rx="16" class="frame"/>
<text x="48" y="58" class="title">SimpleSchema ERD</text>
<text x="48" y="80" class="subtitle">SimpleSchema defines one Exposed LongIdTable, one DAO entity, and two projection paths over the same simple_entity table.</text>

<rect x="88" y="144" width="390" height="312" rx="12" class="tableBox"/>
<path d="M88,188 L88,156 Q88,144 100,144 L466,144 Q478,144 478,156 L478,188 Z" class="tableHead"/>
<text x="283" y="171" class="label" text-anchor="middle">simple_entity</text>
<text x="112" y="220" class="detail">PK</text>
<text x="164" y="220" class="detail">id</text>
<text x="302" y="220" class="detail">BIGSERIAL</text>
<line x1="108" y1="240" x2="458" y2="240" class="rowLine"/>
<text x="112" y="270" class="detail">UQ</text>
<text x="164" y="270" class="detail">name</text>
<text x="302" y="270" class="detail">VARCHAR(255) NOT NULL</text>
<line x1="108" y1="290" x2="458" y2="290" class="rowLine"/>
<text x="112" y="320" class="detail">NULL</text>
<text x="164" y="320" class="detail">description</text>
<text x="302" y="320" class="detail">TEXT</text>
<line x1="108" y1="340" x2="458" y2="340" class="rowLine"/>
<text x="112" y="374" class="tiny">Constraint</text>
<text x="206" y="374" class="tiny">uniqueIndex(name)</text>
<text x="112" y="398" class="tiny">No FK</text>
<text x="206" y="398" class="tiny">no relationship columns in SimpleTable</text>

<rect x="656" y="130" width="382" height="100" rx="10" fill="#dcfce7" stroke="#16a34a" class="card"/>
<text x="847" y="160" class="label" text-anchor="middle">SimpleTable : LongIdTable</text>
<text x="847" y="188" class="detail" text-anchor="middle">varchar(name, 255).uniqueIndex()</text>
<text x="847" y="210" class="detail" text-anchor="middle">text(description).nullable()</text>

<rect x="656" y="292" width="382" height="100" rx="10" fill="#ede9fe" stroke="#7c3aed" class="card"/>
<text x="847" y="322" class="label" text-anchor="middle">SimpleEntity : LongEntity</text>
<text x="847" y="350" class="detail" text-anchor="middle">var name by SimpleTable.name</text>
<text x="847" y="372" class="detail" text-anchor="middle">var description by SimpleTable.description</text>

<rect x="656" y="454" width="382" height="100" rx="10" fill="#fef3c7" stroke="#d97706" class="card"/>
<text x="847" y="484" class="label" text-anchor="middle">SimpleRecord</text>
<text x="847" y="512" class="detail" text-anchor="middle">id, name, description</text>
<text x="847" y="534" class="detail" text-anchor="middle">Entity and ResultRow projections</text>

<rect x="88" y="536" width="390" height="82" rx="10" fill="#f8fafc" stroke="#cbd5e1" class="card"/>
<text x="283" y="566" class="label" text-anchor="middle">CRUD tests</text>
<text x="283" y="594" class="detail" text-anchor="middle">Ex01_Simple_DSL and Ex02_Simple_DAO share this table.</text>

<path data-connector="simple-table-defines-simple-entity-table" d="M656,180 L560,180 Q548,180 548,192 L548,244 Q548,256 536,256 L478,256" class="mapLine"/>
<path data-connector="simple-entity-maps-table" d="M656,342 L560,342 Q548,342 548,330 L548,306 Q548,294 536,294 L478,294" class="arrow"/>
<path data-connector="simple-record-projects-table" d="M656,504 L560,504 Q548,504 548,492 L548,326 Q548,314 536,314 L478,314" class="runtimeUse"/>
<path data-connector="crud-tests-use-simple-table" d="M283,536 L283,456" class="runtimeUse"/>

<rect x="106" y="672" width="968" height="54" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.3"/>
<path d="M148,696 L208,696" class="mapLine"/><text x="228" y="700" class="tiny">green = Table DSL to columns</text>
<path d="M456,696 L516,696" class="arrow"/><text x="536" y="700" class="tiny">blue = DAO delegates to columns</text>
<path d="M794,696 L854,696" class="runtimeUse"/><text x="874" y="700" class="tiny">dashed purple = tests/projections</text>
</svg>
