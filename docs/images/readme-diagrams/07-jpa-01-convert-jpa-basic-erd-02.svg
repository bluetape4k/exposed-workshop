<g data-card="Post Table"><rect x="370" y="200" width="280" height="120" rx="14" fill="#fff" stroke="#8a6f55" class="card"/><path class="header" d="M370,244 L370,214 Q370,200 384,200 L636,200 Q650,200 650,214 L650,244 Z" fill="#f3eee8"/><text x="510.0" y="229" text-anchor="middle" class="smallLabel">Post Table</text>
<text x="392" y="268" class="tiny">id PK</text>
<text x="392" y="285" class="tiny">title varchar</text>
</g>
<g data-card="Post Detail Table"><rect x="740" y="200" width="280" height="120" rx="14" fill="#fff" stroke="#6f8f52" class="card"/><path class="header" d="M740,244 L740,214 Q740,200 754,200 L1006,200 Q1020,200 1020,214 L1020,244 Z" fill="#f1f6ec"/><text x="880.0" y="229" text-anchor="middle" class="smallLabel">Post Detail Table</text>
<text x="762" y="268" class="tiny">id PK/FK → Post.id</text>
<text x="762" y="285" class="tiny">created_on date</text>
<text x="762" y="302" class="tiny">created_by varchar</text>
</g>
