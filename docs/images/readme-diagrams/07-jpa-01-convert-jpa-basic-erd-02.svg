<rect x="56" y="840" width="1328" height="250" rx="18" class="panel"/>
<g data-card="Simple Table"><rect x="110" y="910" width="250" height="150" rx="14" fill="#fff" stroke="#4f86c6" class="card"/><path class="header" d="M110,874 L110,844 Q110,830 124,830 L346,830 Q360,830 360,844 L360,874 Z" fill="#eef5fa"/><text x="235.0" y="859" text-anchor="middle" class="smallLabel">Simple Table</text>
