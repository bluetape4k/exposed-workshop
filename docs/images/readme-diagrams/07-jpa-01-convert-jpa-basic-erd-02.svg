<text x="112" y="488" class="tiny">id PK</text>
<text x="112" y="505" class="tiny">post_id FK → Post.id</text>
<text x="112" y="522" class="tiny">review varchar</text>
</g>
<g data-card="Post Tag Table"><rect x="450" y="420" width="280" height="136" rx="14" fill="#fff" stroke="#4f8f8b" class="card"/><path class="header" d="M450,464 L450,434 Q450,420 464,420 L716,420 Q730,420 730,434 L730,464 Z" fill="#eef7f6"/><text x="590.0" y="449" text-anchor="middle" class="smallLabel">Post Tag Table</text>
