</g>
<g data-card="Publishers"><rect x="1040" y="910" width="250" height="150" rx="14" fill="#fff" stroke="#a66a3f" class="card"/><path class="header" d="M1040,874 L1040,844 Q1040,830 1054,830 L1276,830 Q1290,830 1290,844 L1290,874 Z" fill="#f5eee4"/><text x="1165.0" y="859" text-anchor="middle" class="smallLabel">Publishers</text>
<text x="1062" y="978" class="tiny">id PK</text>
<text x="1062" y="995" class="tiny">pub_id PK</text>
