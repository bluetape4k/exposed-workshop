</g>
<rect x="160" y="1140" width="1120" height="36" rx="12" class="noteBox"/><text x="720" y="1163" text-anchor="middle" class="note">PostTag makes Post↔Tag N:M explicit as two 1:N FK legs; lower cards are independent examples, not hidden relations.</text>
</svg>
