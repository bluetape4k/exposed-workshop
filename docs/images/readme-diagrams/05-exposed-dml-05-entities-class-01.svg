<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 900" width="1500" height="900" role="img" aria-label="Exposed Entity Mapping Model">
<defs>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/></filter>
<marker id="arrowBlue" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" viewBox="0 0 10 10" data-role="secondary" data-tip-direction="positive-x"><path d="M0,0 L10,5 L0,10 Z" fill="#4f86c6" stroke="#4f86c6" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
<marker id="arrowGreen" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" viewBox="0 0 10 10" data-role="secondary" data-tip-direction="positive-x"><path d="M0,0 L10,5 L0,10 Z" fill="#6e8f4f" stroke="#6e8f4f" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
<marker id="arrowTeal" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" viewBox="0 0 10 10" data-role="secondary" data-tip-direction="positive-x"><path d="M0,0 L10,5 L0,10 Z" fill="#4f8f8a" stroke="#4f8f8a" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
<marker id="arrowBrown" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" viewBox="0 0 10 10" data-role="secondary" data-tip-direction="positive-x"><path d="M0,0 L10,5 L0,10 Z" fill="#a2743d" stroke="#a2743d" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
<marker id="arrowRose" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" viewBox="0 0 10 10" data-role="secondary" data-tip-direction="positive-x"><path d="M0,0 L10,5 L0,10 Z" fill="#b65b5b" stroke="#b65b5b" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
<style>
.canvas{fill:#f6f9fc}.frame{fill:#fff;stroke:#d7e2ec;stroke-width:1.5}
.title{font-family:"Architects Daughter";font-size:31px;fill:#1e293b}
.subtitle,.detail{font-family:"Comic Mono";fill:#536476}
.subtitle{font-size:13px}.detail{font-size:12px}.tiny{font-family:"Comic Mono";font-size:10px;fill:#64748b}
.label{font-family:"Architects Daughter";font-size:16px;fill:#1e293b}
.panelTitle{font-family:"Architects Daughter";font-size:12px;letter-spacing:.08em;fill:#94a3b8}
.card{stroke-width:1.7;filter:url(#shadow)}.panel{fill:#f8fafc;stroke:#d7e2ec;stroke-width:1.2}
.edge{fill:none;stroke-linecap:round;stroke-linejoin:round}
.mapLine{stroke:#6e8f4f;stroke-width:2;marker-end:url(#arrowGreen)}
.fkLine{stroke:#4f8f8a;stroke-width:1.9;marker-end:url(#arrowTeal)}
.runtimeUse{stroke:#b65b5b;stroke-width:1.9;stroke-dasharray:6 5;marker-end:url(#arrowRose)}
.dbUse{stroke:#a2743d;stroke-width:2;marker-end:url(#arrowBrown)}
.createUse{stroke:#4f86c6;stroke-width:2;marker-end:url(#arrowBlue)}
</style>
</defs>
<rect width="1500" height="900" class="canvas"/>
<rect x="20" y="20" width="1460" height="860" rx="16" class="frame"/>
<text x="48" y="58" class="title">Exposed Entity Mapping Model</text>
<text x="48" y="80" class="subtitle">EntityTestData maps IdTable columns to DAO entities, then EntityClass, hooks, and cache operate inside transactions.</text>

<rect x="58" y="130" width="370" height="610" rx="12" class="panel"/>
<text x="243" y="122" class="panelTitle" text-anchor="middle">TABLE DEFINITIONS</text>
<rect x="92" y="188" width="292" height="132" rx="10" fill="#fff" stroke="#4f86c6" class="card"/>
<path d="M92,230 L92,198 Q92,188 102,188 L374,188 Q384,188 384,198 L384,230 Z" fill="#d9e8f5"/>
<text x="238" y="216" class="label" text-anchor="middle">YTable</text>
<text x="110" y="258" class="tiny">uuid PK varchar(24)</text>
<text x="110" y="276" class="tiny">x bool default true</text>
<rect x="92" y="420" width="292" height="154" rx="10" fill="#fff" stroke="#4f8f8a" class="card"/>
<path d="M92,462 L92,430 Q92,420 102,420 L374,420 Q384,420 384,430 L384,462 Z" fill="#d7efec"/>
<text x="238" y="448" class="label" text-anchor="middle">XTable</text>
<text x="110" y="490" class="tiny">id PK serial</text>
<text x="110" y="508" class="tiny">b1 bool default true</text>
<text x="110" y="526" class="tiny">b2 bool default false</text>
<text x="110" y="544" class="tiny">y1 FK nullable</text>
<rect x="116" y="624" width="244" height="70" rx="10" fill="#e2e8f0" stroke="#64748b" class="card"/>
<text x="238" y="649" class="label" text-anchor="middle">SchemaUtils.withTables</text>
<text x="238" y="680" class="detail" text-anchor="middle">create / drop fixtures</text>

<rect x="492" y="130" width="430" height="610" rx="12" class="panel"/>
<text x="707" y="122" class="panelTitle" text-anchor="middle">DAO ENTITY LAYER</text>
<rect x="540" y="178" width="330" height="152" rx="6" fill="#fff" stroke="#6e8f4f" class="card"/>
<path d="M540,218 L540,184 Q540,178 546,178 L864,178 Q870,178 870,184 L870,218 Z" fill="#dfead5"/>
<line x1="540" y1="218" x2="870" y2="218" stroke="#6e8f4f" stroke-width="1.2"/>
<text x="705" y="204" class="label" text-anchor="middle">YEntity</text>
<line x1="540" y1="278" x2="870" y2="278" stroke="#6e8f4f" stroke-width="1.2"/>
<text x="556" y="243" class="tiny">EntityID&lt;String&gt;</text>
<text x="556" y="261" class="tiny">var x by YTable.x</text>
<text x="556" y="308" class="tiny">EntityClass&lt;YEntity&gt;(YTable)</text>
<rect x="540" y="430" width="330" height="172" rx="6" fill="#fff" stroke="#4f8f8a" class="card"/>
<path d="M540,470 L540,436 Q540,430 546,430 L864,430 Q870,430 870,436 L870,470 Z" fill="#d7efec"/>
<line x1="540" y1="470" x2="870" y2="470" stroke="#4f8f8a" stroke-width="1.2"/>
<text x="705" y="456" class="label" text-anchor="middle">XEntity</text>
<line x1="540" y1="541" x2="870" y2="541" stroke="#4f8f8a" stroke-width="1.2"/>
<text x="556" y="491.5" class="tiny">EntityID&lt;Int&gt;</text>
<text x="556" y="509.5" class="tiny">var b1 by XTable.b1</text>
<text x="556" y="527.5" class="tiny">var b2 by XTable.b2</text>
<text x="556" y="575.5" class="tiny">IntEntityClass&lt;XEntity&gt;(XTable)</text>
<rect x="590" y="650" width="230" height="58" rx="10" fill="#f6ead8" stroke="#a2743d" class="card"/>
<text x="705" y="675" class="label" text-anchor="middle">AEntity / BEntity</text>
<text x="705" y="694" class="detail" text-anchor="middle">factory subclasses</text>

<rect x="990" y="130" width="390" height="610" rx="12" class="panel"/>
<text x="1185" y="122" class="panelTitle" text-anchor="middle">TRANSACTION BEHAVIOR</text>
<rect x="1040" y="184" width="260" height="72" rx="10" fill="#e6edf6" stroke="#4f86c6" class="card"/>
<text x="1170" y="209" class="label" text-anchor="middle">EntityClass</text>
<text x="1170" y="242" class="detail" text-anchor="middle">new / find / all</text>
<rect x="1040" y="314" width="260" height="72" rx="10" fill="#f2dddd" stroke="#b65b5b" class="card"/>
<text x="1170" y="339" class="label" text-anchor="middle">EntityHook</text>
<text x="1170" y="372" class="detail" text-anchor="middle">Created / Updated / Removed</text>
<rect x="1040" y="444" width="260" height="72" rx="10" fill="#e8e2d6" stroke="#9b7d54" class="card"/>
<text x="1170" y="469" class="label" text-anchor="middle">EntityCache</text>
<text x="1170" y="502" class="detail" text-anchor="middle">maxEntitiesToStore</text>
<rect x="1096" y="584" width="150" height="128" rx="10" fill="#fff7ed" stroke="#a2743d" class="card"/>
<g data-bluetape4k-icon="generic/database-server" transform="translate(1113 600) scale(.30)">
  <rect x="10" y="8" width="108" height="112" rx="18" fill="#fffaf2" stroke="#28485a" stroke-width="6"/>
  <ellipse cx="64" cy="36" rx="34" ry="13" fill="#fff0d8" stroke="#8c6f33" stroke-width="6"/>
  <path d="M30 36v44c0 8 15 14 34 14s34-6 34-14V36" fill="#fff0d8" stroke="#8c6f33" stroke-width="6" stroke-linejoin="round"/>
  <ellipse cx="64" cy="36" rx="34" ry="13" fill="none" stroke="#8c6f33" stroke-width="5"/>
  <path d="M30 58c0 8 15 14 34 14s34-6 34-14" fill="none" stroke="#8c6f33" stroke-width="5" stroke-linecap="round"/>
  <path d="M30 80c0 8 15 14 34 14s34-6 34-14" fill="none" stroke="#8c6f33" stroke-width="5" stroke-linecap="round"/>
</g>
<text x="1171" y="680" class="label" text-anchor="middle">Test DB</text>
<text x="1171" y="700" class="tiny" text-anchor="middle">H2 / PostgreSQL / MySQL</text>

<path data-connector="ytable-to-yentity" d="M384,254 L540,254" class="mapLine edge"/>
<path data-connector="xtable-to-xentity" d="M384,497 L452,497 Q462,497 462,507 L462,516 Q462,526 472,526 L540,526" class="mapLine edge"/>
<path data-connector="xtable-y1-to-ytable" d="M238,420 L238,320" class="fkLine edge"/>
<path data-connector="yentity-to-entityclass" d="M870,254 L948,254 Q958,254 958,244 L958,230 Q958,220 968,220 L1040,220" class="createUse edge"/>
<path data-connector="xentity-to-entityclass" d="M870,516 L950,516 Q960,516 960,506 L960,230 Q960,220 970,220 L1040,220" class="createUse edge"/>
<path data-connector="entityclass-to-hook" d="M1170,256 L1170,314" class="runtimeUse edge"/>
<path data-connector="hook-to-cache" d="M1170,386 L1170,444" class="runtimeUse edge"/>
<path data-connector="cache-to-db" d="M1170,516 L1170,584" class="dbUse edge"/>
<path data-connector="factory-to-xentity" d="M705,650 L705,602" class="createUse edge"/>

<rect x="190" y="752" width="1120" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<path d="M228,768 L290,768" class="mapLine edge"/><text x="304" y="773" class="tiny">table column delegate mapping</text>
<path d="M530,768 L592,768" class="fkLine edge"/><text x="606" y="773" class="tiny">foreign key / relationship</text>
<path d="M828,768 L890,768" class="createUse edge"/><text x="904" y="773" class="tiny">EntityClass operations</text>
<path d="M228,790 L290,790" class="runtimeUse edge"/><text x="304" y="795" class="tiny">hook/cache observation</text>
<path d="M530,790 L592,790" class="dbUse edge"/><text x="606" y="795" class="tiny">transactional DB persistence</text>
<rect x="126" y="822" width="1244" height="42" rx="10" fill="#ecfdf5" stroke="#9dbb7c" stroke-width="1.3"/>
<text x="748" y="848" class="detail" text-anchor="middle">XTable.y1 links BEntity to YEntity; EntityClass creates and queries rows while hooks/cache observe changes in the transaction.</text>
</svg>
