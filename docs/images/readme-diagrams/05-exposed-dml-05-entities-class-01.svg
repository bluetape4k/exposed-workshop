<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 900" width="1500" height="900" role="img" aria-label="Exposed Entity Mapping Model">
<defs>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/></filter>
<marker id="arrowBlue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8 Z" fill="#2563eb"/></marker>
<marker id="arrowGreen" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8 Z" fill="#16a34a"/></marker>
<marker id="arrowTeal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8 Z" fill="#0f766e"/></marker>
<marker id="arrowPurple" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8 Z" fill="#7c3aed"/></marker>
<marker id="arrowOrange" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8 Z" fill="#ea580c"/></marker>
<style>
.canvas{fill:#f6f9fc}.frame{fill:#fff;stroke:#d7e2ec;stroke-width:1.5}
.title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:31px;fill:#1e293b}
.subtitle,.detail{font-family:"Comic Mono","Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;fill:#536476}
.subtitle{font-size:13px}.detail{font-size:12px}.tiny{font-family:"Comic Mono","Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:10px;fill:#64748b}
.label{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:16px;fill:#1e293b}
.panelTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:12px;letter-spacing:.08em;fill:#94a3b8}
.card{stroke-width:1.7;filter:url(#shadow)}.panel{fill:#f8fafc;stroke:#d7e2ec;stroke-width:1.2}
.arrow{fill:none;stroke:#2563eb;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowBlue)}
.mapLine{fill:none;stroke:#16a34a;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowGreen)}
.fkLine{fill:none;stroke:#0f766e;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowTeal)}
.runtimeUse{fill:none;stroke:#7c3aed;stroke-width:1.9;stroke-dasharray:6 5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowPurple)}
.dbUse{fill:none;stroke:#ea580c;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowOrange)}
.inheritStem{fill:none;stroke:#475569;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
</style>
</defs>
<rect width="1500" height="900" class="canvas"/>
<rect x="20" y="20" width="1460" height="860" rx="16" class="frame"/>
<text x="48" y="58" class="title">Exposed Entity Mapping Model</text>
<text x="48" y="80" class="subtitle">EntityTestData maps IdTable/IntIdTable columns to DAO entities while hooks and cache observe transaction changes</text>
<rect x="58" y="130" width="370" height="610" rx="12" class="panel"/><text x="243" y="122" class="panelTitle" text-anchor="middle">TABLE DEFINITIONS</text>
<rect x="92" y="188" width="292" height="132" rx="10" fill="#fff" stroke="#3b82f6" class="card"/>
<path d="M92,230 L92,198 Q92,188 102,188 L374,188 Q384,188 384,198 L384,230 Z" fill="#dbeafe"/>
<text x="238" y="216" class="label" text-anchor="middle">YTable</text>
<text x="110" y="258" class="tiny">uuid PK varchar(24)</text>
<text x="110" y="276" class="tiny">x bool default true</text>
<rect x="92" y="420" width="292" height="154" rx="10" fill="#fff" stroke="#7c3aed" class="card"/>
<path d="M92,462 L92,430 Q92,420 102,420 L374,420 Q384,420 384,430 L384,462 Z" fill="#ede9fe"/>
<text x="238" y="448" class="label" text-anchor="middle">XTable</text>
<text x="110" y="490" class="tiny">id PK serial</text>
<text x="110" y="508" class="tiny">b1 bool default true</text>
<text x="110" y="526" class="tiny">b2 bool default false</text>
<text x="110" y="544" class="tiny">y1 FK nullable</text>
<rect x="116" y="624" width="244" height="70" rx="10" fill="#e2e8f0" stroke="#64748b" class="card"/>
<text x="238" y="649" class="label" text-anchor="middle">SchemaUtils.withTables</text>
<text x="238" y="680" class="detail" text-anchor="middle">create / drop fixtures</text>
<rect x="492" y="130" width="430" height="610" rx="12" class="panel"/><text x="707" y="122" class="panelTitle" text-anchor="middle">DAO ENTITY LAYER</text>
<rect x="540" y="178" width="330" height="152" rx="4" fill="#fff" stroke="#16a34a" class="card"/>
<path d="M540,218 L540,182 Q540,178 544,178 L866,178 Q870,178 870,182 L870,218 Z" fill="#dcfce7"/>
<line x1="540" y1="218" x2="870" y2="218" stroke="#16a34a" stroke-width="1.2"/>
<text x="705" y="204" class="label" text-anchor="middle">YEntity</text>
<line x1="540" y1="278" x2="870" y2="278" stroke="#16a34a" stroke-width="1.2"/>
<text x="556" y="243" class="tiny">EntityID&lt;String&gt;</text>
<text x="556" y="261" class="tiny">var x by YTable.x</text>
<text x="556" y="308" class="tiny">EntityClass&lt;YEntity&gt;(YTable)</text>
<rect x="540" y="430" width="330" height="172" rx="4" fill="#fff" stroke="#0f766e" class="card"/>
<path d="M540,470 L540,434 Q540,430 544,430 L866,430 Q870,430 870,434 L870,470 Z" fill="#ccfbf1"/>
<line x1="540" y1="470" x2="870" y2="470" stroke="#0f766e" stroke-width="1.2"/>
<text x="705" y="456" class="label" text-anchor="middle">XEntity</text>
<line x1="540" y1="541" x2="870" y2="541" stroke="#0f766e" stroke-width="1.2"/>
<text x="556" y="491.5" class="tiny">EntityID&lt;Int&gt;</text>
<text x="556" y="509.5" class="tiny">var b1 by XTable.b1</text>
<text x="556" y="527.5" class="tiny">var b2 by XTable.b2</text>
<text x="556" y="575.5" class="tiny">IntEntityClass&lt;XEntity&gt;(XTable)</text>
<rect x="590" y="650" width="230" height="58" rx="10" fill="#fef3c7" stroke="#d97706" class="card"/>
<text x="705" y="675" class="label" text-anchor="middle">AEntity/BEntity</text>
<text x="705" y="694" class="detail" text-anchor="middle">factory subclasses</text>
<rect x="990" y="130" width="390" height="610" rx="12" class="panel"/><text x="1185" y="122" class="panelTitle" text-anchor="middle">TRANSACTION BEHAVIOR</text>
<rect x="1040" y="184" width="260" height="72" rx="10" fill="#ffedd5" stroke="#ea580c" class="card"/>
<text x="1170" y="209" class="label" text-anchor="middle">EntityClass</text>
<text x="1170" y="242" class="detail" text-anchor="middle">new / find / all</text>
<rect x="1040" y="314" width="260" height="72" rx="10" fill="#fce7f3" stroke="#db2777" class="card"/>
<text x="1170" y="339" class="label" text-anchor="middle">EntityHook</text>
<text x="1170" y="372" class="detail" text-anchor="middle">Created / Updated / Removed</text>
<rect x="1040" y="444" width="260" height="72" rx="10" fill="#ede9fe" stroke="#7c3aed" class="card"/>
<text x="1170" y="469" class="label" text-anchor="middle">EntityCache</text>
<text x="1170" y="502" class="detail" text-anchor="middle">maxEntitiesToStore</text>
<path d="M1096,601 C1096,580 1246,580 1246,601 L1246,689 C1246,710 1096,710 1096,689 Z" fill="#fff" stroke="#ea580c" stroke-width="1.7" class="card"/>
<ellipse cx="1171" cy="601" rx="75" ry="17" fill="#ffedd5" stroke="#ea580c" stroke-width="1.7"/>
<path d="M1096,689 C1096,710 1246,710 1246,689" fill="none" stroke="#ea580c" stroke-width="1.7"/>
<text x="1171" y="632" class="label" text-anchor="middle">DB</text>
<text x="1112" y="662" class="tiny">H2</text>
<text x="1112" y="680" class="tiny">Postgres</text>
<text x="1112" y="698" class="tiny">MySQL</text>
<path d="M384,254 L540,254" class="mapLine"/>
<path d="M384,497 L462,497 L462,516 L540,516" class="mapLine"/>
<path d="M238,420 L238,320" class="fkLine"/>
<path d="M870,254 L948,254 L948,220 L1040,220" class="arrow"/>
<path d="M870,516 L950,516 L950,220 L1040,220" class="arrow"/>
<path d="M1170,256 L1170,314" class="runtimeUse"/>
<path d="M1170,386 L1170,444" class="runtimeUse"/>
<path d="M1170,516 L1170,584" class="dbUse"/>
<rect x="118" y="796" width="1264" height="52" rx="10" fill="#ecfdf5" stroke="#86efac" stroke-width="1.3"/>
<text x="750" y="827" class="detail" text-anchor="middle">Source check: EntityTestData defines YTable/XTable, XEntity/YEntity mappings; Ex02 tracks EntityHook changes and Ex03 verifies EntityCache sizing.</text>
</svg>
