<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Ktor routing datasource architecture">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
    <marker id="flowHead" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2,2 L12,7 L2,12 Z" fill="#64748b" stroke="#64748b" stroke-width="1"/>
    </marker>
    <style>
      .canvas{fill:#f6f9fc}
      .frame{fill:#fff;stroke:#d7e2ec;stroke-width:1.5}
      .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:34px;fill:#1e293b}
      .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;fill:#536476}
      .columnTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:12px;letter-spacing:.08em;fill:#94a3b8}
      .card{stroke-width:1.7;filter:url(#shadow)}
      .label{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:18px;fill:#1e293b}
      .detail{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;fill:#536476}
      .tiny{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:10.5px;fill:#64748b}
      .arrow{fill:none;stroke:#64748b;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#flowHead)}
      .dash{fill:none;stroke:#94a3b8;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:7 5;marker-end:url(#flowHead)}
    </style>
  </defs>

  <rect width="1600" height="900" class="canvas"/>
  <rect x="28" y="24" width="1544" height="852" rx="16" class="frame"/>

  <text x="64" y="70" class="title">Ktor routing datasource architecture</text>
  <text x="64" y="96" class="subtitle">RoutingPlugin selects READ or WRITE per request, then RoutingContext carries the role into repository database selection</text>

  <text x="192" y="146" class="columnTitle" text-anchor="middle">KTOR MODULE</text>
  <text x="496" y="146" class="columnTitle" text-anchor="middle">ROUTING DECISION</text>
  <text x="800" y="146" class="columnTitle" text-anchor="middle">COROUTINE CONTEXT</text>
  <text x="1104" y="146" class="columnTitle" text-anchor="middle">REPOSITORY SELECTION</text>
  <text x="1408" y="146" class="columnTitle" text-anchor="middle">DATASOURCE / RESPONSE</text>

  <g id="bootstrap-row">
    <rect x="72" y="182" width="240" height="96" rx="10" fill="#e2e8f0" stroke="#64748b" class="card"/>
    <text x="192" y="216" class="label" text-anchor="middle">Application module</text>
    <text x="192" y="241" class="detail" text-anchor="middle">ktorRoutingDataSourceModule</text>
    <text x="192" y="259" class="tiny" text-anchor="middle">CIO server on port 8080</text>

    <rect x="376" y="182" width="240" height="96" rx="10" fill="#ede9fe" stroke="#7c3aed" class="card"/>
    <text x="496" y="216" class="label" text-anchor="middle">Install plugins</text>
    <text x="496" y="241" class="detail" text-anchor="middle">RoutingPlugin</text>
    <text x="496" y="259" class="tiny" text-anchor="middle">plus JSON, logging, status pages</text>

    <rect x="680" y="182" width="240" height="96" rx="10" fill="#ccfbf1" stroke="#0f766e" class="card"/>
    <text x="800" y="216" class="label" text-anchor="middle">DataSource map</text>
    <text x="800" y="241" class="detail" text-anchor="middle">READ and WRITE Hikari pools</text>
    <text x="800" y="259" class="tiny" text-anchor="middle">separate H2 memory URLs</text>

    <rect x="984" y="182" width="240" height="96" rx="10" fill="#fef3c7" stroke="#d97706" class="card"/>
    <text x="1104" y="216" class="label" text-anchor="middle">Database map</text>
    <text x="1104" y="241" class="detail" text-anchor="middle">Map&lt;DataSourceRole, Database&gt;</text>
    <text x="1104" y="259" class="tiny" text-anchor="middle">passed to repository</text>

    <rect x="1288" y="182" width="240" height="96" rx="10" fill="#dbeafe" stroke="#3b82f6" class="card"/>
    <text x="1408" y="216" class="label" text-anchor="middle">Inventory seed</text>
    <text x="1408" y="241" class="detail" text-anchor="middle">role-specific quantities</text>
    <text x="1408" y="259" class="tiny" text-anchor="middle">READ 10/20, WRITE 100/200</text>

    <path data-connector="module-to-routing-plugin-install" d="M312,230 H376" class="arrow"/>
    <path data-connector="plugins-to-datasource-map" d="M616,230 H680" class="arrow"/>
    <path data-connector="datasource-map-to-database-map" d="M920,230 H984" class="arrow"/>
    <path data-connector="database-map-to-inventory-seed" d="M1224,230 H1288" class="arrow"/>
  </g>

  <g id="decision-row">
    <rect x="72" y="376" width="240" height="106" rx="10" fill="#f8fafc" stroke="#94a3b8" class="card"/>
    <text x="192" y="411" class="label" text-anchor="middle">Inventory request</text>
    <text x="192" y="436" class="detail" text-anchor="middle">GET /inventory/{sku}</text>
    <text x="192" y="455" class="detail" text-anchor="middle">PUT /inventory/{sku}</text>

    <rect x="376" y="376" width="240" height="106" rx="10" fill="#ede9fe" stroke="#7c3aed" class="card"/>
    <text x="496" y="411" class="label" text-anchor="middle">RoutingPlugin</text>
    <text x="496" y="436" class="detail" text-anchor="middle">GET -> READ, mutating -> WRITE</text>
    <text x="496" y="455" class="tiny" text-anchor="middle">X-Data-Source can override</text>

    <rect x="680" y="376" width="240" height="106" rx="10" fill="#ccfbf1" stroke="#0f766e" class="card"/>
    <text x="800" y="411" class="label" text-anchor="middle">Call attribute</text>
    <text x="800" y="436" class="detail" text-anchor="middle">DataSourceRoleAttributeKey</text>
    <text x="800" y="455" class="tiny" text-anchor="middle">invalid header fails early</text>

    <rect x="984" y="376" width="240" height="106" rx="10" fill="#fef3c7" stroke="#d97706" class="card"/>
    <text x="1104" y="411" class="label" text-anchor="middle">withRoutingContext</text>
    <text x="1104" y="436" class="detail" text-anchor="middle">RoutingContextElement</text>
    <text x="1104" y="455" class="tiny" text-anchor="middle">ThreadLocal role across coroutine</text>

    <rect x="1288" y="376" width="240" height="106" rx="10" fill="#dbeafe" stroke="#3b82f6" class="card"/>
    <text x="1408" y="411" class="label" text-anchor="middle">Route handler</text>
    <text x="1408" y="436" class="detail" text-anchor="middle">repository.find / update</text>
    <text x="1408" y="455" class="tiny" text-anchor="middle">public stats path bypasses plugin</text>

    <path data-connector="inventory-request-to-routing-plugin" d="M312,429 H376" class="arrow"/>
    <path data-connector="routing-plugin-to-call-attribute" d="M616,429 H680" class="arrow"/>
    <path data-connector="call-attribute-to-routing-context" d="M920,429 H984" class="arrow"/>
    <path data-connector="routing-context-to-route-handler" d="M1224,429 H1288" class="arrow"/>
  </g>

  <g id="repository-row">
    <rect x="72" y="570" width="240" height="116" rx="10" fill="#f8fafc" stroke="#94a3b8" class="card"/>
    <text x="192" y="605" class="label" text-anchor="middle">Repository call</text>
    <text x="192" y="630" class="detail" text-anchor="middle">RoutingInventoryRepository</text>
    <text x="192" y="649" class="tiny" text-anchor="middle">find, update, stats</text>

    <rect x="376" y="570" width="240" height="116" rx="10" fill="#ede9fe" stroke="#7c3aed" class="card"/>
    <text x="496" y="605" class="label" text-anchor="middle">Current role</text>
    <text x="496" y="630" class="detail" text-anchor="middle">RoutingContext.currentRole()</text>
    <text x="496" y="649" class="tiny" text-anchor="middle">read/write counters increment</text>

    <rect x="680" y="570" width="240" height="116" rx="10" fill="#ccfbf1" stroke="#0f766e" class="card"/>
    <text x="800" y="605" class="label" text-anchor="middle">Selected database</text>
    <text x="800" y="630" class="detail" text-anchor="middle">databases[role]</text>
    <text x="800" y="649" class="tiny" text-anchor="middle">WRITE required for updates</text>

    <rect x="984" y="570" width="240" height="116" rx="10" fill="#fef3c7" stroke="#d97706" class="card"/>
    <text x="1104" y="605" class="label" text-anchor="middle">Exposed transaction</text>
    <text x="1104" y="630" class="detail" text-anchor="middle">Inventory.selectAll / upsert</text>
    <text x="1104" y="649" class="tiny" text-anchor="middle">role-specific H2 database</text>

    <rect x="1288" y="570" width="240" height="116" rx="10" fill="#dbeafe" stroke="#3b82f6" class="card"/>
    <text x="1408" y="605" class="label" text-anchor="middle">Response models</text>
    <text x="1408" y="630" class="detail" text-anchor="middle">InventoryResponse / Stats</text>
    <text x="1408" y="649" class="tiny" text-anchor="middle">selectedDataSource is visible</text>

    <path data-connector="repository-call-to-current-role" d="M312,628 H376" class="arrow"/>
    <path data-connector="current-role-to-selected-database" d="M616,628 H680" class="arrow"/>
    <path data-connector="selected-database-to-exposed-transaction" d="M920,628 H984" class="arrow"/>
    <path data-connector="exposed-transaction-to-response-models" d="M1224,628 H1288" class="arrow"/>
  </g>

  <rect x="72" y="750" width="1456" height="62" rx="10" fill="#f8fafc" stroke="#d7e2ec" stroke-width="1.3"/>
  <text x="800" y="776" class="label" text-anchor="middle">Routing is explicit and testable: the selected role is carried before repository code touches Exposed.</text>
  <text x="800" y="797" class="detail" text-anchor="middle">GET defaults to READ, mutating calls default to WRITE, and X-Data-Source validates representative overrides.</text>
</svg>
