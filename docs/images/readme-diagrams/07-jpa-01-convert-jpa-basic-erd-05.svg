<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1102 860" width="1102" height="860" role="img" aria-label="BookSchema ERD for composite primary keys">
  <defs>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="136%">
      <feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
    <marker id="fkArrow" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#60758d" stroke="#60758d" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <style>
      .canvas{fill:#f6f9fc}
      .frame{fill:#ffffff;stroke:#d7e2ec;stroke-width:1.5}
      .title{font-family:"Architects Daughter";font-size:32px;fill:#1e293b}
      .subtitle{font-family:"Comic Mono";font-size:13px;fill:#536476}
      .tableBox{fill:#ffffff;stroke-width:1.8;filter:url(#shadow)}
      .tableHead{stroke-width:0}
      .tableTitle{font-family:"Architects Daughter";font-size:19px;fill:#1e293b}
      .tableMeta{font-family:"Comic Mono";font-size:11px;fill:#64748b}
      .field{font-family:"Comic Mono";font-size:12px;fill:#475569}
      .pk{fill:#1e3a8a;font-weight:700}
      .fk{fill:#8a4f0a;font-weight:700}
      .relation{fill:none;stroke:#60758d;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#fkArrow)}
      .cardinality{font-family:"Architects Daughter";font-size:20px;fill:#334155}
      .legendText{font-family:"Comic Mono";font-size:12px;fill:#475569}
      .legendBox{fill:#f8fafc;stroke:#d7e2ec;stroke-width:1.2}
    </style>
  </defs>

  <rect width="1102" height="860" class="canvas"/>
  <rect x="20" y="20" width="1062" height="820" rx="16" class="frame"/>

  <text x="48" y="60" class="title">BookSchema ERD (Composite PK)</text>
  <text x="48" y="83" class="subtitle">Exposed CompositeIdTable schema for @EmbeddedId/@IdClass migration examples</text>
  <g id="publishers" data-node="publishers">
    <rect x="58" y="318" width="294" height="214" rx="12" class="tableBox" stroke="#ea580c"/>
    <path d="M58,356 L58,330 Q58,318 70,318 L340,318 Q352,318 352,330 L352,356 Z" class="tableHead" fill="#ffedd5"/>
    <text x="205" y="344" class="tableTitle" text-anchor="middle">Publishers</text>
    <text x="78" y="382" class="field pk">pub_id int PK auto</text>
    <text x="78" y="402" class="field pk">isbn_code uuid PK auto</text>
    <text x="78" y="422" class="field">publisher_name varchar(32)</text>
    <text x="78" y="456" class="tableMeta">CompositeIdTable("publishers")</text>
    <text x="78" y="476" class="tableMeta">PrimaryKey(pub_id, isbn_code)</text>
    <text x="78" y="496" class="tableMeta">Publisher : CompositeEntity</text>
  </g>

  <g id="authors" data-node="authors">
    <rect x="432" y="150" width="294" height="214" rx="12" class="tableBox" stroke="#3b82f6"/>
    <path d="M432,188 L432,162 Q432,150 444,150 L714,150 Q726,150 726,162 L726,188 Z" class="tableHead" fill="#dbeafe"/>
    <text x="579" y="176" class="tableTitle" text-anchor="middle">Authors</text>
    <text x="452" y="214" class="field pk">id int PK</text>
    <text x="452" y="234" class="field fk">publisher_id int FK</text>
    <text x="452" y="254" class="field fk">publisher_isbn uuid FK</text>
    <text x="452" y="274" class="field">pen_name varchar(32)</text>
    <text x="452" y="308" class="tableMeta">IntIdTable("authors")</text>
    <text x="452" y="328" class="tableMeta">foreignKey(..., Publishers.primaryKey)</text>
  </g>

  <g id="books" data-node="books">
    <rect x="794" y="150" width="250" height="214" rx="12" class="tableBox" stroke="#16a34a"/>
    <path d="M794,188 L794,162 Q794,150 806,150 L1032,150 Q1044,150 1044,162 L1044,188 Z" class="tableHead" fill="#dcfce7"/>
    <text x="919" y="176" class="tableTitle" text-anchor="middle">Books</text>
    <text x="814" y="214" class="field pk">book_id int PK auto</text>
    <text x="814" y="234" class="field">title varchar(32)</text>
    <text x="814" y="254" class="field fk">author_id int? FK</text>
    <text x="814" y="288" class="tableMeta">CompositeIdTable("books")</text>
    <text x="814" y="308" class="tableMeta">PrimaryKey(book_id)</text>
    <text x="814" y="328" class="tableMeta">Book : CompositeEntity</text>
  </g>

  <g id="offices" data-node="offices">
    <rect x="432" y="528" width="294" height="244" rx="12" class="tableBox" stroke="#8b5cf6"/>
    <path d="M432,566 L432,540 Q432,528 444,528 L714,528 Q726,528 726,540 L726,566 Z" class="tableHead" fill="#ede9fe"/>
    <text x="579" y="554" class="tableTitle" text-anchor="middle">Offices</text>
    <text x="452" y="592" class="field pk">zip_code varchar(8) PK</text>
    <text x="452" y="612" class="field pk">name varchar(64) PK</text>
    <text x="452" y="632" class="field pk">area_code int PK</text>
    <text x="452" y="652" class="field">staff bigint?</text>
    <text x="452" y="672" class="field fk">publisher_id int? FK</text>
    <text x="452" y="692" class="field fk">publisher_isbn uuid? FK</text>
    <text x="452" y="726" class="tableMeta">CompositeIdTable("offices")</text>
    <text x="452" y="746" class="tableMeta">PrimaryKey(zip_code, name, area_code)</text>
  </g>

  <g id="reviews" data-node="reviews">
    <rect x="794" y="528" width="250" height="214" rx="12" class="tableBox" stroke="#0f766e"/>
    <path d="M794,566 L794,540 Q794,528 806,528 L1032,528 Q1044,528 1044,540 L1044,566 Z" class="tableHead" fill="#ccfbf1"/>
    <text x="919" y="554" class="tableTitle" text-anchor="middle">Reviews</text>
    <text x="814" y="592" class="field pk">code varchar(8) PK</text>
    <text x="814" y="612" class="field pk">rank bigint PK</text>
    <text x="814" y="632" class="field fk">book_id int FK</text>
    <text x="814" y="666" class="tableMeta">CompositeIdTable("reviews")</text>
    <text x="814" y="686" class="tableMeta">PrimaryKey(code, rank)</text>
    <text x="814" y="706" class="tableMeta">Review : CompositeEntity</text>
  </g>

  <path id="publishers-authors" class="relation" data-connector="publishers-authors" d="M352,382 L388,382 Q400,382 400,370 L400,262 Q400,250 412,250 L432,250"/>
  <text x="365" y="375" class="cardinality">1</text>
  <text x="414" y="242" class="cardinality">N</text>

  <path id="authors-books" class="relation" data-connector="authors-books" d="M726,250 L794,250"/>
  <text x="736" y="242" class="cardinality">1</text>
  <text x="778" y="278" class="cardinality">N</text>

  <path id="books-reviews" class="relation" data-connector="books-reviews" d="M919,364 L919,528"/>
  <text x="928" y="386" class="cardinality">1</text>
  <text x="928" y="516" class="cardinality">N</text>

  <path id="publishers-offices" class="relation" data-connector="publishers-offices" d="M352,468 L388,468 Q400,468 400,480 L400,636 Q400,648 412,648 L432,648"/>
  <text x="365" y="461" class="cardinality">1</text>
  <text x="414" y="640" class="cardinality">N</text>

  <rect x="58" y="700" width="294" height="86" rx="10" class="legendBox"/>
  <text x="76" y="724" class="legendText"><tspan class="pk">PK</tspan> columns are Exposed entityId() parts.</text>
  <text x="76" y="746" class="legendText"><tspan class="fk">FK</tspan> lines point from parent table</text>
  <text x="76" y="766" class="legendText">to child FK table.</text>
  <text x="48" y="812" class="subtitle">Relations: Publisher 1:N Author, Author 1:N Book, Book 1:N Review, Publisher 1:N Office.</text>
</svg>
