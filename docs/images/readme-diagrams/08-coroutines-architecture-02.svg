<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 820" width="1500" height="820" role="img" aria-label="Thread Model Structure Comparison">
<defs>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/></filter>
<marker id="arrowBlue" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563eb" stroke="#2563eb" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
<marker id="arrowGreen" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#16a34a" stroke="#16a34a" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
<marker id="arrowPink" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#db2777" stroke="#db2777" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
<marker id="arrowOrange" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#ea580c" stroke="#ea580c" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
<marker id="arrowPurple" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7c3aed" stroke="#7c3aed" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
<marker id="arrowGray" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b" stroke="#64748b" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
<style>
.canvas{fill:#f6f9fc}.frame{fill:#fff;stroke:#d7e2ec;stroke-width:1.5}
.title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:31px;fill:#1e293b}
.subtitle,.detail{font-family:"Comic Mono","Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;fill:#536476}
.subtitle{font-size:13px}.detail{font-size:12px}.tiny{font-family:"Comic Mono","Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:10px;fill:#64748b}
.label{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:16px;fill:#1e293b}
.panelTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:12px;letter-spacing:.08em;fill:#94a3b8}
.card{stroke-width:1.7;filter:url(#shadow)}.panel{fill:#f8fafc;stroke:#d7e2ec;stroke-width:1.2}
.arrow{fill:none;stroke:#2563eb;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowBlue)}
.mapLine{fill:none;stroke:#16a34a;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowGreen)}
.codecLine{fill:none;stroke:#db2777;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowPink)}
.dbUse{fill:none;stroke:#ea580c;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowOrange)}
.runtimeUse{fill:none;stroke:#7c3aed;stroke-width:1.9;stroke-dasharray:6 5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowPurple)}
.returnLine{fill:none;stroke:#64748b;stroke-width:1.7;stroke-dasharray:7 5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowGray)}
.lifeline{stroke:#cbd5e1;stroke-width:1.4;stroke-dasharray:5 6}
</style>
</defs>
<rect width="1500" height="820" class="canvas"/>
<rect x="20" y="20" width="1460" height="780" rx="16" class="frame"/>
<text x="48" y="58" class="title">Thread Model Structure Comparison</text>
<text x="48" y="80" class="subtitle">Coroutines multiplex suspend work on Dispatchers.IO while Virtual Threads keep blocking-style code on JVM-managed lightweight threads</text>
<rect x="58" y="130" width="1384" height="250" rx="12" class="panel"/><text x="750" y="122" class="panelTitle" text-anchor="middle">COROUTINE STRUCTURE</text>
<desc>Suspend callers</desc><rect x="96" y="190" width="210" height="64" rx="10" fill="#dbeafe" stroke="#3b82f6" class="card"/>
<text x="201" y="215" class="label" text-anchor="middle">Suspend callers</text>
<text x="201" y="240" class="detail" text-anchor="middle">runSuspendIO</text>
<desc>Coroutine jobs</desc><rect x="384" y="190" width="230" height="64" rx="10" fill="#ede9fe" stroke="#7c3aed" class="card"/>
<text x="499" y="215" class="label" text-anchor="middle">Coroutine jobs</text>
<text x="499" y="240" class="detail" text-anchor="middle">Deferred + awaitAll</text>
<desc>Dispatchers.IO</desc><rect x="692" y="190" width="230" height="64" rx="10" fill="#e2e8f0" stroke="#64748b" class="card"/>
<text x="807" y="215" class="label" text-anchor="middle">Dispatchers.IO</text>
<text x="807" y="240" class="detail" text-anchor="middle">worker pool</text>
<desc>Connection pool</desc><rect x="1000" y="190" width="230" height="64" rx="10" fill="#ccfbf1" stroke="#0f766e" class="card"/>
<text x="1115" y="215" class="label" text-anchor="middle">Connection pool</text>
<text x="1115" y="240" class="detail" text-anchor="middle">Exposed JDBC</text>
<path d="M1300,177 C1300,156 1404,156 1404,177 L1404,293 C1404,314 1300,314 1300,293 Z" fill="#fff" stroke="#ea580c" stroke-width="1.7" class="card"/>
<ellipse cx="1352" cy="177" rx="52" ry="17" fill="#ffedd5" stroke="#ea580c" stroke-width="1.7"/>
<path d="M1300,293 C1300,314 1404,314 1404,293" fill="none" stroke="#ea580c" stroke-width="1.7"/>
<text x="1352" y="212" class="label" text-anchor="middle">DB</text>
<text x="1314" y="246" class="tiny">Tester</text>
<text x="1314" y="264" class="tiny">unique</text>
<rect x="58" y="440" width="1384" height="250" rx="12" class="panel"/><text x="750" y="432" class="panelTitle" text-anchor="middle">VIRTUAL THREAD STRUCTURE</text>
<desc>Blocking callers</desc><rect x="96" y="500" width="210" height="64" rx="10" fill="#dbeafe" stroke="#3b82f6" class="card"/>
<text x="201" y="525" class="label" text-anchor="middle">Blocking callers</text>
<text x="201" y="550" class="detail" text-anchor="middle">plain test code</text>
<desc>VirtualFuture</desc><rect x="384" y="500" width="230" height="64" rx="10" fill="#ede9fe" stroke="#7c3aed" class="card"/>
<text x="499" y="525" class="label" text-anchor="middle">VirtualFuture</text>
<text x="499" y="550" class="detail" text-anchor="middle">awaitAll</text>
<desc>Virtual Threads</desc><rect x="692" y="500" width="230" height="64" rx="10" fill="#fef3c7" stroke="#d97706" class="card"/>
<text x="807" y="525" class="label" text-anchor="middle">Virtual Threads</text>
<text x="807" y="550" class="detail" text-anchor="middle">JVM lightweight</text>
<desc>Carrier + JDBC</desc><rect x="1000" y="500" width="230" height="64" rx="10" fill="#e2e8f0" stroke="#64748b" class="card"/>
<text x="1115" y="525" class="label" text-anchor="middle">Carrier + JDBC</text>
<text x="1115" y="550" class="detail" text-anchor="middle">blocking I/O</text>
<path d="M1300,487 C1300,466 1404,466 1404,487 L1404,603 C1404,624 1300,624 1300,603 Z" fill="#fff" stroke="#ea580c" stroke-width="1.7" class="card"/>
<ellipse cx="1352" cy="487" rx="52" ry="17" fill="#ffedd5" stroke="#ea580c" stroke-width="1.7"/>
<path d="M1300,603 C1300,624 1404,624 1404,603" fill="none" stroke="#ea580c" stroke-width="1.7"/>
<text x="1352" y="522" class="label" text-anchor="middle">DB</text>
<text x="1314" y="556" class="tiny">VTester</text>
<text x="1314" y="574" class="tiny">unique</text>
<path d="M306,222 L384,222" class="arrow" data-connector="suspend-to-jobs"/>
<path d="M614,222 L692,222" class="arrow" data-connector="jobs-to-dispatcher"/>
<path d="M922,222 L1000,222" class="mapLine" data-connector="dispatcher-to-pool"/>
<path d="M1230,222 L1300,222" class="dbUse" data-connector="pool-to-coroutine-db"/>
<path d="M306,532 L384,532" class="arrow" data-connector="blocking-to-future"/>
<path d="M614,532 L692,532" class="arrow" data-connector="future-to-virtual-thread"/>
<path d="M922,532 L1000,532" class="mapLine" data-connector="virtual-thread-to-jdbc"/>
<path d="M1230,532 L1300,532" class="dbUse" data-connector="jdbc-to-vt-db"/>
<rect x="150" y="738" width="1200" height="52" rx="10" fill="#ecfdf5" stroke="#86efac" stroke-width="1.3"/>
<text x="750" y="769" class="detail" text-anchor="middle">Model rule: coroutines require suspend-aware transaction boundaries; virtual threads preserve blocking-style transaction code but still share the same JDBC connection bottleneck.</text>
</svg>
