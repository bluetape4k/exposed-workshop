<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 820" width="1440" height="820" role="img" aria-label="Exposed SQL DSL Query Flow">
<defs>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/></filter>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8 Z" fill="#64748b"/></marker>
<marker id="arrowBlue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8 Z" fill="#2563eb"/></marker>
<marker id="arrowPurple" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8 Z" fill="#7c3aed"/></marker>
<marker id="arrowOrange" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8 Z" fill="#ea580c"/></marker>
<marker id="arrowTeal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8 Z" fill="#0f766e"/></marker>
<style>
.canvas{fill:#f6f9fc}.frame{fill:#fff;stroke:#d7e2ec;stroke-width:1.5}
.title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:31px;fill:#1e293b}
.subtitle,.detail{font-family:"Comic Mono","Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;fill:#536476}
.subtitle{font-size:13px}.detail{font-size:12px}.tiny{font-family:"Comic Mono","Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:10px;fill:#64748b}
.label{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:17px;fill:#1e293b}
.panelTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:12px;letter-spacing:.08em;fill:#94a3b8}
.card{stroke-width:1.7;filter:url(#shadow)}.panel{fill:#f8fafc;stroke:#d7e2ec;stroke-width:1.2}
.arrow{fill:none;stroke:#2563eb;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowBlue)}
.runtimeUse{fill:none;stroke:#7c3aed;stroke-width:1.8;stroke-dasharray:5 5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowPurple)}
.dbUse{fill:none;stroke:#ea580c;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowOrange)}
.fkArrow{fill:none;stroke:#0f766e;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowTeal)}
.returnLine{fill:none;stroke:#64748b;stroke-width:1.8;stroke-dasharray:6 5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
.lifeline{stroke:#cbd5e1;stroke-width:1.5;stroke-dasharray:5 6}
.inherit{fill:none;stroke:#475569;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.inheritHead{fill:#fff;stroke:#475569;stroke-width:1.8;stroke-linejoin:round}
</style>
</defs>
<rect width="1440" height="820" class="canvas"/>
<rect x="20" y="20" width="1400" height="780" rx="16" class="frame"/>
<text x="48" y="58" class="title">Exposed SQL DSL Query Flow</text>
<text x="48" y="80" class="subtitle">Sync and coroutine examples share the same schema helper, sample data, and type-safe DSL operations</text>
<rect x="28" y="128" width="164" height="54" rx="10" fill="#dbeafe" stroke="#3b82f6" class="card"/>
<text x="110" y="161" class="label" text-anchor="middle">Test class</text>
<path d="M110,182 L110,704" class="lifeline"/>
<rect x="258" y="128" width="164" height="54" rx="10" fill="#ede9fe" stroke="#7c3aed" class="card"/>
<text x="340" y="161" class="label" text-anchor="middle">Schema helper</text>
<path d="M340,182 L340,704" class="lifeline"/>
<rect x="508" y="128" width="164" height="54" rx="10" fill="#dcfce7" stroke="#16a34a" class="card"/>
<text x="590" y="161" class="label" text-anchor="middle">Transaction</text>
<path d="M590,182 L590,704" class="lifeline"/>
<rect x="768" y="128" width="164" height="54" rx="10" fill="#ffedd5" stroke="#ea580c" class="card"/>
<text x="850" y="161" class="label" text-anchor="middle">City/User tables</text>
<path d="M850,182 L850,704" class="lifeline"/>
<rect x="1028" y="128" width="164" height="54" rx="10" fill="#fce7f3" stroke="#db2777" class="card"/>
<text x="1110" y="161" class="label" text-anchor="middle">DSL operation</text>
<path d="M1110,182 L1110,704" class="lifeline"/>
<rect x="1228" y="128" width="164" height="54" rx="10" fill="#ccfbf1" stroke="#0f766e" class="card"/>
<text x="1310" y="161" class="label" text-anchor="middle">Assertion</text>
<path d="M1310,182 L1310,704" class="lifeline"/>
<path d="M110,230 L340,230" class="arrow"/>
<rect x="130" y="202" width="190" height="22" rx="7" fill="#fff" stroke="#bfdbfe"/>
<text x="225" y="217" class="tiny" text-anchor="middle">sync withCityUsers()</text>
<path d="M110,286 L340,286" class="arrow"/>
<rect x="130" y="258" width="190" height="22" rx="7" fill="#fff" stroke="#bfdbfe"/>
<text x="225" y="273" class="tiny" text-anchor="middle">suspend withCityUsers()</text>
<path d="M340,346 L590,346" class="arrow"/>
<rect x="370" y="318" width="190" height="22" rx="7" fill="#fff" stroke="#bfdbfe"/>
<text x="465" y="333" class="tiny" text-anchor="middle">withTables / suspending</text>
<path d="M590,402 L850,402" class="arrow"/>
<rect x="625" y="374" width="190" height="22" rx="7" fill="#fff" stroke="#bfdbfe"/>
<text x="720" y="389" class="tiny" text-anchor="middle">create tables and seed rows</text>
<path d="M850,458 L340,458" class="returnLine"/>
<rect x="511" y="430" width="168" height="22" rx="7" fill="#fff" stroke="#cbd5e1"/>
<text x="595" y="445" class="tiny" text-anchor="middle">commit seeded rows</text>
<path d="M340,520 L1110,520" class="arrow"/>
<rect x="630" y="492" width="190" height="22" rx="7" fill="#fff" stroke="#bfdbfe"/>
<text x="725" y="507" class="tiny" text-anchor="middle">run update/delete/join/groupBy body</text>
<path d="M1110,576 L850,576" class="arrow"/>
<rect x="885" y="548" width="190" height="22" rx="7" fill="#fff" stroke="#bfdbfe"/>
<text x="980" y="563" class="tiny" text-anchor="middle">select/update/delete via DSL</text>
<path d="M850,632 L1110,632" class="returnLine"/>
<rect x="896" y="604" width="168" height="22" rx="7" fill="#fff" stroke="#cbd5e1"/>
<text x="980" y="619" class="tiny" text-anchor="middle">ResultRow / affected count</text>
<path d="M1110,688 L1310,688" class="arrow"/>
<rect x="1115" y="660" width="190" height="22" rx="7" fill="#fff" stroke="#bfdbfe"/>
<text x="1210" y="675" class="tiny" text-anchor="middle">assert result shape</text>
<rect x="100" y="742" width="1228" height="48" rx="10" fill="#ecfdf5" stroke="#86efac" stroke-width="1.3"/>
<text x="714" y="772" class="detail" text-anchor="middle">Sequence check: return messages use dashed arrows; both sync and coroutine examples execute the same DSL scenarios against the same CityTable/UserTable schema.</text>
</svg>
