<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">Exposed SQL DSL query sequence</title>
  <desc id="desc">Sequence for the Exposed SQL DSL workshop tests that share schema helpers, seed City/User rows, execute update/delete/join/groupBy DSL bodies, and assert result rows or affected counts.</desc>
  <defs>
    <style>
      text { letter-spacing: 0; }
      .title { font-family: "Architects Daughter"; font-size: 40px; font-weight: 400; fill: #263238; }
      .subtitle, .msg, .note, .footer, .role { font-family: "Comic Mono"; fill: #36464f; }
      .subtitle { font-size: 18px; }
      .participant { font-family: "Architects Daughter"; font-size: 19px; font-weight: 400; fill: #1f3138; }
      .role { font-size: 13px; fill: #546a73; }
      .msg { font-size: 14px; }
      .note { font-size: 13px; }
      .footer { font-size: 14px; fill: #60727d; }
      .frame { fill: #fbfcf8; stroke: #41545d; stroke-width: 3; }
      .header { fill: #ffffff; stroke: #546e7a; stroke-width: 2; }
      .lifeline { stroke: #9aaab1; stroke-width: 2; stroke-dasharray: 7 8; }
      .activation { fill: #f3ecdf; stroke: #8f784e; stroke-width: 1.5; }
      .call { fill: none; stroke: #3f7d9c; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowCall); }
      .sql { fill: none; stroke: #a2743d; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowSql); }
      .state { fill: none; stroke: #6e8f4f; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowState); }
      .return { fill: none; stroke: #9b7d54; stroke-width: 2.5; stroke-dasharray: 8 6; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowReturn); }
      .label { fill: #ffffff; stroke: #d7e0e4; stroke-width: 1.5; }
      .label.callLabel { stroke: #9cc2d1; }
      .label.sqlLabel { stroke: #d0b078; }
      .label.stateLabel { stroke: #b6c9a4; }
      .label.returnLabel { stroke: #c8b38f; }
      .badge { stroke-width: 1.8; }
      .badge.callBadge { fill: #eaf4f8; stroke: #3f7d9c; }
      .badge.sqlBadge { fill: #fff4df; stroke: #a2743d; }
      .badge.stateBadge { fill: #eef7f0; stroke: #6e8f4f; }
      .badge.returnBadge { fill: #fff7e8; stroke: #9b7d54; }
      .badgeText { font-family: "Comic Mono"; font-size: 12px; font-weight: 700; }
      .msg.callText, .badgeText.callText { fill: #2f6f8e; }
      .msg.sqlText, .badgeText.sqlText { fill: #855a29; }
      .msg.stateText, .badgeText.stateText { fill: #55783f; }
      .msg.returnText, .badgeText.returnText { fill: #7f6038; }
    </style>
    <marker id="arrowCall" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" refX="9" refY="5" orient="auto" data-role="sequence" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#3f7d9c" stroke="#3f7d9c" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="arrowSql" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" refX="9" refY="5" orient="auto" data-role="sequence" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#a2743d" stroke="#a2743d" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="arrowState" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" refX="9" refY="5" orient="auto" data-role="sequence" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#6e8f4f" stroke="#6e8f4f" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="arrowReturn" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" refX="9" refY="5" orient="auto" data-role="sequence" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#9b7d54" stroke="#9b7d54" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
  </defs>

  <rect x="24" y="24" width="1552" height="1072" rx="20" class="frame"/>
  <text x="800" y="78" text-anchor="middle" class="title">Exposed SQL DSL Query Flow</text>
  <text x="800" y="108" text-anchor="middle" class="subtitle">Sync and coroutine tests share City/User schema helpers, seed rows, DSL operations, and assertions.</text>

  <g id="participants">
    <rect x="60" y="150" width="170" height="68" rx="10" class="header"/>
    <text x="145" y="179" text-anchor="middle" class="participant">SQL Test</text>
    <text x="145" y="201" text-anchor="middle" class="role">sync + coroutine</text>

    <rect x="292" y="150" width="216" height="68" rx="10" class="header"/>
    <text x="400" y="179" text-anchor="middle" class="participant">Schema Helper</text>
    <text x="400" y="201" text-anchor="middle" class="role">withCityUsers</text>

    <rect x="578" y="150" width="222" height="68" rx="10" class="header"/>
    <text x="689" y="179" text-anchor="middle" class="participant">Transaction</text>
    <text x="689" y="201" text-anchor="middle" class="role">withTables</text>

    <rect x="870" y="150" width="210" height="68" rx="10" class="header"/>
    <text x="975" y="179" text-anchor="middle" class="participant">City/User Tables</text>
    <text x="975" y="201" text-anchor="middle" class="role">seeded schema</text>

    <rect x="1150" y="150" width="170" height="68" rx="10" class="header"/>
    <text x="1235" y="179" text-anchor="middle" class="participant">DSL Body</text>
    <text x="1235" y="201" text-anchor="middle" class="role">query/update</text>

    <rect x="1380" y="150" width="160" height="68" rx="10" class="header"/>
    <text x="1460" y="179" text-anchor="middle" class="participant">Assertion</text>
    <text x="1460" y="201" text-anchor="middle" class="role">Kluent checks</text>
  </g>

  <line x1="145" y1="218" x2="145" y2="972" class="lifeline"/>
  <line x1="400" y1="218" x2="400" y2="972" class="lifeline"/>
  <line x1="689" y1="218" x2="689" y2="972" class="lifeline"/>
  <line x1="975" y1="218" x2="975" y2="972" class="lifeline"/>
  <line x1="1235" y1="218" x2="1235" y2="972" class="lifeline"/>
  <line x1="1460" y1="218" x2="1460" y2="972" class="lifeline"/>

  <rect x="393" y="292" width="14" height="116" rx="6" class="activation"/>
  <rect x="682" y="420" width="14" height="480" rx="6" class="activation"/>
  <rect x="968" y="488" width="14" height="324" rx="6" class="activation"/>
  <rect x="1228" y="676" width="14" height="152" rx="6" class="activation"/>

  <rect x="72" y="258" width="392" height="34" rx="17" class="label callLabel"/>
  <circle cx="96" cy="275" r="13" class="badge callBadge"/><text x="96" y="280" text-anchor="middle" class="badgeText callText">1</text>
  <text x="120" y="280" class="msg callText">withCityUsers() or withSuspendedCityUsers()</text>
  <path d="M 145 300 L 393 300" class="call" data-connector="connector"/>

  <rect x="424" y="330" width="436" height="34" rx="17" class="label stateLabel"/>
  <circle cx="448" cy="347" r="13" class="badge stateBadge"/><text x="448" y="352" text-anchor="middle" class="badgeText stateText">2</text>
  <text x="472" y="352" class="msg stateText">open table scope with CityTable and UserTable</text>
  <path d="M 407 372 L 682 372" class="state" data-connector="connector"/>

  <rect x="668" y="418" width="442" height="34" rx="17" class="label sqlLabel"/>
  <circle cx="692" cy="435" r="13" class="badge sqlBadge"/><text x="692" y="440" text-anchor="middle" class="badgeText sqlText">3</text>
  <text x="716" y="440" class="msg sqlText">create cities/users and seed five rows</text>
  <path d="M 696 460 L 968 460" class="sql" data-connector="connector"/>

  <rect x="452" y="492" width="438" height="34" rx="17" class="label returnLabel"/>
  <circle cx="476" cy="509" r="13" class="badge returnBadge"/><text x="476" y="514" text-anchor="middle" class="badgeText returnText">4</text>
  <text x="500" y="514" class="msg returnText">commit seeded rows before assertions</text>
  <path d="M 968 534 L 407 534" class="return" data-connector="connector"/>

  <rect x="452" y="594" width="546" height="34" rx="17" class="label callLabel"/>
  <circle cx="476" cy="611" r="13" class="badge callBadge"/><text x="476" y="616" text-anchor="middle" class="badgeText callText">5</text>
  <text x="500" y="616" class="msg callText">run update/delete/join/groupBy test body</text>
  <path d="M 407 636 L 1228 636" class="call" data-connector="connector"/>

  <rect x="1044" y="664" width="408" height="34" rx="17" class="label sqlLabel"/>
  <circle cx="1068" cy="681" r="13" class="badge sqlBadge"/><text x="1068" y="686" text-anchor="middle" class="badgeText sqlText">6</text>
  <text x="1092" y="686" class="msg sqlText">select/update/delete through DSL chain</text>
  <path d="M 1242 706 L 982 706" class="sql" data-connector="connector"/>

  <rect x="920" y="746" width="366" height="34" rx="17" class="label returnLabel"/>
  <circle cx="944" cy="763" r="13" class="badge returnBadge"/><text x="944" y="768" text-anchor="middle" class="badgeText returnText">7</text>
  <text x="968" y="768" class="msg returnText">ResultRow or affected count</text>
  <path d="M 982 788 L 1242 788" class="return" data-connector="connector"/>

  <rect x="1156" y="846" width="340" height="34" rx="17" class="label callLabel"/>
  <circle cx="1180" cy="863" r="13" class="badge callBadge"/><text x="1180" y="868" text-anchor="middle" class="badgeText callText">8</text>
  <text x="1204" y="868" class="msg callText">assert rows, counts, and city names</text>
  <path d="M 1242 900 L 1453 900" class="call" data-connector="connector"/>

  <rect x="264" y="930" width="472" height="34" rx="17" class="label returnLabel"/>
  <circle cx="288" cy="947" r="13" class="badge returnBadge"/><text x="288" y="952" text-anchor="middle" class="badgeText returnText">9</text>
  <text x="312" y="952" class="msg returnText">same scenarios pass in sync and coroutine paths</text>
  <path d="M 682 980 L 145 980" class="return" data-connector="connector"/>

  <rect x="98" y="1018" width="1404" height="44" rx="12" fill="#ffffff" stroke="#ccd7da" stroke-width="2"/>
  <text x="118" y="1046" class="note">The sample data path exercises city/user setup, update, delete, joins, groupBy, and coroutine reuse in one scenario.</text>
  <text x="800" y="1078" text-anchor="middle" class="footer">github.com/bluetape4k/exposed-workshop - 03-exposed-basic/exposed-sql-example</text>
</svg>
