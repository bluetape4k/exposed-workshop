<svg xmlns="http://www.w3.org/2000/svg" width="1376" height="1786" viewBox="0 0 1376 1786" role="img" aria-label="DSL Query Flow">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#758297" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 0 1 L 12 6 L 0 11 Z" fill="#ffffff" stroke="#758297" stroke-width="1.8"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="1376" height="1786"/>
<rect class="frame" x="32" y="28" width="1312" height="1730" rx="28"/>
<text class="title" x="66" y="82">DSL Query Flow</text>
<text class="subtitle" x="70" y="118">Sequence messages from the original Mermaid source</text>
<rect class="card" x="21" y="166" width="238" height="72" rx="20" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="140" y="209" text-anchor="middle">Application</text>
<line class="lifeline" x1="140" y1="252" x2="140" y2="1726" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="386.3333333333333" y="166" width="238" height="72" rx="20" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="505.3333333333333" y="209" text-anchor="middle">transaction { }</text>
<line class="lifeline" x1="505.3333333333333" y1="252" x2="505.3333333333333" y2="1726" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="751.6666666666666" y="166" width="238" height="72" rx="20" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="870.6666666666666" y="209" text-anchor="middle">Exposed DSL</text>
<line class="lifeline" x1="870.6666666666666" y1="252" x2="870.6666666666666" y2="1726" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="1117" y="166" width="238" height="72" rx="20" fill="#FDECEF" stroke="#DC6B82"/>
<text class="smallLabel" x="1236" y="209" text-anchor="middle">Database</text>
<line class="lifeline" x1="1236" y1="252" x2="1236" y2="1726" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect x="217.66666666666663" y="286" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="235.66666666666663" y="313" text-anchor="start">1. transaction { }</text>
<path class="line" d="M140 344 L505.3333333333333 344"/>
<rect x="508.5" y="396" width="359" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="526.5" y="423" text-anchor="start">2. CityTable.insert { it[name] = Seoul }</text>
<path class="line" d="M505.3333333333333 454 L870.6666666666666 454"/>
<rect x="877.8333333333333" y="506" width="351" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="895.8333333333333" y="533" text-anchor="start">3. INSERT INTO cities (name) VALUES (?)</text>
<path class="line" d="M870.6666666666666 564 L1236 564"/>
<rect x="948.3333333333333" y="616" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="966.3333333333333" y="643" text-anchor="start">4. generated id</text>
<path class="dashed" d="M1236 674 L870.6666666666666 674"/>
<rect x="583" y="726" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="601" y="753" text-anchor="start">5. ResultRow</text>
<path class="dashed" d="M870.6666666666666 784 L505.3333333333333 784"/>
<rect x="428" y="836" width="520" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="446" y="863" text-anchor="start">6. UserTable.insert { it[id] = debop; it[cityId] = seoulId }</text>
<path class="line" d="M505.3333333333333 894 L870.6666666666666 894"/>
<rect x="805.3333333333333" y="946" width="496" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="823.3333333333333" y="973" text-anchor="start">7. INSERT INTO users (id, name, city_id) VALUES (?, ?, ?)</text>
<path class="line" d="M870.6666666666666 1004 L1236 1004"/>
<rect x="948.3333333333333" y="1056" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="966.3333333333333" y="1083" text-anchor="start">8. OK</text>
<path class="dashed" d="M1236 1114 L870.6666666666666 1114"/>
<rect x="488.5" y="1166" width="399" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="506.5" y="1193" text-anchor="start">9. CityTable.innerJoin(UserTable).selectAll()</text>
<path class="line" d="M505.3333333333333 1224 L870.6666666666666 1224"/>
<rect x="841.8333333333333" y="1276" width="423" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="859.8333333333333" y="1303" text-anchor="start">10. SELECT * FROM cities INNER JOIN users ON ...</text>
<path class="line" d="M870.6666666666666 1334 L1236 1334"/>
<rect x="948.3333333333333" y="1386" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="966.3333333333333" y="1413" text-anchor="start">11. ResultSet</text>
<path class="dashed" d="M1236 1444 L870.6666666666666 1444"/>
<rect x="583" y="1496" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="601" y="1523" text-anchor="start">12. List~ResultRow~</text>
<path class="dashed" d="M870.6666666666666 1554 L505.3333333333333 1554"/>
<rect x="217.66666666666663" y="1606" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="235.66666666666663" y="1633" text-anchor="start">13. Return result</text>
<path class="dashed" d="M505.3333333333333 1664 L140 1664"/>
</svg>
