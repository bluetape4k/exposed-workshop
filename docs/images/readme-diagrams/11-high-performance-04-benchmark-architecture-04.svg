<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Benchmark command and report flow">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
    <marker id="flowHead" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 14 14" data-role="primary" data-tip-direction="positive-x">
      <path d="M2,2 L12,7 L2,12 Z" fill="#64748b" stroke="#64748b" stroke-width="1" stroke-dasharray="none"/>
    </marker>
    <style>
      .canvas{fill:#f6f9fc}
      .frame{fill:#fff;stroke:#d7e2ec;stroke-width:1.5}
      .title{font-family:"Architects Daughter";font-size:34px;fill:#1e293b}
      .subtitle{font-family:"Comic Mono";font-size:13px;fill:#536476}
      .columnTitle{font-family:"Architects Daughter";font-size:12px;letter-spacing:.08em;fill:#94a3b8}
      .card{stroke-width:1.7;filter:url(#shadow)}
      .label{font-family:"Architects Daughter";font-size:18px;fill:#1e293b}
      .detail{font-family:"Comic Mono";font-size:12px;fill:#536476}
      .tiny{font-family:"Comic Mono";font-size:10.5px;fill:#64748b}
      .arrow{fill:none;stroke:#64748b;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#flowHead)}
      .dash{fill:none;stroke:#94a3b8;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:7 5;marker-end:url(#flowHead)}
    </style>
  </defs>

  <rect width="1600" height="900" class="canvas"/>
  <rect x="28" y="24" width="1544" height="852" rx="16" class="frame"/>

  <text x="64" y="70" class="title">Benchmark flow</text>
  <text x="64" y="96" class="subtitle">Gradle tasks select a profile, run kotlinx-benchmark/JMH, then optionally convert the latest JSON result to Markdown</text>

  <text x="200" y="146" class="columnTitle" text-anchor="middle">COMMAND</text>
  <text x="500" y="146" class="columnTitle" text-anchor="middle">PROFILE CONFIG</text>
  <text x="800" y="146" class="columnTitle" text-anchor="middle">JMH EXECUTION</text>
  <text x="1100" y="146" class="columnTitle" text-anchor="middle">JSON ARTIFACT</text>
  <text x="1400" y="146" class="columnTitle" text-anchor="middle">CONSUMER OUTPUT</text>

  <rect x="94" y="180" width="212" height="92" rx="10" fill="#e2e8f0" stroke="#64748b" class="card"/>
  <text x="200" y="214" class="label" text-anchor="middle">smokeBenchmark</text>
  <text x="200" y="238" class="detail" text-anchor="middle">CI / quick local check</text>
  <rect x="394" y="180" width="212" height="92" rx="10" fill="#ccfbf1" stroke="#0f766e" class="card"/>
  <text x="500" y="214" class="label" text-anchor="middle">smoke profile</text>
  <text x="500" y="238" class="detail" text-anchor="middle">2 warmups, 3 iterations</text>
  <text x="500" y="256" class="tiny" text-anchor="middle">300 ms iteration time</text>
  <rect x="694" y="180" width="212" height="92" rx="10" fill="#ede9fe" stroke="#7c3aed" class="card"/>
  <text x="800" y="214" class="label" text-anchor="middle">JMH smoke run</text>
  <text x="800" y="238" class="detail" text-anchor="middle">AverageTime in us</text>
  <rect x="994" y="180" width="212" height="92" rx="10" fill="#dbeafe" stroke="#3b82f6" class="card"/>
  <text x="1100" y="214" class="label" text-anchor="middle">jvm.json</text>
  <text x="1100" y="238" class="detail" text-anchor="middle">reports/benchmarks/smoke</text>
  <rect x="1294" y="180" width="212" height="92" rx="10" fill="#f8fafc" stroke="#94a3b8" class="card"/>
  <text x="1400" y="214" class="label" text-anchor="middle">trend check</text>
  <text x="1400" y="238" class="detail" text-anchor="middle">fast relative signal</text>

  <path data-connector="smoke-command-to-profile" d="M306,226 H394" class="arrow"/>
  <path data-connector="smoke-profile-to-jmh" d="M606,226 H694" class="arrow"/>
  <path data-connector="smoke-jmh-to-json" d="M906,226 H994" class="arrow"/>
  <path data-connector="smoke-json-to-consumer" d="M1206,226 H1294" class="arrow"/>

  <rect x="94" y="370" width="212" height="92" rx="10" fill="#e2e8f0" stroke="#64748b" class="card"/>
  <text x="200" y="404" class="label" text-anchor="middle">benchmark</text>
  <text x="200" y="428" class="detail" text-anchor="middle">default main profile</text>
  <rect x="394" y="370" width="212" height="92" rx="10" fill="#fef3c7" stroke="#d97706" class="card"/>
  <text x="500" y="404" class="label" text-anchor="middle">main profile</text>
  <text x="500" y="428" class="detail" text-anchor="middle">5 warmups, 10 iterations</text>
  <text x="500" y="446" class="tiny" text-anchor="middle">1 s iteration time</text>
  <rect x="694" y="370" width="212" height="92" rx="10" fill="#ede9fe" stroke="#7c3aed" class="card"/>
  <text x="800" y="404" class="label" text-anchor="middle">JMH main run</text>
  <text x="800" y="428" class="detail" text-anchor="middle">forked benchmark JVM</text>
  <rect x="994" y="370" width="212" height="92" rx="10" fill="#dbeafe" stroke="#3b82f6" class="card"/>
  <text x="1100" y="404" class="label" text-anchor="middle">jvm.json</text>
  <text x="1100" y="428" class="detail" text-anchor="middle">reports/benchmarks/main</text>
  <rect x="1294" y="370" width="212" height="92" rx="10" fill="#f8fafc" stroke="#94a3b8" class="card"/>
  <text x="1400" y="404" class="label" text-anchor="middle">analysis input</text>
  <text x="1400" y="428" class="detail" text-anchor="middle">stable comparison data</text>

  <path data-connector="main-command-to-profile" d="M306,416 H394" class="arrow"/>
  <path data-connector="main-profile-to-jmh" d="M606,416 H694" class="arrow"/>
  <path data-connector="main-jmh-to-json" d="M906,416 H994" class="arrow"/>
  <path data-connector="main-json-to-consumer" d="M1206,416 H1294" class="arrow"/>

  <rect x="94" y="560" width="212" height="92" rx="10" fill="#e2e8f0" stroke="#64748b" class="card"/>
  <text x="200" y="594" class="label" text-anchor="middle">benchmarkMarkdown</text>
  <text x="200" y="618" class="detail" text-anchor="middle">optional profile property</text>
  <rect x="394" y="560" width="212" height="92" rx="10" fill="#ccfbf1" stroke="#0f766e" class="card"/>
  <text x="500" y="594" class="label" text-anchor="middle">benchmarkProfile</text>
  <text x="500" y="618" class="detail" text-anchor="middle">main or smoke</text>
  <rect x="694" y="560" width="212" height="92" rx="10" fill="#fef3c7" stroke="#d97706" class="card"/>
  <text x="800" y="594" class="label" text-anchor="middle">dependsOn task</text>
  <text x="800" y="618" class="detail" text-anchor="middle">benchmark / smokeBenchmark</text>
  <rect x="994" y="560" width="212" height="92" rx="10" fill="#ede9fe" stroke="#7c3aed" class="card"/>
  <text x="1100" y="594" class="label" text-anchor="middle">JsonSlurper</text>
  <text x="1100" y="618" class="detail" text-anchor="middle">latest JSON under profile</text>
  <rect x="1294" y="560" width="212" height="92" rx="10" fill="#dbeafe" stroke="#3b82f6" class="card"/>
  <text x="1400" y="594" class="label" text-anchor="middle">benchmark-report.md</text>
  <text x="1400" y="618" class="detail" text-anchor="middle">Markdown score table</text>

  <path data-connector="markdown-command-to-profile" d="M306,606 H394" class="arrow"/>
  <path data-connector="markdown-profile-to-dependson" d="M606,606 H694" class="arrow"/>
  <path data-connector="markdown-dependson-to-jsonslurper" d="M906,606 H994" class="arrow"/>
  <path data-connector="markdown-jsonslurper-to-report" d="M1206,606 H1294" class="arrow"/>

  <rect x="94" y="724" width="1412" height="72" rx="10" fill="#f8fafc" stroke="#d7e2ec" stroke-width="1.3"/>
  <text x="800" y="754" class="label" text-anchor="middle">The markdown task does not invent results; it reruns or reuses the selected profile output and formats the latest JSON rows.</text>
  <text x="800" y="778" class="detail" text-anchor="middle">Output paths stay profile-scoped: build/reports/benchmarks/&lt;profile&gt;/.../jvm.json and benchmark-report.md.</text>
</svg>
