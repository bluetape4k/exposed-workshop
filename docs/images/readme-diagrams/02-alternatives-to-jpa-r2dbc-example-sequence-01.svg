<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 780" width="1320" height="780" role="img" aria-label="R2DBC Comment Request Flow">
<defs>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/></filter>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8 Z" fill="#64748b"/></marker>
<marker id="arrowBlue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8 Z" fill="#2563eb"/></marker>
<marker id="arrowGreen" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8 Z" fill="#16a34a"/></marker>
<marker id="arrowOrange" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8 Z" fill="#ea580c"/></marker>
<marker id="arrowPink" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8 Z" fill="#db2777"/></marker>
<marker id="arrowPurple" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8 Z" fill="#7c3aed"/></marker>
<marker id="arrowTeal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8 Z" fill="#0f766e"/></marker>
<style>
.canvas{fill:#f6f9fc}.frame{fill:#fff;stroke:#d7e2ec;stroke-width:1.5}
.title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:32px;fill:#1e293b}
.subtitle,.detail{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;fill:#536476}
.subtitle{font-size:13px}.detail{font-size:12px}.tiny{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:10px;fill:#64748b}
.label{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:17px;fill:#1e293b}
.panelTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:12px;letter-spacing:.08em;fill:#94a3b8}
.card{stroke-width:1.7;filter:url(#shadow)}.panel{fill:#f8fafc;stroke:#d7e2ec;stroke-width:1.2}
.arrow{fill:none;stroke:#64748b;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
.softArrow{fill:none;stroke:#94a3b8;stroke-width:1.35;stroke-dasharray:5 5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
.fkArrow{fill:none;stroke:#0f766e;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowTeal)}
.mapArrow{fill:none;stroke:#16a34a;stroke-width:1.7;stroke-dasharray:5 5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowGreen)}
.sessionUse{fill:none;stroke:#7c3aed;stroke-width:1.7;stroke-dasharray:5 5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowPurple)}
.repoUse{fill:none;stroke:#2563eb;stroke-width:1.7;stroke-dasharray:5 5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowBlue)}
.opsUse{fill:none;stroke:#16a34a;stroke-width:1.7;stroke-dasharray:5 5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowGreen)}
.clientUse{fill:none;stroke:#ea580c;stroke-width:1.7;stroke-dasharray:5 5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowOrange)}
.converterUse{fill:none;stroke:#db2777;stroke-width:1.7;stroke-dasharray:5 5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowPink)}
.lifeline{fill:none;stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:5 5;stroke-linecap:round;stroke-linejoin:round}
.inherit{fill:none;stroke:#475569;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.inheritHead{fill:#fff;stroke:#475569;stroke-width:1.8;stroke-linejoin:round}
.assoc{fill:none;stroke:#0f766e;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
</style>
</defs>
<rect width="1320" height="780" class="canvas"/>
<rect x="20" y="20" width="1280" height="740" rx="16" class="frame"/>
<text x="48" y="58" class="title">R2DBC Comment Request Flow</text>
<text x="48" y="80" class="subtitle">PostController returns a Flow by delegating Criteria queries to R2dbcEntityOperations</text>
<rect x="40" y="122" width="144" height="52" rx="10" fill="#dbeafe" stroke="#3b82f6" class="card"/>
<text x="112" y="154" class="label" text-anchor="middle">Client</text>
<path d="M112,184 L112,704" class="lifeline"/>
<rect x="236" y="122" width="144" height="52" rx="10" fill="#ede9fe" stroke="#7c3aed" class="card"/>
<text x="308" y="154" class="label" text-anchor="middle">PostController</text>
<path d="M308,184 L308,704" class="lifeline"/>
<rect x="452" y="122" width="144" height="52" rx="10" fill="#dcfce7" stroke="#16a34a" class="card"/>
<text x="524" y="144" class="label" text-anchor="middle">Comment</text>
<text x="524" y="162" class="label" text-anchor="middle">Repository</text>
<path d="M524,184 L524,704" class="lifeline"/>
<rect x="676" y="122" width="144" height="52" rx="10" fill="#ffedd5" stroke="#ea580c" class="card"/>
<text x="748" y="144" class="label" text-anchor="middle">R2dbcEntity</text>
<text x="748" y="162" class="label" text-anchor="middle">Operations</text>
<path d="M748,184 L748,704" class="lifeline"/>
<rect x="894" y="122" width="144" height="52" rx="10" fill="#fce7f3" stroke="#db2777" class="card"/>
<text x="966" y="154" class="label" text-anchor="middle">Criteria Query</text>
<path d="M966,184 L966,704" class="lifeline"/>
<rect x="1088" y="122" width="144" height="52" rx="10" fill="#ccfbf1" stroke="#0f766e" class="card"/>
<text x="1160" y="154" class="label" text-anchor="middle">comments Table</text>
<path d="M1160,184 L1160,704" class="lifeline"/>
<rect x="142" y="196" width="136" height="24" rx="8" fill="#fff" stroke="#d7e2ec"/>
<text x="210" y="213" class="tiny" text-anchor="middle">1. GET /posts/{postId}/comments</text>
<path d="M128,224 L292,224" class="arrow"/>
<rect x="338" y="258" width="156" height="24" rx="8" fill="#fff" stroke="#d7e2ec"/>
<text x="416" y="275" class="tiny" text-anchor="middle">2. findAllByPostId(postId)</text>
<path d="M324,286 L508,286" class="arrow"/>
<rect x="554" y="320" width="382" height="24" rx="8" fill="#fff" stroke="#d7e2ec"/>
<text x="745" y="337" class="tiny" text-anchor="middle">3. Criteria.where(postId).isEqual</text>
<path d="M540,348 L950,348" class="arrow"/>
<rect x="554" y="382" width="164" height="24" rx="8" fill="#fff" stroke="#d7e2ec"/>
<text x="636" y="399" class="tiny" text-anchor="middle">4. selectSuspending&lt;Comment&gt;(query)</text>
<path d="M540,410 L732,410" class="arrow"/>
<rect x="778" y="444" width="352" height="24" rx="8" fill="#fff" stroke="#d7e2ec"/>
<text x="954" y="461" class="tiny" text-anchor="middle">5. SELECT comments WHERE post_id</text>
<path d="M764,472 L1144,472" class="arrow"/>
<rect x="778" y="506" width="352" height="24" rx="8" fill="#fff" stroke="#d7e2ec"/>
<text x="954" y="523" class="tiny" text-anchor="middle">6. matching rows</text>
<path d="M1144,534 L764,534" class="softArrow"/>
<rect x="554" y="568" width="164" height="24" rx="8" fill="#fff" stroke="#d7e2ec"/>
<text x="636" y="585" class="tiny" text-anchor="middle">7. Flow&lt;Comment&gt;</text>
<path d="M732,596 L540,596" class="softArrow"/>
<rect x="338" y="630" width="156" height="24" rx="8" fill="#fff" stroke="#d7e2ec"/>
<text x="416" y="647" class="tiny" text-anchor="middle">8. stream comments</text>
<path d="M508,658 L324,658" class="softArrow"/>
<rect x="142" y="676" width="136" height="24" rx="8" fill="#fff" stroke="#d7e2ec"/>
<text x="210" y="693" class="tiny" text-anchor="middle">9. HTTP response body</text>
<path d="M292,704 L128,704" class="softArrow"/>
<rect x="78" y="714" width="1164" height="48" rx="10" fill="#ecfdf5" stroke="#86efac" stroke-width="1.3"/>
<text x="660" y="744" class="detail" text-anchor="middle">PostController.saveComment writes the same table through insertSuspending; the read path shown here is the Criteria based Flow query.</text>
</svg>
