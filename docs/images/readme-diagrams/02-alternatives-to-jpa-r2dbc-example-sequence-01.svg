<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc">
  <title id="title">R2DBC comment request sequence</title>
  <desc id="desc">Sequence for the R2DBC workshop path where PostController delegates a comment lookup to the repository, builds a Criteria query, executes it through R2dbcEntityOperations, and streams comments.</desc>
  <defs>
    <style>
      text { letter-spacing: 0; }
      .title { font-family: "Architects Daughter"; font-size: 40px; font-weight: 400; fill: #263238; }
      .subtitle, .msg, .note, .footer, .role { font-family: "Comic Mono"; fill: #36464f; }
      .subtitle { font-size: 18px; }
      .participant { font-family: "Architects Daughter"; font-size: 19px; font-weight: 400; fill: #1f3138; }
      .role { font-size: 13px; fill: #546a73; }
      .msg { font-size: 14px; }
      .note { font-size: 13px; }
      .footer { font-size: 14px; fill: #60727d; }
      .frame { fill: #fbfcf8; stroke: #41545d; stroke-width: 3; }
      .header { fill: #ffffff; stroke: #546e7a; stroke-width: 2; }
      .lifeline { stroke: #9aaab1; stroke-width: 2; stroke-dasharray: 7 8; }
      .activation { fill: #f3ecdf; stroke: #8f784e; stroke-width: 1.5; }
      .call { fill: none; stroke: #3f7d9c; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowCall); }
      .sql { fill: none; stroke: #a2743d; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowSql); }
      .state { fill: none; stroke: #6e8f4f; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowState); }
      .return { fill: none; stroke: #9b7d54; stroke-width: 2.5; stroke-dasharray: 8 6; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowReturn); }
      .label { fill: #ffffff; stroke: #d7e0e4; stroke-width: 1.5; }
      .label.callLabel { stroke: #9cc2d1; }
      .label.sqlLabel { stroke: #d0b078; }
      .label.stateLabel { stroke: #b6c9a4; }
      .label.returnLabel { stroke: #c8b38f; }
      .badge { stroke-width: 1.8; }
      .badge.callBadge { fill: #eaf4f8; stroke: #3f7d9c; }
      .badge.sqlBadge { fill: #fff4df; stroke: #a2743d; }
      .badge.stateBadge { fill: #eef7f0; stroke: #6e8f4f; }
      .badge.returnBadge { fill: #fff7e8; stroke: #9b7d54; }
      .badgeText { font-family: "Comic Mono"; font-size: 12px; font-weight: 700; }
      .msg.callText, .badgeText.callText { fill: #2f6f8e; }
      .msg.sqlText, .badgeText.sqlText { fill: #855a29; }
      .msg.stateText, .badgeText.stateText { fill: #55783f; }
      .msg.returnText, .badgeText.returnText { fill: #7f6038; }
    </style>
    <marker id="arrowCall" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#3f7d9c" stroke="#3f7d9c" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="arrowSql" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#a2743d" stroke="#a2743d" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="arrowState" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#6e8f4f" stroke="#6e8f4f" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="arrowReturn" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#9b7d54" stroke="#9b7d54" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
  </defs>

  <rect x="24" y="24" width="1552" height="1032" rx="20" class="frame"/>
  <text x="800" y="78" text-anchor="middle" class="title">R2DBC Comment Request Flow</text>
  <text x="800" y="108" text-anchor="middle" class="subtitle">PostController returns a Flow after Criteria construction and R2dbcEntityOperations query execution.</text>

  <g id="participants">
    <rect x="60" y="150" width="170" height="68" rx="10" class="header"/>
    <text x="145" y="179" text-anchor="middle" class="participant">Client</text>
    <text x="145" y="201" text-anchor="middle" class="role">HTTP caller</text>

    <rect x="300" y="150" width="210" height="68" rx="10" class="header"/>
    <text x="405" y="179" text-anchor="middle" class="participant">PostController</text>
    <text x="405" y="201" text-anchor="middle" class="role">Flow endpoint</text>

    <rect x="580" y="150" width="220" height="68" rx="10" class="header"/>
    <text x="690" y="179" text-anchor="middle" class="participant">Comment Repository</text>
    <text x="690" y="201" text-anchor="middle" class="role">criteria facade</text>

    <rect x="880" y="150" width="170" height="68" rx="10" class="header"/>
    <text x="965" y="179" text-anchor="middle" class="participant">Criteria Query</text>
    <text x="965" y="201" text-anchor="middle" class="role">postId filter</text>

    <rect x="1128" y="150" width="184" height="68" rx="10" class="header"/>
    <text x="1220" y="179" text-anchor="middle" class="participant">R2dbc Ops</text>
    <text x="1220" y="201" text-anchor="middle" class="role">Spring Data</text>

    <rect x="1376" y="150" width="168" height="68" rx="10" class="header"/>
    <text x="1460" y="179" text-anchor="middle" class="participant">comments</text>
    <text x="1460" y="201" text-anchor="middle" class="role">table rows</text>
  </g>

  <line x1="145" y1="218" x2="145" y2="928" class="lifeline"/>
  <line x1="405" y1="218" x2="405" y2="928" class="lifeline"/>
  <line x1="690" y1="218" x2="690" y2="928" class="lifeline"/>
  <line x1="965" y1="218" x2="965" y2="928" class="lifeline"/>
  <line x1="1220" y1="218" x2="1220" y2="928" class="lifeline"/>
  <line x1="1460" y1="218" x2="1460" y2="928" class="lifeline"/>

  <rect x="398" y="300" width="14" height="608" rx="6" class="activation"/>
  <rect x="683" y="402" width="14" height="404" rx="6" class="activation"/>
  <rect x="958" y="504" width="14" height="116" rx="6" class="activation"/>
  <rect x="1213" y="606" width="14" height="200" rx="6" class="activation"/>
  <rect x="1453" y="708" width="14" height="98" rx="6" class="activation"/>

  <rect x="72" y="260" width="430" height="34" rx="17" class="label callLabel"/>
  <circle cx="96" cy="277" r="13" class="badge callBadge"/><text x="96" y="282" text-anchor="middle" class="badgeText callText">1</text>
  <text x="120" y="282" class="msg callText">GET /posts/{postId}/comments</text>
  <path d="M 145 318 L 398 318" class="call"/>

  <rect x="314" y="362" width="440" height="34" rx="17" class="label callLabel"/>
  <circle cx="338" cy="379" r="13" class="badge callBadge"/><text x="338" y="384" text-anchor="middle" class="badgeText callText">2</text>
  <text x="362" y="384" class="msg callText">findAllByPostId(postId)</text>
  <path d="M 412 420 L 683 420" class="call"/>

  <rect x="594" y="464" width="492" height="34" rx="17" class="label stateLabel"/>
  <circle cx="618" cy="481" r="13" class="badge stateBadge"/><text x="618" y="486" text-anchor="middle" class="badgeText stateText">3</text>
  <text x="642" y="486" class="msg stateText">Criteria.where("postId").isEqual(postId)</text>
  <path d="M 697 522 L 958 522" class="state"/>

  <rect x="586" y="566" width="426" height="34" rx="17" class="label returnLabel"/>
  <circle cx="610" cy="583" r="13" class="badge returnBadge"/><text x="610" y="588" text-anchor="middle" class="badgeText returnText">4</text>
  <text x="634" y="588" class="msg returnText">query object with post_id predicate</text>
  <path d="M 958 602 L 697 602" class="return"/>

  <rect x="788" y="668" width="542" height="34" rx="17" class="label callLabel"/>
  <circle cx="812" cy="685" r="13" class="badge callBadge"/><text x="812" y="690" text-anchor="middle" class="badgeText callText">5</text>
  <text x="836" y="690" class="msg callText">selectSuspending&lt;Comment&gt;(query)</text>
  <path d="M 697 726 L 1213 726" class="call"/>

  <rect x="1040" y="760" width="442" height="34" rx="17" class="label sqlLabel"/>
  <circle cx="1064" cy="777" r="13" class="badge sqlBadge"/><text x="1064" y="782" text-anchor="middle" class="badgeText sqlText">6</text>
  <text x="1088" y="782" class="msg sqlText">SELECT comments WHERE post_id</text>
  <path d="M 1227 806 L 1453 806" class="sql"/>

  <rect x="610" y="832" width="500" height="34" rx="17" class="label returnLabel"/>
  <circle cx="634" cy="849" r="13" class="badge returnBadge"/><text x="634" y="854" text-anchor="middle" class="badgeText returnText">7</text>
  <text x="658" y="854" class="msg returnText">Flow&lt;Comment&gt; streams matching rows</text>
  <path d="M 1213 878 L 412 878" class="return"/>

  <rect x="88" y="972" width="1404" height="44" rx="12" fill="#ffffff" stroke="#ccd7da" stroke-width="2"/>
  <text x="108" y="1000" class="note">PostController.saveComment writes the same table through insertSuspending; this read path shows the Criteria based Flow query.</text>
  <text x="800" y="1032" text-anchor="middle" class="footer">github.com/bluetape4k/exposed-workshop - 02-alternatives-to-jpa/r2dbc-example</text>
</svg>
