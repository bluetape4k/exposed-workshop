<rect class="canvas" width="1500" height="980"/><rect class="frame" x="28" y="26" width="1444" height="920" rx="24"/>
<text class="title" x="60" y="76">R2DBC Comment Request Flow</text>
<text class="subtitle" x="60" y="102">WebFlux controller streams comments through Spring Data R2DBC repository and entity operations.</text>

<rect class="header" x="70" y="158" width="150" height="66" rx="14" stroke="#4f86c6"/><text class="participant" x="145" y="188" text-anchor="middle">Client</text><text class="role" x="145" y="207" text-anchor="middle">HTTP caller</text><path class="lifeline" d="M145 238 V846"/>
<rect class="header" x="285" y="158" width="170" height="66" rx="14" stroke="#4f86c6"/><text class="participant" x="370" y="188" text-anchor="middle">PostController</text><text class="role" x="370" y="207" text-anchor="middle">WebFlux handler</text><path class="lifeline" d="M370 238 V846"/>
<rect class="header" x="520" y="158" width="185" height="66" rx="14" stroke="#6f8f4e"/><text class="participant" x="612" y="188" text-anchor="middle">PostRepository</text><text class="role" x="612" y="207" text-anchor="middle">post lookup</text><path class="lifeline" d="M612 238 V846"/>
<rect class="header" x="770" y="158" width="205" height="66" rx="14" stroke="#a06a3b"/><text class="participant" x="872" y="188" text-anchor="middle">CommentRepository</text><text class="role" x="872" y="207" text-anchor="middle">criteria by postId</text><path class="lifeline" d="M872 238 V846"/>
<rect class="header" x="1040" y="158" width="180" height="66" rx="14" stroke="#a06a3b"/><text class="participant" x="1130" y="188" text-anchor="middle">R2dbcOperations</text><text class="role" x="1130" y="207" text-anchor="middle">select/count</text><path class="lifeline" d="M1130 238 V846"/>
<rect class="header" x="1280" y="158" width="150" height="66" rx="14" stroke="#3f8f8a"/><text class="participant" x="1355" y="188" text-anchor="middle">Flow&lt;Comment&gt;</text><text class="role" x="1355" y="207" text-anchor="middle">stream result</text><path class="lifeline" d="M1355 238 V846"/>

<rect class="activation" x="364" y="270" width="12" height="540"/>
<rect class="activation" x="606" y="350" width="12" height="145"/>
<rect class="activation" x="866" y="430" width="12" height="285"/>
<rect class="activation" x="1124" y="510" width="12" height="115"/>

<rect class="alt" x="84" y="632" width="1298" height="150" rx="16"/>
<rect class="branchBadge" x="104" y="614" width="218" height="30" rx="10" stroke="#3f8f8a"/><text class="branchText" x="213" y="634" text-anchor="middle">alt comments endpoint</text>
<path class="branchDivider" d="M84 704 H1382"/>
<rect class="branchBadge" x="104" y="690" width="350" height="30" rx="10" stroke="#b45a5a"/><text class="branchText" x="279" y="710" text-anchor="middle">else missing post throws 404</text>

<path class="call callBlue" d="M154 282 H360" stroke="#4f86c6" marker-end="url(#seqArrowBlue)"/>
<rect class="pill" x="180" y="239" width="292" height="28" rx="10" stroke="#4f86c6"/><circle class="numCircle" cx="200" cy="253" r="11" stroke="#4f86c6"/><text class="num" x="200" y="257" text-anchor="middle" fill="#4f86c6">1</text><text class="labelText" x="220" y="258">GET /posts/{postId}/comments</text>

<path class="call callBlue" d="M379 362 H602" stroke="#4f86c6" marker-end="url(#seqArrowBlue)"/>
<rect class="pill" x="410" y="319" width="260" height="28" rx="10" stroke="#4f86c6"/><circle class="numCircle" cx="430" cy="333" r="11" stroke="#4f86c6"/><text class="num" x="430" y="337" text-anchor="middle" fill="#4f86c6">2</text><text class="labelText" x="450" y="338">findByIdOrNull(postId)</text>

<path class="return seqReturn" d="M603 472 H379" stroke="#3f8f8a" marker-end="url(#seqArrowTeal)"/>
<rect class="pill" x="420" y="435" width="218" height="28" rx="10" stroke="#3f8f8a"/><circle class="numCircle" cx="440" cy="449" r="11" stroke="#3f8f8a"/><text class="num" x="440" y="453" text-anchor="middle" fill="#3f8f8a">3</text><text class="labelText" x="460" y="454">post exists?</text>

<path class="call callGreen" d="M379 522 H862" stroke="#6f8f4e" marker-end="url(#seqArrowGreen)"/>
<rect class="pill" x="558" y="479" width="288" height="28" rx="10" stroke="#6f8f4e"/><circle class="numCircle" cx="578" cy="493" r="11" stroke="#6f8f4e"/><text class="num" x="578" y="497" text-anchor="middle" fill="#6f8f4e">4</text><text class="labelText" x="598" y="498">findAllByPostId(postId)</text>

<path class="call callAmber" d="M881 602 H1120" stroke="#a06a3b" marker-end="url(#seqArrowAmber)"/>
<rect class="pill" x="910" y="559" width="330" height="28" rx="10" stroke="#a06a3b"/><circle class="numCircle" cx="930" cy="573" r="11" stroke="#a06a3b"/><text class="num" x="930" y="577" text-anchor="middle" fill="#a06a3b">5</text><text class="labelText" x="950" y="578">select where postId equals path var</text>

<path class="call callAmber" d="M1139 672 H1345" stroke="#a06a3b" marker-end="url(#seqArrowAmber)"/>
<rect class="pill" x="1168" y="635" width="246" height="28" rx="10" stroke="#a06a3b"/><circle class="numCircle" cx="1188" cy="649" r="11" stroke="#a06a3b"/><text class="num" x="1188" y="653" text-anchor="middle" fill="#a06a3b">6</text><text class="labelText" x="1208" y="654">stream Comment rows</text>

<path class="return error" d="M862 746 H379" stroke="#b45a5a" marker-end="url(#seqArrowRed)"/>
<rect class="pill" x="500" y="711" width="290" height="28" rx="10" stroke="#b45a5a"/><circle class="numCircle" cx="520" cy="725" r="11" stroke="#b45a5a"/><text class="num" x="520" y="729" text-anchor="middle" fill="#b45a5a">7</text><text class="labelText" x="540" y="730">PostNotFoundException</text>

<path class="return seqReturn" d="M361 822 H154" stroke="#3f8f8a" marker-end="url(#seqArrowTeal)"/>
<rect class="pill" x="169" y="785" width="292" height="28" rx="10" stroke="#3f8f8a"/><circle class="numCircle" cx="189" cy="799" r="11" stroke="#3f8f8a"/><text class="num" x="189" y="803" text-anchor="middle" fill="#3f8f8a">8</text><text class="labelText" x="209" y="804">WebFlux writes Flow response</text>

<rect class="note" x="90" y="878" width="1320" height="44" rx="14"/>
<text class="footer" x="750" y="906" text-anchor="middle">Controller methods return Flow for read streams and use suspend functions for single-row lookups and counts.</text>
</svg>
