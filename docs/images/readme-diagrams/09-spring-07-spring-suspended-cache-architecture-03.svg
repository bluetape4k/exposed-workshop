<svg xmlns="http://www.w3.org/2000/svg" width="1378" height="1024" viewBox="0 0 1378 1024" role="img" aria-label="Cache Flow">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#758297" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 0 1 L 12 6 L 0 11 Z" fill="#ffffff" stroke="#758297" stroke-width="1.8"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="1378" height="1024"/>
<rect class="frame" x="32" y="28" width="1314" height="968" rx="28"/>
<text class="title" x="66" y="82">Cache Flow</text>
<text class="subtitle" x="70" y="118">Architecture nodes and edges from the original Mermaid source</text>
<path class="line" d="M1040 718 C1040 801 839 801 839 884"/>
<path class="line" d="M1006 718 C1006 718 1040 718 1040 718"/>
<path class="line" d="M672 718 C672 718 706 718 706 718"/>
<path class="line" d="M338 718 C338 718 372 718 372 718"/>
<path class="line" d="M1040 552 C1040 635 338 635 338 718"/>
<path class="line" d="M672 552 C672 552 706 552 706 552"/>
<path class="line" d="M338 552 C338 552 372 552 372 552"/>
<path class="line" d="M1040 386 C1040 469 338 469 338 552"/>
<path class="line" d="M1006 386 C1006 386 1040 386 1040 386"/>
<path class="line" d="M338 386 C338 386 706 386 706 386"/>
<path class="line" d="M522 280 C522 303 522 303 522 326"/>
<path class="line" d="M672 220 C672 220 1040 220 1040 220"/>
<path class="line" d="M338 220 C338 220 372 220 372 220"/>
<g transform="translate(48,170)">
  <rect class="card" x="0" y="0" width="280" height="100" rx="14" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="smallLabel" x="140" y="33" text-anchor="middle">suspend findByCode</text>
<text class="smallLabel" x="140" y="59" text-anchor="middle">called</text>
</g>
<g transform="translate(382,170)">
  <rect class="card" x="0" y="0" width="280" height="100" rx="14" fill="#EAF7EF" stroke="#58A978"/>
  <text class="smallLabel" x="140" y="33" text-anchor="middle">Lettuce Suspended</text>
<text class="smallLabel" x="140" y="59" text-anchor="middle">Cache cache.get hit?</text>
</g>
<g transform="translate(716,170)">
  <rect class="card" x="0" y="0" width="280" height="100" rx="14" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="smallLabel" x="140" y="21" text-anchor="middle">Return CountryRecord</text>
<text class="smallLabel" x="140" y="47" text-anchor="middle">immediately No DB</text>
<text class="smallLabel" x="140" y="73" text-anchor="middle">query</text>
</g>
<g transform="translate(1050,170)">
  <rect class="card" x="0" y="0" width="280" height="100" rx="14" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="smallLabel" x="140" y="45" text-anchor="middle">Yes</text>
</g>
<g transform="translate(48,336)">
  <rect class="card" x="0" y="0" width="280" height="100" rx="14" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="smallLabel" x="140" y="33" text-anchor="middle">Call</text>
<text class="smallLabel" x="140" y="59" text-anchor="middle">delegate.findByCode</text>
</g>
<g transform="translate(382,336)">
  <rect class="card" x="0" y="0" width="280" height="100" rx="14" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="smallLabel" x="140" y="45" text-anchor="middle">No</text>
</g>
<g transform="translate(716,336)">
  <rect class="card" x="0" y="0" width="280" height="100" rx="14" fill="#F7F1E7" stroke="#B88A44"/>
  <text class="smallLabel" x="140" y="33" text-anchor="middle">Start new Suspended</text>
<text class="smallLabel" x="140" y="59" text-anchor="middle">Transaction</text>
</g>
<g transform="translate(1050,336)">
  <rect class="card" x="0" y="0" width="280" height="100" rx="14" fill="#EEF6D9" stroke="#8BA84D"/>
  <text class="smallLabel" x="140" y="33" text-anchor="middle">Country Table.select</text>
<text class="smallLabel" x="140" y="59" text-anchor="middle">All WHERE code = ?</text>
</g>
<g transform="translate(48,502)">
  <rect class="card" x="0" y="0" width="280" height="100" rx="14" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="smallLabel" x="140" y="33" text-anchor="middle">DB result</text>
<text class="smallLabel" x="140" y="59" text-anchor="middle">CountryRecord</text>
</g>
<g transform="translate(382,502)">
  <rect class="card" x="0" y="0" width="280" height="100" rx="14" fill="#EAF7EF" stroke="#58A978"/>
  <text class="smallLabel" x="140" y="33" text-anchor="middle">Save to Redis via</text>
<text class="smallLabel" x="140" y="59" text-anchor="middle">cache.put TTL 60s</text>
</g>
<g transform="translate(716,502)">
  <rect class="card" x="0" y="0" width="280" height="100" rx="14" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="smallLabel" x="140" y="45" text-anchor="middle">Return CountryRecord</text>
</g>
<g transform="translate(1050,502)">
  <rect class="card" x="0" y="0" width="280" height="100" rx="14" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="smallLabel" x="140" y="33" text-anchor="middle">suspend update</text>
<text class="smallLabel" x="140" y="59" text-anchor="middle">called</text>
</g>
<g transform="translate(48,668)">
  <rect class="card" x="0" y="0" width="280" height="100" rx="14" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="smallLabel" x="140" y="21" text-anchor="middle">Immediately evict</text>
<text class="smallLabel" x="140" y="47" text-anchor="middle">cache via</text>
<text class="smallLabel" x="140" y="73" text-anchor="middle">cache.evict</text>
</g>
<g transform="translate(382,668)">
  <rect class="card" x="0" y="0" width="280" height="100" rx="14" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="smallLabel" x="140" y="45" text-anchor="middle">Call delegate.update</text>
</g>
<g transform="translate(716,668)">
  <rect class="card" x="0" y="0" width="280" height="100" rx="14" fill="#F7F1E7" stroke="#B88A44"/>
  <text class="smallLabel" x="140" y="33" text-anchor="middle">new Suspended</text>
<text class="smallLabel" x="140" y="59" text-anchor="middle">Transaction</text>
</g>
<g transform="translate(1050,668)">
  <rect class="card" x="0" y="0" width="280" height="100" rx="14" fill="#EEF6D9" stroke="#8BA84D"/>
  <text class="smallLabel" x="140" y="45" text-anchor="middle">CountryTable.update</text>
</g>
<g transform="translate(549,834)">
  <rect class="card" x="0" y="0" width="280" height="100" rx="14" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="smallLabel" x="140" y="33" text-anchor="middle">Return number of</text>
<text class="smallLabel" x="140" y="59" text-anchor="middle">updated rows</text>
</g>
</svg>
