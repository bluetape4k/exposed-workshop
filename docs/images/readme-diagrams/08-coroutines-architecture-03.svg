<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 900" width="1500" height="900" role="img" aria-label="Coroutine Transaction Flow">
<defs>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/></filter>
<marker id="arrowBlue" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563eb" stroke="#2563eb" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
<marker id="arrowGreen" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#16a34a" stroke="#16a34a" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
<marker id="arrowPink" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#db2777" stroke="#db2777" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
<marker id="arrowOrange" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#ea580c" stroke="#ea580c" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
<marker id="arrowPurple" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7c3aed" stroke="#7c3aed" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
<marker id="arrowGray" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b" stroke="#64748b" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
<style>
.canvas{fill:#f6f9fc}.frame{fill:#fff;stroke:#d7e2ec;stroke-width:1.5}
.title{font-family:"Architects Daughter";font-size:31px;fill:#1e293b}
.subtitle,.detail{font-family:"Comic Mono";fill:#536476}
.subtitle{font-size:13px}.detail{font-size:12px}.tiny{font-family:"Comic Mono";font-size:10px;fill:#64748b}
.label{font-family:"Architects Daughter";font-size:16px;fill:#1e293b}
.panelTitle{font-family:"Architects Daughter";font-size:12px;letter-spacing:.08em;fill:#94a3b8}
.card{stroke-width:1.7;filter:url(#shadow)}.panel{fill:#f8fafc;stroke:#d7e2ec;stroke-width:1.2}
.arrow{fill:none;stroke:#2563eb;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowBlue)}
.mapLine{fill:none;stroke:#16a34a;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowGreen)}
.codecLine{fill:none;stroke:#db2777;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowPink)}
.dbUse{fill:none;stroke:#ea580c;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowOrange)}
.runtimeUse{fill:none;stroke:#7c3aed;stroke-width:1.9;stroke-dasharray:6 5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowPurple)}
.returnLine{fill:none;stroke:#64748b;stroke-width:1.7;stroke-dasharray:7 5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowGray)}
.lifeline{stroke:#cbd5e1;stroke-width:1.4;stroke-dasharray:5 6}
</style>
</defs>
<rect width="1500" height="900" class="canvas"/>
<rect x="20" y="20" width="1460" height="860" rx="16" class="frame"/>
<text x="48" y="58" class="title">Coroutine Transaction Flow</text>
<text x="48" y="80" class="subtitle">Ex01_Coroutines uses withTablesSuspending, newSuspendedTransaction, suspendedTransactionAsync, and withSuspendTransaction against Tester tables</text>
<rect x="58" y="130" width="320" height="590" rx="12" class="panel"/><text x="218" y="122" class="panelTitle" text-anchor="middle">TEST HARNESS</text>
<desc>runSuspendIO</desc><rect x="98" y="178" width="220" height="62" rx="10" fill="#dbeafe" stroke="#3b82f6" class="card"/>
<text x="208" y="203" class="label" text-anchor="middle">runSuspendIO</text>
<text x="208" y="226" class="detail" text-anchor="middle">coroutine test scope</text>
<desc>withTablesSuspending</desc><rect x="98" y="298" width="220" height="62" rx="10" fill="#dcfce7" stroke="#16a34a" class="card"/>
<text x="208" y="323" class="label" text-anchor="middle">withTablesSuspending</text>
<text x="208" y="346" class="detail" text-anchor="middle">create/drop tables</text>
<desc>single dispatcher</desc><rect x="98" y="418" width="220" height="62" rx="10" fill="#e2e8f0" stroke="#64748b" class="card"/>
<text x="208" y="443" class="label" text-anchor="middle">single dispatcher</text>
<text x="208" y="466" class="detail" text-anchor="middle">ordered work</text>
<desc>assertions</desc><rect x="98" y="538" width="220" height="62" rx="10" fill="#fce7f3" stroke="#db2777" class="card"/>
<text x="208" y="563" class="label" text-anchor="middle">assertions</text>
<text x="208" y="586" class="detail" text-anchor="middle">count + exceptions</text>
<rect x="452" y="130" width="350" height="590" rx="12" class="panel"/><text x="627" y="122" class="panelTitle" text-anchor="middle">COROUTINE TRANSACTION APIS</text>
<desc>newSuspendedTransaction</desc><rect x="506" y="176" width="236" height="64" rx="10" fill="#ede9fe" stroke="#7c3aed" class="card"/>
<text x="624" y="201" class="label" text-anchor="middle">newSuspendedTransaction</text>
<text x="624" y="226" class="detail" text-anchor="middle">Dispatchers.IO / db</text>
<desc>withSuspendTransaction</desc><rect x="506" y="302" width="236" height="64" rx="10" fill="#ccfbf1" stroke="#0f766e" class="card"/>
<text x="624" y="327" class="label" text-anchor="middle">withSuspendTransaction</text>
<text x="624" y="352" class="detail" text-anchor="middle">nested lookup</text>
<desc>suspended Tx async</desc><rect x="506" y="428" width="236" height="64" rx="10" fill="#fef3c7" stroke="#d97706" class="card"/>
<text x="624" y="453" class="label" text-anchor="middle">suspended Tx async</text>
<text x="624" y="478" class="detail" text-anchor="middle">10 parallel tasks</text>
<desc>awaitAll</desc><rect x="506" y="554" width="236" height="64" rx="10" fill="#e2e8f0" stroke="#64748b" class="card"/>
<text x="624" y="579" class="label" text-anchor="middle">awaitAll</text>
<text x="624" y="604" class="detail" text-anchor="middle">join results</text>
<rect x="878" y="130" width="310" height="590" rx="12" class="panel"/><text x="1033" y="122" class="panelTitle" text-anchor="middle">EXPOSED SCHEMA</text>
<desc>Tester</desc><rect x="922" y="198" width="222" height="70" rx="10" fill="#dcfce7" stroke="#16a34a" class="card"/>
<text x="1033" y="223" class="label" text-anchor="middle">Tester</text>
<text x="1033" y="254" class="detail" text-anchor="middle">IntIdTable coroutines_tester</text>
<desc>TesterUnique</desc><rect x="922" y="384" width="222" height="70" rx="10" fill="#fce7f3" stroke="#db2777" class="card"/>
<text x="1033" y="409" class="label" text-anchor="middle">TesterUnique</text>
<text x="1033" y="440" class="detail" text-anchor="middle">Table + unique PK</text>
<desc>TesterEntity</desc><rect x="922" y="570" width="222" height="70" rx="10" fill="#ede9fe" stroke="#7c3aed" class="card"/>
<text x="1033" y="595" class="label" text-anchor="middle">TesterEntity</text>
<text x="1033" y="626" class="detail" text-anchor="middle">IntEntity duplicate test</text>
<rect x="1260" y="130" width="180" height="590" rx="12" class="panel"/><text x="1350" y="122" class="panelTitle" text-anchor="middle">DATABASE</text>
<path d="M1292,309 C1292,288 1404,288 1404,309 L1404,485 C1404,506 1292,506 1292,485 Z" fill="#fff" stroke="#ea580c" stroke-width="1.7" class="card"/>
<ellipse cx="1348" cy="309" rx="56" ry="17" fill="#ffedd5" stroke="#ea580c" stroke-width="1.7"/>
<path d="M1292,485 C1292,506 1404,506 1404,485" fill="none" stroke="#ea580c" stroke-width="1.7"/>
