<text x="1306" y="378" class="tiny">H2</text>
<text x="1306" y="396" class="tiny">Postgres</text>
<text x="1306" y="414" class="tiny">MySQL</text>
<path d="M318,209 L506,209" class="arrow" data-connector="run-to-new-suspended"/>
<path d="M318,329 L506,329" class="arrow" data-connector="fixture-to-with-suspend"/>
<path d="M318,449 L506,449" class="runtimeUse" data-connector="dispatcher-to-async"/>
<path d="M742,208 L922,208" class="mapLine" data-connector="new-suspended-to-tester"/>
<path d="M742,334 L822,334 Q842,334 842,314 L842,258 Q842,238 862,238 L922,238" class="mapLine" data-connector="with-suspend-to-tester"/>
<path d="M742,460 L842,460 Q862,460 862,440 L862,419 Q862,399 882,399 L922,399" class="arrow" data-connector="async-to-unique"/>
<path d="M742,586 L922,586" class="runtimeUse" data-connector="await-to-entity"/>
<path d="M1144,233 L1200,233 Q1220,233 1220,253 L1220,340 Q1220,360 1240,360 L1292,360" class="dbUse" data-connector="tester-to-db"/>
<path d="M1144,419 L1292,419" class="dbUse" data-connector="unique-to-db"/>
<path d="M1144,605 L1200,605 Q1220,605 1220,585 L1220,500 Q1220,480 1240,480 L1292,480" class="dbUse" data-connector="entity-to-db"/>
<rect x="132" y="780" width="1236" height="52" rx="10" fill="#ecfdf5" stroke="#86efac" stroke-width="1.3"/>
<text x="750" y="811" class="detail" text-anchor="middle">Ex01_Coroutines inserts/selects Tester rows, uses TesterUnique for duplicate-key failures, and confirms nested connection cleanup.</text>
</svg>
