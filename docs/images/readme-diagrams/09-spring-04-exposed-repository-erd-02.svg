<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 530" width="980" height="530" role="img" aria-label="09 Spring: Exposed Repository (04)">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
    <style>
  .canvas{fill:#f6f9fc}
  .frame{fill:#fff;stroke:#d7e2ec;stroke-width:1.5}
  .panel{fill:#f8fafc;stroke:#d7e2ec;stroke-width:1.2}
  .card{stroke-width:1.7;filter:url(#shadow)}
  .title{font-family:"Architects Daughter";font-size:32px;fill:#1e293b}
  .subtitle{font-family:"Comic Mono";font-size:13px;fill:#536476}
  .panelTitle{font-family:"Architects Daughter";font-size:12px;letter-spacing:.08em;fill:#94a3b8}
  .label{font-family:"Architects Daughter";font-size:18px;fill:#1e293b}
  .smallLabel{font-family:"Architects Daughter";font-size:15px;fill:#1e293b}
  .detail{font-family:"Comic Mono";font-size:12px;fill:#536476}
  .tiny{font-family:"Comic Mono";font-size:10px;fill:#64748b}
  .arrow{fill:none;stroke:#64748b;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .relationship{fill:none;stroke:#758297;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .softArrow{fill:none;stroke:#94a3b8;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:5 5}
  .inherit{fill:none;stroke:#64748b;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .divider{stroke:#cbd5e1;stroke-width:1.2;stroke-dasharray:6 6}
</style>
  </defs>
  <rect width="980" height="530" class="canvas"/>
  <rect x="20" y="20" width="940" height="490" rx="16" class="frame"/>
<text x="48" y="58" class="title">09 Spring: Exposed Repository (04)</text>
  <text x="48" y="80" class="subtitle">Source-derived ERD - Exposed table objects and column builders</text>
<rect x="166" y="126" width="286" height="154" rx="12" fill="#fff" stroke="#3b82f6" class="card"/>
<path d="M166,164 L166,138 Q166,126 178,126 L440,126 Q452,126 452,138 L452,164 Z" fill="#dbeafe"/>
<text x="309" y="151" class="smallLabel" text-anchor="middle">Movie Table</text>
<text x="184" y="188" class="tiny">id PK</text>
<text x="184" y="203" class="tiny">name varchar</text>
<text x="184" y="218" class="tiny">producer_name varchar</text>
<text x="184" y="233" class="tiny">release_date date</text>
<rect x="528" y="126" width="286" height="154" rx="12" fill="#fff" stroke="#7c3aed" class="card"/>
<path d="M528,164 L528,138 Q528,126 540,126 L802,126 Q814,126 814,138 L814,164 Z" fill="#ede9fe"/>
<text x="671" y="151" class="smallLabel" text-anchor="middle">Actor Table</text>
<text x="546" y="188" class="tiny">id PK</text>
<text x="546" y="203" class="tiny">first_name varchar</text>
<text x="546" y="218" class="tiny">last_name varchar</text>
<text x="546" y="233" class="tiny">birthday date</text>
<rect x="347" y="326" width="286" height="154" rx="12" fill="#fff" stroke="#16a34a" class="card"/>
<path d="M347,364 L347,338 Q347,326 359,326 L621,326 Q633,326 633,338 L633,364 Z" fill="#dcfce7"/>
<text x="490" y="351" class="smallLabel" text-anchor="middle">Actor In Movie Table</text>
<text x="365" y="388" class="tiny">movie_id FK</text>
<text x="365" y="403" class="tiny">actor_id FK</text>
<path data-connector="movie-to-actor-in-movie" d="M309,280 V306 Q309,318 321,318 H418 Q430,318 430,326" class="relationship"/>
<text x="292" y="304" class="smallLabel" text-anchor="middle">1</text>
<text x="412" y="310" class="smallLabel" text-anchor="middle">N</text>
<path data-connector="actor-to-actor-in-movie" d="M671,280 V306 Q671,318 659,318 H562 Q550,318 550,326" class="relationship"/>
<text x="688" y="304" class="smallLabel" text-anchor="middle">1</text>
<text x="568" y="310" class="smallLabel" text-anchor="middle">N</text>
<text x="490" y="110" class="panelTitle" text-anchor="middle">TABLES AND RELATIONSHIPS</text>
</svg>
