<svg xmlns="http://www.w3.org/2000/svg" width="998" height="1391" viewBox="0 0 998 1391" role="img" aria-label="MonetaryAmount Type Mapping">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="10" markerHeight="8" refX="8.5" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 8.5 4 L 1 7" fill="none" stroke="#758297" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="11" markerHeight="10" refX="9.5" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 1 L 9.5 5 L 0.5 9 Z" fill="#ffffff" stroke="#758297" stroke-width="1.7"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="998" height="1391"/>
<rect class="frame" x="32" y="28" width="934" height="1335" rx="28"/>
<text class="title" x="66" y="82">MonetaryAmount Type Mapping</text>
<text class="subtitle" x="70" y="118">UML classes from the original Mermaid source</text>
<path class="line" d="M724 1020 L724 1283 L274 1283 L274 1174"/>
<path class="line" d="M724 1020 L724 635"/>
<path class="line" d="M274 1020 L274 965 L499 965 L499 894"/>
<path class="line" d="M274 1020 L274 572"/>
<path class="line" d="M499 334 L499 761"/>
<path class="line" d="M499 334 L499 381 L274 381 L274 460"/>
<path class="line" d="M724 460 L724 373 L499 373 L499 334"/>
<g transform="translate(309,180)">
  <rect class="card" x="0" y="0" width="380" height="154" rx="5" fill="#E8F3FF" stroke="#5B8DEF"/>
  <line class="compartment" x1="0" y1="78" x2="380" y2="78" stroke="#5B8DEF"/>
  <text class="small" x="190" y="26" text-anchor="middle"></text>
  <text class="label" x="190" y="61" text-anchor="middle">CompositeMoneyColumn</text>
  <text class="mono" x="18" y="108">+amount: Column~BigDecimal?~</text>
<text class="mono" x="18" y="129">+currency: Column~CurrencyUnit?~</text>
</g>
<g transform="translate(84,460)">
  <rect class="card" x="0" y="0" width="380" height="112" rx="5" fill="#EAF7EF" stroke="#58A978"/>
  <line class="compartment" x1="0" y1="78" x2="380" y2="78" stroke="#58A978"/>
  <text class="small" x="190" y="26" text-anchor="middle">«java.math»</text>
  <text class="label" x="190" y="61" text-anchor="middle">BigDecimal</text>

</g>
<g transform="translate(534,460)">
  <rect class="card" x="0" y="0" width="380" height="175" rx="5" fill="#FFF3D9" stroke="#D6A441"/>
  <line class="compartment" x1="0" y1="78" x2="380" y2="78" stroke="#D6A441"/>
  <text class="small" x="190" y="26" text-anchor="middle"></text>
  <text class="label" x="190" y="61" text-anchor="middle">AccountTable</text>
  <text class="mono" x="18" y="108">+id: Column~EntityID~Int~~</text>
<text class="mono" x="18" y="129">+composite_money:</text>
<text class="mono" x="18" y="150">CompositeMoneyColumn~MonetaryAmount?~</text>
</g>
<g transform="translate(309,761)">
  <rect class="card" x="0" y="0" width="380" height="133" rx="5" fill="#FDECEF" stroke="#DC6B82"/>
  <line class="compartment" x1="0" y1="78" x2="380" y2="78" stroke="#DC6B82"/>
  <text class="small" x="190" y="26" text-anchor="middle">«javax.money»</text>
  <text class="label" x="190" y="61" text-anchor="middle">CurrencyUnit</text>
  <text class="mono" x="18" y="108">+currencyCode: String</text>
</g>
<g transform="translate(84,1020)">
  <rect class="card" x="0" y="0" width="380" height="154" rx="5" fill="#E9F7F6" stroke="#45A7A1"/>
  <line class="compartment" x1="0" y1="78" x2="380" y2="78" stroke="#45A7A1"/>
  <text class="small" x="190" y="26" text-anchor="middle">«javax.money»</text>
  <text class="label" x="190" y="61" text-anchor="middle">MonetaryAmount</text>
  <text class="mono" x="18" y="108">+number: NumberValue</text>
<text class="mono" x="18" y="129">+currency: CurrencyUnit</text>
</g>
<g transform="translate(534,1020)">
  <rect class="card" x="0" y="0" width="380" height="175" rx="5" fill="#F1ECFF" stroke="#8A72D6"/>
  <line class="compartment" x1="0" y1="78" x2="380" y2="78" stroke="#8A72D6"/>
  <text class="small" x="190" y="26" text-anchor="middle"></text>
  <text class="label" x="190" y="61" text-anchor="middle">AccountEntity</text>
  <text class="mono" x="18" y="108">+money: MonetaryAmount?</text>
<text class="mono" x="18" y="129">+amount: BigDecimal?</text>
<text class="mono" x="18" y="150">+currency: CurrencyUnit?</text>
</g>
</svg>
