<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1102 760" width="1102" height="760" role="img" aria-label="Tree structure hierarchy example">
  <defs>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="136%">
      <feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
    <marker id="flowArrow" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#60758d" stroke="#60758d" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <style>
      .canvas{fill:#f6f9fc}
      .frame{fill:#ffffff;stroke:#d7e2ec;stroke-width:1.5}
      .title{font-family:"Architects Daughter";font-size:32px;fill:#1e293b}
      .subtitle{font-family:"Comic Mono";font-size:13px;fill:#536476}
      .node{fill:#ffffff;stroke-width:1.9;filter:url(#shadow)}
      .root{fill:#dcfce7;stroke:#16a34a}
      .child{fill:#dbeafe;stroke:#3b82f6}
      .grand{fill:#fef3c7;stroke:#d97706}
      .nodeTitle{font-family:"Architects Daughter";font-size:22px;fill:#1e293b}
      .nodeMeta{font-family:"Comic Mono";font-size:12px;fill:#536476}
      .connector{fill:none;stroke:#60758d;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#flowArrow)}
      .label{font-family:"Comic Mono";font-size:12px;fill:#475569}
      .noteBox{fill:#f8fafc;stroke:#d7e2ec;stroke-width:1.2;filter:url(#shadow)}
      .noteTitle{font-family:"Architects Daughter";font-size:18px;fill:#1e293b}
      .note{font-family:"Comic Mono";font-size:12px;fill:#475569}
    </style>
  </defs>

  <rect width="1102" height="760" class="canvas"/>
  <rect x="20" y="20" width="1062" height="720" rx="16" class="frame"/>
  <text x="48" y="60" class="title">Tree Structure Hierarchy Example</text>
  <text x="48" y="83" class="subtitle">buildTreeNodes() creates one root, two children, and two grandchildren under child1.</text>

  <path id="root-child1" class="connector" data-connector="root-child1" d="M551,222 L551,260 Q551,272 539,272 L360,272 Q348,272 348,284 L348,330"/>
  <path id="root-child2" class="connector" data-connector="root-child2" d="M551,222 L551,260 Q551,272 563,272 L742,272 Q754,272 754,284 L754,330"/>
  <path id="child1-grandchild1" class="connector" data-connector="child1-grandchild1" d="M320,416 L320,454 Q320,466 308,466 L240,466 Q228,466 228,478 L228,516"/>
  <path id="child1-grandchild2" class="connector" data-connector="child1-grandchild2" d="M400,416 L400,454 Q400,466 412,466 L502,466 Q514,466 514,478 L514,516"/>

  <g id="root-node" data-node="root">
    <rect x="421" y="132" width="260" height="90" rx="12" class="node root"/>
    <text x="551" y="169" class="nodeTitle" text-anchor="middle">root</text>
    <text x="551" y="194" class="nodeMeta" text-anchor="middle">depth = 1, parent_id = null</text>
  </g>

  <g id="child1-node" data-node="child1">
    <rect x="240" y="330" width="240" height="86" rx="12" class="node child"/>
    <text x="360" y="365" class="nodeTitle" text-anchor="middle">child 1</text>
    <text x="360" y="390" class="nodeMeta" text-anchor="middle">depth = 2, parent = root</text>
  </g>

  <g id="child2-node" data-node="child2">
    <rect x="634" y="330" width="240" height="86" rx="12" class="node child"/>
    <text x="754" y="365" class="nodeTitle" text-anchor="middle">child 2</text>
    <text x="754" y="390" class="nodeMeta" text-anchor="middle">depth = 2, parent = root</text>
  </g>

  <g id="grandchild1-node" data-node="grandChild1">
    <rect x="108" y="516" width="240" height="86" rx="12" class="node grand"/>
    <text x="228" y="551" class="nodeTitle" text-anchor="middle">grandChild 1</text>
    <text x="228" y="576" class="nodeMeta" text-anchor="middle">depth = 3, parent = child1</text>
  </g>

  <g id="grandchild2-node" data-node="grandChild2">
    <rect x="394" y="516" width="240" height="86" rx="12" class="node grand"/>
    <text x="514" y="551" class="nodeTitle" text-anchor="middle">grandChild 2</text>
    <text x="514" y="576" class="nodeMeta" text-anchor="middle">depth = 3, parent = child1</text>
  </g>

  <g id="query-contracts" data-node="query-contracts">
    <rect x="708" y="506" width="292" height="112" rx="10" class="noteBox"/>
    <text x="854" y="538" class="noteTitle" text-anchor="middle">Source-backed queries</text>
    <text x="732" y="568" class="note">roots: parent_id IS NULL</text>
    <text x="732" y="590" class="note">children: parent_id = current id</text>
    <text x="732" y="612" class="note">deleteDescendants(): recursive DML</text>
  </g>

  <rect x="118" y="668" width="866" height="42" rx="10" fill="#f8fafc" stroke="#d7e2ec" stroke-width="1.2"/>
  <text x="551" y="694" class="note" text-anchor="middle">The hierarchy is stored in one table; edges here show parent_id ownership, not separate tables.</text>
</svg>
