<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 720" width="1180" height="720" role="img" aria-label="Coroutine Tester Tables ERD">
<defs>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/></filter>
<marker id="arrowBlue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8 Z" fill="#2563eb"/></marker>
<marker id="arrowGreen" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8 Z" fill="#16a34a"/></marker>
<marker id="arrowOrange" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8 Z" fill="#ea580c"/></marker>
<marker id="arrowPurple" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8 Z" fill="#7c3aed"/></marker>
<marker id="arrowGray" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8 Z" fill="#64748b"/></marker>
<style>
.canvas{fill:#f6f9fc}.frame{fill:#fff;stroke:#d7e2ec;stroke-width:1.5}
.title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:31px;fill:#1e293b}
.subtitle,.detail{font-family:"Comic Mono","Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;fill:#536476}
.subtitle{font-size:13px}.detail{font-size:12px}.tiny{font-family:"Comic Mono","Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:10px;fill:#64748b}
.label{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:16px;fill:#1e293b}
.tableName{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:18px;fill:#1e293b}
.panelTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:12px;letter-spacing:.08em;fill:#94a3b8}
.card,.tableBox{stroke-width:1.7;filter:url(#shadow)}.panel{fill:#f8fafc;stroke:#d7e2ec;stroke-width:1.2}
.arrow{fill:none;stroke:#2563eb;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowBlue)}
.mapLine{fill:none;stroke:#16a34a;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowGreen)}
.dbUse{fill:none;stroke:#ea580c;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowOrange)}
.runtimeUse{fill:none;stroke:#7c3aed;stroke-width:1.9;stroke-dasharray:6 5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowPurple)}
.returnLine{fill:none;stroke:#64748b;stroke-width:1.7;stroke-dasharray:7 5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowGray)}
.lifeline{stroke:#cbd5e1;stroke-width:1.4;stroke-dasharray:5 6}
</style>
</defs>
<rect width="1180" height="720" class="canvas"/>
<rect x="20" y="20" width="1140" height="680" rx="16" class="frame"/>
<text x="48" y="58" class="title">Coroutine Tester Tables ERD</text>
<text x="48" y="80" class="subtitle">Ex01_Coroutines defines independent Tester and TesterUnique tables; duplicate/update tests exercise the unique table</text>
<rect x="68" y="130" width="470" height="380" rx="12" class="panel"/><text x="303" y="122" class="panelTitle" text-anchor="middle">COROUTINE FIXTURE TABLES</text>
<rect x="112" y="188" width="380" height="282" rx="6" fill="#fff" stroke="#16a34a" class="tableBox"/>
<rect x="112" y="188" width="380" height="58" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.7"/>
<line x1="112" y1="246" x2="492" y2="246" stroke="#16a34a" stroke-width="1.3"/>
<line x1="112" y1="330" x2="492" y2="330" stroke="#16a34a" stroke-width="1.3"/>
<text x="302" y="225" class="tableName" text-anchor="middle">coroutines_tester</text>
<text x="136" y="270" class="detail">PK id: EntityID&lt;Int&gt;</text>
<text x="136" y="296" class="detail">id column: SERIAL / IntIdTable</text>
<text x="136" y="352" class="detail">Used by Tester</text>
<text x="136" y="378" class="detail">Selected by getTesterById</text>
<text x="136" y="404" class="detail">Backs TesterEntity duplicate test</text>
<rect x="642" y="130" width="470" height="380" rx="12" class="panel"/><text x="877" y="122" class="panelTitle" text-anchor="middle">UNIQUE CONSTRAINT TEST TABLE</text>
<rect x="686" y="188" width="380" height="282" rx="6" fill="#fff" stroke="#db2777" class="tableBox"/>
<rect x="686" y="188" width="380" height="58" rx="6" fill="#fce7f3" stroke="#db2777" stroke-width="1.7"/>
<line x1="686" y1="246" x2="1066" y2="246" stroke="#db2777" stroke-width="1.3"/>
<line x1="686" y1="330" x2="1066" y2="330" stroke="#db2777" stroke-width="1.3"/>
<text x="876" y="225" class="tableName" text-anchor="middle">coroutines_tester_unique</text>
<text x="710" y="270" class="detail">PK id: INT</text>
<text x="710" y="296" class="detail">UNIQUE id</text>
<text x="710" y="352" class="detail">Used by TesterUnique</text>
<text x="710" y="378" class="detail">Async insert/update contention</text>
<text x="710" y="404" class="detail">Expected ordered ids: 1, 99</text>
<desc>No FK relationship</desc><rect x="430" y="568" width="320" height="62" rx="10" fill="#e2e8f0" stroke="#64748b" class="card"/>
<text x="590" y="593" class="label" text-anchor="middle">No FK relationship</text>
<text x="590" y="616" class="detail" text-anchor="middle">independent test fixtures</text>
<rect x="118" y="648" width="944" height="52" rx="10" fill="#ecfdf5" stroke="#86efac" stroke-width="1.3"/>
<text x="590" y="679" class="detail" text-anchor="middle">ERD rule: no relationship line is drawn between these tables because the source defines no foreign key; the unique table exists for duplicate and retry scenarios.</text>
</svg>
