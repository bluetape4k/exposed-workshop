<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 840" width="1240" height="840" role="img" aria-label="Exposed + Spring MVC + Schema Tenant class relationship diagram">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
    <marker id="flowHead" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#4f86c6" stroke="#4f86c6" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="schemaHead" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#8a6f3e" stroke="#8a6f3e" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="inheritHead" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="16" viewBox="0 0 18 16" refX="16" refY="8" orient="auto">
      <path d="M1,1 L16,8 L1,15 Z" fill="#fff" stroke="#64748b" stroke-width="1.7" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <style>
      .canvas{fill:#f6f9fc}
      .frame{fill:#fff;stroke:#d7e2ec;stroke-width:1.5}
      .card{stroke-width:1.8;filter:url(#shadow)}
      .title{font-family:"Architects Daughter";font-size:31px;fill:#1e293b}
      .subtitle,.detail,.legend{font-family:"Comic Mono";fill:#536476}
      .subtitle{font-size:13px}
      .detail{font-size:12px}
      .legend{font-size:12px}
      .label{font-family:"Architects Daughter";font-size:16px;fill:#1e293b}
      .section{font-family:"Architects Daughter";font-size:13px;letter-spacing:.08em;fill:#64748b}
      .flow{fill:none;stroke:#4f86c6;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#flowHead)}
      .schema{fill:none;stroke:#8a6f3e;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#schemaHead)}
      .inherit{fill:none;stroke:#64748b;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#inheritHead)}
      .repoUse{fill:none;stroke:#2f9a94;stroke-width:1.8;stroke-dasharray:6 6;stroke-linecap:round;stroke-linejoin:round}
      .initUse{fill:none;stroke:#b8894a;stroke-width:1.8;stroke-dasharray:6 6;stroke-linecap:round;stroke-linejoin:round}
      .repoHead{fill:none;stroke:#2f9a94;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:none}
      .initHead{fill:none;stroke:#b8894a;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:none}
    </style>
  </defs>

  <rect width="1240" height="840" class="canvas"/>
  <rect x="20" y="20" width="1200" height="800" rx="18" class="frame"/>
  <text x="52" y="64" class="title">Exposed + Spring MVC + Schema Tenant (01)</text>
  <text x="52" y="90" class="subtitle">TenantFilter binds ThreadLocal context; the transaction aspect switches the Spring-managed connection before Exposed repositories query tenant schemas.</text>

  <text x="418" y="132" class="section" text-anchor="middle">REQUEST AND THREADLOCAL TENANT CONTEXT</text>
  <text x="812" y="286" class="section" text-anchor="middle">REPOSITORY CONTRACT</text>
  <text x="1104" y="286" class="section" text-anchor="middle">TENANT SCHEMA STORAGE</text>
  <text x="340" y="514" class="section" text-anchor="middle">STARTUP SCHEMA INITIALIZATION</text>

  <g data-card="HTTP Client">
    <path d="M84,171 H206 Q214,171 214,179 V221 Q214,229 206,229 H84 L66,200 Z" fill="#dbeafe" stroke="#4f86c6" class="card"/>
    <text x="143" y="194" class="label" text-anchor="middle">HTTP Client</text>
    <text x="143" y="214" class="detail" text-anchor="middle">X-TENANT-ID</text>
  </g>
  <g data-card="TenantFilter">
    <rect x="276" y="165" width="158" height="70" rx="9" fill="#ede9fe" stroke="#7c3aed" class="card"/>
    <text x="355" y="194" class="label" text-anchor="middle">TenantFilter</text>
    <text x="355" y="216" class="detail" text-anchor="middle">withTenant block</text>
  </g>
  <g data-card="TenantContext">
    <rect x="500" y="165" width="170" height="70" rx="9" fill="#fef3c7" stroke="#b8894a" class="card"/>
    <text x="585" y="194" class="label" text-anchor="middle">TenantContext</text>
    <text x="585" y="216" class="detail" text-anchor="middle">ThreadLocal tenant</text>
  </g>
  <g data-card="ActorController">
    <rect x="736" y="165" width="180" height="70" rx="9" fill="#dbeafe" stroke="#4f86c6" class="card"/>
    <text x="826" y="194" class="label" text-anchor="middle">ActorController</text>
    <text x="826" y="216" class="detail" text-anchor="middle">@Transactional read</text>
  </g>
  <g data-card="TenantSchemaAspect">
    <rect x="984" y="165" width="178" height="70" rx="9" fill="#fff7ed" stroke="#d45b21" class="card"/>
    <text x="1073" y="194" class="label" text-anchor="middle">TenantSchema</text>
    <text x="1073" y="213" class="label" text-anchor="middle">Aspect</text>
    <text x="1073" y="229" class="detail" text-anchor="middle">before transaction</text>
  </g>

  <g data-card="Filter">
    <rect x="288" y="300" width="134" height="64" rx="9" fill="#f8fafc" stroke="#64748b" class="card"/>
    <text x="355" y="326" class="label" text-anchor="middle">Filter</text>
    <text x="355" y="348" class="detail" text-anchor="middle">servlet API</text>
  </g>
  <g data-card="Tenants">
    <rect x="510" y="300" width="150" height="64" rx="9" fill="#ecfdf5" stroke="#6f8f58" class="card"/>
    <text x="585" y="326" class="label" text-anchor="middle">Tenants</text>
    <text x="585" y="348" class="detail" text-anchor="middle">korean / english</text>
  </g>
  <g data-card="DataSourceUtils">
    <rect x="992" y="330" width="162" height="66" rx="9" fill="#e2e8f0" stroke="#64748b" class="card"/>
    <text x="1073" y="357" class="label" text-anchor="middle">DataSourceUtils</text>
    <text x="1073" y="379" class="detail" text-anchor="middle">same connection</text>
  </g>

  <g data-card="JdbcRepository">
    <rect x="730" y="330" width="172" height="68" rx="9" fill="#ffedd5" stroke="#d45b21" class="card"/>
    <text x="816" y="358" class="label" text-anchor="middle">JdbcRepository</text>
    <text x="816" y="380" class="detail" text-anchor="middle">generic contract</text>
  </g>
  <g data-card="ActorRepository">
    <rect x="618" y="448" width="180" height="72" rx="9" fill="#ccfbf1" stroke="#2f9a94" class="card"/>
    <text x="708" y="477" class="label" text-anchor="middle">ActorRepository</text>
    <text x="708" y="499" class="detail" text-anchor="middle">ActorRecord CRUD</text>
  </g>
  <g data-card="MovieRepository">
    <rect x="836" y="448" width="180" height="72" rx="9" fill="#dbeafe" stroke="#4f86c6" class="card"/>
    <text x="926" y="477" class="label" text-anchor="middle">MovieRepository</text>
    <text x="926" y="499" class="detail" text-anchor="middle">joins movie tables</text>
  </g>

  <g data-card="ActorTable">
    <rect x="780" y="604" width="128" height="112" rx="6" fill="#fff" stroke="#db2777" class="card"/>
    <rect x="780" y="604" width="128" height="31" rx="6" fill="#fce7f3" stroke="#db2777" stroke-width="1.4"/>
    <text x="844" y="626" class="label" text-anchor="middle">ActorTable</text>
    <line x1="780" y1="635" x2="908" y2="635" stroke="#db2777" stroke-width="1.1"/>
    <text x="792" y="657" class="detail">id PK</text>
    <text x="792" y="675" class="detail">firstName</text>
    <text x="792" y="693" class="detail">lastName</text>
  </g>
  <g data-card="Movie tables">
    <rect x="944" y="604" width="160" height="108" rx="6" fill="#fff" stroke="#4f86c6" class="card"/>
    <rect x="944" y="604" width="160" height="31" rx="6" fill="#dbeafe" stroke="#4f86c6" stroke-width="1.4"/>
    <text x="1024" y="626" class="label" text-anchor="middle">Movie tables</text>
    <line x1="944" y1="635" x2="1104" y2="635" stroke="#4f86c6" stroke-width="1.1"/>
    <text x="956" y="657" class="detail">MovieTable</text>
    <text x="956" y="675" class="detail">ActorInMovie</text>
  </g>
  <g data-card="Shared DB schemas">
    <path d="M1034,464 C1034,436 1198,436 1198,464 V549 C1198,577 1034,577 1034,549 Z" fill="#ffedd5" stroke="#d45b21" class="card"/>
    <ellipse cx="1116" cy="464" rx="82" ry="14" fill="#fff7ed" stroke="#d45b21" stroke-width="1.8"/>
    <ellipse cx="1116" cy="549" rx="82" ry="14" fill="none" stroke="#d45b21" stroke-width="1.8"/>
    <text x="1116" y="498" class="label" text-anchor="middle">Shared DB</text>
    <text x="1116" y="516" class="detail" text-anchor="middle">schemas per tenant</text>
    <text x="1116" y="534" class="detail" text-anchor="middle">korean / english</text>
  </g>

  <g data-card="TenantInitializer">
    <rect x="76" y="540" width="174" height="70" rx="9" fill="#ecfdf5" stroke="#6f8f58" class="card"/>
    <text x="163" y="568" class="label" text-anchor="middle">TenantInitializer</text>
    <text x="163" y="590" class="detail" text-anchor="middle">ApplicationReady</text>
  </g>
  <g data-card="DataInitializer">
    <rect x="310" y="540" width="166" height="70" rx="9" fill="#fff7ed" stroke="#d45b21" class="card"/>
    <text x="393" y="568" class="label" text-anchor="middle">DataInitializer</text>
    <text x="393" y="590" class="detail" text-anchor="middle">schema + samples</text>
  </g>
  <g data-card="SchemaUtils">
    <rect x="532" y="540" width="150" height="70" rx="9" fill="#fef3c7" stroke="#b8894a" class="card"/>
    <text x="607" y="568" class="label" text-anchor="middle">SchemaUtils</text>
    <text x="607" y="590" class="detail" text-anchor="middle">create / set</text>
  </g>
  <g data-card="MigrationUtils">
    <rect x="532" y="666" width="150" height="70" rx="9" fill="#fef3c7" stroke="#b8894a" class="card"/>
    <text x="607" y="694" class="label" text-anchor="middle">MigrationUtils</text>
    <text x="607" y="716" class="detail" text-anchor="middle">DDL diff</text>
  </g>
  <g data-card="TenantAwareDataSource">
    <rect x="76" y="666" width="174" height="70" rx="9" fill="#fce7f3" stroke="#db2777" class="card"/>
    <text x="163" y="694" class="label" text-anchor="middle">TenantAware DS</text>
    <text x="163" y="716" class="detail" text-anchor="middle">DB-per-tenant option</text>
  </g>
  <g data-card="AbstractRoutingDataSource">
    <rect x="310" y="666" width="166" height="70" rx="9" fill="#f8fafc" stroke="#64748b" class="card"/>
    <text x="393" y="690" class="label" text-anchor="middle">AbstractRouting</text>
    <text x="393" y="709" class="label" text-anchor="middle">DataSource</text>
    <text x="393" y="725" class="detail" text-anchor="middle">Spring JDBC</text>
  </g>

  <path data-connector="http-client-to-tenant-filter" d="M214,200 H276" class="flow connector"/>
  <path data-connector="tenant-filter-to-tenant-context" d="M434,200 H500" class="schema connector"/>
  <path data-connector="tenant-context-to-actor-controller" d="M670,200 H736" class="flow connector"/>
  <path data-connector="actor-controller-to-schema-aspect" d="M916,200 H984" class="schema connector"/>
  <path data-connector="schema-aspect-to-data-source-utils" d="M1073,235 V330" class="schema connector"/>
  <path data-connector="data-source-utils-to-shared-db" d="M1073,396 V430 Q1073,442 1085,442 H1104 Q1116,442 1116,454 V464" class="schema connector"/>
  <path data-connector="actor-controller-to-actor-repository" d="M826,235 V264 Q826,276 814,276 H720 Q708,276 708,288 V448" class="flow connector"/>

  <path data-connector="tenant-filter-implements-filter" d="M355,300 V235" class="inherit connector"/>
  <path data-connector="tenant-filter-uses-tenants" d="M355,235 V258 Q355,270 367,270 H478 Q490,270 490,282 V320 Q490,332 502,332 H510" class="initUse connector"/>
  <polyline points="501,327 510,332 501,337" class="initHead" stroke-dasharray="none" style="stroke-dasharray:none!important"/>

  <path data-connector="actor-repository-extends-jdbc-repository" d="M708,448 V432 Q708,420 720,420 H804 Q816,420 816,408 V398" class="inherit connector"/>
  <path data-connector="movie-repository-extends-jdbc-repository" d="M926,448 V432 Q926,420 914,420 H828 Q816,420 816,408 V398" class="inherit connector"/>
  <path data-connector="actor-repository-uses-actor-table" d="M780,520 V552 Q780,564 792,564 H832 Q844,564 844,576 V604" class="repoUse connector"/>
  <polyline points="839,595 844,604 849,595" class="repoHead" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <path data-connector="movie-repository-uses-movie-tables" d="M926,520 V572 Q926,584 938,584 H1012 Q1024,584 1024,596 V604" class="repoUse connector"/>
  <polyline points="1019,595 1024,604 1029,595" class="repoHead" stroke-dasharray="none" style="stroke-dasharray:none!important"/>

  <path data-connector="tenant-initializer-to-data-initializer" d="M250,575 H310" class="flow connector"/>
  <path data-connector="data-initializer-to-schema-utils" d="M476,575 H532" class="flow connector"/>
  <path data-connector="schema-utils-to-movie-tables" d="M682,575 H720 Q732,575 732,587 V732 Q732,744 744,744 H1012 Q1024,744 1024,732 V712" class="initUse connector"/>
  <polyline points="1019,721 1024,712 1029,721" class="initHead" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <path data-connector="data-initializer-to-migration-utils" d="M393,610 V630 Q393,642 405,642 H595 Q607,642 607,654 V666" class="initUse connector"/>
  <polyline points="602,657 607,666 612,657" class="initHead" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <path data-connector="tenant-aware-ds-extends-routing-ds" d="M250,701 H310" class="inherit connector"/>

  <rect x="64" y="776" width="1112" height="28" rx="8" fill="#f8fafc" stroke="#d7e2ec"/>
  <path d="M94,790 H136" class="flow connector"/>
  <text x="150" y="794" class="legend">request flow</text>
  <path d="M272,790 H314" class="schema connector"/>
  <text x="328" y="794" class="legend">tenant/schema switch</text>
  <path d="M502,790 H544" class="inherit"/>
  <text x="558" y="794" class="legend">extends/implements</text>
  <path d="M760,790 H802" class="repoUse connector"/>
  <polyline points="793,785 802,790 793,795" class="repoHead" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <text x="816" y="794" class="legend">repository/table use</text>
  <path d="M1004,790 H1046" class="initUse connector"/>
  <polyline points="1037,785 1046,790 1037,795" class="initHead" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <text x="1060" y="794" class="legend">startup/init use</text>
</svg>
