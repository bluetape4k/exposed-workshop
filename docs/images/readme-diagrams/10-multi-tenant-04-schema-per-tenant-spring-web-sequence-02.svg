<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 1060" width="1560" height="1060" role="img" aria-label="Schema-per-tenant Spring MVC request and schema reset sequence">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/></filter>
    <marker id="arrowBlue" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" refX="9" refY="5" orient="auto" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#4f86c6" stroke="#4f86c6" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="arrowGreen" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" refX="9" refY="5" orient="auto" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6f8f58" stroke="#6f8f58" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="arrowAmber" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" refX="9" refY="5" orient="auto" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#a2743d" stroke="#a2743d" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="arrowPurple" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" refX="9" refY="5" orient="auto" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7a8445" stroke="#7a8445" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="arrowTeal" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" refX="9" refY="5" orient="auto" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2f9a94" stroke="#2f9a94" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="arrowGray" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" refX="9" refY="5" orient="auto" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6f8792" stroke="#6f8792" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <style>
      .canvas{fill:none}.frame{fill:#fbfcf8;stroke:#40545d;stroke-width:3}
      .title{font-family:"Architects Daughter";font-size:31px;fill:#1e293b}
      .subtitle,.detail{font-family:"Comic Mono";fill:#536476}
      .subtitle{font-size:13px}.detail{font-size:12px}.role{font-family:"Comic Mono";font-size:10.5px;fill:#60727d}
      .participant{font-family:"Architects Daughter";font-size:16px;fill:#1e293b}
      .card{stroke-width:1.7;filter:url(#shadow)}
      .header{fill:#ffffff;stroke:#b6d3ec;stroke-width:1.7;filter:url(#shadow)}
      .lifeline{stroke:#9cafb7;stroke-width:1.4;stroke-dasharray:5 6}
      .activation{fill:#f3ecdf;stroke:#8f784e;stroke-width:1.5}
      .call{fill:none;stroke:#4f86c6;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowBlue)}
      .contextCall{fill:none;stroke:#6f8f58;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowGreen)}
      .schemaCall{fill:none;stroke:#a2743d;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowAmber)}
      .repoCall{fill:none;stroke:#7a8445;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowPurple)}
      .sqlCall{fill:none;stroke:#2f9a94;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowTeal)}
      .returnLine{fill:none;stroke:#6f8792;stroke-width:2.2;stroke-dasharray:7 5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowGray)}
      .pill{stroke-width:1.6;filter:url(#shadow)}
      .badge{fill:#fff;stroke-width:1.4}
      .scope{fill:none;stroke:#8aa1ad;stroke-width:1.6;stroke-dasharray:9 7}
      .scopeTitle{fill:#fff;stroke:#8aa1ad;stroke-width:1.2}
      .note{fill:#fff;stroke:#d7e2ec;stroke-width:1.4}
    </style>
  </defs>

  <rect width="1560" height="1060" class="canvas"/>
  <rect x="20" y="20" width="1520" height="1020" rx="16" class="frame"/>
  <text x="48" y="58" class="title">Schema-per-Tenant Request and Reset Flow</text>
  <text x="48" y="80" class="subtitle">A whitelisted header selects the schema only inside TenantTransaction, then the borrowed connection returns to PUBLIC</text>

  <desc>Client</desc><rect x="42" y="128" width="128" height="62" rx="10" class="header card"/>
  <text x="106" y="156" class="participant" text-anchor="middle">Client</text>
  <text x="106" y="176" class="role" text-anchor="middle">HTTP caller</text>
  <line x1="106" y1="190" x2="106" y2="996" class="lifeline"/>

  <desc>TenantFilter</desc><rect x="205" y="128" width="160" height="62" rx="10" class="header card"/>
  <text x="285" y="156" class="participant" text-anchor="middle">TenantFilter</text>
  <text x="285" y="176" class="role" text-anchor="middle">OncePerRequestFilter</text>
  <line x1="285" y1="190" x2="285" y2="996" class="lifeline"/>

  <desc>TenantContext</desc><rect x="400" y="128" width="160" height="62" rx="10" class="header card"/>
  <text x="480" y="156" class="participant" text-anchor="middle">TenantContext</text>
  <text x="480" y="176" class="role" text-anchor="middle">ThreadLocal TenantId</text>
  <line x1="480" y1="190" x2="480" y2="996" class="lifeline"/>

  <desc>InventoryController</desc><rect x="600" y="128" width="160" height="62" rx="10" class="header card"/>
  <text x="680" y="156" class="participant" text-anchor="middle">Controller</text>
  <text x="680" y="176" class="role" text-anchor="middle">/inventory API</text>
  <line x1="680" y1="190" x2="680" y2="996" class="lifeline"/>

  <desc>InventoryService</desc><rect x="800" y="128" width="160" height="62" rx="10" class="header card"/>
  <text x="880" y="156" class="participant" text-anchor="middle">Service</text>
  <text x="880" y="176" class="role" text-anchor="middle">use case boundary</text>
  <line x1="880" y1="190" x2="880" y2="996" class="lifeline"/>

  <desc>InventoryRepository</desc><rect x="1000" y="128" width="170" height="62" rx="10" class="header card"/>
  <text x="1085" y="156" class="participant" text-anchor="middle">Repository</text>
  <text x="1085" y="176" class="role" text-anchor="middle">ExposedInventoryRepository</text>
  <line x1="1085" y1="190" x2="1085" y2="996" class="lifeline"/>

  <desc>TenantTransaction</desc><rect x="1206" y="128" width="176" height="62" rx="10" class="header card"/>
  <text x="1294" y="156" class="participant" text-anchor="middle">TenantTx</text>
  <text x="1294" y="176" class="role" text-anchor="middle">schema switch boundary</text>
  <line x1="1294" y1="190" x2="1294" y2="996" class="lifeline"/>

  <desc>Database</desc><rect x="1430" y="128" width="104" height="62" rx="10" class="header card"/>
  <text x="1482" y="156" class="participant" text-anchor="middle">Database</text>
  <text x="1482" y="176" class="role" text-anchor="middle">H2 schemas</text>
  <line x1="1482" y1="190" x2="1482" y2="996" class="lifeline"/>

  <rect x="99" y="278" width="14" height="86" rx="6" class="activation"/>
  <rect x="278" y="304" width="14" height="612" rx="6" class="activation"/>
  <rect x="473" y="376" width="14" height="64" rx="6" class="activation"/>
  <rect x="673" y="454" width="14" height="344" rx="6" class="activation"/>
  <rect x="873" y="536" width="14" height="266" rx="6" class="activation"/>
  <rect x="1078" y="616" width="14" height="190" rx="6" class="activation"/>
  <rect x="1287" y="690" width="14" height="218" rx="6" class="activation"/>
  <rect x="1475" y="758" width="14" height="196" rx="6" class="activation"/>

  <rect x="54" y="232" width="382" height="34" rx="17" fill="#ffffff" stroke="#4f86c6" class="pill card"/>
  <circle cx="78" cy="249" r="14" class="badge" stroke="#4f86c6"/>
  <text x="78" y="254" class="detail" text-anchor="middle">1</text>
  <text x="103" y="255" class="detail">GET /inventory/{sku} with X-Tenant-ID</text>
  <path data-connector="client-enters-tenant-filter" d="M106,286 H285" class="call"/>

  <rect x="182" y="324" width="374" height="34" rx="17" fill="#ffffff" stroke="#6f8f58" class="pill card"/>
  <circle cx="206" cy="341" r="14" class="badge" stroke="#6f8f58"/>
  <text x="206" y="346" class="detail" text-anchor="middle">2</text>
  <text x="231" y="347" class="detail">resolve whitelist and set TenantId</text>
  <path data-connector="filter-sets-tenant-context" d="M285,376 H480" class="contextCall"/>

  <rect x="232" y="414" width="414" height="34" rx="17" fill="#ffffff" stroke="#4f86c6" class="pill card"/>
  <circle cx="256" cy="431" r="14" class="badge" stroke="#4f86c6"/>
  <text x="256" y="436" class="detail" text-anchor="middle">3</text>
  <text x="281" y="437" class="detail">filterChain.doFilter enters controller</text>
  <path data-connector="filter-dispatches-controller" d="M285,466 H680" class="call"/>

  <rect x="584" y="498" width="342" height="34" rx="17" fill="#ffffff" stroke="#4f86c6" class="pill card"/>
  <circle cx="608" cy="515" r="14" class="badge" stroke="#4f86c6"/>
  <text x="608" y="520" class="detail" text-anchor="middle">4</text>
  <text x="633" y="521" class="detail">inventoryService.findBySku(sku)</text>
  <path data-connector="controller-calls-inventory-service" d="M680,552 H880" class="call"/>

  <rect x="766" y="578" width="360" height="34" rx="17" fill="#ffffff" stroke="#7a8445" class="pill card"/>
  <circle cx="790" cy="595" r="14" class="badge" stroke="#7a8445"/>
  <text x="790" y="600" class="detail" text-anchor="middle">5</text>
  <text x="815" y="601" class="detail">repository.findBySku(sku)</text>
  <path data-connector="service-calls-inventory-repository" d="M880,632 H1085" class="repoCall"/>

  <rect x="984" y="650" width="536" height="310" rx="18" class="scope"/>
  <rect x="1020" y="630" width="352" height="34" rx="16" class="scopeTitle"/>
  <text x="1196" y="652" class="detail" text-anchor="middle">TenantTransaction.execute { ... } and finally reset</text>

  <rect x="1006" y="678" width="426" height="34" rx="17" fill="#ffffff" stroke="#a2743d" class="pill card"/>
  <circle cx="1030" cy="695" r="14" class="badge" stroke="#a2743d"/>
  <text x="1030" y="700" class="detail" text-anchor="middle">6</text>
  <text x="1055" y="701" class="detail">execute("inventory.findBySku")</text>
  <path data-connector="repository-enters-tenant-transaction" d="M1085,732 H1294" class="schemaCall"/>

  <rect x="1120" y="746" width="392" height="34" rx="17" fill="#ffffff" stroke="#2f9a94" class="pill card"/>
  <circle cx="1144" cy="763" r="14" class="badge" stroke="#2f9a94"/>
  <text x="1144" y="768" class="detail" text-anchor="middle">7</text>
  <text x="1169" y="769" class="detail">SchemaUtils.setSchema(tenant.schema)</text>
  <path data-connector="tenant-transaction-switches-schema" d="M1294,800 H1482" class="sqlCall"/>

  <rect x="1054" y="816" width="426" height="34" rx="17" fill="#ffffff" stroke="#2f9a94" class="pill card"/>
  <circle cx="1078" cy="833" r="14" class="badge" stroke="#2f9a94"/>
  <text x="1078" y="838" class="detail" text-anchor="middle">8</text>
  <text x="1103" y="839" class="detail">select inventory_items in active schema</text>
  <path data-connector="tenant-block-selects-inventory-items" d="M1294,870 H1482" class="sqlCall"/>

  <rect x="1110" y="886" width="388" height="34" rx="17" fill="#ffffff" stroke="#a2743d" class="pill card"/>
  <circle cx="1134" cy="903" r="14" class="badge" stroke="#a2743d"/>
  <text x="1134" y="908" class="detail" text-anchor="middle">9</text>
  <text x="1159" y="909" class="detail">finally resetToPublic()</text>
  <path data-connector="tenant-transaction-resets-public" d="M1294,940 H1482" class="schemaCall"/>

  <rect x="226" y="892" width="346" height="34" rx="17" fill="#ffffff" stroke="#6f8f58" class="pill card"/>
  <circle cx="250" cy="909" r="14" class="badge" stroke="#6f8f58"/>
  <text x="250" y="914" class="detail" text-anchor="middle">10</text>
  <text x="278" y="915" class="detail">finally TenantContext.clear()</text>
  <path data-connector="filter-clears-tenant-context" d="M285,946 H480" class="contextCall"/>

  <path data-connector="controller-returns-through-filter" d="M680,974 H285 H106" class="returnLine"/>

  <rect x="86" y="998" width="1388" height="34" rx="14" class="note"/>
  <text x="780" y="1020" class="detail" text-anchor="middle">Reset failure rolls back and evicts the borrowed connection so the next request cannot inherit a tenant schema.</text>
</svg>
