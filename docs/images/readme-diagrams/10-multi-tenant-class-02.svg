<rect class="card" x="43" y="314" width="280" height="138" rx="14" fill="#fff0c9" stroke="#d0a84e"/>
<text class="smallLabel" x="183" y="350" text-anchor="middle">ThreadLocal</text>
<line class="dash" x1="61" y1="376" x2="305" y2="376"/>
<text class="mono" x="67" y="400">+ SchemaAspect_VT</text>
