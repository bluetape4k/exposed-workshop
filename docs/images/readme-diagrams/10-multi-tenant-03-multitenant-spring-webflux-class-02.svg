  <text x="52" y="64" class="title">Exposed + Spring WebFlux + Coroutines + Multi-Tenant (03)</text>
  <text x="52" y="90" class="subtitle">Class relationships grouped by source role: Exposed schema, repositories, and Reactor tenant propagation.</text>

  <text x="344" y="132" class="section" text-anchor="middle">EXPOSED SCHEMA TYPES</text>
  <text x="840" y="132" class="section" text-anchor="middle">REPOSITORY CONTRACT</text>
  <text x="928" y="430" class="section" text-anchor="middle">TENANT / RUNTIME SUPPORT</text>

