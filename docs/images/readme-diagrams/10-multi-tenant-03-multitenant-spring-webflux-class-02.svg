  <polyline points="1117,530 1126,535 1117,540" class="useHead" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <path data-connector="eventloop-customizer-implements-netty-customizer" d="M1017,644 V604 Q1017,592 1005,592 H814 Q802,592 802,604 V644" class="inherit connector"/>

  <rect x="64" y="740" width="1112" height="28" rx="8" fill="#f8fafc" stroke="#d7e2ec"/>
  <path d="M94,754 H136" class="inherit connector"/>
  <text x="148" y="758" class="legend">extends/implements</text>
  <path d="M294,754 H336" class="use connector"/>
  <polyline points="327,749 336,754 327,759" class="useHead" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
