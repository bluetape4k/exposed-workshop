<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 920" width="1600" height="920" role="img" aria-label="Exposed vs JPA benchmark structure">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
    <marker id="flowHead" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2,2 L12,7 L2,12 Z" fill="#64748b" stroke="#64748b" stroke-width="1"/>
    </marker>
    <style>
      .canvas{fill:#f6f9fc}
      .frame{fill:#fff;stroke:#d7e2ec;stroke-width:1.5}
      .title{font-family:"Architects Daughter";font-size:34px;fill:#1e293b}
      .subtitle{font-family:"Comic Mono";font-size:13px;fill:#536476}
      .columnTitle{font-family:"Architects Daughter";font-size:12px;letter-spacing:.08em;fill:#94a3b8}
      .card{stroke-width:1.7;filter:url(#shadow)}
      .label{font-family:"Architects Daughter";font-size:18px;fill:#1e293b}
      .detail{font-family:"Comic Mono";font-size:12px;fill:#536476}
      .tiny{font-family:"Comic Mono";font-size:11px;fill:#64748b}
      .arrow{fill:none;stroke:#64748b;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#flowHead)}
      .softArrow{fill:none;stroke:#94a3b8;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:7 5;marker-end:url(#flowHead)}
    </style>
  </defs>

  <rect width="1600" height="920" class="canvas"/>
  <rect x="28" y="24" width="1544" height="872" rx="16" class="frame"/>

  <text x="64" y="70" class="title">Exposed vs JPA benchmark structure</text>
  <text x="64" y="96" class="subtitle">kotlinx-benchmark / JMH runner drives CRUD, cache, and routing measurements from source-defined fixtures</text>

  <text x="205" y="142" class="columnTitle" text-anchor="middle">RUNNER INPUTS</text>
  <text x="575" y="142" class="columnTitle" text-anchor="middle">BENCHMARK SUITES</text>
  <text x="960" y="142" class="columnTitle" text-anchor="middle">EXECUTION TARGETS</text>
  <text x="1320" y="142" class="columnTitle" text-anchor="middle">MEASUREMENT EVIDENCE</text>

  <g id="crud-row">
    <rect x="76" y="170" width="258" height="116" rx="10" fill="#e2e8f0" stroke="#64748b" class="card"/>
    <text x="205" y="210" class="label" text-anchor="middle">Benchmark profile</text>
    <text x="205" y="234" class="detail" text-anchor="middle">smokeBenchmark / benchmark</text>
    <text x="205" y="254" class="tiny" text-anchor="middle">@Fork, warmup, measurement</text>

    <rect x="432" y="170" width="286" height="116" rx="10" fill="#ede9fe" stroke="#7c3aed" class="card"/>
    <text x="575" y="205" class="label" text-anchor="middle">CRUD comparison</text>
    <text x="575" y="230" class="detail" text-anchor="middle">SingleEntityCrudBenchmark</text>
    <text x="575" y="249" class="detail" text-anchor="middle">OneToMany / Concurrent</text>

    <rect x="822" y="146" width="276" height="78" rx="10" fill="#ccfbf1" stroke="#0f766e" class="card"/>
    <text x="960" y="178" class="label" text-anchor="middle">Exposed JDBC path</text>
    <text x="960" y="202" class="detail" text-anchor="middle">Database + transaction + Table</text>

    <rect x="822" y="248" width="276" height="78" rx="10" fill="#fef3c7" stroke="#d97706" class="card"/>
    <text x="960" y="280" class="label" text-anchor="middle">JPA path</text>
    <text x="960" y="304" class="detail" text-anchor="middle">EntityManager + Hibernate</text>

    <rect x="1200" y="170" width="240" height="116" rx="10" fill="#dbeafe" stroke="#3b82f6" class="card"/>
    <text x="1320" y="205" class="label" text-anchor="middle">PostgreSQL fixture</text>
    <text x="1320" y="230" class="detail" text-anchor="middle">HikariCP + Testcontainer</text>
    <text x="1320" y="249" class="tiny" text-anchor="middle">persons / departments / employees</text>

    <path data-connector="profile-to-crud-suite" d="M334,228 H432" class="arrow"/>
    <path data-connector="crud-suite-to-exposed" d="M718,215 H822" class="arrow"/>
    <path data-connector="crud-suite-to-jpa" d="M718,241 H770 Q790,241 790,261 V275 Q790,287 802,287 H822" class="arrow"/>
    <path data-connector="crud-targets-to-postgres" d="M1098,228 H1200" class="arrow"/>
  </g>

  <g id="cache-row">
    <rect x="76" y="392" width="258" height="116" rx="10" fill="#e2e8f0" stroke="#64748b" class="card"/>
    <text x="205" y="431" class="label" text-anchor="middle">Workload params</text>
    <text x="205" y="456" class="detail" text-anchor="middle">READ_HEAVY / WRITE_HEAVY</text>
    <text x="205" y="475" class="tiny" text-anchor="middle">payloadBytes 256, 4096</text>

    <rect x="432" y="392" width="286" height="116" rx="10" fill="#ccfbf1" stroke="#0f766e" class="card"/>
    <text x="575" y="426" class="label" text-anchor="middle">Cache benchmarks</text>
    <text x="575" y="451" class="detail" text-anchor="middle">ReadThroughCacheBenchmark</text>
    <text x="575" y="470" class="detail" text-anchor="middle">CacheStrategyComparison</text>

    <rect x="822" y="392" width="276" height="116" rx="10" fill="#fef3c7" stroke="#d97706" class="card"/>
    <text x="960" y="427" class="label" text-anchor="middle">Strategy implementations</text>
    <text x="960" y="452" class="detail" text-anchor="middle">NoCache / ReadThrough</text>
    <text x="960" y="471" class="detail" text-anchor="middle">WriteThrough + Caffeine</text>

    <rect x="1200" y="392" width="240" height="116" rx="10" fill="#ede9fe" stroke="#7c3aed" class="card"/>
    <text x="1320" y="427" class="label" text-anchor="middle">Payload storage</text>
    <text x="1320" y="452" class="detail" text-anchor="middle">cache_payload table</text>
    <text x="1320" y="471" class="tiny" text-anchor="middle">Map baseline and DB fallback</text>

    <path data-connector="workload-to-cache-suite" d="M334,450 H432" class="arrow"/>
    <path data-connector="cache-suite-to-strategies" d="M718,450 H822" class="arrow"/>
    <path data-connector="strategies-to-payload-storage" d="M1098,450 H1200" class="arrow"/>
  </g>

  <g id="routing-row">
    <rect x="76" y="614" width="258" height="116" rx="10" fill="#e2e8f0" stroke="#64748b" class="card"/>
    <text x="205" y="653" class="label" text-anchor="middle">Tenant inputs</text>
    <text x="205" y="678" class="detail" text-anchor="middle">tenant-a / defaultTenant</text>
    <text x="205" y="697" class="tiny" text-anchor="middle">readOnly true or false</text>

    <rect x="432" y="614" width="286" height="116" rx="10" fill="#fef3c7" stroke="#d97706" class="card"/>
    <text x="575" y="653" class="label" text-anchor="middle">Routing benchmark</text>
    <text x="575" y="678" class="detail" text-anchor="middle">RoutingKeyResolverBenchmark</text>
    <text x="575" y="697" class="tiny" text-anchor="middle">currentLookupKey() cost</text>

    <rect x="822" y="614" width="276" height="116" rx="10" fill="#ccfbf1" stroke="#0f766e" class="card"/>
    <text x="960" y="653" class="label" text-anchor="middle">Routing resolver</text>
    <text x="960" y="678" class="detail" text-anchor="middle">ContextAwareRoutingKeyResolver</text>
    <text x="960" y="697" class="tiny" text-anchor="middle">tenant suffix + read/write branch</text>

    <rect x="1200" y="614" width="240" height="116" rx="10" fill="#dbeafe" stroke="#3b82f6" class="card"/>
    <text x="1320" y="653" class="label" text-anchor="middle">Benchmark report</text>
    <text x="1320" y="678" class="detail" text-anchor="middle">JSON + Markdown output</text>
    <text x="1320" y="697" class="tiny" text-anchor="middle">AverageTime scores</text>

    <path data-connector="tenant-inputs-to-routing-suite" d="M334,672 H432" class="arrow"/>
    <path data-connector="routing-suite-to-resolver" d="M718,672 H822" class="arrow"/>
    <path data-connector="resolver-to-report" d="M1098,672 H1200" class="arrow"/>
  </g>

  <rect x="76" y="792" width="1364" height="58" rx="10" fill="#f8fafc" stroke="#d7e2ec" stroke-width="1.3"/>
  <text x="758" y="818" class="label" text-anchor="middle">Each row isolates one measured concern before results are written by the benchmarkMarkdown task.</text>
  <text x="758" y="838" class="detail" text-anchor="middle">CRUD rows compare Exposed and JPA over the same model; cache and routing rows measure local overhead in controlled fixtures.</text>
</svg>
