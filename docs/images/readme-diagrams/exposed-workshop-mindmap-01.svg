<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#94a3b8" flood-opacity=".18"/></filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 14 14" data-role="primary" data-tip-direction="positive-x"><path d="M2,2 L12,7 L2,12 Z" fill="#64748b" stroke-dasharray="none"/></marker>
    <style><![CDATA[
      svg{font-family:"Architects Daughter","Comic Mono",ui-sans-serif,system-ui,sans-serif}.canvas{fill:#f6f9fc}.frame{fill:#fff;stroke:#8aa6cf;stroke-width:3;filter:url(#shadow)}.title{font-family:"Architects Daughter";font-size:50px;fill:#263a57}.subtitle,.body,.tag,.footer{font-family:"Comic Mono";fill:#526276}.subtitle{font-size:17px}.body{font-size:14px}.tag{font-size:13px}.hubTitle,.cardTitle{font-family:"Architects Daughter";fill:#263a57}.hubTitle{font-size:38px}.cardTitle{font-size:28px}.hub{fill:#ffffff;stroke:#8aa6cf;stroke-width:3;filter:url(#shadow)}.card{stroke-width:2.5;filter:url(#shadow)}.route{fill:none;stroke:#64748b;stroke-width:3.5;stroke-linecap:round;stroke-dasharray:8 7;marker-end:url(#arrow)}.pill{fill:#fff;stroke:#dbe7f3;stroke-width:1.6}.footerBox{fill:#f8fafc;stroke:#d4e0ec;stroke-width:2}
    ]]></style>
  </defs>
  <rect class="canvas" width="1500" height="1000"/>
  <rect class="frame" x="48" y="40" width="1404" height="900" rx="34"/>
  <text class="title" x="750" y="112" text-anchor="middle">Kotlin Exposed Workshop Feature Map</text>
  <text class="subtitle" x="750" y="154" text-anchor="middle">The repository teaches one persistence idea at a time, then repeats it across application runtimes and database backends.</text>
  <ellipse class="hub" cx="750" cy="485" rx="205" ry="115"/>
  <text class="hubTitle" x="750" y="464" text-anchor="middle">Kotlin Exposed</text>
  <text class="body" x="750" y="500" text-anchor="middle">type-safe SQL for Kotlin</text>
  <text class="tag" x="750" y="528" text-anchor="middle">shared test fixtures + runnable modules</text>
  <path class="route" d="M 585 420 H 323 Q 305 420 305 412 V 395"/>
  <rect class="card" x="140" y="250" width="330" height="145" rx="22" fill="#e0f2fe" stroke="#0284c7"/>
  <text class="cardTitle" x="168" y="296">SQL DSL</text>
  <text class="body" x="168" y="328">Typed tables, joins, conditions</text>
  <text class="body" x="168" y="350">CTEs and aggregate queries</text>
  <rect class="pill" x="168" y="361" width="274" height="30" rx="15"/>
  <text class="tag" x="305.0" y="381" text-anchor="middle">03 basics / 05 DML</text>
  <path class="route" d="M 750 420 V 395"/>
  <rect class="card" x="585" y="250" width="330" height="145" rx="22" fill="#dcfce7" stroke="#059669"/>
  <text class="cardTitle" x="613" y="296">DAO / Entity</text>
  <text class="body" x="613" y="328">EntityClass, relationships</text>
  <text class="body" x="613" y="350">lifecycle hooks and caching</text>
  <rect class="pill" x="613" y="361" width="274" height="30" rx="15"/>
  <text class="tag" x="750.0" y="381" text-anchor="middle">03 DAO / 05 entities</text>
  <path class="route" d="M 915 420 H 1177 Q 1195 420 1195 412 V 395"/>
  <rect class="card" x="1030" y="250" width="330" height="145" rx="22" fill="#fef3c7" stroke="#d97706"/>
  <text class="cardTitle" x="1058" y="296">Schema Work</text>
  <text class="body" x="1058" y="328">Connections, tables, indexes</text>
  <text class="body" x="1058" y="350">sequences and dialect checks</text>
  <rect class="pill" x="1058" y="361" width="274" height="30" rx="15"/>
  <text class="tag" x="1195.0" y="381" text-anchor="middle">04 DDL</text>
  <path class="route" d="M 585 550 H 323 Q 305 550 305 570 V 590"/>
  <rect class="card" x="140" y="590" width="330" height="145" rx="22" fill="#fae8ff" stroke="#a855f7"/>
  <text class="cardTitle" x="168" y="636">Advanced Columns</text>
  <text class="body" x="168" y="668">JSON, money, crypt, Tink</text>
  <text class="body" x="168" y="690">custom codecs and transforms</text>
  <rect class="pill" x="168" y="701" width="274" height="30" rx="15"/>
  <text class="tag" x="305.0" y="721" text-anchor="middle">06 advanced</text>
  <path class="route" d="M 750 550 V 590"/>
  <rect class="card" x="585" y="590" width="330" height="145" rx="22" fill="#ede9fe" stroke="#7c3aed"/>
  <text class="cardTitle" x="613" y="636">Runtime Models</text>
  <text class="body" x="613" y="668">Blocking, coroutines</text>
  <text class="body" x="613" y="690">virtual threads</text>
  <rect class="pill" x="613" y="701" width="274" height="30" rx="15"/>
  <text class="tag" x="750.0" y="721" text-anchor="middle">08 coroutines</text>
  <path class="route" d="M 915 550 H 1177 Q 1195 550 1195 570 V 590"/>
  <rect class="card" x="1030" y="590" width="330" height="145" rx="22" fill="#ffedd5" stroke="#ea580c"/>
  <text class="cardTitle" x="1058" y="636">Application Patterns</text>
  <text class="body" x="1058" y="668">Spring, Ktor, tenancy</text>
  <text class="body" x="1058" y="690">cache, routing, outbox</text>
  <rect class="pill" x="1058" y="701" width="274" height="30" rx="15"/>
  <text class="tag" x="1195.0" y="721" text-anchor="middle">09-12 integration</text>

  <rect class="footerBox" x="368" y="778" width="764" height="32" rx="16"/>
  <text class="tag" x="750" y="799" text-anchor="middle">Legend: dashed connectors show topic links from the central Exposed learning hub.</text>
  <rect class="footerBox" x="150" y="835" width="1200" height="46" rx="21"/>
  <text class="footer" x="750" y="864" text-anchor="middle">Use the map to choose a topic first, then open the matching chapter README and run that module's tests.</text>
</svg>
