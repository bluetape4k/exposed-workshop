<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 820" width="1300" height="820" role="img" aria-label="09 Spring: Exposed Repository mapper model">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/></filter>
    <marker id="arrowBlue" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#4f86c6" stroke="#4f86c6" stroke-dasharray="none" style="stroke-dasharray:none!important" stroke-width="0"/>
    </marker>
    <style>
  .canvas{fill:#f6f9fc}
  .frame{fill:#fff;stroke:#d7e2ec;stroke-width:1.5}
  .panel{fill:#f8fafc;stroke:#d7e2ec;stroke-width:1.2}
  .card{stroke-width:1.7;filter:url(#shadow)}
  .title{font-family:"Architects Daughter";font-size:32px;fill:#1e293b}
  .subtitle{font-family:"Comic Mono";font-size:13px;fill:#536476}
  .panelTitle{font-family:"Architects Daughter";font-size:12px;letter-spacing:.08em;fill:#94a3b8}
  .smallLabel{font-family:"Architects Daughter";font-size:15px;fill:#1e293b}
  .detail{font-family:"Comic Mono";font-size:12px;fill:#536476}
  .arrow{fill:none;stroke:#4f86c6;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowBlue)}
</style>
  </defs>
  <rect width="1300" height="820" class="canvas"/>
  <rect x="20" y="20" width="1260" height="780" rx="16" class="frame"/>
  <text x="48" y="58" class="title">09 Spring: Exposed Repository Mapper Model</text>
  <text x="48" y="80" class="subtitle">MovieExposedRepository combines DSL ResultRow mapping and DAO eager loading into immutable API records</text>

  <rect x="54" y="120" width="1192" height="520" rx="12" class="panel"/>
  <text x="650" y="114" class="panelTitle" text-anchor="middle">SOURCE TYPES, MAPPERS, AND RESPONSE RECORDS</text>

  <rect x="90" y="170" width="240" height="84" rx="10" fill="#dbeafe" stroke="#3b82f6" class="card"/>
  <text x="210" y="199" class="smallLabel" text-anchor="middle">ResultRow</text>
  <text x="210" y="238" class="detail" text-anchor="middle">DSL select / join row</text>
  <rect x="90" y="320" width="240" height="84" rx="10" fill="#ccfbf1" stroke="#0f766e" class="card"/>
  <text x="210" y="349" class="smallLabel" text-anchor="middle">MovieEntity</text>
  <text x="210" y="388" class="detail" text-anchor="middle">DAO LongEntity</text>
  <rect x="90" y="470" width="240" height="84" rx="10" fill="#dcfce7" stroke="#16a34a" class="card"/>
  <text x="210" y="499" class="smallLabel" text-anchor="middle">ActorEntity</text>
  <text x="210" y="538" class="detail" text-anchor="middle">DAO LongEntity</text>

  <rect x="450" y="170" width="330" height="384" rx="12" fill="#fff7ed" stroke="#d97706" class="card"/>
  <path d="M450,214 L450,182 Q450,170 462,170 L768,170 Q780,170 780,182 L780,214 Z" fill="#ffedd5"/>
  <text x="615" y="199" class="smallLabel" text-anchor="middle">MovieMappers.kt</text>
  <text x="478" y="246" class="detail">ResultRow.toMovieRecord()</text>
  <text x="478" y="276" class="detail">ResultRow.toActorRecord()</text>
  <text x="478" y="306" class="detail">MovieEntity.toMovieRecord()</text>
  <text x="478" y="336" class="detail">ActorEntity.toActorRecord()</text>
  <text x="478" y="366" class="detail">toMovieWithActorRecord(actors)</text>
  <text x="478" y="396" class="detail">toMovieWithProducingActorRecord()</text>
  <text x="478" y="446" class="detail">Repository chooses DSL rows or DAO load()</text>
  <text x="478" y="476" class="detail">and returns API-facing records</text>

  <rect x="920" y="190" width="280" height="72" rx="10" fill="#fef3c7" stroke="#d97706" class="card"/>
  <text x="1060" y="219" class="smallLabel" text-anchor="middle">MovieRecord</text>
  <text x="1060" y="246" class="detail" text-anchor="middle">movie list/create response</text>
  <rect x="920" y="290" width="280" height="72" rx="10" fill="#ccfbf1" stroke="#0f766e" class="card"/>
  <text x="1060" y="319" class="smallLabel" text-anchor="middle">ActorRecord</text>
  <text x="1060" y="346" class="detail" text-anchor="middle">actor list/create response</text>
  <rect x="920" y="390" width="280" height="72" rx="10" fill="#ede9fe" stroke="#7c3aed" class="card"/>
  <text x="1060" y="419" class="smallLabel" text-anchor="middle">MovieWithActorRecord</text>
  <text x="1060" y="446" class="detail" text-anchor="middle">movie plus actor records</text>
  <rect x="920" y="490" width="280" height="72" rx="10" fill="#fce7f3" stroke="#db2777" class="card"/>
  <text x="1060" y="519" class="smallLabel" text-anchor="middle">ProducingActorRecord</text>
  <text x="1060" y="546" class="detail" text-anchor="middle">producer name joins actor</text>

  <path data-connector="result-row-to-mappers" d="M330,212 H450" class="arrow"/>
  <path data-connector="movie-entity-to-mappers" d="M330,362 H450" class="arrow"/>
  <path data-connector="actor-entity-to-mappers" d="M330,512 H450" class="arrow"/>
  <path data-connector="mapper-to-movie-record" d="M780,226 H920" class="arrow"/>
  <path data-connector="mapper-to-actor-record" d="M780,326 H920" class="arrow"/>
  <path data-connector="mapper-to-movie-with-actor-record" d="M780,426 H920" class="arrow"/>
  <path data-connector="mapper-to-producing-actor-record" d="M780,526 H920" class="arrow"/>

  <rect x="430" y="680" width="440" height="76" rx="10" fill="#e0f2fe" stroke="#0284c7" class="card"/>
  <text x="650" y="710" class="smallLabel" text-anchor="middle">MovieExposedRepository</text>
  <text x="650" y="738" class="detail" text-anchor="middle">selectAll / innerJoin / load(MovieEntity::actors)</text>
  <path data-connector="repository-to-mappers" d="M650,680 V554" class="arrow"/>
</svg>
