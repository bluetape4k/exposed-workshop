<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760" role="img" aria-label="Spring MVC Request Processing Flow">
<defs>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/></filter>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8 Z" fill="#64748b"/></marker>
<marker id="arrowGreen" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8 Z" fill="#16a34a"/></marker>
<marker id="arrowPurple" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8 Z" fill="#7c3aed"/></marker>
<marker id="inherit" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto"><path d="M1,1 L12,6 L1,11 Z" fill="#fff" stroke="#475569" stroke-width="1.8"/></marker>
<style>
.canvas{fill:#f6f9fc}.frame{fill:#fff;stroke:#d7e2ec;stroke-width:1.5}
.title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:32px;fill:#1e293b}
.subtitle,.detail{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;fill:#536476}
.subtitle{font-size:13px}.detail{font-size:12px}.tiny{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:10px;fill:#64748b}
.label{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:17px;fill:#1e293b}
.panelTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:12px;letter-spacing:.08em;fill:#94a3b8}
.card{stroke-width:1.7;filter:url(#shadow)}.panel{fill:#f8fafc;stroke:#d7e2ec;stroke-width:1.2}
.arrow{fill:none;stroke:#64748b;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
.softArrow{fill:none;stroke:#94a3b8;stroke-width:1.35;stroke-dasharray:5 5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
.movieMap{fill:none;stroke:#16a34a;stroke-width:1.7;stroke-dasharray:5 5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowGreen)}
.actorMap{fill:none;stroke:#7c3aed;stroke-width:1.7;stroke-dasharray:5 5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowPurple)}
.lifeline{fill:none;stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:5 5;stroke-linecap:round;stroke-linejoin:round}
.inherit{fill:none;stroke:#475569;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.inheritHead{fill:#fff;stroke:#475569;stroke-width:1.8;stroke-linejoin:round}
</style>
</defs>
<rect width="1280" height="760" class="canvas"/>
<rect x="20" y="20" width="1240" height="720" rx="16" class="frame"/>
<text x="48" y="58" class="title">Spring MVC Request Processing Flow</text>
<text x="48" y="80" class="subtitle">Representative Actor API request through controller, repository, transaction, and response mapping</text>
<rect x="54" y="122" width="144" height="52" rx="10" fill="#dbeafe" stroke="#3b82f6" class="card"/>
<text x="126" y="154" class="label" text-anchor="middle">Client</text>
<path d="M126,184 L126,682" class="lifeline"/>
<rect x="258" y="122" width="144" height="52" rx="10" fill="#ede9fe" stroke="#7c3aed" class="card"/>
<text x="330" y="154" class="label" text-anchor="middle">ActorController</text>
<path d="M330,184 L330,682" class="lifeline"/>
<rect x="462" y="122" width="144" height="52" rx="10" fill="#dcfce7" stroke="#16a34a" class="card"/>
<text x="534" y="154" class="label" text-anchor="middle">ActorRepository</text>
<path d="M534,184 L534,682" class="lifeline"/>
<rect x="666" y="122" width="144" height="52" rx="10" fill="#ffedd5" stroke="#ea580c" class="card"/>
<text x="738" y="144" class="label" text-anchor="middle">Spring</text>
<text x="738" y="162" class="label" text-anchor="middle">Transaction</text>
<path d="M738,184 L738,682" class="lifeline"/>
<rect x="870" y="122" width="144" height="52" rx="10" fill="#fce7f3" stroke="#db2777" class="card"/>
<text x="942" y="154" class="label" text-anchor="middle">ActorTable</text>
<path d="M942,184 L942,682" class="lifeline"/>
<rect x="1074" y="122" width="144" height="52" rx="10" fill="#ccfbf1" stroke="#0f766e" class="card"/>
<text x="1146" y="154" class="label" text-anchor="middle">ActorRecord</text>
<path d="M1146,184 L1146,682" class="lifeline"/>
<rect x="158" y="196" width="140" height="24" rx="8" fill="#fff" stroke="#d7e2ec"/>
<text x="228" y="213" class="tiny" text-anchor="middle">1. GET /actors/{id}</text>
<path d="M142,224 L314,224" class="arrow"/>
<rect x="362" y="258" width="140" height="24" rx="8" fill="#fff" stroke="#d7e2ec"/>
<text x="432" y="275" class="tiny" text-anchor="middle">2. getActorById() delegates</text>
<path d="M346,286 L518,286" class="arrow"/>
<rect x="566" y="320" width="140" height="24" rx="8" fill="#fff" stroke="#d7e2ec"/>
<text x="636" y="337" class="tiny" text-anchor="middle">3. enter readOnly transaction</text>
<path d="M550,348 L722,348" class="arrow"/>
<rect x="770" y="382" width="140" height="24" rx="8" fill="#fff" stroke="#d7e2ec"/>
<text x="840" y="399" class="tiny" text-anchor="middle">4. select ActorTable by id</text>
<path d="M754,410 L926,410" class="arrow"/>
<rect x="974" y="444" width="140" height="24" rx="8" fill="#fff" stroke="#d7e2ec"/>
<text x="1044" y="461" class="tiny" text-anchor="middle">5. map ResultRow to ActorRecord</text>
<path d="M958,472 L1130,472" class="arrow"/>
<rect x="566" y="506" width="548" height="24" rx="8" fill="#fff" stroke="#d7e2ec"/>
<text x="840" y="523" class="tiny" text-anchor="middle">6. return nullable record</text>
<path d="M1130,534 L550,534" class="softArrow"/>
<rect x="362" y="568" width="140" height="24" rx="8" fill="#fff" stroke="#d7e2ec"/>
<text x="432" y="585" class="tiny" text-anchor="middle">7. controller wraps ResponseEntity</text>
<path d="M518,596 L346,596" class="softArrow"/>
<rect x="158" y="630" width="140" height="24" rx="8" fill="#fff" stroke="#d7e2ec"/>
<text x="228" y="647" class="tiny" text-anchor="middle">8. 200 OK or 404 Not Found</text>
<path d="M314,658 L142,658" class="softArrow"/>
<rect x="72" y="686" width="1136" height="48" rx="10" fill="#ecfdf5" stroke="#86efac" stroke-width="1.3"/>
<text x="640" y="716" class="detail" text-anchor="middle">Search/create/delete follow the same boundary: controller validates request shape, repository composes Exposed DSL, transaction returns DTOs.</text>
</svg>
