<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980">
<defs>

  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#8ca2b4" flood-opacity=".14"/></filter>
  <marker id="seqArrowBlue" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#4f86c6"/></marker>
  <marker id="seqArrowGreen" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6f8f4e"/></marker>
  <marker id="seqArrowAmber" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#a06a3b"/></marker>
  <marker id="seqArrowTeal" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#3f8f8a"/></marker>
  <marker id="seqArrowRed" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b45a5a"/></marker>
  <style><![CDATA[
    svg{font-family:"Architects Daughter","Comic Mono",ui-sans-serif,system-ui,sans-serif}.canvas{fill:#f6f9fc}.frame{fill:#fff;stroke:#c7d8eb;stroke-width:2;filter:url(#shadow)}.title{font-family:"Architects Daughter";font-size:38px;fill:#263a57}.subtitle,.role,.labelText,.footer,.branchText{font-family:"Comic Mono";fill:#526276}.subtitle{font-size:15px}.header{fill:#fff;stroke-width:2.4;filter:url(#shadow)}.participant{font-family:"Architects Daughter";font-size:16px;fill:#263a57}.role{font-size:10px;fill:#6b7a90}.lifeline{fill:none;stroke:#a8bad0;stroke-width:2;stroke-dasharray:7 7}.activation{fill:#f8fbff;stroke:#d4e0ec;stroke-width:1.2;rx:6}.call{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}.return{fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:7 7}.pill{fill:#f8fafc;stroke-width:1.2}.numCircle{fill:#fff}.num{font-family:"Comic Mono";font-size:10px;font-weight:700}.labelText{font-size:11px}.alt{fill:none;stroke:#9bbce3;stroke-width:1.6;stroke-dasharray:8 8}.branchDivider{stroke:#9bbce3;stroke-opacity:.55;stroke-width:1.2;stroke-dasharray:7 7}.branchText{font-size:12px}.branchBadge{fill:#fff;stroke-width:1.2}.note{fill:#ecfdf5;stroke:#34a879;stroke-width:1.6}.small{font-size:10px}
  ]]></style>
</defs>
<rect class="canvas" width="1500" height="980"/><rect class="frame" x="28" y="26" width="1444" height="920" rx="24"/>
<text class="title" x="60" y="76">Spring MVC Request Processing Flow</text>
<text class="subtitle" x="60" y="102">Actor API request through Tomcat virtual thread, @Transactional controller boundary, repository DSL, and DTO mapping.</text>

<g transform="translate(0 0)">
  <rect class="header" x="70" y="158" width="150" height="66" rx="14" stroke="#4f86c6"/><text class="participant" x="145" y="188" text-anchor="middle">Client</text><text class="role" x="145" y="207" text-anchor="middle">HTTP caller</text><path class="lifeline" d="M145 238 V846"/>
  <rect class="header" x="285" y="158" width="170" height="66" rx="14" stroke="#4f86c6"/><text class="participant" x="370" y="188" text-anchor="middle">ActorController</text><text class="role" x="370" y="207" text-anchor="middle">@Transactional(readOnly)</text><path class="lifeline" d="M370 238 V846"/>
  <rect class="header" x="510" y="158" width="170" height="66" rx="14" stroke="#6f8f4e"/><text class="participant" x="595" y="188" text-anchor="middle">ActorRepository</text><text class="role" x="595" y="207" text-anchor="middle">Exposed DSL</text><path class="lifeline" d="M595 238 V846"/>
  <rect class="header" x="735" y="158" width="150" height="66" rx="14" stroke="#a06a3b"/><text class="participant" x="810" y="188" text-anchor="middle">Spring Tx</text><text class="role" x="810" y="207" text-anchor="middle">read-only boundary</text><path class="lifeline" d="M810 238 V846"/>
  <rect class="header" x="950" y="158" width="150" height="66" rx="14" stroke="#a06a3b"/><text class="participant" x="1025" y="188" text-anchor="middle">ActorTable</text><text class="role" x="1025" y="207" text-anchor="middle">selectAll().where</text><path class="lifeline" d="M1025 238 V846"/>
  <rect class="header" x="1165" y="158" width="150" height="66" rx="14" stroke="#3f8f8a"/><text class="participant" x="1240" y="188" text-anchor="middle">ActorRecord</text><text class="role" x="1240" y="207" text-anchor="middle">DTO mapper</text><path class="lifeline" d="M1240 238 V846"/>
</g>

<rect class="activation" x="364" y="270" width="12" height="540"/>
<rect class="activation" x="589" y="350" width="12" height="365"/>
<rect class="activation" x="804" y="430" width="12" height="230"/>
<rect class="activation" x="1019" y="510" width="12" height="115"/>

<rect class="alt" x="84" y="632" width="1298" height="150" rx="16"/>
<rect class="branchBadge" x="104" y="614" width="148" height="30" rx="10" stroke="#3f8f8a"/><text class="branchText" x="178" y="634" text-anchor="middle">alt matching actor row</text>
<path class="branchDivider" d="M84 704 H1382"/>
<rect class="branchBadge" x="104" y="690" width="408" height="30" rx="10" stroke="#b45a5a"/><text class="branchText" x="308" y="710" text-anchor="middle">else no matching row: controller returns null</text>

<path class="call callBlue" d="M154 282 H360" stroke="#4f86c6" marker-end="url(#seqArrowBlue)"/>
<rect class="pill" x="184" y="239" width="250" height="28" rx="10" stroke="#4f86c6"/><circle class="numCircle" cx="204" cy="253" r="11" stroke="#4f86c6"/><text class="num" x="204" y="257" text-anchor="middle" fill="#4f86c6">1</text><text class="labelText" x="224" y="258">GET /actors/{id}</text>

<path class="call callBlue" d="M379 362 H585" stroke="#4f86c6" marker-end="url(#seqArrowBlue)"/>
<rect class="pill" x="409" y="319" width="250" height="28" rx="10" stroke="#4f86c6"/><circle class="numCircle" cx="429" cy="333" r="11" stroke="#4f86c6"/><text class="num" x="429" y="337" text-anchor="middle" fill="#4f86c6">2</text><text class="labelText" x="449" y="338">call getActorById()</text>

<path class="call callGreen" d="M604 442 H800" stroke="#6f8f4e" marker-end="url(#seqArrowGreen)"/>
<rect class="pill" x="631" y="399" width="252" height="28" rx="10" stroke="#6f8f4e"/><circle class="numCircle" cx="651" cy="413" r="11" stroke="#6f8f4e"/><text class="num" x="651" y="417" text-anchor="middle" fill="#6f8f4e">3</text><text class="labelText" x="671" y="418">join readOnly transaction</text>

<path class="call callAmber" d="M819 522 H1015" stroke="#a06a3b" marker-end="url(#seqArrowAmber)"/>
<rect class="pill" x="846" y="479" width="252" height="28" rx="10" stroke="#a06a3b"/><circle class="numCircle" cx="866" cy="493" r="11" stroke="#a06a3b"/><text class="num" x="866" y="497" text-anchor="middle" fill="#a06a3b">4</text><text class="labelText" x="886" y="498">select ActorTable by id</text>

<path class="call callAmber" d="M1034 602 H1230" stroke="#a06a3b" marker-end="url(#seqArrowAmber)"/>
<rect class="pill" x="1070" y="559" width="225" height="28" rx="10" stroke="#a06a3b"/><circle class="numCircle" cx="1090" cy="573" r="11" stroke="#a06a3b"/><text class="num" x="1090" y="577" text-anchor="middle" fill="#a06a3b">5</text><text class="labelText" x="1110" y="578">map ResultRow</text>

<path class="return seqReturn" d="M1231 672 H604" stroke="#3f8f8a" marker-end="url(#seqArrowTeal)"/>
<rect class="pill" x="792" y="635" width="250" height="28" rx="10" stroke="#3f8f8a"/><circle class="numCircle" cx="812" cy="649" r="11" stroke="#3f8f8a"/><text class="num" x="812" y="653" text-anchor="middle" fill="#3f8f8a">6</text><text class="labelText" x="832" y="654">ActorRecord?</text>

<path class="return error" d="M586 746 H379" stroke="#b45a5a" marker-end="url(#seqArrowRed)"/>
<rect class="pill" x="407" y="711" width="268" height="28" rx="10" stroke="#b45a5a"/><circle class="numCircle" cx="427" cy="725" r="11" stroke="#b45a5a"/><text class="num" x="427" y="729" text-anchor="middle" fill="#b45a5a">7</text><text class="labelText" x="447" y="730">return DTO or null</text>

<path class="return seqReturn" d="M361 822 H154" stroke="#3f8f8a" marker-end="url(#seqArrowTeal)"/>
<rect class="pill" x="169" y="785" width="275" height="28" rx="10" stroke="#3f8f8a"/><circle class="numCircle" cx="189" cy="799" r="11" stroke="#3f8f8a"/><text class="num" x="189" y="803" text-anchor="middle" fill="#3f8f8a">8</text><text class="labelText" x="209" y="804">Spring serializes response</text>

<rect class="note" x="90" y="878" width="1320" height="44" rx="14"/>
<text class="footer" x="750" y="906" text-anchor="middle">Search, create, and delete use the same controller-to-repository boundary; write methods override read-only transactions.</text>
</svg>
