<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="920" viewBox="0 0 1500 920">
<defs>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#94a3b8" flood-opacity=".16"/></filter>
  <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M2,2 L12,7 L2,12 Z" fill="#475569"/></marker>
  <marker id="arrowSoft" markerWidth="14" markerHeight="14" refX="3" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M12,2 L2,7 L12,12 Z" fill="#64748b"/></marker>
  <style><![CDATA[
    svg{font-family:"Architects Daughter","Comic Mono",ui-sans-serif,system-ui,sans-serif}.canvas{fill:#f6f9fc}.frame{fill:#fff;stroke:#c7d8eb;stroke-width:2;filter:url(#shadow)}.title{font-family:"Architects Daughter";font-size:38px;fill:#263a57}.subtitle,.label,.footer,.altText{font-family:"Comic Mono";fill:#526276}.subtitle{font-size:15px}.head{fill:#ffffff;stroke-width:2;filter:url(#shadow)}.headText{font-family:"Architects Daughter";font-size:17px;fill:#263a57}.life{fill:none;stroke:#9fb2ca;stroke-width:2;stroke-dasharray:7 7}.msg{fill:none;stroke:#475569;stroke-width:2.5;stroke-linecap:round}.return{fill:none;stroke:#64748b;stroke-width:2.2;stroke-dasharray:7 7;stroke-linecap:round}.labelBox{fill:#f8fafc;stroke:#d4e0ec;stroke-width:1.1}.label{font-size:11px}.alt{fill:#60a5fa;fill-opacity:.055;stroke:#60a5fa;stroke-opacity:.34;stroke-width:1.5;stroke-dasharray:8 8}.altDivider{stroke:#60a5fa;stroke-opacity:.28;stroke-width:1.2;stroke-dasharray:7 7}.altText{font-size:12px}.note{fill:#ecfdf5;stroke:#34d399;stroke-width:1.6}
  ]]></style>
</defs>
<rect class="canvas" width="1500" height="920"/><rect class="frame" x="28" y="26" width="1444" height="860" rx="24"/>
<text class="title" x="60" y="76">Spring MVC Request Processing Flow</text>
<text class="subtitle" x="60" y="102">Actor API request through Tomcat virtual thread, @Transactional controller boundary, repository DSL, and DTO mapping.</text>
<rect class="head" x="60" y="165" width="140" height="54" rx="12" stroke="#2563eb"/><text class="headText" x="130" y="198" text-anchor="middle">Client</text><path class="life" d="M130 230 V800"/><rect class="head" x="260" y="165" width="140" height="54" rx="12" stroke="#7c3aed"/><text class="headText" x="330" y="198" text-anchor="middle">ActorController</text><path class="life" d="M330 230 V800"/><rect class="head" x="465" y="165" width="140" height="54" rx="12" stroke="#059669"/><text class="headText" x="535" y="198" text-anchor="middle">ActorRepository</text><path class="life" d="M535 230 V800"/><rect class="head" x="675" y="165" width="140" height="54" rx="12" stroke="#f97316"/><text class="headText" x="745" y="198" text-anchor="middle">Spring Tx</text><path class="life" d="M745 230 V800"/><rect class="head" x="885" y="165" width="140" height="54" rx="12" stroke="#db2777"/><text class="headText" x="955" y="198" text-anchor="middle">ActorTable</text><path class="life" d="M955 230 V800"/><rect class="head" x="1095" y="165" width="140" height="54" rx="12" stroke="#0f766e"/><text class="headText" x="1165" y="198" text-anchor="middle">ActorRecord</text><path class="life" d="M1165 230 V800"/>
<rect class="alt" x="86" y="585" width="1258" height="132" rx="16"/>
<text class="altText" x="104" y="610">alt matching actor row</text>
<path class="altDivider" d="M86 654 H1344"/>
<text class="altText" x="104" y="680">else no matching row: return null; controller does not build an explicit notFound response</text>
<path class="msg" d="M148 255 H312" marker-end="url(#arrow)"/><rect class="labelBox" x="120.0" y="237" width="220" height="28" rx="10"/><text class="label" x="230.0" y="256" text-anchor="middle">1. GET /actors/{id}</text><path class="msg" d="M348 330 H517" marker-end="url(#arrow)"/><rect class="labelBox" x="322.5" y="312" width="220" height="28" rx="10"/><text class="label" x="432.5" y="331" text-anchor="middle">2. call getActorById()</text><path class="msg" d="M553 405 H727" marker-end="url(#arrow)"/><rect class="labelBox" x="530.0" y="387" width="220" height="28" rx="10"/><text class="label" x="640.0" y="406" text-anchor="middle">3. join readOnly transaction</text><path class="msg" d="M763 480 H937" marker-end="url(#arrow)"/><rect class="labelBox" x="740.0" y="462" width="220" height="28" rx="10"/><text class="label" x="850.0" y="481" text-anchor="middle">4. select ActorTable by id</text><path class="msg" d="M973 545 H1147" marker-end="url(#arrow)"/><rect class="labelBox" x="950.0" y="527" width="220" height="28" rx="10"/><text class="label" x="1060.0" y="546" text-anchor="middle">5. map ResultRow</text><path class="return" d="M1147 630 H553" marker-end="url(#arrowSoft)"/><rect class="labelBox" x="740.0" y="612" width="220" height="28" rx="10"/><text class="label" x="850.0" y="631" text-anchor="middle">6. ActorRecord?</text><path class="return" d="M517 705 H348" marker-end="url(#arrowSoft)"/><rect class="labelBox" x="322.5" y="687" width="220" height="28" rx="10"/><text class="label" x="432.5" y="706" text-anchor="middle">7. return DTO or null</text><path class="return" d="M312 760 H148" marker-end="url(#arrowSoft)"/><rect class="labelBox" x="120.0" y="742" width="220" height="28" rx="10"/><text class="label" x="230.0" y="761" text-anchor="middle">8. Spring serializes response</text>
<rect class="note" x="90" y="820" width="1320" height="44" rx="14"/>
<text class="footer" x="750" y="848" text-anchor="middle">Search, create, and delete use the same controller to repository boundary; write methods override readOnly transactions.</text>
</svg>