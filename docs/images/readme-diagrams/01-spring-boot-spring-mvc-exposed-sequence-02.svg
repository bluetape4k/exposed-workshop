<svg xmlns="http://www.w3.org/2000/svg" width="1650" height="2116" viewBox="0 0 1650 2116" role="img" aria-label="Request Processing Flow">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#758297" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 0 1 L 12 6 L 0 11 Z" fill="#ffffff" stroke="#758297" stroke-width="1.8"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="1650" height="2116"/>
<rect class="frame" x="32" y="28" width="1586" height="2060" rx="28"/>
<text class="title" x="66" y="82">Request Processing Flow</text>
<text class="subtitle" x="70" y="118">Sequence messages from the original Mermaid source</text>
<rect class="card" x="21" y="166" width="238" height="72" rx="20" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="140" y="209" text-anchor="middle">Client</text>
<line class="lifeline" x1="140" y1="252" x2="140" y2="2056" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="363.5" y="166" width="238" height="72" rx="20" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="482.5" y="209" text-anchor="middle">ActorController</text>
<line class="lifeline" x1="482.5" y1="252" x2="482.5" y2="2056" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="706" y="166" width="238" height="72" rx="20" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="825" y="209" text-anchor="middle">ActorRepository</text>
<line class="lifeline" x1="825" y1="252" x2="825" y2="2056" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="1048.5" y="166" width="238" height="72" rx="20" fill="#FDECEF" stroke="#DC6B82"/>
<text class="smallLabel" x="1167.5" y="209" text-anchor="middle">ActorTable</text>
<line class="lifeline" x1="1167.5" y1="252" x2="1167.5" y2="2056" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="1391" y="166" width="238" height="72" rx="20" fill="#E9F7F6" stroke="#45A7A1"/>
<text class="smallLabel" x="1510" y="209" text-anchor="middle">DB</text>
<line class="lifeline" x1="1510" y1="252" x2="1510" y2="2056" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect x="155.75" y="286" width="311" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="173.75" y="313" text-anchor="start">1. POST /actors (ActorRecord JSON)</text>
<path class="line" d="M140 344 L482.5 344"/>
<rect x="548.75" y="396" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="566.75" y="423" text-anchor="start">2. create(actor)</text>
<path class="line" d="M482.5 454 L825 454"/>
<rect x="772.25" y="506" width="448" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="790.25" y="533" text-anchor="start">3. insertAndGetId { firstName, lastName, birthday }</text>
<path class="line" d="M825 564 L1167.5 564"/>
<rect x="1219.75" y="616" width="238" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1237.75" y="643" text-anchor="start">4. INSERT INTO actors ...</text>
<path class="line" d="M1167.5 674 L1510 674"/>
<rect x="1233.75" y="726" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1251.75" y="753" text-anchor="start">5. generated id</text>
<path class="dashed" d="M1510 784 L1167.5 784"/>
<rect x="891.25" y="836" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="909.25" y="863" text-anchor="start">6. EntityID&lt;Long&gt;</text>
<path class="dashed" d="M1167.5 894 L825 894"/>
<rect x="538.75" y="946" width="230" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="556.75" y="973" text-anchor="start">7. ActorRecord (with id)</text>
<path class="dashed" d="M825 1004 L482.5 1004"/>
<rect x="200.25" y="1056" width="222" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="218.25" y="1083" text-anchor="start">8. 201 ActorRecord JSON</text>
<path class="dashed" d="M482.5 1114 L140 1114"/>
<rect x="180.25" y="1166" width="262" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="198.25" y="1193" text-anchor="start">9. GET /actors?firstName=Tom</text>
<path class="line" d="M140 1224 L482.5 1224"/>
<rect x="538.75" y="1276" width="230" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="556.75" y="1303" text-anchor="start">10. searchActors(params)</text>
<path class="line" d="M482.5 1334 L825 1334"/>
<rect x="796.75" y="1386" width="399" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="814.75" y="1413" text-anchor="start">11. selectAll().andWhere { firstName eq Tom }</text>
<path class="line" d="M825 1444 L1167.5 1444"/>
<rect x="1131.25" y="1496" width="415" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1149.25" y="1523" text-anchor="start">12. SELECT * FROM actors WHERE first_name = Tom</text>
<path class="line" d="M1167.5 1554 L1510 1554"/>
<rect x="1233.75" y="1606" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1251.75" y="1633" text-anchor="start">13. ResultSet</text>
<path class="dashed" d="M1510 1664 L1167.5 1664"/>
<rect x="891.25" y="1716" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="909.25" y="1743" text-anchor="start">14. List&lt;ActorRecord&gt;</text>
<path class="dashed" d="M1167.5 1774 L825 1774"/>
<rect x="548.75" y="1826" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="566.75" y="1853" text-anchor="start">15. List&lt;ActorRecord&gt;</text>
<path class="dashed" d="M825 1884 L482.5 1884"/>
<rect x="172.25" y="1936" width="278" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="190.25" y="1963" text-anchor="start">16. 200 List&lt;ActorRecord&gt; JSON</text>
<path class="dashed" d="M482.5 1994 L140 1994"/>
</svg>
