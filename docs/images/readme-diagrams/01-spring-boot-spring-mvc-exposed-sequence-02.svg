<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="920" viewBox="0 0 1500 920">
<defs>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#8298a3" flood-opacity=".16"/></filter>
  <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#3f7d9c" stroke="#3f7d9c" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
  <marker id="arrowSoft" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#9b7d54" stroke="#9b7d54" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
  <marker id="arrowBranch" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b66a5b" stroke="#b66a5b" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
  <style><![CDATA[
    svg{font-family:"Architects Daughter","Comic Mono",ui-sans-serif,system-ui,sans-serif}.canvas{fill:#fbfcf8}.frame{fill:#fbfcf8;stroke:#41545d;stroke-width:3;filter:url(#shadow)}.title{font-family:"Architects Daughter";font-size:38px;fill:#263238}.subtitle,.msg,.footer,.altText,.badgeText{font-family:"Comic Mono";fill:#36464f}.subtitle{font-size:15px}.header,.head{fill:#ffffff;stroke:#546e7a;stroke-width:2;filter:url(#shadow)}.participant,.headText{font-family:"Architects Daughter";font-size:17px;fill:#1f3138}.life{fill:none;stroke:#9aaab1;stroke-width:2;stroke-dasharray:7 8}.activation{fill:#f3ecdf;stroke:#8f784e;stroke-width:1.5}.msg{font-size:11px}.call{fill:none;stroke:#3f7d9c;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.return{fill:none;stroke:#9b7d54;stroke-width:2.4;stroke-dasharray:8 6;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowSoft)}.branchReturn{stroke:#b66a5b;marker-end:url(#arrowBranch)}.label,.labelBox{fill:#ffffff;stroke:#d7e0e4;stroke-width:1.4}.badge{fill:#eaf4f8;stroke:#3f7d9c;stroke-width:1.8}.badge.returnBadge{fill:#fff7e8;stroke:#9b7d54}.badge.branchBadge{fill:#fff0ec;stroke:#b66a5b}.badgeText{font-size:12px;font-weight:700}.callText,.badgeText.callText{fill:#2f6f8e}.returnText,.badgeText.returnText{fill:#7f6038}.branchText,.badgeText.branchText{fill:#934d42}.alt{fill:none;stroke:#78909c;stroke-width:3;stroke-dasharray:12 7}.altDivider{stroke:#78909c;stroke-width:1.4;stroke-dasharray:7 7}.altText{font-size:12px}.note{fill:#ffffff;stroke:#ccd7da;stroke-width:2}
  ]]></style>
</defs>
<rect class="canvas" width="1500" height="920"/><rect class="frame" x="28" y="26" width="1444" height="860" rx="24"/>
<text class="title" x="60" y="76">Spring MVC Request Processing Flow</text>
<text class="subtitle" x="60" y="102">Actor API request through Tomcat virtual thread, @Transactional controller boundary, repository DSL, and DTO mapping.</text>
<rect class="header head" x="60" y="165" width="140" height="54" rx="12"/><text class="participant headText" x="130" y="198" text-anchor="middle">Client</text><path class="life" d="M130 230 V800"/><rect class="header head" x="260" y="165" width="140" height="54" rx="12"/><text class="participant headText" x="330" y="198" text-anchor="middle">ActorController</text><path class="life" d="M330 230 V800"/><rect class="header head" x="465" y="165" width="140" height="54" rx="12"/><text class="participant headText" x="535" y="198" text-anchor="middle">ActorRepository</text><path class="life" d="M535 230 V800"/><rect class="header head" x="675" y="165" width="140" height="54" rx="12"/><text class="participant headText" x="745" y="198" text-anchor="middle">Spring Tx</text><path class="life" d="M745 230 V800"/><rect class="header head" x="885" y="165" width="140" height="54" rx="12"/><text class="participant headText" x="955" y="198" text-anchor="middle">ActorTable</text><path class="life" d="M955 230 V800"/><rect class="header head" x="1095" y="165" width="140" height="54" rx="12"/><text class="participant headText" x="1165" y="198" text-anchor="middle">ActorRecord</text><path class="life" d="M1165 230 V800"/>
<rect x="323" y="318" width="14" height="458" rx="6" class="activation"/><rect x="528" y="330" width="14" height="394" rx="6" class="activation"/><rect x="738" y="405" width="14" height="96" rx="6" class="activation"/><rect x="948" y="480" width="14" height="70" rx="6" class="activation"/><rect x="1158" y="545" width="14" height="92" rx="6" class="activation"/>
<rect class="alt" x="86" y="585" width="1258" height="132" rx="16"/>
<text class="altText" x="104" y="610">alt matching actor row</text>
<path class="altDivider" d="M86 654 H1344"/>
<text class="altText" x="104" y="680">else no matching row: return null; controller does not build an explicit notFound response</text>
<path class="call" d="M148 255 H312"/><rect class="label labelBox" x="96" y="237" width="244" height="28" rx="14"/><circle cx="116" cy="251" r="11" class="badge"/><text x="116" y="255" text-anchor="middle" class="badgeText callText">1</text><text class="msg callText" x="236" y="256" text-anchor="middle">GET /actors/{id}</text><path class="call" d="M348 330 H517"/><rect class="label labelBox" x="304" y="312" width="238" height="28" rx="14"/><circle cx="324" cy="326" r="11" class="badge"/><text x="324" y="330" text-anchor="middle" class="badgeText callText">2</text><text class="msg callText" x="438" y="331" text-anchor="middle">call getActorById()</text><path class="call" d="M553 405 H727"/><rect class="label labelBox" x="512" y="387" width="238" height="28" rx="14"/><circle cx="532" cy="401" r="11" class="badge"/><text x="532" y="405" text-anchor="middle" class="badgeText callText">3</text><text class="msg callText" x="646" y="406" text-anchor="middle">join readOnly transaction</text><path class="call" d="M763 480 H937"/><rect class="label labelBox" x="722" y="462" width="238" height="28" rx="14"/><circle cx="742" cy="476" r="11" class="badge"/><text x="742" y="480" text-anchor="middle" class="badgeText callText">4</text><text class="msg callText" x="856" y="481" text-anchor="middle">select ActorTable by id</text><path class="call" d="M973 545 H1147"/><rect class="label labelBox" x="950" y="527" width="220" height="28" rx="14"/><circle cx="970" cy="541" r="11" class="badge"/><text x="970" y="545" text-anchor="middle" class="badgeText callText">5</text><text class="msg callText" x="1070" y="546" text-anchor="middle">map ResultRow</text><path class="return branchReturn" stroke="#b66a5b" marker-end="url(#arrowBranch)" d="M1147 630 H553"/><rect class="label labelBox" x="740" y="612" width="220" height="28" rx="14"/><circle cx="760" cy="626" r="11" class="badge branchBadge"/><text x="760" y="630" text-anchor="middle" class="badgeText branchText">6</text><text class="msg branchText" x="860" y="631" text-anchor="middle">ActorRecord?</text><path class="return branchReturn" stroke="#b66a5b" marker-end="url(#arrowBranch)" d="M517 705 H348"/><rect class="label labelBox" x="322" y="687" width="220" height="28" rx="14"/><circle cx="342" cy="701" r="11" class="badge branchBadge"/><text x="342" y="705" text-anchor="middle" class="badgeText branchText">7</text><text class="msg branchText" x="442" y="706" text-anchor="middle">return DTO or null</text><path class="return" d="M312 760 H148"/><rect class="label labelBox" x="120" y="742" width="220" height="28" rx="14"/><circle cx="140" cy="756" r="11" class="badge returnBadge"/><text x="140" y="760" text-anchor="middle" class="badgeText returnText">8</text><text class="msg returnText" x="240" y="761" text-anchor="middle">Spring serializes response</text>
<rect class="note" x="90" y="820" width="1320" height="44" rx="14"/>
<text class="footer" x="750" y="848" text-anchor="middle">Search, create, and delete use the same controller to repository boundary; write methods override readOnly transactions.</text>
</svg>
