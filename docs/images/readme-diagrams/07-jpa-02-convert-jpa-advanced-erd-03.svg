<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1102 760" width="1102" height="760" role="img" aria-label="Joined table inheritance ERD">
  <defs>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="136%">
      <feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
    <marker id="fkArrow" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#60758d" stroke="#60758d" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <style>
      .canvas{fill:#f6f9fc}
      .frame{fill:#ffffff;stroke:#d7e2ec;stroke-width:1.5}
      .tableBox{fill:#ffffff;stroke-width:1.9;filter:url(#shadow)}
      .head{stroke-width:0}
      .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:32px;fill:#1e293b}
      .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;fill:#536476}
      .tableTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:20px;fill:#1e293b}
      .field{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;fill:#475569}
      .pk{fill:#1e3a8a;font-weight:700}
      .fk{fill:#8a4f0a;font-weight:700}
      .meta{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:11px;fill:#64748b}
      .relation{fill:none;stroke:#60758d;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#fkArrow)}
      .cardinality{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:20px;fill:#334155}
      .legendBox{fill:#f8fafc;stroke:#d7e2ec;stroke-width:1.2}
      .legendText{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;fill:#475569}
    </style>
  </defs>

  <rect width="1102" height="760" class="canvas"/>
  <rect x="20" y="20" width="1062" height="720" rx="16" class="frame"/>
  <text x="48" y="60" class="title">Joined Table Inheritance ERD</text>
  <text x="48" y="83" class="subtitle">A parent person row is extended by child tables whose primary key is also a foreign key.</text>

  <g id="person" data-node="joined_person">
    <rect x="392" y="126" width="318" height="174" rx="12" class="tableBox" stroke="#16a34a"/>
    <path d="M392,164 L392,138 Q392,126 404,126 L698,126 Q710,126 710,138 L710,164 Z" class="head" fill="#dcfce7"/>
    <text x="551" y="151" class="tableTitle" text-anchor="middle">joined_person</text>
    <text x="416" y="190" class="field pk">id SERIAL PRIMARY KEY</text>
    <text x="416" y="212" class="field">person_name varchar(128)</text>
    <text x="416" y="234" class="field">ssn varchar(128)</text>
    <text x="416" y="264" class="meta">unique(person_name, ssn)</text>
  </g>

  <g id="employee" data-node="joined_employee">
    <rect x="86" y="422" width="318" height="194" rx="12" class="tableBox" stroke="#3b82f6"/>
    <path d="M86,460 L86,434 Q86,422 98,422 L392,422 Q404,422 404,434 L404,460 Z" class="head" fill="#dbeafe"/>
    <text x="245" y="447" class="tableTitle" text-anchor="middle">joined_employee</text>
    <text x="110" y="486" class="field pk">id INT PRIMARY KEY</text>
    <text x="110" y="508" class="field fk">id FK -> joined_person.id</text>
    <text x="110" y="530" class="field">emp_no varchar(128)</text>
    <text x="110" y="552" class="field">emp_title varchar(128)</text>
    <text x="110" y="574" class="field fk">manager_id INT? FK -> employee.id</text>
    <text x="110" y="602" class="meta">unique(emp_no, manager_id)</text>
  </g>

  <g id="customer" data-node="joined_customer">
    <rect x="698" y="422" width="318" height="194" rx="12" class="tableBox" stroke="#ea580c"/>
    <path d="M698,460 L698,434 Q698,422 710,422 L1004,422 Q1016,422 1016,434 L1016,460 Z" class="head" fill="#ffedd5"/>
    <text x="857" y="447" class="tableTitle" text-anchor="middle">joined_customer</text>
    <text x="722" y="486" class="field pk">id INT PRIMARY KEY</text>
    <text x="722" y="508" class="field fk">id FK -> joined_person.id</text>
    <text x="722" y="530" class="field">mobile varchar(16)</text>
    <text x="722" y="552" class="field">customer_grade varchar(32)</text>
    <text x="722" y="574" class="field fk">contact_employee_id INT? FK</text>
    <text x="722" y="602" class="meta">index(mobile, customer_grade)</text>
  </g>

  <path id="person-employee" class="relation" data-connector="person-employee" d="M470,300 L470,340 Q470,352 458,352 L245,352 Q233,352 233,364 L233,422"/>
  <text x="502" y="328" class="cardinality">1</text>
  <text x="256" y="410" class="cardinality">1</text>

  <path id="person-customer" class="relation" data-connector="person-customer" d="M632,300 L632,340 Q632,352 644,352 L857,352 Q869,352 869,364 L869,422"/>
  <text x="604" y="328" class="cardinality">1</text>
  <text x="838" y="410" class="cardinality">1</text>

  <path id="employee-manager" class="relation" data-connector="employee-manager" d="M86,574 L58,574 Q46,574 46,562 L46,482 Q46,470 58,470 L86,470"/>
  <text x="22" y="558" class="cardinality">1</text>
  <text x="22" y="494" class="cardinality">N</text>

  <path id="employee-customer-contact" class="relation" data-connector="employee-customer-contact" d="M404,574 L698,574"/>
  <text x="424" y="552" class="cardinality">1</text>
  <text x="670" y="552" class="cardinality">N</text>

  <rect x="86" y="660" width="930" height="40" rx="10" class="legendBox"/>
  <text x="551" y="685" class="legendText" text-anchor="middle">PK=FK child rows model JPA JOINED inheritance; manager/contact relations remain ordinary optional foreign keys.</text>
</svg>
