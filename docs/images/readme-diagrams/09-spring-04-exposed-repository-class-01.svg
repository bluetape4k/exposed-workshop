  <rect x="1880" y="1010" width="360" height="96" rx="8" fill="#fce7f3" stroke="#db2777" class="card"/>
  <rect x="1880" y="1010" width="360" height="36" rx="8" fill="#fbcfe8" stroke="#db2777" class="head"/>
  <text x="2060" y="1034" class="label" text-anchor="middle">DataInitializer</text>
  <text x="1900" y="1070" class="detail">creates sample actors/movies</text>
  <text x="1900" y="1090" class="detail">batchInsert + join rows</text>

