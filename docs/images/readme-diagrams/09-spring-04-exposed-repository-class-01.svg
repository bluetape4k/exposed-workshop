<svg xmlns="http://www.w3.org/2000/svg" width="2120" height="1265" viewBox="0 0 2120 1265" role="img" aria-label="04 exposed repository Class Structure">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="10" markerHeight="8" refX="8.5" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 8.5 4 L 1 7" fill="none" stroke="#758297" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="11" markerHeight="10" refX="9.5" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 1 L 9.5 5 L 0.5 9 Z" fill="#ffffff" stroke="#758297" stroke-width="1.7"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="2120" height="1265"/>
<rect class="frame" x="32" y="28" width="2056" height="1209" rx="28"/>
<text class="title" x="66" y="82">04 exposed repository Class Structure</text>
<text class="subtitle" x="70" y="118">UML classes from the original Mermaid source</text>
<path class="line" d="M1060 671 L1060 815 L240 815 L240 959"/>
<path class="line" d="M1060 671 L1060 815 L1880 815 L1880 959"/>
<path class="line" d="M820 678 L1265 678 L1265 604.5 L1710 604.5"/>
<path class="line" d="M820 678 L1060 678 L1060 615 L1300 615"/>
<path class="line" d="M480 678 L445 678 L445 604.5 L410 604.5"/>
<path class="inheritLine" d="M1060 517 L1060 457 L1060 457 L1060 397"/>
<path class="inheritLine" d="M650 517 L650 457 L1060 457 L1060 397"/>
<g transform="translate(480,517)">
  <rect class="card" x="0" y="0" width="340" height="322" rx="5" fill="#E8F3FF" stroke="#5B8DEF"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#5B8DEF"/>
  <text class="small" x="170" y="26" text-anchor="middle">«@Repository»</text>
  <text class="label" x="170" y="61" text-anchor="middle">MovieExposedRepository</text>
  <text class="mono" x="18" y="108">+searchMovies(params) List~MovieRecord~</text>
<text class="mono" x="18" y="129">+create(movieRecord) MovieRecord</text>
<text class="mono" x="18" y="150">+getAllMoviesWithActors()</text>
<text class="mono" x="18" y="171">List~MovieWithActorRecord~</text>
<text class="mono" x="18" y="192">+getMovieWithActors(movieId)</text>
<text class="mono" x="18" y="213">MovieWithActorRecord?</text>
<text class="mono" x="18" y="234">+getMovieActorsCount()</text>
<text class="mono" x="18" y="255">List~MovieActorCountRecord~</text>
<text class="mono" x="18" y="276">+findMoviesWithActingProducers()</text>
<text class="mono" x="18" y="297">List~MovieWithProducingActorRecord~</text>
</g>
<g transform="translate(70,517)">
  <rect class="card" x="0" y="0" width="340" height="175" rx="5" fill="#EAF7EF" stroke="#58A978"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#58A978"/>
  <text class="small" x="170" y="26" text-anchor="middle">«object»</text>
  <text class="label" x="170" y="61" text-anchor="middle">MovieTable</text>
  <text class="mono" x="18" y="108">+name: Column~String~</text>
<text class="mono" x="18" y="129">+producerName: Column~String~</text>
<text class="mono" x="18" y="150">+releaseDate: Column~LocalDate~</text>
</g>
<g transform="translate(890,180)">
  <rect class="card" x="0" y="0" width="340" height="217" rx="5" fill="#FFF3D9" stroke="#D6A441"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#D6A441"/>
  <text class="small" x="170" y="26" text-anchor="middle">«interface»</text>
  <text class="label" x="170" y="61" text-anchor="middle">JdbcRepository</text>
  <text class="mono" x="18" y="108">+table: T</text>
<text class="mono" x="18" y="129">+toEntity(ResultRow) E</text>
<text class="mono" x="18" y="150">+findById(id) E?</text>
<text class="mono" x="18" y="171">+findAll() List~E~</text>
<text class="mono" x="18" y="192">+deleteById(id)</text>
</g>
<g transform="translate(1300,517)">
  <rect class="card" x="0" y="0" width="340" height="196" rx="5" fill="#FDECEF" stroke="#DC6B82"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#DC6B82"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="61" text-anchor="middle">MovieRecord</text>
  <text class="mono" x="18" y="108">+id: Long</text>
<text class="mono" x="18" y="129">+name: String</text>
<text class="mono" x="18" y="150">+producerName: String</text>
<text class="mono" x="18" y="171">+releaseDate: String</text>
</g>
<g transform="translate(1710,517)">
  <rect class="card" x="0" y="0" width="340" height="175" rx="5" fill="#E9F7F6" stroke="#45A7A1"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#45A7A1"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="61" text-anchor="middle">MovieWithActorRecord</text>
  <text class="mono" x="18" y="108">+id: Long</text>
<text class="mono" x="18" y="129">+name: String</text>
<text class="mono" x="18" y="150">+actors: List~ActorRecord~</text>
</g>
<g transform="translate(890,517)">
  <rect class="card" x="0" y="0" width="340" height="154" rx="5" fill="#F1ECFF" stroke="#8A72D6"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#8A72D6"/>
  <text class="small" x="170" y="26" text-anchor="middle">«@Repository»</text>
  <text class="label" x="170" y="61" text-anchor="middle">ActorExposedRepository</text>
  <text class="mono" x="18" y="108">+searchActors(params) List~ActorRecord~</text>
<text class="mono" x="18" y="129">+create(actor) ActorRecord</text>
</g>
<g transform="translate(70,959)">
  <rect class="card" x="0" y="0" width="340" height="196" rx="5" fill="#F7F1E7" stroke="#B88A44"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#B88A44"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="61" text-anchor="middle">ActorRecord</text>
  <text class="mono" x="18" y="108">+id: Long</text>
<text class="mono" x="18" y="129">+firstName: String</text>
<text class="mono" x="18" y="150">+lastName: String</text>
<text class="mono" x="18" y="171">+birthday: String?</text>
</g>
<g transform="translate(1710,959)">
  <rect class="card" x="0" y="0" width="340" height="175" rx="5" fill="#EEF6D9" stroke="#8BA84D"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#8BA84D"/>
  <text class="small" x="170" y="26" text-anchor="middle">«object»</text>
  <text class="label" x="170" y="61" text-anchor="middle">ActorTable</text>
  <text class="mono" x="18" y="108">+firstName: Column~String~</text>
<text class="mono" x="18" y="129">+lastName: Column~String~</text>
<text class="mono" x="18" y="150">+birthday: Column~LocalDate?~</text>
</g>
</svg>
