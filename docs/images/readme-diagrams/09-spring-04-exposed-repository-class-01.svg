  <text x="48" y="58" class="title">09 Spring: Exposed Repository (04)</text>
  <text x="48" y="80" class="subtitle">Spring MVC controllers call JdbcRepository implementations that consume Exposed DSL tables and DAO entities</text>

  <text x="1340" y="118" class="section" text-anchor="middle">TABLES AND DAO ENTITIES</text>
  <text x="1250" y="618" class="section" text-anchor="middle">REPOSITORY IMPLEMENTATIONS</text>
  <text x="240" y="566" class="section" text-anchor="middle">MVC ENTRYPOINTS</text>
  <text x="470" y="964" class="section" text-anchor="middle">BOOTSTRAP CONFIGURATION</text>

