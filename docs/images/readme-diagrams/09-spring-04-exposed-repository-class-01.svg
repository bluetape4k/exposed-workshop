  <rect x="80" y="1000" width="320" height="86" rx="8" fill="#fce7f3" stroke="#db2777" class="card"/>
  <rect x="80" y="1000" width="320" height="36" rx="8" fill="#fbcfe8" stroke="#db2777" class="head"/>
  <text x="240" y="1024" class="label" text-anchor="middle">ExposedRepositoryApp</text>
