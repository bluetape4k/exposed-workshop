  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#B88A44"/>
  <text class="small" x="170" y="26" text-anchor="middle">«@Repository»</text>
  <text class="label" x="170" y="57" text-anchor="middle">ActorExposedRepository</text>
