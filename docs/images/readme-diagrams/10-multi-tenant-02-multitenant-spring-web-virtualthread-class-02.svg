<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 810" width="1340" height="810" role="img" aria-label="Exposed + Spring Web + Virtual Threads + Multi-Tenant (02) class diagram">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/>
