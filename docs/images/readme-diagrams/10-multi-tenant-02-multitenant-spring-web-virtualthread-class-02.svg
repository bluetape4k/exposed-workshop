    <marker id="inheritHead" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="16" viewBox="0 0 18 16" refX="16" refY="8" orient="auto" data-role="uml-hollow" data-tip-direction="positive-x">
      <path d="M1,1 L16,8 L1,15 Z" fill="#fff" stroke="#64748b" stroke-width="1.7" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <style>
      .canvas{fill:#f6f9fc}
      .frame{fill:#fff;stroke:#d7e2ec;stroke-width:1.5}
      .card{stroke-width:1.8;filter:url(#shadow)}
      .title{font-family:"Architects Daughter";font-size:31px;fill:#1e293b}
      .subtitle,.detail,.legend{font-family:"Comic Mono";fill:#536476}
      .subtitle{font-size:13px}
      .detail{font-size:12px}
      .legend{font-size:12px}
      .label{font-family:"Architects Daughter";font-size:16px;fill:#1e293b}
      .section{font-family:"Architects Daughter";font-size:13px;letter-spacing:.08em;fill:#64748b}
      .inherit{fill:none;stroke:#64748b;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#inheritHead)}
      .domainUse{fill:none;stroke:#2f9a94;stroke-width:1.7;stroke-dasharray:6 6;stroke-linecap:round;stroke-linejoin:round}
      .repoUse{fill:none;stroke:#4f86c6;stroke-width:1.7;stroke-dasharray:6 6;stroke-linecap:round;stroke-linejoin:round}
      .runtimeUse{fill:none;stroke:#8a6f3e;stroke-width:1.7;stroke-dasharray:6 6;stroke-linecap:round;stroke-linejoin:round}
      .domainHead{fill:none;stroke:#2f9a94;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:none}
      .repoHead{fill:none;stroke:#4f86c6;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:none}
      .runtimeHead{fill:none;stroke:#8a6f3e;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:none}
    </style>
