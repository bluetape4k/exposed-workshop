  <text x="52" y="64" class="title">Exposed + Spring Web + Virtual Threads + Multi-Tenant (02)</text>
  <text x="52" y="90" class="subtitle">Class relationships grouped by source role; colored dashed lines separate domain, repository, and runtime context dependencies.</text>

