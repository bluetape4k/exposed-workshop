<path class="arrow" d="M490 710 L548 710 Q560 710 560 722 L560 778 Q560 790 572 790 L620 790"/>
<path class="soft" d="M980 384 L1110 384"/>
<path class="soft" d="M980 790 L1038 790 Q1050 790 1050 778 L1050 702 Q1050 690 1062 690 L1110 690"/>
<path class="soft" d="M1290 536 V590"/>
<rect class="note" x="185" y="960" width="1230" height="58" rx="26"/>
<text class="footer" x="800" y="995" text-anchor="middle">The API surface stays small: chapter tests select dialects, run withDb helpers, then reuse sample tables and repositories for assertions.</text>
</svg>
