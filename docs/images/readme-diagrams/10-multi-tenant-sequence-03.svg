<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 900" width="1500" height="900" role="img" aria-label="Common multi-tenant request sequence">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/></filter>
    <marker id="arrowBlue" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#4f86c6" stroke="#4f86c6" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="arrowGreen" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6f8f58" stroke="#6f8f58" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="arrowAmber" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#a2743d" stroke="#a2743d" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="arrowPurple" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7a8445" stroke="#7a8445" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="arrowTeal" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2f9a94" stroke="#2f9a94" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="arrowGray" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6f8792" stroke="#6f8792" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <style>
      .canvas{fill:none}.frame{fill:#fbfcf8;stroke:#40545d;stroke-width:3}
      .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:31px;fill:#1e293b}
      .subtitle,.detail{font-family:"Comic Mono","Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;fill:#536476}
      .subtitle{font-size:13px}.detail{font-size:12px}.role{font-family:"Comic Mono","Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:10.5px;fill:#60727d}
      .participant{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:16px;fill:#1e293b}
      .card{stroke-width:1.7;filter:url(#shadow)}
      .header{fill:#ffffff;stroke:#b6d3ec;stroke-width:1.7;filter:url(#shadow)}
      .lifeline{stroke:#9cafb7;stroke-width:1.4;stroke-dasharray:5 6}
      .activation{fill:#f3ecdf;stroke:#8f784e;stroke-width:1.5}
      .call{fill:none;stroke:#4f86c6;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowBlue)}
      .contextCall{fill:none;stroke:#6f8f58;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowGreen)}
      .schemaCall{fill:none;stroke:#a2743d;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowAmber)}
      .databaseCall{fill:none;stroke:#7a8445;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowPurple)}
      .sqlCall{fill:none;stroke:#2f9a94;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowTeal)}
      .returnLine{fill:none;stroke:#6f8792;stroke-width:2.2;stroke-dasharray:7 5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowGray)}
      .pill{stroke-width:1.6;filter:url(#shadow)}
      .badge{fill:#fff;stroke-width:1.4}
      .branch{fill:none;stroke:#8aa1ad;stroke-width:1.6;stroke-dasharray:9 7}
      .branchTitle{fill:#fff;stroke:#8aa1ad;stroke-width:1.2}
      .branchDivider{stroke:#aab8c2;stroke-width:1.2;stroke-dasharray:6 6}
    </style>
  </defs>
  <rect width="1500" height="900" class="canvas"/>
  <rect x="20" y="20" width="1460" height="860" rx="16" class="frame"/>
  <text x="48" y="58" class="title">Common Multi-Tenant Request Sequence</text>
  <text x="48" y="80" class="subtitle">Tenant identity is resolved at the edge, carried through runtime context, then applied by schema switching or database routing</text>

  <desc>Client</desc><rect x="46" y="128" width="150" height="62" rx="10" class="header card"/>
  <text x="121" y="156" class="participant" text-anchor="middle">Client</text>
  <text x="121" y="176" class="role" text-anchor="middle">HTTP caller</text>
  <line x1="121" y1="190" x2="121" y2="860" class="lifeline"/>

  <desc>Tenant Edge</desc><rect x="234" y="128" width="170" height="62" rx="10" class="header card"/>
  <text x="319" y="156" class="participant" text-anchor="middle">Tenant Edge</text>
  <text x="319" y="176" class="role" text-anchor="middle">filter / plugin / auth</text>
  <line x1="319" y1="190" x2="319" y2="860" class="lifeline"/>

  <desc>Context Carrier</desc><rect x="452" y="128" width="176" height="62" rx="10" class="header card"/>
  <text x="540" y="156" class="participant" text-anchor="middle">Context</text>
  <text x="540" y="176" class="role" text-anchor="middle">ThreadLocal / Reactor</text>
  <line x1="540" y1="190" x2="540" y2="860" class="lifeline"/>

  <desc>Controller</desc><rect x="682" y="128" width="154" height="62" rx="10" class="header card"/>
  <text x="759" y="156" class="participant" text-anchor="middle">Controller</text>
  <text x="759" y="176" class="role" text-anchor="middle">MVC / WebFlux / Ktor</text>
  <line x1="759" y1="190" x2="759" y2="860" class="lifeline"/>

  <desc>TenantBoundary</desc><rect x="902" y="128" width="178" height="62" rx="10" class="header card"/>
  <text x="991" y="156" class="participant" text-anchor="middle">Tenant Boundary</text>
  <text x="991" y="176" class="role" text-anchor="middle">schema or registry</text>
  <line x1="991" y1="190" x2="991" y2="860" class="lifeline"/>

  <desc>Repository</desc><rect x="1144" y="128" width="164" height="62" rx="10" class="header card"/>
  <text x="1226" y="156" class="participant" text-anchor="middle">Repository</text>
  <text x="1226" y="176" class="role" text-anchor="middle">Exposed tables</text>
  <line x1="1226" y1="190" x2="1226" y2="860" class="lifeline"/>

  <desc>Database</desc><rect x="1356" y="128" width="108" height="62" rx="10" class="header card"/>
  <text x="1410" y="156" class="participant" text-anchor="middle">Database</text>
  <text x="1410" y="176" class="role" text-anchor="middle">schema / pool</text>
  <line x1="1410" y1="190" x2="1410" y2="860" class="lifeline"/>

  <rect x="114" y="274" width="14" height="72" rx="6" class="activation"/>
  <rect x="312" y="304" width="14" height="120" rx="6" class="activation"/>
  <rect x="533" y="384" width="14" height="338" rx="6" class="activation"/>
  <rect x="752" y="456" width="14" height="250" rx="6" class="activation"/>
  <rect x="984" y="528" width="14" height="232" rx="6" class="activation"/>
  <rect x="1219" y="642" width="14" height="82" rx="6" class="activation"/>
  <rect x="1403" y="674" width="14" height="64" rx="6" class="activation"/>

  <rect x="76" y="228" width="360" height="34" rx="17" fill="#ffffff" stroke="#4f86c6" class="pill card"/>
  <circle cx="100" cy="245" r="14" class="badge" stroke="#4f86c6"/>
  <text x="100" y="250" class="detail" text-anchor="middle">1</text>
  <text x="125" y="251" class="detail">request with X-Tenant-ID</text>
  <path data-connector="client-sends-tenant-header" d="M121,286 H319" class="call"/>

  <rect x="226" y="324" width="402" height="34" rx="17" fill="#ffffff" stroke="#6f8f58" class="pill card"/>
  <circle cx="250" cy="341" r="14" class="badge" stroke="#6f8f58"/>
  <text x="250" y="346" class="detail" text-anchor="middle">2</text>
  <text x="275" y="347" class="detail">resolve and bind tenant context</text>
  <path data-connector="edge-binds-context" d="M319,376 H540" class="contextCall"/>

  <rect x="454" y="414" width="400" height="34" rx="17" fill="#ffffff" stroke="#4f86c6" class="pill card"/>
  <circle cx="478" cy="431" r="14" class="badge" stroke="#4f86c6"/>
  <text x="478" y="436" class="detail" text-anchor="middle">3</text>
  <text x="503" y="437" class="detail">dispatch controller or route handler</text>
  <path data-connector="context-enters-controller" d="M540,466 H759" class="call"/>

  <rect x="122" y="500" width="1270" height="332" rx="18" class="branch"/>
  <rect x="156" y="480" width="214" height="34" rx="16" class="branchTitle"/>
  <text x="263" y="502" class="detail" text-anchor="middle">storage boundary</text>
  <line x1="142" y1="606" x2="1372" y2="606" class="branchDivider"/>

  <rect x="700" y="506" width="420" height="34" rx="17" fill="#ffffff" stroke="#a2743d" class="pill card"/>
  <circle cx="724" cy="523" r="14" class="badge" stroke="#a2743d"/>
  <text x="724" y="528" class="detail" text-anchor="middle">4</text>
  <text x="749" y="529" class="detail">schema path: set schema inside transaction</text>
  <path data-connector="controller-enters-schema-boundary" d="M759,558 H991" class="schemaCall"/>

  <rect x="700" y="626" width="420" height="34" rx="17" fill="#ffffff" stroke="#7a8445" class="pill card"/>
  <circle cx="724" cy="643" r="14" class="badge" stroke="#7a8445"/>
  <text x="724" y="648" class="detail" text-anchor="middle">5</text>
  <text x="749" y="649" class="detail">database path: select tenant Database</text>
  <path data-connector="controller-enters-database-boundary" d="M759,678 H991" class="databaseCall"/>

  <rect x="970" y="730" width="390" height="34" rx="17" fill="#ffffff" stroke="#2f9a94" class="pill card"/>
  <circle cx="994" cy="747" r="14" class="badge" stroke="#2f9a94"/>
  <text x="994" y="752" class="detail" text-anchor="middle">6</text>
  <text x="1019" y="753" class="detail">repository reads/writes tenant tables</text>
  <path data-connector="boundary-calls-repository" d="M991,782 H1226" class="sqlCall"/>
  <path data-connector="repository-calls-database" d="M1226,812 H1410" class="sqlCall"/>

  <rect x="668" y="750" width="322" height="34" rx="17" fill="#f8fafc" stroke="#6f8792" class="pill card"/>
  <circle cx="692" cy="767" r="14" class="badge" stroke="#6f8792"/>
  <text x="692" y="772" class="detail" text-anchor="middle">7</text>
  <text x="717" y="773" class="detail">reset schema when owned</text>
  <path data-connector="boundary-reset-return" d="M991,800 H540" class="returnLine"/>
  <rect x="82" y="796" width="392" height="34" rx="17" fill="#f8fafc" stroke="#6f8792" class="pill card"/>
  <circle cx="106" cy="813" r="14" class="badge" stroke="#6f8792"/>
  <text x="106" y="818" class="detail" text-anchor="middle">8</text>
  <text x="131" y="819" class="detail">return tenant-scoped response</text>
  <path data-connector="database-returns-response" d="M1410,854 H1226 H991 H759 H540 H319 H121" class="returnLine"/>
</svg>
