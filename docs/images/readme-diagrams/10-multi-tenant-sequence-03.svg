<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 940" width="1500" height="940" role="img" aria-label="Common Multi-Tenant Request Flow">
<defs>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/></filter>
<marker id="arrowBlue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8 Z" fill="#2563eb"/></marker><marker id="arrowPurple" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8 Z" fill="#7c3aed"/></marker><marker id="arrowOrange" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8 Z" fill="#ea580c"/></marker><marker id="arrowGreen" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8 Z" fill="#16a34a"/></marker><marker id="arrowTeal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8 Z" fill="#0f766e"/></marker><marker id="arrowGray" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8 Z" fill="#64748b"/></marker>
<style>
.canvas{fill:#f6f9fc}.frame{fill:#fff;stroke:#d7e2ec;stroke-width:1.5}
.title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:31px;fill:#1e293b}
.subtitle,.detail,.tiny{font-family:"Comic Mono","Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;fill:#536476}
.subtitle{font-size:13px}.detail{font-size:12px}.tiny{font-size:10px;fill:#64748b}
.label{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:16px;fill:#1e293b}
.className{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:17px;fill:#1e293b}
.panelTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:12px;letter-spacing:.08em;fill:#94a3b8}
.card,.uml,.tableBox,.dbBody{stroke-width:1.7;filter:url(#shadow)}
.panel{fill:#f8fafc;stroke:#d7e2ec;stroke-width:1.2}
.arrow{fill:none;stroke:#2563eb;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowBlue)}
.context{fill:none;stroke:#7c3aed;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowPurple)}
.storage{fill:none;stroke:#ea580c;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowOrange)}
.mapLine{fill:none;stroke:#16a34a;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowGreen)}
.fk{fill:none;stroke:#0f766e;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowTeal)}
.returnLine{fill:none;stroke:#64748b;stroke-width:1.7;stroke-dasharray:7 5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowGray)}
.lifeline{stroke:#cbd5e1;stroke-width:1.4;stroke-dasharray:5 6}
</style>
</defs>
<rect width="1500" height="940" class="canvas"/>
<rect x="20" y="20" width="1460" height="900" rx="16" class="frame"/>
<text x="48" y="58" class="title">Common Multi-Tenant Request Flow</text>
<text x="48" y="80" class="subtitle">Calls are solid, returns are dashed, and tenant context is bound before repository and Exposed database access</text>
<rect x="48" y="130" width="124" height="58" rx="10" fill="#dbeafe" stroke="#3b82f6" class="card"/>
<text x="110" y="166" class="label" text-anchor="middle">Client</text>
<rect x="238" y="130" width="124" height="58" rx="10" fill="#dbeafe" stroke="#3b82f6" class="card"/>
<text x="300" y="166" class="label" text-anchor="middle">Tenant Edge</text>
<rect x="438" y="130" width="124" height="58" rx="10" fill="#dbeafe" stroke="#3b82f6" class="card"/>
<text x="500" y="166" class="label" text-anchor="middle">Context</text>
<rect x="638" y="130" width="124" height="58" rx="10" fill="#dbeafe" stroke="#3b82f6" class="card"/>
<text x="700" y="166" class="label" text-anchor="middle">Controller</text>
<rect x="838" y="130" width="124" height="58" rx="10" fill="#dbeafe" stroke="#3b82f6" class="card"/>
<text x="900" y="166" class="label" text-anchor="middle">Service</text>
<rect x="1038" y="130" width="124" height="58" rx="10" fill="#dbeafe" stroke="#3b82f6" class="card"/>
<text x="1100" y="166" class="label" text-anchor="middle">Transaction</text>
<rect x="1218" y="130" width="124" height="58" rx="10" fill="#dbeafe" stroke="#3b82f6" class="card"/>
<text x="1280" y="166" class="label" text-anchor="middle">Repository</text>
<rect x="1348" y="130" width="124" height="58" rx="10" fill="#dbeafe" stroke="#3b82f6" class="card"/>
<text x="1410" y="166" class="label" text-anchor="middle">Database</text>
<line x1="110" y1="190" x2="110" y2="805" class="lifeline"/>
<line x1="300" y1="190" x2="300" y2="805" class="lifeline"/>
<line x1="500" y1="190" x2="500" y2="805" class="lifeline"/>
<line x1="700" y1="190" x2="700" y2="805" class="lifeline"/>
<line x1="900" y1="190" x2="900" y2="805" class="lifeline"/>
<line x1="1100" y1="190" x2="1100" y2="805" class="lifeline"/>
<line x1="1280" y1="190" x2="1280" y2="805" class="lifeline"/>
<line x1="1410" y1="190" x2="1410" y2="805" class="lifeline"/>
<rect x="70" y="220" width="430" height="58" rx="12" fill="#dbeafe" stroke="#3b82f6" opacity="0.58"/>
<circle cx="98" cy="249" r="16" fill="#fff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="98" y="254" class="label" text-anchor="middle">1</text>
<text x="126" y="236" class="label">Resolve tenant</text>
<text x="126" y="255" class="detail">Filter/Auth reads tenant identity</text>
<path d="M110,260 L300,260" class="arrow"/>
<rect x="250" y="300" width="500" height="58" rx="12" fill="#ede9fe" stroke="#7c3aed" opacity="0.58"/>
<circle cx="278" cy="329" r="16" fill="#fff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="278" y="334" class="label" text-anchor="middle">2</text>
<text x="306" y="332" class="label">Bind context carrier</text>
<text x="306" y="351" class="detail">ThreadLocal, ScopedValue, Reactor Context, or ThreadContextElement</text>
<path d="M300,356 L500,356" class="context"/>
<rect x="450" y="380" width="535" height="58" rx="12" fill="#dcfce7" stroke="#16a34a" opacity="0.58"/>
<circle cx="478" cy="409" r="16" fill="#fff" stroke="#16a34a" stroke-width="1.5"/>
<text x="478" y="414" class="label" text-anchor="middle">3</text>
<text x="506" y="405" class="label">Execute application path</text>
<text x="506" y="424" class="detail">Controller/route delegates to service</text>
<path d="M500,452 L700,452" class="arrow"/>
<path d="M700,452 L900,452" class="arrow"/>
<rect x="850" y="460" width="380" height="58" rx="12" fill="#ffedd5" stroke="#ea580c" opacity="0.58"/>
<circle cx="878" cy="489" r="16" fill="#fff" stroke="#ea580c" stroke-width="1.5"/>
<text x="878" y="494" class="label" text-anchor="middle">4</text>
<text x="906" y="485" class="label">Apply storage boundary</text>
<text x="906" y="504" class="detail">Schema switch or tenant Database selection</text>
<path d="M900,512 L1100,512" class="arrow"/>
<rect x="1050" y="540" width="390" height="58" rx="12" fill="#ccfbf1" stroke="#0f766e" opacity="0.58"/>
<circle cx="1078" cy="569" r="16" fill="#fff" stroke="#0f766e" stroke-width="1.5"/>
<text x="1078" y="574" class="label" text-anchor="middle">5</text>
<text x="1106" y="565" class="label">Read/write through Exposed</text>
<text x="1106" y="584" class="detail">Repository uses tenant-scoped tables</text>
<path d="M1100,630 L1280,630" class="mapLine"/>
<path d="M1280,630 L1410,630" class="storage"/>
<rect x="1040" y="660" width="390" height="58" rx="12" fill="#fef3c7" stroke="#d97706" opacity="0.58"/>
<circle cx="1068" cy="689" r="16" fill="#fff" stroke="#d97706" stroke-width="1.5"/>
<text x="1068" y="694" class="label" text-anchor="middle">6</text>
<text x="1096" y="685" class="label">Reset or return</text>
<text x="1096" y="704" class="detail">Reset PUBLIC, then dashed returns</text>
<path d="M1100,738 L1150,738 L1150,772 L1100,772" class="context"/>
<path d="M1410,800 L1280,800" class="returnLine"/>
<path d="M1280,820 L1090,820 L1090,820 L900,820" class="returnLine"/>
<path d="M700,852 L430,852 L430,870 L110,870" class="returnLine"/>
<rect x="88" y="890" width="1290" height="44" rx="10" fill="#f8fafc" stroke="#d7e2ec" stroke-width="1.2"/>
<text x="106" y="917" class="detail">Source check: returns are dashed; schema reset is only shown where TenantTransaction owns reset/eviction, while database-per-tenant routing returns through the selected tenant Database.</text>
</svg>
