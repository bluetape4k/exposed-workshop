<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Ktor coroutine cache architecture">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
    <marker id="flowHead" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2,2 L12,7 L2,12 Z" fill="#64748b" stroke="#64748b" stroke-width="1"/>
    </marker>
    <style>
      .canvas{fill:#f6f9fc}
      .frame{fill:#fff;stroke:#d7e2ec;stroke-width:1.5}
      .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:34px;fill:#1e293b}
      .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;fill:#536476}
      .columnTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:12px;letter-spacing:.08em;fill:#94a3b8}
      .card{stroke-width:1.7;filter:url(#shadow)}
      .label{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:18px;fill:#1e293b}
      .detail{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;fill:#536476}
      .tiny{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:10.5px;fill:#64748b}
      .arrow{fill:none;stroke:#64748b;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#flowHead)}
      .dash{fill:none;stroke:#94a3b8;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:7 5;marker-end:url(#flowHead)}
    </style>
  </defs>

  <rect width="1600" height="900" class="canvas"/>
  <rect x="28" y="24" width="1544" height="852" rx="16" class="frame"/>

  <text x="64" y="70" class="title">Ktor coroutine cache architecture</text>
  <text x="64" y="96" class="subtitle">Suspend-first routes use per-key Mutex coalescing and Exposed suspended transactions on Dispatchers.IO</text>

  <text x="192" y="146" class="columnTitle" text-anchor="middle">KTOR MODULE</text>
  <text x="496" y="146" class="columnTitle" text-anchor="middle">SUSPEND ROUTES</text>
  <text x="800" y="146" class="columnTitle" text-anchor="middle">COROUTINE CACHE POLICY</text>
  <text x="1104" y="146" class="columnTitle" text-anchor="middle">SUSPENDED REPOSITORY</text>
  <text x="1408" y="146" class="columnTitle" text-anchor="middle">PERSISTENCE / RESPONSE</text>

  <g id="bootstrap-row">
    <rect x="72" y="182" width="240" height="96" rx="10" fill="#e2e8f0" stroke="#64748b" class="card"/>
    <text x="192" y="216" class="label" text-anchor="middle">Coroutine module</text>
    <text x="192" y="241" class="detail" text-anchor="middle">ktorCoroutineCacheModule</text>
    <text x="192" y="259" class="tiny" text-anchor="middle">CIO server on port 8080</text>

    <rect x="376" y="182" width="240" height="96" rx="10" fill="#ede9fe" stroke="#7c3aed" class="card"/>
    <text x="496" y="216" class="label" text-anchor="middle">Coroutine plugins</text>
    <text x="496" y="241" class="detail" text-anchor="middle">ContentNegotiation</text>
    <text x="496" y="259" class="tiny" text-anchor="middle">StatusPages rethrows cancellation</text>

    <rect x="680" y="182" width="240" height="96" rx="10" fill="#ccfbf1" stroke="#0f766e" class="card"/>
    <text x="800" y="216" class="label" text-anchor="middle">Database connect</text>
    <text x="800" y="241" class="detail" text-anchor="middle">HikariDataSource + Database</text>
    <text x="800" y="259" class="tiny" text-anchor="middle">H2 mem coroutine fixture</text>

    <rect x="984" y="182" width="240" height="96" rx="10" fill="#fef3c7" stroke="#d97706" class="card"/>
    <text x="1104" y="216" class="label" text-anchor="middle">ProductPersistence</text>
    <text x="1104" y="241" class="detail" text-anchor="middle">SchemaUtils.create(Products)</text>
    <text x="1104" y="259" class="tiny" text-anchor="middle">seed coroutine examples</text>

    <rect x="1288" y="182" width="240" height="96" rx="10" fill="#dbeafe" stroke="#3b82f6" class="card"/>
    <text x="1408" y="216" class="label" text-anchor="middle">Products table</text>
    <text x="1408" y="241" class="detail" text-anchor="middle">sku, name, version</text>

    <path data-connector="coroutine-module-to-plugins" d="M312,230 H376" class="arrow"/>
    <path data-connector="plugins-to-coroutine-database" d="M616,230 H680" class="arrow"/>
    <path data-connector="database-to-product-persistence" d="M920,230 H984" class="arrow"/>
    <path data-connector="product-persistence-to-products-table" d="M1224,230 H1288" class="arrow"/>
  </g>

  <g id="read-row">
    <rect x="72" y="376" width="240" height="106" rx="10" fill="#f8fafc" stroke="#94a3b8" class="card"/>
    <text x="192" y="411" class="label" text-anchor="middle">HTTP GET</text>
    <text x="192" y="436" class="detail" text-anchor="middle">/products/{sku}/read-through</text>
    <text x="192" y="455" class="tiny" text-anchor="middle">suspending handler</text>

    <rect x="376" y="376" width="240" height="106" rx="10" fill="#ede9fe" stroke="#7c3aed" class="card"/>
    <text x="496" y="411" class="label" text-anchor="middle">coroutineCacheRoutes</text>
    <text x="496" y="436" class="detail" text-anchor="middle">requiredSku() validates path</text>
    <text x="496" y="455" class="tiny" text-anchor="middle">calls service without runBlocking</text>

    <rect x="680" y="376" width="240" height="106" rx="10" fill="#ccfbf1" stroke="#0f766e" class="card"/>
    <text x="800" y="411" class="label" text-anchor="middle">Coroutine service</text>
    <text x="800" y="436" class="detail" text-anchor="middle">readThrough(sku)</text>
    <text x="800" y="455" class="tiny" text-anchor="middle">cache hit fast path before lock</text>

    <rect x="984" y="376" width="240" height="106" rx="10" fill="#fef3c7" stroke="#d97706" class="card"/>
    <text x="1104" y="411" class="label" text-anchor="middle">Per-SKU Mutex</text>
    <text x="1104" y="436" class="detail" text-anchor="middle">coalesces concurrent misses</text>
    <text x="1104" y="455" class="tiny" text-anchor="middle">tracks inFlightLoads</text>

    <rect x="1288" y="376" width="240" height="106" rx="10" fill="#dbeafe" stroke="#3b82f6" class="card"/>
    <text x="1408" y="411" class="label" text-anchor="middle">Suspended read</text>
    <text x="1408" y="436" class="detail" text-anchor="middle">repository.find(sku)</text>
    <text x="1408" y="455" class="tiny" text-anchor="middle">newSuspendedTransaction(IO)</text>

    <path data-connector="http-get-products-to-coroutine-routes" d="M312,429 H376" class="arrow"/>
    <path data-connector="coroutine-routes-to-read-service" d="M616,429 H680" class="arrow"/>
    <path data-connector="read-service-to-mutex" d="M920,429 H984" class="arrow"/>
    <path data-connector="mutex-to-suspended-read" d="M1224,429 H1288" class="dash"/>
  </g>

  <g id="write-row">
    <rect x="72" y="570" width="240" height="116" rx="10" fill="#f8fafc" stroke="#94a3b8" class="card"/>
    <text x="192" y="605" class="label" text-anchor="middle">HTTP mutate/stats</text>
    <text x="192" y="630" class="detail" text-anchor="middle">PUT write-through</text>
    <text x="192" y="649" class="detail" text-anchor="middle">DELETE cache / GET stats</text>

    <rect x="376" y="570" width="240" height="116" rx="10" fill="#ede9fe" stroke="#7c3aed" class="card"/>
    <text x="496" y="605" class="label" text-anchor="middle">Route handlers</text>
    <text x="496" y="630" class="detail" text-anchor="middle">receive UpdateProductRequest</text>
    <text x="496" y="649" class="tiny" text-anchor="middle">return NoContent or stats</text>

    <rect x="680" y="570" width="240" height="116" rx="10" fill="#ccfbf1" stroke="#0f766e" class="card"/>
    <text x="800" y="605" class="label" text-anchor="middle">Service operations</text>
    <text x="800" y="630" class="detail" text-anchor="middle">writeThrough / invalidate</text>
    <text x="800" y="649" class="tiny" text-anchor="middle">cache size, hits, misses, in-flight</text>

    <rect x="984" y="570" width="240" height="116" rx="10" fill="#fef3c7" stroke="#d97706" class="card"/>
    <text x="1104" y="605" class="label" text-anchor="middle">Suspended upsert</text>
    <text x="1104" y="630" class="detail" text-anchor="middle">repository.update(sku)</text>
    <text x="1104" y="649" class="tiny" text-anchor="middle">Products.upsert + version bump</text>

    <rect x="1288" y="570" width="240" height="116" rx="10" fill="#dbeafe" stroke="#3b82f6" class="card"/>
    <text x="1408" y="605" class="label" text-anchor="middle">Response models</text>
    <text x="1408" y="630" class="detail" text-anchor="middle">ProductResponse / Stats</text>
    <text x="1408" y="649" class="tiny" text-anchor="middle">source shows cache or database path</text>

    <path data-connector="http-mutate-products-to-coroutine-routes" d="M312,628 H376" class="arrow"/>
    <path data-connector="coroutine-routes-to-write-service" d="M616,628 H680" class="arrow"/>
    <path data-connector="write-service-to-suspended-upsert" d="M920,628 H984" class="arrow"/>
    <path data-connector="suspended-upsert-to-response-models" d="M1224,628 H1288" class="arrow"/>
  </g>

  <rect x="72" y="750" width="1456" height="62" rx="10" fill="#f8fafc" stroke="#d7e2ec" stroke-width="1.3"/>
  <text x="800" y="776" class="label" text-anchor="middle">Coroutine safety is visible at the policy boundary: cache lookup stays nonblocking and misses are coalesced per SKU.</text>
  <text x="800" y="797" class="detail" text-anchor="middle">Database work is isolated in suspended Exposed transactions on Dispatchers.IO; cancellation is not swallowed by error handling.</text>
</svg>
