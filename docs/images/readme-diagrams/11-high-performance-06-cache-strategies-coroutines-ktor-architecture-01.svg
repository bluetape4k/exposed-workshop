<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">Ktor coroutine cache architecture</title>
  <desc id="desc">Suspending Ktor routes call a coroutine cache service with per-key mutex coalescing and Exposed suspended transactions on Dispatchers.IO.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .box { fill: #ffffff; stroke: #334155; stroke-width: 2; rx: 8; }
      .cache { fill: #e0f2fe; stroke: #0369a1; }
      .db { fill: #ecfdf5; stroke: #047857; }
      .text { font: 18px sans-serif; fill: #0f172a; }
      .small { font: 14px sans-serif; fill: #334155; }
      .arrow { stroke: #475569; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
  </defs>
  <rect class="bg" width="1120" height="560"/>
  <text x="56" y="56" class="text" style="font-size:28px;font-weight:700">Coroutine-safe Ktor cache flow</text>
  <text x="56" y="86" class="small">Suspending routes never block the event loop; database work runs through suspended Exposed transactions on Dispatchers.IO.</text>

  <rect x="60" y="142" width="210" height="112" class="box"/>
  <text x="98" y="184" class="text">Ktor suspend route</text>
  <text x="92" y="214" class="small">read-through / write-through</text>

  <rect x="340" y="122" width="250" height="152" class="box cache"/>
  <text x="374" y="172" class="text">Coroutine cache service</text>
  <text x="382" y="202" class="small">ConcurrentHashMap cache</text>
  <text x="382" y="226" class="small">per-key Mutex coalescing</text>

  <rect x="660" y="122" width="210" height="152" class="box cache"/>
  <text x="694" y="172" class="text">In-flight load</text>
  <text x="706" y="202" class="small">one DB call per SKU</text>
  <text x="706" y="226" class="small">other callers await</text>

  <rect x="480" y="360" width="240" height="112" class="box db"/>
  <text x="522" y="404" class="text">Suspending repository</text>
  <text x="524" y="432" class="small">newSuspendedTransaction</text>

  <rect x="800" y="360" width="190" height="112" class="box db"/>
  <text x="850" y="404" class="text">H2 database</text>
  <text x="848" y="432" class="small">products table</text>

  <path d="M270 198 L340 198" class="arrow"/>
  <path d="M590 198 L660 198" class="arrow"/>
  <path d="M760 274 C750 326 700 350 660 360" class="arrow"/>
  <path d="M720 416 L800 416" class="arrow"/>
  <path d="M480 416 C390 370 390 276 452 274" class="arrow"/>

  <text x="82" y="506" class="small">CancellationException is rethrown by StatusPages; no runBlocking is used in production request paths.</text>
</svg>
