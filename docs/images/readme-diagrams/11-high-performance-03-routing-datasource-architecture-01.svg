<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Routing datasource key resolution flow">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.13"/>
    </filter>
    <marker id="flowArrow" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#5f7f89" stroke="#5f7f89" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="softArrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#8fa1aa" stroke="#8fa1aa" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <style>
      text { letter-spacing: 0; }
      .canvas { fill: #fbfcf8; stroke: #3f515a; stroke-width: 3; }
      .title { font-family: "Architects Daughter"; font-size: 36px; fill: #23323a; }
      .subtitle,.lane,.detail,.note,.key { font-family: "Comic Mono"; fill: #516670; }
      .subtitle { font-size: 15px; }
      .lane { font-size: 12px; font-weight: 700; fill: #687b83; }
      .card { fill: #ffffff; stroke-width: 2.1; filter: url(#shadow); }
      .entry { stroke: #5d948b; }
      .service { stroke: #ac7a34; }
      .route { stroke: #7b6bb4; }
      .store { stroke: #8fa1aa; }
      .label { font-family: "Architects Daughter"; font-size: 20px; fill: #20323b; }
      .detail { font-size: 12px; }
      .note { font-size: 13px; }
      .key { font-size: 13px; font-weight: 700; fill: #6d5fa8; }
      .flow { fill: none; stroke: #5f7f89; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#flowArrow); }
      .soft { fill: none; stroke: #8fa1aa; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 8 7; marker-end: url(#softArrow); }
      .band { fill: #f7faf6; stroke: #d9e2dc; stroke-width: 1.5; }
    </style>
  </defs>

  <rect x="24" y="24" width="1552" height="852" rx="20" class="canvas frame"/>
  <text x="800" y="76" text-anchor="middle" class="title">RoutingDataSource Key Resolution Flow</text>
  <text x="800" y="106" text-anchor="middle" class="subtitle">TenantContext and transaction readOnly state form a routing key, then DynamicRoutingDataSource delegates to a registered DataSource.</text>

  <text x="90" y="164" class="lane">HTTP CONTEXT</text>
  <text x="430" y="164" class="lane">ROUTING KEY</text>
  <text x="820" y="164" class="lane">DATASOURCE ROUTER</text>
  <text x="1190" y="164" class="lane">DATABASE ACCESS</text>

  <rect x="70" y="196" width="250" height="82" rx="12" class="card entry"/>
  <text x="195" y="230" text-anchor="middle" class="label">X-Tenant-Id header</text>
  <text x="195" y="252" text-anchor="middle" class="detail">acme, default, or blank</text>

  <rect x="70" y="334" width="250" height="82" rx="12" class="card entry"/>
  <text x="195" y="368" text-anchor="middle" class="label">TenantHeaderFilter</text>
  <text x="195" y="390" text-anchor="middle" class="detail">binds TenantContext ThreadLocal</text>

  <rect x="70" y="472" width="250" height="82" rx="12" class="card service"/>
  <text x="195" y="506" text-anchor="middle" class="label">RoutingMarkerController</text>
  <text x="195" y="528" text-anchor="middle" class="detail">read-only query or write update</text>

  <rect x="430" y="266" width="286" height="104" rx="12" class="card route"/>
  <text x="573" y="302" text-anchor="middle" class="label">ContextAware</text>
  <text x="573" y="326" text-anchor="middle" class="label">RoutingKeyResolver</text>
  <text x="573" y="350" text-anchor="middle" class="detail">tenant + Transaction readOnly</text>

  <rect x="430" y="486" width="286" height="82" rx="12" class="card route"/>
  <text x="573" y="520" text-anchor="middle" class="label">Resolved key</text>
  <text x="573" y="542" text-anchor="middle" class="key">tenant:rw or tenant:ro</text>

  <rect x="818" y="196" width="286" height="82" rx="12" class="card route"/>
  <text x="961" y="230" text-anchor="middle" class="label">DataSourceRegistry</text>
  <text x="961" y="252" text-anchor="middle" class="detail">registered Hikari pools by key</text>

  <rect x="818" y="374" width="286" height="104" rx="12" class="card route"/>
  <text x="961" y="410" text-anchor="middle" class="label">DynamicRouting</text>
  <text x="961" y="434" text-anchor="middle" class="label">DataSource</text>
  <text x="961" y="458" text-anchor="middle" class="detail">delegates getConnection()</text>

  <rect x="1190" y="196" width="270" height="82" rx="12" class="card store"/>
  <text x="1325" y="230" text-anchor="middle" class="label">tenant rw pool</text>
  <text x="1325" y="252" text-anchor="middle" class="detail">default:rw / acme:rw</text>

  <rect x="1190" y="334" width="270" height="82" rx="12" class="card store"/>
  <text x="1325" y="368" text-anchor="middle" class="label">tenant ro pool</text>
  <text x="1325" y="390" text-anchor="middle" class="detail">default:ro / acme:ro</text>

  <rect x="1190" y="520" width="270" height="82" rx="12" class="card store"/>
  <text x="1325" y="554" text-anchor="middle" class="label">MarkerTable</text>
  <text x="1325" y="576" text-anchor="middle" class="detail">routing marker row per database</text>

  <path id="f1" data-connector="f1" class="flow" d="M 195 278 L 195 334"/>
  <path id="f2" data-connector="f2" class="flow" d="M 320 375 L 378 375 Q 398 375 398 355 L 398 318 Q 398 298 418 298 L 430 298"/>
  <path id="f3" data-connector="f3" class="flow" d="M 320 513 L 430 513"/>
  <path id="f4" data-connector="f4" class="flow" d="M 573 370 L 573 486"/>
  <path id="f5" data-connector="f5" class="flow" d="M 716 527 L 778 527 Q 798 527 798 507 L 798 446 Q 798 426 810 426 L 818 426"/>
  <path id="f6" data-connector="f6" class="flow" d="M 1104 426 L 1160 426 Q 1180 426 1180 406 L 1180 257 Q 1180 237 1188 237 L 1190 237"/>
  <path id="f7" data-connector="f7" class="flow" d="M 1104 426 L 1160 426 Q 1180 426 1180 415 Q 1180 395 1188 395 L 1190 395"/>
  <path id="f8" data-connector="f8" class="flow" d="M 1325 416 L 1325 520"/>

  <path id="s1" data-connector="s1" class="soft" d="M 961 278 L 961 374"/>
  <path id="s2" data-connector="s2" class="soft" d="M 195 472 L 195 444 Q 195 424 215 424 L 430 424 Q 450 424 450 404 L 450 370"/>
  <rect x="390" y="706" width="820" height="72" rx="14" class="band"/>
  <text x="800" y="736" text-anchor="middle" class="note">Missing ro configuration reuses rw; an unregistered resolved key fails fast instead of silently choosing the wrong tenant.</text>
  <text x="800" y="760" text-anchor="middle" class="detail">TenantHeaderFilter clears TenantContext after the request so the next request cannot inherit a stale tenant.</text>
</svg>
