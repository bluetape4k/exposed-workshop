<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="820" viewBox="0 0 1720 820" role="img" aria-labelledby="title desc">
  <title id="title">DDD aggregate lifecycle with Exposed repository</title>
  <desc id="desc">A command creates a PurchaseOrder aggregate, the aggregate records domain events, the repository persists order state and event rows in one Exposed transaction, and rollback tests prove both rows stay uncommitted on failure.</desc>
  <defs>
    <style>
      text { letter-spacing: 0; }
      .title { font-family: "Architects Daughter"; font-size: 42px; fill: #23323a; }
      .subtitle, .laneNote, .cardText, .label, .footer { font-family: "Comic Mono"; fill: #324750; }
      .subtitle { font-size: 18px; }
      .laneTitle { font-family: "Architects Daughter"; font-size: 26px; fill: #23323a; }
      .laneNote { font-size: 14px; fill: #5b6d75; }
      .cardTitle { font-family: "Architects Daughter"; font-size: 22px; fill: #20323b; }
      .cardText { font-size: 14px; }
      .label { font-size: 13px; font-weight: 700; fill: #34434a; }
      .footer { font-size: 14px; fill: #60717a; }
      .canvas { fill: #fbfcf8; stroke: #3f515a; stroke-width: 3; }
      .laneDomain { fill: #eef7f5; stroke: #6fa098; stroke-width: 2.2; }
      .lanePersistence { fill: #fff7e8; stroke: #b98e50; stroke-width: 2.2; }
      .laneRollback { fill: #f2f0fb; stroke: #897bc2; stroke-width: 2.2; }
      .card { stroke-width: 2.3; }
      .domainCard { fill: #ffffff; stroke: #5d948b; }
      .persistCard { fill: #ffffff; stroke: #ac7a34; }
      .rollbackCard { fill: #ffffff; stroke: #7b6bb4; }
      .flowDomain { fill: none; stroke: #3f8e84; stroke-width: 4.2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowDomain); }
      .flowPersist { fill: none; stroke: #a2743d; stroke-width: 4.2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowPersist); }
      .flowRollback { fill: none; stroke: #7667b1; stroke-width: 4.2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowRollback); }
    </style>
    <marker id="arrowDomain" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#3f8e84"/></marker>
    <marker id="arrowPersist" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#a2743d"/></marker>
    <marker id="arrowRollback" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7667b1"/></marker>
  </defs>

  <rect x="24" y="24" width="1672" height="772" rx="20" class="canvas"/>
  <text x="860" y="78" text-anchor="middle" class="title">DDD Aggregate Lifecycle with Exposed Repository</text>
  <text x="860" y="110" text-anchor="middle" class="subtitle">Business invariants stay in the aggregate; Exposed owns only the repository mapping and transaction boundary.</text>

  <rect x="70" y="150" width="730" height="270" rx="18" class="laneDomain"/>
  <text x="106" y="192" class="laneTitle">Domain model</text>
  <text x="106" y="218" class="laneNote">Value objects and command methods reject invalid state before SQL is involved.</text>

  <rect x="832" y="150" width="818" height="270" rx="18" class="lanePersistence"/>
  <text x="868" y="192" class="laneTitle">Exposed repository boundary</text>
  <text x="868" y="218" class="laneNote">Aggregate state, owned lines, and domain events commit in one local H2 transaction.</text>

  <rect x="700" y="466" width="950" height="188" rx="18" class="laneRollback"/>
  <text x="736" y="508" class="laneTitle">Rollback proof</text>
  <text x="736" y="534" class="laneNote">A deterministic failure after event insertion leaves both state and event rows uncommitted.</text>

  <rect id="command" x="100" y="270" width="240" height="110" rx="12" class="card domainCard"/>
  <text x="220" y="306" text-anchor="middle" class="cardTitle">PlaceOrderCommand</text>
  <text x="130" y="334" class="cardText">OrderNumber, CustomerId</text>
  <text x="130" y="356" class="cardText">non-empty line items</text>

  <rect id="aggregate" x="410" y="270" width="260" height="110" rx="12" class="card domainCard"/>
  <text x="540" y="306" text-anchor="middle" class="cardTitle">PurchaseOrder</text>
  <text x="438" y="334" class="cardText">approve() invariant</text>
  <text x="438" y="356" class="cardText">pending domain events</text>

  <rect id="repository" x="740" y="270" width="260" height="110" rx="12" class="card persistCard"/>
  <text x="870" y="306" text-anchor="middle" class="cardTitle">OrderRepository</text>
  <text x="768" y="334" class="cardText">transaction(db)</text>
  <text x="768" y="356" class="cardText">map aggregate to rows</text>

  <rect id="stateTables" x="1070" y="270" width="260" height="110" rx="12" class="card persistCard"/>
  <text x="1200" y="306" text-anchor="middle" class="cardTitle">Order state tables</text>
  <text x="1098" y="334" class="cardText">ddd_orders</text>
  <text x="1098" y="356" class="cardText">ddd_order_lines</text>

  <rect id="eventTable" x="1400" y="270" width="240" height="110" rx="12" class="card persistCard"/>
  <text x="1520" y="306" text-anchor="middle" class="cardTitle">Event log table</text>
  <text x="1428" y="334" class="cardText">ddd_order_events</text>
  <text x="1428" y="356" class="cardText">event order 1, 2, ...</text>

  <rect id="failureHook" x="740" y="560" width="260" height="78" rx="12" class="card rollbackCard"/>
  <text x="870" y="592" text-anchor="middle" class="cardTitle">Failure hook</text>
  <text x="768" y="620" class="cardText">throws after event insert</text>

  <rect id="rollbackCheck" x="1070" y="560" width="260" height="78" rx="12" class="card rollbackCard"/>
  <text x="1200" y="592" text-anchor="middle" class="cardTitle">Rollback check</text>
  <text x="1098" y="620" class="cardText">transaction aborts</text>

  <rect id="zeroRows" x="1400" y="560" width="240" height="78" rx="12" class="card rollbackCard"/>
  <text x="1520" y="592" text-anchor="middle" class="cardTitle">Zero rows</text>
  <text x="1428" y="620" class="cardText">orders=0, events=0</text>

  <path id="flow-command-aggregate" data-connector="flow-command-aggregate" d="M 340 325 L 410 325" class="flowDomain"/>
  <path id="flow-aggregate-repository" data-connector="flow-aggregate-repository" d="M 670 325 L 740 325" class="flowDomain"/>
  <path id="flow-repository-state" data-connector="flow-repository-state" d="M 1000 325 L 1070 325" class="flowPersist"/>
  <path id="flow-state-events" data-connector="flow-state-events" d="M 1330 325 L 1400 325" class="flowPersist"/>
  <path id="flow-repository-failure" data-connector="flow-repository-failure" d="M 870 380 L 870 560" class="flowRollback"/>
  <path id="flow-failure-rollback" data-connector="flow-failure-rollback" d="M 1000 599 L 1070 599" class="flowRollback"/>
  <path id="flow-rollback-zero" data-connector="flow-rollback-zero" d="M 1330 599 L 1400 599" class="flowRollback"/>

  <text x="375" y="309" text-anchor="middle" class="label">create</text>
  <text x="705" y="309" text-anchor="middle" class="label">save</text>
  <text x="1035" y="309" text-anchor="middle" class="label">state rows</text>
  <text x="1365" y="309" text-anchor="middle" class="label">events</text>
  <text x="900" y="470" class="label">simulate failure</text>
  <text x="1035" y="584" text-anchor="middle" class="label">abort</text>
  <text x="1365" y="584" text-anchor="middle" class="label">assert</text>

  <text x="860" y="738" text-anchor="middle" class="footer">Default path is fully local: Kotlin aggregate, Exposed JDBC, and in-memory H2.</text>
</svg>
