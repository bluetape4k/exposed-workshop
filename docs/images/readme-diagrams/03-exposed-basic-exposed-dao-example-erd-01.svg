<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 760" width="1120" height="760" role="img" aria-label="Exposed DAO User Cities ERD">
<defs>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/></filter>
<marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path stroke-dasharray="none" style="stroke-dasharray:none!important" d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b" stroke="#64748b" stroke-width="0"/></marker>
<marker id="arrowBlue" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path stroke-dasharray="none" style="stroke-dasharray:none!important" d="M 0 0 L 10 5 L 0 10 Z" fill="#2563eb" stroke="#2563eb" stroke-width="0"/></marker>
<marker id="arrowGreen" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path stroke-dasharray="none" style="stroke-dasharray:none!important" d="M 0 0 L 10 5 L 0 10 Z" fill="#16a34a" stroke="#16a34a" stroke-width="0"/></marker>
<marker id="arrowOrange" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path stroke-dasharray="none" style="stroke-dasharray:none!important" d="M 0 0 L 10 5 L 0 10 Z" fill="#ea580c" stroke="#ea580c" stroke-width="0"/></marker>
<marker id="arrowPurple" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path stroke-dasharray="none" style="stroke-dasharray:none!important" d="M 0 0 L 10 5 L 0 10 Z" fill="#7c3aed" stroke="#7c3aed" stroke-width="0"/></marker>
<marker id="arrowTeal" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path stroke-dasharray="none" style="stroke-dasharray:none!important" d="M 0 0 L 10 5 L 0 10 Z" fill="#0f766e" stroke="#0f766e" stroke-width="0"/></marker>
<style>
.canvas{fill:#f6f9fc}.frame{fill:#fff;stroke:#d7e2ec;stroke-width:1.5}
.title{font-family:"Architects Daughter";font-size:31px;fill:#1e293b}
.subtitle,.detail{font-family:"Comic Mono";fill:#536476}
.subtitle{font-size:13px}.detail{font-size:12px}.tiny{font-family:"Comic Mono";font-size:10px;fill:#64748b}
.label{font-family:"Architects Daughter";font-size:17px;fill:#1e293b}
.panelTitle{font-family:"Architects Daughter";font-size:12px;letter-spacing:.08em;fill:#94a3b8}
.card{stroke-width:1.7;filter:url(#shadow)}.panel{fill:#f8fafc;stroke:#d7e2ec;stroke-width:1.2}
.arrow{fill:none;stroke:#64748b;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
.queryUse{fill:none;stroke:#2563eb;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowBlue)}
.mapUse{fill:none;stroke:#16a34a;stroke-width:1.8;stroke-dasharray:5 5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowGreen)}
.runtimeUse{fill:none;stroke:#7c3aed;stroke-width:1.8;stroke-dasharray:5 5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowPurple)}
.dbUse{fill:none;stroke:#ea580c;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowOrange)}
.fkArrow{fill:none;stroke:#0f766e;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowTeal)}
.assoc{fill:none;stroke:#0f766e;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.inherit{fill:none;stroke:#475569;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.inheritHead{fill:#fff;stroke:#475569;stroke-width:1.8;stroke-linejoin:round}
</style>
</defs>
<rect width="1120" height="760" class="canvas"/>
<rect x="20" y="20" width="1080" height="720" rx="16" class="frame"/>
<text x="48" y="58" class="title">Exposed DAO User Cities ERD</text>
<text x="48" y="80" class="subtitle">users.city_id is a nullable FK to cities.id; sample data includes users without a city</text>
<rect x="76" y="166" width="420" height="264" rx="12" class="panel"/><text x="286" y="158" class="panelTitle" text-anchor="middle">PARENT TABLE</text>
<rect x="124" y="210" width="322" height="132" rx="12" fill="#fff" stroke="#3b82f6" class="card"/>
<path d="M124,252 L124,222 Q124,210 136,210 L434,210 Q446,210 446,222 L446,252 Z" fill="#dbeafe"/>
<text x="285" y="238" class="label" text-anchor="middle">cities</text>
<text x="142" y="280" class="tiny">id SERIAL PK</text>
<text x="142" y="297" class="tiny">name VARCHAR(50) NOT NULL</text>
<rect x="622" y="166" width="420" height="296" rx="12" class="panel"/><text x="832" y="158" class="panelTitle" text-anchor="middle">CHILD TABLE</text>
<rect x="670" y="210" width="322" height="166" rx="12" fill="#fff" stroke="#16a34a" class="card"/>
<path d="M670,252 L670,222 Q670,210 682,210 L980,210 Q992,210 992,222 L992,252 Z" fill="#dcfce7"/>
<text x="831" y="238" class="label" text-anchor="middle">users</text>
<text x="688" y="280" class="tiny">id SERIAL PK</text>
<text x="688" y="297" class="tiny">name VARCHAR(50) NOT NULL</text>
<text x="688" y="314" class="tiny">age INT NOT NULL</text>
<text x="688" y="331" class="tiny">city_id INT NULL FK</text>
<path d="M670,296 L446,296" class="fkArrow edge"/>
<rect x="500" y="278" width="118" height="24" rx="8" fill="#fff" stroke="#99f6e4"/>
<text x="559" y="295" class="tiny" text-anchor="middle">users.city_id</text>
<text x="458" y="288" class="tiny">1</text>
<text x="652" y="288" class="tiny">0..N</text>
<rect x="116" y="520" width="396" height="118" rx="12" class="panel"/><text x="314" y="512" class="panelTitle" text-anchor="middle">SAMPLE SHAPE</text>
<rect x="144" y="552" width="152" height="52" rx="10" fill="#dbeafe" stroke="#3b82f6" class="card"/>
<text x="220" y="577" class="label" text-anchor="middle">3 cities</text>
<text x="220" y="590" class="detail" text-anchor="middle">Seoul Busan Daegu</text>
<rect x="326" y="552" width="152" height="52" rx="10" fill="#dcfce7" stroke="#16a34a" class="card"/>
<text x="402" y="577" class="label" text-anchor="middle">4 users</text>
<text x="402" y="590" class="detail" text-anchor="middle">alex has no city</text>
<rect x="136" y="672" width="850" height="48" rx="10" fill="#ecfdf5" stroke="#86efac" stroke-width="1.3"/>
<text x="561" y="702" class="detail" text-anchor="middle">DAO references stay nullable on both sides, so City ownership never hides users without a city.</text>
</svg>
