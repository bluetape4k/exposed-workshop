<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 680" width="1240" height="680" role="img" aria-label="Spring MVC Multi-Tenant Domain Model ERD">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
    <style>
      .canvas{fill:#f6f9fc}
      .frame{fill:#fff;stroke:#d7e2ec;stroke-width:1.5}
      .table{fill:#fff;stroke-width:1.8;filter:url(#shadow)}
      .card{fill:#fff;stroke-width:1.8;filter:url(#shadow)}
      .header{stroke-width:1.8}
      .title{font-family:"Architects Daughter";font-size:31px;fill:#1e293b}
      .subtitle,.detail,.footer{font-family:"Comic Mono";fill:#536476}
      .subtitle{font-size:13px}
      .footer{font-size:12px}
      .entity{font-family:"Architects Daughter";font-size:21px;fill:#1e293b}
      .field{font-family:"Comic Mono";font-size:13px;fill:#475569}
      .key{font-family:"Comic Mono";font-size:11px;font-weight:700;fill:#1f5f8f}
      .cardinality{font-family:"Comic Mono";font-size:17px;font-weight:700;fill:#0f766e}
      .relationship{fill:none;stroke:#0f766e;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>

  <rect width="1240" height="680" class="canvas"/>
  <rect x="20" y="20" width="1200" height="640" rx="18" class="frame"/>

  <text x="52" y="62" class="title">Spring MVC Multi-Tenant Domain Model ERD</text>
  <text x="52" y="88" class="subtitle">Each tenant schema contains the same movie, actor, and bridge-table shape; schema switching provides isolation.</text>

  <g data-card="MovieTable">
    <rect x="100" y="150" width="320" height="205" rx="8" stroke="#4f86c6" class="table card"/>
    <rect x="100" y="150" width="320" height="42" rx="8" fill="#dbeafe" stroke="#4f86c6" class="header"/>
    <text x="260" y="178" class="entity" text-anchor="middle">movies</text>
    <line x1="100" y1="192" x2="420" y2="192" stroke="#4f86c6" stroke-width="1.2"/>
    <text x="118" y="219" class="field">id: EntityID&lt;Long&gt;</text>
    <text x="292" y="219" class="key">PK</text>
    <text x="118" y="246" class="field">name: varchar(255)</text>
    <text x="118" y="273" class="field">producer_name: varchar(255)</text>
    <text x="118" y="300" class="field">release_date: date</text>
  </g>

  <g data-card="ActorTable">
    <rect x="820" y="150" width="320" height="205" rx="8" stroke="#db2777" class="table card"/>
    <rect x="820" y="150" width="320" height="42" rx="8" fill="#fce7f3" stroke="#db2777" class="header"/>
    <text x="980" y="178" class="entity" text-anchor="middle">actors</text>
    <line x1="820" y1="192" x2="1140" y2="192" stroke="#db2777" stroke-width="1.2"/>
    <text x="838" y="219" class="field">id: EntityID&lt;Long&gt;</text>
    <text x="1012" y="219" class="key">PK</text>
    <text x="838" y="246" class="field">first_name: varchar(255)</text>
    <text x="838" y="273" class="field">last_name: varchar(255)</text>
    <text x="838" y="300" class="field">birthday: date?</text>
  </g>

  <g data-card="ActorInMovieTable">
    <rect x="460" y="410" width="320" height="160" rx="8" stroke="#b8894a" class="table card"/>
    <rect x="460" y="410" width="320" height="42" rx="8" fill="#fef3c7" stroke="#b8894a" class="header"/>
    <text x="620" y="438" class="entity" text-anchor="middle">actors_in_movies</text>
    <line x1="460" y1="452" x2="780" y2="452" stroke="#b8894a" stroke-width="1.2"/>
    <text x="478" y="479" class="field">movie_id: EntityID&lt;Long&gt;</text>
    <text x="690" y="479" class="key">FK</text>
    <text x="478" y="506" class="field">actor_id: EntityID&lt;Long&gt;</text>
    <text x="690" y="506" class="key">FK</text>
    <text x="478" y="543" class="field">PrimaryKey(movie_id, actor_id)</text>
  </g>

  <path data-connector="movie-to-bridge" d="M260,355 V370 Q260,382 272,382 H596 Q608,382 608,394 V410" class="relationship connector"/>
  <text x="282" y="374" class="cardinality" text-anchor="middle">1</text>
  <text x="586" y="404" class="cardinality" text-anchor="middle">N</text>

  <path data-connector="actor-to-bridge" d="M980,355 V370 Q980,382 968,382 H724 Q712,382 712,394 V410" class="relationship connector"/>
  <text x="958" y="374" class="cardinality" text-anchor="middle">1</text>
  <text x="734" y="404" class="cardinality" text-anchor="middle">N</text>

  <text x="620" y="616" class="footer" text-anchor="middle">ActorInMovieTable owns the composite primary key and the two cascading foreign keys used by MovieEntity.actors and ActorEntity.movies.</text>
</svg>
