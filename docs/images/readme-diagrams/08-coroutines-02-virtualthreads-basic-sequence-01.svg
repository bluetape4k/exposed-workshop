<svg xmlns="http://www.w3.org/2000/svg" width="1580" height="1070" viewBox="0 0 1580 1070" role="img" aria-label="Virtual Thread Transaction Flow">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
    <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/>
  </filter>
  <marker id="openArrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
    <path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#758297" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>
  .canvas{fill:#f7f9fc}
  .frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
  .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:42px;font-weight:400;fill:#102033}
  .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
  .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:24px;font-weight:400;fill:#102033}
  .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:20px;font-weight:400;fill:#102033}
  .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
  .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
  .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
  .card{stroke-width:2;filter:url(#shadow)}
  .line{fill:none;stroke:#758297;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
  .dash{fill:none;stroke:#9aa6b8;stroke-width:1.6;stroke-linecap:round;stroke-dasharray:6 8}
  .note{fill:#ffffff;stroke:#d8e0ea;stroke-width:1.2}
</style>
</defs>

<rect class="canvas" x="0" y="0" width="1580" height="100%"/>
<rect class="frame" x="20" y="20" width="1540" height="1030" rx="18"/>
<text class="title" x="54" y="72">Virtual Thread Transaction Flow</text>
<text class="subtitle" x="56" y="100">Request and data flow</text>
<rect class="card" x="72" y="142" width="176" height="58" rx="16" fill="#f7d9df" stroke="#d9899b"/>
<text class="smallLabel" x="160" y="166" text-anchor="middle">Caller (Regular</text>
<path class="dash" d="M 160 208 L 160 1016"/>
<rect class="card" x="282" y="142" width="176" height="58" rx="16" fill="#d9ecff" stroke="#7eaad3"/>
<text class="smallLabel" x="370" y="166" text-anchor="middle">Code)</text>
<path class="dash" d="M 370 208 L 370 1016"/>
<rect class="card" x="492" y="142" width="176" height="58" rx="16" fill="#dcf3e4" stroke="#7fb895"/>
<text class="smallLabel" x="580" y="166" text-anchor="middle">new Virtual</text>
<text class="smallLabel" x="580" y="186" text-anchor="middle">Thread</text>
<path class="dash" d="M 580 208 L 580 1016"/>
<rect class="card" x="702" y="142" width="176" height="58" rx="16" fill="#fff0c9" stroke="#d0a84e"/>
<text class="smallLabel" x="790" y="166" text-anchor="middle">Jdbc Transaction</text>
<path class="dash" d="M 790 208 L 790 1016"/>
<rect class="card" x="912" y="142" width="176" height="58" rx="16" fill="#eadff8" stroke="#a287c8"/>
<text class="smallLabel" x="1000" y="166" text-anchor="middle">virtual Thread</text>
<text class="smallLabel" x="1000" y="186" text-anchor="middle">Jdbc</text>
<path class="dash" d="M 1000 208 L 1000 1016"/>
<rect class="card" x="1122" y="142" width="176" height="58" rx="16" fill="#dff4f1" stroke="#75aaa3"/>
<text class="smallLabel" x="1210" y="166" text-anchor="middle">Transaction</text>
<text class="smallLabel" x="1210" y="186" text-anchor="middle">Async</text>
<path class="dash" d="M 1210 208 L 1210 1016"/>
<rect class="card" x="1332" y="142" width="176" height="58" rx="16" fill="#ffe1cc" stroke="#d5905f"/>
<text class="smallLabel" x="1420" y="166" text-anchor="middle">Database</text>
<path class="dash" d="M 1420 208 L 1420 1016"/>
<path class="line" d="M 172 248 L 356 248" marker-end="url(#openArrow)"/>
<rect class="note" x="133" y="216" width="264" height="24" rx="8"/>
<text class="small" x="265" y="233" text-anchor="middle">1. newVirtualThreadJdbcTransaction { }</text>
<path class="line" d="M 382 302 L 566 302" marker-end="url(#openArrow)"/>
<rect class="note" x="343" y="270" width="264" height="24" rx="8"/>
<text class="small" x="475" y="287" text-anchor="middle">2. BEGIN</text>
<path class="line" d="M 592 356 L 776 356" marker-end="url(#openArrow)"/>
<rect class="note" x="553" y="324" width="264" height="24" rx="8"/>
<text class="small" x="685" y="341" text-anchor="middle">3. INSERT / SELECT ...</text>
<path class="line" d="M 802 410 L 986 410" marker-end="url(#openArrow)"/>
<rect class="note" x="763" y="378" width="264" height="24" rx="8"/>
<text class="small" x="895" y="395" text-anchor="middle">ALT: Success</text>
<path class="line" d="M 1012 464 L 1196 464" marker-end="url(#openArrow)"/>
<rect class="note" x="973" y="432" width="264" height="24" rx="8"/>
<text class="small" x="1105" y="449" text-anchor="middle">5. COMMIT</text>
<path class="line" d="M 1222 518 L 1406 518" marker-end="url(#openArrow)"/>
<rect class="note" x="1183" y="486" width="264" height="24" rx="8"/>
<text class="small" x="1315" y="503" text-anchor="middle">6. Result returned</text>
<path class="line" d="M 1408 572 L 174 572" marker-end="url(#openArrow)"/>
<rect class="note" x="658" y="540" width="264" height="24" rx="8"/>
<text class="small" x="790" y="557" text-anchor="middle">ELSE: Exception</text>
<path class="line" d="M 172 626 L 356 626" marker-end="url(#openArrow)"/>
<rect class="note" x="133" y="594" width="264" height="24" rx="8"/>
<text class="small" x="265" y="611" text-anchor="middle">8. ROLLBACK</text>
<path class="line" d="M 382 680 L 566 680" marker-end="url(#openArrow)"/>
<rect class="note" x="343" y="648" width="264" height="24" rx="8"/>
<text class="small" x="475" y="665" text-anchor="middle">9. Exception propagated</text>
<path class="line" d="M 592 734 L 776 734" marker-end="url(#openArrow)"/>
<rect class="note" x="553" y="702" width="264" height="24" rx="8"/>
<text class="small" x="685" y="719" text-anchor="middle">10. virtualThreadJdbcTransactionAsync { }</text>
<path class="line" d="M 802 788 L 986 788" marker-end="url(#openArrow)"/>
<rect class="note" x="763" y="756" width="264" height="24" rx="8"/>
<text class="small" x="895" y="773" text-anchor="middle">11. VirtualFuture&lt;T...turned immediately)</text>
<path class="line" d="M 1012 842 L 1196 842" marker-end="url(#openArrow)"/>
<rect class="note" x="973" y="810" width="264" height="24" rx="8"/>
<text class="small" x="1105" y="827" text-anchor="middle">12. futures.awaitAll()</text>
<path class="line" d="M 1222 896 L 1406 896" marker-end="url(#openArrow)"/>
<rect class="note" x="1183" y="864" width="264" height="24" rx="8"/>
<text class="small" x="1315" y="881" text-anchor="middle">13. BEGIN → SQL → COMMIT</text>
<path class="line" d="M 1408 950 L 174 950" marker-end="url(#openArrow)"/>
<rect class="note" x="658" y="918" width="264" height="24" rx="8"/>
<text class="small" x="790" y="935" text-anchor="middle">14. Result returned</text>
</svg>
