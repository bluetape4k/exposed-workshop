<svg xmlns="http://www.w3.org/2000/svg" width="1624" height="1832" viewBox="0 0 1624 1832" role="img" aria-label="Virtual Thread Transaction Flow">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#758297" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 0 1 L 12 6 L 0 11 Z" fill="#ffffff" stroke="#758297" stroke-width="1.8"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="1624" height="1832"/>
<rect class="frame" x="32" y="28" width="1560" height="1776" rx="28"/>
<text class="title" x="66" y="82">Virtual Thread Transaction Flow</text>
<text class="subtitle" x="70" y="118">Sequence messages from the original Mermaid source</text>
<rect class="card" x="-10" y="166" width="300" height="72" rx="20" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="140" y="198.5" text-anchor="middle">Caller (Regular</text>
<text class="smallLabel" x="140" y="219.5" text-anchor="middle">Code)</text>
<line class="lifeline" x1="140" y1="252" x2="140" y2="1772" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="438" y="166" width="300" height="72" rx="20" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="588" y="198.5" text-anchor="middle">new Virtual Thread</text>
<text class="smallLabel" x="588" y="219.5" text-anchor="middle">Jdbc Transaction</text>
<line class="lifeline" x1="588" y1="252" x2="588" y2="1772" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="886" y="166" width="300" height="72" rx="20" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="1036" y="198.5" text-anchor="middle">virtual Thread Jdbc</text>
<text class="smallLabel" x="1036" y="219.5" text-anchor="middle">Transaction Async</text>
<line class="lifeline" x1="1036" y1="252" x2="1036" y2="1772" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="1334" y="166" width="300" height="72" rx="20" fill="#FDECEF" stroke="#DC6B82"/>
<text class="smallLabel" x="1484" y="209" text-anchor="middle">Database</text>
<line class="lifeline" x1="1484" y1="252" x2="1484" y2="1772" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect x="192.5" y="286" width="343" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="210.5" y="313" text-anchor="start">1. newVirtualThreadJdbcTransaction { }</text>
<path class="line" d="M140 344 L588 344"/>
<rect x="931" y="396" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="949" y="423" text-anchor="start">2. BEGIN</text>
<path class="line" d="M588 454 L1484 454"/>
<rect x="929" y="506" width="214" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="947" y="533" text-anchor="start">3. INSERT / SELECT ...</text>
<path class="line" d="M588 564 L1484 564"/>
<rect x="70" y="616" width="1484" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="92" y="643" text-anchor="start">ALT: Success</text>
<rect x="931" y="684" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="949" y="711" text-anchor="start">5. COMMIT</text>
<path class="line" d="M588 742 L1484 742"/>
<rect x="259" y="794" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="277" y="821" text-anchor="start">6. Result returned</text>
<path class="dashed" d="M588 852 L140 852"/>
<rect x="70" y="904" width="1484" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="92" y="931" text-anchor="start">ELSE: Exception</text>
<rect x="931" y="972" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="949" y="999" text-anchor="start">8. ROLLBACK</text>
<path class="line" d="M588 1030 L1484 1030"/>
<rect x="253" y="1082" width="222" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="271" y="1109" text-anchor="start">9. Exception propagated</text>
<path class="dashed" d="M588 1140 L140 1140"/>
<rect x="404.5" y="1192" width="367" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="422.5" y="1219" text-anchor="start">10. virtualThreadJdbcTransactionAsync { }</text>
<path class="line" d="M140 1250 L1036 1250"/>
<rect x="396.5" y="1302" width="383" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="414.5" y="1329" text-anchor="start">11. VirtualFuture&lt;T&gt; (returned immediately)</text>
<path class="dashed" d="M1036 1360 L140 1360"/>
<rect x="81" y="1412" width="214" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="99" y="1439" text-anchor="start">12. futures.awaitAll()</text>
<path class="line" d="M140 1470 C204 1470 204 1504 140 1504"/>
<rect x="1145" y="1542" width="230" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1163" y="1569" text-anchor="start">13. BEGIN → SQL → COMMIT</text>
<path class="line" d="M1036 1600 L1484 1600"/>
<rect x="483" y="1652" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="501" y="1679" text-anchor="start">14. Result returned</text>
<path class="dashed" d="M1036 1710 L140 1710"/>
</svg>
