<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 940" width="1500" height="940" role="img" aria-label="Virtual Thread Transaction Sequence">
<defs>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/></filter>
<marker id="arrowBlue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8 Z" fill="#2563eb"/></marker>
<marker id="arrowGreen" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8 Z" fill="#16a34a"/></marker>
<marker id="arrowOrange" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8 Z" fill="#ea580c"/></marker>
<marker id="arrowPurple" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8 Z" fill="#7c3aed"/></marker>
<marker id="arrowGray" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8 Z" fill="#64748b"/></marker>
<style>
.canvas{fill:#f6f9fc}.frame{fill:#fff;stroke:#d7e2ec;stroke-width:1.5}
.title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:31px;fill:#1e293b}
.subtitle,.detail{font-family:"Comic Mono","Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;fill:#536476}
.subtitle{font-size:13px}.detail{font-size:12px}.tiny{font-family:"Comic Mono","Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:10px;fill:#64748b}
.label{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:16px;fill:#1e293b}
.tableName{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:18px;fill:#1e293b}
.panelTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:12px;letter-spacing:.08em;fill:#94a3b8}
.card,.tableBox{stroke-width:1.7;filter:url(#shadow)}.panel{fill:#f8fafc;stroke:#d7e2ec;stroke-width:1.2}
.arrow{fill:none;stroke:#2563eb;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowBlue)}
.mapLine{fill:none;stroke:#16a34a;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowGreen)}
.dbUse{fill:none;stroke:#ea580c;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowOrange)}
.runtimeUse{fill:none;stroke:#7c3aed;stroke-width:1.9;stroke-dasharray:6 5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowPurple)}
.returnLine{fill:none;stroke:#64748b;stroke-width:1.7;stroke-dasharray:7 5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowGray)}
.altRegion{fill:#f8fafc;fill-opacity:.055;stroke:#94a3b8;stroke-opacity:.28;stroke-width:1.2;stroke-dasharray:8 7}
.lifeline{stroke:#cbd5e1;stroke-width:1.4;stroke-dasharray:5 6}
</style>
</defs>
<rect width="1500" height="940" class="canvas"/>
<rect x="20" y="20" width="1460" height="900" rx="16" class="frame"/>
<text x="48" y="58" class="title">Virtual Thread Transaction Sequence</text>
<text x="48" y="80" class="subtitle">Ex01_VirtualThreads uses Java 21 gated tests, newVirtualThreadJdbcTransaction, async fan-out, regular transaction comparison, and exception cleanup</text>
<desc>Java 21 Test</desc><rect x="29" y="130" width="152" height="54" rx="10" fill="#dbeafe" stroke="#3b82f6" class="card"/>
<text x="105" y="163" class="label" text-anchor="middle">Java 21 Test</text>
<line x1="105" y1="184" x2="105" y2="790" class="lifeline"/>
<desc>Fixture</desc><rect x="239" y="130" width="152" height="54" rx="10" fill="#dbeafe" stroke="#3b82f6" class="card"/>
<text x="315" y="163" class="label" text-anchor="middle">Fixture</text>
<line x1="315" y1="184" x2="315" y2="790" class="lifeline"/>
<desc>VT API</desc><rect x="469" y="130" width="152" height="54" rx="10" fill="#dbeafe" stroke="#3b82f6" class="card"/>
<text x="545" y="163" class="label" text-anchor="middle">VT API</text>
<line x1="545" y1="184" x2="545" y2="790" class="lifeline"/>
<desc>JdbcTransaction</desc><rect x="699" y="130" width="152" height="54" rx="10" fill="#dbeafe" stroke="#3b82f6" class="card"/>
<text x="775" y="163" class="label" text-anchor="middle">JdbcTransaction</text>
<line x1="775" y1="184" x2="775" y2="790" class="lifeline"/>
<desc>VTester</desc><rect x="934" y="130" width="152" height="54" rx="10" fill="#dbeafe" stroke="#3b82f6" class="card"/>
<text x="1010" y="163" class="label" text-anchor="middle">VTester</text>
<line x1="1010" y1="184" x2="1010" y2="790" class="lifeline"/>
<desc>Regular Tx</desc><rect x="1139" y="130" width="152" height="54" rx="10" fill="#dbeafe" stroke="#3b82f6" class="card"/>
<text x="1215" y="163" class="label" text-anchor="middle">Regular Tx</text>
<line x1="1215" y1="184" x2="1215" y2="790" class="lifeline"/>
<desc>Assertions</desc><rect x="1314" y="130" width="152" height="54" rx="10" fill="#dbeafe" stroke="#3b82f6" class="card"/>
<text x="1390" y="163" class="label" text-anchor="middle">Assertions</text>
<line x1="1390" y1="184" x2="1390" y2="790" class="lifeline"/>
<rect x="500" y="490" width="900" height="300" rx="14" class="altRegion"/>
<text x="522" y="515" class="panelTitle">ALT: async fan-out / regular tx / exception path</text>
<rect x="82" y="222" width="248" height="46" rx="10" fill="#e2e8f0" stroke="#64748b" class="card"/>
<circle cx="105" cy="245" r="14" fill="#fff" stroke="#64748b" stroke-width="1.4"/>
<text x="105" y="250" class="detail" text-anchor="middle">1</text>
<text x="130" y="251" class="detail">@EnabledForJreRange gates Java 21</text>
<path d="M105,276 L315,276" class="arrow"/>
<rect x="292" y="304" width="300" height="46" rx="10" fill="#dcfce7" stroke="#16a34a" class="card"/>
<circle cx="315" cy="327" r="14" fill="#fff" stroke="#16a34a" stroke-width="1.4"/>
<text x="315" y="332" class="detail" text-anchor="middle">2</text>
<text x="340" y="333" class="detail">withTables creates VTester fixture</text>
<path d="M315,358 L545,358" class="arrow"/>
<rect x="520" y="386" width="304" height="46" rx="10" fill="#ede9fe" stroke="#7c3aed" class="card"/>
<circle cx="543" cy="409" r="14" fill="#fff" stroke="#7c3aed" stroke-width="1.4"/>
<text x="543" y="414" class="detail" text-anchor="middle">3</text>
<text x="568" y="415" class="detail">newVirtualThread Tx inserts and commits</text>
<path d="M545,440 L775,440" class="arrow"/>
<path d="M775,468 L1010,468" class="dbUse"/>
<rect x="520" y="502" width="330" height="46" rx="10" fill="#fef3c7" stroke="#d97706" class="card"/>
<circle cx="543" cy="525" r="14" fill="#fff" stroke="#d97706" stroke-width="1.4"/>
<text x="543" y="530" class="detail" text-anchor="middle">4</text>
<text x="568" y="531" class="detail">VT async fan-out inserts/selects</text>
<path d="M545,556 L775,556" class="arrow"/>
<path d="M775,584 L1010,584" class="dbUse"/>
<rect x="1030" y="618" width="280" height="46" rx="10" fill="#e2e8f0" stroke="#64748b" class="card"/>
<circle cx="1053" cy="641" r="14" fill="#fff" stroke="#64748b" stroke-width="1.4"/>
<text x="1053" y="646" class="detail" text-anchor="middle">5</text>
<text x="1078" y="647" class="detail">regular transaction also selects</text>
<path d="M1215,672 L1010,672" class="dbUse"/>
<rect x="1112" y="730" width="278" height="46" rx="10" fill="#fce7f3" stroke="#db2777" class="card"/>
<circle cx="1135" cy="753" r="14" fill="#fff" stroke="#db2777" stroke-width="1.4"/>
<text x="1135" y="758" class="detail" text-anchor="middle">6</text>
<text x="1160" y="759" class="detail">duplicate id wraps ExposedSQLException</text>
<path d="M775,702 L1390,702" class="returnLine"/>
<path d="M1010,812 L1390,812" class="returnLine"/>
<rect x="126" y="850" width="1248" height="52" rx="10" fill="#ecfdf5" stroke="#86efac" stroke-width="1.3"/>
<text x="750" y="881" class="detail" text-anchor="middle">Sequence rule: Virtual Thread calls are solid; verification/exception results return as dashed arrows. The regular transaction comparison is source-backed and uses the same VTester table.</text>
</svg>
