<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 940" width="1500" height="940" role="img" aria-label="Virtual Thread transaction sequence">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
    <marker id="seqArrow-blue" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#3f7d9c" stroke="#3f7d9c" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="seqArrow-green" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#6e8f4f" stroke="#6e8f4f" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="seqArrow-amber" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#a2743d" stroke="#a2743d" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="seqArrow-red" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#a65a66" stroke="#a65a66" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <style>
      .canvas{fill:#fbfcf8}
      .frame{fill:#fbfcf8;stroke:#41545d;stroke-width:3}
      .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:32px;font-weight:400;fill:#263238}
      .subtitle,.detail{font-family:"Comic Mono","Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;fill:#36464f}
      .subtitle{font-size:14px}.detail{font-size:12px}
      .participant{fill:#ffffff;stroke:#546e7a;stroke-width:2}
      .participant-title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:16px;fill:#1f3138}
      .participant-sub{font-family:"Comic Mono","Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:11px;fill:#546a73}
      .lifeline{stroke:#9aaab1;stroke-width:2;stroke-dasharray:7 8}
      .activation{fill:#f3ecdf;stroke:#8f784e;stroke-width:1.5}
      .callBlue{fill:none;stroke:#3f7d9c;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#seqArrow-blue)}
      .callGreen{fill:none;stroke:#6e8f4f;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#seqArrow-green)}
      .callAmber{fill:none;stroke:#a2743d;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#seqArrow-amber)}
      .callRed{fill:none;stroke:#a65a66;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#seqArrow-red)}
      .altRegion{fill:none;stroke:#9aaab1;stroke-width:1.5;stroke-dasharray:8 7}
      .altHeader{fill:#ffffff;stroke:#ccd7da;stroke-width:1.5}
      .altText{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:13px;fill:#60727d}
      .pill{stroke-width:1.5}
      .labelText{font-family:"Comic Mono","Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;fill:#36464f}
      .num{font-family:"Comic Mono","Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:700}
      .footer{fill:#ffffff;stroke:#ccd7da;stroke-width:1.5}
    </style>
  </defs>

  <rect width="1500" height="940" class="canvas"/>
  <rect x="20" y="20" width="1460" height="900" rx="20" class="frame"/>
  <text x="750" y="62" text-anchor="middle" class="title">Virtual Thread Transaction Sequence</text>
  <text x="750" y="88" text-anchor="middle" class="subtitle">Java 21-gated tests keep blocking Exposed code while moving work onto Virtual Threads.</text>

  <g id="participants">
    <rect x="52" y="130" width="136" height="58" rx="10" class="participant"/>
    <text x="120" y="157" class="participant-title" text-anchor="middle">Test</text>
    <text x="120" y="174" class="participant-sub" text-anchor="middle">Java 21 gate</text>
    <line x1="120" y1="188" x2="120" y2="858" class="lifeline"/>

    <rect x="272" y="130" width="136" height="58" rx="10" class="participant"/>
    <text x="340" y="157" class="participant-title" text-anchor="middle">Fixture</text>
    <text x="340" y="174" class="participant-sub" text-anchor="middle">withTables</text>
    <line x1="340" y1="188" x2="340" y2="858" class="lifeline"/>

    <rect x="492" y="130" width="136" height="58" rx="10" class="participant"/>
    <text x="560" y="157" class="participant-title" text-anchor="middle">VT API</text>
    <text x="560" y="174" class="participant-sub" text-anchor="middle">jdbc helpers</text>
    <line x1="560" y1="188" x2="560" y2="858" class="lifeline"/>

    <rect x="712" y="130" width="136" height="58" rx="10" class="participant"/>
    <text x="780" y="157" class="participant-title" text-anchor="middle">VirtualFuture</text>
    <text x="780" y="174" class="participant-sub" text-anchor="middle">awaitAll</text>
    <line x1="780" y1="188" x2="780" y2="858" class="lifeline"/>

    <rect x="932" y="130" width="136" height="58" rx="10" class="participant"/>
    <text x="1000" y="157" class="participant-title" text-anchor="middle">Jdbc Tx</text>
    <text x="1000" y="174" class="participant-sub" text-anchor="middle">blocking style</text>
    <line x1="1000" y1="188" x2="1000" y2="858" class="lifeline"/>

    <rect x="1152" y="130" width="136" height="58" rx="10" class="participant"/>
    <text x="1220" y="157" class="participant-title" text-anchor="middle">VTester</text>
    <text x="1220" y="174" class="participant-sub" text-anchor="middle">table + DAO</text>
    <line x1="1220" y1="188" x2="1220" y2="858" class="lifeline"/>

    <rect x="1332" y="130" width="136" height="58" rx="10" class="participant"/>
    <text x="1400" y="157" class="participant-title" text-anchor="middle">Assertions</text>
    <text x="1400" y="174" class="participant-sub" text-anchor="middle">results</text>
    <line x1="1400" y1="188" x2="1400" y2="858" class="lifeline"/>
  </g>

  <rect x="334" y="244" width="12" height="70" rx="6" class="activation"/>
  <rect x="554" y="326" width="12" height="494" rx="6" class="activation"/>
  <rect x="774" y="548" width="12" height="124" rx="6" class="activation"/>
  <rect x="994" y="408" width="12" height="244" rx="6" class="activation"/>
  <rect x="1214" y="480" width="12" height="326" rx="6" class="activation"/>
  <rect x="1394" y="790" width="12" height="52" rx="6" class="activation"/>

  <g id="m1" data-message="1">
    <rect class="pill" x="82" y="214" width="336" height="38" rx="19" fill="#ffffff" stroke="#6e8f4f"/>
    <circle cx="108" cy="233" r="13" fill="#eef7f0" stroke="#6e8f4f" stroke-width="1.5"/>
    <text x="108" y="238" class="num" fill="#55783f" text-anchor="middle">1</text>
    <text x="136" y="238" class="labelText">@EnabledForJreRange gates Java 21</text>
    <path d="M120,260 L340,260" class="callGreen" data-connector="m1"/>
  </g>

  <g id="m2" data-message="2">
    <rect class="pill" x="292" y="294" width="364" height="38" rx="19" fill="#ffffff" stroke="#6e8f4f"/>
    <circle cx="318" cy="313" r="13" fill="#eef7f0" stroke="#6e8f4f" stroke-width="1.5"/>
    <text x="318" y="318" class="num" fill="#55783f" text-anchor="middle">2</text>
    <text x="346" y="318" class="labelText">withTables creates VTester fixture</text>
    <path d="M340,340 L560,340" class="callGreen" data-connector="m2"/>
  </g>

  <g id="m3" data-message="3">
    <rect class="pill" x="520" y="374" width="424" height="38" rx="19" fill="#ffffff" stroke="#3f7d9c"/>
    <circle cx="546" cy="393" r="13" fill="#eaf4f8" stroke="#3f7d9c" stroke-width="1.5"/>
    <text x="546" y="398" class="num" fill="#2f6f8e" text-anchor="middle">3</text>
    <text x="574" y="398" class="labelText">newVirtualThreadJdbcTransaction opens tx</text>
    <path d="M560,420 L1000,420" class="callBlue" data-connector="m3"/>
  </g>

  <g id="m4" data-message="4">
    <rect class="pill" x="950" y="450" width="390" height="38" rx="19" fill="#ffffff" stroke="#a2743d"/>
    <circle cx="976" cy="469" r="13" fill="#fff4df" stroke="#a2743d" stroke-width="1.5"/>
    <text x="976" y="474" class="num" fill="#855a29" text-anchor="middle">4</text>
    <text x="1004" y="474" class="labelText">insert/select rows through VTester</text>
    <path d="M1000,496 L1220,496" class="callAmber" data-connector="m4"/>
  </g>

  <rect x="520" y="520" width="900" height="326" rx="14" class="altRegion"/>
  <rect x="548" y="504" width="358" height="32" rx="8" class="altHeader"/>
  <text x="566" y="525" class="altText">ALT: fan-out / regular tx / exception cleanup</text>

  <g id="m5" data-message="5">
    <rect class="pill" x="522" y="540" width="420" height="38" rx="19" fill="#ffffff" stroke="#3f7d9c"/>
    <circle cx="548" cy="559" r="13" fill="#eaf4f8" stroke="#3f7d9c" stroke-width="1.5"/>
    <text x="548" y="564" class="num" fill="#2f6f8e" text-anchor="middle">5</text>
    <text x="576" y="564" class="labelText">virtualThreadJdbcTransactionAsync fan-out</text>
    <path d="M560,586 L780,586" class="callBlue" data-connector="m5"/>
  </g>

  <g id="m6" data-message="6">
    <rect class="pill" x="750" y="616" width="362" height="38" rx="19" fill="#ffffff" stroke="#a2743d"/>
    <circle cx="776" cy="635" r="13" fill="#fff4df" stroke="#a2743d" stroke-width="1.5"/>
    <text x="776" y="640" class="num" fill="#855a29" text-anchor="middle">6</text>
    <text x="804" y="640" class="labelText">awaitAll joins rows and counts</text>
    <path d="M780,662 L1220,662" class="callAmber" data-connector="m6"/>
  </g>

  <g id="m7" data-message="7">
    <rect class="pill" x="900" y="692" width="392" height="38" rx="19" fill="#ffffff" stroke="#3f7d9c"/>
    <circle cx="926" cy="711" r="13" fill="#eaf4f8" stroke="#3f7d9c" stroke-width="1.5"/>
    <text x="926" y="716" class="num" fill="#2f6f8e" text-anchor="middle">7</text>
    <text x="954" y="716" class="labelText">regular transaction selects same table</text>
    <path d="M1000,738 L1220,738" class="callBlue" data-connector="m7"/>
  </g>

  <g id="m8" data-message="8">
    <rect class="pill" x="908" y="766" width="476" height="38" rx="19" fill="#ffffff" stroke="#a65a66"/>
    <circle cx="934" cy="785" r="13" fill="#fff0f2" stroke="#a65a66" stroke-width="1.5"/>
    <text x="934" y="790" class="num" fill="#8c4b56" text-anchor="middle">8</text>
    <text x="962" y="790" class="labelText">duplicate id closes inner connection and wraps SQL error</text>
    <path d="M1220,812 L1400,812" class="callRed" data-connector="m8"/>
  </g>

  <rect x="150" y="874" width="1200" height="34" rx="10" class="footer"/>
  <text x="750" y="896" class="detail" text-anchor="middle">The source keeps blocking Exposed calls; Java 21 Virtual Threads provide the concurrency boundary.</text>
</svg>
