<rect class="footerBox" x="170" y="820" width="1160" height="54" rx="24"/>
<text class="footer" x="750" y="853" text-anchor="middle">Default dialects are H2, PostgreSQL, and MySQL V8; use -PuseFastDB or -PuseDB to narrow the matrix.</text>
