<rect class="pill" x="1130" y="325" width="210" height="38" rx="19"/><text class="body" x="1235" y="350" text-anchor="middle">H2 fast feedback</text>
<image href="../readme-icons/database-server.svg" x="1045" y="420" width="72" height="72"/>
<rect class="pill" x="1130" y="435" width="210" height="38" rx="19"/><text class="body" x="1235" y="460" text-anchor="middle">PostgreSQL</text>
