<text class="laneTitle" x="515" y="265">Fixture lifecycle</text>
<rect class="card" x="535" y="305" width="340" height="72" rx="18" stroke="#059669"/><text class="cardTitle" x="705" y="337" text-anchor="middle">withDb / withDbSuspending</text><text class="small" x="705" y="360" text-anchor="middle">semaphore, connection, currentTestDB</text>
<rect class="card" x="535" y="415" width="340" height="72" rx="18" stroke="#059669"/><text class="cardTitle" x="705" y="447" text-anchor="middle">withTables</text><text class="small" x="705" y="470" text-anchor="middle">drop, create, run, cleanup</text>
<rect class="card" x="535" y="525" width="340" height="72" rx="18" stroke="#059669"/><text class="cardTitle" x="705" y="557" text-anchor="middle">withSchemas</text><text class="small" x="705" y="580" text-anchor="middle">create only when dialect supports it</text>
<rect class="card" x="535" y="635" width="340" height="72" rx="18" stroke="#059669"/><text class="cardTitle" x="705" y="667" text-anchor="middle">Sample data fixtures</text><text class="small" x="705" y="690" text-anchor="middle">DML data, movie actors, repositories</text>
