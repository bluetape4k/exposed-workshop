<rect class="canvas" width="1500" height="1000"/><rect class="frame" x="48" y="40" width="1404" height="900" rx="34"/>
<text class="title" x="750" y="110" text-anchor="middle">00-shared Test Fixture Architecture</text>
<text class="subtitle" x="750" y="150" text-anchor="middle">Workshop examples reuse one module for dialect selection, transaction setup, schema lifecycle, and sample data fixtures.</text>
<rect class="lane" x="100" y="220" width="300" height="520" rx="28" fill="#eff6ff" stroke="#60a5fa"/>
<text class="laneTitle" x="130" y="265">Test entry</text>
<rect class="card" x="135" y="310" width="230" height="80" rx="18" stroke="#0284c7"/><text class="cardTitle" x="250" y="344" text-anchor="middle">Chapter tests</text><text class="small" x="250" y="370" text-anchor="middle">@MethodSource dialects</text>
<rect class="card" x="135" y="430" width="230" height="80" rx="18" stroke="#0284c7"/><text class="cardTitle" x="250" y="458" text-anchor="middle">Abstract</text><text class="cardTitle" x="250" y="482" text-anchor="middle">ExposedTest</text><text class="small" x="250" y="502" text-anchor="middle">UTC + Faker + helpers</text>
<rect class="card" x="135" y="550" width="230" height="80" rx="18" stroke="#0284c7"/><text class="cardTitle" x="250" y="584" text-anchor="middle">TestDB</text><text class="small" x="250" y="610" text-anchor="middle">useDB / useFastDB</text>
