<path data-connector="suspended-cache-to-db" d="M1170,452 H1230 Q1240,452 1240,462 V470 Q1240,480 1250,480 H1310" class="dbUse"/>
<rect x="140" y="760" width="1220" height="52" rx="10" fill="#ecfdf5" stroke="#86efac" stroke-width="1.3"/>
<text x="750" y="791" class="detail" text-anchor="middle">Chapter modules progress from auto-configuration to transaction policies, sync/coroutine repositories, and Redis-backed cache decorators.</text>
