<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 720" width="1500" height="720" role="img" aria-label="Spring Integration Architecture Flow">
<defs>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/></filter>
<marker id="arrowBlue" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb" stroke="#2563eb" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
<marker id="arrowGreen" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#16a34a" stroke="#16a34a" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
<marker id="arrowOrange" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#ea580c" stroke="#ea580c" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
<marker id="arrowPurple" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#7c3aed" stroke="#7c3aed" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
<marker id="arrowGray" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b" stroke="#64748b" stroke-dasharray="none" style="stroke-dasharray:none!important" stroke-width="0"/></marker>
<style>
.canvas{fill:#f6f9fc}.frame{fill:#fff;stroke:#d7e2ec;stroke-width:1.5}
.title{font-family:"Architects Daughter";font-size:31px;fill:#1e293b}
.subtitle,.detail{font-family:"Comic Mono";fill:#536476}
.subtitle{font-size:13px}.detail{font-size:12px}.tiny{font-family:"Comic Mono";font-size:10px;fill:#64748b}
.label{font-family:"Architects Daughter";font-size:16px;fill:#1e293b}
.className{font-family:"Architects Daughter";font-size:17px;fill:#1e293b}
.panelTitle{font-family:"Architects Daughter";font-size:12px;letter-spacing:.08em;fill:#94a3b8}
.card,.uml{stroke-width:1.7;filter:url(#shadow)}.panel{fill:#f8fafc;stroke:#d7e2ec;stroke-width:1.2}
.arrow{fill:none;stroke:#2563eb;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowBlue)}
.mapLine{fill:none;stroke:#16a34a;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowGreen)}
.dbUse{fill:none;stroke:#ea580c;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowOrange)}
.runtimeUse{fill:none;stroke:#7c3aed;stroke-width:1.9;stroke-dasharray:6 5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowPurple)}
.returnLine{fill:none;stroke:#64748b;stroke-width:1.7;stroke-dasharray:7 5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowGray)}
.inherit{fill:none;stroke:#334155;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.lifeline{stroke:#cbd5e1;stroke-width:1.4;stroke-dasharray:5 6}
</style>
</defs>
<rect width="1500" height="720" class="canvas"/>
<rect x="20" y="20" width="1460" height="680" rx="16" class="frame"/>
<text x="48" y="58" class="title">Spring Integration Architecture Flow</text>
<text x="48" y="80" class="subtitle">Chapter 09 progresses from Spring Boot Exposed auto-configuration to transaction boundaries, repositories, coroutines, and cache decorators</text>
<rect x="60" y="130" width="315" height="460" rx="12" class="panel"/><text x="217.5" y="122" class="panelTitle" text-anchor="middle">BOOTSTRAPPING</text>
<desc>01 AutoConfigure</desc><rect x="104" y="188" width="226" height="64" rx="10" fill="#dbeafe" stroke="#3b82f6" class="card"/>
<text x="217" y="213" class="label" text-anchor="middle">01 AutoConfigure</text>
<text x="217" y="238" class="detail" text-anchor="middle">SpringTransactionManager</text>
<desc>02 TransactionTemplate</desc><rect x="104" y="338" width="226" height="64" rx="10" fill="#ede9fe" stroke="#7c3aed" class="card"/>
<text x="217" y="363" class="label" text-anchor="middle">02 TransactionTemplate</text>
<text x="217" y="388" class="detail" text-anchor="middle">programmatic boundary</text>
<desc>03 @Transactional</desc><rect x="104" y="488" width="226" height="64" rx="10" fill="#e2e8f0" stroke="#64748b" class="card"/>
<text x="217" y="513" class="label" text-anchor="middle">03 @Transactional</text>
<text x="217" y="538" class="detail" text-anchor="middle">declarative boundary</text>
<rect x="450" y="130" width="390" height="460" rx="12" class="panel"/><text x="645" y="122" class="panelTitle" text-anchor="middle">REPOSITORY PATTERNS</text>
<desc>04 Sync Repository</desc><rect x="500" y="188" width="288" height="64" rx="10" fill="#dcfce7" stroke="#16a34a" class="card"/>
<text x="644" y="213" class="label" text-anchor="middle">04 Sync Repository</text>
<text x="644" y="238" class="detail" text-anchor="middle">Spring MVC + JDBC</text>
<desc>05 Coroutine Repository</desc><rect x="500" y="338" width="288" height="64" rx="10" fill="#ccfbf1" stroke="#0f766e" class="card"/>
<text x="644" y="363" class="label" text-anchor="middle">05 Coroutine Repository</text>
<text x="644" y="388" class="detail" text-anchor="middle">WebFlux + suspend</text>
<desc>Transaction policy</desc><rect x="500" y="488" width="288" height="64" rx="10" fill="#fef3c7" stroke="#d97706" class="card"/>
<text x="644" y="513" class="label" text-anchor="middle">Transaction policy</text>
<text x="644" y="538" class="detail" text-anchor="middle">Spring vs Exposed</text>
<rect x="914" y="130" width="300" height="460" rx="12" class="panel"/><text x="1064" y="122" class="panelTitle" text-anchor="middle">CACHE INTEGRATION</text>
<desc>06 Spring Cache</desc><rect x="958" y="220" width="212" height="64" rx="10" fill="#fce7f3" stroke="#db2777" class="card"/>
<text x="1064" y="245" class="label" text-anchor="middle">06 Spring Cache</text>
<text x="1064" y="270" class="detail" text-anchor="middle">@Cacheable / Redis</text>
<desc>07 Suspended Cache</desc><rect x="958" y="420" width="212" height="64" rx="10" fill="#ccfbf1" stroke="#0f766e" class="card"/>
<text x="1064" y="445" class="label" text-anchor="middle">07 Suspended Cache</text>
<text x="1064" y="470" class="detail" text-anchor="middle">LettuceSuspendedCache</text>
<rect x="1288" y="130" width="154" height="460" rx="12" class="panel"/><text x="1365" y="122" class="panelTitle" text-anchor="middle">DATABASE</text>
<rect x="1310" y="188" width="110" height="364" rx="10" fill="#fff7ed" stroke="#ea580c" class="card"/>
<g data-bluetape4k-icon="generic/database-server" transform="translate(1346 220) scale(.30)">
  <rect x="10" y="8" width="108" height="112" rx="18" fill="#fffaf2" stroke="#28485a" stroke-width="6"/>
  <ellipse cx="64" cy="36" rx="34" ry="13" fill="#fff0d8" stroke="#8c6f33" stroke-width="6"/>
  <path d="M30 36v44c0 8 15 14 34 14s34-6 34-14V36" fill="#fff0d8" stroke="#8c6f33" stroke-width="6" stroke-linejoin="round"/>
  <ellipse cx="64" cy="36" rx="34" ry="13" fill="none" stroke="#8c6f33" stroke-width="5"/>
  <path d="M30 58c0 8 15 14 34 14s34-6 34-14" fill="none" stroke="#8c6f33" stroke-width="5" stroke-linecap="round"/>
  <path d="M30 80c0 8 15 14 34 14s34-6 34-14" fill="none" stroke="#8c6f33" stroke-width="5" stroke-linecap="round"/>
</g>
<text x="1365" y="340" class="label" text-anchor="middle">DB</text>
<text x="1365" y="382" class="tiny" text-anchor="middle">H2</text>
<text x="1365" y="400" class="tiny" text-anchor="middle">Postgres</text>
<text x="1365" y="418" class="tiny" text-anchor="middle">Redis</text>
<path data-connector="auto-config-to-sync-repo" d="M330,220 H500" class="arrow"/>
<path data-connector="template-to-coroutine-repo" d="M330,370 H500" class="arrow"/>
<path data-connector="transactional-to-policy" d="M330,520 H500" class="runtimeUse"/>
<path data-connector="sync-repo-to-spring-cache" d="M788,220 H860 Q870,220 870,230 V242 Q870,252 880,252 H958" class="mapLine"/>
<path data-connector="coroutine-repo-to-suspended-cache" d="M788,370 H860 Q870,370 870,380 V442 Q870,452 880,452 H958" class="mapLine"/>
<path data-connector="policy-to-db" d="M788,520 H1310" class="dbUse"/>
<path data-connector="spring-cache-to-db" d="M1170,252 H1310" class="dbUse"/>
<path data-connector="suspended-cache-to-db" d="M1170,452 H1310" class="dbUse"/>
<rect x="140" y="620" width="1220" height="52" rx="10" fill="#ecfdf5" stroke="#86efac" stroke-width="1.3"/>
<text x="750" y="651" class="detail" text-anchor="middle">Chapter modules progress from auto-configuration to transaction policies, sync/coroutine repositories, and Redis-backed cache decorators.</text>
</svg>
