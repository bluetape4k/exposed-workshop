<text x="934" y="203" class="label" text-anchor="middle">Table declarations</text>
<text x="934" y="234" class="detail" text-anchor="middle">Table / IdTable / IntIdTable</text>
<rect x="1114" y="178" width="228" height="70" rx="10" fill="#ede9fe" stroke="#7c3aed" class="card"/>
<text x="1228" y="203" class="label" text-anchor="middle">SchemaUtils</text>
<text x="1228" y="234" class="detail" text-anchor="middle">create/drop/missing</text>
<rect x="820" y="318" width="228" height="70" rx="10" fill="#ccfbf1" stroke="#0f766e" class="card"/>
<text x="934" y="343" class="label" text-anchor="middle">Constraints</text>
<text x="934" y="374" class="detail" text-anchor="middle">PK / FK / unique</text>
<rect x="1114" y="318" width="228" height="70" rx="10" fill="#fef3c7" stroke="#d97706" class="card"/>
<text x="1228" y="343" class="label" text-anchor="middle">Indexes</text>
<text x="1228" y="374" class="detail" text-anchor="middle">standard/hash/partial</text>
<rect x="820" y="508" width="228" height="70" rx="10" fill="#fce7f3" stroke="#db2777" class="card"/>
<text x="934" y="533" class="label" text-anchor="middle">Sequences / Enums</text>
