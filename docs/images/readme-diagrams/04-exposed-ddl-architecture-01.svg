<rect x="152" y="798" width="1176" height="48" rx="10" fill="#ecfdf5" stroke="#86efac" stroke-width="1.3"/>
<text x="740" y="828" class="detail" text-anchor="middle">Source check: connection tests exercise Database.connect, metadata, HikariCP, and multi-DB transactions; DDL tests use SchemaUtils with tables, constraints, indexes, sequences, and enums.</text>
