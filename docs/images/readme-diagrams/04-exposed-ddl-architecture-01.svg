<text x="206" y="564" class="detail" text-anchor="middle">db1 / db2 switching</text>
<rect x="386" y="508" width="228" height="70" rx="10" fill="#e2e8f0" stroke="#64748b" class="card"/>
<text x="500" y="533" class="label" text-anchor="middle">TransactionManager</text>
<text x="500" y="564" class="detail" text-anchor="middle">defaultDatabase</text>
