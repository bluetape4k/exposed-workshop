<rect width="1600" height="900" class="canvas"/>
<rect x="20" y="20" width="1560" height="860" rx="16" class="frame"/>
<text x="48" y="58" class="title">Exposed DDL Schema Execution Flow</text>
<text x="48" y="80" class="subtitle">Table declarations feed SchemaUtils and MigrationUtils before dialect-specific SQL reaches the database</text>
