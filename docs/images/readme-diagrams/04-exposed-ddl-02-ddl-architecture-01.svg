<text x="1153" y="315" class="label" text-anchor="middle">ALTER TABLE</text>
<text x="1153" y="346" class="detail" text-anchor="middle">unique, column drift</text>
<rect x="1034" y="402" width="238" height="70" rx="10" fill="#fef3c7" stroke="#d97706" class="card"/>
<text x="1153" y="427" class="label" text-anchor="middle">CREATE INDEX</text>
<text x="1153" y="458" class="detail" text-anchor="middle">predicate/functions</text>
<rect x="1034" y="514" width="238" height="70" rx="10" fill="#dcfce7" stroke="#16a34a" class="card"/>
<text x="1153" y="539" class="label" text-anchor="middle">CREATE SEQUENCE</text>
<text x="1153" y="570" class="detail" text-anchor="middle">start/increment/cache</text>
