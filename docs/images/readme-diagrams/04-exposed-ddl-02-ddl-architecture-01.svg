<text x="239" y="682" class="detail" text-anchor="middle">StatusEnum, EnumTable</text>
<rect x="544" y="130" width="370" height="608" rx="12" class="panel"/><text x="729" y="122" class="panelTitle" text-anchor="middle">DDL EXECUTORS</text>
<rect x="608" y="236" width="242" height="82" rx="10" fill="#ede9fe" stroke="#7c3aed" class="card"/>
<text x="729" y="261" class="label" text-anchor="middle">SchemaUtils</text>
<text x="729" y="304" class="detail" text-anchor="middle">create/drop/missing</text>
<rect x="608" y="466" width="242" height="82" rx="10" fill="#fce7f3" stroke="#db2777" class="card"/>
<text x="729" y="491" class="label" text-anchor="middle">MigrationUtils</text>
<text x="729" y="534" class="detail" text-anchor="middle">statementsRequired</text>
