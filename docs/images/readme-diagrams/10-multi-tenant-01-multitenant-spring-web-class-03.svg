    <rect x="818" y="432" width="230" height="31" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.4"/>
    <text x="933" y="454" class="label" text-anchor="middle">DataSourceUtils</text>
    <line x1="818" y1="463" x2="1048" y2="463" class="divider" stroke="#64748b"/>
