<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 800" width="1420" height="800" role="img" aria-label="Tenant Context Support Classes">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
    <marker id="inheritHead" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="16" viewBox="0 0 18 16" refX="16" refY="8" orient="auto">
      <path d="M1,1 L16,8 L1,15 Z" fill="#fff" stroke="#64748b" stroke-width="1.7" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="callHead" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#4f86c6" stroke="#4f86c6" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="schemaHead" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#8a6f3e" stroke="#8a6f3e" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <style>
      .canvas{fill:#f6f9fc}
      .frame{fill:#fff;stroke:#d7e2ec;stroke-width:1.5}
      .card{stroke-width:1.8;filter:url(#shadow)}
      .title{font-family:"Architects Daughter";font-size:31px;fill:#1e293b}
      .subtitle,.detail,.legend{font-family:"Comic Mono";fill:#536476}
      .subtitle{font-size:13px}
      .detail{font-size:12px}
      .legend{font-size:12px}
      .label{font-family:"Architects Daughter";font-size:16px;fill:#1e293b}
      .section{font-family:"Architects Daughter";font-size:13px;letter-spacing:.08em;fill:#64748b}
      .divider{stroke-width:1.1}
      .inherit{fill:none;stroke:#64748b;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#inheritHead)}
      .call{fill:none;stroke:#4f86c6;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#callHead)}
      .schema{fill:none;stroke:#8a6f3e;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#schemaHead)}
      .use{fill:none;stroke:#2f9a94;stroke-width:1.8;stroke-dasharray:6 6;stroke-linecap:round;stroke-linejoin:round}
      .init{fill:none;stroke:#b8894a;stroke-width:1.8;stroke-dasharray:6 6;stroke-linecap:round;stroke-linejoin:round}
      .useHead{fill:none;stroke:#2f9a94;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:none}
      .initHead{fill:none;stroke:#b8894a;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:none}
    </style>
  </defs>

  <rect width="1420" height="800" class="canvas"/>
  <rect x="20" y="20" width="1380" height="760" rx="18" class="frame"/>
  <text x="52" y="64" class="title">Tenant Context Support Classes</text>
  <text x="52" y="90" class="subtitle">Servlet filter resolves tenant identity; ThreadLocal context feeds schema switching, startup initialization, and optional routing DataSource.</text>

  <text x="318" y="130" class="section" text-anchor="middle">REQUEST CONTEXT</text>
  <text x="974" y="130" class="section" text-anchor="middle">SCHEMA SWITCH AND ROUTING</text>
  <text x="344" y="486" class="section" text-anchor="middle">STARTUP SCHEMA INITIALIZATION</text>

  <g data-card="Filter">
