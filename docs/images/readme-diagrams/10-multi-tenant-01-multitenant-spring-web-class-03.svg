    <rect x="1118" y="634" width="230" height="31" rx="6" fill="#ccfbf1" stroke="#2f9a94" stroke-width="1.4"/>
    <text x="1233" y="656" class="label" text-anchor="middle">SchemaSupport</text>
    <line x1="1118" y1="665" x2="1348" y2="665" class="divider" stroke="#2f9a94"/>
    <text x="1130" y="687" class="detail">getSchemaDefinition(tenant)</text>
