    <rect x="206" y="154" width="160" height="31" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.4"/>
    <text x="286" y="176" class="label" text-anchor="middle">Filter</text>
    <line x1="206" y1="185" x2="366" y2="185" class="divider" stroke="#64748b"/>
    <text x="218" y="206" class="detail">jakarta.servlet</text>
  </g>
