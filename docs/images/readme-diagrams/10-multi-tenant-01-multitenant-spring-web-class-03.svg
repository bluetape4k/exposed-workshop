  </g>
  <g data-card="DataInitializer">
    <rect x="326" y="634" width="200" height="100" rx="6" fill="#fff" stroke="#d45b21" class="card"/>
    <rect x="326" y="634" width="200" height="31" rx="6" fill="#fff7ed" stroke="#d45b21" stroke-width="1.4"/>
    <text x="426" y="656" class="label" text-anchor="middle">DataInitializer</text>
    <line x1="326" y1="665" x2="526" y2="665" class="divider" stroke="#d45b21"/>
