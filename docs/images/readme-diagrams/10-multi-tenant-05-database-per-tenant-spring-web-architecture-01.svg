<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 940" width="1600" height="940" role="img" aria-label="Database-per-tenant Spring Web architecture">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/></filter>
    <marker id="arrowApp" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto" data-role="primary" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#3f8e84" stroke="#3f8e84" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="arrowStore" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto" data-role="primary" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#a2743d" stroke="#a2743d" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="arrowRegistry" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto" data-role="primary" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#7667b1" stroke="#7667b1" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="arrowWarn" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto" data-role="primary" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#69777e" stroke="#69777e" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <style>
      text { letter-spacing: 0; }
      .canvas { fill: #fbfcf8; stroke: #3f515a; stroke-width: 3; }
      .title { font-family: "Architects Daughter"; font-size: 38px; fill: #23323a; }
      .subtitle,.laneNote,.cardText,.label,.footer { font-family: "Comic Mono"; fill: #324750; }
      .subtitle { font-size: 16px; }
      .laneTitle { font-family: "Architects Daughter"; font-size: 25px; fill: #23323a; }
      .laneNote { font-size: 13px; fill: #5b6d75; }
      .cardTitle { font-family: "Architects Daughter"; font-size: 21px; fill: #20323b; }
      .cardText { font-size: 13px; }
      .label { font-size: 12px; font-weight: 700; }
      .footer { font-size: 13px; fill: #60717a; }
      .laneApp { fill: #eef7f5; stroke: #6fa098; stroke-width: 2.2; }
      .laneStore { fill: #fff7e8; stroke: #b98e50; stroke-width: 2.2; }
      .laneDb { fill: #f2f0fb; stroke: #897bc2; stroke-width: 2.2; }
      .card { fill: #fff; stroke-width: 2.3; filter: url(#shadow); }
      .appCard { stroke: #5d948b; }
      .storeCard { stroke: #ac7a34; }
      .dbCard { stroke: #7b6bb4; }
      .warnCard { fill: #fffdf6; stroke: #69777e; }
      .flowApp { fill: none; stroke: #3f8e84; stroke-width: 4.0; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowApp); }
      .flowStore { fill: none; stroke: #a2743d; stroke-width: 4.0; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowStore); }
      .flowRegistry { fill: none; stroke: #7667b1; stroke-width: 4.0; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowRegistry); }
      .flowWarn { fill: none; stroke: #69777e; stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowWarn); }
    </style>
  </defs>

  <rect x="24" y="24" width="1552" height="892" rx="20" class="canvas"/>
  <text x="800" y="76" text-anchor="middle" class="title">Database-per-Tenant Spring Web</text>
  <text x="800" y="108" text-anchor="middle" class="subtitle">A whitelisted TenantId selects one physical H2 database through TenantDatabaseRegistry; there is no fallback datasource.</text>

  <rect x="70" y="148" width="430" height="694" rx="18" class="laneApp"/>
  <text x="106" y="190" class="laneTitle">Request boundary</text>
  <text x="106" y="216" class="laneNote">Header validation happens before application code runs.</text>

  <rect x="570" y="148" width="430" height="694" rx="18" class="laneStore"/>
  <text x="606" y="190" class="laneTitle">Routing boundary</text>
  <text x="606" y="216" class="laneNote">TenantTransaction opens Exposed work on the selected Database.</text>

  <rect x="1070" y="148" width="460" height="694" rx="18" class="laneDb"/>
  <text x="1106" y="190" class="laneTitle">Physical tenant databases</text>
  <text x="1106" y="216" class="laneNote">Each accepted tenant owns a Hikari pool and H2 URL.</text>

  <rect id="tenantFilter" x="120" y="260" width="330" height="90" rx="12" class="card appCard"/>
  <text x="285" y="292" text-anchor="middle" class="cardTitle">TenantFilter</text>
  <text x="148" y="320" class="cardText">accepts one X-Tenant-ID header</text>
  <text x="148" y="340" class="cardText">400 missing, 404 unknown</text>

  <rect id="tenantContext" x="120" y="400" width="330" height="86" rx="12" class="card appCard"/>
  <text x="285" y="432" text-anchor="middle" class="cardTitle">TenantContext</text>
  <text x="148" y="460" class="cardText">ThreadLocal TenantId</text>
  <text x="148" y="480" class="cardText">cleared in finally</text>

  <rect id="inventoryApi" x="120" y="548" width="330" height="104" rx="12" class="card appCard"/>
  <text x="285" y="580" text-anchor="middle" class="cardTitle">Inventory API + Service</text>
  <text x="148" y="608" class="cardText">findBySku, findAll, create</text>
  <text x="148" y="628" class="cardText">delegates to Exposed repository</text>

  <rect id="tenantTransaction" x="620" y="320" width="330" height="102" rx="12" class="card storeCard"/>
  <text x="785" y="352" text-anchor="middle" class="cardTitle">TenantTransaction</text>
  <text x="648" y="380" class="cardText">reads TenantContext.current()</text>
  <text x="648" y="400" class="cardText">transaction(registry.databaseFor(tenant))</text>

  <rect id="tenantRegistry" x="620" y="492" width="330" height="110" rx="12" class="card storeCard"/>
  <text x="785" y="524" text-anchor="middle" class="cardTitle">TenantDatabaseRegistry</text>
  <text x="648" y="552" class="cardText">validates every configured tenant</text>
  <text x="648" y="572" class="cardText">owns HikariDataSource + Database</text>
  <text x="648" y="592" class="cardText">closes all pools on shutdown</text>

  <rect id="inventorySeeder" x="620" y="674" width="330" height="98" rx="12" class="card storeCard"/>
  <text x="785" y="706" text-anchor="middle" class="cardTitle">InventorySeeder</text>
  <text x="648" y="734" class="cardText">creates inventory_items per tenant</text>
  <text x="648" y="754" class="cardText">seeds ACME and GLOBEX rows</text>

  <rect id="acmeDb" x="1120" y="282" width="360" height="130" rx="12" class="card dbCard"/>
  <image href="../readme-icons/h2.svg" x="1148" y="324" width="44" height="44"/>
  <text x="1318" y="320" text-anchor="middle" class="cardTitle">ACME database</text>
  <text x="1210" y="350" class="cardText">tenant-acme Hikari pool</text>
  <text x="1210" y="372" class="cardText">Exposed Database + H2 URL</text>
  <text x="1210" y="394" class="cardText">ACME-ROUTER-001 seed</text>

  <rect id="globexDb" x="1120" y="510" width="360" height="130" rx="12" class="card dbCard"/>
  <image href="../readme-icons/h2.svg" x="1148" y="552" width="44" height="44"/>
  <text x="1318" y="548" text-anchor="middle" class="cardTitle">GLOBEX database</text>
  <text x="1210" y="578" class="cardText">tenant-globex Hikari pool</text>
  <text x="1210" y="600" class="cardText">Exposed Database + H2 URL</text>
  <text x="1210" y="622" class="cardText">GLOBEX-DRONE-001 seed</text>

  <rect id="noFallback" x="120" y="704" width="330" height="94" rx="12" class="card warnCard"/>
  <text x="285" y="736" text-anchor="middle" class="cardTitle">No default datasource</text>
  <text x="148" y="764" class="cardText">missing tenant stops at 400</text>
  <text x="148" y="782" class="cardText">unknown tenant stops at 404</text>

  <path id="flow-filter-context" data-connector="flow-filter-context" d="M 285 350 L 285 400" class="flowApp"/>
  <path id="flow-context-api" data-connector="flow-context-api" d="M 285 486 L 285 548" class="flowApp"/>
  <path id="flow-api-transaction" data-connector="flow-api-transaction" d="M 450 600 L 520 600 Q 540 600 540 580 L 540 391 Q 540 371 560 371 L 620 371" class="flowApp"/>
  <path id="flow-transaction-registry" data-connector="flow-transaction-registry" d="M 785 422 L 785 492" class="flowStore"/>
  <path id="flow-seeder-registry" data-connector="flow-seeder-registry" d="M 785 674 L 785 602" class="flowStore"/>
  <path id="flow-registry-acme" data-connector="flow-registry-acme" d="M 950 528 L 1018 528 Q 1038 528 1038 508 L 1038 347 Q 1038 327 1058 327 L 1120 327" class="flowRegistry"/>
  <path id="flow-registry-globex" data-connector="flow-registry-globex" d="M 950 572 L 1120 572" class="flowRegistry"/>
  <path id="flow-no-fallback" data-connector="flow-no-fallback" d="M 120 305 L 100 305 Q 90 305 90 315 L 90 744 Q 90 764 110 764 L 120 764" class="flowWarn"/>

  <text x="286" y="382" text-anchor="middle" class="label">set tenant</text>
  <text x="528" y="624" text-anchor="middle" class="label">repository call</text>
  <text x="812" y="462" text-anchor="middle" class="label">select Database</text>
  <text x="1024" y="342" text-anchor="middle" class="label">acme</text>
  <text x="1032" y="558" text-anchor="middle" class="label">globex</text>
  <text x="785" y="646" text-anchor="middle" class="label">bootstrap</text>
  <text x="108" y="684" text-anchor="middle" class="label">reject</text>
  <text x="770" y="874" text-anchor="middle" class="footer">Isolation boundary is the physical datasource: backups, restores, migrations, and pool lifecycle can be handled per tenant.</text>
</svg>
