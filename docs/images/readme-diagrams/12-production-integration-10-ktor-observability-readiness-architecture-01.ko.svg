<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Ktor 관측성 provider 아키텍처</title>
  <desc id="desc">bluetape4k Ktor 관측성 provider가 correlation과 call logging을 소유하고 JDBC 워크숍 애플리케이션이 StatusPages, routes, diagnostics, structured response를 소유한다.</desc>
  <defs>
    <style>
      text { letter-spacing: 0; }
      .title { font-family: "goorm Sans"; font-size: 40px; fill: #23323a; }
      .subtitle, .laneNote, .cardText, .label, .footer { font-family: "goorm Sans Code"; fill: #324750; }
      .subtitle { font-size: 17px; }
      .laneTitle { font-family: "goorm Sans"; font-size: 24px; fill: #23323a; }
      .laneNote { font-size: 13px; fill: #5b6d75; }
      .cardTitle { font-family: "goorm Sans"; font-size: 22px; fill: #20323b; }
      .cardText { font-size: 14px; }
      .providerText { font-size: 12px; }
      .label { font-size: 13px; font-weight: 700; }
      .footer { font-size: 14px; fill: #60717a; }
      .canvas { fill: #fbfcf8; stroke: #3f515a; stroke-width: 3; }
      .lane { stroke-width: 2.1; }
      .laneHttp { fill: #fff7e8; stroke: #b98e50; }
      .laneKtor { fill: #f2f0fb; stroke: #897bc2; }
      .laneStore { fill: #eef7f5; stroke: #6fa098; }
      .laneContract { fill: #f4f6f5; stroke: #8a9aa0; }
      .card { fill: #ffffff; stroke-width: 2.2; }
      .httpCard { stroke: #ac7a34; }
      .ktorCard { stroke: #7b6bb4; }
      .storeCard { stroke: #5d948b; }
      .contractCard { stroke: #69777e; }
      .flowHttp { fill: none; stroke: #a2743d; stroke-width: 4.2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowHttp); }
      .flowKtor { fill: none; stroke: #7667b1; stroke-width: 4.2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowKtor); }
      .flowStore { fill: none; stroke: #3f8e84; stroke-width: 4.2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowStore); }
      .flowContract { fill: none; stroke: #69777e; stroke-width: 4.2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowContract); }
    </style>
    <marker id="arrowHttp" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto" data-role="primary" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#a2743d" stroke="#a2743d" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="arrowKtor" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto" data-role="primary" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#7667b1" stroke="#7667b1" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="arrowStore" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto" data-role="primary" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#3f8e84" stroke="#3f8e84" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="arrowContract" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto" data-role="primary" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#69777e" stroke="#69777e" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="1000" fill="#fbfcf8"/>
  <rect x="24" y="24" width="1552" height="952" rx="20" class="canvas"/>
  <text x="800" y="78" text-anchor="middle" class="title">Ktor 관측성 Provider</text>
  <text x="800" y="110" text-anchor="middle" class="subtitle">중앙 provider는 correlation과 logging을 설치하고 JDBC 워크숍은 route·오류·diagnostics 계약을 유지합니다.</text>

  <rect x="70" y="158" width="300" height="700" rx="18" class="lane laneHttp"/>
  <text x="104" y="198" class="laneTitle">Ktor 애플리케이션</text>
  <text x="104" y="224" class="laneNote">module과 HTTP route.</text>

  <rect x="410" y="158" width="360" height="700" rx="18" class="lane laneKtor"/>
  <text x="444" y="198" class="laneTitle">bluetape4k provider</text>
  <text x="444" y="224" class="laneNote">중앙 correlation과 logging.</text>

  <rect x="810" y="158" width="320" height="700" rx="18" class="lane laneStore"/>
  <text x="844" y="198" class="laneTitle">애플리케이션 계약</text>
  <text x="844" y="224" class="laneNote">오류와 structured response.</text>

  <rect x="1170" y="158" width="330" height="700" rx="18" class="lane laneContract"/>
  <text x="1204" y="198" class="laneTitle">JDBC diagnostics</text>
  <text x="1204" y="224" class="laneNote">Exposed repository와 H2.</text>

  <rect id="module" x="100" y="240" width="240" height="100" rx="12" class="card httpCard"/>
  <text x="220" y="275" text-anchor="middle" class="cardTitle">Application module</text>
  <text x="128" y="303" class="cardText">ktorObservabilityReadinessModule</text>
  <text x="128" y="323" class="cardText">CIO + lifecycle cleanup</text>

  <rect id="routes" x="100" y="480" width="240" height="110" rx="12" class="card httpCard"/>
  <text x="220" y="516" text-anchor="middle" class="cardTitle">HTTP routes</text>
  <text x="128" y="546" class="cardText">GET /readyz</text>
  <text x="128" y="566" class="cardText">/diagnostics/operations</text>
  <text x="128" y="586" class="cardText">/{name}?delayMs=</text>

  <rect id="provider" x="450" y="230" width="280" height="100" rx="12" class="card ktorCard"/>
  <text x="590" y="265" text-anchor="middle" class="cardTitle">Provider installer</text>
  <text x="478" y="293" class="cardText providerText">installBluetape4kKtorObservability</text>
  <text x="478" y="313" class="cardText">애플리케이션 startup에서 한 번 호출</text>

  <rect id="correlation" x="450" y="350" width="280" height="100" rx="12" class="card ktorCard"/>
  <text x="590" y="385" text-anchor="middle" class="cardTitle">Correlation 정책</text>
  <text x="478" y="413" class="cardText">X-Request-ID trim + filter</text>
  <text x="478" y="433" class="cardText">max 120 / 16자 Base58</text>

  <rect id="logging" x="450" y="510" width="280" height="90" rx="12" class="card ktorCard"/>
  <text x="590" y="545" text-anchor="middle" class="cardTitle">CallLogging</text>
  <text x="478" y="573" class="cardText">MDC callId + request format</text>

  <rect id="telemetry" x="450" y="660" width="280" height="90" rx="12" class="card ktorCard"/>
  <text x="590" y="695" text-anchor="middle" class="cardTitle">Optional telemetry</text>
  <text x="478" y="723" class="cardText">Micrometer / tracing 기본 off</text>

  <rect id="status" x="850" y="480" width="240" height="110" rx="12" class="card storeCard"/>
  <text x="970" y="516" text-anchor="middle" class="cardTitle">StatusPages</text>
  <text x="878" y="546" class="cardText">400 / 500 ErrorResponse</text>
  <text x="878" y="566" class="cardText">CancellationException rethrow</text>
  <text x="878" y="586" class="cardText">callId에서 requestId 읽기</text>

  <rect id="response" x="850" y="660" width="240" height="100" rx="12" class="card storeCard"/>
  <text x="970" y="695" text-anchor="middle" class="cardTitle">Reader 계약</text>
  <text x="878" y="723" class="cardText">X-Request-ID response header</text>
  <text x="878" y="743" class="cardText">JSON 오류 + /readyz status</text>

  <rect id="service" x="1210" y="270" width="250" height="110" rx="12" class="card contractCard"/>
  <text x="1335" y="306" text-anchor="middle" class="cardTitle">DiagnosticsService</text>
  <text x="1238" y="336" class="cardText">suspend runOperation</text>
  <text x="1238" y="356" class="cardText">slow threshold 10ms</text>

  <rect id="jdbc" x="1210" y="500" width="250" height="120" rx="12" class="card contractCard"/>
  <text x="1335" y="536" text-anchor="middle" class="cardTitle">Exposed JDBC</text>
  <text x="1238" y="566" class="cardText">repository + transactionIO</text>
  <text x="1238" y="586" class="cardText">in-memory H2 diagnostics</text>
  <text x="1238" y="606" class="cardText">request_id, duration_ms, slow</text>

  <path id="flow-module-routes" data-connector="flow-module-routes" d="M 220 340 V 480" class="flowHttp"/>
  <path id="flow-module-provider" data-connector="flow-module-provider" d="M 340 290 H 450" class="flowHttp"/>
  <path id="flow-provider-correlation" data-connector="flow-provider-correlation" d="M 590 330 V 350" class="flowKtor"/>
  <path id="flow-correlation-logging" data-connector="flow-correlation-logging" d="M 590 450 V 510" class="flowKtor"/>
  <path id="flow-logging-telemetry" data-connector="flow-logging-telemetry" d="M 590 600 V 660" class="flowKtor"/>
  <path id="flow-routes-service" data-connector="flow-routes-service" d="M 340 515 H 390 Q 410 515 410 535 V 800 Q 410 820 430 820 H 800 Q 820 820 820 800 V 345 Q 820 325 840 325 H 1210" class="flowHttp"/>
  <path id="flow-service-jdbc" data-connector="flow-service-jdbc" d="M 1335 380 V 500" class="flowContract"/>
  <path id="flow-routes-status" data-connector="flow-routes-status" d="M 340 550 H 370 Q 390 550 390 570 V 820 Q 390 840 410 840 H 810 Q 830 840 830 820 V 570 Q 830 550 850 550" class="flowHttp"/>
  <path id="flow-status-response" data-connector="flow-status-response" d="M 970 590 V 660" class="flowStore"/>

  <text x="250" y="398" text-anchor="middle" class="label">bootstrap</text>
  <text x="395" y="275" text-anchor="middle" class="label">install</text>
  <text x="612" y="342" text-anchor="middle" class="label">settings</text>
  <text x="612" y="490" text-anchor="middle" class="label">MDC</text>
  <text x="612" y="645" text-anchor="middle" class="label">opt-in</text>
  <text x="900" y="306" text-anchor="middle" class="label">operation</text>
  <text x="1360" y="440" text-anchor="middle" class="label">record</text>
  <text x="595" y="535" text-anchor="middle" class="label">error</text>
  <text x="1000" y="630" text-anchor="middle" class="label">response</text>

  <text x="800" y="920" text-anchor="middle" class="footer">JDBC-only workshop 경계: provider는 CallId/CallLogging, 애플리케이션은 StatusPages·routes·Exposed diagnostics를 소유합니다.</text>
</svg>
