<svg xmlns="http://www.w3.org/2000/svg" width="1376" height="1676" viewBox="0 0 1376 1676" role="img" aria-label="CRUD Sequence Diagram">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#758297" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 0 1 L 12 6 L 0 11 Z" fill="#ffffff" stroke="#758297" stroke-width="1.8"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="1376" height="1676"/>
<rect class="frame" x="32" y="28" width="1312" height="1620" rx="28"/>
<text class="title" x="66" y="82">CRUD Sequence Diagram</text>
<text class="subtitle" x="70" y="118">Sequence messages from the original Mermaid source</text>
<rect class="card" x="21" y="166" width="238" height="72" rx="20" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="140" y="209" text-anchor="middle">Application</text>
<line class="lifeline" x1="140" y1="252" x2="140" y2="1616" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="386.3333333333333" y="166" width="238" height="72" rx="20" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="505.3333333333333" y="209" text-anchor="middle">transaction { }</text>
<line class="lifeline" x1="505.3333333333333" y1="252" x2="505.3333333333333" y2="1616" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="751.6666666666666" y="166" width="238" height="72" rx="20" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="870.6666666666666" y="209" text-anchor="middle">Exposed DSL</text>
<line class="lifeline" x1="870.6666666666666" y1="252" x2="870.6666666666666" y2="1616" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="1117" y="166" width="238" height="72" rx="20" fill="#FDECEF" stroke="#DC6B82"/>
<text class="smallLabel" x="1236" y="209" text-anchor="middle">Database</text>
<line class="lifeline" x1="1236" y1="252" x2="1236" y2="1616" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect x="217.66666666666663" y="286" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="235.66666666666663" y="313" text-anchor="start">1. transaction { }</text>
<path class="line" d="M140 344 L505.3333333333333 344"/>
<rect x="520.5" y="396" width="335" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="538.5" y="423" text-anchor="start">2. Cities.insert { it[name] = Seoul }</text>
<path class="line" d="M505.3333333333333 454 L870.6666666666666 454"/>
<rect x="934.3333333333333" y="506" width="238" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="952.3333333333333" y="533" text-anchor="start">3. INSERT INTO cities ...</text>
<path class="line" d="M870.6666666666666 564 L1236 564"/>
<rect x="948.3333333333333" y="616" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="966.3333333333333" y="643" text-anchor="start">4. generated id</text>
<path class="dashed" d="M1236 674 L870.6666666666666 674"/>
<rect x="528.5" y="726" width="319" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="546.5" y="753" text-anchor="start">5. Cities.selectAll().where { ... }</text>
<path class="line" d="M505.3333333333333 784 L870.6666666666666 784"/>
<rect x="902.3333333333333" y="836" width="302" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="920.3333333333333" y="863" text-anchor="start">6. SELECT * FROM cities WHERE ...</text>
<path class="line" d="M870.6666666666666 894 L1236 894"/>
<rect x="948.3333333333333" y="946" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="966.3333333333333" y="973" text-anchor="start">7. ResultRow list</text>
<path class="dashed" d="M1236 1004 L870.6666666666666 1004"/>
<rect x="468.5" y="1056" width="439" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="486.5" y="1083" text-anchor="start">8. Cities.update({ id eq 1 }) { it[name] = Busan }</text>
<path class="line" d="M505.3333333333333 1114 L870.6666666666666 1114"/>
<rect x="849.8333333333333" y="1166" width="407" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="867.8333333333333" y="1193" text-anchor="start">9. UPDATE cities SET name = Busan WHERE id = 1</text>
<path class="line" d="M870.6666666666666 1224 L1236 1224"/>
<rect x="532.5" y="1276" width="311" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="550.5" y="1303" text-anchor="start">10. Cities.deleteWhere { id eq 1 }</text>
<path class="line" d="M505.3333333333333 1334 L870.6666666666666 1334"/>
<rect x="893.8333333333333" y="1386" width="319" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="911.8333333333333" y="1413" text-anchor="start">11. DELETE FROM cities WHERE id = 1</text>
<path class="line" d="M870.6666666666666 1444 L1236 1444"/>
<rect x="217.66666666666663" y="1496" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="235.66666666666663" y="1523" text-anchor="start">12. COMMIT</text>
<path class="dashed" d="M505.3333333333333 1554 L140 1554"/>
</svg>
