<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 880" width="1500" height="880" role="img" aria-labelledby="title desc">
<title id="title">Exposed DML test operation sequence</title>
<desc id="desc">CRUD and advanced query tests share schema setup, sample data, DSL execution, generated SQL, and assertion phases.</desc>
<defs>
<style>
text{letter-spacing:0}
.frame{fill:#fbfcf8;stroke:#41545d;stroke-width:3}
.title{font-family:"Architects Daughter";font-size:38px;font-weight:400;fill:#263238}
.subtitle,.msg,.note,.footer,.role{font-family:"Comic Mono";fill:#36464f}
.subtitle{font-size:17px}.participant{font-family:"Architects Daughter";font-size:18px;font-weight:400;fill:#1f3138}.role{font-size:12px;fill:#546a73}
.msg{font-size:13px}.note{font-size:13px}.footer{font-size:13px;fill:#60727d}
.header{fill:#ffffff;stroke:#546e7a;stroke-width:2}.lifeline{stroke:#9aaab1;stroke-width:2;stroke-dasharray:7 8}
.activation{fill:#f3ecdf;stroke:#8f784e;stroke-width:1.5}
.call{fill:none;stroke:#3f7d9c;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowCall)}
.sql{fill:none;stroke:#a2743d;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowSql)}
.state{fill:none;stroke:#6e8f4f;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowState)}
.return{fill:none;stroke:#9b7d54;stroke-width:2.5;stroke-dasharray:8 6;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowReturn)}
.label{fill:#ffffff;stroke:#d7e0e4;stroke-width:1.5}.label.callLabel{stroke:#9cc2d1}.label.sqlLabel{stroke:#d0b078}.label.stateLabel{stroke:#b6c9a4}.label.returnLabel{stroke:#c8b38f}
.badge{stroke-width:1.8}.badge.callBadge{fill:#eaf4f8;stroke:#3f7d9c}.badge.sqlBadge{fill:#fff4df;stroke:#a2743d}.badge.stateBadge{fill:#eef7f0;stroke:#6e8f4f}.badge.returnBadge{fill:#fff7e8;stroke:#9b7d54}
.badgeText{font-family:"Comic Mono";font-size:12px;font-weight:700}
.msg.callText,.badgeText.callText{fill:#2f6f8e}.msg.sqlText,.badgeText.sqlText{fill:#855a29}.msg.stateText,.badgeText.stateText{fill:#55783f}.msg.returnText,.badgeText.returnText{fill:#7f6038}
</style>
<marker id="arrowCall" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" refX="9" refY="5" orient="auto" data-role="sequence" data-tip-direction="positive-x">
<path d="M 0 0 L 10 5 L 0 10 Z" fill="#3f7d9c" stroke="#3f7d9c" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
</marker>
<marker id="arrowSql" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" refX="9" refY="5" orient="auto" data-role="sequence" data-tip-direction="positive-x">
<path d="M 0 0 L 10 5 L 0 10 Z" fill="#a2743d" stroke="#a2743d" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
</marker>
<marker id="arrowState" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" refX="9" refY="5" orient="auto" data-role="sequence" data-tip-direction="positive-x">
<path d="M 0 0 L 10 5 L 0 10 Z" fill="#6e8f4f" stroke="#6e8f4f" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
</marker>
<marker id="arrowReturn" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" refX="9" refY="5" orient="auto" data-role="sequence" data-tip-direction="positive-x">
<path d="M 0 0 L 10 5 L 0 10 Z" fill="#9b7d54" stroke="#9b7d54" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
</marker>
</defs>
<rect x="24" y="24" width="1452" height="832" rx="20" class="frame"/>
<text x="750" y="72" text-anchor="middle" class="title">Exposed DML Test Operation Sequence</text>
<text x="750" y="102" text-anchor="middle" class="subtitle">CRUD and advanced query tests share schema setup, sample data, DSL execution, and assertion phases.</text>

<g id="participants">
<rect x="34" y="142" width="140" height="64" rx="10" class="header"/>
<text x="104" y="169" text-anchor="middle" class="participant">Test method</text>
<text x="104" y="190" text-anchor="middle" class="role">JUnit case</text>
<rect x="246" y="142" width="160" height="64" rx="10" class="header"/>
<text x="326" y="169" text-anchor="middle" class="participant">withTables</text>
<text x="326" y="190" text-anchor="middle" class="role">schema fixture</text>
<rect x="472" y="142" width="176" height="64" rx="10" class="header"/>
<text x="560" y="169" text-anchor="middle" class="participant">DMLTestData</text>
<text x="560" y="190" text-anchor="middle" class="role">seed rows</text>
<rect x="720" y="142" width="164" height="64" rx="10" class="header"/>
<text x="802" y="169" text-anchor="middle" class="participant">Exposed DSL</text>
<text x="802" y="190" text-anchor="middle" class="role">query builder</text>
<rect x="958" y="142" width="164" height="64" rx="10" class="header"/>
<text x="1040" y="169" text-anchor="middle" class="participant">Dialect DB</text>
<text x="1040" y="190" text-anchor="middle" class="role">SQL execution</text>
<rect x="1198" y="142" width="164" height="64" rx="10" class="header"/>
<text x="1280" y="169" text-anchor="middle" class="participant">Assertions</text>
<text x="1280" y="190" text-anchor="middle" class="role">shape checks</text>
</g>

<line x1="104" y1="206" x2="104" y2="768" class="lifeline"/>
<line x1="326" y1="206" x2="326" y2="768" class="lifeline"/>
<line x1="560" y1="206" x2="560" y2="768" class="lifeline"/>
<line x1="802" y1="206" x2="802" y2="768" class="lifeline"/>
<line x1="1040" y1="206" x2="1040" y2="768" class="lifeline"/>
<line x1="1280" y1="206" x2="1280" y2="768" class="lifeline"/>

<rect x="319" y="260" width="14" height="500" rx="6" class="activation"/>
<rect x="553" y="322" width="14" height="100" rx="6" class="activation"/>
<rect x="795" y="470" width="14" height="208" rx="6" class="activation"/>
<rect x="1033" y="380" width="14" height="242" rx="6" class="activation"/>
<rect x="1273" y="652" width="14" height="78" rx="6" class="activation"/>

<rect x="70" y="224" width="260" height="34" rx="17" class="label callLabel"/>
<circle cx="94" cy="241" r="13" class="badge callBadge"/><text x="94" y="246" text-anchor="middle" class="badgeText callText">1</text>
<text x="118" y="246" class="msg callText">start dialect test</text>
<path d="M 104 274 L 319 274" class="call"/>

<rect x="286" y="286" width="300" height="34" rx="17" class="label callLabel"/>
<circle cx="310" cy="303" r="13" class="badge callBadge"/><text x="310" y="308" text-anchor="middle" class="badgeText callText">2</text>
<text x="334" y="308" class="msg callText">create shared tables</text>
<path d="M 333 336 L 553 336" class="call"/>

<rect x="610" y="348" width="360" height="34" rx="17" class="label stateLabel"/>
<circle cx="634" cy="365" r="13" class="badge stateBadge"/><text x="634" y="370" text-anchor="middle" class="badgeText stateText">3</text>
<text x="658" y="370" class="msg stateText">seed Cities / Users / Sales</text>
<path d="M 567 398 L 1033 398" class="state"/>

<rect x="284" y="432" width="330" height="34" rx="17" class="label callLabel"/>
<circle cx="308" cy="449" r="13" class="badge callBadge"/><text x="308" y="454" text-anchor="middle" class="badgeText callText">4</text>
<text x="332" y="454" class="msg callText">build DSL statement</text>
<path d="M 104 482 L 795 482" class="call"/>

<rect x="822" y="494" width="342" height="34" rx="17" class="label sqlLabel"/>
<circle cx="846" cy="511" r="13" class="badge sqlBadge"/><text x="846" y="516" text-anchor="middle" class="badgeText sqlText">5</text>
<text x="870" y="516" class="msg sqlText">execute generated SQL</text>
<path d="M 809 544 L 1033 544" class="sql"/>

<rect x="828" y="556" width="356" height="34" rx="17" class="label returnLabel"/>
<circle cx="852" cy="573" r="13" class="badge returnBadge"/><text x="852" y="578" text-anchor="middle" class="badgeText returnText">6</text>
<text x="876" y="578" class="msg returnText">ResultRow / update count</text>
<path d="M 1033 606 L 809 606" class="return"/>

<rect x="922" y="618" width="372" height="34" rx="17" class="label stateLabel"/>
<circle cx="946" cy="635" r="13" class="badge stateBadge"/><text x="946" y="640" text-anchor="middle" class="badgeText stateText">7</text>
<text x="970" y="640" class="msg stateText">verify expected row shape</text>
<path d="M 809 668 L 1273 668" class="state"/>

<rect x="110" y="700" width="318" height="34" rx="17" class="label returnLabel"/>
<circle cx="134" cy="717" r="13" class="badge returnBadge"/><text x="134" y="722" text-anchor="middle" class="badgeText returnText">8</text>
<text x="158" y="722" class="msg returnText">drop tables / rollback</text>
<path d="M 319 750 L 104 750" class="return"/>

<rect x="98" y="782" width="1304" height="42" rx="12" fill="#ffffff" stroke="#ccd7da" stroke-width="2"/>
<text x="118" y="808" class="note">CRUD, join/group, upsert/merge, returning, and CTE examples reuse the same setup -> execute -> assert lifecycle.</text>
<text x="750" y="842" text-anchor="middle" class="footer">github.com/bluetape4k/exposed-workshop - 05-exposed-dml/01-dml</text>
</svg>
