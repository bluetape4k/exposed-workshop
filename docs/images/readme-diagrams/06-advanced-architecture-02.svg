<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 780" width="1560" height="780" role="img" aria-label="Advanced Module Classification">
<defs>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/></filter>
<marker id="arrowBlue" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2563eb" stroke="#2563eb" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
<marker id="arrowGreen" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#16a34a" stroke="#16a34a" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
<marker id="arrowPink" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#db2777" stroke="#db2777" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
<marker id="arrowOrange" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#ea580c" stroke="#ea580c" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
<marker id="arrowPurple" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#7c3aed" stroke="#7c3aed" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
<style>
.canvas{fill:#f6f9fc}.frame{fill:#fff;stroke:#d7e2ec;stroke-width:1.5}
.title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:31px;fill:#1e293b}
.subtitle,.detail{font-family:"Comic Mono","Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;fill:#536476}
.subtitle{font-size:13px}.detail{font-size:12px}.tiny{font-family:"Comic Mono","Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:10px;fill:#64748b}
.label{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:16px;fill:#1e293b}
.panelTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:12px;letter-spacing:.08em;fill:#94a3b8}
.card{stroke-width:1.7;filter:url(#shadow)}.panel{fill:#f8fafc;stroke:#d7e2ec;stroke-width:1.2}
.arrow{fill:none;stroke:#2563eb;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowBlue)}
.mapLine{fill:none;stroke:#16a34a;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowGreen)}
.codecLine{fill:none;stroke:#db2777;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowPink)}
.dbUse{fill:none;stroke:#ea580c;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowOrange)}
.runtimeUse{fill:none;stroke:#7c3aed;stroke-width:1.9;stroke-dasharray:6 5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowPurple)}
.inheritStem{fill:none;stroke:#475569;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
</style>
</defs>
<rect width="1560" height="780" class="canvas"/>
<rect x="20" y="20" width="1520" height="740" rx="16" class="frame"/>
<text x="48" y="58" class="title">Advanced Module Classification</text>
<text x="48" y="80" class="subtitle">Current advanced source directories group examples by value type, JSON serialization, encryption, and custom extension mechanisms</text>
<rect x="58" y="140" width="1444" height="220" rx="12" class="panel"/><text x="780" y="132" class="panelTitle" text-anchor="middle">PROBLEM DOMAINS</text>
<desc>Protect data</desc><rect x="90" y="220" width="190" height="70" rx="10" fill="#fce7f3" stroke="#db2777" class="card"/>
<text x="185" y="245" class="label" text-anchor="middle">Protect data</text>
<text x="185" y="276" class="detail" text-anchor="middle">01 crypt / 12 Tink</text>
<desc>Represent values</desc><rect x="310" y="220" width="190" height="70" rx="10" fill="#fef3c7" stroke="#d97706" class="card"/>
<text x="405" y="245" class="label" text-anchor="middle">Represent values</text>
<text x="405" y="276" class="detail" text-anchor="middle">02/03 time + 05 money</text>
<desc>Extend columns</desc><rect x="530" y="220" width="190" height="70" rx="10" fill="#ccfbf1" stroke="#0f766e" class="card"/>
<text x="625" y="245" class="label" text-anchor="middle">Extend columns</text>
<text x="625" y="276" class="detail" text-anchor="middle">06 custom-columns</text>
<desc>Store JSON</desc><rect x="750" y="220" width="190" height="70" rx="10" fill="#ede9fe" stroke="#7c3aed" class="card"/>
<text x="845" y="245" class="label" text-anchor="middle">Store JSON</text>
<text x="845" y="276" class="detail" text-anchor="middle">04/08/09/11 serializers</text>
<desc>Extend IDs</desc><rect x="970" y="220" width="190" height="70" rx="10" fill="#ffedd5" stroke="#ea580c" class="card"/>
<text x="1065" y="245" class="label" text-anchor="middle">Extend IDs</text>
<text x="1065" y="276" class="detail" text-anchor="middle">07 custom-entities</text>
<desc>Validate behavior</desc><rect x="1190" y="220" width="190" height="70" rx="10" fill="#e2e8f0" stroke="#64748b" class="card"/>
<text x="1285" y="245" class="label" text-anchor="middle">Validate behavior</text>
<text x="1285" y="276" class="detail" text-anchor="middle">round-trip tests</text>
<rect x="58" y="430" width="1444" height="210" rx="12" class="panel"/><text x="930" y="422" class="panelTitle" text-anchor="middle">IMPLEMENTATION MECHANISMS</text>
<desc>Encryption wrappers</desc><rect x="90" y="512" width="220" height="72" rx="10" fill="#fce7f3" stroke="#db2777" class="card"/>
<text x="200" y="537" class="label" text-anchor="middle">Encryption wrappers</text>
<text x="200" y="570" class="detail" text-anchor="middle">crypt/AEAD/DAEAD</text>
<desc>ColumnType adapters</desc><rect x="390" y="512" width="220" height="72" rx="10" fill="#dcfce7" stroke="#16a34a" class="card"/>
<text x="500" y="537" class="label" text-anchor="middle">ColumnType adapters</text>
<text x="500" y="570" class="detail" text-anchor="middle">conversion boundary</text>
<desc>JSON operators</desc><rect x="690" y="512" width="220" height="72" rx="10" fill="#ede9fe" stroke="#7c3aed" class="card"/>
<text x="800" y="537" class="label" text-anchor="middle">JSON operators</text>
<text x="800" y="570" class="detail" text-anchor="middle">extract/contains/exists</text>
<desc>EntityID bases</desc><rect x="970" y="512" width="220" height="72" rx="10" fill="#fef3c7" stroke="#d97706" class="card"/>
<text x="1080" y="537" class="label" text-anchor="middle">EntityID bases</text>
<text x="1080" y="570" class="detail" text-anchor="middle">KSUID/Snowflake/UUID</text>
<desc>DAO + DSL fixtures</desc><rect x="1240" y="512" width="220" height="72" rx="10" fill="#dbeafe" stroke="#3b82f6" class="card"/>
<text x="1350" y="537" class="label" text-anchor="middle">DAO + DSL fixtures</text>
<text x="1350" y="570" class="detail" text-anchor="middle">source-backed tests</text>
<path data-connector="protect-data-to-encryption" d="M185,290 L185,512" class="codecLine"/>
<path data-connector="represent-values-to-columntype" d="M405,290 L405,388 Q405,400 417,400 L433,400 Q445,400 445,412 L445,512" class="mapLine"/>
<path data-connector="extend-columns-to-columntype" d="M625,290 L625,382 Q625,394 613,394 L532,394 Q520,394 520,406 L520,512" class="mapLine"/>
<path data-connector="store-json-to-json-operators" d="M845,290 L845,388 Q845,400 833,400 L812,400 Q800,400 800,412 L800,512" class="arrow"/>
<path data-connector="extend-ids-to-entityid" d="M1065,290 L1065,512" class="dbUse"/>
<path data-connector="validate-behavior-to-fixtures" d="M1285,290 L1285,388 Q1285,400 1297,400 L1318,400 Q1330,400 1330,412 L1330,512" class="runtimeUse"/>
<rect x="142" y="690" width="1200" height="52" rx="10" fill="#ecfdf5" stroke="#86efac" stroke-width="1.3"/>
<text x="742" y="721" class="detail" text-anchor="middle">Classification rule: group by current source directories and tested extension mechanisms, not by stale or missing chapter rows.</text>
</svg>
