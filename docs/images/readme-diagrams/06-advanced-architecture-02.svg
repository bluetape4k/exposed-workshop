<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 900" width="1500" height="900" role="img" aria-label="Advanced Module Classification">
<defs>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/></filter>
<marker id="arrowBlue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8 Z" fill="#2563eb"/></marker>
<marker id="arrowGreen" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8 Z" fill="#16a34a"/></marker>
<marker id="arrowTeal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8 Z" fill="#0f766e"/></marker>
<marker id="arrowPurple" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8 Z" fill="#7c3aed"/></marker>
<marker id="arrowOrange" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8 Z" fill="#ea580c"/></marker>
<style>
.canvas{fill:#f6f9fc}.frame{fill:#fff;stroke:#d7e2ec;stroke-width:1.5}
.title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:31px;fill:#1e293b}
.subtitle,.detail{font-family:"Comic Mono","Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;fill:#536476}
.subtitle{font-size:13px}.detail{font-size:12px}.tiny{font-family:"Comic Mono","Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:10px;fill:#64748b}
.label{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:16px;fill:#1e293b}
.panelTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:12px;letter-spacing:.08em;fill:#94a3b8}
.card{stroke-width:1.7;filter:url(#shadow)}.panel{fill:#f8fafc;stroke:#d7e2ec;stroke-width:1.2}
.arrow{fill:none;stroke:#2563eb;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowBlue)}
.mapLine{fill:none;stroke:#16a34a;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowGreen)}
.fkLine{fill:none;stroke:#0f766e;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowTeal)}
.runtimeUse{fill:none;stroke:#7c3aed;stroke-width:1.9;stroke-dasharray:6 5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowPurple)}
.dbUse{fill:none;stroke:#ea580c;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowOrange)}
.inheritStem{fill:none;stroke:#475569;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
</style>
</defs>
<rect width="1500" height="900" class="canvas"/>
<rect x="20" y="20" width="1460" height="860" rx="16" class="frame"/>
<text x="48" y="58" class="title">Advanced Module Classification</text>
<text x="48" y="80" class="subtitle">Existing source directories group advanced examples by security, value types, JSON serialization, and custom extension points</text>
<rect x="64" y="132" width="642" height="608" rx="12" class="panel"/><text x="385" y="124" class="panelTitle" text-anchor="middle">PROBLEM DOMAINS</text>
<rect x="106" y="190" width="244" height="78" rx="10" fill="#fce7f3" stroke="#db2777" class="card"/>
<text x="228" y="215" class="label" text-anchor="middle">Protect sensitive data</text>
<text x="228" y="254" class="detail" text-anchor="middle">encrypted columns</text>
<rect x="106" y="326" width="244" height="78" rx="10" fill="#fef3c7" stroke="#d97706" class="card"/>
<text x="228" y="351" class="label" text-anchor="middle">Represent value types</text>
<text x="228" y="390" class="detail" text-anchor="middle">time / money</text>
<rect x="106" y="462" width="244" height="78" rx="10" fill="#ede9fe" stroke="#7c3aed" class="card"/>
<text x="228" y="487" class="label" text-anchor="middle">Persist structured data</text>
<text x="228" y="526" class="detail" text-anchor="middle">JSON documents</text>
<rect x="106" y="598" width="244" height="78" rx="10" fill="#ccfbf1" stroke="#0f766e" class="card"/>
<text x="228" y="623" class="label" text-anchor="middle">Extend identity /</text>
<text x="228" y="641" class="label" text-anchor="middle">columns</text>
<text x="228" y="662" class="detail" text-anchor="middle">custom ID and types</text>
<rect x="414" y="190" width="244" height="78" rx="10" fill="#fce7f3" stroke="#db2777" class="card"/>
<text x="536" y="215" class="label" text-anchor="middle">01 exposed-crypt</text>
<text x="536" y="254" class="detail" text-anchor="middle">encryptedVarchar/Binary</text>
<rect x="414" y="290" width="244" height="78" rx="10" fill="#ffedd5" stroke="#ea580c" class="card"/>
<text x="536" y="315" class="label" text-anchor="middle">12 exposed-tink</text>
<text x="536" y="354" class="detail" text-anchor="middle">AEAD/DAEAD</text>
<rect x="414" y="410" width="244" height="78" rx="10" fill="#fef3c7" stroke="#d97706" class="card"/>
<text x="536" y="435" class="label" text-anchor="middle">02/03 date-time</text>
<text x="536" y="474" class="detail" text-anchor="middle">Java + Kotlin time</text>
<rect x="414" y="510" width="244" height="78" rx="10" fill="#dcfce7" stroke="#16a34a" class="card"/>
<text x="536" y="535" class="label" text-anchor="middle">05 exposed-money</text>
<text x="536" y="574" class="detail" text-anchor="middle">amount + currency</text>
<rect x="794" y="132" width="642" height="608" rx="12" class="panel"/><text x="1115" y="124" class="panelTitle" text-anchor="middle">IMPLEMENTATION MECHANISMS</text>
<rect x="836" y="190" width="244" height="78" rx="10" fill="#ede9fe" stroke="#7c3aed" class="card"/>
<text x="958" y="215" class="label" text-anchor="middle">04 exposed-json</text>
<text x="958" y="254" class="detail" text-anchor="middle">json/jsonb paths</text>
<rect x="836" y="290" width="244" height="78" rx="10" fill="#dbeafe" stroke="#3b82f6" class="card"/>
<text x="958" y="315" class="label" text-anchor="middle">08/09/11 serializers</text>
<text x="958" y="354" class="detail" text-anchor="middle">Jackson/Fastjson</text>
<rect x="836" y="410" width="244" height="78" rx="10" fill="#ccfbf1" stroke="#0f766e" class="card"/>
<text x="958" y="435" class="label" text-anchor="middle">06 custom-columns</text>
<text x="958" y="474" class="detail" text-anchor="middle">binary/blob/string</text>
<rect x="836" y="510" width="244" height="78" rx="10" fill="#fef3c7" stroke="#d97706" class="card"/>
<text x="958" y="535" class="label" text-anchor="middle">07 custom-entities</text>
<text x="958" y="574" class="detail" text-anchor="middle">KSUID/Snowflake/UUID</text>
<rect x="1150" y="260" width="220" height="78" rx="10" fill="#e2e8f0" stroke="#64748b" class="card"/>
<text x="1260" y="285" class="label" text-anchor="middle">ColumnType</text>
<text x="1260" y="324" class="detail" text-anchor="middle">database conversion</text>
<rect x="1150" y="460" width="220" height="78" rx="10" fill="#e2e8f0" stroke="#64748b" class="card"/>
<text x="1260" y="485" class="label" text-anchor="middle">EntityID</text>
<text x="1260" y="524" class="detail" text-anchor="middle">typed primary keys</text>
<path d="M350,229 L414,229" class="arrow"/>
<path d="M350,365 L382,365 L382,449 L414,449" class="arrow"/>
<path d="M350,501 L736,501 L736,229 L836,229" class="arrow"/>
<path d="M350,637 L736,637 L736,449 L836,449" class="arrow"/>
<path d="M658,229 L730,229 L730,299 L1150,299" class="runtimeUse"/>
<path d="M1080,229 L1116,229 L1116,299 L1150,299" class="runtimeUse"/>
<path d="M1080,449 L1116,449 L1116,499 L1150,499" class="runtimeUse"/>
<rect x="116" y="796" width="1268" height="52" rx="10" fill="#ecfdf5" stroke="#86efac" stroke-width="1.3"/>
<text x="750" y="827" class="detail" text-anchor="middle">Classification rule: modules are grouped by current source directories and tested extension mechanisms, not by stale or missing chapter rows.</text>
</svg>
