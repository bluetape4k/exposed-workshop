<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 780" width="1560" height="780" role="img" aria-label="Advanced Module Classification">
<defs>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/></filter>
<marker id="arrowBlue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8 Z" fill="#2563eb"/></marker>
<marker id="arrowGreen" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8 Z" fill="#16a34a"/></marker>
<marker id="arrowPink" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8 Z" fill="#db2777"/></marker>
<marker id="arrowOrange" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8 Z" fill="#ea580c"/></marker>
<marker id="arrowPurple" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8 Z" fill="#7c3aed"/></marker>
<style>
.canvas{fill:#f6f9fc}.frame{fill:#fff;stroke:#d7e2ec;stroke-width:1.5}
.title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:31px;fill:#1e293b}
.subtitle,.detail{font-family:"Comic Mono","Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;fill:#536476}
.subtitle{font-size:13px}.detail{font-size:12px}.tiny{font-family:"Comic Mono","Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:10px;fill:#64748b}
.label{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:16px;fill:#1e293b}
.panelTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:12px;letter-spacing:.08em;fill:#94a3b8}
.card{stroke-width:1.7;filter:url(#shadow)}.panel{fill:#f8fafc;stroke:#d7e2ec;stroke-width:1.2}
.arrow{fill:none;stroke:#2563eb;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowBlue)}
.mapLine{fill:none;stroke:#16a34a;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowGreen)}
.codecLine{fill:none;stroke:#db2777;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowPink)}
.dbUse{fill:none;stroke:#ea580c;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowOrange)}
.runtimeUse{fill:none;stroke:#7c3aed;stroke-width:1.9;stroke-dasharray:6 5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowPurple)}
.inheritStem{fill:none;stroke:#475569;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
</style>
</defs>
<rect width="1560" height="780" class="canvas"/>
<rect x="20" y="20" width="1520" height="740" rx="16" class="frame"/>
<text x="48" y="58" class="title">Advanced Module Classification</text>
<text x="48" y="80" class="subtitle">Current advanced source directories group examples by value type, JSON serialization, encryption, and custom extension mechanisms</text>
<rect x="58" y="130" width="650" height="500" rx="12" class="panel"/><text x="383" y="122" class="panelTitle" text-anchor="middle">PROBLEM DOMAINS</text>
<desc>Protect data</desc><rect x="98" y="182" width="224" height="70" rx="10" fill="#fce7f3" stroke="#db2777" class="card"/>
<text x="210" y="207" class="label" text-anchor="middle">Protect data</text>
<text x="210" y="238" class="detail" text-anchor="middle">01 crypt / 12 Tink</text>
<desc>Represent values</desc><rect x="98" y="326" width="224" height="70" rx="10" fill="#fef3c7" stroke="#d97706" class="card"/>
<text x="210" y="351" class="label" text-anchor="middle">Represent values</text>
<text x="210" y="382" class="detail" text-anchor="middle">02/03 time + 05 money</text>
<desc>Store JSON</desc><rect x="98" y="470" width="224" height="70" rx="10" fill="#ede9fe" stroke="#7c3aed" class="card"/>
<text x="210" y="495" class="label" text-anchor="middle">Store JSON</text>
<text x="210" y="526" class="detail" text-anchor="middle">04/08/09/11 serializers</text>
<desc>Extend columns</desc><rect x="410" y="182" width="224" height="70" rx="10" fill="#ccfbf1" stroke="#0f766e" class="card"/>
<text x="522" y="207" class="label" text-anchor="middle">Extend columns</text>
<text x="522" y="238" class="detail" text-anchor="middle">06 custom-columns</text>
<desc>Extend IDs</desc><rect x="410" y="326" width="224" height="70" rx="10" fill="#ffedd5" stroke="#ea580c" class="card"/>
<text x="522" y="351" class="label" text-anchor="middle">Extend IDs</text>
<text x="522" y="382" class="detail" text-anchor="middle">07 custom-entities</text>
<desc>Validate behavior</desc><rect x="410" y="470" width="224" height="70" rx="10" fill="#e2e8f0" stroke="#64748b" class="card"/>
<text x="522" y="495" class="label" text-anchor="middle">Validate behavior</text>
<text x="522" y="526" class="detail" text-anchor="middle">round-trip tests</text>
<rect x="810" y="130" width="590" height="500" rx="12" class="panel"/><text x="1105" y="122" class="panelTitle" text-anchor="middle">IMPLEMENTATION MECHANISMS</text>
<desc>ColumnType adapters</desc><rect x="852" y="190" width="230" height="72" rx="10" fill="#dcfce7" stroke="#16a34a" class="card"/>
<text x="967" y="215" class="label" text-anchor="middle">ColumnType adapters</text>
<text x="967" y="248" class="detail" text-anchor="middle">conversion boundary</text>
<desc>JSON operators</desc><rect x="852" y="334" width="230" height="72" rx="10" fill="#ede9fe" stroke="#7c3aed" class="card"/>
<text x="967" y="359" class="label" text-anchor="middle">JSON operators</text>
<text x="967" y="392" class="detail" text-anchor="middle">extract/contains/exists</text>
<desc>Encryption wrappers</desc><rect x="852" y="478" width="230" height="72" rx="10" fill="#fce7f3" stroke="#db2777" class="card"/>
<text x="967" y="503" class="label" text-anchor="middle">Encryption wrappers</text>
<text x="967" y="536" class="detail" text-anchor="middle">crypt/AEAD/DAEAD</text>
<desc>EntityID bases</desc><rect x="1132" y="262" width="230" height="72" rx="10" fill="#fef3c7" stroke="#d97706" class="card"/>
<text x="1247" y="287" class="label" text-anchor="middle">EntityID bases</text>
<text x="1247" y="320" class="detail" text-anchor="middle">KSUID/Snowflake/UUID</text>
<desc>DAO + DSL fixtures</desc><rect x="1132" y="438" width="230" height="72" rx="10" fill="#dbeafe" stroke="#3b82f6" class="card"/>
<text x="1247" y="463" class="label" text-anchor="middle">DAO + DSL fixtures</text>
<text x="1247" y="496" class="detail" text-anchor="middle">source-backed tests</text>
<path d="M322,217 L360,217 L360,160 L820,160 L820,206 L852,206" class="codecLine"/>
<path d="M322,361 L360,361 L360,278 L820,278 L820,246 L852,246" class="mapLine"/>
<path d="M322,505 L360,505 L360,420 L820,420 L820,390 L852,390" class="arrow"/>
<path d="M634,217 L750,217 L750,226 L852,226" class="mapLine"/>
<path d="M634,361 L744,361 L744,298 L1132,298" class="arrow"/>
<path d="M634,505 L744,505 L744,474 L1132,474" class="runtimeUse"/>
<path d="M1082,226 L1104,226 L1104,474 L1132,474" class="runtimeUse"/>
<path d="M1082,370 L1104,370 L1104,474 L1132,474" class="runtimeUse"/>
<path d="M1082,514 L1104,514 L1104,474 L1132,474" class="runtimeUse"/>
<rect x="142" y="690" width="1200" height="52" rx="10" fill="#ecfdf5" stroke="#86efac" stroke-width="1.3"/>
<text x="742" y="721" class="detail" text-anchor="middle">Classification rule: group by current source directories and tested extension mechanisms, not by stale or missing chapter rows.</text>
</svg>
