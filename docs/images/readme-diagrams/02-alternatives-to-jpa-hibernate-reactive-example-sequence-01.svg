<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-label="Hibernate Reactive Request Flow">
<defs>

  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#8ca2b4" flood-opacity=".14"/></filter>
  <marker id="seqArrowBlue" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#4f86c6"/></marker>
  <marker id="seqArrowGreen" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6f8f4e"/></marker>
  <marker id="seqArrowAmber" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#a06a3b"/></marker>
  <marker id="seqArrowTeal" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#3f8f8a"/></marker>
  <marker id="seqArrowRed" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b45a5a"/></marker>
  <style><![CDATA[
    svg{font-family:"Architects Daughter","Comic Mono",ui-sans-serif,system-ui,sans-serif}.canvas{fill:#f6f9fc}.frame{fill:#fff;stroke:#c7d8eb;stroke-width:2;filter:url(#shadow)}.title{font-family:"Architects Daughter";font-size:38px;fill:#263a57}.subtitle,.role,.labelText,.footer,.branchText{font-family:"Comic Mono";fill:#526276}.subtitle{font-size:15px}.header{fill:#fff;stroke-width:2.4;filter:url(#shadow)}.participant{font-family:"Architects Daughter";font-size:16px;fill:#263a57}.role{font-size:10px;fill:#6b7a90}.lifeline{fill:none;stroke:#a8bad0;stroke-width:2;stroke-dasharray:7 7}.activation{fill:#f8fbff;stroke:#d4e0ec;stroke-width:1.2;rx:6}.call{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}.return{fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:7 7}.pill{fill:#f8fafc;stroke-width:1.2}.numCircle{fill:#fff}.num{font-family:"Comic Mono";font-size:10px;font-weight:700}.labelText{font-size:11px}.alt{fill:none;stroke:#9bbce3;stroke-width:1.6;stroke-dasharray:8 8}.branchDivider{stroke:#9bbce3;stroke-opacity:.55;stroke-width:1.2;stroke-dasharray:7 7}.branchText{font-size:12px}.branchBadge{fill:#fff;stroke-width:1.2}.note{fill:#ecfdf5;stroke:#34a879;stroke-width:1.6}
  ]]></style>
</defs>
<rect class="canvas" width="1500" height="980"/><rect class="frame" x="28" y="26" width="1444" height="920" rx="24"/>
<text class="title" x="60" y="76">Hibernate Reactive Request Flow</text>
<text class="subtitle" x="60" y="102">Coroutine controllers open Mutiny sessions, await Hibernate Reactive queries, and return DTO records.</text>

<rect class="header" x="70" y="158" width="150" height="66" rx="14" stroke="#4f86c6"/><text class="participant" x="145" y="188" text-anchor="middle">Client</text><text class="role" x="145" y="207" text-anchor="middle">HTTP caller</text><path class="lifeline" d="M145 238 V846"/>
<rect class="header" x="278" y="158" width="178" height="66" rx="14" stroke="#4f86c6"/><text class="participant" x="367" y="188" text-anchor="middle">TeamController</text><text class="role" x="367" y="207" text-anchor="middle">suspend endpoint</text><path class="lifeline" d="M367 238 V846"/>
<rect class="header" x="520" y="158" width="160" height="66" rx="14" stroke="#6f8f4e"/><text class="participant" x="600" y="188" text-anchor="middle">SessionFactory</text><text class="role" x="600" y="207" text-anchor="middle">withSessionSuspending</text><path class="lifeline" d="M600 238 V846"/>
<rect class="header" x="742" y="158" width="150" height="66" rx="14" stroke="#6f8f4e"/><text class="participant" x="817" y="188" text-anchor="middle">Mutiny Session</text><text class="role" x="817" y="207" text-anchor="middle">reactive session</text><path class="lifeline" d="M817 238 V846"/>
<rect class="header" x="958" y="158" width="172" height="66" rx="14" stroke="#a06a3b"/><text class="participant" x="1044" y="188" text-anchor="middle">TeamRepository</text><text class="role" x="1044" y="207" text-anchor="middle">criteria query</text><path class="lifeline" d="M1044 238 V846"/>
<rect class="header" x="1190" y="158" width="150" height="66" rx="14" stroke="#3f8f8a"/><text class="participant" x="1265" y="188" text-anchor="middle">DTO Record</text><text class="role" x="1265" y="207" text-anchor="middle">TeamAndMember</text><path class="lifeline" d="M1265 238 V846"/>

<rect class="activation" x="361" y="270" width="12" height="540"/>
<rect class="activation" x="594" y="350" width="12" height="365"/>
<rect class="activation" x="811" y="430" width="12" height="250"/>
<rect class="activation" x="1038" y="510" width="12" height="115"/>

<rect class="alt" x="84" y="632" width="1298" height="150" rx="16"/>
<rect class="branchBadge" x="104" y="614" width="228" height="30" rx="10" stroke="#3f8f8a"/><text class="branchText" x="218" y="634" text-anchor="middle">alt members requested</text>
<path class="branchDivider" d="M84 704 H1382"/>
<rect class="branchBadge" x="104" y="690" width="330" height="30" rx="10" stroke="#b45a5a"/><text class="branchText" x="269" y="710" text-anchor="middle">else query returns empty list</text>

<path class="call callBlue" d="M154 282 H357" stroke="#4f86c6" marker-end="url(#seqArrowBlue)"/>
<rect class="pill" x="180" y="239" width="272" height="28" rx="10" stroke="#4f86c6"/><circle class="numCircle" cx="200" cy="253" r="11" stroke="#4f86c6"/><text class="num" x="200" y="257" text-anchor="middle" fill="#4f86c6">1</text><text class="labelText" x="220" y="258">GET /teams?memberName=</text>

<path class="call callBlue" d="M376 362 H590" stroke="#4f86c6" marker-end="url(#seqArrowBlue)"/>
<rect class="pill" x="402" y="319" width="282" height="28" rx="10" stroke="#4f86c6"/><circle class="numCircle" cx="422" cy="333" r="11" stroke="#4f86c6"/><text class="num" x="422" y="337" text-anchor="middle" fill="#4f86c6">2</text><text class="labelText" x="442" y="338">withSessionSuspending()</text>

<path class="call callGreen" d="M609 442 H807" stroke="#6f8f4e" marker-end="url(#seqArrowGreen)"/>
<rect class="pill" x="626" y="399" width="276" height="28" rx="10" stroke="#6f8f4e"/><circle class="numCircle" cx="646" cy="413" r="11" stroke="#6f8f4e"/><text class="num" x="646" y="417" text-anchor="middle" fill="#6f8f4e">3</text><text class="labelText" x="666" y="418">open Mutiny Session</text>

<path class="call callGreen" d="M826 522 H1034" stroke="#6f8f4e" marker-end="url(#seqArrowGreen)"/>
<rect class="pill" x="852" y="479" width="310" height="28" rx="10" stroke="#6f8f4e"/><circle class="numCircle" cx="872" cy="493" r="11" stroke="#6f8f4e"/><text class="num" x="872" y="497" text-anchor="middle" fill="#6f8f4e">4</text><text class="labelText" x="892" y="498">findAllByMemberName(session)</text>

<path class="call callAmber" d="M1053 602 H1255" stroke="#a06a3b" marker-end="url(#seqArrowAmber)"/>
<rect class="pill" x="1080" y="559" width="266" height="28" rx="10" stroke="#a06a3b"/><circle class="numCircle" cx="1100" cy="573" r="11" stroke="#a06a3b"/><text class="num" x="1100" y="577" text-anchor="middle" fill="#a06a3b">5</text><text class="labelText" x="1120" y="578">map to TeamAndMemberRecord</text>

<path class="return seqReturn" d="M1256 672 H826" stroke="#3f8f8a" marker-end="url(#seqArrowTeal)"/>
<rect class="pill" x="914" y="635" width="278" height="28" rx="10" stroke="#3f8f8a"/><circle class="numCircle" cx="934" cy="649" r="11" stroke="#3f8f8a"/><text class="num" x="934" y="653" text-anchor="middle" fill="#3f8f8a">6</text><text class="labelText" x="954" y="654">DTO list from fetched members</text>

<path class="return error" d="M808 746 H376" stroke="#b45a5a" marker-end="url(#seqArrowRed)"/>
<rect class="pill" x="480" y="711" width="282" height="28" rx="10" stroke="#b45a5a"/><circle class="numCircle" cx="500" cy="725" r="11" stroke="#b45a5a"/><text class="num" x="500" y="729" text-anchor="middle" fill="#b45a5a">7</text><text class="labelText" x="520" y="730">empty list still returns 200</text>

<path class="return seqReturn" d="M358 822 H154" stroke="#3f8f8a" marker-end="url(#seqArrowTeal)"/>
<rect class="pill" x="169" y="785" width="300" height="28" rx="10" stroke="#3f8f8a"/><circle class="numCircle" cx="189" cy="799" r="11" stroke="#3f8f8a"/><text class="num" x="189" y="803" text-anchor="middle" fill="#3f8f8a">8</text><text class="labelText" x="209" y="804">WebFlux serializes DTO response</text>

<rect class="note" x="90" y="878" width="1320" height="44" rx="14"/>
<text class="footer" x="750" y="906" text-anchor="middle">Repository calls await Mutiny results inside the controller-owned session boundary; writes use withTransactionSuspending.</text>
</svg>
