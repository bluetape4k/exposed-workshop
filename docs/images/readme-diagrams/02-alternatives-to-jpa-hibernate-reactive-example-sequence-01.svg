<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 780" width="1340" height="780" role="img" aria-label="Hibernate Reactive Request Flow">
<defs>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/></filter>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8 Z" fill="#64748b"/></marker>
<marker id="arrowGreen" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8 Z" fill="#16a34a"/></marker>
<marker id="arrowPurple" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8 Z" fill="#7c3aed"/></marker>
<style>
.canvas{fill:#f6f9fc}.frame{fill:#fff;stroke:#d7e2ec;stroke-width:1.5}
.title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:32px;fill:#1e293b}
.subtitle,.detail{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;fill:#536476}
.subtitle{font-size:13px}.detail{font-size:12px}.tiny{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:10px;fill:#64748b}
.label{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:17px;fill:#1e293b}
.panelTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:12px;letter-spacing:.08em;fill:#94a3b8}
.card{stroke-width:1.7;filter:url(#shadow)}.panel{fill:#f8fafc;stroke:#d7e2ec;stroke-width:1.2}
.arrow{fill:none;stroke:#64748b;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
.softArrow{fill:none;stroke:#94a3b8;stroke-width:1.35;stroke-dasharray:5 5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
.movieMap{fill:none;stroke:#16a34a;stroke-width:1.7;stroke-dasharray:5 5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowGreen)}
.actorMap{fill:none;stroke:#7c3aed;stroke-width:1.7;stroke-dasharray:5 5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowPurple)}
.lifeline{fill:none;stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:5 5;stroke-linecap:round;stroke-linejoin:round}
.inherit{fill:none;stroke:#475569;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.inheritHead{fill:#fff;stroke:#475569;stroke-width:1.8;stroke-linejoin:round}
</style>
</defs>
<rect width="1340" height="780" class="canvas"/>
<rect x="20" y="20" width="1300" height="740" rx="16" class="frame"/>
<text x="48" y="58" class="title">Hibernate Reactive Request Flow</text>
<text x="48" y="80" class="subtitle">Coroutine controller delegates to Mutiny SessionFactory and Hibernate Reactive repositories</text>
<rect x="46" y="122" width="140" height="52" rx="10" fill="#dbeafe" stroke="#3b82f6" class="card"/>
<text x="116" y="154" class="label" text-anchor="middle">Client</text>
<path d="M116,184 L116,704" class="lifeline"/>
<rect x="236" y="122" width="140" height="52" rx="10" fill="#ede9fe" stroke="#7c3aed" class="card"/>
<text x="306" y="154" class="label" text-anchor="middle">TeamController</text>
<path d="M306,184 L306,704" class="lifeline"/>
<rect x="426" y="122" width="140" height="52" rx="10" fill="#dcfce7" stroke="#16a34a" class="card"/>
<text x="496" y="154" class="label" text-anchor="middle">SessionFactory</text>
<path d="M496,184 L496,704" class="lifeline"/>
<rect x="616" y="122" width="140" height="52" rx="10" fill="#ffedd5" stroke="#ea580c" class="card"/>
<text x="686" y="154" class="label" text-anchor="middle">Mutiny Session</text>
<path d="M686,184 L686,704" class="lifeline"/>
<rect x="806" y="122" width="140" height="52" rx="10" fill="#fce7f3" stroke="#db2777" class="card"/>
<text x="876" y="144" class="label" text-anchor="middle">Team</text>
<text x="876" y="162" class="label" text-anchor="middle">Repository</text>
<path d="M876,184 L876,704" class="lifeline"/>
<rect x="996" y="122" width="140" height="52" rx="10" fill="#ccfbf1" stroke="#0f766e" class="card"/>
<text x="1066" y="154" class="label" text-anchor="middle">PostgreSQL</text>
<path d="M1066,184 L1066,704" class="lifeline"/>
<rect x="1154" y="122" width="140" height="52" rx="10" fill="#fef3c7" stroke="#d97706" class="card"/>
<text x="1224" y="154" class="label" text-anchor="middle">DTO Record</text>
<path d="M1224,184 L1224,704" class="lifeline"/>
<rect x="148" y="196" width="126" height="24" rx="8" fill="#fff" stroke="#d7e2ec"/>
<text x="211" y="213" class="tiny" text-anchor="middle">1. GET /teams?memberName=</text>
<path d="M132,224 L290,224" class="arrow"/>
<rect x="338" y="258" width="126" height="24" rx="8" fill="#fff" stroke="#d7e2ec"/>
<text x="401" y="275" class="tiny" text-anchor="middle">2. withSessionSuspending()</text>
<path d="M322,286 L480,286" class="arrow"/>
<rect x="528" y="320" width="126" height="24" rx="8" fill="#fff" stroke="#d7e2ec"/>
<text x="591" y="337" class="tiny" text-anchor="middle">3. open Mutiny session</text>
<path d="M512,348 L670,348" class="arrow"/>
<rect x="718" y="382" width="126" height="24" rx="8" fill="#fff" stroke="#d7e2ec"/>
<text x="781" y="399" class="tiny" text-anchor="middle">4. findAllByMemberName()</text>
<path d="M702,410 L860,410" class="arrow"/>
<rect x="908" y="444" width="126" height="24" rx="8" fill="#fff" stroke="#d7e2ec"/>
<text x="971" y="461" class="tiny" text-anchor="middle">5. Criteria query + awaitSuspending</text>
<path d="M892,472 L1050,472" class="arrow"/>
<rect x="718" y="506" width="126" height="24" rx="8" fill="#fff" stroke="#d7e2ec"/>
<text x="781" y="523" class="tiny" text-anchor="middle">6. fetch team.members when needed</text>
<path d="M860,534 L702,534" class="arrow"/>
<rect x="908" y="568" width="126" height="24" rx="8" fill="#fff" stroke="#d7e2ec"/>
<text x="971" y="585" class="tiny" text-anchor="middle">7. reactive rows</text>
<path d="M1050,596 L892,596" class="softArrow"/>
<rect x="338" y="630" width="506" height="24" rx="8" fill="#fff" stroke="#d7e2ec"/>
<text x="591" y="647" class="tiny" text-anchor="middle">8. map entities to records</text>
<path d="M860,658 L322,658" class="softArrow"/>
<rect x="148" y="676" width="126" height="24" rx="8" fill="#fff" stroke="#d7e2ec"/>
<text x="211" y="693" class="tiny" text-anchor="middle">9. List&lt;TeamAndMemberRecord&gt;</text>
<path d="M290,704 L132,704" class="softArrow"/>
<rect x="82" y="714" width="1176" height="48" rx="10" fill="#ecfdf5" stroke="#86efac" stroke-width="1.3"/>
<text x="670" y="744" class="detail" text-anchor="middle">Hibernate Reactive keeps database IO in Mutiny sessions; controllers await coroutine-friendly results before returning DTO records.</text>
</svg>
