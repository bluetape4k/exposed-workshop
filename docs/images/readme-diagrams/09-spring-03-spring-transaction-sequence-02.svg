<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 740" width="1120" height="740" role="img" aria-label="09 Spring: Declarative Transaction (03)">
  <defs>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
    <marker viewBox="0 0 10 10" id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b"/></marker>
    <marker viewBox="0 0 10 10" id="inherit" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b"/></marker>
    <style>
  .canvas{fill:#f6f9fc}
  .frame{fill:#fff;stroke:#d7e2ec;stroke-width:1.5}
  .panel{fill:#f8fafc;stroke:#d7e2ec;stroke-width:1.2}
  .card{stroke-width:1.7;filter:url(#shadow)}
  .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:32px;fill:#1e293b}
  .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;fill:#536476}
  .panelTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:12px;letter-spacing:.08em;fill:#8ca2b4}
  .label{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:18px;fill:#1e293b}
  .smallLabel{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:15px;fill:#1e293b}
  .detail{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;fill:#536476}
  .tiny{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:10px;fill:#64748b}
  .arrow{fill:none;stroke:#64748b;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .softArrow{fill:none;stroke:#8ca2b4;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:5 5}
  .inherit{fill:none;stroke:#64748b;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .divider{stroke:#cbd5e1;stroke-width:1.2;stroke-dasharray:6 6}
.altRegion{fill:#f8fafc;fill-opacity:.055;stroke:#8ca2b4;stroke-opacity:.28;stroke-width:1.2;stroke-dasharray:8 7}
</style>
  </defs>
  <rect width="1120" height="740" class="canvas"/>
  <rect x="20" y="20" width="1080" height="700" rx="16" class="frame"/>
<rect x="90" y="250" width="900" height="370" rx="14" class="altRegion"/>
<text x="48" y="58" class="title">09 Spring: Declarative Transaction (03)</text>
  <text x="48" y="80" class="subtitle">Source-derived sequence · request path through implementation roles</text>
<rect x="12" y="118" width="156" height="54" rx="10" fill="#eef5fa" stroke="#4f86c6" class="card"/>
<text x="90" y="151" class="smallLabel participant" text-anchor="middle">Client</text>

<path d="M90,182 L90,676" class="softArrow lifeline"/>
<rect x="84" y="212" width="12" height="120" rx="4" class="activation"/>
<rect x="247" y="118" width="156" height="54" rx="10" fill="#f3eee8" stroke="#8a6f55" class="card"/>
<text x="325" y="151" class="smallLabel participant" text-anchor="middle">README User</text>

<path d="M325,182 L325,676" class="softArrow lifeline"/>
<rect x="319" y="212" width="12" height="120" rx="4" class="activation"/>
<rect x="482" y="118" width="156" height="54" rx="10" fill="#f1f6ec" stroke="#5f7f3f" class="card"/>
<text x="560" y="151" class="smallLabel participant" text-anchor="middle">Order Service</text>

<path d="M560,182 L560,676" class="softArrow lifeline"/>
<rect x="554" y="212" width="12" height="120" rx="4" class="activation"/>
<rect x="717" y="118" width="156" height="54" rx="10" fill="#f5eee4" stroke="#9b5f38" class="card"/>
<text x="795" y="151" class="smallLabel participant" text-anchor="middle">Order Schema</text>

<path d="M795,182 L795,676" class="softArrow lifeline"/>
<rect x="789" y="212" width="12" height="120" rx="4" class="activation"/>
<rect x="952" y="118" width="156" height="54" rx="10" fill="#f5eef2" stroke="#a85f7f" class="card"/>
<text x="1030" y="151" class="smallLabel participant" text-anchor="middle">Customer Table</text>

<path d="M1030,182 L1030,676" class="softArrow lifeline"/>
<path d="M108,220 L307,220" class="arrow"/>
<rect x="65.5" y="190" width="284" height="24" rx="8" fill="#fff" stroke="#d7e2ec" class="messageBand pill"/>
<text x="80" y="207" class="num" text-anchor="middle">1</text>
<text x="207.5" y="207" class="tiny labelText" text-anchor="middle">handle request()</text>
<path d="M343,274 L542,274" class="arrow"/>
<rect x="300.5" y="244" width="284" height="24" rx="8" fill="#fff" stroke="#d7e2ec" class="messageBand pill"/>
<text x="316" y="261" class="num" text-anchor="middle">2</text>
<text x="442.5" y="261" class="tiny labelText" text-anchor="middle">validate input and resolve context</text>
<path d="M578,328 L777,328" class="arrow"/>
<rect x="535.5" y="298" width="284" height="24" rx="8" fill="#fff" stroke="#d7e2ec" class="messageBand pill"/>
<text x="550" y="315" class="num" text-anchor="middle">3</text>
<text x="677.5" y="315" class="tiny labelText" text-anchor="middle">call OrderService</text>
<path d="M813,382 L1012,382" class="arrow"/>
<rect x="770.5" y="352" width="284" height="24" rx="8" fill="#fff" stroke="#d7e2ec" class="messageBand pill"/>
<text x="786" y="369" class="num" text-anchor="middle">4</text>
<text x="912.5" y="369" class="tiny labelText" text-anchor="middle">execute use case boundary</text>
<path d="M813,436 L1012,436" class="arrow"/>
<rect x="770.5" y="406" width="284" height="24" rx="8" fill="#fff" stroke="#d7e2ec" class="messageBand pill"/>
<text x="786" y="423" class="num" text-anchor="middle">5</text>
<text x="912.5" y="423" class="tiny labelText" text-anchor="middle">delegate to CustomerTable</text>
<path d="M813,490 L1012,490" class="arrow"/>
<rect x="770.5" y="460" width="284" height="24" rx="8" fill="#fff" stroke="#d7e2ec" class="messageBand pill"/>
<text x="786" y="477" class="num" text-anchor="middle">6</text>
<text x="912.5" y="477" class="tiny labelText" text-anchor="middle">run Exposed transaction</text>
<path d="M813,544 L1012,544" class="arrow"/>
<rect x="770.5" y="514" width="284" height="24" rx="8" fill="#fff" stroke="#d7e2ec" class="messageBand pill"/>
<text x="786" y="531" class="num" text-anchor="middle">7</text>
<text x="912.5" y="531" class="tiny labelText" text-anchor="middle">map rows to response model</text>
<path d="M813,598 L1012,598" class="arrow"/>
<rect x="770.5" y="568" width="284" height="24" rx="8" fill="#fff" stroke="#d7e2ec" class="messageBand pill"/>
<text x="786" y="585" class="num" text-anchor="middle">8</text>
<text x="912.5" y="585" class="tiny labelText" text-anchor="middle">return HTTP response</text>
</svg>
