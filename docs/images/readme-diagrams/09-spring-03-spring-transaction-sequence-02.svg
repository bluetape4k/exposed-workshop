<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 920" width="1500" height="920" role="img" aria-label="Declarative Spring Transaction Sequence">
<defs>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/></filter>
<marker id="arrowBlue" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#4f86c6" stroke="#4f86c6" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
<marker id="arrowGreen" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6f8f58" stroke="#6f8f58" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
<marker id="arrowOrange" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#a2743d" stroke="#a2743d" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
<marker id="arrowPurple" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7a8445" stroke="#7a8445" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
<marker id="arrowGray" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6f8792" stroke="#6f8792" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
<style>
.canvas{fill:none}.frame{fill:#fbfcf8;stroke:#40545d;stroke-width:3}
.title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:31px;fill:#1e293b}
.subtitle,.detail{font-family:"Comic Mono","Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;fill:#536476}
.subtitle{font-size:13px}.detail{font-size:12px}.role{font-family:"Comic Mono","Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:10.5px;fill:#60727d}
.participant{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:16px;fill:#1e293b}
.card{stroke-width:1.7;filter:url(#shadow)}
.header{fill:#ffffff;stroke:#b6d3ec;stroke-width:1.7;filter:url(#shadow)}
.lifeline{stroke:#9cafb7;stroke-width:1.4;stroke-dasharray:5 6}
.activation{fill:#f3ecdf;stroke:#8f784e;stroke-width:1.5}
.call{fill:none;stroke:#4f86c6;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowBlue)}
.state{fill:none;stroke:#6f8f58;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowGreen)}
.db{fill:none;stroke:#a2743d;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowOrange)}
.spring{fill:none;stroke:#7a8445;stroke-width:2.3;stroke-dasharray:6 5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowPurple)}
.returnLine{fill:none;stroke:#6f8792;stroke-width:2.2;stroke-dasharray:7 5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowGray)}
.pill{stroke-width:1.6;filter:url(#shadow)}
.badge{fill:#fff;stroke-width:1.4}
</style>
</defs>
<rect width="1500" height="920" class="canvas"/>
<rect x="20" y="20" width="1460" height="880" rx="16" class="frame"/>
<text x="48" y="58" class="title">Declarative Spring Transaction Sequence</text>
<text x="48" y="80" class="subtitle">Spring registers Exposed SpringTransactionManager, then @Transactional OrderService methods create and query customer/order entities</text>

<desc>SpringBootTest</desc><rect x="34" y="130" width="168" height="62" rx="10" class="header card"/>
<text x="118" y="158" class="participant" text-anchor="middle">SpringBootTest</text>
<text x="118" y="178" class="role" text-anchor="middle">test context</text>
<line x1="118" y1="192" x2="118" y2="778" class="lifeline"/>

<desc>DataSourceConfig</desc><rect x="250" y="130" width="168" height="62" rx="10" class="header card"/>
<text x="334" y="158" class="participant" text-anchor="middle">DataSourceConfig</text>
<text x="334" y="178" class="role" text-anchor="middle">H2 + tx manager</text>
<line x1="334" y1="192" x2="334" y2="778" class="lifeline"/>

<desc>SpringTransactionManager</desc><rect x="466" y="130" width="194" height="62" rx="10" class="header card"/>
<text x="563" y="158" class="participant" text-anchor="middle">Spring TM</text>
<text x="563" y="178" class="role" text-anchor="middle">useNestedTransactions</text>
<line x1="563" y1="192" x2="563" y2="778" class="lifeline"/>

<desc>OrderService</desc><rect x="716" y="130" width="168" height="62" rx="10" class="header card"/>
<text x="800" y="158" class="participant" text-anchor="middle">OrderService</text>
<text x="800" y="178" class="role" text-anchor="middle">@Transactional</text>
<line x1="800" y1="192" x2="800" y2="778" class="lifeline"/>

<desc>OrderSchema</desc><rect x="936" y="130" width="168" height="62" rx="10" class="header card"/>
<text x="1020" y="158" class="participant" text-anchor="middle">OrderSchema</text>
<text x="1020" y="178" class="role" text-anchor="middle">tables + entities</text>
<line x1="1020" y1="192" x2="1020" y2="778" class="lifeline"/>

<desc>Database</desc><rect x="1160" y="130" width="168" height="62" rx="10" class="header card"/>
<text x="1244" y="158" class="participant" text-anchor="middle">H2 Database</text>
<text x="1244" y="178" class="role" text-anchor="middle">customers/orders</text>
<line x1="1244" y1="192" x2="1244" y2="778" class="lifeline"/>

<desc>TxExtension</desc><rect x="1352" y="130" width="118" height="62" rx="10" class="header card"/>
<text x="1411" y="158" class="participant" text-anchor="middle">Tx Ext</text>
<text x="1411" y="178" class="role" text-anchor="middle">execute()</text>
<line x1="1411" y1="192" x2="1411" y2="778" class="lifeline"/>

<rect x="111" y="280" width="14" height="82" rx="6" class="activation"/>
<rect x="327" y="306" width="14" height="92" rx="6" class="activation"/>
<rect x="556" y="370" width="14" height="306" rx="6" class="activation"/>
<rect x="793" y="450" width="14" height="214" rx="6" class="activation"/>
<rect x="1013" y="532" width="14" height="154" rx="6" class="activation"/>
<rect x="1237" y="560" width="14" height="168" rx="6" class="activation"/>
<rect x="1404" y="686" width="14" height="58" rx="6" class="activation"/>

<rect x="74" y="228" width="368" height="34" rx="17" fill="#ffffff" stroke="#4f86c6" class="pill card"/>
<circle cx="98" cy="245" r="14" class="badge" stroke="#4f86c6"/>
<text x="98" y="250" class="detail" text-anchor="middle">1</text>
<text x="123" y="251" class="detail">load SpringTransactionApp context</text>
<path data-connector="load-context" d="M118,286 H334" class="call"/>

<rect x="304" y="324" width="396" height="34" rx="17" fill="#ffffff" stroke="#7a8445" class="pill card"/>
<circle cx="328" cy="341" r="14" class="badge" stroke="#7a8445"/>
<text x="328" y="346" class="detail" text-anchor="middle">2</text>
<text x="353" y="347" class="detail">register SpringTransactionManager</text>
<path data-connector="register-transaction-manager" d="M334,382 H563" class="spring"/>

<rect x="522" y="420" width="414" height="34" rx="17" fill="#ffffff" stroke="#4f86c6" class="pill card"/>
<circle cx="546" cy="437" r="14" class="badge" stroke="#4f86c6"/>
<text x="546" y="442" class="detail" text-anchor="middle">3</text>
<text x="571" y="443" class="detail">call OrderService.doBoth()</text>
<path data-connector="test-calls-service" d="M118,478 H800" class="call"/>

<rect x="676" y="502" width="432" height="34" rx="17" fill="#ffffff" stroke="#d8aaa7" class="pill card"/>
<circle cx="700" cy="519" r="14" class="badge" stroke="#d8aaa7"/>
<text x="700" y="524" class="detail" text-anchor="middle">4</text>
<text x="725" y="525" class="detail">@Transactional opens REQUIRED boundary</text>
<path data-connector="transactional-boundary" d="M800,560 H563" class="spring"/>

<rect x="768" y="590" width="416" height="34" rx="17" fill="#ffffff" stroke="#6f8f58" class="pill card"/>
<circle cx="792" cy="607" r="14" class="badge" stroke="#6f8f58"/>
<text x="792" y="612" class="detail" text-anchor="middle">5</text>
<text x="817" y="613" class="detail">CustomerEntity.new + OrderEntity.new</text>
<path data-connector="service-to-schema" d="M800,650 H1020" class="state"/>
<path data-connector="schema-writes-tables" d="M1020,676 H1244" class="db"/>

<rect x="1078" y="718" width="348" height="34" rx="17" fill="#ffffff" stroke="#a2743d" class="pill card"/>
<circle cx="1102" cy="735" r="14" class="badge" stroke="#a2743d"/>
<text x="1102" y="740" class="detail" text-anchor="middle">6</text>
<text x="1127" y="741" class="detail">execute { TransactionTemplate }</text>
<path data-connector="programmatic-extension" d="M563,770 H1411" class="db"/>

<rect x="82" y="820" width="1336" height="52" rx="10" fill="#ffffff" stroke="#d6e1e5" stroke-width="1.3"/>
<text x="750" y="851" class="detail" text-anchor="middle">The default @Transactional path and the PlatformTransactionManager.execute extension both run through Exposed's SpringTransactionManager.</text>
</svg>
