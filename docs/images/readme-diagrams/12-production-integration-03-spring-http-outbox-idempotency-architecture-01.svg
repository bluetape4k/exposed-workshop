<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="title desc">
  <title id="title">Spring HTTP outbox and idempotency architecture</title>
  <desc id="desc">Spring MVC payment endpoints delegate to PaymentService, which creates or rereads a pending outbox row by idempotency key, calls a PaymentGateway through RestClient, and records succeeded, retryable failed, or permanent failed status in H2.</desc>
  <defs>
    <style>
      text { letter-spacing: 0; }
      .title { font-family: "Architects Daughter"; font-size: 40px; fill: #23323a; }
      .subtitle, .laneNote, .cardText, .label, .footer { font-family: "Comic Mono"; fill: #324750; }
      .subtitle { font-size: 17px; }
      .laneTitle { font-family: "Architects Daughter"; font-size: 24px; fill: #23323a; }
      .laneNote { font-size: 13px; fill: #5b6d75; }
      .cardTitle { font-family: "Architects Daughter"; font-size: 22px; fill: #20323b; }
      .cardText { font-size: 14px; }
      .label { font-size: 13px; font-weight: 700; }
      .footer { font-size: 14px; fill: #60717a; }
      .canvas { fill: #fbfcf8; stroke: #3f515a; stroke-width: 3; }
      .lane { stroke-width: 2.1; }
      .laneHttp { fill: #fff7e8; stroke: #b98e50; }
      .laneService { fill: #f2f0fb; stroke: #897bc2; }
      .laneOutbox { fill: #eef7f5; stroke: #6fa098; }
      .laneIsolation { fill: #f4f6f5; stroke: #8a9aa0; }
      .card { fill: #ffffff; stroke-width: 2.2; }
      .httpCard { stroke: #ac7a34; }
      .serviceCard { stroke: #7b6bb4; }
      .outboxCard { stroke: #5d948b; }
      .isolationCard { stroke: #69777e; }
      .flowHttp { fill: none; stroke: #a2743d; stroke-width: 4.2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowHttp); }
      .flowService { fill: none; stroke: #7667b1; stroke-width: 4.2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowService); }
      .flowOutbox { fill: none; stroke: #3f8e84; stroke-width: 4.2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowOutbox); }
      .flowIsolation { fill: none; stroke: #69777e; stroke-width: 4.2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowIsolation); }
    </style>
    <marker id="arrowHttp" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#a2743d" stroke="#a2743d" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="arrowService" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#7667b1" stroke="#7667b1" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="arrowOutbox" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#3f8e84" stroke="#3f8e84" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="arrowIsolation" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#69777e" stroke="#69777e" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
  </defs>

  <rect x="24" y="24" width="1552" height="892" rx="20" class="canvas"/>
  <text x="800" y="78" text-anchor="middle" class="title">Spring HTTP Outbox and Idempotency</text>
  <text x="800" y="110" text-anchor="middle" class="subtitle">Persist the intent first, deduplicate by idempotency key, then record external dispatch state.</text>

  <rect x="70" y="158" width="310" height="580" rx="18" class="lane laneHttp"/>
  <text x="104" y="198" class="laneTitle">MVC HTTP edge</text>
  <text x="104" y="224" class="laneNote">Payment endpoints and sanitized advice.</text>

  <rect x="430" y="158" width="310" height="580" rx="18" class="lane laneService"/>
  <text x="464" y="198" class="laneTitle">Service boundary</text>
  <text x="464" y="224" class="laneNote">Validation, duplicate return, dispatch.</text>

  <rect x="790" y="158" width="310" height="580" rx="18" class="lane laneOutbox"/>
  <text x="824" y="198" class="laneTitle">Outbox adapters</text>
  <text x="824" y="224" class="laneNote">Repository state and payment gateway port.</text>

  <rect x="1150" y="158" width="330" height="580" rx="18" class="lane laneIsolation"/>
  <text x="1184" y="198" class="laneTitle">Local isolation</text>
  <text x="1184" y="224" class="laneNote">H2 and fake external service tests.</text>

  <rect id="controller" x="112" y="286" width="226" height="108" rx="12" class="card httpCard"/>
  <text x="225" y="320" text-anchor="middle" class="cardTitle">PaymentController</text>
  <text x="140" y="350" class="cardText">POST /payments</text>
  <text x="140" y="370" class="cardText">POST /payments/{id}/retry</text>

  <rect id="advice" x="112" y="500" width="226" height="108" rx="12" class="card httpCard"/>
  <text x="225" y="534" text-anchor="middle" class="cardTitle">ErrorAdvice</text>
  <text x="140" y="564" class="cardText">validation/not found</text>
  <text x="140" y="584" class="cardText">permanent/retryable</text>

  <rect id="service" x="470" y="268" width="230" height="180" rx="12" class="card serviceCard"/>
  <text x="585" y="302" text-anchor="middle" class="cardTitle">PaymentService</text>
  <text x="500" y="332" class="cardText">createPending first</text>
  <text x="500" y="352" class="cardText">duplicate returns 200</text>
  <text x="500" y="372" class="cardText">dispatch gateway charge</text>
  <text x="500" y="392" class="cardText">mark success or failure</text>

  <rect id="repository" x="830" y="242" width="230" height="118" rx="12" class="card outboxCard"/>
  <text x="945" y="276" text-anchor="middle" class="cardTitle">OutboxRepository</text>
  <text x="858" y="306" class="cardText">unique idempotency key</text>
  <text x="858" y="326" class="cardText">PENDING -> final state</text>

  <rect id="gateway" x="830" y="438" width="230" height="118" rx="12" class="card outboxCard"/>
  <text x="945" y="472" text-anchor="middle" class="cardTitle">PaymentGateway</text>
  <text x="858" y="502" class="cardText">RestClient POST</text>
  <text x="858" y="522" class="cardText">Idempotency-Key header</text>

  <rect id="database" x="1190" y="242" width="250" height="118" rx="12" class="card isolationCard"/>
  <g data-bluetape4k-icon="h2" transform="translate(1216 276) scale(1.8)">
    <path fill="#09476B" d="M17.17 13.27c.14-.015.28-.023.416-.023.7 0 1.228.159 1.599.469.37.314.555.756.555 1.334a2.861 2.861 0 0 1-.43 1.455c-.291.492-.775 1.066-1.46 1.727-.453.446-1.061.976-1.821 1.592a48.02 48.02 0 0 1-2.275 1.742v2.083h9.895V21.24H17.99c.219-.159.59-.435 1.11-.832.519-.4 1.033-.835 1.55-1.311.817-.76 1.425-1.5 1.822-2.215a4.624 4.624 0 0 0 .597-2.268c0-1.213-.416-2.154-1.247-2.815-.828-.662-2.033-.994-3.613-.994-.344 0-.692.015-1.036.049V6.04H13.86v4.701H8.965V6.04H5.65v12.846h3.315v-5.661h4.89v5.661h.039c.31-.242.623-.487.933-.74a28.564 28.564 0 0 0 1.826-1.588 14.854 14.854 0 0 0 .517-.529zM12.011 23.3A11.327 11.327 0 0 1 .7 11.99 11.305 11.305 0 0 1 12.011.699a11.286 11.286 0 0 1 11.29 11.29v.351H24v-.351A11.985 11.985 0 0 0 12.011 0 12.008 12.008 0 0 0 0 11.989 12.026 12.026 0 0 0 12.011 24h.352v-.7z"/>
  </g>
  <text x="1348" y="280" text-anchor="middle" class="cardTitle">H2 outbox table</text>
  <text x="1278" y="310" class="cardText">spring_payment_outbox</text>
  <text x="1278" y="330" class="cardText">status, attempts, errors</text>

  <rect id="fakeGateway" x="1190" y="438" width="250" height="118" rx="12" class="card isolationCard"/>
  <text x="1315" y="472" text-anchor="middle" class="cardTitle">Fake gateway tests</text>
  <text x="1218" y="502" class="cardText">non-routable default URL</text>
  <text x="1218" y="522" class="cardText">in-memory success/failure</text>

  <rect id="tests" x="110" y="790" width="1370" height="70" rx="12" class="card serviceCard"/>
  <text x="795" y="820" text-anchor="middle" class="cardTitle">Tested state contract</text>
  <text x="210" y="846" class="cardText">successful dispatch, duplicate idempotency keys, retryable failure + retry success, permanent failure, persistence, and MVC errors.</text>

  <path id="flow-controller-service" data-connector="flow-controller-service" d="M 338 340 H 470" class="flowHttp"/>
  <path id="flow-controller-advice" data-connector="flow-controller-advice" d="M 225 394 V 500" class="flowHttp"/>
  <path id="flow-service-repository" data-connector="flow-service-repository" d="M 700 320 H 830" class="flowService"/>
  <path id="flow-service-gateway" data-connector="flow-service-gateway" d="M 700 497 H 830" class="flowService"/>
  <path id="flow-repository-database" data-connector="flow-repository-database" d="M 1060 301 H 1190" class="flowOutbox"/>
  <path id="flow-gateway-fake" data-connector="flow-gateway-fake" d="M 1060 497 H 1190" class="flowIsolation"/>

  <text x="404" y="324" text-anchor="middle" class="label">submit/retry</text>
  <text x="246" y="456" text-anchor="middle" class="label">map errors</text>
  <text x="765" y="304" text-anchor="middle" class="label">create/read</text>
  <text x="765" y="481" text-anchor="middle" class="label">charge</text>
  <text x="1125" y="285" text-anchor="middle" class="label">persist</text>
  <text x="1125" y="481" text-anchor="middle" class="label">simulate</text>

  <text x="800" y="900" text-anchor="middle" class="footer">The workshop path never calls a real payment provider; tests replace the gateway and assert database state transitions.</text>
</svg>
