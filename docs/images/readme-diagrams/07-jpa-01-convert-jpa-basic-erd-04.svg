<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900" role="img" aria-label="BlogSchema ERD">
<defs>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/></filter>
<marker id="arrowGreen" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" viewBox="0 0 10 10" data-role="secondary" data-tip-direction="positive-x"><path d="M1,1 L9,5 L1,9 Z" fill="#6e8f4f" stroke="#6e8f4f" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
<marker id="arrowPurple" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" viewBox="0 0 10 10" data-role="secondary" data-tip-direction="positive-x"><path d="M1,1 L9,5 L1,9 Z" fill="#7d61b3" stroke="#7d61b3" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
<style>
.canvas{fill:#f6f9fc}.frame{fill:#fff;stroke:#d7e2ec;stroke-width:1.5}
.title{font-family:"Architects Daughter";font-size:31px;fill:#1e293b}
.subtitle,.detail{font-family:"Comic Mono";fill:#536476}
.subtitle{font-size:13px}.detail{font-size:12px}.tiny{font-family:"Comic Mono";font-size:10px;fill:#64748b}
.label{font-family:"Architects Daughter";font-size:17px;fill:#1e293b}
.cardinality{font-family:"Comic Mono";font-size:16px;font-weight:700;fill:#334155}
.tableBox{fill:#fff;stroke-width:1.8;filter:url(#shadow)}.rowLine{stroke:#d7e2ec;stroke-width:1}
.posts{stroke:#3b82f6}.comments{stroke:#d97706}.details{stroke:#16a34a}.postTags{stroke:#0f766e}.tags{stroke:#db2777}
.postsHead{fill:#dbeafe}.commentsHead{fill:#fef3c7}.detailsHead{fill:#dcfce7}.postTagsHead{fill:#ccfbf1}.tagsHead{fill:#fce7f3}
.relLine{fill:none;stroke:#6e8f4f;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowGreen)}
.runtimeUse{fill:none;stroke:#7d61b3;stroke-width:1.9;stroke-dasharray:6 5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowPurple)}
</style>
</defs>
<rect width="1400" height="900" class="canvas"/>
<rect x="20" y="20" width="1360" height="860" rx="16" class="frame"/>
<text x="48" y="58" class="title">BlogSchema ERD</text>
<text x="48" y="80" class="subtitle">BlogSchema keeps one-to-one details, one-to-many comments, and many-to-many tags explicit through post_tags.</text>

<rect x="70" y="158" width="330" height="250" rx="12" class="tableBox comments"/>
<path d="M70,202 L70,170 Q70,158 82,158 L388,158 Q400,158 400,170 L400,202 Z" class="commentsHead"/>
<text x="235" y="185" class="label" text-anchor="middle">post_comments</text>
<text x="94" y="232" class="detail">PK</text><text x="150" y="232" class="detail">id</text><text x="272" y="232" class="detail">BIGSERIAL</text>
<line x1="90" y1="252" x2="380" y2="252" class="rowLine"/>
<text x="94" y="282" class="detail">FK</text><text x="150" y="282" class="detail">post_id</text><text x="272" y="282" class="detail">BIGINT NOT NULL</text>
<line x1="90" y1="302" x2="380" y2="302" class="rowLine"/>
<text x="94" y="332" class="detail">NN</text><text x="150" y="332" class="detail">review</text><text x="272" y="332" class="detail">VARCHAR(255)</text>
<text x="94" y="374" class="tiny">Index</text><text x="150" y="374" class="tiny">post_comments_post_id</text>

<rect x="535" y="158" width="330" height="220" rx="12" class="tableBox posts"/>
<path d="M535,202 L535,170 Q535,158 547,158 L853,158 Q865,158 865,170 L865,202 Z" class="postsHead"/>
<text x="700" y="185" class="label" text-anchor="middle">posts</text>
<text x="559" y="232" class="detail">PK</text><text x="615" y="232" class="detail">id</text><text x="746" y="232" class="detail">BIGSERIAL</text>
<line x1="555" y1="252" x2="845" y2="252" class="rowLine"/>
<text x="559" y="282" class="detail">NN</text><text x="615" y="282" class="detail">title</text><text x="746" y="282" class="detail">VARCHAR(255)</text>

<rect x="1000" y="158" width="330" height="240" rx="12" class="tableBox details"/>
<path d="M1000,202 L1000,170 Q1000,158 1012,158 L1318,158 Q1330,158 1330,170 L1330,202 Z" class="detailsHead"/>
<text x="1165" y="185" class="label" text-anchor="middle">post_details</text>
<text x="1024" y="232" class="detail">PK/FK</text><text x="1096" y="232" class="detail">id</text><text x="1210" y="232" class="detail">BIGINT</text>
<line x1="1020" y1="252" x2="1310" y2="252" class="rowLine"/>
<text x="1024" y="282" class="detail">NN</text><text x="1096" y="282" class="detail">created_on</text><text x="1210" y="282" class="detail">DATE</text>
<line x1="1020" y1="302" x2="1310" y2="302" class="rowLine"/>
<text x="1024" y="332" class="detail">NN</text><text x="1096" y="332" class="detail">created_by</text><text x="1210" y="332" class="detail">VARCHAR(255)</text>

<rect x="535" y="514" width="330" height="250" rx="12" class="tableBox postTags"/>
<path d="M535,558 L535,526 Q535,514 547,514 L853,514 Q865,514 865,526 L865,558 Z" class="postTagsHead"/>
<text x="700" y="541" class="label" text-anchor="middle">post_tags</text>
<text x="559" y="588" class="detail">PK</text><text x="615" y="588" class="detail">id</text><text x="746" y="588" class="detail">BIGSERIAL</text>
<line x1="555" y1="608" x2="845" y2="608" class="rowLine"/>
<text x="559" y="638" class="detail">FK</text><text x="615" y="638" class="detail">post_id</text><text x="746" y="638" class="detail">BIGINT CASCADE</text>
<line x1="555" y1="658" x2="845" y2="658" class="rowLine"/>
<text x="559" y="688" class="detail">FK</text><text x="615" y="688" class="detail">tag_id</text><text x="746" y="688" class="detail">BIGINT CASCADE</text>
<text x="559" y="730" class="tiny">Unique</text><text x="615" y="730" class="tiny">post_id + tag_id</text>

<rect x="1000" y="544" width="330" height="190" rx="12" class="tableBox tags"/>
<path d="M1000,588 L1000,556 Q1000,544 1012,544 L1318,544 Q1330,544 1330,556 L1330,588 Z" class="tagsHead"/>
<text x="1165" y="571" class="label" text-anchor="middle">tags</text>
<text x="1024" y="618" class="detail">PK</text><text x="1080" y="618" class="detail">id</text><text x="1210" y="618" class="detail">BIGSERIAL</text>
<line x1="1020" y1="638" x2="1310" y2="638" class="rowLine"/>
<text x="1024" y="668" class="detail">NN</text><text x="1080" y="668" class="detail">name</text><text x="1210" y="668" class="detail">VARCHAR(255)</text>

<path data-connector="post-comments-post-id-to-posts-id" d="M412,282 L523,282" class="relLine"/>
<text x="424" y="262" class="cardinality">N</text>
<text x="504" y="262" class="cardinality">1</text>
<path data-connector="posts-id-to-post-details-id" d="M877,282 L988,282" class="relLine"/>
<text x="890" y="262" class="cardinality">1</text>
<text x="968" y="262" class="cardinality">1</text>
<path data-connector="post-tags-post-id-to-posts-id" d="M700,502 L700,390" class="relLine"/>
<text x="718" y="498" class="cardinality">N</text>
<text x="718" y="404" class="cardinality">1</text>
<path data-connector="post-tags-tag-id-to-tags-id" d="M877,638 L988,638" class="relLine"/>
<text x="890" y="618" class="cardinality">N</text>
<text x="968" y="618" class="cardinality">1</text>
<path data-connector="post-tags-implements-many-to-many" d="M700,764 L700,798 Q700,810 712,810 L1165,810 Q1177,810 1177,798 L1177,746" class="runtimeUse"/>
<text x="858" y="800" class="tiny">Post.tags and Tag.posts use via PostTagTable</text>

<rect x="174" y="830" width="1052" height="42" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.3"/>
<path d="M220,852 L280,852" class="relLine"/><text x="300" y="856" class="tiny">green = FK relationship with endpoint cardinality</text>
<path d="M642,852 L702,852" class="runtimeUse"/><text x="722" y="856" class="tiny">dashed purple = many-to-many DAO via relation</text>
</svg>
