<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1102 720" width="1102" height="720" role="img" aria-label="TreeNode self-reference ERD">
  <defs>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="136%">
      <feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
    <marker id="fkArrow" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" data-role="secondary" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#60758d" stroke="#60758d" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <style>
      .canvas{fill:#f6f9fc}
      .frame{fill:#ffffff;stroke:#d7e2ec;stroke-width:1.5}
      .tableBox{fill:#ffffff;stroke:#d97706;stroke-width:1.9;filter:url(#shadow)}
      .head{fill:#fef3c7}
      .title{font-family:"Architects Daughter";font-size:32px;fill:#1e293b}
      .subtitle{font-family:"Comic Mono";font-size:13px;fill:#536476}
      .tableTitle{font-family:"Architects Daughter";font-size:22px;fill:#1e293b}
      .field{font-family:"Comic Mono";font-size:13px;fill:#475569}
      .pk{fill:#1e3a8a;font-weight:700}
      .fk{fill:#8a4f0a;font-weight:700}
      .meta{font-family:"Comic Mono";font-size:12px;fill:#64748b}
      .relation{fill:none;stroke:#60758d;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#fkArrow)}
      .cardinality{font-family:"Architects Daughter";font-size:20px;fill:#334155}
      .noteBox{fill:#f8fafc;stroke:#d7e2ec;stroke-width:1.2;filter:url(#shadow)}
      .noteTitle{font-family:"Architects Daughter";font-size:18px;fill:#1e293b}
      .note{font-family:"Comic Mono";font-size:12px;fill:#475569}
    </style>
  </defs>

  <rect width="1102" height="720" class="canvas"/>
  <rect x="20" y="20" width="1062" height="680" rx="16" class="frame"/>
  <text x="48" y="60" class="title">TreeNode ERD</text>
  <text x="48" y="83" class="subtitle">A nullable parent_id models one parent with many child rows in the same tree_nodes table.</text>

  <g id="tree-nodes" data-node="tree_nodes">
    <rect x="342" y="132" width="420" height="360" rx="12" class="tableBox"/>
    <path d="M342,176 L342,144 Q342,132 354,132 L750,132 Q762,132 762,144 L762,176 Z" class="head"/>
    <text x="552" y="162" class="tableTitle" text-anchor="middle">tree_nodes</text>

    <text x="382" y="218" class="field pk">id BIGINT AUTO_INCREMENT PRIMARY KEY</text>
    <text x="382" y="246" class="field">title varchar(255)</text>
    <text x="382" y="274" class="field">description text?</text>
    <text x="382" y="302" class="field">depth int default 0</text>
    <text x="382" y="330" class="field fk">parent_id BIGINT? FK -> tree_nodes.id</text>
    <text x="382" y="374" class="meta">TreeNode.new() sets depth from parent depth + 1.</text>
    <text x="382" y="402" class="meta">children query filters rows where parent_id = current id.</text>
  </g>

  <path id="parent-self-reference" class="relation" data-connector="parent-self-reference" d="M342,330 L260,330 Q248,330 248,318 L248,228 Q248,216 260,216 L342,216"/>
  <text x="280" y="350" class="cardinality">N</text>
  <text x="280" y="208" class="cardinality">1</text>

  <g id="sample-tree" data-node="tree-shape">
    <rect x="118" y="542" width="866" height="78" rx="10" class="noteBox"/>
    <text x="551" y="572" class="noteTitle" text-anchor="middle">Example rows: root -> child1, child2; child1 -> grandChild1, grandChild2</text>
    <text x="551" y="596" class="note" text-anchor="middle">Recursive delete walks children in application code; production schemas can add cascade on parent_id.</text>
  </g>
</svg>
