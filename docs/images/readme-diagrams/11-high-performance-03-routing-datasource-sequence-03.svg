<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 980" width="1600" height="980" role="img" aria-label="Routing datasource request sequence">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
    <marker id="seqArrow" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#4f86c6" stroke="#4f86c6" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>

    <marker id="seqArrowAmber" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#a2743d" stroke="#a2743d" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="seqArrowTeal" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2b8f88" stroke="#2b8f88" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <style>
      text { letter-spacing: 0; }
      .canvas { fill: #fbfcf8; stroke: #40545d; stroke-width: 3; }
      .title { font-family: "Architects Daughter"; font-size: 36px; fill: #23323a; }
      .subtitle,.participant-sub,.msg,.detail { font-family: "Comic Mono"; fill: #324750; }
      .subtitle { font-size: 15px; }
      .header { fill: #fff; stroke-width: 2.1; filter: url(#shadow); }
      .actor { stroke: #617985; }
      .service { stroke: #617985; }
      .route { stroke: #617985; }
      .store { stroke: #617985; }
      .participant { font-family: "Architects Daughter"; font-size: 17px; fill: #20323b; }
      .participant-sub { font-size: 11px; fill: #60717a; }
      .lifeline { fill: none; stroke: #c7d5d1; stroke-width: 1.8; stroke-dasharray: 8 8; }
      .activation { fill: #ffffff; stroke: #7a8445; stroke-width: 1.7; rx: 5; }
      .call,.return { fill: none; stroke-width: 3.1; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#seqArrow); }
      .call { stroke: #4f86c6; marker-end: url(#seqArrow); }
      .return { stroke: #2b8f88; stroke-dasharray: 7 6; marker-end: url(#seqArrowTeal); }
      .pill { fill: #ffffff; stroke: #7a8445; stroke-width: 1.4; }
      .num { font-family: "Comic Mono"; font-size: 11px; font-weight: 700; fill: #7a8445; }
      .msg { font-size: 12px; font-weight: 700; }
      .detail { font-size: 12px; fill: #60717a; }
      .band { fill: none; stroke: #8298a3; stroke-width: 1.4; stroke-dasharray: 9 8; }
    </style>
  </defs>

  <rect x="24" y="24" width="1552" height="932" rx="20" class="canvas frame"/>
  <text x="800" y="76" text-anchor="middle" class="title">Multi-Tenant Read/Write Routing Sequence</text>
  <text x="800" y="106" text-anchor="middle" class="subtitle">The request tenant and transaction readOnly flag become the routing key before Exposed touches MarkerTable.</text>

  <rect x="46" y="138" width="148" height="62" rx="12" class="header actor"/>
  <text x="120" y="165" text-anchor="middle" class="participant">Client / Test</text>
  <text x="120" y="184" text-anchor="middle" class="participant-sub">X-Tenant-Id</text>

  <rect x="244" y="138" width="168" height="62" rx="12" class="header actor"/>
  <text x="328" y="165" text-anchor="middle" class="participant">TenantHeaderFilter</text>
  <text x="328" y="184" text-anchor="middle" class="participant-sub">TenantContext bind</text>

  <rect x="462" y="138" width="176" height="62" rx="12" class="header service"/>
  <text x="550" y="165" text-anchor="middle" class="participant">MarkerController</text>
  <text x="550" y="184" text-anchor="middle" class="participant-sub">@Transactional route</text>

  <rect x="688" y="138" width="184" height="62" rx="12" class="header service"/>
  <text x="780" y="165" text-anchor="middle" class="participant">MarkerRepository</text>
  <text x="780" y="184" text-anchor="middle" class="participant-sub">Exposed SQL</text>

  <rect x="922" y="138" width="188" height="62" rx="12" class="header route"/>
  <text x="1016" y="165" text-anchor="middle" class="participant">DynamicDataSource</text>
  <text x="1016" y="184" text-anchor="middle" class="participant-sub">getConnection()</text>

  <rect x="1160" y="138" width="184" height="62" rx="12" class="header route"/>
  <text x="1252" y="165" text-anchor="middle" class="participant">Resolver/Registry</text>
  <text x="1252" y="184" text-anchor="middle" class="participant-sub">tenant:rw or tenant:ro</text>

  <rect x="1394" y="138" width="156" height="62" rx="12" class="header store"/>
  <text x="1472" y="165" text-anchor="middle" class="participant">MarkerTable</text>
  <text x="1472" y="184" text-anchor="middle" class="participant-sub">selected database</text>

  <path class="lifeline" d="M 120 206 L 120 868"/>
  <path class="lifeline" d="M 328 206 L 328 868"/>
  <path class="lifeline" d="M 550 206 L 550 868"/>
  <path class="lifeline" d="M 780 206 L 780 868"/>
  <path class="lifeline" d="M 1016 206 L 1016 868"/>
  <path class="lifeline" d="M 1252 206 L 1252 868"/>
  <path class="lifeline" d="M 1472 206 L 1472 868"/>

  <rect x="320" y="232" width="16" height="536" rx="5" class="activation"/>
  <rect x="542" y="312" width="16" height="376" rx="5" class="activation"/>
  <rect x="772" y="392" width="16" height="252" rx="5" class="activation"/>
  <rect x="1008" y="472" width="16" height="172" rx="5" class="activation"/>
  <rect x="1244" y="552" width="16" height="92" rx="5" class="activation"/>
  <rect x="1464" y="632" width="16" height="96" rx="5" class="activation"/>

  <rect x="454" y="282" width="838" height="174" rx="16" class="band"/>
  <text x="873" y="310" text-anchor="middle" class="detail">readOnly=false yields tenant:rw; readOnly=true yields tenant:ro</text>

  <path id="m1" data-connector="m1" class="call" d="M 120 252 L 320 252"/>
  <rect x="156" y="218" width="227" height="22" rx="11" class="pill" style="stroke:#b6d3ec"/>
  <text x="174" y="233" text-anchor="middle" class="num" style="fill:#4f86c6">1</text>
  <text x="278" y="232" text-anchor="middle" class="msg">HTTP request with tenant</text>

  <path id="m2" data-connector="m2" class="call" d="M 336 332 L 542 332"/>
  <rect x="370" y="298" width="237" height="22" rx="11" class="pill" style="stroke:#b6d3ec"/>
  <text x="388" y="313" text-anchor="middle" class="num" style="fill:#4f86c6">2</text>
  <text x="502" y="312" text-anchor="middle" class="msg">TenantContext.withTenant</text>

  <path id="m3" data-connector="m3" class="call" d="M 558 412 L 772 412"/>
  <rect x="592" y="378" width="181" height="22" rx="11" class="pill" style="stroke:#b6d3ec"/>
  <text x="610" y="393" text-anchor="middle" class="num" style="fill:#4f86c6">3</text>
  <text x="686" y="392" text-anchor="middle" class="msg">findCurrentMarker()</text>

  <path id="m4" data-connector="m4" class="call" d="M 788 492 L 1008 492"/>
  <rect x="824" y="458" width="160" height="22" rx="11" class="pill" style="stroke:#b6d3ec"/>
  <text x="842" y="473" text-anchor="middle" class="num" style="fill:#4f86c6">4</text>
  <text x="916" y="472" text-anchor="middle" class="msg">ask connection</text>

  <path id="m5" data-connector="m5" class="call" d="M 1024 572 L 1244 572"/>
  <rect x="1060" y="538" width="161" height="22" rx="11" class="pill" style="stroke:#b6d3ec"/>
  <text x="1078" y="553" text-anchor="middle" class="num" style="fill:#4f86c6">5</text>
  <text x="1164" y="552" text-anchor="middle" class="msg">resolve key</text>

  <path id="m6" data-connector="m6" class="call" d="M 1024 652 L 1464 652"/>
  <rect x="1106" y="618" width="319" height="22" rx="11" class="pill" style="stroke:#b6d3ec"/>
  <text x="1124" y="633" text-anchor="middle" class="num" style="fill:#4f86c6">6</text>
  <text x="1368" y="632" text-anchor="middle" class="msg">execute SQL</text>

  <path id="m7" data-connector="m7" class="return" d="M 1464 742 L 558 742"/>
  <rect x="810" y="708" width="398" height="22" rx="11" class="pill" style="stroke:#add7d3"/>
  <text x="828" y="723" text-anchor="middle" class="num" style="fill:#2b8f88">7</text>
  <text x="1010" y="722" text-anchor="middle" class="msg">marker response includes tenant and readOnly flag</text>

  <path id="m8" data-connector="m8" class="return" d="M 320 822 L 120 822"/>
  <rect x="186" y="788" width="193" height="22" rx="11" class="pill" style="stroke:#add7d3"/>
  <text x="204" y="803" text-anchor="middle" class="num" style="fill:#2b8f88">8</text>
  <text x="292" y="802" text-anchor="middle" class="msg">clear TenantContext</text>
</svg>
