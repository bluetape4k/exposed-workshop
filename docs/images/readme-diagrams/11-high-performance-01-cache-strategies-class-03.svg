<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1020" width="1600" height="1020" role="img" aria-label="Cache strategy class structure">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
    <marker id="inheritHead" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="16" viewBox="0 0 18 16" refX="17" refY="8" orient="auto">
      <path d="M 1 1 L 17 8 L 1 15 Z" fill="#fbfcf8" stroke="#3f515a" stroke-width="1.8" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="arrowUse" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#3f8e84" stroke="#3f8e84" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <style>
      text { letter-spacing: 0; }
      .canvas { fill: #fbfcf8; stroke: #3f515a; stroke-width: 3; }
      .title { font-family: "Architects Daughter"; font-size: 36px; fill: #23323a; }
      .subtitle,.sectionNote,.cardText,.label,.footer { font-family: "Comic Mono"; fill: #324750; }
      .subtitle { font-size: 15px; }
      .section { fill: #f8fbfa; stroke: #d7e2de; stroke-width: 1.5; }
      .sectionNote { font-size: 12px; fill: #60717a; }
      .card { fill: #fff; stroke-width: 2.3; filter: url(#shadow); }
      .baseCard { stroke: #3f515a; }
      .readWriteCard { stroke: #5d948b; }
      .readOnlyCard { stroke: #ac7a34; }
      .writeBehindCard { stroke: #7b6bb4; }
      .configCard { stroke: #8fa1aa; }
      .cardTitle { font-family: "Architects Daughter"; font-size: 20px; fill: #20323b; }
      .cardType { font-family: "Comic Mono"; font-size: 12px; fill: #60717a; }
      .cardText { font-size: 13px; }
      .inheritLine { fill: none; stroke: #3f515a; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#inheritHead); }
      .useLine { fill: none; stroke: #3f8e84; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowUse); }
      .label { font-size: 12px; font-weight: 700; }
      .footer { font-size: 12px; fill: #60717a; }
    </style>
  </defs>

  <rect x="24" y="24" width="1552" height="972" rx="20" class="canvas"/>
  <text x="800" y="76" text-anchor="middle" class="title">Cache Strategy Class Structure</text>
  <text x="800" y="106" text-anchor="middle" class="subtitle">Concrete repositories inherit one Redisson-backed JDBC template and bind strategy-specific records, tables, and cache configs.</text>

  <rect x="70" y="132" width="1460" height="210" rx="16" class="section"/>
  <text x="110" y="164" class="sectionNote">Repository inheritance</text>

  <rect id="abstractRepository" x="200" y="185" width="1200" height="86" rx="12" class="card baseCard"/>
  <text x="800" y="218" text-anchor="middle" class="cardTitle">AbstractJdbcRedissonRepository&lt;K, V&gt;</text>
  <text x="800" y="244" text-anchor="middle" class="cardText">shared cache template: cache lookup, DB fallback, batch insert/update hooks, Redisson integration</text>

  <rect x="70" y="365" width="1460" height="390" rx="16" class="section"/>

  <rect id="userRepository" x="80" y="430" width="400" height="118" rx="12" class="card readWriteCard"/>
  <text x="280" y="462" text-anchor="middle" class="cardTitle">UserCacheRepository</text>
  <text x="280" y="482" text-anchor="middle" class="cardType">AbstractJdbcRedissonRepository&lt;Long, UserRecord&gt;</text>
  <text x="108" y="510" class="cardText">READ_WRITE_THROUGH_WITH_NEAR_CACHE</text>
  <text x="108" y="530" class="cardText">insertEntity/updateEntity persist UserTable</text>

  <rect id="credentialsRepository" x="600" y="430" width="400" height="118" rx="12" class="card readOnlyCard"/>
  <text x="800" y="462" text-anchor="middle" class="cardTitle">UserCredentialsCacheRepository</text>
  <text x="800" y="482" text-anchor="middle" class="cardType">AbstractJdbcRedissonRepository&lt;String, UserCredentialsRecord&gt;</text>
  <text x="628" y="510" class="cardText">READ_ONLY_WITH_NEAR_CACHE</text>
  <text x="628" y="530" class="cardText">insertEntity/updateEntity are explicit no-op hooks</text>

  <rect id="eventRepository" x="1120" y="430" width="400" height="118" rx="12" class="card writeBehindCard"/>
  <text x="1320" y="462" text-anchor="middle" class="cardTitle">UserEventCacheRepository</text>
  <text x="1320" y="482" text-anchor="middle" class="cardType">AbstractJdbcRedissonRepository&lt;Long, UserEventRecord&gt;</text>
  <text x="1148" y="510" class="cardText">WRITE_BEHIND_WITH_NEAR_CACHE</text>
  <text x="1148" y="530" class="cardText">batch insert eventually persists UserEventTable</text>

  <rect id="userBinding" x="80" y="620" width="400" height="98" rx="12" class="card readWriteCard"/>
  <text x="280" y="652" text-anchor="middle" class="cardTitle">User domain binding</text>
  <text x="108" y="680" class="cardText">UserRecord + UserTable + UserEntity</text>
  <text x="108" y="700" class="cardText">UserTable extends LongIdTable</text>

  <rect id="credentialsBinding" x="600" y="620" width="400" height="98" rx="12" class="card readOnlyCard"/>
  <text x="800" y="652" text-anchor="middle" class="cardTitle">Credentials domain binding</text>
  <text x="628" y="680" class="cardText">UserCredentialsRecord + UserCredentialsTable</text>
  <text x="628" y="700" class="cardText">table extends TimebasedUUIDBase62Table</text>

  <rect id="eventBinding" x="1120" y="620" width="400" height="98" rx="12" class="card writeBehindCard"/>
  <text x="1320" y="652" text-anchor="middle" class="cardTitle">Event domain binding</text>
  <text x="1148" y="680" class="cardText">UserEventRecord + UserEventTable + UserEventEntity</text>
  <text x="1148" y="700" class="cardText">UserEventTable extends LongIdTable</text>

  <path id="user-repository-inherits" data-connector="user-repository-inherits" d="M 280 430 L 280 271" class="inheritLine"/>
  <path id="credentials-repository-inherits" data-connector="credentials-repository-inherits" d="M 800 430 L 800 271" class="inheritLine"/>
  <path id="event-repository-inherits" data-connector="event-repository-inherits" d="M 1320 430 L 1320 271" class="inheritLine"/>

  <path id="user-repository-uses-domain" data-connector="user-repository-uses-domain" d="M 280 548 L 280 620" class="useLine"/>
  <path id="credentials-repository-uses-domain" data-connector="credentials-repository-uses-domain" d="M 800 548 L 800 620" class="useLine"/>
  <path id="event-repository-uses-domain" data-connector="event-repository-uses-domain" d="M 1320 548 L 1320 620" class="useLine"/>

  <text x="318" y="358" text-anchor="middle" class="label">inherits</text>
  <text x="838" y="358" text-anchor="middle" class="label">inherits</text>
  <text x="1358" y="358" text-anchor="middle" class="label">inherits</text>
  <text x="318" y="590" text-anchor="middle" class="label">binds</text>
  <text x="838" y="590" text-anchor="middle" class="label">binds</text>
  <text x="1358" y="590" text-anchor="middle" class="label">binds</text>

  <rect x="230" y="805" width="500" height="96" rx="12" class="card configCard"/>
  <text x="480" y="837" text-anchor="middle" class="cardTitle">RedissonConfig</text>
  <text x="258" y="865" class="cardText">creates RedissonClient from RedisServer launcher</text>
  <text x="258" y="885" class="cardText">keeps Spring from double-shutdown of Redisson</text>

  <rect x="870" y="805" width="500" height="96" rx="12" class="card configCard"/>
  <text x="1120" y="837" text-anchor="middle" class="cardTitle">TomcatVirtualThreadConfig</text>
  <text x="898" y="865" class="cardText">customizes ProtocolHandler executor</text>
  <text x="898" y="885" class="cardText">uses newVirtualThreadPerTaskExecutor()</text>

  <text x="800" y="952" text-anchor="middle" class="footer">Inheritance arrows use hollow UML heads; dependency arrows are smaller and only show repository-to-domain binding.</text>
</svg>
