<svg xmlns="http://www.w3.org/2000/svg" width="922" height="772" viewBox="0 0 922 772" role="img" aria-label="Window Function Structure">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
