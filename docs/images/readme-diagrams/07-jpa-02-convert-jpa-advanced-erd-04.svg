<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1102 740" width="1102" height="740" role="img" aria-label="Table per class inheritance ERD">
  <defs>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="136%">
      <feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
    <style>
      .canvas{fill:#f6f9fc}
      .frame{fill:#ffffff;stroke:#d7e2ec;stroke-width:1.5}
      .tableBox{fill:#ffffff;stroke-width:1.9;filter:url(#shadow)}
      .head{stroke-width:0}
      .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:32px;fill:#1e293b}
      .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;fill:#536476}
      .tableTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:22px;fill:#1e293b}
      .section{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:16px;fill:#334155}
      .field{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;fill:#475569}
      .pk{fill:#1e3a8a;font-weight:700}
      .unique{fill:#8a4f0a;font-weight:700}
      .meta{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;fill:#64748b}
      .noteBox{fill:#f8fafc;stroke:#d7e2ec;stroke-width:1.2;filter:url(#shadow)}
      .noteTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:18px;fill:#1e293b}
      .note{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;fill:#475569}
      .divider{stroke:#cbd5e1;stroke-width:1.2;stroke-dasharray:6 6}
    </style>
  </defs>

  <rect width="1102" height="740" class="canvas"/>
  <rect x="20" y="20" width="1062" height="700" rx="16" class="frame"/>
  <text x="48" y="60" class="title">Table Per Class Inheritance ERD</text>
  <text x="48" y="83" class="subtitle">Each subtype owns an independent UUID table; common billing columns are repeated instead of joined.</text>

  <g id="credit-card-table" data-node="credit_card">
    <rect x="86" y="132" width="420" height="430" rx="12" class="tableBox" stroke="#db2777"/>
    <path d="M86,176 L86,144 Q86,132 98,132 L494,132 Q506,132 506,144 L506,176 Z" class="head" fill="#fce7f3"/>
    <text x="296" y="162" class="tableTitle" text-anchor="middle">credit_card</text>

    <text x="120" y="212" class="section">Repeated common columns</text>
    <text x="140" y="240" class="field pk">id UUID PRIMARY KEY</text>
    <text x="140" y="262" class="field">owner varchar(64) indexed</text>
    <text x="140" y="284" class="field">swift varchar(16)</text>

    <line x1="120" y1="314" x2="472" y2="314" class="divider"/>
    <text x="120" y="346" class="section">CreditCard columns</text>
    <text x="140" y="374" class="field unique">card_number varchar(24) unique</text>
    <text x="140" y="396" class="field">company_name varchar(128)</text>
    <text x="140" y="418" class="field">exp_year integer</text>
    <text x="140" y="440" class="field">exp_month integer</text>
    <text x="140" y="462" class="field">start_date date</text>
    <text x="140" y="484" class="field">end_date date</text>
    <text x="140" y="524" class="meta">index(card_number, owner)</text>
  </g>

  <g id="bank-account-table" data-node="bank_account">
    <rect x="596" y="132" width="420" height="430" rx="12" class="tableBox" stroke="#0f766e"/>
    <path d="M596,176 L596,144 Q596,132 608,132 L1004,132 Q1016,132 1016,144 L1016,176 Z" class="head" fill="#ccfbf1"/>
    <text x="806" y="162" class="tableTitle" text-anchor="middle">bank_account</text>

    <text x="630" y="212" class="section">Repeated common columns</text>
    <text x="650" y="240" class="field pk">id UUID PRIMARY KEY</text>
    <text x="650" y="262" class="field">owner varchar(64) indexed</text>
    <text x="650" y="284" class="field">swift varchar(16)</text>

    <line x1="630" y1="314" x2="982" y2="314" class="divider"/>
    <text x="630" y="346" class="section">BankAccount columns</text>
    <text x="650" y="374" class="field unique">account_number varchar(24) unique</text>
    <text x="650" y="396" class="field">bank_name varchar(128)</text>
    <text x="650" y="524" class="meta">index(account_number, owner)</text>
  </g>

  <g id="strategy-note" data-node="table-per-class-contract">
    <rect x="206" y="604" width="690" height="66" rx="10" class="noteBox"/>
    <text x="551" y="632" class="noteTitle" text-anchor="middle">No table-to-table FK is created by the inheritance strategy.</text>
    <text x="551" y="654" class="note" text-anchor="middle">Cross-type queries must combine independent tables; each DAO reads its own subtype table.</text>
  </g>
</svg>
