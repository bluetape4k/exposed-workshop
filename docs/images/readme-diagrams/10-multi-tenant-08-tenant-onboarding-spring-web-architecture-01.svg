<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1720 1120" width="1720" height="1120" role="img" aria-label="Tenant onboarding Spring Web architecture">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowApi" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#3f8e84" stroke="#3f8e84" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="arrowProvision" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#a2743d" stroke="#a2743d" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="arrowCatalog" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#7667b1" stroke="#7667b1" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="arrowCleanup" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#69777e" stroke="#69777e" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <symbol id="databaseServerIcon" viewBox="0 0 128 128">
      <rect x="10" y="8" width="108" height="112" rx="18" fill="#fffaf2" stroke="#28485a" stroke-width="6"/>
      <ellipse cx="64" cy="36" rx="34" ry="13" fill="#fff0d8" stroke="#8c6f33" stroke-width="6"/>
      <path d="M30 36v44c0 8 15 14 34 14s34-6 34-14V36" fill="#fff0d8" stroke="#8c6f33" stroke-width="6" stroke-linejoin="round"/>
      <ellipse cx="64" cy="36" rx="34" ry="13" fill="none" stroke="#8c6f33" stroke-width="5"/>
      <path d="M30 58c0 8 15 14 34 14s34-6 34-14" fill="none" stroke="#8c6f33" stroke-width="5" stroke-linecap="round"/>
      <path d="M30 80c0 8 15 14 34 14s34-6 34-14" fill="none" stroke="#8c6f33" stroke-width="5" stroke-linecap="round"/>
    </symbol>
    <style>
      text { letter-spacing: 0; }
      .canvas { fill: #fbfcf8; stroke: #3f515a; stroke-width: 3; }
      .title { font-family: "Architects Daughter"; font-size: 38px; fill: #23323a; }
      .subtitle,.laneNote,.cardText,.label,.legendText,.footer { font-family: "Comic Mono"; fill: #324750; }
      .subtitle { font-size: 16px; }
      .laneTitle { font-family: "Architects Daughter"; font-size: 24px; fill: #23323a; }
      .laneNote { font-size: 13px; fill: #5b6d75; }
      .cardTitle { font-family: "Architects Daughter"; font-size: 21px; fill: #20323b; }
      .cardText { font-size: 13px; }
      .label { font-size: 12px; font-weight: 700; }
      .legendText { font-size: 12px; fill: #52666f; }
      .footer { font-size: 13px; fill: #60717a; }
      .laneApi { fill: #eef7f5; stroke: #6fa098; stroke-width: 2.2; }
      .laneService { fill: #fff7e8; stroke: #b98e50; stroke-width: 2.2; }
      .laneCatalog { fill: #f5f3fb; stroke: #8f82bd; stroke-width: 2.2; }
      .laneSchema { fill: #f4f7f8; stroke: #7f9299; stroke-width: 2.2; }
      .card { fill: #fff; stroke-width: 2.3; filter: url(#shadow); }
      .apiCard { stroke: #5d948b; }
      .serviceCard { stroke: #ac7a34; }
      .catalogCard { stroke: #7b6bb4; }
      .schemaCard { stroke: #69777e; }
      .cleanupCard { fill: #fffdf6; stroke: #69777e; }
      .flowApi { fill: none; stroke: #3f8e84; stroke-width: 4.0; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowApi); }
      .flowProvision { fill: none; stroke: #a2743d; stroke-width: 4.0; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowProvision); }
      .flowCatalog { fill: none; stroke: #7667b1; stroke-width: 4.0; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowCatalog); }
      .flowCleanup { fill: none; stroke: #69777e; stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowCleanup); }
      .legendLine { fill: none; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect x="24" y="24" width="1672" height="1072" rx="20" class="canvas"/>
  <text x="860" y="76" text-anchor="middle" class="title">Tenant Onboarding Spring Web</text>
  <text x="860" y="108" text-anchor="middle" class="subtitle">Metadata is inserted only after schema provisioning succeeds; partial schemas are dropped on failure.</text>

  <rect x="70" y="150" width="350" height="850" rx="18" class="laneApi"/>
  <text x="106" y="192" class="laneTitle">HTTP onboarding API</text>
  <text x="106" y="218" class="laneNote">Controller accepts commands and</text>
  <text x="106" y="238" class="laneNote">returns the final tenant record.</text>

  <rect x="460" y="150" width="410" height="850" rx="18" class="laneService"/>
  <text x="496" y="192" class="laneTitle">Onboarding service transaction</text>
  <text x="496" y="218" class="laneNote">One Exposed transaction gates</text>
  <text x="496" y="238" class="laneNote">validation, provisioning, and cleanup.</text>

  <rect x="920" y="150" width="330" height="850" rx="18" class="laneCatalog"/>
  <text x="956" y="192" class="laneTitle">Tenant catalog metadata</text>
  <text x="956" y="218" class="laneNote">Duplicate check happens before</text>
  <text x="956" y="238" class="laneNote">catalog insert.</text>

  <rect x="1290" y="150" width="360" height="850" rx="18" class="laneSchema"/>
  <text x="1326" y="192" class="laneTitle">Provisioned schema resources</text>
  <text x="1326" y="218" class="laneNote">Schema and marker table must</text>
  <text x="1326" y="238" class="laneNote">exist before ACTIVE status.</text>

  <rect id="controller" x="105" y="280" width="280" height="108" rx="12" class="card apiCard"/>
  <text x="245" y="312" text-anchor="middle" class="cardTitle">TenantOnboardingController</text>
  <text x="133" y="340" class="cardText">POST /tenants</text>
  <text x="133" y="360" class="cardText">GET /tenants/{tenantId}</text>

  <rect id="command" x="105" y="450" width="280" height="108" rx="12" class="card apiCard"/>
  <text x="245" y="482" text-anchor="middle" class="cardTitle">OnboardTenantCommand</text>
  <text x="133" y="510" class="cardText">tenantId, displayName</text>
  <text x="133" y="530" class="cardText">failAfterSchemaCreation test hook</text>

  <rect id="apiResult" x="105" y="710" width="280" height="138" rx="12" class="card apiCard"/>
  <text x="245" y="742" text-anchor="middle" class="cardTitle">TenantRecord response</text>
  <text x="133" y="770" class="cardText">tenantId and schemaName</text>
  <text x="133" y="790" class="cardText">status = ACTIVE</text>
  <text x="133" y="810" class="cardText">duplicates throw</text>
  <text x="133" y="830" class="cardText">DuplicateTenantException</text>

  <rect id="normalize" x="495" y="260" width="330" height="106" rx="12" class="card serviceCard"/>
  <text x="660" y="292" text-anchor="middle" class="cardTitle">Normalize and validate</text>
  <text x="523" y="320" class="cardText">tenantId -> lowercase safe key</text>
  <text x="523" y="340" class="cardText">schemaName = TENANT_*</text>

  <rect id="duplicateCheck" x="495" y="420" width="330" height="108" rx="12" class="card serviceCard"/>
  <text x="660" y="452" text-anchor="middle" class="cardTitle">Duplicate guard</text>
  <text x="523" y="480" class="cardText">findById(tenantId)</text>
  <text x="523" y="500" class="cardText">DuplicateTenantException on hit</text>

  <rect id="provision" x="495" y="590" width="330" height="122" rx="12" class="card serviceCard"/>
  <text x="660" y="622" text-anchor="middle" class="cardTitle">Provision inside transaction</text>
  <text x="523" y="650" class="cardText">CREATE SCHEMA</text>
  <text x="523" y="670" class="cardText">CREATE PROVISIONED_MARKER</text>
  <text x="523" y="690" class="cardText">insert catalog only after success</text>

  <rect id="cleanup" x="495" y="790" width="330" height="112" rx="12" class="card cleanupCard"/>
  <text x="660" y="822" text-anchor="middle" class="cardTitle">Provisioning failure cleanup</text>
  <text x="523" y="850" class="cardText">TenantProvisioningException</text>
  <text x="523" y="870" class="cardText">or RuntimeException drops schema</text>

  <rect id="database" x="950" y="260" width="280" height="110" rx="12" class="card catalogCard"/>
  <use data-bluetape4k-icon="generic/database-server.svg" href="#databaseServerIcon" x="980" y="294" width="46" height="46"/>
  <text x="1110" y="304" text-anchor="middle" class="cardTitle">H2 Database</text>
  <text x="1042" y="334" class="cardText">single datasource</text>
  <text x="1042" y="354" class="cardText">isAutoCommit = false</text>

  <rect id="tenantCatalog" x="950" y="420" width="280" height="112" rx="12" class="card catalogCard"/>
  <text x="1090" y="452" text-anchor="middle" class="cardTitle">TenantCatalog</text>
  <text x="978" y="480" class="cardText">tenant_id primary key</text>
  <text x="978" y="500" class="cardText">display_name, schema_name</text>
  <text x="978" y="520" class="cardText">status</text>

  <rect id="activeRecord" x="950" y="690" width="280" height="112" rx="12" class="card catalogCard"/>
  <text x="1090" y="722" text-anchor="middle" class="cardTitle">ACTIVE catalog row</text>
  <text x="978" y="750" class="cardText">inserted after marker table</text>
  <text x="978" y="770" class="cardText">find() returns TenantRecord</text>

  <rect id="tenantSchema" x="1320" y="590" width="290" height="106" rx="12" class="card schemaCard"/>
  <text x="1465" y="622" text-anchor="middle" class="cardTitle">Tenant schema</text>
  <text x="1348" y="650" class="cardText">CREATE SCHEMA TENANT_*</text>
  <text x="1348" y="670" class="cardText">schemaExists verifies result</text>

  <rect id="markerTable" x="1320" y="730" width="290" height="106" rx="12" class="card schemaCard"/>
  <text x="1465" y="762" text-anchor="middle" class="cardTitle">PROVISIONED_MARKER</text>
  <text x="1348" y="790" class="cardText">ID primary key</text>
  <text x="1348" y="810" class="cardText">CREATED_AT default timestamp</text>

  <rect id="dropSchema" x="1320" y="880" width="290" height="86" rx="12" class="card cleanupCard"/>
  <text x="1465" y="912" text-anchor="middle" class="cardTitle">DROP SCHEMA CASCADE</text>
  <text x="1348" y="940" class="cardText">removes partial resources</text>

  <path id="flow-controller-service" data-connector="flow-controller-service" d="M 385 334 L 495 334" class="flowApi"/>
  <path id="flow-normalize-duplicate" data-connector="flow-normalize-duplicate" d="M 660 366 L 660 420" class="flowProvision"/>
  <path id="flow-duplicate-catalog" data-connector="flow-duplicate-catalog" d="M 825 474 L 950 474" class="flowCatalog"/>
  <path id="flow-duplicate-provision" data-connector="flow-duplicate-provision" d="M 660 528 L 660 590" class="flowProvision"/>
  <path id="flow-provision-schema" data-connector="flow-provision-schema" d="M 825 651 L 1320 651" class="flowProvision"/>
  <path id="flow-schema-marker" data-connector="flow-schema-marker" d="M 1465 696 L 1465 730" class="flowProvision"/>
  <path id="flow-marker-active" data-connector="flow-marker-active" d="M 1320 783 L 1230 783" class="flowCatalog"/>
  <path id="flow-active-result" data-connector="flow-active-result" d="M 950 746 L 850 746 Q 830 746 830 768 L 830 768 Q 830 790 810 790 L 385 790" class="flowApi"/>
  <path id="flow-provision-cleanup" data-connector="flow-provision-cleanup" d="M 660 712 L 660 790" class="flowCleanup"/>
  <path id="flow-cleanup-drop" data-connector="flow-cleanup-drop" d="M 825 846 L 940 846 Q 960 846 960 866 L 960 923 Q 960 943 980 943 L 1320 943" class="flowCleanup"/>

  <text x="438" y="318" text-anchor="middle" class="label">onboard</text>
  <text x="842" y="456" text-anchor="middle" class="label">duplicate check</text>
  <text x="986" y="634" text-anchor="middle" class="label">provision first</text>
  <text x="1262" y="766" text-anchor="middle" class="label">insert ACTIVE</text>
  <text x="742" y="768" text-anchor="middle" class="label">return record</text>
  <text x="660" y="762" text-anchor="middle" class="label">catch</text>
  <text x="1120" y="926" text-anchor="middle" class="label">cleanup</text>

  <rect x="500" y="1012" width="720" height="36" rx="18" fill="#ffffff" stroke="#d7e2de" stroke-width="1.4"/>
  <path d="M 528 1030 L 586 1030" class="legendLine" stroke="#3f8e84"/>
  <text x="596" y="1034" class="legendText">HTTP result</text>
  <path d="M 724 1030 L 782 1030" class="legendLine" stroke="#a2743d"/>
  <text x="792" y="1034" class="legendText">provisioning transaction</text>
  <path d="M 994 1030 L 1052 1030" class="legendLine" stroke="#7667b1"/>
  <text x="1062" y="1034" class="legendText">catalog metadata</text>

  <text x="860" y="1080" text-anchor="middle" class="footer">Failure cleanup happens before catalog persistence, so a failed onboarding leaves neither catalog row nor provisioned schema.</text>
</svg>
