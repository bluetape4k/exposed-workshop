<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 740" width="1160" height="740" role="img" aria-label="Exposed SQL DSL User Cities ERD">
<defs>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/></filter>
<marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" viewBox="0 0 10 10" refX="9" refY="5" orient="auto" data-role="secondary" data-tip-direction="positive-x"><path stroke-dasharray="none" style="stroke-dasharray:none!important" d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b" stroke="#64748b" stroke-width="0"/></marker>
<marker id="arrowBlue" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" viewBox="0 0 10 10" refX="9" refY="5" orient="auto" data-role="secondary" data-tip-direction="positive-x"><path stroke-dasharray="none" style="stroke-dasharray:none!important" d="M 0 0 L 10 5 L 0 10 Z" fill="#2563eb" stroke="#2563eb" stroke-width="0"/></marker>
<marker id="arrowPurple" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" viewBox="0 0 10 10" refX="9" refY="5" orient="auto" data-role="secondary" data-tip-direction="positive-x"><path stroke-dasharray="none" style="stroke-dasharray:none!important" d="M 0 0 L 10 5 L 0 10 Z" fill="#7c3aed" stroke="#7c3aed" stroke-width="0"/></marker>
<marker id="arrowOrange" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" viewBox="0 0 10 10" refX="9" refY="5" orient="auto" data-role="secondary" data-tip-direction="positive-x"><path stroke-dasharray="none" style="stroke-dasharray:none!important" d="M 0 0 L 10 5 L 0 10 Z" fill="#ea580c" stroke="#ea580c" stroke-width="0"/></marker>
<marker id="arrowTeal" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" viewBox="0 0 10 10" refX="9" refY="5" orient="auto" data-role="secondary" data-tip-direction="positive-x"><path stroke-dasharray="none" style="stroke-dasharray:none!important" d="M 0 0 L 10 5 L 0 10 Z" fill="#0f766e" stroke="#0f766e" stroke-width="0"/></marker>
<style>
.canvas{fill:#f6f9fc}.frame{fill:#fff;stroke:#d7e2ec;stroke-width:1.5}
.title{font-family:"Architects Daughter";font-size:31px;fill:#1e293b}
.subtitle,.detail{font-family:"Comic Mono";fill:#536476}
.subtitle{font-size:13px}.detail{font-size:12px}.tiny{font-family:"Comic Mono";font-size:10px;fill:#64748b}
.label{font-family:"Architects Daughter";font-size:17px;fill:#1e293b}
.panelTitle{font-family:"Architects Daughter";font-size:12px;letter-spacing:.08em;fill:#94a3b8}
.card{stroke-width:1.7;filter:url(#shadow)}.panel{fill:#f8fafc;stroke:#d7e2ec;stroke-width:1.2}
.arrow{fill:none;stroke:#2563eb;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowBlue)}
.runtimeUse{fill:none;stroke:#7c3aed;stroke-width:1.8;stroke-dasharray:5 5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowPurple)}
.dbUse{fill:none;stroke:#ea580c;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowOrange)}
.fkArrow{fill:none;stroke:#0f766e;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowTeal)}
.returnLine{fill:none;stroke:#64748b;stroke-width:1.8;stroke-dasharray:6 5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
.lifeline{stroke:#cbd5e1;stroke-width:1.5;stroke-dasharray:5 6}
.inherit{fill:none;stroke:#475569;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.inheritHead{fill:#fff;stroke:#475569;stroke-width:1.8;stroke-linejoin:round}
</style>
</defs>
<rect width="1160" height="740" class="canvas"/>
<rect x="20" y="20" width="1120" height="700" rx="16" class="frame"/>
<text x="48" y="58" class="title">Exposed SQL DSL User Cities ERD</text>
<text x="48" y="80" class="subtitle">users.city_id is a nullable foreign key to cities.id; two sample users intentionally have no city</text>
<rect x="76" y="142" width="420" height="282" rx="12" class="panel"/><text x="286" y="134" class="panelTitle" text-anchor="middle">PARENT TABLE</text>
<rect x="124" y="188" width="322" height="132" rx="12" fill="#fff" stroke="#3b82f6" class="card"/>
<path d="M124,230 L124,200 Q124,188 136,188 L434,188 Q446,188 446,200 L446,230 Z" fill="#dbeafe"/>
<text x="285" y="216" class="label" text-anchor="middle">cities</text>
<text x="142" y="258" class="tiny">id SERIAL PK</text>
<text x="142" y="275" class="tiny">name VARCHAR(50) NOT NULL</text>
<rect x="622" y="142" width="420" height="326" rx="12" class="panel"/><text x="832" y="134" class="panelTitle" text-anchor="middle">CHILD TABLE</text>
<rect x="670" y="188" width="322" height="166" rx="12" fill="#fff" stroke="#16a34a" class="card"/>
<path d="M670,230 L670,200 Q670,188 682,188 L980,188 Q992,188 992,200 L992,230 Z" fill="#dcfce7"/>
<text x="831" y="216" class="label" text-anchor="middle">users</text>
<text x="688" y="258" class="tiny">id VARCHAR(10) PK</text>
<text x="688" y="275" class="tiny">name VARCHAR(50) NOT NULL</text>
<text x="688" y="292" class="tiny">city_id INT NULL FK</text>
<path d="M670,276 L446,276" class="fkArrow edge"/>
<rect x="506" y="258" width="112" height="24" rx="8" fill="#fff" stroke="#99f6e4"/>
<text x="562" y="275" class="tiny" text-anchor="middle">users.city_id</text>
<text x="458" y="268" class="tiny">1</text>
<text x="650" y="268" class="tiny">0..N</text>
<rect x="142" y="536" width="876" height="86" rx="12" class="panel"/><text x="580" y="528" class="panelTitle" text-anchor="middle">SAMPLE DATA</text>
<rect x="188" y="552" width="192" height="58" rx="10" fill="#dbeafe" stroke="#3b82f6" class="card"/>
<text x="284" y="577" class="label" text-anchor="middle">3 cities</text>
<text x="284" y="596" class="detail" text-anchor="middle">Seoul Busan Da</text>
<rect x="484" y="552" width="220" height="58" rx="10" fill="#dcfce7" stroke="#16a34a" class="card"/>
<text x="594" y="577" class="label" text-anchor="middle">5 users</text>
<text x="594" y="596" class="detail" text-anchor="middle">debop jane john alex smth</text>
<rect x="784" y="552" width="190" height="58" rx="10" fill="#fef3c7" stroke="#d97706" class="card"/>
<text x="879" y="577" class="label" text-anchor="middle">2 null city refs</text>
<text x="879" y="596" class="detail" text-anchor="middle">alex smth</text>
<rect x="142" y="660" width="876" height="48" rx="10" fill="#ecfdf5" stroke="#86efac" stroke-width="1.3"/>
<text x="580" y="690" class="detail" text-anchor="middle">Nullable city ownership is explicit: sample users can exist with or without a City row.</text>
</svg>
