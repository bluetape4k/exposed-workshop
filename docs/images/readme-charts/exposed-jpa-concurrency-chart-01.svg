<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="594" viewBox="0 0 1500 594">

<defs>
  <filter id="shadow" x="-16%" y="-16%" width="132%" height="132%">
    <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#94a3b8" flood-opacity=".16"/>
  </filter>
  <style><![CDATA[
    svg{font-family:'Comic Mono','Comic Sans MS','Comic Neue','Chalkboard SE',cursive}
    .canvas{fill:#f6f9fc}
    .frame{fill:#ffffff;stroke:#cddceb;stroke-width:2.5;filter:url(#shadow)}
    .title{font-family:'Architects Daughter','Comic Mono','Comic Sans MS',cursive;font-size:40px;font-weight:400;fill:#25364f}
    .subtitle,.legend,.note,.axis{font-family:'Comic Mono','Comic Sans MS','Comic Neue','Chalkboard SE',cursive;fill:#526276;font-weight:400}
    .subtitle{font-size:18px}
    .legend{font-size:16px}
    .note{font-size:17px}
    .axis{font-size:15px}
    .label{font-family:'Comic Mono','Comic Sans MS','Comic Neue','Chalkboard SE',cursive;font-size:18px;fill:#25364f;font-weight:400}
    .value{font-family:'Comic Mono','Comic Sans MS','Comic Neue','Chalkboard SE',cursive;font-size:16px;fill:#25364f;font-weight:600}
    .bar{shape-rendering:geometricPrecision}
    .footerBox{fill:#f8fafc;stroke:#dbe6f1;stroke-width:2}
  ]]></style>
</defs>
<rect class="canvas" width="1500" height="594"/>
<rect class="frame" x="48" y="40" width="1404" height="514" rx="26"/>
<text class="title" x="82" y="102">Concurrent CRUD Latency</text>
<text class="subtitle" x="84" y="134">50 tasks; best thread model per framework</text>
<rect x="910" y="154" width="16" height="16" rx="5" fill="#67b7dc"/>
<text class="legend" x="935" y="167">Exposed</text>
<rect x="1026" y="154" width="16" height="16" rx="5" fill="#f5a1bf"/>
<text class="legend" x="1051" y="167">JPA</text>
<text class="axis" x="365" y="198">ms</text>
<text class="label" x="84" y="244">concurrentCreate</text>
<rect class="bar" x="365" y="214" width="27.2" height="20" rx="8" fill="#67b7dc"/>
<text class="value" x="406.2" y="230">9,182 ms</text>
<rect class="bar" x="365" y="242" width="75.1" height="20" rx="8" fill="#f5a1bf"/>
<text class="value" x="454.1" y="258">25,297 ms</text>
<text class="label" x="84" y="326">concurrentRead</text>
<rect class="bar" x="365" y="296" width="191.3" height="20" rx="8" fill="#67b7dc"/>
<text class="value" x="570.3" y="312">64,464 ms</text>
<rect class="bar" x="365" y="324" width="810.0" height="20" rx="8" fill="#f5a1bf"/>
<text class="value" x="1189.0" y="340">272,958 ms</text>
<text class="label" x="84" y="408">concurrentMixed</text>
<rect class="bar" x="365" y="378" width="116.6" height="20" rx="8" fill="#67b7dc"/>
<text class="value" x="495.6" y="394">39,298 ms</text>
<rect class="bar" x="365" y="406" width="468.4" height="20" rx="8" fill="#f5a1bf"/>
<text class="value" x="847.4" y="422">157,837 ms</text>
<rect class="footerBox" x="78" y="488" width="1344" height="42" rx="20"/>
<text class="note" x="98" y="515">Lower is better.</text>
</svg>
