<text class="title" x="56" y="72">Concurrent CRUD Latency</text><text class="subtitle" x="58" y="104" font-size="18">50 tasks; best thread model per framework</text><rect x="56" y="116" width="18" height="18" rx="5" fill="#8ecae6"/><text class="legend" x="82" y="131">Exposed</text><rect x="176" y="116" width="18" height="18" rx="5" fill="#ffb3c7"/><text class="legend" x="202" y="131">JPA</text><text class="label" x="56" y="173">concurrentCreate</text><rect x="285" y="142" width="23.87759419816547" height="18" rx="7" fill="#8ecae6"/><text class="value" x="318.87759419816547" y="157" font-size="16">9,182 ms</text><rect x="285" y="166" width="65.78430629830018" height="18" rx="7" fill="#ffb3c7"/><text class="value" x="360.7843062983002" y="181" font-size="16">25,297 ms</text><text class="label" x="56" y="247">concurrentRead</text><rect x="285" y="216" width="167.6372503148051" height="18" rx="7" fill="#8ecae6"/><text class="value" x="462.6372503148051" y="231" font-size="16">64,464 ms</text><rect x="285" y="240" width="709.8214285714286" height="18" rx="7" fill="#ffb3c7"/><text class="value" x="1004.8214285714286" y="255" font-size="16">272,958 ms</text><text class="label" x="56" y="321">concurrentMixed</text><rect x="285" y="290" width="102.19360670872442" height="18" rx="7" fill="#8ecae6"/><text class="value" x="397.1936067087244" y="305" font-size="16">39,298 ms</text><rect x="285" y="314" width="410.4517355103296" height="18" rx="7" fill="#ffb3c7"/><text class="value" x="705.4517355103296" y="329" font-size="16">157,837 ms</text><text class="note" x="56" y="460">Lower is better.</text></svg>
