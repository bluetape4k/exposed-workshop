<rect x="24" y="24" width="1232" height="572" rx="18" fill="#ffffff" stroke="#d7e3ee" stroke-width="2"/>
<text class="title" x="56" y="72">Single Entity CRUD Latency</text><text class="subtitle" x="58" y="104" font-size="18">Person entity on PostgreSQL</text><rect x="56" y="116" width="18" height="18" rx="5" fill="#8ecae6"/><text class="legend" x="82" y="131">Exposed</text><rect x="176" y="116" width="18" height="18" rx="5" fill="#ffb3c7"/><text class="legend" x="202" y="131">JPA</text><text class="label" x="56" y="173">create</text><rect x="285" y="142" width="88.96246772557856" height="18" rx="7" fill="#8ecae6"/><text class="value" x="383.96246772557856" y="157" font-size="16">1,196 us</text><rect x="285" y="166" width="248.9801755064052" height="18" rx="7" fill="#ffb3c7"/><text class="value" x="543.9801755064052" y="181" font-size="16">4,623 us</text><text class="label" x="56" y="247">read</text><rect x="285" y="216" width="148.14569980051914" height="18" rx="7" fill="#8ecae6"/><text class="value" x="443.14569980051914" y="231" font-size="16">1,972 us</text><rect x="285" y="240" width="357.87885479470765" height="18" rx="7" fill="#ffb3c7"/><text class="value" x="652.8788547947076" y="255" font-size="16">11,602 us</text><text class="label" x="56" y="321">update</text><rect x="285" y="290" width="148.62485404347808" height="18" rx="7" fill="#8ecae6"/><text class="value" x="443.6248540434781" y="305" font-size="16">1,980 us</text><rect x="285" y="314" width="390.45333904175413" height="18" rx="7" fill="#ffb3c7"/><text class="value" x="685.4533390417541" y="329" font-size="16">15,278 us</text><text class="label" x="56" y="395">delete</text><rect x="285" y="364" width="146.5140807590269" height="18" rx="7" fill="#8ecae6"/><text class="value" x="441.5140807590269" y="379" font-size="16">1,945 us</text><rect x="285" y="388" width="362.4511978949263" height="18" rx="7" fill="#ffb3c7"/><text class="value" x="657.4511978949263" y="403" font-size="16">12,059 us</text><text class="label" x="56" y="469">batchCreate</text><rect x="285" y="438" width="533.5850961328392" height="18" rx="7" fill="#8ecae6"/><text class="value" x="828.5850961328392" y="453" font-size="16">51,203 us</text><rect x="285" y="462" width="783.7199509762136" height="18" rx="7" fill="#ffb3c7"/><text class="value" x="1078.7199509762136" y="477" font-size="16">423,816 us</text><text class="label" x="56" y="543">readAll</text><rect x="285" y="512" width="27.74467494774956" height="18" rx="7" fill="#8ecae6"/><text class="value" x="322.74467494774956" y="527" font-size="16">713 us</text><rect x="285" y="536" width="26.409248239103817" height="18" rx="7" fill="#ffb3c7"/><text class="value" x="321.4092482391038" y="551" font-size="16">705 us</text><text class="axis" x="285" y="556">log scale</text><text class="note" x="56" y="580">Lower is better. Log scale keeps readAll and batchCreate in one chart.</text></svg>
