<text class="title" x="56" y="72">Spring Boot Virtual Thread Load Test</text><text class="subtitle" x="58" y="104" font-size="18">Throughput and latency from published benchmark</text><text class="axis" x="260" y="124">req/s</text><text class="axis" x="820" y="124">ms latency</text><text class="label" x="56" y="173">MVC workload</text><rect x="260" y="145" width="358.47244792436095" height="18" rx="7" fill="#8ecae6"/><text class="value" x="626.472447924361" y="160" font-size="15">844</text><rect x="260" y="169" width="410.71428571428555" height="18" rx="7" fill="#ffb3c7"/><text class="value" x="678.7142857142856" y="184" font-size="15">967</text><rect x="820" y="145" width="258.92857142857133" height="18" rx="7" fill="#8ecae6"/><text class="value" x="1086.9285714285713" y="160" font-size="15">448</text><rect x="820" y="169" width="184.37101403061217" height="18" rx="7" fill="#ffb3c7"/><text class="value" x="1012.3710140306122" y="184" font-size="15">319</text><text class="note" x="56" y="320">Higher throughput and lower latency are better.</text></svg>
