<text class="title" x="56" y="72">Read-Through Cache Hit/Miss Cost</text><text class="subtitle" x="58" y="104" font-size="18">Pure in-memory cache layer benchmark</text><rect x="56" y="116" width="18" height="18" rx="5" fill="#8ecae6"/><text class="legend" x="82" y="131">256 B</text><rect x="156" y="116" width="18" height="18" rx="5" fill="#ffb3c7"/><text class="legend" x="182" y="131">4 KB</text><text class="label" x="56" y="173">dbOnlyRead</text><rect x="285" y="142" width="7" height="18" rx="7" fill="#8ecae6"/><text class="value" x="302" y="157" font-size="16">0.001 us/op</text><rect x="285" y="166" width="7" height="18" rx="7" fill="#ffb3c7"/><text class="value" x="302" y="181" font-size="16">0.001 us/op</text><text class="label" x="56" y="247">cacheHit</text><rect x="285" y="216" width="10.59434968017058" height="18" rx="7" fill="#8ecae6"/><text class="value" x="305.5943496801706" y="231" font-size="16">0.002 us/op</text><rect x="285" y="240" width="10.59434968017058" height="18" rx="7" fill="#ffb3c7"/><text class="value" x="305.5943496801706" y="255" font-size="16">0.002 us/op</text><text class="label" x="56" y="321">cacheMiss</text><rect x="285" y="290" width="593.2835820895522" height="18" rx="7" fill="#8ecae6"/><text class="value" x="888.2835820895522" y="305" font-size="16">0.112 us/op</text><rect x="285" y="314" width="709.8214285714286" height="18" rx="7" fill="#ffb3c7"/><text class="value" x="1004.8214285714286" y="329" font-size="16">0.134 us/op</text><text class="note" x="56" y="390">Lower is better.</text></svg>
