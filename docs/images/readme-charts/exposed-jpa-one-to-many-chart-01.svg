<text class="title" x="56" y="72">One-to-Many CRUD Latency</text><text class="subtitle" x="58" y="104" font-size="18">Department with 20 employees</text><rect x="56" y="116" width="18" height="18" rx="5" fill="#8ecae6"/><text class="legend" x="82" y="131">Exposed</text><rect x="176" y="116" width="18" height="18" rx="5" fill="#ffb3c7"/><text class="legend" x="202" y="131">JPA</text><text class="label" x="56" y="173">create</text><rect x="285" y="142" width="340.13737102215987" height="18" rx="7" fill="#8ecae6"/><text class="value" x="635.1373710221599" y="157" font-size="16">13,489 us</text><rect x="285" y="166" width="541.522476091106" height="18" rx="7" fill="#ffb3c7"/><text class="value" x="836.522476091106" y="181" font-size="16">87,556 us</text><text class="label" x="56" y="247">read</text><rect x="285" y="216" width="361.7855241625464" height="18" rx="7" fill="#8ecae6"/><text class="value" x="656.7855241625464" y="231" font-size="16">16,493 us</text><rect x="285" y="240" width="635.6798307145178" height="18" rx="7" fill="#ffb3c7"/><text class="value" x="930.6798307145178" y="255" font-size="16">209,932 us</text><text class="label" x="56" y="321">update</text><rect x="285" y="290" width="347.53225592528383" height="18" rx="7" fill="#8ecae6"/><text class="value" x="642.5322559252838" y="305" font-size="16">14,448 us</text><rect x="285" y="314" width="662.3848415672923" height="18" rx="7" fill="#ffb3c7"/><text class="value" x="957.3848415672923" y="329" font-size="16">269,027 us</text><text class="label" x="56" y="395">delete</text><rect x="285" y="364" width="352.5410337001308" height="18" rx="7" fill="#8ecae6"/><text class="value" x="647.5410337001308" y="379" font-size="16">15,136 us</text><rect x="285" y="388" width="643.66012025801" height="18" rx="7" fill="#ffb3c7"/><text class="value" x="938.66012025801" y="403" font-size="16">226,083 us</text><text class="label" x="56" y="469">batchCreate</text><rect x="285" y="438" width="589.6287791624418" height="18" rx="7" fill="#8ecae6"/><text class="value" x="884.6287791624418" y="453" font-size="16">136,876 us</text><rect x="285" y="462" width="784.7380191342304" height="18" rx="7" fill="#ffb3c7"/><text class="value" x="1079.7380191342304" y="477" font-size="16">838,145 us</text><text class="label" x="56" y="543">readAll</text><rect x="285" y="512" width="24.02571119483241" height="18" rx="7" fill="#8ecae6"/><text class="value" x="319.0257111948324" y="527" font-size="16">716 us</text><rect x="285" y="536" width="25.073231811099106" height="18" rx="7" fill="#ffb3c7"/><text class="value" x="320.0732318110991" y="551" font-size="16">723 us</text><text class="axis" x="285" y="556">log scale</text><text class="note" x="56" y="580">Lower is better. Log scale keeps readAll and batchCreate in one chart.</text></svg>
