<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="810" viewBox="0 0 1500 810">

<defs>
  <filter id="shadow" x="-16%" y="-16%" width="132%" height="132%">
    <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#94a3b8" flood-opacity=".16"/>
  </filter>
  <style><![CDATA[
    svg{font-family:'Comic Mono','Comic Sans MS','Comic Neue','Chalkboard SE',cursive}
    .canvas{fill:#f6f9fc}
    .frame{fill:#ffffff;stroke:#cddceb;stroke-width:2.5;filter:url(#shadow)}
    .title{font-family:'Architects Daughter','Comic Mono','Comic Sans MS',cursive;font-size:40px;font-weight:400;fill:#25364f}
    .subtitle,.legend,.note,.axis{font-family:'Comic Mono','Comic Sans MS','Comic Neue','Chalkboard SE',cursive;fill:#526276;font-weight:400}
    .subtitle{font-size:18px}
    .legend{font-size:16px}
    .note{font-size:17px}
    .axis{font-size:15px}
    .label{font-family:'Comic Mono','Comic Sans MS','Comic Neue','Chalkboard SE',cursive;font-size:18px;fill:#25364f;font-weight:400}
    .value{font-family:'Comic Mono','Comic Sans MS','Comic Neue','Chalkboard SE',cursive;font-size:16px;fill:#25364f;font-weight:600}
    .bar{shape-rendering:geometricPrecision}
    .footerBox{fill:#f8fafc;stroke:#dbe6f1;stroke-width:2}
  ]]></style>
</defs>
<rect class="canvas" width="1500" height="810"/>
<rect class="frame" x="48" y="40" width="1404" height="730" rx="26"/>
<text class="title" x="82" y="102">One-to-Many CRUD Latency</text>
<text class="subtitle" x="84" y="134">Department with 20 employees</text>
<rect x="910" y="154" width="16" height="16" rx="5" fill="#67b7dc"/>
<text class="legend" x="935" y="167">Exposed</text>
<rect x="1026" y="154" width="16" height="16" rx="5" fill="#f5a1bf"/>
<text class="legend" x="1051" y="167">JPA</text>
<text class="axis" x="365" y="198">us - log scale</text>
<text class="label" x="84" y="244">create</text>
<rect class="bar" x="365" y="214" width="353.0" height="20" rx="8" fill="#67b7dc"/>
<text class="value" x="732.0" y="230">13,489 us</text>
<rect class="bar" x="365" y="242" width="560.0" height="20" rx="8" fill="#f5a1bf"/>
<text class="value" x="939.0" y="258">87,556 us</text>
<text class="label" x="84" y="320">read</text>
<rect class="bar" x="365" y="290" width="375.2" height="20" rx="8" fill="#67b7dc"/>
<text class="value" x="754.2" y="306">16,493 us</text>
<rect class="bar" x="365" y="318" width="656.8" height="20" rx="8" fill="#f5a1bf"/>
<text class="value" x="1035.8" y="334">209,932 us</text>
<text class="label" x="84" y="396">update</text>
<rect class="bar" x="365" y="366" width="360.6" height="20" rx="8" fill="#67b7dc"/>
<text class="value" x="739.6" y="382">14,448 us</text>
<rect class="bar" x="365" y="394" width="684.2" height="20" rx="8" fill="#f5a1bf"/>
<text class="value" x="1063.2" y="410">269,027 us</text>
<text class="label" x="84" y="472">delete</text>
<rect class="bar" x="365" y="442" width="365.7" height="20" rx="8" fill="#67b7dc"/>
<text class="value" x="744.7" y="458">15,136 us</text>
<rect class="bar" x="365" y="470" width="665.0" height="20" rx="8" fill="#f5a1bf"/>
<text class="value" x="1044.0" y="486">226,083 us</text>
<text class="label" x="84" y="548">batchCreate</text>
<rect class="bar" x="365" y="518" width="609.4" height="20" rx="8" fill="#67b7dc"/>
<text class="value" x="988.4" y="534">136,876 us</text>
<rect class="bar" x="365" y="546" width="810.0" height="20" rx="8" fill="#f5a1bf"/>
<text class="value" x="1189.0" y="562">838,145 us</text>
<text class="label" x="84" y="624">readAll</text>
<rect class="bar" x="365" y="594" width="28.0" height="20" rx="8" fill="#67b7dc"/>
<text class="value" x="407.0" y="610">716 us</text>
<rect class="bar" x="365" y="622" width="29.1" height="20" rx="8" fill="#f5a1bf"/>
<text class="value" x="408.1" y="638">723 us</text>
<rect class="footerBox" x="78" y="704" width="1344" height="42" rx="20"/>
<text class="note" x="98" y="731">Lower is better. Log scale keeps readAll and batchCreate in one chart.</text>
</svg>
