<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
<style>
.title{font-family:'Architects Daughter','Comic Sans MS','Comic Neue',cursive;font-size:34px;font-weight:400;fill:#273043}
.subtitle,.axis,.legend,.note{font-family:'Comic Mono','Comic Sans MS','Comic Neue','Chalkboard SE',cursive;fill:#6b7280;font-weight:400}
.label{font-family:'Comic Mono','Comic Sans MS','Comic Neue','Chalkboard SE',cursive;fill:#273043;font-weight:400}
.value{font-family:'Comic Mono','Comic Sans MS','Comic Neue','Chalkboard SE',cursive;fill:#273043;font-weight:400;font-size:18px}
.axis{font-size:16px}.legend{font-size:18px}.note{font-size:17px}.label{font-size:18px}
</style>
<rect width="1280" height="640" rx="0" fill="#f6f8fb"/>
<rect x="24" y="24" width="1232" height="592" rx="18" fill="#ffffff" stroke="#d7e3ee" stroke-width="2"/>
<text class="title" x="56" y="72">Cache Strategy Latency</text><text class="subtitle" x="58" y="104" font-size="18">PostgreSQL + HikariCP smoke benchmark</text><rect x="56" y="116" width="18" height="18" rx="5" fill="#8ecae6"/><text class="legend" x="82" y="131">READ_HEAVY</text><rect x="206" y="116" width="18" height="18" rx="5" fill="#ffb3c7"/><text class="legend" x="232" y="131">WRITE_HEAVY</text><text class="label" x="56" y="173">NoCache / 256B</text><rect x="285" y="142" width="709.8214285714286" height="18" rx="7" fill="#8ecae6"/><text class="value" x="1004.8214285714286" y="157" font-size="16">547.7 us/op</text><rect x="285" y="166" width="654.8456563560295" height="18" rx="7" fill="#ffb3c7"/><text class="value" x="949.8456563560295" y="181" font-size="16">505.3 us/op</text><text class="label" x="56" y="247">ReadThrough / 256B</text><rect x="285" y="216" width="113.42592200162176" height="18" rx="7" fill="#8ecae6"/><text class="value" x="408.42592200162176" y="231" font-size="16">87.5 us/op</text><rect x="285" y="240" width="620.2211058385851" height="18" rx="7" fill="#ffb3c7"/><text class="value" x="915.2211058385851" y="255" font-size="16">478.6 us/op</text><text class="label" x="56" y="321">WriteThrough / 256B</text><rect x="285" y="290" width="65.46888493116171" height="18" rx="7" fill="#8ecae6"/><text class="value" x="360.4688849311617" y="305" font-size="16">50.5 us/op</text><rect x="285" y="314" width="581.3057443785827" height="18" rx="7" fill="#ffb3c7"/><text class="value" x="876.3057443785827" y="329" font-size="16">448.6 us/op</text><text class="label" x="56" y="395">NoCache / 4KB</text><rect x="285" y="364" width="625.3542686726144" height="18" rx="7" fill="#8ecae6"/><text class="value" x="920.3542686726144" y="379" font-size="16">482.6 us/op</text><rect x="285" y="388" width="686.0243396743616" height="18" rx="7" fill="#ffb3c7"/><text class="value" x="981.0243396743616" y="403" font-size="16">529.4 us/op</text><text class="label" x="56" y="469">ReadThrough / 4KB</text><rect x="285" y="438" width="124.22746510226176" height="18" rx="7" fill="#8ecae6"/><text class="value" x="419.22746510226176" y="453" font-size="16">95.9 us/op</text><rect x="285" y="462" width="645.2713551649643" height="18" rx="7" fill="#ffb3c7"/><text class="value" x="940.2713551649643" y="477" font-size="16">497.9 us/op</text><text class="label" x="56" y="543">WriteThrough / 4KB</text><rect x="285" y="512" width="72.40727266491416" height="18" rx="7" fill="#8ecae6"/><text class="value" x="367.40727266491416" y="527" font-size="16">55.9 us/op</text><rect x="285" y="536" width="637.4167477584882" height="18" rx="7" fill="#ffb3c7"/><text class="value" x="932.4167477584882" y="551" font-size="16">491.9 us/op</text><text class="note" x="56" y="596">Lower is better. Read-heavy workloads get most of the benefit.</text></svg>
