<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="810" viewBox="0 0 1500 810">

<defs>
  <filter id="shadow" x="-16%" y="-16%" width="132%" height="132%">
    <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#94a3b8" flood-opacity=".16"/>
  </filter>
  <style><![CDATA[
    svg{font-family:'Comic Mono','Comic Sans MS','Comic Neue','Chalkboard SE',cursive}
    .canvas{fill:#f6f9fc}
    .frame{fill:#ffffff;stroke:#cddceb;stroke-width:2.5;filter:url(#shadow)}
    .title{font-family:'Architects Daughter','Comic Mono','Comic Sans MS',cursive;font-size:40px;font-weight:400;fill:#25364f}
    .subtitle,.legend,.note,.axis{font-family:'Comic Mono','Comic Sans MS','Comic Neue','Chalkboard SE',cursive;fill:#526276;font-weight:400}
    .subtitle{font-size:18px}
    .legend{font-size:16px}
    .note{font-size:17px}
    .axis{font-size:15px}
    .label{font-family:'Comic Mono','Comic Sans MS','Comic Neue','Chalkboard SE',cursive;font-size:18px;fill:#25364f;font-weight:400}
    .value{font-family:'Comic Mono','Comic Sans MS','Comic Neue','Chalkboard SE',cursive;font-size:16px;fill:#25364f;font-weight:600}
    .bar{shape-rendering:geometricPrecision}
    .footerBox{fill:#f8fafc;stroke:#dbe6f1;stroke-width:2}
  ]]></style>
</defs>
<rect class="canvas" width="1500" height="810"/>
<rect class="frame" x="48" y="40" width="1404" height="730" rx="26"/>
<text class="title" x="82" y="102">Cache Strategy Latency</text>
<text class="subtitle" x="84" y="134">PostgreSQL + HikariCP smoke benchmark</text>
<rect x="910" y="154" width="16" height="16" rx="5" fill="#67b7dc"/>
<text class="legend" x="935" y="167">READ_HEAVY</text>
<rect x="1034" y="154" width="16" height="16" rx="5" fill="#f5a1bf"/>
<text class="legend" x="1059" y="167">WRITE_HEAVY</text>
<text class="axis" x="365" y="198">us/op</text>
<text class="label" x="84" y="244">NoCache / 256B</text>
<rect class="bar" x="365" y="214" width="810.0" height="20" rx="8" fill="#67b7dc"/>
<text class="value" x="1189.0" y="230">547.7 us/op</text>
<rect class="bar" x="365" y="242" width="747.3" height="20" rx="8" fill="#f5a1bf"/>
<text class="value" x="1126.3" y="258">505.3 us/op</text>
<text class="label" x="84" y="320">ReadThrough / 256B</text>
<rect class="bar" x="365" y="290" width="129.4" height="20" rx="8" fill="#67b7dc"/>
<text class="value" x="508.4" y="306">87.5 us/op</text>
<rect class="bar" x="365" y="318" width="707.8" height="20" rx="8" fill="#f5a1bf"/>
<text class="value" x="1086.8" y="334">478.6 us/op</text>
<text class="label" x="84" y="396">WriteThrough / 256B</text>
<rect class="bar" x="365" y="366" width="74.7" height="20" rx="8" fill="#67b7dc"/>
<text class="value" x="453.7" y="382">50.5 us/op</text>
<rect class="bar" x="365" y="394" width="663.4" height="20" rx="8" fill="#f5a1bf"/>
<text class="value" x="1042.4" y="410">448.6 us/op</text>
<text class="label" x="84" y="472">NoCache / 4KB</text>
<rect class="bar" x="365" y="442" width="713.7" height="20" rx="8" fill="#67b7dc"/>
<text class="value" x="1092.7" y="458">482.6 us/op</text>
<rect class="bar" x="365" y="470" width="782.9" height="20" rx="8" fill="#f5a1bf"/>
<text class="value" x="1161.9" y="486">529.4 us/op</text>
<text class="label" x="84" y="548">ReadThrough / 4KB</text>
<rect class="bar" x="365" y="518" width="141.8" height="20" rx="8" fill="#67b7dc"/>
<text class="value" x="520.8" y="534">95.9 us/op</text>
<rect class="bar" x="365" y="546" width="736.4" height="20" rx="8" fill="#f5a1bf"/>
<text class="value" x="1115.4" y="562">497.9 us/op</text>
<text class="label" x="84" y="624">WriteThrough / 4KB</text>
<rect class="bar" x="365" y="594" width="82.7" height="20" rx="8" fill="#67b7dc"/>
<text class="value" x="461.7" y="610">55.9 us/op</text>
<rect class="bar" x="365" y="622" width="727.5" height="20" rx="8" fill="#f5a1bf"/>
<text class="value" x="1106.5" y="638">491.9 us/op</text>
<rect class="footerBox" x="78" y="704" width="1344" height="42" rx="20"/>
<text class="note" x="98" y="731">Lower is better. Read-heavy workloads get most of the benefit.</text>
</svg>
