<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 900" width="1500" height="900" role="img" aria-label="Exposed Workshop Overview">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/></filter>
    <marker id="arrowBlue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8 Z" fill="#2563eb"/></marker>
    <marker id="arrowGreen" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8 Z" fill="#16a34a"/></marker>
    <marker id="arrowPurple" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8 Z" fill="#7c3aed"/></marker>
    <marker id="arrowOrange" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8 Z" fill="#ea580c"/></marker>
    <marker id="arrowGray" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8 Z" fill="#64748b"/></marker>
    <style>
      .canvas{fill:#f6f9fc}.frame{fill:#fff;stroke:#d7e2ec;stroke-width:1.5}.panel{fill:#f8fafc;stroke:#d7e2ec;stroke-width:1.2}
      .card,.db{stroke-width:1.7;filter:url(#shadow)}.title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:32px;fill:#1e293b}
      .subtitle,.detail,.tiny{font-family:"Comic Mono","Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;fill:#536476}.subtitle{font-size:13px}.detail{font-size:12px}.tiny{font-size:10px;fill:#64748b}
      .label{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:18px;fill:#1e293b}.smallLabel{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:15px;fill:#1e293b}
      .panelTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:12px;letter-spacing:.08em;fill:#94a3b8}
      .arrow{fill:none;stroke:#2563eb;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowBlue)}
      .mapLine{fill:none;stroke:#16a34a;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowGreen)}
      .context{fill:none;stroke:#7c3aed;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowPurple)}
      .storage{fill:none;stroke:#ea580c;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowOrange)}
      .softArrow{fill:none;stroke:#64748b;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:7 6;marker-end:url(#arrowGray)}
    </style>
  </defs>
  <rect width="1500" height="900" class="canvas"/>
  <rect x="20" y="20" width="1460" height="860" rx="16" class="frame"/>
  <text x="54" y="62" class="title">Exposed Workshop Overview</text>
  <text x="54" y="86" class="subtitle">Runnable modules progress from foundations to production integration</text>
  <rect x="60" y="135" width="330" height="610" rx="12" class="panel"/>
  <text x="225" y="127" class="panelTitle" text-anchor="middle">FOUNDATION</text><rect x="102" y="205" width="245" height="82" rx="9" fill="#dbeafe" stroke="#3b82f6" class="card"/>
  <text x="224.5" y="238" class="label" text-anchor="middle">00 Shared</text>
  <text x="224.5" y="254" class="detail" text-anchor="middle">common test resources</text>
<text x="224.5" y="269" class="detail" text-anchor="middle">1 submodule</text><rect x="102" y="345" width="245" height="82" rx="9" fill="#ede9fe" stroke="#7c3aed" class="card"/>
  <text x="224.5" y="378" class="label" text-anchor="middle">Multi-DB Tests</text>
  <text x="224.5" y="394" class="detail" text-anchor="middle">H2, PostgreSQL</text>
<text x="224.5" y="409" class="detail" text-anchor="middle">MySQL, MariaDB</text><path d="M135,523 C135,499 315,499 315,523 L315,587 C315,611 135,611 135,587 Z" fill="#ffedd5" stroke="#ea580c" class="db"/>
  <ellipse cx="225" cy="523" rx="90" ry="20" fill="#fff" fill-opacity="0.38" stroke="#ea580c" stroke-width="1.4"/>
  <ellipse cx="225" cy="587" rx="90" ry="20" fill="none" stroke="#ea580c" stroke-width="1.4"/>
  <text x="225" y="555" class="label" text-anchor="middle">Databases</text>
  <text x="225" y="575" class="detail" text-anchor="middle">JDBC-backed examples</text><rect x="455" y="120" width="430" height="640" rx="12" class="panel"/>
  <text x="670" y="112" class="panelTitle" text-anchor="middle">LEARNING MODULES</text><rect x="500" y="208" width="330" height="76" rx="9" fill="#dcfce7" stroke="#16a34a" class="card"/>
  <text x="665" y="238" class="label" text-anchor="middle">01-05 Core Path</text>
  <text x="665" y="264" class="detail" text-anchor="middle">Spring Boot, alternatives, DSL/DAO, DDL, DML</text><rect x="500" y="348" width="330" height="76" rx="9" fill="#fce7f3" stroke="#db2777" class="card"/>
  <text x="665" y="378" class="label" text-anchor="middle">06-08 Advanced Path</text>
  <text x="665" y="404" class="detail" text-anchor="middle">column features, JPA migration, async runtimes</text><rect x="500" y="508" width="330" height="76" rx="9" fill="#ccfbf1" stroke="#0f766e" class="card"/>
  <text x="665" y="538" class="label" text-anchor="middle">09-12 Production Path</text>
  <text x="665" y="564" class="detail" text-anchor="middle">Spring, tenant isolation, performance, Ktor/Sp…</text><rect x="950" y="135" width="430" height="610" rx="12" class="panel"/>
  <text x="1165" y="127" class="panelTitle" text-anchor="middle">OUTCOME</text><rect x="998" y="208" width="330" height="76" rx="9" fill="#fef3c7" stroke="#d97706" class="card"/>
  <text x="1163" y="238" class="label" text-anchor="middle">Runnable Examples</text>
  <text x="1163" y="264" class="detail" text-anchor="middle">each module has README and tests</text><rect x="998" y="348" width="330" height="76" rx="9" fill="#e2e8f0" stroke="#64748b" class="card"/>
  <text x="1163" y="378" class="label" text-anchor="middle">Integration Patterns</text>
  <text x="1163" y="404" class="detail" text-anchor="middle">transaction, cache, repository, outbox</text><rect x="998" y="508" width="330" height="76" rx="9" fill="#dbeafe" stroke="#3b82f6" class="card"/>
  <text x="1163" y="538" class="label" text-anchor="middle">Production Readiness</text>
  <text x="1163" y="564" class="detail" text-anchor="middle">auth/session, observability, tenant onboarding</text><path d="M347,246 L500,246" class="arrow"/><path d="M347,246 L422,246 L422,386 L500,386" class="arrow"/><path d="M315,555 L422,555 L422,246 L500,246" class="storage"/><path d="M665,284 L665,348" class="arrow"/><path d="M665,424 L665,508" class="arrow"/><path d="M830,246 L998,246" class="arrow"/><path d="M830,386 L998,386" class="arrow"/><path d="M830,546 L998,546" class="arrow"/><rect x="120" y="800" width="1260" height="54" rx="10" fill="#f8fafc" stroke="#d7e2ec"/>
  <text x="750" y="823" class="detail" text-anchor="middle">Root README overview: this diagram summarizes the repository purpose, not one example app. Module families map directly to the README module list.</text>
</svg>
