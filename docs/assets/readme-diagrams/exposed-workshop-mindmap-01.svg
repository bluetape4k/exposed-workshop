<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1460 860" width="1460" height="860" role="img" aria-label="Kotlin Exposed Feature Map">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/></filter>
    <marker id="arrowBlue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8 Z" fill="#2563eb"/></marker>
    <marker id="arrowGreen" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8 Z" fill="#16a34a"/></marker>
    <marker id="arrowPurple" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8 Z" fill="#7c3aed"/></marker>
    <marker id="arrowOrange" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8 Z" fill="#ea580c"/></marker>
    <marker id="arrowGray" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8 Z" fill="#64748b"/></marker>
    <style>
      .canvas{fill:#f6f9fc}.frame{fill:#fff;stroke:#d7e2ec;stroke-width:1.5}.panel{fill:#f8fafc;stroke:#d7e2ec;stroke-width:1.2}
      .card,.db{stroke-width:1.7;filter:url(#shadow)}.title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:32px;fill:#1e293b}
      .subtitle,.detail,.tiny{font-family:"Comic Mono","Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;fill:#536476}.subtitle{font-size:13px}.detail{font-size:12px}.tiny{font-size:10px;fill:#64748b}
      .label{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:18px;fill:#1e293b}.smallLabel{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:15px;fill:#1e293b}
      .panelTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:12px;letter-spacing:.08em;fill:#94a3b8}
      .arrow{fill:none;stroke:#2563eb;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowBlue)}
      .mapLine{fill:none;stroke:#16a34a;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowGreen)}
      .context{fill:none;stroke:#7c3aed;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowPurple)}
      .storage{fill:none;stroke:#ea580c;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowOrange)}
      .softArrow{fill:none;stroke:#64748b;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:7 6;marker-end:url(#arrowGray)}
    </style>
  </defs>
  <rect width="1460" height="860" class="canvas"/>
  <rect x="20" y="20" width="1420" height="820" rx="16" class="frame"/>
  <text x="54" y="62" class="title">Kotlin Exposed Feature Map</text>
  <text x="54" y="86" class="subtitle">README feature table plus current workshop modules</text>
  <rect x="555" y="178" width="350" height="584" rx="16" fill="#ccfbf1" stroke="#0f766e" class="card"/><rect x="90" y="160" width="350" height="92" rx="9" fill="#dbeafe" stroke="#3b82f6" class="card"/>
  <text x="265" y="198" class="label" text-anchor="middle">Type Safety</text>
  <text x="265" y="224" class="detail" text-anchor="middle">compile-time SQL shape checks</text><path d="M440,206 L555,206" class="mapLine"/><rect x="90" y="330" width="350" height="92" rx="9" fill="#ede9fe" stroke="#7c3aed" class="card"/>
  <text x="265" y="368" class="label" text-anchor="middle">DSL and DAO</text>
  <text x="265" y="394" class="detail" text-anchor="middle">SQL-style and ORM-style access</text><path d="M440,376 L555,376" class="mapLine"/><rect x="90" y="500" width="350" height="92" rx="9" fill="#dcfce7" stroke="#16a34a" class="card"/>
  <text x="265" y="538" class="label" text-anchor="middle">Coroutines</text>
  <text x="265" y="564" class="detail" text-anchor="middle">suspend transactions and async examples</text><path d="M440,546 L555,546" class="mapLine"/><rect x="90" y="670" width="350" height="92" rx="9" fill="#ffedd5" stroke="#ea580c" class="card"/>
  <text x="265" y="708" class="label" text-anchor="middle">Lightweight</text>
  <text x="265" y="734" class="detail" text-anchor="middle">small persistence layer compared with JPA</text><path d="M440,716 L555,716" class="mapLine"/><rect x="1020" y="160" width="350" height="92" rx="9" fill="#fce7f3" stroke="#db2777" class="card"/>
  <text x="1195" y="198" class="label" text-anchor="middle">Multi-DB Tests</text>
  <text x="1195" y="224" class="detail" text-anchor="middle">H2, PostgreSQL, MySQL, MariaDB</text><path d="M905,206 L1020,206" class="mapLine"/><rect x="1020" y="330" width="350" height="92" rx="9" fill="#ccfbf1" stroke="#0f766e" class="card"/>
  <text x="1195" y="368" class="label" text-anchor="middle">Spring/Ktor</text>
  <text x="1195" y="394" class="detail" text-anchor="middle">MVC, WebFlux, Ktor production examples</text><path d="M905,376 L1020,376" class="mapLine"/><rect x="1020" y="500" width="350" height="92" rx="9" fill="#fef3c7" stroke="#d97706" class="card"/>
  <text x="1195" y="538" class="label" text-anchor="middle">Advanced Types</text>
  <text x="1195" y="564" class="detail" text-anchor="middle">JSON, money, crypt, Tink, custom columns</text><path d="M905,546 L1020,546" class="mapLine"/><rect x="1020" y="670" width="350" height="92" rx="9" fill="#e2e8f0" stroke="#64748b" class="card"/>
  <text x="1195" y="708" class="label" text-anchor="middle">Production Patterns</text>
  <text x="1195" y="734" class="detail" text-anchor="middle">multi-tenancy, cache, outbox, readiness</text><path d="M905,716 L1020,716" class="mapLine"/><text x="730" y="434" class="title" text-anchor="middle">Exposed Workshop</text><text x="730" y="464" class="detail" text-anchor="middle">type-safe SQL learning</text><text x="730" y="482" class="detail" text-anchor="middle">runnable, test-backed modules</text><rect x="470" y="110" width="520" height="54" rx="10" fill="#f8fafc" stroke="#d7e2ec"/>
  <text x="730" y="133" class="detail" text-anchor="middle">This is a feature map, not an architecture pipeline. It mirrors the README</text>
<text x="730" y="149" class="detail" text-anchor="middle">key features and current module families.</text>
</svg>
