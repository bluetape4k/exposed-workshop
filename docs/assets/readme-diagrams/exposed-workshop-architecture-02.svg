  <text x="1228" y="192" class="label" text-anchor="middle">5</text>
  <text x="1332" y="200" class="label" text-anchor="middle">Advanced</text>
  <text x="1310" y="238" class="detail" text-anchor="middle">encryption, JSON, custom</text>
<text x="1310" y="254" class="detail" text-anchor="middle">types</text><rect x="1200" y="490" width="220" height="132" rx="10" fill="#ccfbf1" stroke="#0f766e" class="card"/>
  <circle cx="1228" cy="520" r="17" fill="#fff" stroke="#0f766e" stroke-width="1.4"/>
  <text x="1228" y="526" class="label" text-anchor="middle">6</text>
  <text x="1332" y="534" class="label" text-anchor="middle">JPA Migration</text>
  <text x="1310" y="572" class="detail" text-anchor="middle">convert JPA mappings to</text>
<text x="1310" y="588" class="detail" text-anchor="middle">Exposed</text><rect x="920" y="490" width="220" height="132" rx="10" fill="#fef3c7" stroke="#d97706" class="card"/>
  <circle cx="948" cy="520" r="17" fill="#fff" stroke="#d97706" stroke-width="1.4"/>
  <text x="948" y="526" class="label" text-anchor="middle">7</text>
  <text x="1052" y="534" class="label" text-anchor="middle">Async</text>
  <text x="1030" y="572" class="detail" text-anchor="middle">coroutines and virtual</text>
<text x="1030" y="588" class="detail" text-anchor="middle">threads</text><rect x="640" y="490" width="220" height="132" rx="10" fill="#e2e8f0" stroke="#64748b" class="card"/>
  <circle cx="668" cy="520" r="17" fill="#fff" stroke="#64748b" stroke-width="1.4"/>
  <text x="668" y="526" class="label" text-anchor="middle">8</text>
  <text x="772" y="534" class="label" text-anchor="middle">Spring Integration</text>
  <text x="750" y="572" class="detail" text-anchor="middle">transactions, cache,</text>
<text x="750" y="588" class="detail" text-anchor="middle">repository</text><rect x="360" y="490" width="220" height="132" rx="10" fill="#dbeafe" stroke="#3b82f6" class="card"/>
  <circle cx="388" cy="520" r="17" fill="#fff" stroke="#3b82f6" stroke-width="1.4"/>
  <text x="388" y="526" class="label" text-anchor="middle">9</text>
  <text x="492" y="534" class="label" text-anchor="middle">Multi-Tenancy</text>
  <text x="470" y="572" class="detail" text-anchor="middle">tenant-aware architecture</text><rect x="80" y="490" width="220" height="132" rx="10" fill="#ede9fe" stroke="#7c3aed" class="card"/>
  <circle cx="108" cy="520" r="17" fill="#fff" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="108" y="526" class="label" text-anchor="middle">10</text>
  <text x="212" y="534" class="label" text-anchor="middle">High Performance</text>
  <text x="190" y="572" class="detail" text-anchor="middle">cache and routing</text>
<text x="190" y="588" class="detail" text-anchor="middle">datasource</text><path d="M300,222 L360,222" class="arrow"/><path d="M580,222 L640,222" class="arrow"/><path d="M860,222 L920,222" class="arrow"/><path d="M1140,222 L1200,222" class="arrow"/><path d="M1310,288 L1310,490" class="arrow"/><path d="M1200,556 L1140,556" class="arrow"/><path d="M920,556 L860,556" class="arrow"/><path d="M640,556 L580,556" class="arrow"/><path d="M360,556 L300,556" class="arrow"/><rect x="180" y="735" width="1140" height="54" rx="10" fill="#f8fafc" stroke="#d7e2ec"/>
  <text x="750" y="758" class="detail" text-anchor="middle">The order follows the README Learning Guide exactly: basics first, then Exposed core APIs, advanced topics, integration, tenancy, and performance.</text>
