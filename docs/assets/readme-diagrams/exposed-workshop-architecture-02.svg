  <text x="212" y="200" class="label" text-anchor="middle">Basics</text>
  <text x="190" y="238" class="detail" text-anchor="middle">Spring Boot + Exposed</text>
<text x="190" y="254" class="detail" text-anchor="middle">integration</text><rect x="360" y="156" width="220" height="132" rx="10" fill="#ede9fe" stroke="#7c3aed" class="card"/>
