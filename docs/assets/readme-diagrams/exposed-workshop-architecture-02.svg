  <circle cx="948" cy="186" r="17" fill="#fff" stroke="#ea580c" stroke-width="1.4"/>
  <text x="948" y="192" class="label" text-anchor="middle">4</text>
  <text x="1052" y="200" class="label" text-anchor="middle">DDL / DML</text>
