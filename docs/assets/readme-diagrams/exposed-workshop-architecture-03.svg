<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 960" width="1500" height="960" role="img" aria-label="Module Structure">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/></filter>
    <marker id="arrowBlue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8 Z" fill="#2563eb"/></marker>
    <marker id="arrowGreen" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8 Z" fill="#16a34a"/></marker>
    <marker id="arrowPurple" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8 Z" fill="#7c3aed"/></marker>
    <marker id="arrowOrange" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8 Z" fill="#ea580c"/></marker>
    <marker id="arrowGray" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8 Z" fill="#64748b"/></marker>
    <style>
      .canvas{fill:#f6f9fc}.frame{fill:#fff;stroke:#d7e2ec;stroke-width:1.5}.panel{fill:#f8fafc;stroke:#d7e2ec;stroke-width:1.2}
      .card,.db{stroke-width:1.7;filter:url(#shadow)}.title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:32px;fill:#1e293b}
      .subtitle,.detail,.tiny{font-family:"Comic Mono","Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;fill:#536476}.subtitle{font-size:13px}.detail{font-size:12px}.tiny{font-size:10px;fill:#64748b}
      .label{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:18px;fill:#1e293b}.smallLabel{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:15px;fill:#1e293b}
      .panelTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:12px;letter-spacing:.08em;fill:#94a3b8}
      .arrow{fill:none;stroke:#2563eb;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowBlue)}
      .mapLine{fill:none;stroke:#16a34a;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowGreen)}
      .context{fill:none;stroke:#7c3aed;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowPurple)}
      .storage{fill:none;stroke:#ea580c;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowOrange)}
      .softArrow{fill:none;stroke:#64748b;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:7 6;marker-end:url(#arrowGray)}
    </style>
  </defs>
  <rect width="1500" height="960" class="canvas"/>
  <rect x="20" y="20" width="1460" height="920" rx="16" class="frame"/>
  <text x="54" y="62" class="title">Module Structure</text>
  <text x="54" y="86" class="subtitle">Actual top-level workshop groups and current submodule counts</text>
  <rect x="55" y="88" width="1390" height="118" rx="12" class="panel"/>
  <text x="750" y="80" class="panelTitle" text-anchor="middle">FOUNDATION</text><rect x="105" y="103" width="1290" height="88" rx="9" fill="#dbeafe" stroke="#3b82f6" class="card"/>
  <text x="123" y="129" class="tiny">00-shared</text>
  <text x="750" y="147" class="label" text-anchor="middle">Shared foundation</text>
  <text x="750" y="167" class="detail" text-anchor="middle">common test fixtures</text>
  <text x="1377" y="131" class="label" text-anchor="end">1</text><rect x="55" y="242" width="1390" height="162" rx="12" class="panel"/>
  <text x="750" y="234" class="panelTitle" text-anchor="middle">CORE LEARNING PATH</text><rect x="105" y="278" width="237" height="88" rx="9" fill="#ede9fe" stroke="#7c3aed" class="card"/>
  <text x="123" y="304" class="tiny">01-spring-boot</text>
  <text x="223.5" y="322" class="label" text-anchor="middle">Spring Boot basics</text>
  <text x="223.5" y="342" class="detail" text-anchor="middle">MVC + WebFlux entrypoints</text>
  <text x="324" y="306" class="label" text-anchor="end">2</text><rect x="368" y="278" width="237" height="88" rx="9" fill="#dcfce7" stroke="#16a34a" class="card"/>
  <text x="386" y="304" class="tiny">02-alternatives-to-jpa</text>
  <text x="486.5" y="322" class="label" text-anchor="middle">JPA alternatives</text>
  <text x="486.5" y="342" class="detail" text-anchor="middle">Hibernate Reactive, R2DBC, Vert.x</text>
  <text x="587" y="306" class="label" text-anchor="end">3</text><rect x="631" y="278" width="237" height="88" rx="9" fill="#ffedd5" stroke="#ea580c" class="card"/>
  <text x="649" y="304" class="tiny">03-exposed-basic</text>
  <text x="749.5" y="322" class="label" text-anchor="middle">Exposed basics</text>
  <text x="749.5" y="342" class="detail" text-anchor="middle">DAO and SQL DSL</text>
  <text x="850" y="306" class="label" text-anchor="end">2</text><rect x="894" y="278" width="237" height="88" rx="9" fill="#fce7f3" stroke="#db2777" class="card"/>
  <text x="912" y="304" class="tiny">04-exposed-ddl</text>
  <text x="1012.5" y="322" class="label" text-anchor="middle">DDL</text>
  <text x="1012.5" y="342" class="detail" text-anchor="middle">connection and schema definition</text>
  <text x="1113" y="306" class="label" text-anchor="end">2</text><rect x="1157" y="278" width="237" height="88" rx="9" fill="#ccfbf1" stroke="#0f766e" class="card"/>
  <text x="1175" y="304" class="tiny">05-exposed-dml</text>
  <text x="1275.5" y="322" class="label" text-anchor="middle">DML</text>
  <text x="1275.5" y="342" class="detail" text-anchor="middle">queries, functions, transactions…</text>
  <text x="1376" y="306" class="label" text-anchor="end">5</text><rect x="55" y="452" width="1390" height="162" rx="12" class="panel"/>
  <text x="750" y="444" class="panelTitle" text-anchor="middle">ADVANCED AND INTEGRATION</text><rect x="105" y="488" width="303" height="88" rx="9" fill="#fef3c7" stroke="#d97706" class="card"/>
  <text x="123" y="514" class="tiny">06-advanced</text>
  <text x="256.5" y="532" class="label" text-anchor="middle">Advanced columns</text>
  <text x="256.5" y="552" class="detail" text-anchor="middle">crypt, time, JSON, money, custom types</text>
  <text x="390" y="516" class="label" text-anchor="end">11</text><rect x="434" y="488" width="303" height="88" rx="9" fill="#e2e8f0" stroke="#64748b" class="card"/>
  <text x="452" y="514" class="tiny">07-jpa</text>
  <text x="585.5" y="532" class="label" text-anchor="middle">JPA migration</text>
  <text x="585.5" y="552" class="detail" text-anchor="middle">basic and advanced mapping</text>
  <text x="719" y="516" class="label" text-anchor="end">2</text><rect x="763" y="488" width="303" height="88" rx="9" fill="#dbeafe" stroke="#3b82f6" class="card"/>
  <text x="781" y="514" class="tiny">08-coroutines</text>
  <text x="914.5" y="532" class="label" text-anchor="middle">Async runtime</text>
  <text x="914.5" y="552" class="detail" text-anchor="middle">coroutines and virtual threads</text>
  <text x="1048" y="516" class="label" text-anchor="end">2</text><rect x="1092" y="488" width="303" height="88" rx="9" fill="#ede9fe" stroke="#7c3aed" class="card"/>
  <text x="1110" y="514" class="tiny">09-spring</text>
  <text x="1243.5" y="532" class="label" text-anchor="middle">Spring integration</text>
  <text x="1243.5" y="552" class="detail" text-anchor="middle">auto-config, transactions, cache, reposito…</text>
  <text x="1377" y="516" class="label" text-anchor="end">7</text><rect x="55" y="662" width="1390" height="162" rx="12" class="panel"/>
  <text x="750" y="654" class="panelTitle" text-anchor="middle">PRODUCTION PATTERNS</text><rect x="105" y="698" width="412" height="88" rx="9" fill="#dcfce7" stroke="#16a34a" class="card"/>
  <text x="123" y="724" class="tiny">10-multi-tenant</text>
  <text x="311" y="742" class="label" text-anchor="middle">Multi-tenancy</text>
  <text x="311" y="762" class="detail" text-anchor="middle">tenant context, schema, database routing</text>
  <text x="499" y="726" class="label" text-anchor="end">8</text><rect x="543" y="698" width="412" height="88" rx="9" fill="#ffedd5" stroke="#ea580c" class="card"/>
  <text x="561" y="724" class="tiny">11-high-performance</text>
  <text x="749" y="742" class="label" text-anchor="middle">High performance</text>
  <text x="749" y="762" class="detail" text-anchor="middle">cache and routing datasource patterns</text>
  <text x="937" y="726" class="label" text-anchor="end">7</text><rect x="981" y="698" width="412" height="88" rx="9" fill="#fce7f3" stroke="#db2777" class="card"/>
  <text x="999" y="724" class="tiny">12-production-integration</text>
  <text x="1187" y="742" class="label" text-anchor="middle">Production integration</text>
  <text x="1187" y="762" class="detail" text-anchor="middle">Ktor/Spring auth, outbox, observability</text>
  <text x="1375" y="726" class="label" text-anchor="end">10</text><rect x="190" y="860" width="1120" height="54" rx="10" fill="#f8fafc" stroke="#d7e2ec"/>
  <text x="750" y="883" class="detail" text-anchor="middle">Counts come from current source directories with build.gradle.kts; numbering follows the checked-out module folders.</text>
</svg>
